<script>
var TB_UNITS = [{"id": "u1", "name": "第一单元 从感知到物联", "intro": "<p>物联网的基本含义是\"万物互联\"，即在互联网的基础上，将人与人的互联延伸扩展到人与物、物与物的互联。物联网是继互联网之后又一种新型信息基础设施，是推动大数据和人工智能等信息科技发展不可或缺的重要组成部分。</p>\n<p>本单元是\"物联网实践与探索\"课程的起始单元，主要介绍物联网的基本知识及传感器等内容。本单元围绕\"从感知到物联\"的主题，从探讨\"寻找身边能联网的物品\"出发，通过感受身边的物联网、探索物联网与互联网的关系，引出物联网中重要的感知设备——传感器，开展传感器和物联网实践，引导学生认识物联网的普及对学习和生活的影响，进而理解物联网的价值。</p>", "objectives": "<p>1. 通过体验身边的物联网，知道物联网与互联网的异同，认识物联网的价值，感受物联网给人们的学习、生活和工作带来的改变。</p>\n<p>2. 通过了解物联网及其应用，知道物联网（特别是传感器系统）是连接现实世界与数字世界的纽带和媒介，了解物联网中采集数据的方法。</p>\n<p>3. 通过传感器的项目实践，了解传感器工作的基本原理，选择恰当的传感器等物联实验设备进行实践探索。</p>\n<p>4. 通过了解物联网的发展趋势，理解物联网在国际竞争中的重要性和发展自主可控技术的意义。</p>", "lessons": [{"id": "L01", "title": "第1课 开启物联网之门", "points": "<p>物联网（Internet of Things）即\"物品的互联网\"\"万物互联\"，其中的\"物\"泛指各种装有传感器并能与互联网相连的物品。物品接入互联网需满足三个基本条件：有名字（可被识别的唯一编码）、可感知（能提供物品本身的数据）、能传输（可与其他物品交换数据）。</p>\n<p>物联网的核心和基础仍是互联网：从计算机与计算机的连接，到人与人的互联，再到物与物的互联。传感器应用是物联网与互联网的最大区别所在。我国物联网起步很早（1999年中国科学院开展传感网研究，2009年\"感知中国\"，2023年蜂窝物联网终端用户达23.32亿户），正迈入\"万物智联\"新阶段。</p>", "reference": "<p>本课是模块起始课，建议用贴近学生生活的物联案例（物联家居、物联班牌、物联灯光系统等）作为教学引入，激发兴趣；注意与\"互联网应用与创新\"模块衔接，回顾IP相关知识，理解从IPv4转向IPv6的意义，并意识到互联网\"升级\"是物联网和数字化转型的基础。</p>\n<p>拓展思考：如果把洗衣机或冰箱联网，可以共享哪些数据、与谁共享？若这些数据人人可见可能带来哪些安全隐患？关于保护隐私安全、数据安全以及自主可控的教学应贯穿所有学习活动。</p>"}, {"id": "L02", "title": "第2课 传感之古今未来", "points": "<p>传感器是物联网的\"感觉器官\"，是一种能将感应到的数据按一定规律转换成可用信号的器件或装置，其实质是把不易测量的物理量转化为容易测量的量（如电学量），以满足传输、处理、存储、显示、记录和控制等要求。</p>\n<p>传感器由来已久：指南针、日晷、沙漏等古代发明可视作最古老的传感器；现代常见传感器有温度、土壤湿度、加速度、光敏、声音、图像、红外、气压等，同一种传感器可跨领域应用，实现同一功能也可使用不同传感器。发展趋势是体积更小、功能更强、价格更低、更节能，并向集成化、智能化、无线化发展，是物联网及大数据、人工智能的基础。</p>", "reference": "<p>本课可用人体感官类比传感器（光敏如眼、声音如耳、气味如鼻、温度如皮肤），降低神秘感；传感器定义不必死记，重在理解其\"输入—计算—输出\"实质。建议对照实物介绍种类，结合\"祝融号\"火星车等案例拓展，并适时引导学生思考高精尖传感器国产化的自主可控意义。</p>\n<p>拓展：手机之所以越来越智能，很重要的原因是集成了越来越多的传感器，手机集成了哪些传感器？分别有何作用？</p>"}, {"id": "L03", "title": "第3课 环境数据要感知", "points": "<p>利用传感器获取环境数据有三种方式：使用智能终端内置传感器（如声音、光敏、加速度等）、使用生活中现成的传感器类产品（噪声测试仪、气体测试仪、甲醛仪、亮度计、水质测试笔等）、使用物联实验设备（主控板+传感器+执行器）。</p>\n<p>本课以检测环境声音（分贝）为例，体验传感器采集环境数据的过程，掌握利用传感器获取数据的方法，为今后使用传感器作准备。</p>", "reference": "<p>本课重点在于让学生通过体验传感器采集数据的过程、感受实际应用，编程不是重点（可给伪代码或半成品加注释代码）。可在智能终端、传感器产品、物联实验设备三种方式中任选开展；无硬件时可借助虚拟仿真工具或视频展示。噪声知识可与物理学科开展跨学科教学。</p>\n<p>拓展：使用物联实验设备获取当前环境的光照强度。</p>"}, {"id": "L04", "title": "第4课 物物相连有价值", "points": "<p>物联网中传感器如同遍布世界的\"神经触角\"，每时每刻感知检测、源源不断地为互联网输送数据。物联网的价值主要体现在三方面：提供丰富实时的数据、实现远程的反馈与控制、传感器协同带来新智能。</p>\n<p>数据经分析处理与可视化呈现，可为决策提供参考（如中央气象台实况图）。多个传感器协同（本地不同种类协同，或经网络汇聚形成大数据）往往产生\"1+1>2\"的效果，如多水质传感器协同检测河道水质、地图导航结合交通数据预警。</p>", "reference": "<p>教学可将互联网类比为\"大脑\"、传感器类比为\"神经触角\"，帮助学生理解物联网全面感知的特征。可引导学生通过网络查找实时数据，思考数据由哪些传感器获取，体会物联网是大数据的基石。注意渗透网络安全与隐私保护意识——远程控制和丰富数据带来便利，也伴随网络安全风险。</p>\n<p>拓展：使用物联实验设备模拟物联楼梯灯，要求用两种不同类型传感器体现协同；思考将不同楼层楼梯灯接入网络能产生什么价值。</p>"}, {"id": "L05", "title": "第5课 物联功能趣体验", "points": "<p>本课通过三个递进的学习活动体验物联功能：远程查看物联数据（访问公共监测网站查看传感器采集的数据）、远程控制物联插座（通过智能终端控制电器）、远程监测物联花卉（综合查看数据与远程控制）。</p>\n<p>物品、传感器、网络与数据处理是物联系统的关键要素；传感器可通过直接连接互联网，也可通过网关设备连接互联网。本课初步了解物联系统中的反馈和控制，为进一步理解万物互联基本原理作铺垫。</p>", "reference": "<p>若无供学生体验的物联产品，可通过搜索查看物联数据、网络商城查询功能、画示意图等方式开展教学。物联插座网络配置较复杂，要提醒学生看说明书；传感器经网关连接互联网，教师不必过度强调网关概念，只需让学生知道传感器能通过网关连接即可。重点在于体验远程控制、体会反馈与控制过程。</p>\n<p>拓展：通过实践体验物联产品，总结物联网的功能，撰写一份包含实验设备、步骤和结果的实验报告。</p>"}]}, {"id": "u2", "name": "第二单元 万物互联有协议", "intro": "<p>在互联网应用与创新模块中，学生已经学习了互联网的一些协议。而在物联网中，物与物之间的\"交流\"也需要遵循一定的通信规则，这种通信规则就是物联协议。如果说传感器是物联网的\"感官\"，那么物联协议就是将遍布各处的传感器连接起来的\"神经系统\"，为各类物联设备之间进行数据交换和资源共享提供保障。</p>\n<p>物联协议比较多，还处于规范和发展中，本单元主要介绍几种常见的物联协议。本单元围绕\"万物互联有协议\"主题，从探讨物联数据的传输方式开始，通过介绍物联网中的通信协议，开展RFID、蓝牙、HTTP和MQTT等实践探索，让学生真正体会物联协议的功能和特征，理解协议的重要作用。</p>", "objectives": "<p>1. 通过分析生活中的物联场景应用，了解物联网中的数据传输协议，感受物联网给人们的学习、生活和工作带来的改变。</p>\n<p>2. 通过利用射频识别、蓝牙等物联协议开展实践探索，了解近距离通信协议的特点，主动利用数字设备开展创新实践活动。</p>\n<p>3. 通过获取网络数据的实践探索，进一步认识HTTP及其通信机制；通过消息订阅实践探索，认识MQTT及其通信机制，体验其中数据处理和应用的方法与过程。</p>\n<p>4. 通过了解物联协议的应用和发展，理解标准化的重要作用，强化自主可控意识。</p>", "lessons": [{"id": "L06", "title": "第6课 数据传输方式多", "points": "<p>物联系统数据传输方式多样：按传输介质分为有线传输（电缆、网线、光纤，更快更稳定）与无线传输（Wi-Fi、蓝牙、ZigBee、LoRa等，灵活方便）；按传输距离分为近距离通信（RFID、NFC、蓝牙等）与远距离通信（3G/4G/5G、NB-IoT等）。</p>\n<p>多样的传输方式背后是多样的物联协议，设备依特性与场景选择不同协议。如共享单车物联系统中，车辆通过NB-IoT连接、手机通过移动通信网络连接、服务器与设备间用MQTT/HTTP交互，并可能用蓝牙辅助开锁。</p>", "reference": "<p>可回顾\"互联网应用与创新\"中学过的TCP/IP、HTTP，引出物与物通信也需协议，引导学生从感知层走向网络层探索。以共享单车数据流转（定位上报、扫码开锁）为例剖析；近距离/远距离界限不强求统一。可引导从供电节能、速率、安全等角度选择通信协议，并思考为何还要发展低功耗远程技术。</p>\n<p>拓展：人类已建立高速率网络连接，为什么还要发展低功耗远程数据传输技术？电子围栏如何判断共享单车是否停在规定的还车区域内？</p>"}, {"id": "L07", "title": "第7课 电子标签我揭秘", "points": "<p>RFID（射频识别）是一种物品标识和自动识别的无线通信技术，由电子标签和读卡器组成，无须与被识别物品直接接触即可读写数据。电子标签按发射射频信号方式分被动标签（无内置电池、工作距离短）和主动标签（有电池、可主动发射、距离远）。</p>\n<p>NFC（近场通信）是由RFID演变而来的近距离高频无线通信技术，允许数字设备间非接触式点对点数据传输；除通信协议外还规定数据交换格式，可实现双向通信并更改内容（如手机NFC）。我国自主创新的NFC实体鉴别技术已成为ISO/IEC国际标准。</p>", "reference": "<p>重点让学生了解RFID是无线通信技术、掌握基本原理即可，不必深究技术细节；可用火车站刷身份证进站、ETC、门禁等案例讲解工作流程。编程可让学生填空关键代码或补注释。NFC可结合手机功能说明。教学中可引导学生发现身边使用RFID的场景。</p>\n<p>拓展：用电子标签标识每件校服，读卡器读取并显示学生姓名（用字典存储电子标签编号与学生姓名的对应关系）。</p>"}, {"id": "L08", "title": "第8课 巧用蓝牙做工具", "points": "<p>蓝牙是常见的近距离无线通信技术，设备搭载蓝牙芯片发送信号寻找并配对另一设备后互相通信，支持双向通信。低功耗蓝牙（BLE）大幅提升续航，蓝牙5.0传输距离增至300m，是物联网时代重要的无线通信技术。</p>\n<p>RFID、NFC和蓝牙等近距离通信协议的共同特点：低功耗（受电池供电限制）、低延时（瞬时完成指令传输）、数据格式简单（设备间直连无需多层封装转发）。常见近距离协议还有ZigBee等。</p>", "reference": "<p>可让学生观看视频了解蓝牙起源与发展，认识协议不断升级改进。学习活动1（蓝牙传文件）培养利用数字化工具解决问题的意识；学习活动2（制作蓝牙翻页笔）综合性强，可演示硬件搭建、讲解代码、调参数发展计算思维。出现故障时引导从程序、接线逐步排查。</p>\n<p>拓展：传统家用遥控器多用红外线通信，与现在的蓝牙遥控器相比有哪些优缺点？</p>"}, {"id": "L09", "title": "第9课 互联协议仍沿用", "points": "<p>物联系统数据不仅来自传感器，也来自互联网；外部设备或程序通常通过API（应用程序接口，可理解为软件间的\"桥梁\"）访问服务器数据资源。设备一般用HTTP向服务器发起请求获取数据，步骤包括获取API网址、发起网络请求、解析返回结果（XML或JSON格式字符串）。</p>\n<p>HTTP主要面向客户端/服务器模式，设备需主动向服务器请求数据，存在资源消耗大、对服务器与网络负担重等局限，并不完全适合物联网实时、低功耗场景，引出了对更合适物联协议的探索。</p>", "reference": "<p>解析JSON返回数据对学生较难，应先观察字符串格式再介绍ujson.loads方法与字典类型；不必区分GET/POST，理解请求—响应即可。可准备免费天气API让学生获取并展示。引导学生从低功耗、低带宽、低延时、兼容性、可靠性理解物联通信协议的特定要求。</p>\n<p>拓展：搜索免费API并整理成表，通过urequests库发起HTTP请求访问，并将返回数据显示在主控板上。</p>"}, {"id": "L10", "title": "第10课 物物互通有新径", "points": "<p>MQTT（消息队列遥测传输）是当前流行的物联网协议，具有开放、轻量、可靠、易实现的特点，采用发布/订阅通信机制，包含发布者、服务器（代理）、订阅者三个角色：发布者向主题发布消息，服务器将消息传递给订阅该主题的订阅者。</p>\n<p>实践中可选择在线MQTT服务器（使用方便、需注册、功能丰富）或搭建本地MQTT服务器（免注册、可直观感受数据交换过程、操作稍繁琐）。</p>", "reference": "<p>可用\"订报纸\"类比（服务器=邮局，订阅者=订报客户，发布者=出版机构）帮助学生理解三者关系与工作流程。引导学生对比HTTP与MQTT异同，思考不同场景的协议选择。搭建本地服务器可用开源软件SIoT（运行后浏览器访问本机IP:8080）。设置移动热点时渗透信息安全（使用复杂密码）。</p>\n<p>拓展：尝试用软件搭建本地MQTT服务器，实现订阅功能。</p>"}]}, {"id": "u3", "name": "第三单元 简单物联功能实践", "intro": "<p>物联系统包括感知层、网络层和应用层，本单元聚焦应用层的功能实现，遵循物联网\"大场景、小应用\"的特点，以实践探究的方式，引导学生利用所学知识解决真实的问题。</p>\n<p>本单元围绕物联门锁的功能，通过认识身边的物联系统，了解物联系统中的反馈与控制，利用物联实验设备模拟实现物联门锁功能，在实验平台读取、发送、接收、汇集和使用数据，探索物联系统的功能，体验物联网、大数据及人工智能的关系，进一步理解万物互联为人们生活带来的便捷和影响。</p>", "objectives": "<p>1. 通过对身边真实物联系统的分析，认识物联系统的三层结构，了解物联系统的工作过程。</p>\n<p>2. 通过对物联网应用的分析，了解以数据为核心分解物联功能的方法。</p>\n<p>3. 通过使用物联实验设备搭建物联系统原型，了解物联系统中反馈与控制的过程，体验物联网、大数据及人工智能的关系。</p>\n<p>4. 通过简单物联功能的实现，了解从物联网服务平台读取、发送、接收数据的方法。</p>", "lessons": [{"id": "L11", "title": "第11课 物联功能细分解", "points": "<p>生活中的物联系统大多由终端设备、传感器、网络和软件组成，相互连接交互，实现数据采集、传输、处理和控制等功能，可分为感知层、网络层、应用层三层结构，分别实现数据采集、传输、处理与控制。</p>\n<p>以物联门锁系统为例，可按\"以数据为核心\"分解为刷卡开锁、门铃通知、远程控制、刷脸开锁等功能，每项功能都可对应到三层结构（感知层采集数据、网络层传输、应用层反馈控制）进行分析。</p>", "reference": "<p>本课重在分析身边物联系统、引出三层结构并分解门锁功能，教学中不必纠结细节。应鼓励学生发挥想象力设计指纹开锁、密码开锁、语音开锁等功能（提出思路即可，不要求实现），并引导学生围绕采集数据、传输数据和反馈控制设计更多功能。</p>\n<p>拓展：物联网技术为门锁功能拓展提供更多可能，除了本课分析的功能，还可以实现什么功能？</p>"}, {"id": "L12", "title": "第12课 刷卡开锁易实现", "points": "<p>RFID门禁系统工作过程可描述为：外部数据获取（输入）、数据内部处理（计算）、结果呈现（输出）。用户刷卡，读卡器获取卡中数据传给计算模块，按规则比对判断权限，若通过则发送开锁指令，执行器收到指令后开锁。</p>\n<p>一个完整的刷卡开锁功能可划分为：输入模块（电子标签、RFID读卡器读取编号）、计算模块（主控板用列表存储编号并判断是否在列表中）、输出模块（舵机模拟打开门锁）。</p>", "reference": "<p>教学可通过拆解实物、视频或图片展示RFID门锁结构，引导学生回顾第7课RFID基本原理与工作过程，分小组讨论工作过程。门禁卡内电子标签主要用于存储用户身份数据，利用RFID可实现刷卡开锁。本课是后续舵机模拟开锁实践的铺垫。</p>\n<p>拓展：将门禁卡与业主身份数据关联，利用标签编号唯一性标识用户身份，尝试实现用户刷门禁卡时在显示屏显示用户姓名。</p>"}, {"id": "L13", "title": "第13课 门铃通知即时到", "points": "<p>物联系统中的\"反馈\"是将系统状态或结果信息回传给用户。门铃通知是典型反馈功能：门铃被按下（采集状态数据），经网络传输后向用户发送通知，让用户及时了解情况。</p>\n<p>通知可通过显示屏显示信息、蜂鸣器提醒、消息推送等方式实现，涉及执行器的选择（如蜂鸣器用于提醒用户）。</p>", "reference": "<p>可展示生活中真实应用情景，引导学生认识什么是物联系统中的反馈。功能测试需要门铃端配合，可引导小组之间合作；本活动主要涉及执行器选择，可用显示屏显示信息，也可用蜂鸣器提醒，教师可补充讲授蜂鸣器使用方法。综合考虑学情、硬件及账号等问题选择方案。</p>\n<p>拓展：你认为还可以采用哪些方式实现对用户的通知？分别使用哪些执行器？尝试修改程序实现。</p>"}, {"id": "L14", "title": "第14课 远程控制更便捷", "points": "<p>物联系统中的\"控制\"是根据指令对外部环境施加作用；反馈与控制相辅相成，控制常基于反馈得到的数据。以火车站验票系统为例可引入物联系统中的控制。</p>\n<p>远程控制开锁功能通过用户端（输入模块）发送开锁指令、门锁端（输出模块，舵机）执行开锁实现，体现了物联系统远程控制的基本过程。</p>", "reference": "<p>教学中可设置问题引导；把输入模块看作用户端、输出模块看作门锁端。可能出现舵机没有反应的情况，引导从程序、接线逐步排查故障。综合考虑学情、硬件及账号等问题选择实现方式。</p>\n<p>拓展：两个小组合作，尝试利用本小组的主控板控制对方的舵机；思考远程控制开锁功能存在哪些安全隐患？</p>"}, {"id": "L15", "title": "第15课 面容钥匙显智能", "points": "<p>人脸识别（刷脸开锁）是把\"人脸\"当作钥匙，机器识别人脸的步骤包括人脸定位、特征分析、匹配人脸等；大部分学生对其认知停留在使用层面，缺乏对实现过程和原理的理解。</p>\n<p>刷脸开锁由三模块组成：输入模块（摄像头采集人脸数据、人脸识别后发布消息至MQTT服务器相应主题）、计算模块（计算机搭建MQTT服务器、设置主题实现发布与订阅）、输出模块（主控板、舵机订阅主题、收到消息后控制舵机转动）。</p>", "reference": "<p>建议从同学画像或游戏猜人活动引导发现人脸特征，思考机器描述并识别人脸的方式；可用人工智能摄像头或普通摄像头+网页版人脸识别平台体验。熟悉摄像头、主控板、计算机的连接方式与MQTT设置（参考第10课）。要高度警惕收集生物特征数据的场景，不随意提供面部、指纹等数据。</p>\n<p>拓展：利用所学知识设计一个物联考勤系统，识别人脸并通过MQTT服务器将学号实时推送到教师端设备。</p>"}]}, {"id": "u4", "name": "第四单元 简易物联系统实践", "intro": "<p>在上一单元学习的简单物联功能实践的基础上，本单元的内容比较综合，让学生从物联系统的整体出发进行分析和规划，最终学会设计较为完整的简易物联系统。物联系统的工作过程本质上是通过感知外部环境，并通过数据传输、存储、处理，最终反馈到外部环境的过程。</p>\n<p>本单元围绕简易物联花盆系统，通过划分物联系统的模块，根据需求确定感知、传输、反馈和控制等功能，最后完成简易物联系统的搭建。与前面三个单元相比，本单元的实践难度略大，在具体实施过程中，可以先实现每个模块的功能，再将所有模块集成在一起。教学中可根据本地实际情况或者学生兴趣，选择其他的实践案例。</p>", "objectives": "<p>1. 通过分析简易物联系统，能够确定简易物联系统的功能需求，划分简易物联系统的功能模块。</p>\n<p>2. 通过设计简易物联系统，进一步认识算法在生活中的应用。</p>\n<p>3. 通过搭建简易物联系统，进一步探索物联系统中数据采集、处理、反馈和控制等基本功能。</p>\n<p>4. 通过对物联数据进行简单分析处理，学会常用的数据可视化表达的方法。</p>", "lessons": [{"id": "L16", "title": "第16课 模块功能先划分", "points": "<p>简易物联系统的一般工作环节为：采集数据→传输与存储数据→分析处理数据→反馈与控制，对应环境感知、网络通信、服务平台、执行等功能模块。</p>\n<p>物联项目设计应包含：物联系统环节、各环节功能需求、功能模块划分（如物联花盆系统的感知模块、网络通信模块、服务平台模块、执行模块）。主控板既是感知模块、执行模块的一部分，也因提供联网功能而属于网络通信模块。</p>", "reference": "<p>本课从工作环节、功能需求、模块划分三方面介绍简易物联系统，是后续搭建的基础。可结合高铁烟雾报警系统（传感器采集、网络传输、服务器分析、制动反馈）、智能公交系统（北斗定位、NB-IoT通信、数据中心服务平台、终端查询）等案例，分析各环节硬件与功能模块。</p>\n<p>拓展：结合物联系统工作环节，说说高铁烟雾报警系统每个环节可能使用哪些硬件？尝试分析物联公交系统的功能模块。</p>"}, {"id": "L17", "title": "第17课 物联数据需采集", "points": "<p>数据采集有两种途径：利用传感器采集环境数据（如光敏、土壤湿度、温湿度传感器），以及通过互联网/API获取网络数据（如天气预报）。在物联花盆项目中，光敏与土壤湿度传感器输出模拟信号，温湿度传感器输出数字信号，主流主控板引脚一般兼具读取能力。</p>\n<p>采集的数据需传输与存储（可上传物联网服务平台或本地存储），以便后续分析处理与呈现。</p>", "reference": "<p>项目可对学生进行分组，每组负责校园一个区域。教师需提前注册申请免费天气预报API密钥、查询城市编号并调试，不同API返回数据格式不同。建议事先准备好含网络配置、服务器连接的半成品代码，引导学生复习前面学过的知识。</p>\n<p>拓展：结合身边的物联网案例，说一说物联网的数据来源有哪些？从便捷性、覆盖范围、数据安全性等角度比较本地MQTT服务器和在线MQTT服务器的优缺点。</p>"}, {"id": "L18", "title": "第18课 数据分析与处理", "points": "<p>数据处理工具从算盘、滑尺发展到电子计算机（\"存储程序、程序执行\"模式，展现通用性与自动化），再到借助编程工具处理数据。通过编程能高效处理大量数据，并实现更为直观的数据可视化。</p>\n<p>物联网服务平台通常提供两种数据获取方式：以数据文件形式下载（用电子表格软件处理）和通过API调用（自动从平台获取数据）。</p>", "reference": "<p>引导学生认识数据处理工具的演进与编程优势，对比电子表格与编程处理，体会编程处理大量数据的高效与直观可视化。在现代科学研究中，数据分析不可或缺（如海王星由数据预测而非观测发现），可提高科研效率与质量。</p>\n<p>拓展：尝试使用电子表格软件对数据分析处理，说说哪种处理方式更好；查阅海王星被发现的资料，谈谈数据分析处理在科学研究中的重要作用。</p>"}, {"id": "L19", "title": "第19课 数据呈现可视化", "points": "<p>数据可视化的作用：清晰展示数据变化趋势（中断或突变即可断定异常）、提供全局视图把握整体规律、发现趋势变化助力预测未来、方便交流共享并支持分析决策。</p>\n<p>常见数据可视化方式可借助工具（如matplotlib）实现；真实数据与场景（如航班准点记录、国家统计数据）能增强学生对可视化在决策与预测中应用的理解。</p>", "reference": "<p>教学可先让学生分组讨论生活中的可视化应用再总结归纳，并尽可能多地举例说明其在各领域的作用。可引导学生访问国家数据网站查看历年统计数据，尝试预测变化趋势。教师可利用真实数据和场景增强学习体验。</p>\n<p>拓展：土壤湿度对植物生长至关重要，利用数据可视化方式探究土壤湿度的变化情况，为反馈与控制提供参考（涉及matplotlib绘图与传感器定时采集）。</p>"}, {"id": "L20", "title": "第20课 反馈控制有算法", "points": "<p>执行器模块是输出设备，让物联系统对环境形成反馈（点亮指示灯、蜂鸣器发声、控制电机舵机均属反馈）。数据、算法、反馈、执行器的关系：数据是设计算法的依据，算法根据规则产生结果，反馈是系统作用于外部环境的过程，执行器是反馈的载体。</p>\n<p>根据数据分析设计算法实现反馈与控制，例如依据土壤湿度上下限值（hum_max、hum_min）决定灌溉条件，形成数据决策程序。</p>", "reference": "<p>帮助学生正确梳理数据、算法、反馈和执行器之间的关系。可先通过取平均值确定土壤在干燥、适中、湿润时的传感器数据，再整理条件（大于上限、介于上下限、小于下限）、设计算法形成数据决策部分程序。设计系统还要考虑扩展需求（预留引脚、合理程序框架）。</p>\n<p>拓展：选择一两个可实现的创新功能对物联系统改造升级；分析某物联门锁系统的数据采集、传输与反馈控制及所用硬件。</p>"}]}, {"id": "u5", "name": "第五单元 物联网应用探索", "intro": "<p>应用是物联网发展的根本目的，创新是推动物联网发展的动力。物联网应用处于快速发展期，具有多样化、规模化、行业化等特点，在工业、农业、交通、教育、电力、医疗、物流、军事、文物保护等领域有着广泛的应用，推动经济社会全方位发展。</p>\n<p>本单元在第四单元学习基础上，结合简易物联系统设计与搭建，在文物保护、健康生活、医疗设施、农业生产、学习探究等方面展开实践探索，通过博物馆环境监测系统、身高记录仪、输液监测系统、奶牛产奶监测系统、探究热水降温规律等物联网应用实践，引导学生进一步探索物联网中数据采集、处理、反馈控制等基本功能，体验物联网、大数据及人工智能的关系。本单元共五个项目，教师可根据本地实际教学情况选择。</p>", "objectives": "<p>1. 通过了解物联网在各领域的应用，进一步认识物联网给人们生活、学习和工作方式带来的改变，增强主动学习物联网知识的意识。</p>\n<p>2. 通过真实情境中具体案例的实践探索，掌握获取和处理数据的方法，提高发现问题、分析问题、解决问题的能力，发展计算思维。</p>\n<p>3. 通过搭建物联原型系统，学会选择数字设备和数字平台，主动利用数字设备开展实践创新探究。</p>", "lessons": [{"id": "L21", "title": "第21课 文物保护新手段", "points": "<p>物联网在文物保护中应用广泛，如博物馆环境监测系统可实时监测展柜温湿度等环境数据，并在异常时反馈控制（报警、开启空调等）。</p>\n<p>通过博物馆环境监测系统的实践探索，掌握利用物联网解决问题的方法，并可迁移应用于解决其他问题。</p>", "reference": "<p>教师可展示文物受损图片，引导学生探究展柜温湿度阈值，设问采集的数据送到哪里、如何存储（组织学生填写topic等）。系统功能可不断迭代升级，可增加传感器获取更多数据，或增加异常提醒、蜂鸣器/LED报警等反馈控制功能。可实地考察博物馆、校史馆提出方案。</p>\n<p>拓展：博物馆中除恒温恒湿外还有哪些环境因素值得关注？为环境监测系统增加一个新功能；实地考察本地博物馆并提出升级或设计方案。</p>"}, {"id": "L22", "title": "第22课 健康生活新设备", "points": "<p>物联网在生活中应用普遍，\"智能\"已融入生活，为健康生活带来新可能，如物联手环监测心率与运动、物联体重秤分析体脂率、物联跑步机收集运动数据并提供建议。</p>\n<p>通过身高记录仪系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。</p>", "reference": "<p>可设问：如何设计一个身高记录仪系统？采集的学生身高数据要送到哪里？组织学生填写topic等。学生体质健康监测指标还有体重、视力等，可拓展。教师可根据本地实际教学情况选择实践内容。</p>\n<p>拓展：为身高记录仪系统增加一个新功能；选择一个生活中还没有联网的物品，对它升级改造，提出可实现的物联功能与方案。</p>"}, {"id": "L23", "title": "第23课 医疗设施新功能", "points": "<p>物联网在医疗领域应用日益广泛，为医疗设施注入新功能，如物联床垫监测患者生命体征、物联药柜智能管理药品、物联手术室管理器械、物联纱布基于RFID识别计数等，极大提高医疗服务效率与质量。</p>\n<p>通过病患输液监测系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。</p>", "reference": "<p>可参考表23.3引导学生开展实践、多记录数据；组织学生填写topic；因器材限制，教学重在引导学生判断当前数值。可实地考察本地医院、卫生服务站，观察是否利用物联网技术并提出升级或设计方案。</p>\n<p>拓展：为病患输液监测系统增加一个新功能（如更便捷高效的医疗服务）；实地考察医院并提出升级或设计方案。</p>"}, {"id": "L24", "title": "第24课 农业生产新模式", "points": "<p>物联网推动农业向智能化、精准化变革：物联灌溉按土壤湿度与天气自动调节水量；物联养殖通过佩戴传感器监测动物体温、位置与行为；还可借助条形码、二维码监管农产品市场流动。</p>\n<p>通过奶牛产奶监测系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。</p>", "reference": "<p>可在桶中倒入水模拟产奶量；结合软硬件条件拓展实现语音播报等；教师可带学生实地考察校园劳动实践基地。引导学生基于现有功能优化（如统计产奶量平均值、异常提醒），重点关注要解决什么问题、采集哪些数据及算法实现，硬件受限时绘制流程图即可。</p>\n<p>拓展：为奶牛产奶监测系统增加一个新功能；实地考察本地农场、牧场，提出升级或设计方案。</p>"}, {"id": "L25", "title": "第25课 学习探究新工具", "points": "<p>物联网可作为学习探究的新工具，如在科学实验中实时采集数据（如探究热水降温规律），支持跨学科探究，体现\"大场景、小应用\"的特点。</p>\n<p>通过探究热水降温规律系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。</p>", "reference": "<p>可让学生思考如何实时采集水杯中的水温数据、数据传到哪里；准备物联网在学习领域应用的视频。倡导将所学知识运用于实际生活（如为亲友推荐适宜保温杯），并可结合物理、化学、生物学等学科实验开展跨学科科学实验项目。</p>\n<p>拓展：选择几种保温杯，找出保温效果最好的；探讨物联网技术还可以应用在哪些科学实验中，提出实践思路。</p>"}]}, {"id": "u6", "name": "第六单元 物联网安全", "intro": "<p>随着物联网应用的不断发展，物联设备数量剧增，它们能够持续工作并把自己的\"所见、所闻、所感\"告诉其他设备或者人。物联网给人们带来便利的同时，也带来了新的安全威胁。在物联网应用中，每一个传感器和网络都有潜在的风险，都可能受到攻击。</p>\n<p>本单元是本模块最后一个单元，旨在让学生了解物联网中虚拟身份的重要性，了解物联网安全的现状，进一步增强个人信息保护意识，深刻认识自主可控对国家安全的重要意义。本单元围绕物联网安全，从探讨物联网虚拟身份出发，用物联网安全事件强化安全意识，提出安全防范策略，阐述自主可控的内涵和意义，并以第三单元物联门锁系统案例为例，开展物联系统安全升级实践体验。</p>", "objectives": "<p>1. 通过类比生活中身份与互联网中虚拟身份的作用，了解虚拟身份的内涵，体会物联设备对塑造虚拟身份的价值，有意识地保护个人隐私，进行安全防护。</p>\n<p>2. 通过分析物联网中常见的安全事件及物联系统三层结构中存在的安全风险，了解物联网安全防范的措施，初步掌握常见的数据安全防范策略，强化数据保护意识。</p>\n<p>3. 通过了解芯片、软件、协议标准与知识产权等方面外部依赖可能造成的风险，认识自主可控生态体系对我国国家安全的重要作用。</p>\n<p>4. 通过对物联系统的安全升级改造实践，进一步加深对物联网安全的理解，提升探索与应用实践的能力。</p>", "lessons": [{"id": "L26", "title": "第26课 数字世界有身份", "points": "<p>物联网中存在用户虚拟身份与设备虚拟身份；虚拟身份在网络空间唯一标识用户或设备（如监控室通过标识区分每个烟雾传感器或摄像头），对物联网传输、安全等具有重要作用。</p>\n<p>结合虚拟身份在物联系统中的具体应用，感受其在物联网传输与安全方面的重要作用。</p>", "reference": "<p>教学应以案例为主，强调保护虚拟身份的重要性，着重培养学生安全意识；可结合前面体验过的物联项目（如物联门锁）引导探究，也可在消防/安全监控室观察设备工作过程，体会虚拟身份的作用。本活动不要求实现相关功能。</p>\n<p>拓展：对刷脸开锁功能升级，结合开锁时间数据预测用户在工作日的回家时间（涉及MQTT记录时间、散点图可视化、以及开锁时间数据泄露的隐私风险）。</p>"}, {"id": "L27", "title": "第27课 安全事件与风险", "points": "<p>物联网面临常见的安全事件与多种安全挑战；物联系统的感知层、网络层、应用层均存在安全风险（如刷脸开锁可能被人脸照片、美颜或编辑后的照片欺骗）。</p>\n<p>需认识物联系统三层结构存在的安全风险，提升信息安全意识。</p>", "reference": "<p>教师可从物联系统安全风险图引入，阐明自主可控的意义，介绍用车牌照片欺骗小区道闸等案例。引导学生在刷脸开锁探究中，从采集人脸数据、传输数据及反馈控制等环节分析存在的安全风险，并归纳分别属于哪一层的安全风险。</p>\n<p>拓展：通过比较物联网与互联网，举例说明物联网安全的特殊性。</p>"}, {"id": "L28", "title": "第28课 安全防范讲策略", "points": "<p>物联系统的感知层、网络层、应用层各有相应的安全防范策略；了解这些策略有助于体会安全防范的重要作用。</p>\n<p>需了解物联网安全策略，强化保护个人数据安全的意识。</p>", "reference": "<p>本课系统梳理三层结构的安全防范策略，结合实际案例讲解。可组织讨论不同门禁（RFID系统与人脸识别系统）各自的优势、存在的安全风险与防范方法，帮助学生形成整体安全防范认识。</p>\n<p>拓展：目前常见小区门禁有RFID系统和人脸识别系统，比较两者的优势分别是什么、各自存在哪些安全风险、如何防范。</p>"}, {"id": "L29", "title": "第29课 自主可控意义大", "points": "<p>物联网在芯片、软件、协议标准与知识产权等方面存在外部依赖风险；自主可控指在关键技术领域拥有核心能力与自主权，并非闭门造车、排斥国际合作。</p>\n<p>认识自主可控生态体系对我国国家安全的重要作用，提升国家安全意识与民族自豪感。</p>", "reference": "<p>可让学生分组利用互联网搜索、交流，查阅我国芯片产业发展历程（设计、制造、封装测试，含数十亿晶体管），思考国家为何重点发展芯片产业。澄清\"自主可控即通过完全自主研发解决任何问题、无须国际合作\"的误解，理解有效结合自主研发与国际合作更利于技术创新与全球竞争力。</p>\n<p>拓展：有人说自主可控就是通过完全自主研发解决任何问题，因此就无须再开展国际合作交流，这样的说法对吗？</p>"}, {"id": "L30", "title": "第30课 系统安全需升级", "points": "<p>提升数据采集安全的方法包括摄像头活体检测、用户身份认证、加密传输等，通过升级改造可提升物联门锁等系统的安全性。</p>\n<p>了解身份认证技术，认识物联系统安全的重要性，并通过实践体验安全升级。</p>", "reference": "<p>本课以第三单元物联门锁案例为例，开展摄像头活体检测、用户身份认证、加密传输等安全升级实践。可先进行人脸识别再升级；引导学生思考哪些情况下需要验证身份数据、如何对传输数据加密。也可先进行人物体验再开展升级。</p>\n<p>拓展：选择一种加密算法对物联门锁系统中传输的数据进行加密，修改物联门锁系统的程序，实现该功能。</p>"}]}];
var TB_OUTLINE = "\n<h2>课程纲要</h2>\n\n<h3>一、模块设计说明</h3>\n<p>与互联网相比，物联网出现的时间不长，其体系和结构还处于发展演化中。本模块围绕物联网的基本思想、原理、方法与过程，概述物联网的\"感知—采集—传输—反馈—控制\"流程，以简易物联系统为抓手，从微观层面呈现大部分技术性内容。</p>\n<ol>\n  <li>本模块共30课，分6个单元。教师可以结合学情，适当调整各课内容。第五单元的实践案例可根据本地实际情况选择。</li>\n  <li>本模块既有基本原理和基本概念的阐述，也有实践性较强的内容。建议把实践性较强的课程安排在信息科技实验室展开，这样会有更好的教学效果，也可以帮助学生拓展学习。</li>\n  <li>本模块内容涉及一些程序代码，不必对特定程序设计语言展开详细讲解，引导学生理解主要代码即可。</li>\n  <li>不同物联实验设备的连接和使用方法不同，教师可根据实际教学情况补充相关内容，不必围绕某一产品讲解。</li>\n</ol>\n\n<h3>二、数字素养与技能培养</h3>\n<p>在网络世界中，各种物联设备随处可见，\"自主可控\"\"虚拟身份\"不再是抽象概念，而是更具体、更现实的存在。在这种真实、复杂的环境中带领学生开展实践活动，引导学生积极探索和理性思考，可以有效提升学生的数字素养与技能。</p>\n<p><strong>信息意识</strong></p>\n<ol>\n  <li>通过体验物联网的数据交互方式，了解万物互联和智能感知对信息社会发展的作用，感受物联网给人们的学习、生活和工作方式带来的改变。</li>\n  <li>增强主动学习物联网知识、掌握核心技术的意识，具有自主解决问题的意识，加强虚拟身份识别和数据安全意识，做好安全防护。</li>\n</ol>\n<p><strong>计算思维</strong></p>\n<ol>\n  <li>在实践应用中，熟悉数字平台中技术工具、软件系统的功能与应用，知道数字设备获取数据的方法，理解网络中数据编码、传输和呈现的原理。</li>\n  <li>能够根据需求，设计和搭建简单的物联系统原型，结合项目活动采集、分析和呈现数据，解决实际问题，发展计算思维。</li>\n</ol>\n<p><strong>数字化学习与创新</strong></p>\n<ol>\n  <li>在学习过程中，了解物联网\"大场景\"\"小应用\"的特点，选择恰当的数字设备和数字平台支持学习，搭建系统原型探究信息科技支持数字化学习的新方法、新模式，具备利用信息科技进行自主学习和合作学习的能力。</li>\n  <li>能够主动利用数字设备开展实践创新活动，并在创新活动中认识到原始创新对可持续发展的重要性。</li>\n</ol>\n<p><strong>信息社会责任</strong></p>\n<ol>\n  <li>在物联网应用中，了解网络空间中物品标识和虚拟身份的意义，知道数据安全防护的常用方法和策略，保护个人隐私，尊重他人隐私。</li>\n  <li>了解自主可控对国家安全及物联网未来发展的重要意义。</li>\n  <li>遵循信息科技领域的伦理道德规范，明确科技活动中应遵循的价值观念、道德责任和行为准则。</li>\n</ol>\n\n<h3>三、内容要求</h3>\n<ol>\n  <li>通过实例感受万物互联的场景，知道物联网与互联网的异同，认识到物联网的普及对学习和生活的影响。</li>\n  <li>通过对身边真实应用场景中物联网的分析，认识物联网实现万物互联的基本原理。</li>\n  <li>自觉遵守物联网实验的操作规程，会使用实验设备搭建物联系统原型，并能通过实验平台读取、发送、接收、汇集和使用数据。</li>\n  <li>通过简易物联系统的设计与搭建，探索物联网中数据采集、处理、反馈控制等基本功能，体验物联网、大数据及人工智能的关系。</li>\n  <li>了解身边的物联设备及其对塑造网络虚拟身份的作用，有意识地保护个人隐私，进行安全防护。</li>\n  <li>了解物联网中发展自主可控技术的意义，了解自主可控生态体系对我国国家安全的重要作用。</li>\n</ol>\n\n<h3>四、学业要求</h3>\n<ol>\n  <li>能理解万物互联的含义，知道物联网协同互联网使实时定位、远程监控、分享众筹等新型服务和应用成为可能。</li>\n  <li>根据学习任务的需要和可用的实验设备，设计并搭建具有数据采集、实时传输和简单控制功能的简易物联系统。</li>\n  <li>能通过智能终端或编写程序，读取并处理含有物联功能设备中的数据，并进行适当反馈或控制。</li>\n  <li>初步体会物联网与大数据、人工智能之间的关系，并利用相关知识解决一些跨学科的实际问题，认识物联网中自主可控技术的重要作用。</li>\n</ol>\n\n<h3>五、单元主题与课标内容要求对照表</h3>\n<p>说明：下表\"对应课标内容要求\"中的数字，对应上文\"三、内容要求\"的条目编号（1—6）。</p>\n<table class=\"kb-table\">\n  <thead>\n    <tr>\n      <th>单元</th>\n      <th>单元主题</th>\n      <th>课名称</th>\n      <th>核心内容</th>\n      <th>对应课标内容要求</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td rowspan=\"5\">第一单元</td>\n      <td rowspan=\"5\">从感知到物联</td>\n      <td>第1课 开启物联网之门</td>\n      <td>物联网中的\"物\"指什么，物联网与互联网的关系，我国物联网的发展</td>\n      <td>1、5</td>\n    </tr>\n    <tr>\n      <td>第2课 传感之古今未来</td>\n      <td>传感器的工作原理，不同时期传感器的特点</td>\n      <td>1、6</td>\n    </tr>\n    <tr>\n      <td>第3课 环境数据要感知</td>\n      <td>利用传感器开展实践探索</td>\n      <td>1</td>\n    </tr>\n    <tr>\n      <td>第4课 物物相连有价值</td>\n      <td>物联网的价值：丰富实时的数据、远程控制和协同智能</td>\n      <td>1、5</td>\n    </tr>\n    <tr>\n      <td>第5课 物联功能趣体验</td>\n      <td>查看互联网中的物联数据，体验远程控制和远程监测功能</td>\n      <td>2</td>\n    </tr>\n    <tr>\n      <td rowspan=\"5\">第二单元</td>\n      <td rowspan=\"5\">万物互联有协议</td>\n      <td>第6课 数据传输方式多</td>\n      <td>物联网数据传输方式，涉及多种协议</td>\n      <td>1、2</td>\n    </tr>\n    <tr>\n      <td>第7课 电子标签我揭秘</td>\n      <td>RFID的工作原理，读取电子标签编号实践探索</td>\n      <td>1、3、5</td>\n    </tr>\n    <tr>\n      <td>第8课 巧用蓝牙做工具</td>\n      <td>蓝牙的工作原理，近距离通信的特点，蓝牙翻页笔实践探索</td>\n      <td>1、3</td>\n    </tr>\n    <tr>\n      <td>第9课 互联协议仍沿用</td>\n      <td>HTTP的工作原理，互联网中天气数据实践探索</td>\n      <td>1、3</td>\n    </tr>\n    <tr>\n      <td>第10课 物物互通有新径</td>\n      <td>MQTT的工作原理，发布及订阅功能实践探索</td>\n      <td>1、2</td>\n    </tr>\n    <tr>\n      <td rowspan=\"5\">第三单元</td>\n      <td rowspan=\"5\">简单物联功能实践</td>\n      <td>第11课 物联功能细分解</td>\n      <td>物联系统分为感知层、网络层和应用层，物联门锁系统的功能分解</td>\n      <td>2、4</td>\n    </tr>\n    <tr>\n      <td>第12课 刷卡开锁易实现</td>\n      <td>刷卡开锁功能实践探索</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td>第13课 门铃通知即时到</td>\n      <td>物联网中的反馈，远程通知功能实践探索</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td>第14课 远程控制更便捷</td>\n      <td>物联网中的控制，远程控制功能实践探索</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td>第15课 面容钥匙显智能</td>\n      <td>人脸识别探究，人脸识别开锁功能实践探索</td>\n      <td>3、4、5</td>\n    </tr>\n    <tr>\n      <td rowspan=\"5\">第四单元</td>\n      <td rowspan=\"5\">简易物联系统实践</td>\n      <td>第16课 模块功能先划分</td>\n      <td>简易物联系统的工作环节、功能需求，划分功能模块</td>\n      <td>2、4</td>\n    </tr>\n    <tr>\n      <td>第17课 物联数据需采集</td>\n      <td>利用传感器获取数据，通过互联网获取数据，传输与存储数据</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td>第18课 数据分析与处理</td>\n      <td>从物联系统中获取数据，处理数据的方法</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td>第19课 数据呈现可视化</td>\n      <td>可视化呈现数据的作用、方式和方法</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td>第20课 反馈控制有算法</td>\n      <td>根据数据设计算法，实现反馈与控制</td>\n      <td>3、4</td>\n    </tr>\n    <tr>\n      <td rowspan=\"5\">第五单元</td>\n      <td rowspan=\"5\">物联网应用探索</td>\n      <td>第21课 文物保护新手段</td>\n      <td>物联网在文物保护中的应用，利用物联实验设备实践探索</td>\n      <td>1、2、3、4</td>\n    </tr>\n    <tr>\n      <td>第22课 健康生活新设备</td>\n      <td>物联网在生活中的应用，利用物联实验设备实践探索</td>\n      <td>1、2、3、4</td>\n    </tr>\n    <tr>\n      <td>第23课 医疗设施新功能</td>\n      <td>物联网在医疗中的应用，利用物联实验设备实践探索</td>\n      <td>1、2、3、4</td>\n    </tr>\n    <tr>\n      <td>第24课 农业生产新模式</td>\n      <td>物联网在农业中的应用，利用物联实验设备实践探索</td>\n      <td>1、2、3、4</td>\n    </tr>\n    <tr>\n      <td>第25课 学习探究新工具</td>\n      <td>物联网在学习中的应用，利用物联实验设备实践探索</td>\n      <td>1、2、3、4</td>\n    </tr>\n    <tr>\n      <td rowspan=\"5\">第六单元</td>\n      <td rowspan=\"5\">物联网安全</td>\n      <td>第26课 数字世界有身份</td>\n      <td>物联网中虚拟身份的内涵、作用</td>\n      <td>1、5</td>\n    </tr>\n    <tr>\n      <td>第27课 安全事件与风险</td>\n      <td>物联网中常见的安全事件及存在的安全风险</td>\n      <td>1、6</td>\n    </tr>\n    <tr>\n      <td>第28课 安全防范讲策略</td>\n      <td>物联网感知层、网络层和应用层的安全防范策略</td>\n      <td>5、6</td>\n    </tr>\n    <tr>\n      <td>第29课 自主可控意义大</td>\n      <td>外部依赖与风险，自主可控的内涵及生态建设</td>\n      <td>6</td>\n    </tr>\n    <tr>\n      <td>第30课 系统安全需升级</td>\n      <td>通过摄像头活体检测、用户身份认证和加密传输提升物联门锁安全性，利用物联实验设备实践探索</td>\n      <td>1、3、4、5</td>\n    </tr>\n  </tbody>\n</table>\n";

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function buildNav(){
  var nav=document.getElementById('side-nav'); nav.innerHTML='';
  NAV.forEach(function(n){
    var b=document.createElement('button');
    b.className='nav-item'+(n.idx===-1?' active':'');
    b.dataset.idx=n.idx; b.textContent=n.label;
    b.onclick=function(){switchPanel(n.idx);};
    nav.appendChild(b);
  });
}
function switchPanel(idx){
  document.querySelectorAll('.nav-item').forEach(function(b){
    b.classList.toggle('active', parseInt(b.dataset.idx,10)===idx);
  });
  clearMarks();
  var panel=document.getElementById('panel');
  if(idx===-1){
    panel.innerHTML='<div class="outline-card panel">'+TB_OUTLINE+'</div>';
  } else {
    var u=TB_UNITS[idx], html='<div class="unit-card panel">';
    html+='<div class="unit-banner"><h2>'+esc(u.name)+'</h2><div class="u-intro">'+u.intro+'</div></div>';
    html+='<div class="unit-obj"><h3>学习目标</h3>'+u.objectives+'</div>';
    u.lessons.forEach(function(l){
      html+='<div class="lesson" id="'+l.id+'">';
      html+='<h3 class="lesson-h"><span>'+esc(l.title)+'</span><a class="quiz-link" href="八年级刷题练习.html#lesson='+l.id+'" onclick="event.stopPropagation()">📝 刷题</a></h3>';
      html+='<div class="section sec-points"><h4>教学要点</h4>'+l.points+'</div>';
      html+='<div class="section sec-ref"><h4>教学参考</h4>'+l.reference+'</div>';
      html+='</div>';
    });
    html+='</div>';
    panel.innerHTML=html;
  }
  if(window.scrollTo) window.scrollTo({top:0,behavior:'smooth'});
}
function clearMarks(){
  document.querySelectorAll('mark').forEach(function(m){
    var p=m.parentNode; if(p){ p.replaceChild(document.createTextNode(m.textContent),m); if(p.normalize)p.normalize(); }
  });
}
function searchText(q){
  q=(q||'').trim(); clearMarks(); searchMarks=[]; curMark=-1;
  var cnt=document.getElementById('search-count');
  if(q.length<1){ cnt.textContent=''; return; }
  var root=document.getElementById('main');
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
  var nodes=[],t; while(t=walker.nextNode()) nodes.push(t);
  var low=q.toLowerCase(), total=0;
  nodes.forEach(function(node){
    var txt=node.nodeValue; if(!txt||txt.trim()==='') return;
    var lowt=txt.toLowerCase(), i=lowt.indexOf(low);
    if(i<0) return;
    var html='',last=0,k=lowt.indexOf(low);
    while(k>=0){
      html+=esc(txt.substring(last,k))+'<mark>'+esc(txt.substring(k,k+q.length))+'</mark>';
      last=k+q.length; k=lowt.indexOf(low,last);
    }
    html+=esc(txt.substring(last));
    var wrap=document.createElement('span'); wrap.innerHTML=html;
    node.parentNode.replaceChild(wrap,node); total++;
  });
  cnt.textContent=total+' 处匹配';
  searchMarks=Array.prototype.slice.call(root.querySelectorAll('mark'));
  if(searchMarks.length) jumpMark(0);
}
function jumpMark(d){
  if(!searchMarks.length) return;
  if(curMark>=0) searchMarks[curMark].style.background='#ffe08a';
  curMark=(curMark+d+searchMarks.length)%searchMarks.length;
  var m=searchMarks[curMark];
  m.style.background='#ff9f43';
  if(m.scrollIntoView) m.scrollIntoView({block:'center'});
  document.getElementById('search-count').textContent=(curMark+1)+'/'+searchMarks.length+' 处匹配';
}
document.addEventListener('DOMContentLoaded',function(){ buildNav(); switchPanel(-1); });
</script>
</body>
</html>
