r": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四步均为教材给出的实现步骤：连接无线网、搭建MQTT服务器、门铃端发送消息、用户端接收显示。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>完整覆盖发布端与订阅端。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为正确步骤，全选。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>勿漏任一端。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "multi", "stem": "可用于门铃通知的“输出/执行器”有哪些？（多选）", "options": ["显示屏", "蜂鸣器", "RGB灯传感器", "按键传感器"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>显示屏、蜂鸣器、RGB灯传感器都可作为输出设备通知用户；按键传感器是输入设备，不在此列。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈由多种输出执行器承担。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除输入设备按键传感器。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>屏蜂灯皆反馈。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "short", "stem": "简述门铃远程通知功能的工作过程。", "options": [""], "answer": "工作过程：①家中门铃端——门铃按下（触发条件），获取按键状态数据，通过网络发布至MQTT服务器相应主题；②用户终端（输出设备）——从主题中接收数据，终端显示“有人按门铃”通知，实现对用户的反馈。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>按“门铃按下→发布主题→订阅接收→显示通知”描述。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现发布/订阅与反馈。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>分门铃端与用户端两步写。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>按发收显。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "short", "stem": "门铃远程通知功能的输入模块、计算模块、输出模块分别由哪些硬件组成？", "options": [""], "answer": "①输入模块：主控板、按键传感器——采集门铃状态数据，并发布至MQTT服务器相应主题；②计算模块：具备移动热点功能的计算机——搭建MQTT服务器，设置主题，实现发布与订阅；③输出模块：主控板——订阅MQTT服务器相应主题，收到数据后以通知形式提醒用户。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三模块硬件与功能逐一对应。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>输入采集、计算中转、输出反馈。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“模块=硬件+功能”结构作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>键采、脑转、板显。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "short", "stem": "什么是物联系统中的“反馈”？请结合门铃通知举例说明。", "options": [""], "answer": "反馈是指物联系统针对现实世界采取行动的过程，由输出设备完成。例如门铃通知中，用户端的显示屏（输出设备）收到MQTT主题消息后显示“有人按门铃”的通知，就是对“门铃被按下”这一事件在现实世界中采取的行动（反馈），让用户及时得知有人到访。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>反馈=对现实采取行动，输出设备执行。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈是物联系统关键特征。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>先下定义再结合门铃实例。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>反馈即行动。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "在远程控制开锁功能中，作为“用户端”发起控制指令的是哪个模块？", "options": ["输入模块", "计算模块", "输出模块", "网络模块"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材明确：输入模块是用户端，输出模块是门锁端。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>用户端发送指令属输入。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“用户端、发指令”对应输入模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>用户是输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "在远程控制开锁功能中，作为“门锁端”接收指令并执行开锁的是哪个模块？", "options": ["输入模块", "计算模块", "输出模块", "传输模块"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材明确：输出模块是门锁端，接收指令后控制舵机转动开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>门锁端执行动作属输出。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“门锁端、执行开锁”对应输出模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>门锁是输出。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "物联系统中，控制是指什么？", "options": ["采集环境数据", "基于反馈的数据调整设备或系统的工作状态", "存储历史数据", "显示通知内容"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>控制是基于反馈的数据调整设备或系统的工作状态，反馈与控制密不可分。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>控制依赖反馈数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“调整工作状态”是控制定义。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>控制调状态。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "通过发送指令实现对远程设备的控制，这属于？", "options": ["人工控制", "自动控制", "反馈控制", "数据采集"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>人工控制即通过发送指令实现对远程设备的控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>远程开锁属于人工控制实例。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“发送指令”关键词指向人工控制。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>指令属人工。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "根据设定的控制规则，由系统自动控制设备运转，这属于？", "options": ["人工控制", "自动控制", "远程通知", "数据采集"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>自动控制是根据设定的控制规则，由系统控制设备运转，如扫地机器人。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>自动运转无需人实时指令。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“设定规则、系统自动”对应自动控制。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>规则属自动。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "远程控制开锁中，门锁端收到消息后控制哪个硬件转动以实现开锁？", "options": ["蜂鸣器", "舵机", "按键传感器", "RGB灯"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>输出模块由主控板、舵机组成，订阅主题收到消息后控制舵机转动开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>舵机模拟门锁开合。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“转动开锁”对应舵机。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>舵机转开锁。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "远程控制开锁功能中，用户端与门锁端之间进行消息传递所使用的通信协议是？", "options": ["RFID", "MQTT（主题 Door/Lock）", "NFC", "蓝牙"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>远程控制开锁使用MQTT，用户端发布、门锁端订阅同一主题（如 Door/Lock）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT发布/订阅实现远程控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>远程控制依赖MQTT主题通信。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>Door/Lock走MQTT。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "远程控制开锁的用户端按下按键后，通常向主题发布的消息内容是？", "options": ["close", "open", "hello", "bell"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>用户端采集按键状态，若按下则发布MQTT主题消息“open”表示开锁指令。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>“open”即开启指令。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>开锁指令对应“open”。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>按下发open。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "远程控制开锁中，作为计算模块、负责搭建MQTT服务器的是？", "options": ["具备移动热点功能的计算机", "按键传感器", "舵机", "摄像头"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>计算模块由具备移动热点功能的计算机担任，负责搭建MQTT服务器、设置主题、实现发布与订阅。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>计算机充当服务平台。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>MQTT服务器运行在带热点计算机上。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>电脑搭服务器。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "single", "stem": "下列例子中，属于“自动控制”的是？", "options": ["用户手机远程按下按键开锁", "火车站验票系统按规则自动验票", "用户发送指令开灯", "用户订阅门铃通知"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>自动控制按设定规则由系统运转，如扫地机器人、火车站验票系统；其余均为人工发送指令的控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>自动=规则驱动，人工=指令驱动。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“按规则自动”是自动控制标志。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>规则自动跑。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "tf", "stem": "物联系统中的反馈与控制密不可分，控制是基于反馈的数据调整设备的工作状态。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材指出反馈与控制密不可分，控制基于反馈的数据调整设备/系统工作状态。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈是控制的前提。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>反馈控相依。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "tf", "stem": "远程控制开锁功能中，用户端是输出模块。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。教材明确用户端是输入模块（发送指令），门锁端才是输出模块。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>用户端发指令=输入。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“用户端”非输出，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>用户是输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "tf", "stem": "人工控制是指通过发送指令，实现对远程设备的控制。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。人工控制即通过发送指令实现远程设备控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>远程开锁是人工控制实例。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材定义一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>指令即人工。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "tf", "stem": "远程控制开锁只能由系统自动完成，不能由人工控制。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。远程控制开锁是人工控制的典型例子，由用户发送“open”指令实现，并非只能自动完成。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>本课重点就是人工远程控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能自动”违背本课内容，明显错误。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>远程靠人工。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "multi", "stem": "远程控制开锁功能包含哪些功能模块？（多选）", "options": ["输入模块（用户端）", "计算模块（MQTT服务器）", "输出模块（门锁端）", "存储模块"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>包含输入模块（用户端，主控板+按键传感器）、计算模块（带热点计算机，MQTT服务器）、输出模块（门锁端，主控板+舵机）；教材未单列存储模块。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>输入—计算—输出三模块。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除无关项，选前三。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>用户计算门锁。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "multi", "stem": "远程控制开锁的工作过程环节包括？（多选）", "options": ["搭建MQTT服务器并设置主题，实现发布与订阅", "门锁端订阅开锁指令", "用户端按键触发，发布开锁指令", "门锁端控制开锁"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四步均为教材流程：搭建MQTT与主题、订阅指令、按键触发发布指令、控制开锁，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>完整覆盖通信与控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为正确环节，全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>搭订发控。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "multi", "stem": "关于人工控制与自动控制，下列说法正确的有哪些？（多选）", "options": ["人工控制通过发送指令实现对远程设备的控制", "自动控制根据设定的控制规则由系统运转", "扫地机器人按设定规则清扫属于自动控制", "自动控制需要人实时发出每一条指令"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>前三项正确；自动控制按规则运转，不需要人实时发每条指令，故第四项错误。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>人工靠指令，自动靠规则。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“实时发指令”错项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>人指自规。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "short", "stem": "什么是物联系统中的“控制”？反馈与控制有什么关系？", "options": [""], "answer": "控制是指基于反馈的数据调整设备或系统的工作状态。反馈与控制密不可分：反馈为控制提供数据依据，控制则依据反馈数据对设备或系统进行调整，从而实现对现实世界的干预。例如火车站验票系统、扫地机器人都体现了反馈与控制的结合。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>控制基于反馈数据调整状态，两者紧密相依。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈是控制的前提。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>先定义控制，再说二者关系。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>反馈控相依。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "short", "stem": "简述远程控制开锁功能的工作过程。", "options": [""], "answer": "工作过程：①搭建MQTT服务器，设置主题（如 Door/Lock），实现发布与订阅；②门锁端（输出模块）订阅开锁指令主题；③用户端（输入模块）按键触发，若按下则发布“open”消息；④门锁端收到消息后控制舵机转动，实现开锁。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>按“搭服务器→订阅→触发发布→控制开锁”四步。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现远程人工控制闭环。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>分用户端与门锁端描述。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>搭订发控。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 14, "lessonTitle": "远程控制更便捷", "type": "short", "stem": "区分“人工控制”与“自动控制”，并各举一个教材中的例子。", "options": [""], "answer": "人工控制：通过发送指令实现对远程设备的控制，例如本课的远程控制开锁（用户按下按键发送“open”指令）。自动控制：根据设定的控制规则，由系统控制设备运转，例如家里的扫地机器人（设定规则后自动规划路线、避开障碍清扫）和火车站验票系统。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>人工=指令驱动，自动=规则驱动，各举教材例。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>两类控制区别在触发方式。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>给出定义+对应实例。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>人指自规。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第14课 远程控制更便捷"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "人脸识别技术属于下列哪一类识别技术？", "options": ["射频识别技术", "生物识别技术", "近场通信技术", "条码识别技术"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>人脸识别是基于人的脸部特征数据进行身份识别的一种生物识别技术。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>生物识别包括人脸、指纹等。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“脸部特征”对应生物识别。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>人脸属生物。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "人脸识别是基于什么数据进行身份识别的？", "options": ["声音数据", "脸部特征数据", "指纹数据", "电子标签数据"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>人脸识别基于人的脸部特征数据进行身份识别。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>脸部特征是识别依据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干“人脸”直接对应脸部特征。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>看脸识人。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "机器识别人脸的第一步是？", "options": ["提取五官特征", "采集人脸图像信息", "与人脸库匹配", "分析整体轮廓"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>机器识别人脸第一步是采集人脸图像信息（相当于人眼捕捉图像传给大脑）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>识别流程始于图像采集。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>任何识别都先“采集图像”。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先采图。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "人脸识别中提取的“局部特征”主要包括以下哪些部位？", "options": ["眉毛、眼睛、鼻子、嘴", "手、脚、臂、腿", "心脏、肺、肝、肾", "键盘、鼠标、屏幕、主机"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>机器提取人脸局部特征包括眉毛、眼睛、鼻子、嘴等，以及整体轮廓。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>五官特征用于区分身份。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“人脸局部特征”指向五官。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>眉眼鼻嘴。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "机器识别人脸时，“和记忆中的人脸特征进行匹配，识别出身份”是第几步？", "options": ["第一步", "第二步", "第三步", "第四步"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>完整的人脸识别三步为：①采集图像；②分析提取特征；③与记忆中特征匹配识别身份，故匹配是第三步。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>匹配识别是最后一步。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“匹配识别”在流程末尾。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "在刷脸开锁功能中，负责采集人脸数据并进行人脸识别的是？", "options": ["输入模块（摄像头）", "计算模块（计算机）", "输出模块（舵机）", "网络模块"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>输入模块由摄像头组成，负责采集人脸数据、进行人脸识别后发布消息至MQTT主题。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>摄像头完成采集与识别。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“采集人脸”对应输入模块（摄像头）。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摄像即输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "single", "stem": "刷脸开锁中，订阅MQTT主题、收到消息后控制舵机转动的是？", "options": ["输入模块（摄像头）", "计算模块（计算机）", "输出模块（主控板、舵机）", "传感器"], "answer": 2, "analysis": e67e22;\">🧠 记忆口诀：</strong>刷脸更安全。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "tf", "stem": "人脸识别是基于人的脸部特征数据进行身份识别的一种生物识别技术。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材原话定义人脸识别为生物识别技术。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>脸部特征是识别依据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>人脸属生物。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "tf", "stem": "一个完整的人脸识别系统要求计算机能够进行三步：采集图像、提取特征、匹配识别。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。三步即采集人脸图像、分析提取特征、与存储特征匹配识别身份。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三步流程是识别核心。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "tf", "stem": "刷脸开锁中，摄像头属于输出模块。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。摄像头属于输入模块，负责采集人脸数据并进行人脸识别，不是输出模块。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>采集=输入。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>摄像头采集属输入，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摄像即输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "tf", "stem": "人脸识别只需要采集图像，不需要与人脸库匹配也能识别身份。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。人脸识别必须与人脸库（记忆中的特征）进行匹配才能识别身份，仅采集图像无法确认“是谁”。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>匹配是识别关键。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“不需要匹配”违背三步流程，明显错误。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>不配比不了。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "multi", "stem": "机器识别人脸的基本过程包括以下哪些步骤？（多选）", "options": ["采集人脸图像信息", "分析并提取人脸局部特征与整体轮廓", "与人脸库中的特征进行匹配识别身份", "直接播放语音播报"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三步为采集图像、分析提取特征（眉毛眼睛鼻子嘴及轮廓）、匹配识别；语音播报不在基本识别步骤内。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>识别核心是采提匹。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“语音播报”这一输出动作。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "multi", "stem": "刷脸开锁功能包含哪些功能模块？（多选）", "options": ["输入模块（摄像头）", "计算模块（带热点计算机、MQTT服务器）", "输出模块（主控板、舵机）", "存储模块（硬盘）"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>包含输入模块（摄像头）、计算模块（带热点计算机）、输出模块（主控板、舵机）；教材未单列“存储模块（硬盘）”。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>输入—计算—输出三模块。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除无关项，选前三。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摄像脑舵。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "multi", "stem": "人脸识别中需要提取的特征包括以下哪些？（多选）", "options": ["眉毛", "眼睛", "鼻子", "嘴"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材列举机器提取局部特征包括眉毛、眼睛、鼻子、嘴等，以及整体轮廓，四者全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>五官均为识别特征。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为五官特征，无干扰项则全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>眉眼鼻嘴。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "short", "stem": "简述机器识别人脸的基本过程（三步）。", "options": [""], "answer": "机器识别人脸的基本过程为三步：①采集人脸图像信息（相当于人眼捕捉图像）；②分析图像，提取人脸的局部特征（眉毛、眼睛、鼻子、嘴等）和整体轮廓；③将提取的特征与记忆（人脸库）中的人脸特征进行匹配，从而识别出人脸的身份。即“看得见、看得懂、认得出”。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三步：采集、提取特征、匹配识别。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>对应“见懂认”。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按三步骤顺序展开。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "short", "stem": "刷脸开锁功能中，输入、计算、输出模块分别由哪些硬件组成？", "options": [""], "answer": "①输入模块：摄像头——采集人脸数据，进行人脸识别后，发布消息至MQTT服务器相应主题；②计算模块：具备移动热点功能的计算机——搭建MQTT服务器，设置主题，实现发布与订阅；③输出模块：主控板、舵机——订阅MQTT服务器相应主题，收到消息后控制舵机转动，实现开锁。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三模块硬件与功能逐一对应。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>输入采集、计算中转、输出执行。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“模块=硬件+功能”结构作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摄像脑舵。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第三单元 简单物联功能实践", "lesson": 15, "lessonTitle": "面容钥匙显智能", "type": "short", "stem": "为什么说人脸识别技术让门锁更安全、便捷？", "options": [""], "answer": "因为人脸识别基于每个人独一无二的脸部生物特征进行身份识别，难以复制或冒用，安全性高于传统钥匙或卡片；同时用户无需携带任何实体钥匙或卡片，刷脸即可开锁，使用更为便捷，为人们提供更安全、便捷的生活体验，也代表了物联系统智能化的发展趋势。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>从生物特征唯一性与免携带两方面说明。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>生物识别优势明显。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>围绕“安全（唯一）+便捷（免带）”作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>唯一又免带。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第15课 面容钥匙显智能"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "不同物联系统的工作环节虽然各有不同，但一般都包含以下哪个不属于共同环节的流程？", "options": ["采集环境数据", "传输与存储数据", "分析处理数据", "机械加工制造"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>物联系统共同工作环节为采集环境数据、传输与存储数据、分析处理数据、反馈与控制；机械加工制造不属于物联系统工作环节。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>四个环节是物联系统共性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“机械加工”明显不相关。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采传析控。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆系统中，实时获取温度、土壤湿度、光照强度等数据属于哪个工作环节？", "options": ["采集数据", "传输与存储数据", "分析处理数据", "反馈与控制"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>实时获取温度、土壤湿度、光照强度等环境数据属于“采集数据”环节。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>传感器完成数据采集。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“获取…数据”即采集。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>获取数据先。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆系统中，将环境数据通过网络传输给物联网服务平台属于哪个环节？", "options": ["采集数据", "传输与存储数据", "分析处理数据", "反馈与控制"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>将数据传输给物联网服务平台，属于“传输与存储数据”环节。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>网络传输是此环节核心。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“传输”关键词指向该环节。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>传输靠网络。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆系统中，对数据进行简单分析处理、得到统计结果和可视化图表属于哪个环节？", "options": ["采集数据", "传输与存储数据", "分析处理数据", "反馈与控制"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>获取历史数据并进行简单分析处理、得到统计结果和可视化图表，属于“分析处理数据”环节。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分析处理生成价值信息。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“分析处理、图表”对应此环节。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>处理出图表。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆系统中，根据温度、土壤湿度、天气预报数据实现自动灌溉属于哪个环节？", "options": ["采集数据", "传输与存储数据", "分析处理数据", "反馈与控制"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>根据分析结果与天气数据自动灌溉、动态显示土壤湿度，属于“反馈与控制”环节。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈控制作用于现实世界。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“自动灌溉”是反馈控制动作。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>灌溉即控制。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆项目中，负责采集环境数据的功能模块是？", "options": ["环境感知模块", "网络通信模块", "服务平台模块", "执行模块"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>环境感知模块负责采集环境数据（传感器采集，主控板接收并通过网络通信发送）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知模块是数据入口。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“采集环境数据”对应环境感知模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感知采数据。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆项目中，负责数据的汇总、存储、处理的模块是？", "options": ["环境感知模块", "网络通信模块", "服务平台模块", "执行模块"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>服务平台模块负责数据的汇总、存储、处理，并进行可视化与手动控制灌溉。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>服务平台是系统中枢。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“汇总存储处理”对应服务平台模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>平台管汇总。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆项目中，负责实现数据通信的模块是？", "options": ["环境感知模块", "网络通信模块", "服务平台模块", "执行模块"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>网络通信模块负责实现数据通信，既将传感器数据发往服务平台，也将天气预报数据传输给主控板。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>通信模块双向传输。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“数据通信”对应网络通信模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>网络管通信。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆项目中，执行模块中的执行器（如LED灯、水泵电机）的主要作用是？", "options": ["采集环境数据", "根据主控板指令产生相应动作，实现反馈", "存储历史数据", "分析处理数据"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>执行模块负责反馈与控制，执行器根据主控板发出的指令产生相应动作（如LED灯、水泵电机），实现对现实世界的反馈。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>执行器是反馈的执行者。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“产生动作、反馈”是执行器职责。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>执行出动作。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "single", "stem": "物联花盆项目中，传感器采集到的环境数据最终由谁接收并通过网络通信模块发送出去？", "options": ["服务器", "主控板", "显示屏", "水泵"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>主控板负责接收传感器的数据，并将这些数据通过网络通信模块发送给物联网服务平台。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>主控板是数据汇聚与转发节点。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“接收传感器数据并发送”是主控板职责。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>主控来转发。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "tf", "stem": "不同的物联系统在功能、软硬件组成上各有不同，但它们的工作环节都类似。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材指出不同物联系统功能、软硬件各有不同，但工作环节都类似（采集、传输存储、分析处理、反馈控制）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>共性在四个工作环节。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>环节皆相似。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "tf", "stem": "物联花盆系统的“执行模块”负责采集环境数据。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。采集环境数据是环境感知模块的职责，执行模块负责反馈与控制（由执行器产生动作）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>采集≠执行。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>采集归感知模块，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采集属感知。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "tf", "stem": "服务平台模块负责物联花盆系统数据的汇总、存储和处理。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。服务平台模块负责数据的汇总、存储、处理，并可视化、手动控制灌溉。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>平台是数据处理中心。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>平台管汇总。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "tf", "stem": "网络通信模块只负责将传感器数据传到主控板，不负责接收外部数据。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。网络通信模块既将主控板获取的传感器数据发送到服务平台，也将互联网中的天气预报数据传输给主控板，是双向通信。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>通信模块双向传输。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只负责…不负责”与双向传输矛盾，故错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>网络双传。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "multi", "stem": "物联花盆系统一般包含哪四个工作环节？（多选）", "options": ["采集数据", "传输与存储数据", "分析处理数据", "反馈与控制"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四个共同工作环节：采集数据、传输与存储数据、分析处理数据、反馈与控制，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>这是物联系统通用流程。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>无干扰项，全选四环节。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采传析控。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "multi", "stem": "物联花盆项目可划分为哪些功能模块？（多选）", "options": ["环境感知模块", "网络通信模块", "服务平台模块", "执行模块"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>项目划分为环境感知模块、网络通信模块、服务平台模块、执行模块四大模块，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>模块对应四个工作环节。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>四模块一一对应四环节，全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感网台执。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "multi", "stem": "关于执行模块，下列说法正确的有哪些？（多选）", "options": ["执行模块负责反馈与控制", "执行模块包含执行器如LED灯、水泵电机", "执行器根据主控板指令产生相应动作", "执行模块负责采集环境数据"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>执行模块负责反馈与控制，由LED灯、水泵电机等执行器根据主控板指令产生动作；采集环境数据是环境感知模块的职责，故第四项错误。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>执行模块=反馈控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“采集数据”错项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>执行出动作。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "short", "stem": "物联系统一般包含哪四个工作环节？请结合物联花盆系统各举一例。", "options": [""], "answer": "物联系统一般包含四个工作环节：①采集数据——物联花盆实时获取温度、土壤湿度、光照强度等，并可通过网络获取天气预报；②传输与存储数据——将环境数据通过网络传输给物联网服务平台；③分析处理数据——获取历史数据并分析处理，得到统计结果与可视化图表；④反馈与控制——动态显示土壤湿度，并根据温度、土壤湿度、天气预报实现自动灌溉。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四环节：采集、传输存储、分析处理、反馈控制，各配花盆例。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>环节对应模块功能。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按四环节顺序逐一举例。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采传析控。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "short", "stem": "物联花盆项目可划分成哪些功能模块？各自的主要作用是什么？", "options": [""], "answer": "可划分为四个功能模块：①环境感知模块——负责采集环境数据（传感器采集，主控板接收并发送）；②网络通信模块——负责实现数据通信（双向传输传感器数据与天气预报数据）；③服务平台模块——负责数据汇总、存储、处理（可视化、手动控制灌溉）；④执行模块——负责反馈与控制（由LED灯、水泵电机等执行器产生动作）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四模块：环境感知、网络通信、服务平台、执行，各说作用。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>模块划分对应工作环节。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按模块名称+作用结构作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感网台执。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 16, "lessonTitle": "模块功能先划分", "type": "short", "stem": "什么是执行模块？执行器在物联系统中的作用是什么？", "options": [""], "answer": "执行模块是物联系统中负责反馈与控制的功能模块。执行器（如LED灯、水泵电机等）的主要作用是：根据主控板发出的指令产生相应的动作，从而实现对现实世界的反馈与控制，例如物联花盆中由水泵电机完成自动灌溉。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>执行模块=反馈控制；执行器按指令产生动作。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>执行器是反馈的执行者。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>先定义模块，再说执行器作用并举例。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>执行出动作。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第16课 模块功能先划分"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "物联系统中，数据的主要来源有哪两类？", "options": ["传感器采集和互联网数据", "键盘输入和鼠标点击", "打印输出和扫描", "声音和图像"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>物联系统的数据来源主要有两类：传感器采集和互联网数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知设备+网络资源共同供数。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“传感器+互联网”是教材明确两类。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>传感加网络。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "物联花盆项目中，采集温度、湿度、光照需要确定连接哪些传感器？", "options": ["温湿度传感器、土壤湿度传感器、光敏传感器", "加速度传感器、陀螺仪、麦克风", "RFID读卡器、NFC模块", "按键传感器、舵机"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材确定连接温湿度传感器、土壤湿度传感器、光敏传感器来采集相应数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>不同传感器对应不同环境量。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>温度湿度光照对应题中三种传感器。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>温湿光三感。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "为了获取更可靠的天气预报数据，应当优先访问？", "options": ["任意商业网站", "官方网站", "社交媒体", "论坛帖子"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材提示“官网数据更可靠”，应访问官方网站实时查看天气数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>官方数据源权威性高。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“更可靠”指向官网。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>官网更可靠。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "从互联网中获取天气预报数据，常用以下哪种方式？", "options": ["手动抄写", "调用免费的天气预报数据API", "直接查看电视", "发送短信"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>互联网中有很多免费的天气预报数据API供人们调用。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API便于程序自动获取。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“获取天气数据”对应API调用。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>天气用API。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "天气预报数据API通常返回什么格式的数据？", "options": ["图片文件", "JSON格式字符串", "音频文件", "Word文档"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>API返回的天气预报数据为JSON数据格式（字符串）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>JSON便于程序解析。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“API返回”常是JSON。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>API返JSON。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "在Python中，将JSON字符串转换为字典结构，应使用？", "options": ["json.load( )方法", "print( )函数", "open( )函数", "len( )函数"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>通过json.load( )方法可以将JSON字符串转换为字典结构。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>字典便于按键值访问数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“JSON转字典”对应json.load。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>json.load转字典。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "天气预报的JSON数据中，list键对应的列表主要用于存储？", "options": ["用户账号", "当天和第二天的天气预报", "历史日志", "设备编号"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>list键中的列表存储当天和第二天的天气预报；data键值是主要的天气预报数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>理解JSON结构是解析前提。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“list=当天+第二天”是教材说明。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>list存两天。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "在物联网服务平台中，为物联花盆项目添加主题一般按什么方式添加？", "options": ["按温度、光照强度、土壤湿度添加3个主题", "只添加1个总主题", "按日期添加", "按学生姓名添加"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>可按温度、光照强度、土壤湿度在物联网服务平台中添加3个主题，并与主控板对应。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分主题便于区分数据类型。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“三类环境量→三个主题”是教材做法。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>三类三主题。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "在物联网服务平台中，为区分不同的终端设备，需要为每个主控板分配？", "options": ["颜色和形状", "用户名和密码", "物理地址贴纸", "蓝牙名称"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>物联网服务平台为每个主控板分配用户名和密码，以便区分与管理设备。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>账号体系区分多设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“区分设备”对应用户名密码。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>每板一账号。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "single", "stem": "为减少数据冗余，在物联网服务平台上何时才上传新的环境数据较为合理？", "options": ["每隔固定的1秒都上传", "检测到温度、湿度、光照等环境数据发生变化时再上传", "只在开机时上传一次", "每天只上传一次"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材提出：在检测到环境数据发生变化时再上传新数据，可减少数据冗余。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>变化上传避免重复存储。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“减少冗余”对应变化时才上传。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>变才上传。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "tf", "stem": "物联系统的数据采集主要来自传感器采集和互联网数据两个方面。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。数据来源主要包括传感器采集与互联网数据两类。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>两类来源互补。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>传感加网络。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "tf", "stem": "JSON格式字符串可以直接当作字典使用，无需任何转换。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。JSON是字符串，需通过json.load( )等方法转换为字典结构后才能方便按键值访问。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>字符串与字典类型不同。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“直接当字典”违背转换步骤，故错。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>先转再用。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "tf", "stem": "物联网服务平台中，可以为每个主控板分配用户名和密码以区分设备。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。平台为每个主控板分配用户名和密码，与主控板对应，便于区分和管理。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>账号体系区分设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>每板一账号。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "tf", "stem": "为了减少数据冗余，应在数据每次固定时间都上传，无需判断变化。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。教材建议检测到环境数据发生变化时再上传新数据，以减少数据冗余，而非无条件频繁上传。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>变化上传更省资源。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“无需判断变化”与减少冗余相悖，故错。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>变才上传。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "multi", "stem": "物联花盆项目的传感器设备包括以下哪些？（多选）", "options": ["温湿度传感器", "土壤湿度传感器", "光敏传感器", "按键传感器"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>项目确定连接温湿度传感器、土壤湿度传感器、光敏传感器；按键传感器属于门铃/远程控制案例，不在花盆采集清单内。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三类传感器对应三类环境量。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除按键传感器。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>温湿光三感。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "multi", "stem": "关于通过API获取天气预报数据，下列说法正确的有哪些？（多选）", "options": ["API通常返回JSON格式数据", "可用json.load( )将JSON字符串转为字典", "list键中列表存储当天和第二天的天气预报", "官网数据不可靠，应使用随意网站"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>前三项正确；官网数据更可靠，故“官网不可靠”错误。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>理解API与JSON解析流程。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“官网不可靠”错项。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>官网更可靠。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "multi", "stem": "在物联网服务平台中进行主题与设备管理，正确的做法有哪些？（多选）", "options": ["按温度、光照强度、土壤湿度添加3个主题", "为每个主控板分配用户名和密码", "多个数据需在同一主题中注意区分", "无论数据是否变化都持续高频上传"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>前三项正确：分三类主题、每板分配账号、多数据需区分；教材建议变化时才上传以减少冗余，故“无论变化都高频上传”错误。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>合理管理降低冗余。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“高频无变化上传”错项。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>变才上传。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "short", "stem": "物联系统的数据来源有哪些？请结合物联花盆项目举例说明。", "options": [""], "answer": "物联系统的数据来源主要有两类：①传感器采集——如物联花盆通过温湿度传感器、土壤湿度传感器、光敏传感器采集温度、土壤湿度、光照强度等环境数据；②互联网数据——如通过网络获取官方网站提供的天气预报数据。两类数据共同支撑系统分析与应用。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>两类来源：传感器采集+互联网数据，各配花盆例。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知与网络共同供数。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>分两类说明并举例。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>传感加网络。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "short", "stem": "什么是API？如何通过API获取天气预报数据并解析JSON？", "options": [""], "answer": "API（应用程序接口）是预先定义、基于一定协议的软件函数集合，提供不同程序间交互的能力。获取天气预报数据：①调用互联网中免费的天气预报数据API；②API返回JSON格式字符串；③在Python中用json.load( )方法将JSON字符串转换为字典结构，再按data、list等键值提取当天及第二天的天气预报数据。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>先定义API，再说调用→返回JSON→json.load转换→按键提取。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API+JSON解析流程。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“调用—返回—转换—提取”顺序作答。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>API返JSON，load转字典。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 17, "lessonTitle": "物联数据需采集", "type": "short", "stem": "在物联网服务平台中，应如何为主题和设备进行管理？", "options": [""], "answer": "管理要点：①按数据类别添加主题——物联花盆项目可按温度、光照强度、土壤湿度添加3个主题，并与各主控板对应；②为每个主控板分配用户名和密码，以区分不同终端设备；③当多个数据放在同一主题时，要在数据中做好区分标识；④为减少数据冗余，应在检测到环境数据发生变化时再上传新数据，而非无变化也频繁上传。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>主题分类、设备分配账号、数据区分、变化上传四点。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>平台管理最佳实践。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>从主题、设备、区分、冗余四方面作答。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>三类三主题，变才上传。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第17课 物联数据需采集"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "下列工具中，不属于教材列举的“早期数据处理工具”的是？", "options": ["算盘", "差分机", "主控板", "计算器"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材列举的早期数据处理工具包括算盘、差分机、计算器、计算机；主控板是物联系统的控制硬件，不属于早期数据处理工具。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>数据处理工具随时代演进。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>主控板明显不属于计算工具。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>算差计计四工具。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "在Python中，提供对表格数据进行快速处理方法、常用于数据处理的模块是？", "options": ["pandas", "random", "turtle", "time"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>pandas提供了对表格数据进行快速处理的一系列方法，可提高数据处理效率。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>pandas是数据分析利器。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“表格快速处理”对应pandas。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>pandas处理表。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "与pandas常配合、用于数值计算的Python模块是？", "options": ["numpy", "json", "os", "math（仅基础）"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材提到可借助pandas、numpy等数据处理模块处理数据，numpy擅长数值计算。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>pandas+numpy组合常见。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“数值计算模块”对应numpy。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>numpy算数值。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "通过数据文件直接下载物联网服务平台的数据后，可用什么软件进行处理？", "options": ["电子表格软件", "杀毒软件", "绘图软件", "压缩软件"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>两种下载方式中，通过数据文件直接下载后，可用电子表格软件处理。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>表格软件适合查看统计。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“数据文件处理”对应电子表格软件。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>表格处理文件。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "通过API获取数据，一般不需要执行以下哪一步？", "options": ["参阅说明文档", "确定API的URL", "传入相关参数后发起网络请求", "购买专用硬件服务器"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>API获取数据步骤为：参阅文档、确定URL、传入参数发起请求；无需购买专用硬件服务器。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API调用是软件层面的事。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“购买硬件服务器”不在此流程。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>API三步取。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "想从数据中快速得到最高温度和最低温度，可以利用什么方法对数据排序？", "options": ["sort_values方法", "print方法", "len方法", "open方法"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>利用sort_values方法对数据进行排序，可快速得到最高和最低温度。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>排序后首尾即极值。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“排序求最值”对应sort_values。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>排序用sort_values。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "要找出光照强度大于某个阈值（如1000）的时间段，可使用？", "options": ["数据筛选", "数据合并", "数据加密", "数据删除"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>通过数据筛选找出光照强度大于阈值的数据，从而确定光照时间。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>筛选用于条件提取。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“大于阈值”对应筛选。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>筛选按条件。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "single", "stem": "根据不同设备ID求每组土壤湿度的平均值，应使用？", "options": ["groupby( )分组后配合mean( )", "sort_values", "print", "json.load"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>groupby( )提供数据分组功能，先按clientId分组，再利用mean( )函数求每组数据的平均值。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分组+聚合是典型分析。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“按设备ID分组求平均”对应groupby+mean。<b
