网络层添加IP头部形成IP包。因此TCP包数据体=HTTP数据，IP包数据体=TCP包总大小。","o":["A. 数据从上到下逐层封装","B. 每层添加含有本层控制信息的头部","C. TCP包数据体大小等于HTTP总数据量","D. IP包数据体大小等于TCP包总数据量"]},{"t":"m","q":"以下关于网络命令功能的匹配，正确的有？（多选）","a":[0,1,2,3],"an":"四种命令各有明确的功能定位：ping测连通性和解析IP，ipconfig查看本机网络配置，tracert跟踪路由路径，netstat查看网络连接状态。它们共同构成网络诊断的基本工具集。","o":["A. ping — 测试连通性、获取IP地址","B. ipconfig — 查看本机IP地址和网关","C. tracert — 跟踪数据经过的路由器","D. netstat — 查看网络连接情况"]},{"t":"q","q":"请写出四种常用网络诊断命令及其主要功能。","a":"1. ping：测试网络连通性，获取域名对应的IP地址。2. ipconfig：显示TCP/IP信息（IP地址、网关、DNS等）。3. tracert：跟踪通信路径，显示经过的路由器。4. netstat：显示本机的网络连接情况。","an":"这四种命令是网络故障诊断的基本工具，各有侧重。理解它们的功能和使用场景，有助于在实际遇到网络问题时快速定位和解决问题。"},{"t":"q","q":"请描述数据在发送过程中如何经过不同网络层封装。","a":"服务器发送数据时，数据从上到下在不同层流动。应用层产生HTTP数据 → 传输层接收后添加TCP头部（含源端口和目的端口）形成TCP包 → 网络层接收TCP包后添加IP头部（含源IP和目的IP）形成IP包 → 再交给下层继续封装和发送。如果数据很长，还要拆分成多个数据包。","an":"这种分层封装的过程体现了网络协议分层设计的核心思想。每一层只关注本层的功能，上层数据作为下层的\"数据体\"，下层不关心数据体的具体内容，只需添加本层的头部控制信息。"},{"t":"q","q":"如果教室中的计算机无法访问学校图书馆网站，应如何使用网络命令诊断问题？","a":"1. 先用ipconfig查看本机IP地址和网关配置是否正确。2. 用ping测试能否与图书馆服务器连通。3. 如ping不通，用tracert跟踪路由路径，找出故障点。4. 用netstat查看本机网络连接状态，确认本机网络是否正常。","an":"网络故障排查应遵循从近到远的原则：先检查本机配置（ipconfig），再测试连通性（ping），如失败则跟踪路径（tracert）定位问题节点，同时检查本机连接状态（netstat）排除本机问题。"}],"L16":[{"t":"s","q":"HTML的全称是什么？","a":0,"an":"HTML全称为HyperText Markup Language，即超文本标记语言，是用于描述网页结构和内容的标准语言。","o":["A. HyperText Markup Language","B. High Tech Modern Language","C. Hyper Transfer Markup Language","D. Home Tool Markup Language"]},{"t":"s","q":"HTML中成对出现的标签（如<html><\/html>）被称为什么？","a":1,"an":"成对出现的标签被称为双标签，如<HTML>和<\/HTML>，分别表示标签的开始和结束。而单标签如<img>，只有一个标签不需要成对出现。","o":["A. 单标签","B. 双标签","C. 空标签","D. 自闭合标签"]},{"t":"s","q":"用于设置网页标题的HTML标签是？","a":2,"an":"<title><\/title>标签用于设置网页标题，该标题会显示在浏览器的标签页上。<head>设置文档头部，<body>设置文档主体，<h1>设置一级标题。","o":["A. <head>","B. <body>","C. <title>","D. <h1>"]},{"t":"s","q":"用于插入图像的HTML标签是？","a":3,"an":"<img>标签用于在网页中插入图像，它是一个单标签，不需要成对出现。其src属性指定图像文件的路径。","o":["A. <a>","B. <p>","C. <h1>","D. <img>"]},{"t":"s","q":"用于设置超链接的HTML标签是？","a":1,"an":"<a>标签（anchor，锚点）用于设置超链接，通过href属性指定链接目标地址，如<a href=\"目标网址\">链接文字<\/a>。","o":["A. <link>","B. <a>","C. <img>","D. <p>"]},{"t":"s","q":"以下哪个是HTML中的单标签？","a":2,"an":"<img>是单标签，不需要成对出现。<html>、<body>、<head>都是双标签，需要以<\/html>、<\/body>、<\/head>结束。","o":["A. <html>","B. <body>","C. <img>","D. <head>"]},{"t":"s","q":"浏览器将HTML代码转换为什么呈现给用户？","a":1,"an":"浏览器获得网页代码后，会按照代码的要求显示相应的文字、图像等，呈现图文并茂的网页效果供用户浏览。HTML代码是网页的\"源代码\"，浏览器负责解析和渲染。","o":["A. 纯文本","B. 图文并茂的网页","C. 程序代码","D. 数据表格"]},{"t":"s","q":"在网页中显示图像的方法不包括以下哪项？","a":2,"an":"在网页中显示图像有两种方法：使用文件路径（需要图像文件）和使用图像数据编码（不需要图像文件）。声音编码不能用于显示图像。","o":["A. 使用文件路径引用图像文件","B. 使用图像数据编码（Base64）","C. 使用声音编码","D. 使用img标签的src属性"]},{"t":"s","q":"HTML代码是否必须保存在网页文件中才能被浏览器显示？","a":1,"an":"浏览器需要的是HTML代码本身，只要能得到相应的HTML代码就可以显示网页。网页文件（如index.html）只是常用的保存HTML代码的容器，并不是必需的。","o":["A. 是，必须保存为.html文件","B. 否，浏览器只需要获得HTML代码即可","C. 必须保存为.txt文件","D. 必须保存在服务器上"]},{"t":"s","q":"<body><\/body>标签的作用是？","a":2,"an":"<body><\/body>标签用于设置文档主体，网页中实际显示的内容（文字、图像、链接等）都放在<body>标签中。而<head>设置文档头部（元数据），<title>设置标题。","o":["A. 设置文档头部信息","B. 设置网页标题","C. 设置文档主体内容","D. 设置超链接"]},{"t":"j","q":"HTML语言中用于标记内容、格式或超链接的代码符号叫标签。","a":0,"an":"正确。HTML标签是HTML语言中的基本元素，用于标记内容的类型、格式或超链接等信息。标签分为双标签（成对出现）和单标签两种。","o":["正确","错误"]},{"t":"j","q":"网页中只能包含文字和图像，不能包含音频和视频。","a":1,"an":"错误。现代网页可以包含文字、图像、音频、视频等多种资源。HTML5还专门引入了<audio>和<video>标签来支持多媒体内容的嵌入。","o":["正确","错误"]},{"t":"j","q":"<p><\/p>标签用于设置网页中的段落。","a":0,"an":"正确。<p><\/p>（paragraph）标签用于定义网页中的段落，浏览器会自动在段落前后添加空白间距。","o":["正确","错误"]},{"t":"j","q":"使用图像数据编码显示图像时，必须保留原始的图像文件。","a":1,"an":"错误。如果使用图像数据编码（Base64编码）方式，图像数据直接嵌入在HTML代码中，不需要保留原始图像文件。而使用文件路径方式才需要保留图像文件。","o":["正确","错误"]},{"t":"m","q":"以下哪些是HTML标签？（多选）","a":[0,1,2,3],"an":"这些都是HTML语言中的常用标签：<head>设置文档头部，<title>设置网页标题，<body>设置文档主体，<img>插入图像。它们各有不同的功能。","o":["A. <head>","B. <title>","C. <body>","D. <img>"]},{"t":"m","q":"关于HTML标签，以下说法正确的有？（多选）","a":[0,2,3],"an":"HTML标签分为双标签（如<html><\/html>）和单标签（如<img>）。<img>是单标签而非双标签。<h1>设置一级标题，<a>设置超链接，这些说法都是正确的。","o":["A. 标签分为双标签和单标签","B. <img>是双标签","C. <h1>用于设置一级标题","D. <a>用于设置超链接"]},{"t":"m","q":"在网页中显示图像时，以下说法正确的有？（多选）","a":[0,1,2,3],"an":"在网页中显示图像两种方法各有特点：文件路径方式需要保留图像文件在原位置；图像数据编码方式将图像转换为编码文本嵌入HTML中，不需要原始文件。两种方式都能正确显示图像。","o":["A. 可以使用文件路径方式显示","B. 可以使用图像数据编码方式显示","C. 使用编码方式不需要原始图像文件","D. 使用文件路径方式需要保留图像文件"]},{"t":"q","q":"请简述网页与HTML代码之间的关系。","a":"网页背后对应着一堆HTML代码（超文本标记语言代码）。浏览器接收到HTML代码后，按照代码中标签的指示渲染出我们看到的图文并茂的网页效果。HTML代码是网页的\"源代码\"，浏览器是\"翻译器\"，将代码转换为可视化页面。","an":"网页的本质是由HTML代码描述的文档。用户看到的漂亮网页是浏览器对HTML代码解析和渲染后的结果。理解这种关系有助于学习网页制作。"},{"t":"q","q":"请说明双标签和单标签的区别，并各举一个例子。","a":"双标签成对出现，有开始标签和结束标签，如<html>和<\/html>、<p>和<\/p>。单标签只有一个标签，不需要结束标签，如<img>用于插入图像。双标签包围需要标记的内容，单标签通常表示一个独立元素。","an":"区分双标签和单标签是学习HTML的基础。双标签如<h1><\/h1>用于包围标题文字，以标记其格式；单标签如<img>本身就代表一个完整元素，不需要包围其他内容。"},{"t":"q","q":"HTML代码\"<a href='xxx'><\/a>\"的作用是什么？请解释各部分的含义。","a":"<a>标签用于创建超链接。href属性指定链接目标地址（xxx），<a>和<\/a>之间的文字是用户看到的链接显示文字。点击这段文字后，浏览器会跳转到href指定的目标地址。","an":"<a>标签是锚点（anchor）标签，是网页中实现页面跳转和资源链接的核心元素。href是hypertext reference的缩写，用于指定超链接的目标URL。"}],"L17":[{"t":"s","q":"制作网站的基本流程第一步是什么？","a":1,"an":"制作网站的基本流程依次为：确定主题 → 搜集素材 → 确定结构 → 制作网页 → 美化网页 → 发布网站。确定主题是制作网站的起点。","o":["A. 制作网页","B. 确定主题","C. 美化网页","D. 发布网站"]},{"t":"s","q":"制作网站的基本流程中，哪一步在\"确定结构\"之后？","a":1,"an":"制作网站流程为：确定主题 → 搜集素材 → 确定结构 → 制作网页 → 美化网页 → 发布网站。\"确定结构\"之后是\"制作网页\"这一步。","o":["A. 发布网站","B. 制作网页","C. 美化网页","D. 搜集素材"]},{"t":"s","q":"访问网站时默认显示的第一个网页叫什么？","a":0,"an":"访问网站时，默认显示的第一个网页叫作主页（首页）。网站通常包含主页和与之相连的多个子页面，主页是整个网站的入口。","o":["A. 首页（主页）","B. 子页","C. 链接页","D. 目录页"]},{"t":"s","q":"制作网站流程中的\"搜集素材\"指的是什么？","a":1,"an":"\"搜集素材\"是指在确定主题后，围绕主题搜集网站所需要的各种资源（如图片、文字、音视频等），经过挑选和去伪存真，作为制作网页的素材。","o":["A. 确定网站主题","B. 围绕主题搜集所需资源，经挑选后作为制作网页的素材","C. 美化网页外观","D. 确定网页之间的链接关系"]},{"t":"s","q":"以下关于制作网页的方法，哪项是正确的？","a":2,"an":"制作网页有多种方法：可以使用文本编辑工具编写HTML代码，也可以利用在线人工智能模型根据需求自动生成网页。两种方法各有优势，可以根据实际情况选择。","o":["A. 只能用文本编辑工具编写HTML代码","B. 只能使用人工智能模型自动生成","C. 可以用文本编辑工具编写代码，也可以使用AI辅助生成","D. 必须使用专业网页设计软件"]},{"t":"s","q":"制作网站流程中，哪一步骤负责调整网页的显示效果？","a":1,"an":"\"美化网页\"步骤负责用适当方法调整网页的显示效果，使网页外观更加美观大方。在制作网页完成基本结构后，通过美化让网页更具吸引力。","o":["A. 制作网页","B. 美化网页","C. 发布网站","D. 确定结构"]},{"t":"s","q":"确定网站结构时需要考虑哪些因素？","a":0,"an":"确定结构是网站制作的重要环节，需要综合考虑主页设计、导航菜单设计、内容组织方式、页面布局和整体主题风格等多个方面。","o":["A. 主页设计、导航菜单、内容组织、布局和主题风格","B. 仅考虑文字内容","C. 仅考虑图像选择","D. 仅考虑颜色搭配"]},{"t":"s","q":"网站一般由多少个网页组成？","a":2,"an":"网站一般由多个网页组成，这些网页通常围绕同一主题，拥有同类设计风格，通过超链接相互关联，形成一个有机的整体。","o":["A. 只能有1个","B. 只能有2个","C. 通常由多个网页组成","D. 必须有100个以上"]},{"t":"s","q":"发布网站这一步的作用是什么？","a":1,"an":"\"发布网站\"是网站制作的最后一步，需要选择恰当的方式将网站展示出来（如部署到服务器），让其他用户可以通过网络访问该网站。","o":["A. 开始制作网页","B. 选择恰当方式展示网站，让用户可以访问","C. 搜集制作素材","D. 确定网站风格"]},{"t":"s","q":"网站中的网页通常通过什么方式来访问？","a":1,"an":"网站中的网页通常通过网址（统一资源定位符，URL）来访问。用户只需在浏览器地址栏输入网址即可访问对应的网页资源。","o":["A. 直接打开文件","B. 网址（URL）","C. 命令行","D. 输入密码"]},{"t":"j","q":"制作网站的第一步是搜集素材。","a":1,"an":"错误。制作网站的第一步是确定主题，明确要做什么内容的网站。然后才是围绕主题搜集素材。确定主题是整个网站制作的基础。","o":["正确","错误"]},{"t":"j","q":"网站通常包含主页和与之相连的多个子页面。","a":0,"an":"正确。一个完整的网站通常包括主页（首页）和与之相连的其他网页（子页），这些页面通过超链接关联在一起，形成完整的网站结构。","o":["正确","错误"]},{"t":"j","q":"网站中的所有网页都必须有完全不同的设计风格。","a":1,"an":"错误。网站中的多个网页通常围绕同一主题，拥有同类设计风格，以保证用户体验的一致性和网站的整体协调性。","o":["正确","错误"]},{"t":"j","q":"可以利用人工智能模型辅助生成网页代码。","a":0,"an":"正确。除了用文本编辑工具手写HTML代码外，也可以利用在线人工智能模型根据需求自动生成网页，这是科技创新的体现。","o":["正确","错误"]},{"t":"m","q":"制作网站的完整流程包括哪些步骤？（多选）","a":[0,1,2,3],"an":"制作网站的完整流程包括六个步骤：确定主题、搜集素材、确定结构、制作网页、美化网页、发布网站。每个步骤都有其特定的任务和目标。","o":["A. 确定主题","B. 搜集素材","C. 确定结构","D. 制作网页"]},{"t":"m","q":"关于网站和网页，以下说法正确的有？（多选）","a":[0,1,2,3],"an":"以上说法都正确。网页由HTML编写，网站包含多个网页，网页通过URL访问，访问网站时默认显示的第一个页面是主页。这些都是网站和网页的基本特征。","o":["A. 网页主要由HTML语言编写而成","B. 网站一般由多个网页组成","C. 网站中的网页通过网址访问","D. 默认显示的第一个网页叫主页"]},{"t":"m","q":"制作网页可以选用以下哪些方法？（多选）","a":[0,1,2],"an":"制作网页有多种方法可选：手写HTML代码（文本编辑器）、利用AI辅助生成、使用专业网页设计工具等。没有唯一的方法，可以根据需要灵活选择。","o":["A. 用文本编辑工具编写HTML代码","B. 利用在线人工智能模型生成","C. 使用专业网页设计工具","D. 只能手写代码"]},{"t":"q","q":"请按顺序列出制作网站的六个步骤。","a":"1. 确定主题 — 明确网站的内容方向。2. 搜集素材 — 围绕主题搜集所需资源。3. 确定结构 — 规划主页、导航、布局和风格。4. 制作网页 — 用工具软件制作网页。5. 美化网页 — 调整网页的显示效果。6. 发布网站 — 选择恰当方式展示网站。","an":"这六个步骤构成了网站制作的完整流程。每个步骤都有明确的目标和任务，按照顺序执行可以高效、规范地完成网站制作。"},{"t":"q","q":"请说明人工智能在网页制作中可能发挥的作用。","a":"人工智能可以在网页制作中发挥以下作用：1. 根据需求描述自动生成网页代码；2. 帮助解读已有的HTML代码，解释每段代码的功能；3. 回答网页制作中的疑问，如如何使图像保持大小一致；4. 辅助初学者快速入门，降低网页制作的技术门槛。","an":"AI辅助网页制作是科技创新的体现。通过AI，初学者可以更快地完成网页制作，并在与AI互动中学习HTML知识。但AI生成的结果仍需人工检查和完善。"},{"t":"q","q":"在制作网站过程中，\"确定结构\"步骤需要做哪些具体工作？","a":"确定结构时需要做以下工作：1. 确定主页（首页）的设计和内容；2. 规划导航菜单的结构和各个菜单项；3. 设计网站内容的组织方式；4. 规划页面的整体布局；5. 确定网站的主题风格和色调。","an":"\"确定结构\"是网站制作的蓝图阶段，良好的结构规划能使后续的网页制作更加顺畅，避免后期大量修改。这就像盖房子前需要先画设计图一样重要。"}],"L18":[{"t":"s","q":"CSS的全称是什么？","a":1,"an":"CSS全称为Cascading Style Sheets（串联样式表/层叠样式表），生活中也常被称为级联样式表。它用于描述网页等文档的外观和格式。","o":["A. Computer Style System","B. Cascading Style Sheets","C. Creative Style Software","D. Common Style Settings"]},{"t":"s","q":"CSS的基本语法结构中，用于指定需要改变样式的HTML元素的部分叫？","a":2,"an":"CSS基本语法结构为：选择器 { 属性: 值; }。选择器用于指定需要改变样式的HTML元素（如p、h1），后面的大括号内包含声明（属性和值的组合）。","o":["A. 声明","B. 属性","C. 选择器","D. 值"]},{"t":"s","q":"在HTML中，使用<font>标签的color属性设置文本颜色，颜色值使用什么表示？","a":2,"an":"HTML中设置颜色使用十六进制颜色值，格式为#RRGGBB（RR为红色，GG为绿色，BB为蓝色）。如<font color=\"#FF0000\">设置红色文字。","o":["A. 十进制数字","B. 颜色名称英文单词","C. 十六进制颜色值（#RRGGBB）","D. 二进制编码"]},{"t":"s","q":"CSS中用于设置文本颜色的属性是？","a":2,"an":"CSS中color属性用于设置文本颜色（如{color:#FF0000;}），background-color设置背景颜色，font-size设置文字大小，text-align设置文本对齐方式。","o":["A. font-size","B. background-color","C. color","D. text-align"]},{"t":"s","q":"CSS中用于设置段落首行缩进的属性是？","a":1,"an":"text-indent属性用于设置段落中首行文本的缩进，如{text-indent:2em;}表示首行缩进两个字符的宽度。text-align设置文本对齐方式。","o":["A. text-align","B. text-indent","C. font-size","D. margin"]},{"t":"s","q":"CSS中用于设置文本居中对齐的属性值是？","a":2,"an":"text-align属性有三个可选值：left（左对齐）、right（右对齐）、center（居中对齐）。如{text-align:center;}使文本居中显示。","o":["A. left","B. right","C. center","D. justify"]},{"t":"s","q":"以下关于HTML美化与CSS美化的比较，正确的是？","a":2,"an":"用HTML代码（如<font>标签）进行美化，美化效果往往很有限，且操作非常烦琐。实际应用中，人们经常用CSS来美化网页，CSS能够更系统、更灵活地控制网页外观。","o":["A. HTML美化效果丰富，操作简单","B. CSS美化效果有限，操作烦琐","C. HTML美化效果有限且操作烦琐，CSS能更好地控制样式","D. 两者完全相同"]},{"t":"s","q":"如果将HTML比作建造房屋的\"建筑师\"，那么CSS可以比作什么？","a":2,"an":"HTML代码负责搭建网页的结构（如同建造房屋），而CSS负责装饰和美化的任务（如同装潢设计师），控制网页的颜色、字体、宽度、高度等外观属性。","o":["A. \"地基\"","B. \"建筑材料\"","C. \"装潢设计师\"","D. \"验收人员\""]},{"t":"s","q":"内部样式CSS代码应放置在HTML文档的哪个标签中？","a":1,"an":"内部样式CSS代码应放在<head>标签中的<style><\/style>标签内。浏览器读取页面时会先加载这些样式，然后应用到页面元素的渲染中。","o":["A. <body>中","B. <head>中的<style>标签内","C. <title>中","D. <img>标签中"]},{"t":"s","q":"CSS中font-family属性的作用是什么？","a":1,"an":"font-family属性用于设置文本的字体（如\"楷体\"、\"黑体\"等），font-size设置文字大小，color设置文字颜色。","o":["A. 设置文字大小","B. 设置文字字体","C. 设置文字颜色","D. 设置文字对齐"]},{"t":"j","q":"CSS（串联样式表）可以描述网页的外观和格式。","a":0,"an":"正确。CSS（Cascading Style Sheets）专门用于描述网页等文档的外观和格式，可以控制HTML标签内容的颜色、字体、宽度、高度等显示属性。","o":["正确","错误"]},{"t":"j","q":"用HTML代码的美化效果比CSS更好更便捷。","a":1,"an":"错误。恰恰相反，用HTML代码进行美化效果往往很有限且操作烦琐，而CSS能够更系统、更灵活地控制网页外观，是现代网页设计的标准方法。","o":["正确","错误"]},{"t":"j","q":"CSS中{color:#FF0000;}表示设置文本颜色为红色。","a":0,"an":"正确。#FF0000在十六进制颜色表示法中代表红色（红色分量FF=255，绿色和蓝色分量均为0）。","o":["正确","错误"]},{"t":"j","q":"background-color属性用于设置文本颜色。","a":1,"an":"错误。background-color用于设置元素的背景颜色，设置文本颜色应使用color属性。这是两个不同的CSS属性，功能不同。","o":["正确","错误"]},{"t":"m","q":"以下哪些是CSS中常用的属性？（多选）","a":[0,1,2,3],"an":"color（文本颜色）、font-size（文字大小）、background-color（背景颜色）和text-align（文本对齐）都是CSS中常用的基本属性，用于控制网页元素的显示效果。","o":["A. color","B. font-size","C. background-color","D. text-align"]},{"t":"m","q":"以下CSS属性与功能的匹配，正确的有？（多选）","a":[0,1,2],"an":"font-family设置字体，font-size设置字号，text-indent设置首行缩进，这些都是正确的。但color设置的是文本颜色而非背景颜色，设置背景颜色应使用background-color。","o":["A. font-family — 设置字体","B. font-size — 设置字号","C. text-indent — 设置首行缩进","D. color — 设置背景颜色"]},{"t":"m","q":"使用HTML代码美化网页时，可以设置以下哪些效果？（多选）","a":[0,1,2],"an":"HTML标签和属性可以设置文本颜色（<font color>）、背景颜色（<body bgcolor>）和文本对齐（<p align>）。但CSS选择器批量控制样式是CSS的功能，不属于HTML代码美化的范畴。","o":["A. 使用<font>标签设置文本颜色","B. 使用<body bgcolor>设置背景颜色","C. 使用<p align>设置文本对齐","D. 使用CSS选择器批量控制样式"]},{"t":"q","q":"请写出CSS的基本语法结构，并说明各部分的作用。","a":"CSS基本语法结构为：选择器 { 属性: 值; }。其中：选择器用于指定需要改变样式的HTML元素（如p、h1）；属性是需要改变的样式类型（如color、font-size）；值是该属性的具体设置（如#FF0000、14px）。多个声明用分号分隔，整体放在大括号中。","an":"CSS语法结构简单但功能强大。通过选择器可以精确指定需要美化的元素，通过属性-值对可以灵活控制各种样式，实现了网页结构与样式的分离。"},{"t":"q","q":"为什么人们常用CSS而不是HTML标签和属性来美化网页？","a":"1. HTML标签美化效果有限，操作烦琐，每个元素都要单独设置。2. CSS可以批量控制同类元素的样式，修改一处即可影响所有相关元素。3. CSS实现了内容与样式的分离，代码更清晰。4. CSS支持更丰富的样式效果，如动画、渐变等。5. CSS便于统一管理和维护网站的整体风格。","an":"CSS的优势在于样式与结构分离。当需要修改整个网站的某类元素样式（如所有段落字体）时，只需修改CSS中的一处代码，而不需要在每个HTML标签中逐一修改，效率极大提升。"},{"t":"q","q":"请列举至少四个CSS常用属性及其作用。","a":"1. color：设置文本颜色，如{color:#FF0000;}。2. font-family：设置文本字体，如{font-family:楷体;}。3. font-size：设置文本大小，如{font-size:14px;}。4. background-color：设置背景颜色，如{background-color:#0000FF;}。5. text-align：设置文本对齐（left/right/center）。6. text-indent：设置首行缩进，如{text-indent:2em;}。","an":"掌握这些基本CSS属性是美化网页的基础。通过合理组合使用这些属性，可以显著改善网页的视觉效果和用户体验。"}],"L19":[{"t":"s","q":"多人协同制作网页的主要优势不包括以下哪项？","a":3,"an":"多人协同制作网页的优势包括：实时协作提高效率、分工协作提高质量、实时获得反馈及时修改、相互学习借鉴等。但多人协同反而需要更多沟通来协调工作，而不是减少沟通需求。","o":["A. 提高制作效率","B. 提高制作质量","C. 实时获得反馈","D. 减少沟通需求"]},{"t":"s","q":"为什么HTML不太适合多人协同编辑？","a":1,"an":"HTML语言标签繁多，很多成对标签分散在文稿不同区域，多人同时编辑HTML代码容易出现冲突和错位。因此多人协同制作场景需要更简洁的标记语言如Markdown。","o":["A. HTML标签太简单","B. HTML标签繁多，成对标签分散在不同区域，容易冲突和错位","C. HTML无法显示文字","D. HTML不支持中文"]},{"t":"s","q":"Markdown语言的特点是什么？","a":1,"an":"Markdown语言是一种轻量级标记语言，语法简洁明了，易于阅读和编写。相比HTML标签繁多的情况，Markdown更适合多人协同编辑的场景。","o":["A. 标签繁多","B. 语法简洁，易于阅读和编写","C. 只能用于编写代码","D. 不支持表格"]},{"t":"s","q":"在Markdown中，用什么符号表示一级标题？","a":1,"an":"Markdown中，使用#表示一级标题（对应HTML中的<h1>），##表示二级标题（对应<h2>），以此类推。星号*用于斜体，减号-用于无序列表。","o":["A. *","B. #","C. -","D. >"]},{"t":"s","q":"在Markdown中，用什么符号表示加粗文字？","a":1,"an":"Markdown中用**文字**表示加粗（对应HTML中的<strong>），用*文字*表示斜体（对应<em>），用***文字***表示粗斜体。","o":["A. *文字*","B. **文字**","C. #文字#","D. ~文字~"]},{"t":"s","q":"在Markdown中，用什么语法插入图像？","a":1,"an":"Markdown中插入图像的语法为：![图像描述](图像地址)。其中!表示这是图像，方括号内是图像描述文字，圆括号内是图像的地址或路径。","o":["A. [图像描述](图像地址)","B. ![图像描述](图像地址)","C. <img>(图像地址)","D. {图像描述}(图像地址)"]},{"t":"s","q":"在Markdown中，用什么表示斜体文字？","a":1,"an":"Markdown中*斜体*表示斜体文字（对应HTML中的<em>）。**粗体**表示粗体（对应<strong>），***粗斜体***表示既粗又斜的文字。","o":["A. **文字**","B. *文字*","C. __文字__","D. --文字--"]},{"t":"s","q":"协同制作网页时，应选择什么类型的编辑工具？","a":1,"an":"\"工欲善其事，必先利其器。\"对于多人协同制作网页这一任务，《记事本》等单机软件显然不适合，应采用支持多人在线编辑文档的工具，才能高效协同。","o":["A. 单机版《记事本》软件","B. 支持多人在线编辑文档的工具","C. 只能一个人使用的软件","D. 不需要联网的工具"]},{"t":"s","q":"Markdown中的表格创建使用什么符号分隔列？","a":1,"an":"Markdown中使用竖线（|）分隔表格的列，使用减号（-）创建表头分隔线。如：| 标题1 | 标题2 |，然后 | ------ | ------ | 分隔。","o":["A. 逗号","B. 竖线（|）","C. 分号","D. 空格"]},{"t":"s","q":"Markdown文件可以通过什么方式转换成网页文件？","a":1,"an":"Markdown文件可以通过协作平台或工具的转换功能转换为网页文件，也可以利用在线人工智能模型学习转换方法。Markdown的设计目标之一就是能方便地转换为HTML。","o":["A. 直接重命名为.html","B. 利用协作平台的转换功能或相关软件","C. 只能手动重新编写","D. Markdown不能转换为网页"]},{"t":"j","q":"多人协同制作网页比单人制作效率更高。","a":0,"an":"正确。多人协作通常能有效加快制作进程，可以实时协作提高效率，负责不同部分进一步提高质量，还能实时获得反馈和相互学习。","o":["正确","错误"]},{"t":"j","q":"HTML比Markdown更适合多人协同编辑制作网页。","a":1,"an":"错误。HTML标签繁多且成对标签分散，多人同时编辑容易出现冲突和错位。Markdown语法更简洁，更适合多人协同编辑的场景，可以完成后再转换为HTML。","o":["正确","错误"]},{"t":"j","q":"Markdown中***文字***表示粗斜体效果。","a":0,"an":"正确。Markdown中***粗斜体***同时使用了三个星号，表示既粗体又斜体的文字效果，对应HTML中的<strong><em>粗斜体<\/em><\/strong>。","o":["正确","错误"]},{"t":"j","q":"Markdown语言不支持创建表格。","a":1,"an":"错误。Markdown语言支持创建表格，使用竖线（|）分隔列，减号（-）创建表头，还可以设置表格的对齐格式（左对齐、居中、右对齐）。","o":["正确","错误"]},{"t":"m","q":"多人协同制作网页的优势包括？（多选）","a":[0,1,2,3],"an":"多人协同制作网页有四大优势：实时协作提高效率、分工提高质量、实时获得反馈便于修改、相互学习借鉴丰富知识与技能。这些都是协同工作的价值所在。","o":["A. 实时协作提高制作效率","B. 分工不同的部分提高制作质量","C. 实时获得团队反馈","D. 可以相互学习和借鉴"]},{"t":"m","q":"以下哪些是Markdown语言的常用语法？（多选）","a":[0,1,2,3],"an":"这些都是Markdown的常用语法：#设置标题级别，**文字**设置加粗，*文字*设置斜体，![描述](地址)插入图像。Markdown语法简洁直观。","o":["A. # 表示标题","B. **文字** 表示加粗","C. *文字* 表示斜体","D. ![描述](地址) 表示插入图像"]},{"t":"m","q":"关于Markdown和HTML的关系，以下说法正确的有？（多选）","a":[0,1],"an":"Markdown可以方便地转换为HTML网页文件，且语法比HTML更简洁。但HTML标签分散，不利于多人协同编辑；关于计算结果式，Markdown可以利用文本描述自动转换显示。","o":["A. Markdown可以转换为HTML","B. Markdown语法比HTML更简洁","C. HTML代码更易于多人协同编辑","D. Markdown语法比HTML更适合展示计算结果式"]},{"t":"q","q":"请列举Markdown语言相比于HTML的主要优势。","a":"1. 语法简洁：用简单的符号（如#、*）代替复杂的HTML标签。2. 易于阅读：纯文本格式，即使不渲染也能直接阅读。3. 便于协同：标签结构简单，多人编辑不易冲突。4. 转换方便：可以轻松转换为HTML网页文件。5. 学习成本低：比HTML更容易入门。","an":"Markdown的设计哲学是\"易读易写\"。它牺牲了一些HTML的表达能力，换来了更好的可读性和可维护性，特别适合内容创作为主的场景。"},{"t":"q","q":"请将以下Markdown代码翻译成对应的HTML代码：# 标题、**加粗**、*斜体*","a":"Markdown代码\"# 标题\"对应HTML的<h1>标题<\/h1>；\"**加粗**\"对应<strong>加粗<\/strong>；\"*斜体*\"对应<em>斜体<\/em>。Markdown用简洁的符号实现了HTML需要多个标签才能完成的效果。","an":"通过这个对比可以清楚看到Markdown的简洁性。HTML需要打开和关闭标签来标记内容，而Markdown只需在文字前后添加简单符号即可，大大简化了写作过程。"},{"t":"q","q":"为什么多人协同制作网页需要选择合适的工具？应选择什么样的工具？","a":"《记事本》等单机工具不适合多人协同，因为无法实时共享编辑内容。应选择支持多人在线实时编辑文档的工具（如在线协作文档平台），这类工具允许多人同时编辑同一文档、实时看到他人的修改，避免冲突和重复工作，显著提高协同效率。","an":"\"工欲善其事，必先利其器\"——选择合适的工具是多人在线协作成功的关键。理想的协作工具应支持实时同步、版本管理、权限控制等功能，使团队成员能够高效地共同完成任务。"}],"L20":[{"t":"s","q":"在HTML中，用于设置超链接的标签是？","a":1,"an":"<a><\/a>标签（anchor）是超链接标签，通过href属性指定链接目标地址。文本超链接格式为：<a href=\"链接地址\">显示文字<\/a>。","o":["A. <link>","B. <a>","C. <href>","D. <url>"]},{"t":"s","q":"以下哪个是正确的文本超链接代码？","a":0,"an":"文本超链接的正确格式为：<a href=\"链接地址\">显示文字<\/a>。其中<a>是超链接标签，href属性指定目标地址，标签之间的文字是用户看到的可点击文本。","o":["A. <a href=\"page1.html\">点击这里<\/a>","B. <link href=\"page1.html\">点击这里<\/link>","C. <href=\"page1.html\">点击这里<\/href>","D. <url href=\"page1.html\">点击这里<\/url>"]},{"t":"s","q":"以下哪个是正确的图像超链接代码？","a":1,"an":"图像超链接的正确格式为：<a href=\"链接地址\"><img src=\"图像地址\"><\/a>。即将<img>标签嵌套在<a>标签内，使图像成为一个可点击的超链接。","o":["A. <img href=\"链接地址\" src=\"图像地址\">","B. <a href=\"链接地址\"><img src=\"图像地址\"><\/a>","C. <a src=\"图像地址\"><img href=\"链接地址\"><\/a>","D. <link src=\"图像地址\" href=\"链接地址\">"]},{"t":"s","q":"一个完整的网站通常包括什么？","a":1,"an":"一个完整的网站通常包括主页（首页）和与之相连的其他网页。主页是网站的入口，子页面通过超链接与主页关联，形成完整的网站结构。","o":["A. 只有一个网页","B. 主页和与之相连的其他网页","C. 只有文字没有图像","D. 只需图片不需要文字"]},{"t":"s","q":"网站评测需要关注哪些方面？","a":0,"an":"网站评测应综合考虑文字准确性、图像呈现、链接正确性、页面布局合理性和内容健康性等多个方面，确保网站质量。","o":["A. 文字准确无误、图像呈现恰当、链接跳转正确、布局合理、内容健康","B. 只关注文字","C. 只关注图像","D. 只关注链接"]},{"t":"s","q":"超链接标签中href属性的作用是什么？","a":1,"an":"在<a>标签中，href（hypertext reference）属性用于指定超链接的目标地址，即用户点击后要跳转到的URL。显示文字写在<a>和<\/a>之间。","o":["A. 设置链接显示文字","B. 指定链接目标地址","C. 设置链接颜色","D. 设置链接图片"]},{"t":"s","q":"使用《简易万维网服务器》软件展示网站时，需要把什么放在软件所在文件夹中？","a":1,"an":"使用《简易万维网服务器》软件时，需要把包含网页文件的Web文件夹移到该软件所在的文件夹中，然后启动服务器即可通过浏览器访问网站。","o":["A. 操作系统","B. Web文件夹（包含网页文件）","C. 编译器软件","D. 数据库文件"]},{"t":"s","q":"关于《未成年人网络保护条例》的规定，以下说法正确的是？","a":1,"an":"《未成年人网络保护条例》规定，网络服务提供者为未成年人提供信息发布等服务时，应依法要求未成年人或其监护人提供真实身份信息，以保护未成年人的网络安全。","o":["A. 未成年人可以随意发布信息","B. 网络服务提供者应为未成年人提供信息发布服务时，应要求提供真实身份信息","C. 该条例与网站建设无关","D. 未成年人无需遵守任何网络规定"]},{"t":"s","q":"将分散的网页组织成一个完整网站的核心技术是什么？","a":1,"an":"超链接是将分散的网页关联起来形成完整网站的核心技术。通过设置页面之间的超链接（包括文本链接和图像链接），用户在浏览时可以在各个页面之间自由跳转。","o":["A. 数据库","B. 超链接","C. 图像处理","D. 文字排版"]},{"t":"s","q":"代码<a href=\"index.html\">返回主页<\/a>的作用是？","a":1,"an":"这是一个文本超链接，点击\"返回主页\"文字后，浏览器会跳转到href属性指定的目标页面index.html。这是网站导航中最常用的技术。","o":["A. 显示一张图片","B. 点击\"返回主页\"文字后跳转到index.html","C. 打开新的浏览器窗口","D. 关闭当前页面"]},{"t":"j","q":"<a><\/a>标签是用于设置超链接的HTML标签。","a":0,"an":"正确。<a><\/a>（anchor）标签专门用于设置超链接，通过href属性指定目标地址，可以创建文本链接和图像链接。","o":["正确","错误"]},{"t":"j","q":"网站评测时只需要检查链接是否正确，不需要关注内容质量。","a":1,"an":"错误。网站评测需要综合考虑多个因素：文字准确性、图像呈现、链接正确性、页面布局合理性和内容健康性等，不能只关注一个方面。","o":["正确","错误"]},{"t":"j","q":"一个完整的网站只包含一个主页，不需要其他子页面。","a":1,"an":"错误。完整的网站通常包括主页和与之相连的多个子网页，各个页面通过超链接关联在一起，组成一个有组织的内容体系。","o":["正确","错误"]},{"t":"j","q":"图像超链接和文本超链接都使用<a>标签实现。","a":0,"an":"正确。无论文本超链接还是图像超链接，都使用<a>标签。文本超链接在<a>标签内写文字，图像超链接在<a>标签内嵌入<img>标签。","o":["正确","错误"]},{"t":"m","q":"网站评测需要检查的条目包括？（多选）","a":[0,1,2,3],"an":"网站评测需要检查：文字准确性、图像呈现效果、链接跳转正确性、页面布局合理性以及内容健康积极性。这些都是确保网站质量的重要方面。","o":["A. 文字准确无误","B. 图像呈现恰当","C. 链接跳转正确","D. 内容健康、积极向上"]},{"t":"m","q":"以下哪些是正确的超链接代码？（多选）","a":[0,1,2],"an":"A和C是正确的文本超链接格式，B是正确的图像超链接格式。D的错误在于<img>标签使用href属性不正确，href应写在<a>标签中。","o":["A. <a href=\"page1.html\">文本链接<\/a>","B. <a href=\"index.html\"><img src=\"pic.jpg\"><\/a>","C. <a href=\"page2.html\">跳转到第二页<\/a>","D. <img href=\"page.html\" src=\"pic.jpg\">"]},{"t":"m","q":"关于网站展示和发布，以下说法正确的有？（多选）","a":[0,1,2,3],"an":"展示网站有多种方式：使用简易服务器软件、将网页放在指定文件夹中、利用单板计算机作为服务器等。发布网站是网站制作流程的最后一步，将网站部署到可访问的环境中。","o":["A. 可以使用简易万维网服务器软件展示网站","B. 网页文件需要放在服务器指定的文件夹中","C. 单板计算机也能作为服务器展示网站","D. 发布网站是制作网站的最后一步"]},{"t":"q","q":"请写出文本超链接和图像超链接的HTML代码格式。","a":"文本超链接：<a href=\"链接地址\">显示文字<\/a>。图像超链接：<a href=\"链接地址\"><img src=\"图像地址\"><\/a>。两者都使用<a>标签，文本超链接在标签内写文字，图像超链接在标签内嵌入<img>标签。","an":"超链接是网站组织的核心技术。通过设置页面之间的超链接，可以将分散的各个网页关联起来，形成用户可以自由浏览的完整网站。掌握文本和图像两种超链接的写法是组建网站的基础。"},{"t":"q","q":"请说明网站评测时应关注哪些方面。","a":"1. 文字准确无误：检查是否有错别字或错误信息。2. 图像呈现恰当：确认所有图像正常显示，效果良好。3. 链接跳转正确：验证所有超链接指向正确的目标。4. 页面布局符合阅读习惯：排版清晰合理。5. 内容健康、积极向上：符合网络文明和安全要求。","an":"网站评测是发布前的质量把关环节。通过全面检查文字、图像、链接、布局和内容，可以及时发现并修正问题，确保网站的可用性和专业性。"},{"t":"q","q":"如何将分散的各个网页组织成一个完整的网站？","a":"使用超链接将各个网页关联起来。具体做法：1. 确保有主页作为网站入口。2. 在主页上设置指向各子页面的超链接（文本链接或图像链接）。3. 各子页面也设置返回主页和其他相关页面的超链接。4. 实现页面之间的自由导航，形成完整的网状结构。5. 测试所有链接确保跳转正确。","an":"超链接是万维网的灵魂，通过在不同页面之间建立链接关系，原本分散的网页就能组织成一个有机的整体。用户在浏览时可以在页面间自由跳转，获得完整的网站使用体验。"}],"L21":[{"t":"s","q":"移动通信从1G到5G的演进中，1G主要提供什么业务？","a":1,"an":"1G（第一代移动通信网）主要提供语音业务，只能进行模拟语音通话。","o":["A. 高速上网","B. 语音业务","C. 视频通话","D. 物联网连接"]},{"t":"s","q":"进入2G时代后，人们除了语音通话外，还可以进行什么操作？","a":1,"an":"进入2G后，人们不仅可以语音通话、收发短信，还可以进行简单的网络操作，移动通信功能开始丰富。","o":["A. 高清视频直播","B. 收发短信和简单网络操作","C. 自动驾驶","D. 虚拟现实体验"]},{"t":"s","q":"推动移动互联网快速发展的关键因素是？","a":0,"an":"大力推广3G时，各种智能手机随之出现，网速的提升和移动设备性能的提高，使得移动互联网快速发展。","o":["A. 3G网络普及和智能手机出现","B. 有线电话普及","C. 电视机普及","D. 收音机普及"]},{"t":"s","q":"5G每平方千米最大可支持多少个设备同时在线？","a":3,"an":"5G的容纳能力更强，每平方千米最大可支持100万个设备同时在线。","o":["A. 1万个","B. 10万个","C. 50万个","D. 100万个"]},{"t":"s","q":"利用计算机及网络等新技术，对传统媒体产生质变的新传播模式被称为？","a":2,"an":"新媒体泛指利用计算机及网络等新技术，对传统媒体形式、内容及类型所产生的质变，是第五媒体。","o":["A. 报纸媒体","B. 广播媒体","C. 新媒体","D. 电视媒体"]},{"t":"s","q":"自媒体的重要特征是什么？","a":1,"an":"自媒体一般认为具有人人是通信员，个个是传播者这一重要特征，任何使用互联网的用户都可以成为自媒体的发布者和参与者。","o":["A. 只能由专业机构运营","B. 人人是通信员，个个是传播者","C. 只能发布文字内容","D. 不需要互联网支持"]},{"t":"s","q":"1GB的文件在5G网络下大约需要多长时间传输完毕？","a":1,"an":"5G的传输速度非常快，1GB的文件可以在一两秒内传输完毕。","o":["A. 几分钟","B. 一两秒","C. 几小时","D. 几十秒"]},{"t":"s","q":"以下哪项不属于新媒体的特点？","a":2,"an":"新媒体具有数字化、互动性、超文本、虚拟性、网络化、模拟性的特点。单向传播是传统媒体的特点。","o":["A. 数字化","B. 互动性","C. 单向传播","D. 超文本"]},{"t":"s","q":"5G的低时延特性在哪个领域具有巨大应用前景？","a":2,"an":"5G的数据交换更及时（低时延），在自动驾驶等方面具有巨大应用前景，因为自动驾驶需要实时决策。","o":["A. 短信收发","B. 语音通话","C. 自动驾驶","D. 报纸印刷"]},{"t":"s","q":"以下关于自媒体的描述，错误的是？","a":2,"an":"自媒体的过程也引发了很多问题，发布的信息不一定都是真实的，需要加强管理。国家出台了《关于加强\"自媒体\"管理的通知》。","o":["A. 可由个人或团队独立运作","B. 包括博客、微博、微信等形式","C. 发布的信息一定都是真实的","D. 观众可通过点赞和评论参与互动"]},{"t":"j","q":"1G移动通信已经可以支持高速上网和视频通话。","a":1,"an":"错误。1G主要提供语音业务，只能进行模拟语音通话，无法支持高速上网和视频通话。","o":["正确","错误"]},{"t":"j","q":"5G具有高速、低时延、容量大等特点。","a":0,"an":"正确。5G是目前实际使用的最先进的移动通信技术，具有高速、低时延、容量大等特点。","o":["正确","错误"]},{"t":"j","q":"新媒体就是传统的报纸、杂志、广播、电视。","a":1,"an":"错误。新媒体是报纸、杂志、广播、电视之外的第五媒体，是利用计算机及网络新技术产生的新传播模式。","o":["正确","错误"]},{"t":"j","q":"任何人都可以成为自媒体的发布者和参与者。","a":0,"an":"正确。自媒体具有人人是通信员，个个是传播者的重要特征，任何能够使用互联网的用户都可以参与。","o":["正确","错误"]},{"t":"m","q":"5G技术的主要特点包括？（多选）","a":[0,1,2],"an":"5G具有高速、低时延、容量大三大特点，是当前最先进的移动通信技术。D项错误，仅支持语音是1G的特征。","o":["A. 高速率","B. 低时延","C. 容量大","D. 仅支持语音"]},{"t":"m","q":"新媒体的特点包括？（多选）","a":[0,1,2,3],"an":"新媒体具有数字化、互动性、超文本、虚拟性、网络化、模拟性六大特点，全部选项正确。","o":["A. 数字化","B. 互动性","C. 超文本","D. 虚拟性"]},{"t":"m","q":"以下属于自媒体形式的有？（多选）","a":[0,1,2,3],"an":"自媒体包括但不限于博客、微博、微信等形式，短视频平台也是重要的自媒体形式，全部选项正确。","o":["A. 博客","B. 微博","C. 微信","D. 短视频平台"]},{"t":"q","q":"请简述从1G到5G移动通信技术的主要演进过程。","a":"1G主要提供语音业务（模拟通话）；2G可语音通话、收发短信、进行简单网络操作；3G智能手机出现，网速提升，移动互联网快速发展；4G进一步提速，移动应用更加丰富；5G具有高速、低时延、容量大等特点，推动自动驾驶、物联网等新应用。","an":"移动通信技术从1G到5G不断演进，每一代都有显著的技术突破和应用拓展，推动移动互联网深刻改变社会生活。"},{"t":"q","q":"什么是新媒体？它与传统媒体有何不同？","a":"新媒体是第五媒体，泛指利用计算机及网络等新技术对传统媒体产生质变的新传播模式，具有数字化、互动性、超文本、虚拟性、网络化、模拟性等特点。与传统媒体（报纸、杂志、广播、电视）相比，新媒体实现了从单向传播到双向互动的转变。","an":"新媒体是数字技术在信息传播媒体中的应用所产生的新的传播模式，核心区别在于互动性和数字化。"},{"t":"q","q":"什么是自媒体？它有哪些重要特征？","a":"自媒体指由公众个人或团队独立运作，用以发布、分享具有一定公共价值信息的传播载体。重要特征包括：(1)人人是通信员，个个是传播者，任何互联网用户都可以成为发布者和参与者；(2)观众可通过点赞、评论等方式参与互动；(3)形式多样，包括博客、微博、微信、短视频等。但这一过程也引发了很多问题，需要加强管理。","an":"理解自媒体人人参与的特征，同时也要认识到其可能带来的信息真实性等问题。"}],"L22":[{"t":"s","q":"在线学习突破了传统线下学习的什么限制？","a":2,"an":"在线学习可以突破时间、空间和人数限制，学习者不再受物理教室和固定课表的约束。","o":["A. 只突破时间限制","B. 只突破空间限制","C. 突破了时间、空间和人数限制","D. 没有突破任何限制"]},{"t":"s","q":"互联网中的学习资源具有什么特点？","a":1,"an":"互联网中的学习资源具有数量大、类型多、更新快等特点，包括文本、图像、视频、音频等多种形式。","o":["A. 数量大、类型多、更新慢","B. 数量大、类型多、更新快","C. 数量少、类型单一","D. 仅限文字和图片"]},{"t":"s","q":"以下哪项不属于在线学习资源的类型？","a":3,"an":"在线学习资源类型丰富，包括课程平台、虚拟实验平台、视频平台、在线数据库和图书馆等。D项不属于在线资源。","o":["A. 在线课程和课件","B. 虚拟实验室","C. 在线数据库和图书馆","D. 只能线下使用的教材"]},{"t":"s","q":"根据2023年2月数据，我国已基本建成世界第几大教育教学资源库？","a":2,"an":"截至2023年2月，国家中小学智慧教育平台等已基本建成世界第一大教育教学资源库。","o":["A. 第二","B. 第三","C. 第一","D. 第四"]},{"t":"s","q":"2023年我国中小学互联网接入率达到多少？","a":3,"an":"全国中小学（含教学点）互联网接入率达到100%，比2012年提高了75个百分点。","o":["A. 75%","B. 90%","C. 99%","D. 100%"]},{"t":"s","q":"在线学习平台可以根据什么提供个性化学习内容？","a":1,"an":"在线学习平台可以根据学习者的学习兴趣、学习行为和学习习惯，提供个性化的学习内容，实现量身定制的学习。","o":["A. 所有学生的统一需求","B. 学习兴趣、学习行为和学习习惯","C. 教师的个人喜好","D. 随机推荐"]},{"t":"s","q":"以下哪项是在线教育实践中暴露的突出问题？","a":0,"an":"大规模在线教育暴露出网络运行保障能力不足、体系化的优质数字教育资源不足、教师信息技术应用能力不足等突出问题。","o":["A. 网络运行保障能力不足","B. 优质数字教育资源充足","C. 教师信息技术应用能力很强","D. 师生互动和情感交流很充分"]},{"t":"s","q":"通过人工智能模型答疑解惑进行学习，正确的态度是？","a":2,"an":"人工智能模型不是万能的，它给出的答案需要人进行甄别。通过向AI提问是新型学习方式，但不能盲目相信。","o":["A. 完全依赖AI，不需要自己思考","B. AI给出的答案一定正确","C. AI可以帮助学习，但答案需要甄别","D. AI对学习没有任何帮助"]},{"t":"s","q":"在线学习时如何保证学习效率，抵御网络不良诱惑？","a":1,"an":"保证在线学习效率需要从设定目标和计划、养成良好学习习惯、培养自控能力、寻求外部支持等方面入手。","o":["A. 完全不使用网络","B. 设定目标和计划、培养自控能力","C. 随意浏览，不加控制","D. 只能在学校学习"]},{"t":"s","q":"2013年的天宫课堂活动体现了在线学习的什么优势？","a":1,"an":"天宫课堂太空授课体现了在线学习突破空间限制的优势，让全国各地的学生都能共享优质教育内容。","o":["A. 优质教师资源可在任何地方上课","B. 太空授课突破空间限制让全国学生共享","C. 只能在太空学习","D. 在线学习只在天上有效"]},{"t":"j","q":"在线学习可以突破时间、空间和人数限制。","a":0,"an":"正确。在线学习三大突破：突破时间限制（随时学习）、突破空间限制（随地学习）、突破人数限制（大规模同时学习）。","o":["正确","错误"]},{"t":"j","q":"互联网学习资源类型单一，只有文字资料。","a":1,"an":"错误。互联网学习资源类型丰富多样，包括文本、图像、视频、音频、在线课程、虚拟实验室、在线数据库等多种类型。","o":["正确","错误"]},{"t":"j","q":"在线学习平台通常还提供实时学习反馈，帮助学习者调整学习。","a":0,"an":"正确。在线学习平台通常会提供实时的学习反馈，帮助学习者有针对性地进行调整，以提高学习效率。","o":["正确","错误"]},{"t":"j","q":"向人工智能模型提问就一定可以获得正确答案。","a":1,"an":"错误。人工智能模型不是万能的，它给出的答案不一定完全正确，需要人进行甄别和判断。","o":["正确","错误"]},{"t":"m","q":"在线学习的主要变革包括？（多选）","a":[0,1,2],"an":"在线学习三大变革：突破时空和人数限制、提供海量数字资源、实现个性化学习。D错误，在线学习不能完全取代传统课堂。","o":["A. 突破时间、空间、人数限制","B. 提供海量的数字资源","C. 量身定制的个性化学习成为可能","D. 完全取代传统课堂"]},{"t":"m","q":"在线教育实践中暴露的问题包括？（多选）","a":[0,1,2,3],"an":"大规模在线教育暴露出四个主要问题：网络保障不足、优质资源不足、教师能力不足、师生互动和情感交流不足。全部选项正确。","o":["A. 网络运行保障能力不足","B. 体系化的优质数字教育资源不足","C. 教师信息技术应用能力不足","D. 线上教育师生互动和情感交流不足"]},{"t":"m","q":"以下属于互联网学习资源平台的有？（多选）","a":[0,1,2,3],"an":"互联网学习资源类型多样，课程平台、虚拟实验平台、在线数据库、在线博物馆等都是重要类型，全部正确。","o":["A. 课程平台（如中国大学MOOC）","B. 虚拟实验平台","C. 在线数据库和图书馆","D. 在线博物馆和美术馆"]},{"t":"q","q":"请说明在线学习对传统学习的三大突破。","a":"在线学习三大突破：(1)突破时间限制：学习者可以根据自己方便的时间学习，不再受固定课表的约束。(2)突破空间限制：学习者不需要到特定地点上课，有网络的地方就能学习。(3)突破人数限制：在线课程可以同时容纳大量学习者，不受教室物理容量的限制。","an":"这三大突破是在线学习最根本的变革，让优质教育资源能被更多人获取，促进教育公平。"},{"t":"q","q":"在线学习平台如何实现个性化学习？","a":"在线学习平台根据学习者的学习兴趣、学习行为和学习习惯，制订适合的学习计划，提供个性化的学习内容。平台通常会提供实时的学习反馈，帮助学习者有针对性地调整学习策略，以提高学习效率。","an":"个性化学习是在线学习的重要优势，通过数据分析为每个学习者提供量身定制的学习体验。"},{"t":"q","q":"如何正确看待人工智能模型在学习中的作用？","a":"向人工智能模型提问是新型学习方式，可以快速找到答案甚至看到思考过程。但需注意：(1)人工智能模型不是万能的，答案不一定完全正确，需要甄别。(2)不能完全依赖AI，要培养独立思考能力。(3)AI是学习的辅助工具，不能替代主动学习和深入思考。","an":"辩证看待AI在学习中的作用，既要利用其便利性，又要保持独立思考和批判性思维。"}],"L23":[{"t":"s","q":"互联网引发创新的方式之一是？","a":1,"an":"随着互联网应用普及，各行各业工作流程中的节点接入网络，各种业务数据借助网络互联互通，打通数据节点形成创新服务是互联网引发创新的重要方式。","o":["A. 让所有行业消失","B. 打通数据节点形成创新服务","C. 让传统技术完全被淘汰","D. 只有全新发明才能创新"]},{"t":"s","q":"以下哪种创新方式是为老技术找到新的生活应用场景的例子？","a":1,"an":"二维码最初是在汽车工业中用于标识配件的技术，随着互联网发展，它成了支付入口，催生了扫码支付等应用，是为老技术找到新应用场景的典型案例。","o":["A. 发明全新的汽车","B. 二维码从汽车标识变为支付入口","C. 创造新的语言","D. 开发新的操作系统"]},{"t":"s","q":"基于互联网的物流快递系统通过什么方式实现高效配送？","a":1,"an":"物流系统通过互联网可以实时调度系统资源，有效规划上门取件、状态跟踪、派件配送等环节，实现高效便捷。","o":["A. 纯人工调度","B. 互联网实时调度系统资源","C. 只靠快递员经验","D. 随机分配"]},{"t":"s","q":"互联网创新可能带来的新挑战不包括？","a":3,"an":"互联网创新可能带来的挑战包括：取代某些工作岗位、创新不一定成功可能造成社会损失、违法网络应用不断涌现等。只带来好处的说法过于绝对。","o":["A. 创新应用可能取代某些工作岗位","B. 网络创新不一定成功","C. 违法网络应用不断涌现","D. 创新只带来好处没有风险"]},{"t":"s","q":"在物流快递系统中，互联网主要帮助实现了什么？","a":1,"an":"物流系统通过互联网实现实时调度、上门取件规划、状态跟踪和派件配送优化，使物流快递高效便捷。","o":["A. 让快递变慢","B. 实时调度、状态跟踪和高效配送","C. 取消快递服务","D. 只能线下取件"]},{"t":"s","q":"以下哪项体现了互联网打通数据节点形成创新服务？","a":1,"an":"网购过程中商品信息、支付系统、物流配送等数据通过互联网互联互通，各方协同工作形成完整服务链，体现了打通数据节点实现创新。","o":["A. 实体店只能现金支付","B. 网购时商品信息、支付、物流数据互联互通","C. 所有环节独立运行互不相连","D. 只能电话订购"]},{"t":"s","q":"面对互联网创新应用，正确的态度是？","a":2,"an":"应合理应用互联网提高生活质量，同时需要辩证看待创新带来的影响，警惕信息茧房、数字鸿沟、网络安全等挑战。","o":["A. 盲目接受一切创新","B. 拒绝所有创新应用","C. 合理应用互联网提高生活质量，同时警惕风险","D. 创新与自己无关"]},{"t":"s","q":"共享充电宝的商业模式体现了互联网创新的什么思路？","a":1,"an":"共享充电宝将传统充电服务与互联网扫码支付、定位技术结合，创造新的使用场景，体现了互联网创新的思路。","o":["A. 简单复制传统模式","B. 将传统服务与互联网技术结合创造新场景","C. 与互联网完全无关","D. 不需要任何技术支持"]},{"t":"s","q":"互联网引发创新还可能带来什么问题？","a":0,"an":"数字鸿沟是互联网创新可能带来的问题之一，不同地区、不同群体间在互联网接入和使用能力上的差距可能加剧。此外还有网络安全等问题。","o":["A. 数字鸿沟加剧","B. 只有好处没有坏处","C. 所有问题都能解决","D. 不需要任何法规约束"]},{"t":"s","q":"互联网生活应用中，以下哪项说法正确？","a":1,"an":"合理应用互联网可以提高生活质量，如扫码支付、在线购物、在线办事等。同时也要正视互联网创新带来的挑战。","o":["A. 互联网应用只有便利没有挑战","B. 学习合理应用互联网能提高生活质量","C. 互联网应用与生活质量无关","D. 所有互联网应用都应该拒绝"]},{"t":"j","q":"打通数据节点形成创新服务是互联网引发创新的重要方式。","a":0,"an":"正确。各行各业工作流程中的节点接入网络后，业务数据通过互联网互联互通，从而引发了一系列创新服务。","o":["正确","错误"]},{"t":"j","q":"互联网创新只会带来积极影响，不会有任何挑战。","a":1,"an":"错误。互联网创新可能带来挑战，如取代某些工作岗位、创新不一定成功可能造成社会损失、违法网络应用不断涌现等。","o":["正确","错误"]},{"t":"j","q":"二维码从汽车工业标识技术变成支付入口，属于为老技术找到新应用场景。","a":0,"an":"正确。二维码最初用于汽车工业标识配件，互联网发展使其成为支付入口，催生扫码支付，是为老技术找到新的生活应用场景的典型。","o":["正确","错误"]},{"t":"j","q":"数字鸿沟是指不同群体间在互联网使用上的差距。","a":0,"an":"正确。数字鸿沟指不同地区、不同群体之间在互联网接入和使用能力方面的差距，是互联网创新可能带来的社会挑战之一。","o":["正确","错误"]},{"t":"m","q":"互联网引发创新的方式包括？（多选）","a":[0,1,2],"an":"互联网引发创新的方式包括：打通数据节点、为老技术找到新场景、创造新方法。D错误，互联网是与传统行业融合而非让其消失。","o":["A. 打通数据节点形成创新服务","B. 为老技术找到新的生活应用场景","C. 创造全新的技术和方法","D. 让所有传统行业消失"]},{"t":"m","q":"互联网创新可能带来的新挑战有？（多选）","a":[0,1,2,3],"an":"互联网创新可能带来的挑战包括就业影响、创新失败风险、违法应用、数字鸿沟、网络安全等，全部选项正确。","o":["A. 创新应用可能取代某些工作岗位","B. 网络创新不一定成功可能造成损失","C. 违法网络应用不断涌现","D. 数字鸿沟问题"]},{"t":"m","q":"关于互联网应用的正确态度包括？（多选）","a":[0,1,2],"an":"正确态度是：合理应用、了解便利、警惕挑战。D错误，完全不使用互联网不可取，应学会趋利避害。","o":["A. 合理应用互联网提高生活质量","B. 了解互联网创新带来的便利","C. 警惕互联网创新带来的挑战","D. 完全不使用互联网"]},{"t":"q","q":"请举例说明互联网如何通过打通数据节点形成创新服务。","a":"以物流快递为例：物流系统通过互联网将上门取件、仓储调度、运输跟踪、派件配送等各环节数据打通，实现实时调度系统资源、状态跟踪查询、高效配送规划。用户可以在手机端实时查看快递位置，快递员可以高效规划路线，整个物流链高效协同运作。","an":"数据打通使原本独立的工作环节互联互通，实现了传统物流无法达到的效率和服务水平。"},{"t":"q","q":"请说明互联网创新的两种方式并各举一例。","a":"(1)打通数据节点形成创新服务：如物流快递系统通过互联网将取件、运输、派送等环节数据打通，实现全流程高效管理。(2)为老技术找到新的生活应用场景：如二维码从汽车工业标识技术变为扫码支付入口，催生了移动支付新应用。","an":"两种创新方式体现了互联网创新的不同思路：整合现有数据和发现已有技术的新用途。"},{"t":"q","q":"互联网创新带来了哪些挑战？我们应该如何应对？","a":"挑战：(1)创新应用可能取代某些工作岗位；(2)网络创新不一定成功可能造成社会损失；(3)违法网络应用不断涌现；(4)数字鸿沟问题；(5)网络安全问题。应对：合理应用互联网提高生活质量，提高信息安全意识，关注创新带来的社会影响，学习辨别网络信息真伪。","an":"互联网创新是把双刃剑，既要享受其便利，也要正视其挑战，培养辩证看待技术和创新的能力。"}],"L24":[{"t":"s","q":"互联网给交流方式带来的最根本改变是？","a":1,"an":"互联网的广泛应用打破了社交中原本存在的时间和空间限制，使得人们可以随时随地通过互联网交流。","o":["A. 只能面对面交流","B. 打破了社交中的时间和空间限制","C. 只能用文字交流","D. 交流变得更加困难"]},{"t":"s","q":"在线交流的特点不包括？","a":3,"an":"在线交流具有\"跨时空\"\"更广泛\"\"更多样\"等特点，支持文字、语音、视频等多种形式，D项说法错误。","o":["A. 跨时空","B. 更广泛","C. 更多样","D. 仅限于文字"]},{"t":"s","q":"维护良好数字形象的措施不包括？","a":2,"an":"维护数字形象需要精心选择发布的内容，确保分享的内容真实，而不是随意发布任何内容。C项是错误做法。","o":["A. 保持真实性","B. 保持礼貌的言辞和语气","C. 随意发布任何内容","D. 主动保护个人信息安全"]},{"t":"s","q":"信息茧房是指什么现象？","a":1,"an":"信息茧房指人们在网络社交过程中倾向于接收和关注符合自己兴趣、观点的信息，从而形成封闭的、自我强化的信息循环。","o":["A. 人们接收各种不同观点的信息","B. 人们倾向于接收符合自己兴趣和观点的信息形成封闭循环","C. 信息传递速度变快","D. 信息量变得巨大"]},{"t":"s","q":"在线交流中，以下哪种行为有助于维护数字形象？","a":2,"an":"维护数字形象需要积极参与有意义的讨论，尊重逻辑和事实，言之有物、言之有据。A、B、D都是损害数字形象的行为。","o":["A. 伪造个人信息夸大成就","B. 使用侮辱性语言攻击他人","C. 积极参与有意义的讨论","D. 随意透露个人敏感信息"]},{"t":"s","q":"可能会在网络社交中透露的个人信息不包括？","a":3,"an":"人们往往会在在线交流中透露住址、生日、学校和工作单位等个人信息，这些信息有可能被人利用。天气预报不属于个人信息。","o":["A. 住址","B. 生日","C. 学校和单位名称","D. 天气预报"]},{"t":"s","q":"关于网络中的虚拟人物，正确的认识是？","a":1,"an":"有些虚拟人物可以方便工作生活，但有些虚拟人物背后是别有用心的人或组织，试图干预人们正常的社交活动，需要警惕。","o":["A. 所有虚拟人物都是安全的","B. 有些虚拟人物背后可能有别有用心的人或组织","C. 虚拟人物不存在任何风险","D. 完全可以信任虚拟人物"]},{"t":"s","q":"关于维护数字形象，以下理解正确的是？","a":1,"an":"影响数字形象的因素不只有网名和头像，日常各种网络行为都会成为数字形象的一部分，维护数字形象是长期系统工程。","o":["A. 只要起个好网名就够了","B. 日常各种网络行为都会成为数字形象的一部分","C. 数字形象不重要不需要维护","D. 只有头像影响数字形象"]},{"t":"s","q":"面对在线交流中的新问题，正确的态度是？","a":2,"an":"在线交流有许多新问题需要研究和解决，应辩证看待在线交流带来的影响，既要利用其便利也要警惕风险。","o":["A. 忽略所有风险","B. 拒绝使用所有在线交流工具","C. 辩证看待在线交流带来的影响","D. 在线交流没有新问题"]},{"t":"s","q":"以下哪项不属于信息茧房的相关概念？","a":3,"an":"回音室效应、过滤气泡都是与信息茧房相关的概念，都指人们被同类信息包围的现象。D项与信息茧房概念相反。","o":["A. 回音室效应","B. 过滤气泡","C. 信息封闭循环","D. 信息开放共享"]},{"t":"j","q":"在线交流打破了社交中的时间和空间限制。","a":0,"an":"正确。互联网让人们可以随时随地通过文字、语音和视频等方式进行实时交流，打破了时空限制。","o":["正确","错误"]},{"t":"j","q":"只要取一个好听的网名就能维护好数字形象。","a":1,"an":"错误。影响数字形象的因素不只网名和头像，日常各种网络行为都会成为数字形象的一部分，是长期的系统工程。","o":["正确","错误"]},{"t":"j","q":"信息茧房会使人们只看到符合自己观点的信息。","a":0,"an":"正确。信息茧房指人们倾向于接收符合自己兴趣、观点的信息，形成封闭的、自我强化的信息循环。","o":["正确","错误"]},{"t":"j","q":"所有网络中的虚拟人物都是可以信任的。","a":1,"an":"错误。有些虚拟人物背后是别有用心的人或组织，试图干预人们正常的社交活动，需要保持警惕。","o":["正确","错误"]},{"t":"m","q":"维护数字形象的措施包括？（多选）","a":[0,1,2,3],"an":"维护数字形象需要：保持真实性、保持礼貌言辞和语气、精心选择发布内容、保护个人信息安全、积极参与有意义讨论。全部正确。","o":["A. 保持真实性","B. 保持礼貌的言辞和语气","C. 精心选择发布的内容","D. 主动保护个人信息安全"]},{"t":"m","q":"在线交流的特点包括？（多选）","a":[0,1,2],"an":"在线交流特点：跨时空（随时随地）、更广泛（连接更多人）、更多样（文字语音视频等）。D错误，在线交流恰恰打破了封闭。","o":["A. 跨时空","B. 更广泛","C. 更多样","D. 更封闭"]},{"t":"m","q":"在线交流中可能出现的问题有？（多选）","a":[0,1,2],"an":"在线交流可能面临信息茧房、个人信息泄露、虚假虚拟人物等问题。D错误，网络中信息不一定都准确可靠。","o":["A. 信息茧房","B. 个人信息泄露","C. 虚假虚拟人物欺骗","D. 所有信息都准确可靠"]},{"t":"q","q":"什么是数字形象？如何维护好自己的数字形象？","a":"数字形象是在互联网上进行社交时，通过网名、头像、发布内容、交流方式等形成的他人对自己的网络印象。维护方法：(1)保持真实性，不伪造信息或夸大成就；(2)保持礼貌的言辞和语气；(3)精心选择发布的内容，确保真实；(4)主动保护个人信息安全；(5)积极参与有意义的讨论。","an":"数字形象是长期系统工程，日常各种网络行为都会成为数字形象的一部分，需要从多方面持续维护。"},{"t":"q","q":"什么是信息茧房？它会带来什么问题？","a":"信息茧房指人们在网络社交过程中倾向于接收和关注符合自己兴趣、观点的信息，从而形成封闭的、自我强化的信息循环。问题：(1)视野变窄，只能看到自己感兴趣的内容；(2)相关概念如回音室效应和过滤气泡加剧信息封闭；(3)可能导致偏见固化，难以接触不同观点。","an":"信息茧房是互联网时代需要警惕的现象，应主动获取多样化信息，拓宽视野。"},{"t":"q","q":"在线交流中有哪些新问题需要注意？","a":"(1)信息茧房：人们倾向于接收符合自己观点的信息，视野变窄。(2)个人信息泄露：住址、生日、学校等信息可能被利用。(3)虚假虚拟人物：看似真实但背后可能别有用心。(4)网络欺诈：通过虚假身份进行欺骗。应对：保护个人信息、保持警惕、获取多元化信息、辨别信息真伪。","an":"在线交流带来便利的同时也存在风险，需要提升信息安全意识和辨别能力。"}],"L25":[{"t":"s","q":"互联网中的云指的是什么？","a":1,"an":"云指在互联网支持下出现的一种全新计算模式，方便人们使用各种资源（包括CPU、内存、硬盘、软件等）。","o":["A. 天上的云朵","B. 一种全新的计算模式","C. 普通的本地计算机","D. 只能存储文件的设备"]},{"t":"s","q":"负责输入和输出、使用云资源的设备称为什么？","a":2,"an":"资源所在的地方称为云端；使用这些资源、负责输入和输出的设备称为云终端。","o":["A. 云端","B. 服务器","C. 云终端","D. 主机"]},{"t":"s","q":"云存储服务的典型代表是什么？","a":1,"an":"大家日常使用的各种网盘、云盘，是云存储服务的典型代表。","o":["A. 本地硬盘","B. 各种网盘和云盘","C. U盘","D. 光盘"]},{"t":"s","q":"上传文件到云盘时，系统用什么算法判断文件是否已存在？","a":2,"an":"云盘系统利用摘要算法对文件生成数字摘要，然后比对数字摘要判断是否已保存过该文件，如果已存在就建立链接而不重复上传。","o":["A. 压缩算法","B. 加密算法","C. 摘要算法生成数字摘要","D. 排序算法"]},{"t":"s","q":"数字摘要的特点是什么？","a":1,"an":"数字摘要是根据文件内容生成的一串字符，不同文件生成的摘要通常不同，可用于验证文件完整性和唯一性。","o":["A. 每个文件都有完全相同的摘要","B. 根据文件内容生成的唯一字符串","C. 摘要可以随意修改","D. 与文件内容无关"]},{"t":"s","q":"使用云存储时，保护数据安全的重要措施是？","a":1,"an":"为了安全，应先使用软件对文件进行加密后再备份到云端，这样即使云被攻破，文件信息也不会轻易泄露。","o":["A. 直接上传不加密","B. 先使用软件对文件加密再备份","C. 不使用任何密码","D. 向所有人公开文件"]},{"t":"s","q":"云计算相对于本地计算的优点是什么？","a":1,"an":"云计算利用云端大量运算设备进行计算，可以节省运算时间，甚至完成本地计算机无法完成的复杂计算任务。","o":["A. 速度一定比本地慢","B. 可以处理本地计算机无法完成的复杂计算任务","C. 只能存储文件不能计算","D. 与本地计算完全相同"]},{"t":"s","q":"查看文件数字摘要的Windows命令是？","a":2,"an":"使用certutil -hashfile [文件路径]命令可以查看文件的数字摘要，用于验证文件完整性。","o":["A. ping","B. ipconfig","C. certutil -hashfile","D. dir"]},{"t":"s","q":"以下关于云存储的描述，错误的是？","a":2,"an":"云存储数据存储在远程服务器（云端），而非本地计算机。用户通过联网设备存取文件，不必关心设备维护更新。","o":["A. 可以在任何时间任何地方存取文件","B. 使用者不必关心设备的维护更新","C. 数据存储在本地计算机上","D. 可以把多种存储设备整合协同工作"]},{"t":"s","q":"NAS（网络附接存储）的作用是？","a":1,"an":"NAS（network attached storage，网络附接存储）是一种可以为网络中的计算机提供文件访问服务的设备，可实现本地云盘服务。","o":["A. 只能本地存储","B. 为网络中计算机提供文件访问服务","C. 只能上网","D. 是杀毒软件"]},{"t":"j","q":"云存储可以把多种存储设备整合在一起协同工作。","a":0,"an":"正确。云存储服务可以把多种存储设备整合在一起协同工作，共同提供存储服务。","o":["正确","错误"]},{"t":"j","q":"上传到云端的文件不需要加密，因为云服务器绝对安全。","a":1,"an":"错误。云服务器也可能被攻破，重要数据应先加密再上传备份，确保数据安全。","o":["正确","错误"]},{"t":"j","q":"云盘系统可以通过数字摘要判断是否已经保存过相同文件。","a":0,"an":"正确。云盘系统利用摘要算法生成数字摘要，比对后如果已存在该文件则建立链接，不用重复上传。","o":["正确","错误"]},{"t":"j","q":"云计算只能用于存储文件，不能进行计算。","a":1,"an":"错误。云计算不仅用于存储，还能利用云端大量运算设备进行复杂计算，甚至完成本地计算机无法完成的任务。","o":["正确","错误"]},{"t":"m","q":"关于云的正确理解包括？（多选）","a":[0,1,2],"an":"云是全新的计算模式、存储模式、服务模式。云端存储资源，云终端使用资源。D错误，云也可以进行计算。","o":["A. 云是一种全新的计算模式","B. 资源所在地称为云端","C. 使用资源的设备称为云终端","D. 云只能存储不能计算"]},{"t":"m","q":"云存储服务的特点包括？（多选）","a":[0,1,2],"an":"云存储主要特点：随时随地存取、不关设备维护、多设备整合协同。D错误，云存储需要网络连接。","o":["A. 可在任何时间任何地方存取文件","B. 使用者不必关心设备维护更新","C. 可把多种存储设备整合协同工作","D. 不需要网络连接也可使用"]},{"t":"m","q":"保护云中数据安全的措施包括？（多选）","a":[0,1,2],"an":"保护云数据安全需要：加密后上传、使用强密码、定期备份等。D错误，不设置安全措施会导致数据泄露风险。","o":["A. 上传前使用加密软件加密文件","B. 使用强密码","C. 定期备份数据","D. 不设置任何安全措施"]},{"t":"q","q":"请解释云存储的工作方式和数字摘要的作用。","a":"云存储把多种存储设备整合协同工作，使用者可通过联网设备在任何时间、任何地方存取文件。数字摘要的作用：(1)云盘系统用摘要算法根据文件内容生成唯一的数字摘要字符串；(2)比对数字摘要判断是否已保存过该文件；(3)如已存在则建立链接指向该文件，无需重复上传，节省时间和存储空间。","an":"数字摘要是云存储智能管理的关键技术，实现了秒传和去重功能。"},{"t":"q","q":"为什么重要数据上传到云端前需要加密？","a":"重要数据上传前需加密的原因：(1)云服务器可能被别有用心的人攻破；(2)如果上传的文件未加密，信息就可能泄露；(3)加密后即使文件被获取，没有密码也无法读取内容。加密方法：可利用压缩软件对文件进行加密压缩，再上传到云端，下载后用密码解压验证。","an":"数据安全是信息社会责任的重要内容，养成先加密再上传的好习惯。"},{"t":"q","q":"请简述云计算的基本工作原理。","a":"云计算工作原理：(1)准备好需要处理的数据或要求，并传给云；(2)云用自身包含的大量运算设备进行计算处理；(3)云把计算结果反馈给使用者。这样可以节省运算时间，甚至可以完成本地计算机无法完成的复杂计算任务。","an":"云计算体现了云这种新计算模式的核心价值：利用远程的强大计算资源，为终端用户提供算力服务。"}],"L26":[{"t":"s","q":"制作短视频的第一步是什么？","a":1,"an":"制作短视频一般需要经历：定主题→选场景→写文案→备素材→视频剪辑→发布分享，定主题是第一步。","o":["A. 发布分享","B. 定主题","C. 视频剪辑","D. 备素材"]},{"t":"s","q":"制作短视频的步骤中，选场景的作用是？","a":1,"an":"选场景是在确定主题后，选择可以体现主题的场景，如展示家乡智慧生活时选择能体现相关特色的场景。","o":["A. 确定关注点","B. 选择可以体现主题的场景","C. 整合素材形成视频","D. 将作品发布出去"]},{"t":"s","q":"制作短视频时，可以利用什么辅助创作脚本？","a":1,"an":"可以自己创作或者利用在线人工智能模型辅助创作短视频脚本，AI可以帮助生成视频文案。","o":["A. 只能完全自己写","B. 在线人工智能模型","C. 不能使用任何工具","D. 只能参考别人作品"]},{"t":"s","q":"收集短视频素材时，云存储服务的主要作用是？","a":1,"an":"云存储服务不仅能提供海量的存储空间，而且能方便地实现组内成员的素材共享。","o":["A. 让素材占用更少的空间","B. 提供海量存储空间和方便小组共享","C. 自动剪辑视频","D. 不需要任何存储"]},{"t":"s","q":"制作完成的短视频可以发布在哪里？","a":2,"an":"制作完成的视频可以发布在专门的视频网站上，也可以发布在社交媒体上。","o":["A. 只能发布在专门视频网站","B. 只能发布在社交媒体","C. 可以发布在视频网站或社交媒体","D. 不能公开发布"]},{"t":"s","q":"发布短视频时需要注意什么？","a":1,"an":"发布短视频要确保短视频的格式和大小符合相关平台的要求，否则可能无法成功发布。","o":["A. 没有格式要求","B. 确保短视频的格式和大小符合平台要求","C. 可以发布任何内容","D. 不需要预览直接发布"]},{"t":"s","q":"关于短视频观看，以下说法正确的是？","a":1,"an":"无节制地观看短视频会带来负面效果，应合理安排观看时间，避免过度沉迷。","o":["A. 应该无节制地观看短视频","B. 无节制观看短视频会带来负面效果","C. 短视频只有好处没有坏处","D. 短视频对学习没有任何帮助"]},{"t":"s","q":"视频剪辑环节的主要任务是什么？","a":1,"an":"视频剪辑环节需要按照分工制作各场景视频，把各场景视频连接起来，处理好过渡，配上背景音乐，形成完整作品。","o":["A. 确定视频主题","B. 把素材整合起来形成短视频","C. 选择拍摄场景","D. 发布到平台"]},{"t":"s","q":"制作短视频需要准备的素材类型可能包括？","a":1,"an":"收集的素材可能包括图像、音频、视频等，素材类型丰富多样。","o":["A. 只有文字","B. 图像、音频、视频等","C. 只有音乐","D. 不需要任何素材"]},{"t":"s","q":"电子地图在制作家乡主题短视频中可以提供什么帮助？","a":1,"an":"电子地图可以为短视频制作提供家乡的俯视图、地理信息等素材，帮助展示家乡全貌。","o":["A. 提供视频剪辑功能","B. 提供了家乡的俯视图等地理信息","C. 自动生成完整视频","D. 没有任何帮助"]},{"t":"j","q":"制作短视频一般需要经过定主题、选场景、写文案、备素材、视频剪辑、发布分享等步骤。","a":0,"an":"正确。这六个步骤是制作短视频的完整流程，从创意到发布环环相扣。","o":["正确","错误"]},{"t":"j","q":"制作短视频时只能使用自己拍摄的素材，不能从互联网获取。","a":1,"an":"错误。互联网中有丰富的图文声像资源，制作短视频时可以利用网络获取这些素材，减少拍摄工作。","o":["正确","错误"]},{"t":"j","q":"可以利用AI辅助创作短视频脚本。","a":0,"an":"正确。可以选择在线人工智能模型，让它生成所需视频文案，然后根据需要进行修改。","o":["正确","错误"]},{"t":"j","q":"发布短视频不需要预览，直接发布即可。","a":1,"an":"错误。应该先预览制作的视频，如有问题及时修正，确认无误后再发布。","o":["正确","错误"]},{"t":"m","q":"制作短视频的基本步骤包括？（多选）","a":[0,1,2,3],"an":"制作短视频六步：定主题→选场景→写文案→备素材→视频剪辑→发布分享，全部正确。","o":["A. 定主题","B. 选场景和写文案","C. 备素材","D. 视频剪辑和发布分享"]},{"t":"m","q":"互联网应用对制作短视频的帮助包括？（多选）","a":[0,1,2,3],"an":"互联网为短视频制作提供多方面帮助：网络素材、AI生成、云存储共享、电子地图等，全部正确。","o":["A. 从网络获取图文声像素材","B. 利用AI辅助生成脚本","C. 使用云存储共享素材","D. 利用电子地图获取地理信息"]},{"t":"m","q":"关于短视频的正确认识包括？（多选）","a":[0,1,2],"an":"短视频是重要表达方式但需注意：符合平台要求、合理控制观看时间。D错误，不能随意发布违法违规内容。","o":["A. 短视频是获取信息和表达自我的重要方式","B. 发布时要确保格式和大小符合平台要求","C. 无节制观看会带来负面效果","D. 短视频可以随意发布任何内容"]},{"t":"q","q":"请简述制作短视频的完整流程。","a":"制作短视频六步流程：(1)定主题：确定关注点和要表达的内容。(2)选场景：选择能体现主题的场景。(3)写文案：写各场景文案、前言、小结，为作品命名。(4)备素材：准备图像、音乐等素材，可利用网络资源或AI生成。(5)视频剪辑：整合素材形成短视频，加入过渡和背景音乐。(6)发布分享：选择合适的视频网站或社交媒体发布。","an":"完整流程体现了从创意到成品的系统性工作过程，每个环节都很重要。"},{"t":"q","q":"互联网为短视频制作提供了哪些帮助？","a":"互联网为短视频制作提供的帮助：(1)在线AI辅助创作脚本；(2)网络中有丰富的图文声像素材资源可获取；(3)可利用AI生成所需素材；(4)云存储服务提供海量存储空间并方便组内共享；(5)电子地图等应用提供地理信息等特殊素材。","an":"互联网创新应用大大降低了短视频制作的门槛，提高了效率和创意空间。"},{"t":"q","q":"发布短视频时需要注意哪些问题？","a":"发布短视频注意事项：(1)确保短视频格式和大小符合相关平台要求；(2)预览制作的视频，及时修正问题；(3)剪辑时处理好各段视频的自然过渡，配上合适的背景音乐；(4)如有可能加上片头片尾；(5)遵守平台规定和法律法规，不能发布违法违规内容。","an":"发布前的检查和规范意识很重要，保证作品质量和合规性。"}],"L27":[{"t":"s","q":"国家为保护个人信息专门出台了哪部法律？","a":1,"an":"《中华人民共和国个人信息保护法》专门对个人信息处理规则、个人权利、个人信息处理者义务等做了明确规定。","o":["A. 《中华人民共和国宪法》","B. 《中华人民共和国个人信息保护法》","C. 《中华人民共和国刑法》","D. 《中华人民共和国交通法》"]},{"t":"s","q":"网络购物可能涉及哪些个人信息？","a":1,"an":"网络购物可能涉及手机号、姓名、地址、购买记录等多种个人信息。","o":["A. 只有姓名","B. 手机号、姓名、地址、购买记录等","C. 只有手机号","D. 不涉及任何信息"]},{"t":"s","q":"连接公共免费Wi-Fi可能存在的风险是？","a":1,"an":"一些不法分子将免费无线路由器投放在公共场所，当用户连接后通过认证页面、木马程序等手段获取用户信息。","o":["A. 完全没有风险","B. 不法分子可能通过认证页面或木马获取信息","C. 只会让网速变慢","D. 只能用于浏览网页"]},{"t":"s","q":"手机拍摄的图像以原图分享可能泄露什么信息？","a":1,"an":"手机拍摄的图片会带有手机型号、镜头参数、拍摄时间、拍摄地理位置等信息，以原图分享可能泄露这些信息。","o":["A. 不会泄露任何信息","B. 手机型号、拍摄时间、地理位置等","C. 只会泄露时间","D. 只会泄露手机型号"]},{"t":"s","q":"设置密码的正确做法是？","a":1,"an":"密码要有一定长度，最好同时包括大小写字母、数字和特殊符号等，增加破解难度。","o":["A. 所有应用使用同一密码","B. 密码要有一定长度，包含大小写字母、数字和特殊符号","C. 密码越短越好","D. 把密码记在本子上便于记忆"]},{"t":"s","q":"发现个人信息被泄露后，第一时间应该做什么？","a":1,"an":"如果发现个人信息被泄露了，就要在第一时间暂停相关账号并更改密码，防止损失扩大。","o":["A. 什么都不做","B. 暂停相关账号并更改密码","C. 继续使用相同密码","D. 忽略不理"]},{"t":"s","q":"扫描不明来源的二维码可能带来的风险是？","a":1,"an":"二维码可能指向需要提供个人信息的网站，诱使提供账号、密码、手机号等信息，导致信息泄露。","o":["A. 没有任何风险","B. 可能指向要求提供个人信息的网站导致泄露","C. 只会增加流量消耗","D. 只会显示图片"]},{"t":"s","q":"企业保护用户个人信息应该怎么做？","a":1,"an":"企业需要通过制度和技术手段保护个人信息，遵守国家法律和行业规范，采用身份验证和加密技术等。","o":["A. 不需要任何措施","B. 通过制度和技术手段保护，遵守法律法规","C. 随意使用用户数据","D. 只说不做"]},{"t":"s","q":"手机遗失后应采取的应急措施不包括？","a":2,"an":"手机遗失后应采取：报警、查找定位、开启丢失模式、停机处理、修改密码、远程清除数据等措施。不能什么都不做。","o":["A. 报警备案","B. 开启丢失模式锁定设备","C. 什么都不做等别人归还","D. 修改相关账户密码"]},{"t":"s","q":"人工智能对个人信息保护带来的新困扰包括？","a":1,"an":"人工智能需要大量数据进行训练和学习，这些数据可能包含个人信息，如果数据被不当使用就可能导致个人信息泄露。","o":["A. AI不需要数据训练","B. AI需要大量数据训练可能包含个人信息","C. AI完全不会涉及个人信息","D. AI比传统方式更安全"]},{"t":"j","q":"《中华人民共和国个人信息保护法》从国家制度层面保障个人信息安全。","a":0,"an":"正确。国家出台了《中华人民共和国个人信息保护法》等法律法规，从国家制度层面保障个人信息的安全。","o":["正确","错误"]},{"t":"j","q":"公共免费Wi-Fi可以随意连接，不存在安全风险。","a":1,"an":"错误。不法分子可能将免费Wi-Fi作为获取用户信息的工具，连接时应谨慎。","o":["正确","错误"]},{"t":"j","q":"应定期更改密码并使用强密码增强账户安全。","a":0,"an":"正确。使用强密码并定期更改密码是保护个人信息安全的重要措施之一。","o":["正确","错误"]},{"t":"j","q":"人工智能应用完全不会涉及用户行为监控和数据追踪。","a":1,"an":"错误。AI应用可能涉及用户行为监控和数据追踪，如果没有适当监管可能会侵犯用户个人权益。","o":["正确","错误"]},{"t":"m","q":"可能导致个人信息泄露的途径有？（多选）","a":[0,1,2,3],"an":"公共Wi-Fi、原图分享、不明二维码、公用计算机都是常见的个人信息泄露途径，全部正确。","o":["A. 连接不明公共Wi-Fi","B. 原图分享手机拍摄的照片","C. 扫描不明来源二维码","D. 使用公用计算机登录账号"]},{"t":"m","q":"个人保护信息安全应采取的措施包括？（多选）","a":[0,1,2,3],"an":"个人信息安全防护措施：使用强密码、谨慎用公共Wi-Fi、更新系统和杀毒软件、定期备份数据等，全部正确。","o":["A. 使用强密码并定期更改","B. 谨慎使用公共Wi-Fi","C. 定期更新系统和杀毒软件","D. 定期备份数据"]},{"t":"m","q":"手机遗失后应采取的应急措施包括？（多选）","a":[0,1,2,3],"an":"手机遗失后应：报警、查找定位、开启丢失模式锁定、停机处理、修改密码、远程清除数据等，全部正确。","o":["A. 报警备案","B. 用查找功能定位手机并开启丢失模式","C. 联系服务商停机处理","D. 修改相关账户密码"]},{"t":"q","q":"个人信息泄露的常见途径有哪些？如何防范？","a":"常见泄露途径：(1)连接未知公共Wi-Fi；(2)原图分享含地理位置信息的照片；(3)扫描不明来源二维码；(4)使用公用计算机登录账号。防范措施：谨慎使用公共Wi-Fi、分享照片前去除敏感信息、不扫不明二维码、不在公用设备登录、使用强密码并定期更改。","an":"了解泄露途径是保护个人信息的第一步，提高安全意识是关键。"},{"t":"q","q":"人工智能给个人信息保护带来了哪些新挑战？","a":"AI带来的新挑战：(1)需要大量数据进行训练可能包含个人信息；(2)AI应用需要分析个人偏好和行为习惯；(3)可能涉及用户行为监控和数据追踪；(4)如果缺乏监管可能侵犯个人权益。因此需要法律法规和技术手段共同保障。","an":"AI时代个人信息保护面临新形势，国家出台了《生成式人工智能服务管理暂行办法》等进行规范。"},{"t":"q","q":"设置安全密码应遵循哪些原则？","a":"安全密码原则：(1)有一定长度（8位以上）；(2)同时包含大小写字母、数字和特殊符号；(3)对外人无法猜测但对自己有特殊含义且容易记忆；(4)不同应用使用不同密码；(5)不把密码记在本子上；(6)不让他人知道密码；(7)定期更改密码。","an":"强密码是保护账户安全的第一道防线，养成良好的密码管理习惯非常重要。"}],"L28":[{"t":"s","q":"数字版权保护的是什么权利？","a":1,"an":"数字版权是作者及其他权利人在数字化复制、传播方面依法享有的精神权利和经济权利的总称。","o":["A. 只有作者的经济权利","B. 作者在数字化复制和传播方面的精神权利和经济权利","C. 只有出版社的权利","D. 只有读者的权利"]},{"t":"s","q":"以下哪项属于保护数字版权的常用技术？","a":1,"an":"保护数字作品时一般会采用限制质量、限制内容、加上水印、限制时长等技术。","o":["A. 完全开放下载","B. 加上水印","C. 无偿分享","D. 不设任何限制"]},{"t":"s","q":"保护数字版权的相关法律不包括？","a":3,"an":"与数字版权保护相关的法律包括：《著作权法》《著作权法实施条例》《计算机软件著作权登记办法》等。D项是环保法律，与版权无关。","o":["A. 《中华人民共和国著作权法》","B. 《中华人民共和国著作权法实施条例》","C. 《计算机软件著作权登记办法》","D. 《中华人民共和国环境保护法》"]},{"t":"s","q":"集成电路布图设计也受到知识产权保护，属于什么类型？","a":1,"an":"集成电路布图设计属于一种特殊的知识产权类型，受到《集成电路布图设计保护条例》等专门法规的保护。","o":["A. 著作权","B. 集成电路布图设计专有权","C. 商标权","D. 专利权"]},{"t":"s","q":"知识产权保护的主要目的是什么？","a":1,"an":"创新是引领发展的第一动力，保护知识产权就是保护创新，激发创作者的创作动力。","o":["A. 限制创新","B. 保护创新、激发创新动力","C. 阻碍知识传播","D. 提高作品价格"]},{"t":"s","q":"关于人工智能生成内容的版权问题，正确的说法是？","a":1,"an":"AI生成的内容给版权保护造成新困扰，可能涉及知识产权问题。《生成式人工智能服务管理暂行办法》对此进行了规范。","o":["A. AI生成的内容完全没有版权问题","B. AI生成的内容可能涉及版权问题，需要法规规范","C. 所有人都可以免费商用AI生成内容","D. AI生成物不受任何法律约束"]},{"t":"s","q":"以下关于知识产权保护范围的描述，不正确的是？","a":2,"an":"集成电路布图设计受《集成电路布图设计保护条例》保护，是知识产权保护的重要类型之一。C项说法错误。","o":["A. 文字作品受著作权保护","B. 软件代码受著作权保护","C. 集成电路布图设计不受任何保护","D. 音乐作品受著作权保护"]},{"t":"s","q":"未经授权使用他人字体可能面临什么后果？","a":1,"an":"字体有版权保护，未经许可使用可能侵犯字库公司的权益。教材案例中字库公司胜诉获赔。","o":["A. 没有任何后果","B. 可能构成侵权并被索赔","C. 只是道德问题不违法","D. 字体不受法律保护"]},{"t":"s","q":"《生成式人工智能服务管理暂行办法》的施行日期是？","a":1,"an":"《生成式人工智能服务管理暂行办法》于2023年8月15日起正式施行，对AI涉及的知识产权和个人信息等进行了规定。","o":["A. 2022年8月15日","B. 2023年8月15日","C. 2024年8月15日","D. 2021年8月15日"]},{"t":"s","q":"\"剑网\"专项行动主要针对什么？","a":0,"an":"\"剑网\"专项行动是国家版权局等部门联合开展的打击网络侵权盗版的专项行动。","o":["A. 打击网络侵权盗版","B. 推广正版软件销售","C. 发展互联网技术","D. 培训网络技术人员"]},{"t":"j","q":"数字版权只包括经济权利，不包括精神权利。","a":1,"an":"错误。数字版权是作者及其他权利人在数字化复制、传播方面依法享有的精神权利和经济权利的总称。","o":["正确","错误"]},{"t":"j","q":"保护数字作品的常用技术包括限制质量、加上水印、限制时长等。","a":0,"an":"正确。限制质量、限制内容、加上水印、限制时长等都是保护数字作品常用的技术手段。","o":["正确","错误"]},{"t":"j","q":"人工智能生成的内容完全不涉及版权问题。","a":1,"an":"错误。AI生成的内容可能涉及版权问题，给数字版权保护造成新困扰。《生成式人工智能服务管理暂行办法》对此进行了规范。","o":["正确","错误"]},{"t":"j","q":"保护知识产权就是保护创新。","a":0,"an":"正确。创新是引领发展的第一动力，保护知识产权就是保护创新，激励创新动力。","o":["正确","错误"]},{"t":"m","q":"以下属于保护数字版权技术的有？（多选）","a":[0,1,2,3],"an":"保护数字版权常用技术包括：限制质量、限制内容、加上水印、限制时长等，全部正确。","o":["A. 限制质量","B. 限制内容","C. 加上水印","D. 限制时长"]},{"t":"m","q":"以下属于知识产权保护类型的包括？（多选）","a":[0,1,2,3],"an":"知识产权包含多种类型：著作权、商标权、专利权、集成电路布图设计专有权等，全部正确。","o":["A. 著作权（文学艺术作品）","B. 商标权（商业标识）","C. 专利权（发明创造）","D. 集成电路布图设计专有权"]},{"t":"m","q":"与数字版权保护相关的法律法规有？（多选）","a":[0,1,2,3],"an":"与数字版权相关的法律法规包括《著作权法》《计算机软件著作权登记办法》《生成式AI服务管理暂行办法》《著作权行政处罚实施办法》等，全部正确。","o":["A. 《中华人民共和国著作权法》","B. 《计算机软件著作权登记办法》","C. 《生成式人工智能服务管理暂行办法》","D. 《著作权行政处罚实施办法》"]},{"t":"q","q":"什么是数字版权？保护数字版权有哪些常用技术？","a":"数字版权是作者及其他权利人在数字化复制、传播方面依法享有的精神权利和经济权利的总称。常用保护技术：(1)限制质量（如降低预览清晰度）；(2)限制内容（如付费后才能查看完整内容）；(3)加上水印（标识版权归属）；(4)限制时长（如限时使用软件）。","an":"数字版权保护涉及法律和技术两个层面，既要懂法也要了解技术手段。"},{"t":"q","q":"人工智能给数字版权保护带来了哪些新挑战？","a":"AI带来的挑战：(1)AI可以按要求生成文章、图像、音乐等，这些生成物的版权归属不明确；(2)AI训练使用了大量已有作品数据，可能侵犯原作者版权；(3)利用AI生成的作品冒充原创可能涉及学术诚信和版权问题。应对：《生成式人工智能服务管理暂行办法》要求尊重知识产权，不得利用算法实施垄断和不正当竞争。","an":"AI时代版权保护面临新课题，需要在鼓励创新和保护权利之间找到平衡。"},{"t":"q","q":"为什么说保护知识产权就是保护创新？","a":"(1)创新需要付出大量时间、精力和资金，如果没有知识产权保护，创新成果可能被随意盗用；(2)知识产权保护保障创作者获得应有的精神和经济回报，激励更多人从事创新；(3)良好的知识产权保护环境吸引投资、促进技术交流；(4)我国制定了多项法律法规保护知识产权，为创新提供了制度保障。","an":"知识产权保护与创新是相互促进的关系，保护知识产权为创新创造良好环境。"}],"L29":[{"t":"s","q":"互联网企业信息社会责任不包括？","a":2,"an":"互联网企业信息社会责任主要包括：保护个人信息、尊重知识产权、维护文明与道德、保障网络安全、勇于创新。C项不正确。","o":["A. 保护个人信息","B. 尊重知识产权","C. 无视用户需求追求利润最大化","D. 维护文明与道德"]},{"t":"s","q":"如果互联网企业过度收集用户信息可能造成什么后果？","a":1,"an":"企业过度收集个人信息形成用户画像，用户在企业面前渐渐变得透明，国家的社会生态和经济发展情况也可能被挖掘显现。","o":["A. 没有任何后果","B. 用户在企业面前变得透明，隐私被侵犯","C. 只会改善服务","D. 对企业有利无害"]},{"t":"s","q":"验证码在网络平台中的作用是什么？","a":1,"an":"验证码是一种行之有效的安全技术，用于区分人类用户和自动化程序（如恶意机器人），保障网络安全。","o":["A. 美观作用","B. 区分人类用户和自动化程序，保障网络安全","C. 增加用户操作步骤","D. 只是装饰"]},{"t":"s","q":"以下哪项属于关键技术信息基础设施？","a":1,"an":"金融、能源、电力、通信、交通等领域的关键信息基础设施是经济社会运行的神经中枢，是网络安全的重中之重。","o":["A. 普通家用电器","B. 金融、能源、电力、通信、交通等领域的信息系统","C. 个人手机","D. 家用电脑"]},{"t":"s","q":"2022年因严重泄露用户信息被处以巨额罚款的案例依据了哪些法律？","a":1,"an":"国家互联网信息办公室依据《中华人民共和国网络安全法》《数据安全法》《个人信息保护法》等对泄露用户信息的企业进行处罚。","o":["A. 只有《网络安全法》","B. 《网络安全法》《数据安全法》《个人信息保护法》等","C. 只有《刑法》","D. 没有法律依据"]},{"t":"s","q":"互联网技术自主可控的含义是什么？","a":1,"an":"自主可控不等于什么都是自己研发。有些技术可在别人基础上吸收创新，有些核心技术必须依靠自主研发，关键是不受制于人。","o":["A. 所有技术必须完全自己开发","B. 在关键核心技术上不受制于人，有些技术可在别人的基础上吸收创新","C. 不使用任何外来技术","D. 不需要任何技术创新"]},{"t":"s","q":"以下哪种行为体现了企业维护文明与道德的责任？","a":1,"an":"维护文明与道德要求互联网企业建立完善的内容审核机制，及时处理不良信息和违规内容。","o":["A. 放任不良信息传播","B. 建立完善的内容审核机制","C. 删除所有用户评论","D. 不审核任何内容"]},{"t":"s","q":"企业在保障网络安全方面应采取的措施不包括？","a":2,"an":"企业应采取必要的技术和管理措施保障安全，但必须在合法合规前提下进行，不能随意监控用户设备。","o":["A. 采取技术手段防止数据泄露","B. 加强网络欺诈行为监测","C. 对用户设备进行随意监控","D. 保障网络服务稳定运行"]},{"t":"s","q":"我国在哪些领域已经实现或正在实现自主可控？","a":3,"an":"我国在下一代互联网技术、芯片、通信技术、数据库软件等多个领域已经实现或正在实现自主可控。","o":["A. 下一代互联网技术","B. 芯片","C. 通信技术","D. 以上都是"]},{"t":"s","q":"2016年某知名互联网企业5亿条用户信息泄露事件说明了什么？","a":1,"an":"此案例说明企业除了发展壮大自身，还需承担保护用户信息等社会责任，否则会造成严重后果。","o":["A. 企业不需要承担信息保护责任","B. 企业必须承担保护用户信息的社会责任","C. 信息泄露无所谓","D. 这只是偶然事件不需要重视"]},{"t":"j","q":"保护用户个人信息是互联网企业必须承担的信息社会责任。","a":0,"an":"正确。保护用户的个人信息是互联网企业必须承担的信息社会责任之一，如果违反就会受到法律严惩。","o":["正确","错误"]},{"t":"j","q":"自主可控意味着所有技术都必须完全由自己研发。","a":1,"an":"错误。有些技术可以在别人的基础上吸收创新，有些核心技术必须依靠自主研发，关键是不受制于人。","o":["正确","错误"]},{"t":"j","q":"验证码可以区分人类用户和自动化程序，保障网络安全。","a":0,"an":"正确。验证码代表了一种行之有效的安全技术，很多网络平台都用它来防止恶意自动化程序攻击。","o":["正确","错误"]},{"t":"j","q":"企业不需要对网络中的不良信息进行审核。","a":1,"an":"错误。维护文明与道德要求企业建立完善的内容审核机制，对不良信息进行审核和过滤。","o":["正确","错误"]},{"t":"m","q":"互联网企业信息社会责任主要包括？（多选）","a":[0,1,2,3],"an":"企业信息社会责任五方面：保护个人信息、尊重知识产权、维护文明与道德、保障网络安全、勇于创新，全部正确。","o":["A. 保护个人信息","B. 尊重知识产权","C. 维护文明与道德","D. 保障网络安全和勇于创新"]},{"t":"m","q":"企业在保障网络安全方面应做到？（多选）","a":[0,1,2,3],"an":"企业保障网络安全需做到：技术管理措施、稳定服务、欺诈监测、内容审核等，全部正确。","o":["A. 采取技术和管理措施保障安全","B. 提供稳定高效的网络服务","C. 加强网络欺诈行为监测","D. 建立内容审核和过滤机制"]},{"t":"m","q":"我国已实现或正在实现自主可控的领域包括？（多选）","a":[0,1,2,3],"an":"我国在下一代互联网技术、芯片、通信技术、数据库软件等多个领域都在追求和实现自主可控，全部正确。","o":["A. 下一代互联网技术","B. 芯片","C. 通信技术","D. 数据库软件"]},{"t":"q","q":"互联网企业应承担哪些信息社会责任？","a":"五大责任：(1)保护个人信息：制定用户信息保护政策，确保信息不被泄露滥用。(2)尊重知识产权：遵守知识产权法律，不侵犯他人知识产权。(3)维护文明与道德：建立内容审核机制，维护社会文明道德。(4)保障网络安全：采取安全措施防止数据泄露，保障网络稳定运行。(5)勇于创新：不断提升技术，完善产品。","an":"企业在追求发展的同时必须承担相应的社会责任，这是信息社会健康发展的基础。"},{"t":"q","q":"为什么关键信息基础设施的网络安全尤其重要？","a":"关键信息基础设施（如金融、能源、电力、通信、交通等）是经济社会运行的神经中枢，是网络安全的重中之重。原因：(1)一旦遭受攻击可能导致社会运行瘫痪；(2)这些系统存储大量敏感数据；(3)是可能遭到重点攻击的目标；(4)关系到国家安全和人民生活的正常运转。","an":"关键信息基础设施安全关系到国计民生，必须重点保护。"},{"t":"q","q":"如何正确理解互联网技术自主可控？","a":"自主可控指在关键核心技术上不受制于人，但不等于所有技术都自己研发。理解：(1)有些技术可以在别人的基础上吸收创新；(2)涉及国家安全和核心利益的技术必须依靠自主研发；(3)在制造芯片、开发操作系统、研发通信技术、制定技术标准等方面我国已取得重大突破；(4)自主可控是保障国家安全和产业发展的必要条件。","an":"正确理解自主可控，既要看到必要性也要避免极端化，在开放合作中实现自主发展。"}],"L30":[{"t":"s","q":"通过网络语言、图像、视频等形式侮辱、诽谤、威胁他人可能构成什么？","a":1,"an":"通过语言、图像、视频等形式在互联网中侮辱、诽谤、威胁、恐吓、人肉搜索其他人，就可能构成网络暴力。","o":["A. 正常讨论","B. 网络暴力","C. 言论自由","D. 合理批评"]},{"t":"s","q":"网络暴力的危害不包括？","a":2,"an":"网络暴力伤害受害者、破坏舆论环境、引发社会矛盾，无助于社会和谐。C项不是危害。","o":["A. 给受害者心理和精神压力","B. 破坏社会舆论环境","C. 有助于社会和谐","D. 引发社会矛盾和群体对立"]},{"t":"s","q":"作为初中生看到疑似谣言应首先怎么办？","a":1,"an":"看到疑似谣言后可以先向老师和家长求证，然后向平台投诉举报，也可以通过正规渠道反映问题。","o":["A. 立即转发让更多人知道","B. 先向老师和家长求证再决定是否举报","C. 直接相信","D. 添加更多猜测传播"]},{"t":"s","q":"网络水军是什么？","a":1,"an":"网络水军是指在网络中针对特定内容发布特定信息的、被雇佣的网络写手，伪装成普通网民试图影响舆论。","o":["A. 普通网民","B. 被雇佣发布特定倾向信息的网络写手","C. 网络安全专家","D. 网络管理员"]},{"t":"s","q":"以下哪个举报渠道可以用来举报网络谣言？","a":0,"an":"可以通过网络违法犯罪举报网站（cyberpolice.mps.gov.cn）、《网络举报》应用软件等正规渠道举报网络谣言。","o":["A. 网络违法犯罪举报网站","B. 任何个人社交账号","C. 随意发帖","D. 没有正规举报渠道"]},{"t":"s","q":"\"清朗\"系列专项行动的主要目的是？","a":1,"an":"\"清朗\"系列专项行动是由中央网信办会同相关部委开展的专项行动，旨在集中整治网络违法违规问题，有效遏制网络乱象。","o":["A. 推广互联网广告","B. 集中力量整治网络违法违规问题遏制乱象","C. 增加网络流量","D. 推广新型社交软件"]},{"t":"s","q":"转发网络谣言可能造成什么后果？","a":1,"an":"转发网络谣言即使事后道歉，造成的伤害也难以挽回。教材中案例显示善意转发也可能伤害无辜。","o":["A. 没有问题","B. 伤害他人难以挽回，扰乱社会秩序","C. 一定会获得表扬","D. 对传播者没有任何影响"]},{"t":"s","q":"治理网络暴力的正确方式是？","a":1,"an":"网络暴力是复杂社会问题，需要社会各界共同努力，从法律、教育、平台管理等多个方面进行综合治理。","o":["A. 不需要治理","B. 从法律、教育、平台管理多方面综合治理","C. 只靠技术手段","D. 只靠个人自觉"]},{"t":"s","q":"关于人工智能筛查不良内容的正确态度是？","a":1,"an":"AI筛查速度快但可能误判和漏判，需要人工监督补充。同时也需注意AI可能带来更多网络谣言和网络水军的风险。","o":["A. AI完全准确不会误判","B. AI可以帮助筛查，但需要人工监督和补充","C. AI完全不应该用于内容审查","D. AI筛查不会监控用户行为"]},{"t":"s","q":"建设良好网络生态需要谁的努力？","a":1,"an":"和网络安全一样，建设良好网络生态需要每个参与者的付出，需要政府、企业、学校、个人等社会各界共同努力。","o":["A. 只需要政府","B. 需要社会各界和每个参与者的共同付出","C. 只需要企业","D. 只需要学校"]},{"t":"j","q":"网络暴力只会给受害者造成心理压力，不影响社会和谐。","a":1,"an":"错误。网络暴力不仅给受害者心理压力，还会破坏社会舆论环境，引发社会矛盾和群体对立，影响社会和谐安定。","o":["正确","错误"]},{"t":"j","q":"看到网络谣言后应该积极举报反映问题。","a":0,"an":"正确。作为初中生看到疑似谣言应先向老师和家长求证，然后通过正规渠道举报反映问题。","o":["正确","错误"]},{"t":"j","q":"网络水军是指合法的网络评论员。","a":1,"an":"错误。网络水军是被雇佣的网络写手，伪装成普通网民发布大量带有倾向性的内容试图影响他人判断，是需要治理的乱象。","o":["正确","错误"]},{"t":"j","q":"机器筛查网络不良内容完全不会出现误判和漏判。","a":1,"an":"错误。机器筛查可能快但也会出现误判和漏判，需要人工手段进行监督和补充。","o":["正确","错误"]},{"t":"m","q":"以下哪些行为可能构成网络暴力？（多选）","a":[0,1,2],"an":"网络暴力包括侮辱、诽谤、威胁、恐吓、人肉搜索等。D项理性讨论不属于网络暴力。","o":["A. 在网上侮辱他人","B. 在网上诽谤和威胁他人","C. 在网络中人肉搜索他人","D. 在网上理性讨论不同观点"]},{"t":"m","q":"治理网络环境中的不良现象需要从哪些方面入手？（多选）","a":[0,1,2,3],"an":"治理网络暴力、谣言、水军等需要法律、教育、平台管理和公众意识提升等多方面综合治理，全部正确。","o":["A. 法律手段","B. 教育宣传","C. 平台管理","D. 提高公众意识"]},{"t":"m","q":"面对人工智能筛查网络内容，正确的态度是？（多选）","a":[0,1,2],"an":"对AI筛查应持辩证态度：可以辅助但不能完全替代人工，需关注误判漏判，注意过度应用可能带来的新问题。D说法绝对化错误。","o":["A. AI筛查可以辅助但不能完全替代人工","B. 需关注AI可能带来的误判和漏判","C. AI过度应用可能带来新问题","D. AI筛查完全精准无需人工参与"]},{"t":"q","q":"什么是网络暴力？应该如何治理？","a":"网络暴力是指通过语言、图像、视频等形式在互联网中侮辱、诽谤、威胁、恐吓、人肉搜索他人，给受害者造成心理和精神压力。治理方式：(1)法律手段：完善相关法律法规；(2)教育宣传：提高公众网络素养；(3)平台管理：加强内容审核和处理；(4)多方协作：社会各界共同参与综合治理。","an":"网络暴力是一个复杂社会问题，需要从多个方面协同治理，创造健康友善安全的网络环境。"},{"t":"q","q":"面对网络谣言，正确的做法是什么？","a":"正确做法：(1)看到疑似谣言信息后先向老师和家长求证；(2)不要盲目转发，避免成为谣言传播者；(3)向互联网应用管理者投诉举报；(4)通过《网络举报》应用软件举报；(5)通过正规渠道如网络违法犯罪举报网站(cyberpolice.mps.gov.cn)反映问题。","an":"面对网络谣言要理性对待，不轻信不转发，积极通过正规渠道反映举报。"},{"t":"q","q":"请说明\"清朗\"系列专项行动的目的和意义。","a":"\"清朗\"系列专项行动由中央网信办会同相关部委部署开展。目的：集中力量整治各种网络违法违规问题，有效遏制网络乱象滋生蔓延。意义：(1)打击网络暴力、谣言、水军等乱象；(2)维护良好的网络生态；(3)保护公民合法权益；(4)促进网络空间的清朗有序。","an":"\"清朗\"行动是国家治理网络空间的重要举措，体现了对建设良好网络生态的重视。"}]},"g8":{"L01":[{"t":"s","q":"物联网的英文缩写 IoT 是下列哪个短语的缩写？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，IoT是Internet of Things的缩写，意为“物品的互联网”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>IoT即Internet of Things，中文译为物联网，指把物品用互联网连接起来，也就是“万物互联”。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>其余选项均为干扰拼凑，只有Internet of Things符合“I和T”的缩写含义。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>IoT就是“物”的网，Internet of Things记心上。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. Internet of Things","B. Interoperability of Technology","C. Integration of Tools","D. Information of Telecom"]},{"t":"s","q":"物联网的核心和基础仍然是下列哪一项？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，物联网是在互联网基础上发展起来的，其核心和基础仍然是互联网。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物联网是“物物相连的互联网”，把互联网从人与人的连接扩展到了人与物、物与物的连接。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>抓住“核心和基础”这一关键词，传感器只是感知部件，互联网才是根基。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>物联网，根在互联网；连万物，基础不能忘。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 传感器","B. 互联网","C. 人工智能","D. 大数据"]},{"t":"s","q":"现阶段物联网中的“物”主要是指什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，现阶段物联网中的“物”主要指装有传感器并能与互联网相连的物品。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物联网中的“物”泛指各种物品，但并非所有物品都已联网，当前主要是带传感器且能联网的物品。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>排除“所有物品”的绝对说法，结合“装有传感器并能联网”这一限定条件判断。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>物联之“物”，传感+联网才算数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 世界上所有的物品","B. 装有传感器并且能与互联网相连的物品","C. 仅指计算机","D. 仅指手机"]},{"t":"s","q":"物品要接入互联网，不需要具备以下哪个条件？","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选D，物品联网只需“有名字、可感知、能传输”三条件，不要求必须有人工智能芯片。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物品联网三条件：有名字（唯一编码）、可感知（提供自身数据）、能传输（交换数据）。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>前三项为教材明确条件，D项“必须AI芯片”明显过度要求，属干扰项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>联网三件宝：有名、能感、会传。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 有名字（可被识别的唯一编码）","B. 可感知（能提供物品本身的数据）","C. 能传输（可与其他物品交换数据）","D. 必须内置人工智能芯片"]},{"t":"s","q":"与互联网相比，物联网增加了什么能力？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，物联网增加了自动获取数据的能力，数据可由传感器感知并自动采集。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>互联网基于人，数据靠人采集；物联网基于物，数据由传感器自动采集，这是二者最大区别。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>对比“人采集”与“传感器自动采集”的差异即可排除错误项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>互联网靠人采，物联网靠传感自动来。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 人工采集数据","B. 由传感器自动获取数据","C. 视频播放","D. 文字处理"]},{"t":"s","q":"互联网主要是基于什么的网络？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，互联网是基于人的网络，数据在某种意义上是靠人来采集的。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>互联网实现人与人的互联，数据主要靠人采集；物联网实现人与物、物与物互联，靠传感器采集。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“基于人”是教材原话，与“物联网基于物”形成对比。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>互联网靠人，物联网靠物。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 物","B. 人","C. 传感器","D. 云"]},{"t":"s","q":"互联网到物联网的发展经历了三个阶段，正确的演进顺序是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，发展顺序是计算机互联→人人互联→物物互联（物联网）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>最初是计算机与计算机连接，后手机普及实现人人互联，再发展为物品接入网络的物联网。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按时间逻辑：先有计算机联网，再有人人移动互联，最后万物互联。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>机连人连再物连，三阶段别颠倒。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 物物互联→人人互联→计算机互联","B. 计算机互联→人人互联→物物互联","C. 人人互联→计算机互联→物物互联","D. 计算机互联→物物互联→人人互联"]},{"t":"s","q":"我国于哪一年提出“感知中国”概念，推动物联网快速发展？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，2009年“感知中国”概念提出，物联网迎来快速发展。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>我国物联网起步早，1999年中科院开始传感网研究，2009年提出“感知中国”。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>注意区分1999（开始研究）与2009（感知中国），题干问“感知中国”对应2009。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>九九研究，零九感知中国。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P13-14）。","o":["A. 1999年","B. 2009年","C. 2019年","D. 2023年"]},{"t":"s","q":"中国科学院从哪一年开始了物联网（传感网）相关研究？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，中国科学院于1999年开始了传感网（物联网前身）相关研究。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>我国物联网最早被称为“传感网”，中科院1999年起步，2009年“感知中国”推动发展。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干问“开始研究”，对应1999年，而非2009年提出概念。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>九九起步研究，零九提出概念。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P13-14）。","o":["A. 1999年","B. 2009年","C. 2015年","D. 2023年"]},{"t":"s","q":"截至2023年12月，我国三家基础电信企业发展的蜂窝物联网终端用户约为多少？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，截至2023年12月为23.32亿户。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材引用数据：我国三家基础电信企业发展蜂窝物联网终端用户23.32亿户，建成全球最大移动通信网络。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>注意数量级，“23.32亿户”是原文数据，排除其他数量级干扰。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>二三·三二亿，蜂窝物联用户数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P13-14）。","o":["A. 2.32亿户","B. 23.32亿户","C. 232亿户","D. 0.232亿户"]},{"t":"j","q":"物联网就是“物品的互联网”，也就是将物品用互联网络连接起来。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。物联网即Internet of Things，意为“物品的互联网”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>“物联网”是Internet of Things的直译，指把物品用互联网连接起来，也称“万物互联”。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干与教材定义一致，判断为正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>物联=物品+互联网。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。","o":["正确","错误"]},{"t":"j","q":"互联网和物联网没有关系，是完全独立的两张网。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。物联网的核心和基础仍然是互联网，是在其基础上发展起来的。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物联网是“物物相连的互联网”，并非独立网络，而是互联网的延伸与扩展。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“完全独立”与“核心基础是互联网”矛盾，故错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>物联根在互联网，并非两张网。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["正确","错误"]},{"t":"j","q":"给每个联网物品分配唯一标识（如IP地址），是物品上网的必要条件之一。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。物品要上网需有“名字”，即可被识别的唯一编码（身份标识）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>联网三条件之首是“有名字：有可被识别的唯一编码”，用于标识物品。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“唯一标识”对应“有名字”条件，表述正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>上网先有名，标识不可少。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。","o":["正确","错误"]},{"t":"j","q":"现阶段我们已经能做到让世界上所有的物品都连上互联网。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。现阶段还无法做到所有物品都上网，主要是装有传感器并能联网的物品。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材明确指出“目前我们还无法做到所有的物品都上网”。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“所有物品”说法绝对化，与教材“无法做到所有”矛盾。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>并非万物皆上网，传感联网才登场。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。","o":["正确","错误"]},{"t":"m","q":"物品接入互联网一般需要具备哪些条件？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C。物品联网三条件是“有名字、可感知、能传输”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>联网三条件为：有名字（唯一编码）、可感知（提供自身数据）、能传输（交换数据）。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>D项“必须连接5G”过度要求，并非必要条件，排除后选ABC。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>有名、能感、会传，三者齐全可联网。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。","o":["A. 有名字（可被识别的唯一编码）","B. 可感知（能提供物品本身的数据）","C. 能传输（可与其他物品交换数据）","D. 必须连接5G网络"]},{"t":"m","q":"下列哪些属于生活中已经联网的物品？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。教材表中电视、摄像头、热水器、门锁均已联网。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材列举：电视（更多节目源）、摄像头（远程查看）、热水器（回家前启动）、门锁（记录开门人并通知）。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均为教材明确举例的联网物品，全部选入。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>电视摄像热水锁，联网生活好处多。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。","o":["A. 电视","B. 摄像头","C. 热水器","D. 门锁"]},{"t":"m","q":"关于物联网与互联网的关系，下列说法正确的有哪些？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C。物联网以互联网为基础，且传感器自动采集区别于人采集。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>互联网基于人、数据靠人采；物联网基于物、数据由传感器自动采，二者核心基础相同。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>D项“完全不需要互联网”违背“核心基础是互联网”，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>基础同是网，采数人传感。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。","o":["A. 物联网的核心和基础仍然是互联网","B. 物联网的数据可由传感器自动采集","C. 互联网的数据主要靠人采集","D. 物联网完全不需要互联网"]},{"t":"q","q":"请简要说明物联网与互联网的关系。","a":"物联网的核心和基础仍然是互联网，是在互联网基础上发展起来的；物联网是“物物相连的互联网”，把互联网从人与人的连接扩展到了人与物、物与物的连接。互联网基于人、数据靠人采集，物联网基于物、数据由传感器自动采集。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>物联网以互联网为核心基础，是其延伸与扩展。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>互联网实现人人互联，物联网在其上实现人与物、物与物互联，二者一脉相承。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从“基础相同、连接对象扩展、采集方式不同”三方面作答即可。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>同根互联网，扩展人物物。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11-14）。"},{"t":"q","q":"物品要连接互联网一般需要具备哪三个基本条件？","a":"①有名字：有可被识别的唯一编码；②可感知：能提供物品本身的数据；③能传输：可与其他物品交换数据。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>三条件是“有名字、可感知、能传输”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物品联网须具备身份（唯一编码）、感知（提供数据）、传输（交换数据）三项能力。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>紧扣教材“联网三条件”原文，分三点作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>有名、能感、会传，上网三件宝。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。"},{"t":"q","q":"现阶段物联网中的“物”主要指什么？为什么还不能让所有物品都联网？","a":"现阶段主要指装有传感器并且能与互联网相连的物品。因为并非所有物品都装有传感器且具备联网能力，技术、成本、功耗等也限制了全面联网，所以目前还无法做到所有物品都上网。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>“物”指带传感器能联网的物品；全面联网尚难实现。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材明确“目前我们还无法做到所有的物品都上网”，联网需传感与网络能力支撑。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>先答定义，再从传感能力、技术成本功耗等角度说明限制。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>传感+联网方为物，全面联网尚不足。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第1课 开启物联网之门（P11）。"}],"L02":[{"t":"s","q":"传感器在物联网中相当于人的什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，传感器是物联网的感觉器官，被称为人类的“电五官”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>传感器如同人的眼耳鼻舌身，用于获取目标对象的各种数据，是物联网感知世界的基础。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“感官/电五官”是教材原比喻，对应感觉器官。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>传感器，电五官，感知世界靠它探。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P15-18）。","o":["A. 大脑","B. 感觉器官（电五官）","C. 手脚","D. 心脏"]},{"t":"s","q":"下列哪种古代发明可视为最古老的传感器之一？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，指南针（司南）利用地球磁场原理，是古代传感器代表。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>我国古代指南针、日晷、沙漏等因具有感知能力，可视为最古老的传感器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>电灯、电话、计算机均为现代产物，只有指南针属古代感知装置。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>司南指南针，古老传感器。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P15-16）。","o":["A. 指南针","B. 电灯","C. 电话","D. 计算机"]},{"t":"s","q":"日晷和沙漏主要用来感知什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，日晷利用日影测时刻，沙漏控制沙粒掉落测时间。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>日晷是计时仪器，沙漏、水钟也是古代利用流动测时间的装置，都属于感知时间的传感器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>二者共同点都是“测时间”，直接对应B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>日影沙漏流，古代计时手。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P16）。","o":["A. 温度","B. 时间","C. 湿度","D. 声音"]},{"t":"s","q":"传感器的定义是下列哪一个？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，这是教材给出的传感器定义。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>传感器是一种能将感应到的数据按一定规律转换成可用信号的器件或装置，满足传输、处理、存储等要求。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>抓住“转换信号”的本质，排除游戏、协议、存储等无关项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>传感=感数据，转信号。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P16）。","o":["A. 一种电子游戏","B. 能将感应到的数据按一定规律转换成可用信号的器件或装置","C. 一种网络协议","D. 一种存储设备"]},{"t":"s","q":"人的听觉能感知的声波频率范围约为？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，人的听觉范围约为20Hz~20KHz。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材指出人的听觉仅能感知20Hz~20KHz之间的声波，传感器可“听”到超声波。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>记牢“20Hz~20KHz”这一区间，区别于视觉的可见光频段。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>人耳二十到两万，超声红外它不见。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P17）。","o":["A. 0~20Hz","B. 20Hz~20KHz","C. 20KHz~20MHz","D. 任意频率"]},{"t":"s","q":"人的视觉能感知的是哪部分光？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选C，人的视觉仅能感知可见光部分。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>人眼可见光频率约3.9×10^14~7.5×10^14Hz，传感器可利用光敏元件“见”到红外与紫外。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“可见光”是教材明确范围，紫外、红外、X射线均非人眼可感。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>人眼只见可见光，传感能探红紫外。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P17）。","o":["A. 紫外线","B. 红外线","C. 可见光","D. X射线"]},{"t":"s","q":"智能手机中用于检测环境光强度并自动调节屏幕亮度的传感器是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，光敏传感器检测环境光强度以调节屏幕亮度。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>手机集成光敏传感器，随时检测光强，使屏幕根据环境光线自动调节亮度。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“光强度→调亮度”对应光敏传感器，排除加速度、磁力、陀螺仪。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>光敏测光调亮度。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P18）。","o":["A. 加速度传感器","B. 光敏传感器","C. 磁力传感器","D. 陀螺仪"]},{"t":"s","q":"智能手机中用于测量步数、检测运动方向的传感器是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选C，加速度传感器检测x、y、z三方向加速度，用于测量步数。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>加速度传感器检测三轴加速度，手机据此知道运动方向并计步。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“计步”是加速度传感器的典型应用，区别于光敏、距离、磁力。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>加速三轴测步数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P18）。","o":["A. 光敏传感器","B. 距离传感器","C. 加速度传感器","D. 磁力传感器"]},{"t":"s","q":"手机中“指南针”应用软件主要依靠哪种传感器？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，磁力传感器检测周围磁场强度，用于指南针应用。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>磁力传感器检测手机周围磁场强度，配合指南针软件指示方向。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>指南针靠磁场，对应磁力传感器。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>磁力传感做指南。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P18）。","o":["A. 磁力传感器","B. 光敏传感器","C. 陀螺仪","D. 温度传感器"]},{"t":"s","q":"现代传感器的发展趋势不包括以下哪项？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选C，趋势是更小、更强、更节能，而非越来越笨重。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>传感器向更智能、更便捷、更集成方向发展，体积更小、功能更强、价格更低、更节能。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“越来越笨重”与“体积小、功能强”趋势相反，为错误项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>集成智能无线化，笨重可不是方向。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P18）。","o":["A. 集成化","B. 智能化","C. 越来越笨重","D. 无线化"]},{"t":"j","q":"传感器能将不易测量的物理量转化为容易测量的量（如电学量）。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。传感器实质是将不易测的物理量转化为易测的电学量等。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>传感器由敏感元件（感知）和转换元件（转成可传输度量的信号）构成。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“转换信号”是传感器本质，表述正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>难测转易测，传感真本事。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P16）。","o":["正确","错误"]},{"t":"j","q":"指南针（司南）是利用地球磁场原理来指示方向的古代传感器。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。指南针利用地球磁场确定方向，是古代传感器。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>司南利用地球磁场原理指示方向，属最古老传感器之一。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与教材“指南针利用地球磁理原理”一致，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>司南靠磁场，方向它来指。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P16）。","o":["正确","错误"]},{"t":"j","q":"古代传感器精度通常较高，已经能和现代传感器媲美。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。古代传感器基于简单物理原理、依赖经验，精度相对较低。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材明确古代传感器“精度相对较低”，现代传感器精度高、形态各异。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“已经能媲美”与“精度相对较低”矛盾，错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>古传精度低，今传更精细。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P15-16）。","o":["正确","错误"]},{"t":"j","q":"同一种传感器只能应用在一个领域，不能跨领域使用。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。同一种传感器可应用于不同领域，如温度传感器用于工业和医疗。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材指出“同一种传感器可以应用在不同领域”，也提到实现同一功能可用不同传感器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“只能一个领域”过于绝对，与教材举例矛盾。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>一传感多用，一功能多传感。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P17）。","o":["正确","错误"]},{"t":"m","q":"下列哪些属于古代传感器的例子？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C。指南针、日晷、沙漏均为古代传感器。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>古代传感器还有圭表、水钟、测风器、测雨器等；蓝牙是现代无线通信技术。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>D项蓝牙是现代通信协议，非古代传感器，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>指南日晷沙漏，古传三代表。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P15-16）。","o":["A. 指南针","B. 日晷","C. 沙漏","D. 蓝牙"]},{"t":"m","q":"下列哪些是教材中提到的常见传感器？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均为教材列举的常见传感器。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材还列举了光敏、声音、图像、磁力、位置、气压、超声波、紫外线、称重等传感器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均为教材明示传感器，全部选入。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>温湿加速红外，传感种类多。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P17）。","o":["A. 温度传感器","B. 土壤湿度传感器","C. 加速度传感器","D. 红外热释电传感器"]},{"t":"m","q":"智能手机集成了多种传感器，下列对应关系正确的是？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均符合教材手机传感器对应关系。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>光敏调亮度、距离防误触、加速度计步、磁力做指南针，陀螺仪测方向角速度。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>逐项对照教材手机传感器功能表，四项全部正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>光调亮、距熄屏、加速步、磁力针。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P18）。","o":["A. 光敏传感器—调节屏幕亮度","B. 距离传感器—打电话靠近耳朵自动熄屏","C. 加速度传感器—测量步数","D. 磁力传感器—指南针应用"]},{"t":"q","q":"请说明现代传感器相比古代传感器有哪些进步/特点。","a":"古代传感器基于简单物理原理、依赖经验、精度较低；现代传感器利用光、声、磁、力等原理，种类多、精度高、形态各异，并正朝着集成化、智能化、无线化方向发展，已从简单电子零件发展为具有感知、计算、存储、传输功能的集成化装置。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>现代传感器精度高、种类多、集成智能无线化。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>对比古代（简单、低精度）与现代（高精度、集成化装置）传感器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从原理、精度、形态、发展趋势几方面比较作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>古简今精，集成智能无线行。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P15-18）。"},{"t":"q","q":"用生活中的例子说明“同一种传感器可应用在不同领域”或“实现同一功能可用不同传感器”。","a":"同一种传感器跨领域：温度传感器既可用于工业监控温度，也可用于医疗监测病人体温。实现同一功能用不同传感器：测量无人机飞行高度，可用气压传感器、超声波传感器或红外传感器。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>用温度传感器的跨领域和测高度的多种传感器说明。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材强调同种传感器多领域、同功能多传感器两种现象。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>各举一个教材原例即可完整得分。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>一传感多用，一功能多传感。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P17）。"},{"t":"q","q":"传感器由哪两部分核心环节构成？各自作用是什么？","a":"敏感元件——直接感受或响应被测量，感知环境数据、接收输入信号；转换元件——将敏感元件的变化转换成适合传输和度量的信号，实现信号输出。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>敏感元件感知输入，转换元件输出信号。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材将敏感元件与转换元件抽象为“计算”，前者感知、后者转换输出。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>分两点答出“感知”与“转换输出”的作用。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>敏感来感知，转换出信号。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第2课 传感之古今未来（P16）。"}],"L03":[{"t":"s","q":"声音的强弱通常用什么单位表示？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，声音强弱用分贝（dB）表示。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>噪声大小用分贝衡量，过大噪声损害听力、神经系统和心脑血管系统。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>Hz是频率、W是功率、A是电流，dB才是响度单位。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>声响用分贝，赫兹是频率。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P19-20）。","o":["A. 赫兹（Hz）","B. 分贝（dB）","C. 瓦特（W）","D. 安培（A）"]},{"t":"s","q":"噪声过大可能损害人体的哪些方面？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，噪声过大会损伤听力、影响神经系统、损害心脑血管。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材指出噪声与人体健康息息相关，过大噪声带来多重危害。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>抓住“听力、神经、心脑血管”三项危害，排除片面项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>噪声伤听力，神经血管俱。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P19）。","o":["A. 只损害视力","B. 听力、神经系统、心脑血管系统","C. 只损害消化系统","D. 没有任何影响"]},{"t":"s","q":"利用传感器开展实践探索的方式，不包括下列哪一项？","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选D，实践需借助真实设备或软件，不能仅靠想象。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>实践方式有三种：智能终端、传感器产品、物联实验设备。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>前三项为教材明示方式，D明显非实践方法。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>终端产品实验板，三法探感知。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P19-22）。","o":["A. 使用智能终端","B. 使用传感器产品","C. 使用物联实验设备","D. 仅靠想象猜测"]},{"t":"s","q":"智能终端中用来检测环境声音分贝值的软件，通常调用的是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，分贝软件利用麦克风（声音传感器）获取声音并换算分贝值。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>噪声检测软件利用麦克风采集声音，经计算得到分贝值。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“检测声音”对应麦克风/声音传感器。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>测声靠麦克，分贝软件算。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P20）。","o":["A. 摄像头","B. 麦克风（声音传感器）","C. 屏幕","D. 电池"]},{"t":"s","q":"噪声测试仪的核心是把声音转换成具体数据，它主要使用什么传感器？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，噪声测试仪核心是声音传感器将声音大小转为数据。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>噪声测试仪核心就是利用声音传感器将噪声转换为具体数据。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“噪声”对应声音传感器，排除温光湿。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>噪声测试仪，声音传感芯。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P20）。","o":["A. 温度传感器","B. 声音传感器","C. 光敏传感器","D. 湿度传感器"]},{"t":"s","q":"物联实验设备通常分为主控板、传感器和什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，物联实验设备分主控板、传感器、执行器三类。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材明确物联实验设备通常分为主控板、传感器和执行器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>记牢“主控板、传感器、执行器”三件套。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>主控传感加执行，实验三件套。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P21）。","o":["A. 显示器","B. 执行器","C. 路由器","D. 电池"]},{"t":"s","q":"主控板主要以哪些部分为核心构成？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，主控板以运算处理器、存储器及电源等为主要构成。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>主控板是电子系统，核心是运算处理、存储与供电部分。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“运算+存储+电源”为主控板核心，排除单一部件项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>主控三核心，算存电。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第3课 环境数据要感知（P21）。","o":["A. 运算处理器、存储器、电源","B. 仅含屏幕","C. 仅含电池","D. 仅含天线"]},{"t":"s","q":"在物联实验设备中，读取板载声音传感器数值通常使用的方法是？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案
