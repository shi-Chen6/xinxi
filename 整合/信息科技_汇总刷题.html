<!DOCTYPE html>
<html lang="zh-CN" data-g="g7" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E67E22">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>信息科技 · 七八年级刷题汇总</title>
<style>
/* ================= 主题变量 ================= */
:root{
  --acc:#E67E22; --acc2:#F2A24E; --accSoft:#FDF0E1; --accText:#C2620A;
  --bg:#F5F3F0; --card:#FFFFFF; --card2:#FAF8F5;
  --tx:#22262B; --tx2:#6E7681; --tx3:#A2A8B0;
  --line:#E8E3DB; --line2:#F1EDE6;
  --ok:#12894B; --okSoft:#E6F6EC; --bad:#D63030; --badSoft:#FCE9E9;
  --sh:0 1px 2px rgba(28,24,18,.04),0 10px 30px -18px rgba(28,24,18,.28);
  --r:16px; --r2:12px;
  --navh:54px;
  --safe:env(safe-area-inset-bottom,0px);
}
html[data-g="g8"]{
  --acc:#2563EB; --acc2:#5B8FF9; --accSoft:#E9F0FE; --accText:#1D4ED8;
}
html[data-theme="dark"]{
  --bg:#0F1114; --card:#191C21; --card2:#15181C;
  --tx:#E8EAED; --tx2:#98A0AA; --tx3:#68707A;
  --line:#2A2E35; --line2:#20242A;
  --acc:#F0923A; --accSoft:#2C2117; --accText:#F5A55A;
  --ok:#3FBF74; --okSoft:#122A1D; --bad:#F26A6A; --badSoft:#2F1719;
  --sh:0 1px 2px rgba(0,0,0,.55);
}
html[data-theme="dark"][data-g="g8"]{
  --acc:#5B8FF9; --accSoft:#16233A; --accText:#7CA9FF;
}

/* ================= 基础 ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accText);text-decoration:none}
strong,b{font-weight:700}
::-webkit-scrollbar{width:0;height:0}

#app{
  max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding-bottom:calc(var(--navh) + var(--safe) + 6px);position:relative;
}
@media(min-width:600px){
  body{background:#EAE6E0}
  html[data-theme="dark"] body{background:#08090A}
  #app{box-shadow:0 0 0 1px rgba(0,0,0,.07),0 30px 80px -40px rgba(0,0,0,.45);min-height:100vh}
  html[data-theme="dark"] #app{box-shadow:0 0 0 1px rgba(255,255,255,.07),0 30px 80px -40px rgba(0,0,0,.8)}
}

/* ================= 顶栏 ================= */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:9px;
  padding:9px 13px;background:var(--bg);border-bottom:1px solid var(--line2);
}
.brand{font-size:14.5px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block;flex:none}
.brand b{color:var(--accText);font-weight:800}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px;margin-left:auto;flex:none}
.seg button{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:8px;color:var(--tx2);transition:.16s;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--accText);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--card2);border:1px solid var(--line);flex:none;line-height:1}

/* ================= 底部导航 ================= */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;display:flex;background:var(--card);
  border-top:1px solid var(--line);z-index:70;
  height:calc(var(--navh) + var(--safe));padding-bottom:var(--safe);
}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-size:10.5px;font-weight:700;color:var(--tx3);transition:.15s}
.tabbar button.on{color:var(--accText)}
.tabbar .ico{font-size:18px;line-height:1;opacity:.72;transition:.15s}
.tabbar button.on .ico{opacity:1}

/* SVG 图标尺寸 */
.tabbar .ico svg{width:21px;height:21px;display:block}
.icon-btn svg{width:16px;height:16px;display:block}
.qhead .bt svg{width:15px;height:15px;display:block}
.arrows svg{width:15px;height:15px;display:block}
.backbar button svg{width:13px;height:13px;display:block;margin-right:1px}
.lesson .arrows,.backbar button{display:flex;align-items:center}

/* ================= 页面通用 ================= */
.page{padding:13px 13px 22px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.page-hd{margin:1px 2px 13px}
.page-hd h1{font-size:19px;font-weight:800;margin:0 0 2px;letter-spacing:-.015em;line-height:1.3}
.page-hd p{margin:0;font-size:12.5px;color:var(--tx2)}
.sec-t{font-size:12px;font-weight:800;color:var(--tx2);letter-spacing:.04em;margin:18px 2px 9px;display:flex;align-items:center;gap:6px}
.sec-t:first-child{margin-top:2px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;padding:46px 20px;color:var(--tx3);font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.7}

/* ================= 卡片 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.unit{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px 14px;margin-bottom:9px;box-shadow:var(--sh);
  transition:transform .12s,box-shadow .18s;position:relative;overflow:hidden;
}
.unit:active{transform:scale(.988)}
.unit .u-no{font-size:10.5px;font-weight:800;color:var(--accText);letter-spacing:.08em;margin-bottom:2px;display:flex;align-items:center;gap:5px}
.unit .u-t{font-size:15px;font-weight:700;margin-bottom:9px;line-height:1.35;letter-spacing:-.01em}
.unit .u-meta{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums}
.unit .u-meta .go{margin-left:auto;color:var(--accText);font-weight:800;flex:none;display:flex;align-items:center;gap:2px}
.unit .ubar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line2)}
.unit .ubar i{display:block;height:100%;background:var(--acc);transition:width .45s cubic-bezier(.3,.8,.3,1)}
.bar{flex:1;height:6px;background:var(--line2);border-radius:4px;overflow:hidden;min-width:36px;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .45s cubic-bezier(.3,.8,.3,1);min-width:0}

.resume{display:flex;align-items:center;gap:11px;padding:12px 14px;margin-bottom:9px;background:var(--accSoft);border:1px solid var(--acc);border-radius:var(--r)}
.resume .r-ico{font-size:20px;line-height:1}
.resume .r-tx{flex:1;min-width:0}
.resume .r-tx b{display:block;font-size:13px;font-weight:700;color:var(--accText);margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .r-tx span{font-size:11px;color:var(--tx2)}
.resume .r-go{font-size:12.5px;font-weight:800;color:var(--accText);flex:none}

/* 课列表 */
.lesson{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;margin-bottom:7px;box-shadow:var(--sh)}
.lesson .l-idx{width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--tx2);flex:none;font-variant-numeric:tabular-nums}
.lesson.done .l-idx{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.lesson .l-main{flex:1;min-width:0}
.lesson .l-t{font-size:13.8px;font-weight:700;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson .l-s{font-size:10.5px;color:var(--tx2);display:flex;gap:8px;font-variant-numeric:tabular-nums}
.lesson .l-s em{font-style:normal;color:var(--ok);font-weight:700}
.lesson .l-s em.bad{color:var(--bad)}
.lesson .arrows{font-size:14px;color:var(--tx3);flex:none}

/* 返回条 */
.backbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.backbar button{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--tx2);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:9px}
.backbar .bb-t{font-size:12px;color:var(--tx3);margin-left:auto;font-weight:600}

/* ================= 答题页 ================= */
.quizwrap{padding-bottom:112px}
.qhead{display:flex;align-items:center;gap:7px;padding:8px 12px 7px}
.qhead .bt{width:31px;height:31px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none;line-height:1}
.qhead .mid{flex:1;min-width:0;text-align:center}
.qhead .mid b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.qhead .mid span{font-size:10px;color:var(--tx2);font-variant-numeric:tabular-nums}
.qprog{height:3px;background:var(--line2);margin:0 12px 10px;border-radius:2px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s ease}
.qcard{margin:0 0 10px;padding:15px 14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.badge.s{background:#EAF1F8;color:#2C6C9E}
.badge.m{background:#F3EBFA;color:#7A4FA8}
.badge.j{background:#E6F5F0;color:#0E8A6B}
.badge.q{background:#FDF0E1;color:#B4680F}
html[data-theme="dark"] .badge.s{background:#17242F;color:#7FB4DA}
html[data-theme="dark"] .badge.m{background:#231A2C;color:#B694D8}
html[data-theme="dark"] .badge.j{background:#122620;color:#5FD0AC}
html[data-theme="dark"] .badge.q{background:#2C2117;color:#E9A85F}
.qno{margin-left:auto;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums;font-weight:700}
.stem{font-size:15.8px;font-weight:600;line-height:1.58;margin-bottom:13px;letter-spacing:-.005em;word-break:break-word}
.stem .hl{color:var(--accText)}

.opt{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:7px;transition:border-color .16s,background .16s,transform .1s;cursor:pointer;font-size:14.3px;line-height:1.52;word-break:break-word}
.opt:active{transform:scale(.994)}
.opt .k{width:19px;height:19px;border-radius:6px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--tx2);flex:none;margin-top:1px;transition:.16s}
.opt .tx{flex:1;min-width:0}
.opt .res{font-size:13px;flex:none;margin-top:1px;font-weight:800}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.sel .k{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ok .res{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.bad .res{color:var(--bad)}
.opt.fade{opacity:.5}
.opt.locked{cursor:default}

.ta{width:100%;min-height:88px;padding:10px 11px;border:1.5px solid var(--line);border-radius:11px;background:var(--card2);color:var(--tx);font-size:14.3px;line-height:1.6;resize:vertical;font-family:inherit}
.ta:focus{outline:none;border-color:var(--acc)}

.ana{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:13.2px;line-height:1.78;animation:drop .24s ease}
@keyframes drop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.ana strong{font-weight:800}
html[data-theme="dark"] .ana{filter:brightness(1.5) saturate(1.05)}
.ana .ref{display:block;margin-top:6px;font-size:12px;color:var(--tx2)}

.selfgrade{display:flex;gap:8px;margin-top:11px}
.selfgrade .btn{flex:1;font-size:13px;padding:8px 0}

/* 底部答题工具条 */
.qfoot{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--safe));
  width:100%;max-width:430px;display:flex;gap:7px;align-items:center;
  padding:7px 12px;background:var(--card);border-top:1px solid var(--line);z-index:55;
}
.qfoot .btn{flex:1;padding:9px 0;font-size:13px;border-radius:10px}
.qfoot .sheet-btn{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:9.5px;font-weight:700;color:var(--tx2);background:none;border:0;padding:3px 0;line-height:1.35}
.qfoot .sheet-btn .ico{font-size:15px}
.qfoot .mpos{flex:0 0 62px;text-align:center;font-size:11.5px;font-weight:800;color:var(--tx2);font-variant-numeric:tabular-nums}

/* ================= 背题模式 ================= */
.lesson .memo-btn{flex:none;align-self:center;font-size:10.5px;font-weight:800;color:var(--accText);background:var(--accSoft);padding:5px 9px;border-radius:8px;line-height:1.2;white-space:nowrap;transition:transform .12s}
.lesson .memo-btn:active{transform:scale(.95)}
.reveal{width:100%;padding:24px 16px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card2);color:var(--tx2);font-size:13.5px;font-weight:700;text-align:center;transition:.16s}
.reveal:active{background:var(--accSoft);border-color:var(--acc);color:var(--accText)}
.opt.memo{cursor:default}
.opt.memo:active{transform:none}
.refans{background:var(--card2);border-radius:11px;padding:11px 12px;margin-bottom:10px;font-size:13.4px;line-height:1.78}
.refans b{display:block;font-size:11.5px;font-weight:800;color:var(--accText);margin-bottom:5px}

/* ================= 按钮 ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:800;background:var(--acc);color:#fff;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.976)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.soft{background:var(--accSoft);color:var(--accText)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}

/* ================= 抽屉/弹窗 ================= */
.mask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,12,8,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:430px;background:var(--card);border-radius:20px 20px 0 0;z-index:91;
  transition:transform .27s cubic-bezier(.32,.72,0,1);
  padding:15px 15px calc(18px + var(--safe));max-height:74vh;overflow:auto;
}
.sheet.on{transform:translate(-50%,0)}
.sheet .sh-hd{display:flex;align-items:center;margin-bottom:3px}
.sheet .sh-hd h3{font-size:14.5px;font-weight:800;margin:0}
.sheet .sh-hd button{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:700}
.sheet .legend{display:flex;gap:13px;font-size:10.5px;color:var(--tx2);margin:2px 0 12px}
.sheet .legend span{display:flex;align-items:center;gap:4px}
.sheet .legend i{width:9px;height:9px;border-radius:3px;display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cell{height:38px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--tx2);font-variant-numeric:tabular-nums}
.cell.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--acc);outline-offset:-1px}

.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:95;display:grid;place-items:center;padding:26px;opacity:0;pointer-events:none;transition:opacity .2s;background:rgba(15,12,8,.5)}
.modal.on{opacity:1;pointer-events:auto}
.modal .mbox{width:100%;max-width:320px;background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35);transform:scale(.93);transition:transform .24s cubic-bezier(.3,.8,.3,1)}
.modal.on .mbox{transform:scale(1)}
.modal .mbox h3{font-size:16px;font-weight:800;margin:0 0 4px}
.modal .mbox .sub{font-size:12px;color:var(--tx2);margin-bottom:14px}
.score-ring{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.score-ring small{font-size:14px;font-weight:800;opacity:.6}
.stat-row{display:flex;justify-content:center;gap:18px;margin:12px 0 16px;font-size:11.5px;color:var(--tx2)}
.stat-row div b{display:block;font-size:16px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
.modal .acts{display:flex;flex-direction:column;gap:7px}

.toast{position:fixed;left:50%;bottom:130px;transform:translate(-50%,14px);background:rgba(20,18,15,.92);color:#fff;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:20px;z-index:99;opacity:0;pointer-events:none;transition:.24s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= 笔记 / 教材 内容排版 ================= */
.kb,.tb{font-size:14px;line-height:1.78;word-break:break-word}
.kb h3,.tb h3{font-size:14.3px;font-weight:800;margin:17px 0 6px;padding-left:8px;border-left:3px solid var(--acc);line-height:1.45}
.kb h3:first-child,.tb h3:first-child{margin-top:0}
.kb h4,.tb h4{font-size:13.2px;font-weight:800;margin:13px 0 5px;color:var(--accText)}
.kb p,.tb p{margin:6px 0}
.kb ul,.kb ol,.tb ul,.tb ol{margin:6px 0;padding-left:19px}
.kb li,.tb li{margin:3px 0}
.kb strong,.tb strong{font-weight:700}
.kb strong.recitable,.tb strong.recitable{background:linear-gradient(transparent 62%,var(--accSoft) 0);font-weight:700}
.kb table,.tb table{width:100%;border-collapse:collapse;margin:9px 0;font-size:11.8px;line-height:1.5;table-layout:auto}
.kb th,.kb td,.tb th,.tb td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;word-break:break-word}
.kb th,.tb th{background:var(--card2);font-weight:800;white-space:nowrap}
.kb td:first-child,.tb td:first-child{white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:9px -2px;padding:0 2px}
.tw table{margin:0}
.kb em,.tb em{font-style:normal;color:var(--accText);font-weight:600}
.kb code{background:var(--card2);padding:1px 4px;border-radius:4px;font-size:12px}

/* 教材专用块 */
.tb .note-box{background:var(--accSoft);border-radius:12px;padding:11px 12px;margin:10px 0}
.tb .note-title{font-size:11.5px;font-weight:800;color:var(--accText);margin-bottom:4px}
.tb .ref-box{background:var(--card2);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:9px 11px;margin:10px 0}
.tb .ref-title{font-size:11.5px;font-weight:800;color:var(--accText);margin-bottom:3px}
.tb .tip-box{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:8px 0}
.tb .tip-title{font-size:11.5px;font-weight:800;color:var(--accText);margin-bottom:3px}
.tb .lesson-num{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:5px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:800;vertical-align:1px}
.tb .page-ref{font-size:10.5px;font-weight:700;color:var(--tx3);background:var(--card2);padding:1px 5px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
.tb .tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--accSoft);color:var(--accText);vertical-align:1px;white-space:nowrap}
.tb h2{font-size:15.5px;font-weight:800;margin:0 0 10px;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:6px}

/* 笔记课详情分区 */
.part{margin-top:15px}
.part-hd{font-size:12.5px;font-weight:800;color:var(--accText);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.part-body{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--sh)}

/* 折叠 */
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:7px;overflow:hidden;box-shadow:var(--sh)}
.acc-hd{display:flex;align-items:center;gap:9px;padding:11px 12px;width:100%;text-align:left}
.acc-hd .a-no{font-size:11px;font-weight:800;color:var(--accText);flex:none;width:22px}
.acc-hd .a-t{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.35}
.acc-hd .a-x{font-size:11px;color:var(--tx3);transition:transform .2s;flex:none}
.acc.open .acc-hd .a-x{transform:rotate(180deg)}
.acc-bd{display:none;padding:0 12px 10px;border-top:1px solid var(--line2);margin-top:0}
.acc.open .acc-bd{display:block}
.acc-bd .row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}
.acc-bd .row:last-child{border-bottom:0}
.acc-bd .row span{font-size:12.8px;font-weight:600;flex:1;min-width:0;line-height:1.4}
.acc-bd .row em{font-style:normal;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}

/* 搜索 */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;color:var(--tx);font-size:14px;font-family:inherit;outline:none;min-width:0}
.search input::placeholder{color:var(--tx3)}
.search .ic{font-size:14px;opacity:.55}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px;box-shadow:var(--sh)}
.sres .s-h{font-size:12.5px;font-weight:800;margin-bottom:3px;line-height:1.4}
.sres .s-h em{font-style:normal;color:var(--accText);font-size:10.5px;font-weight:700;margin-right:5px}
.sres .s-b{font-size:12px;color:var(--tx2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sres mark{background:var(--accSoft);color:var(--accText);font-weight:700;padding:0 1px;border-radius:2px}

/* 我的页 */
.ov{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:9px}
.ov .big-n{display:flex;align-items:baseline;gap:5px;font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.ov .big-n small{font-size:13px;font-weight:700;color:var(--tx2)}
.ov .ov-sub{font-size:11.5px;color:var(--tx2);margin-top:2px}
.ov .ov-bars{margin-top:13px;display:flex;flex-direction:column;gap:9px}
.ov .ov-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.ov .ov-line b{width:42px;font-weight:800;color:var(--tx);flex:none}
.ov .ov-line em{font-style:normal;width:52px;text-align:right;flex:none}
.kv{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line2);font-size:13.5px;font-weight:600}
.kv:last-child{border-bottom:0}
.kv .kv-r{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:700}
.switch{width:42px;height:25px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(17px)}

.hist-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.hist-row:last-child{border-bottom:0}
.hist-row .h-l{flex:1;min-width:0}
.hist-row .h-l b{display:block;font-size:12.8px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .h-l span{font-size:10.5px;color:var(--tx3)}
.hist-row .h-r{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.hist-row .h-r.bad{color:var(--bad)}
.hist-row .h-r.good{color:var(--ok)}

.wq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.wq .w-h{display:flex;gap:6px;align-items:center;font-size:10px;font-weight:800;color:var(--tx3);margin-bottom:4px}
.wq .w-h .tag{background:var(--badSoft);color:var(--bad);padding:1px 6px;border-radius:5px}
.wq .w-q{font-size:13px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

</style>

 记忆口诀：<\/strong>1.0只能看，2.0能互动，3.0更智能<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第1课 互联网发展靠创新——Web发展三阶段","o":["A. 用户可自主发布内容","B. 静态网页，用户只能阅读信息","C. 人工智能个性化推荐","D. 区块链去中心化"]},{"t":"s","q":"以下哪项属于Web2.0阶段的代表性应用？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>Web2.0阶段以社交网络、博客、微博、BBS等为代表，用户可自主发布和分享内容。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>21世纪社交媒体问世标志Web2.0到来。典型应用包括QQ、微博、百度贴吧。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>Web2.0关键词：社交、互动、用户生成内容。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>博客微博BBS，Web2.0人人参与<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第1课 互联网发展靠创新——Web2.0阶段特征","o":["A. 静态门户网站","B. 博客和社交网络","C. 智能语音助手","D. 虚拟现实元宇宙"]},{"t":"s","q":"中国进入5G商用元年的年份是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>2019年6月，工信部正式向三大运营商发放5G商用牌照，中国进入5G商用元年。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>5G具有高速率、低时延、大连接三大特点。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>2018年实验许可，2019年正式商用。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>一九年发牌照，5G商用新时代<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第1课 互联网发展靠创新——5G技术","o":["A. 2017年","B. 2018年","C. 2019年","D. 2020年"]},{"t":"s","q":"移动互联网阶段的主要推动力是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>网络技术与移动通信结合推动了移动互联网快速发展，智能手机等终端的普及是关键。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>从3G到5G，移动通信技术迭代为移动互联网提供了高速基础。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>移动互联网=移动通信网络+智能终端。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>智能手机加5G，移动网络随身带<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第1课 互联网发展靠创新——移动互联网阶段","o":["A. 光纤宽带普及","B. 智能手机和移动通信技术发展","C. 区块链技术成熟","D. 量子计算突破"]},{"t":"s","q":"中国第一款即时通信工具OICQ(后改名QQ)创立的年份是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>1999年2月，腾讯在深圳创立并推出了中国第一款即时通信工具OICQ(后改名QQ)。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>QQ是中国互联网发展的里程碑产品，开创了即时通信先河。<br><br><strong style=\"color:#27ae60;\ ]},{"t":"s","q":"数据分包传输的主要优势不包括?","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>分包传输提高效率容错共享链路通常更高效不会更慢<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>一次性传大文件出错需重传全部效率低<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>D选项说更慢是错误的分包更高效<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>分包优势多快传容错共享<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——分包优势","o":["A. 提高网络线路利用率","B. 出错只需重传单个小包","C. 不同来源数据可共享链路","D. 传输速度一定比整体传输慢"]},{"t":"s","q":"接收端收到所有数据包后需做什么?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>接收端需按数据包上的编号顺序将它们重新组装还原成完整原始文件<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>数据包可能走不同路径顺序可能不同需靠编号正确组装<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>分包传输重组还原=完整流程<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>分包传输后编号来组装<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——数据重组","o":["A. 直接删除","B. 按编号重新组装成完整数据","C. 随机排列","D. 再次拆分"]},{"t":"s","q":"某个数据包丢失会怎样?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>分包最大优势:某包丢失或出错只需重传这一个包不需重传整个文件<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>TCP协议通过确认机制检测丢包自动请求重传保证可靠性<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>这是分包核心优势精细错误恢复<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>丢包不用怕单个重传就行<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——错误控制","o":["A. 整个文件需重新发送","B. 只需重传丢失的那个包","C. 文件直接损坏","D. 自动忽略"]},{"t":"s","q":"与数据分包不相关的协议是?","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>HTML是网页标记语言描述网页结构不属于数据传输协议<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>TCP负责可靠传输IP负责寻址路由UDP负责快速传输<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>HTML=网页语言不是传输协议<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>HTML是网页语TCPIP才传数<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——传输协议","o":["A. TCP传输控制协议","B. IP互联网协议","C. UDP用户数据报协议","D. HTML超文本标记语言"]},{"t":"s","q":"存储转发中设备暂存数据的主要目的是?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>暂存为了等待合适传输时机防止数据丢失是临时存储非永久<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>存储是临时的转发完成后设备会删除数据包释放空间<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>临时存+等时机不是永久保存<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>暂存为转发不堵时不丢包<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——存储转发目的","o":["A. 永久保存用户数据","B. 等待合适传输时机防止数据丢失","C. 备份所有通信内容","D. 减慢传输速度"]},{"t":"s","q":"关于UDP协议正确的说法是?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>UDP是无连接协议无需建立连接直接发送速度快但不保证可靠<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>UDP如普通明信片快但不保证到TCP如挂号信可靠但慢<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>UDP=快速+无连接不保证可靠<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>TCP可靠UDP快各有所长<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——UDP","o":["A. 提供可靠传输保证不丢","B. 无连接协议速度快但不保证可靠","C. 主要用于网页浏览","D. 是TCP的升级版本"]},{"t":"s","q":"为什么互联网不采用一次性传输整个大文件?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>分包可提高效率多包并发增强可靠性丢包只重传单个实现网络共享<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>网络链路是共享资源一次性传输全会长时间占用链路<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>效率可靠性共享三理由<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>分包三优势高效可靠共享<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——分包必要性","o":["A. 文件太大无法存储","B. 提高传输效率增强可靠性和共享能力","C. 法律规定","D. 计算机性能不足"]},{"t":"j","q":"数据包在网络传输时所有包都必定经过同一路径到达。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。数据包无连接型传输各包不一定走同路可能不同路线<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>数据包独立路由是互联网设计特点提高网络坚固性<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>必定同一路径过于绝对<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>各包各路走灵活又安全<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——数据包路由特性","o":["正确","错误"]},{"t":"j","q":"存储转发可在网络故障时暂存数据包等恢复后再转发。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。存储转发重要功能是故障时暂存等恢复后继续转发增强可靠性<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>如在快递中转站前方封路包裹暂存等路通再送出<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>存储转发=缓存+转发应对不稳定<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>存储转发像快递堵车先存再送出<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——存储转发可靠性","o":["正确","错误"]},{"t":"j","q":"数据包头部包含源地址目的地址和序号等关键信息。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。头部包含源IP目的IP序号等控制信息是正确路由和重组必要条件<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>头部还包含协议类型包长度等没有头部无法处理转发<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>源地址目的地址序号=头部三基本<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>源头去向序号全头部信息要记清<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——包头部结构","o":["正确","错误"]},{"t":"j","q":"TCP协议是无连接协议不保证传输可靠性。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。TCP是面向连接的协议通过三次握手建立提供可靠传输<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>描述的是UDP特点TCP有确认重传机制<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>TCP=可靠有连接UDP=快速无连接<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>TCP连了才传保证到UDP不连就发快<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——TCP特性","o":["正确","错误"]},{"t":"m","q":"数据分包传输的优点有?","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确分包提高利用率实现精细错误控制支持多用户共享固定大小便于处理<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>分包传输是互联网高效运行基石如公路允许不同车辆交替通行<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四选项从效率容错共享标准化说<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>分包四优势高效容错共享标准<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——分包优势总结","o":["A. 提高网络线路利用率","B. 某包出错只需重传该包","C. 不同用户数据可交替传输","D. 数据包大小固定易于处理"]},{"t":"m","q":"关于数据包头部信息的正确描述?","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>ABC正确头部包含源目的地址序号等控制信息。D错误文件内容在数据载荷中<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>头部Header是控制信息数据载荷Payload是传输内容两者明确分工<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>头部控制信息≠载荷内容<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>头控身载头部管路由载荷装内容<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——数据包结构详","o":["A. 头部包含源IP地址","B. 头部包含目的IP地址","C. 头部包含数据包序号","D. 头部包含文件所有内容"]},{"t":"m","q":"关于TCP和UDP的正确说法?","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确。TCP可靠适文件下载UDP快速适实时应用各有所长<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>文件需完整性用TCP视频需实时性用UDP<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>TCP求准UDP求快<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>文件TCP保完整视频UDP求流畅<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——TCP与UDP应用","o":["A. TCP是面向连接的可靠传输","B. UDP是无连接的快速传输","C. 视频通话适合UDP","D. 文件下载适合TCP"]},{"t":"q","q":"描述数据分包传输的完整过程。","a":"四步过程:(1)分包:发送端将大文件按固定大小拆分添加头部源目的地址序号。(2)传输:各包经路由器和交换机独立传输采用存储转发逐跳前进。(3)重组:接收端根据序号将包按正确顺序排列。(4)还原:组装完成后还原完整文件丢包可请求重传该包。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>拆传组还四步走理解此过程有助理解互联网传输基本原理<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>真实网络更复杂涉及多层协议配合但核心逻辑是四步<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按时间顺序描述拆-传-组-还<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>拆传组还四步走数据分包灵活传<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——传输过程"},{"t":"q","q":"对比TCP和UDP的主要区别和应用场景。","a":"TCP与UDP区别:(1)连接:TCP面向连接需握手UDP无连接直接发。(2)可靠性:TCP保证可靠有确认重传UDP不保证。(3)速度:UDP更快TCP相对慢。(4)场景:TCP适合文件网页邮件等需完整性场景UDP适视频通话游戏直播等实时场景。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>TCP和UDP代表了可靠与速度两种取舍根据应用需求选择<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>TCP和UDP是传输层两大核心协议理解区别有助理解不同应用通信特点<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>连接可靠速度场景四维对比<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>TCP可靠慢如挂号UDP快如放飞鸽<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——协议对比"},{"t":"q","q":"为什么说存储转发增强了网络通信可靠性?","a":"四原因:(1)缓冲保护:故障或拥堵时暂存等恢复后继续。(2)错误检查:收完整包后可验证正确性发现错误请求重传。(3)流量适配:不同速率链路间起缓冲避免丢包。(4)独立决策:每设备独立决定时机路径某路不通可换路。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>存储转发通过缓存+验证+调度机制比直接转发大大提高可靠性<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>体现互联网尽力而为原则尽最大努力保证到达<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四角度:故障应对错误检查速率匹配路径选择<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>先存后查再转发断网堵车都不怕<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第4课——存储转发可靠性"}],"L05":[{"t":"s","q":"互联网使用的基本协议族是什么?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>TCP/IP协议族是互联网使用的基本协议族包含TCP和IP等众多协议<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>TCP/IP是互联网通信基础定义设备连接和数据传输标准<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>TCP/IP是核心协议族<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>互联通信靠TCPIP是基础<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——TCP/IP","o":["A. OSI协议","B. TCP/IP协议族","C. HTTP协议","D. FTP协议"]},{"t":"s","q":"TCP/IP模型分几层?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>TCP/IP模型分四层:网络接口层网络层传输层应用层<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>四层:应用层HTTP传输层TCP/UDP网络层IP网络接口层物理传输<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>TCP/IP=4层OSI=7层<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>TCPIP四兄弟应用传输网络接口<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——分层结构","o":["A. 3层","B. 4层","C. 5层","D. 7层"]},{"t":"s","q":"HTTP协议属于TCP/IP哪一层?","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>HTTP超文本传输协议属于应用层负责网页数据传输<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>应用层是TCP/IP最高层直接为用户程序服务如HTTPHTTPSFTPDNS<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>HTTP用于网页浏览=应用层<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>网页浏览HTTP属于最高应用层<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——应用层","o":["A. 网络接口层","B. 网络层","C. 传输层","D. 应用层"]},{"t":"s","q":"发送数据时从上层向下层加头部信息的过程称为什么?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>封装是数据从上层向下层传递时每层给数据加本层头部信息的过程<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>封装:应用层数据加TCP头加IP头加帧头发送<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>封=包起装=装入信息层层加头<br><br><strong style=\" 2b;\">🎯 答案解析：<\/strong>正确。网络协议就是通信规则和标准规定数据格式传输顺序错误处理<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>协议如交通规则所有车辆遵守统一规则才能有序通行<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>协议=规则=标准<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>协议就是交通规网络通信靠它行<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——协议定义","o":["正确","错误"]},{"t":"j","q":"FTP协议属于网络层协议。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。FTP文件传输协议属于应用层用于文件传输网络层核心是IP<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>应用层:HTTPHTTPSFTPSMTPDNS等网络层:IP<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>FTP=文件传=应用层<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>FTP传文件应用层一员<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——FTP","o":["正确","错误"]},{"t":"m","q":"TCP/IP模型四层包括哪些?","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确四层从高到低:应用层传输层网络层网络接口层<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>各层职责:应用层供程序用传输层可靠控制网络层寻址接口层物理传输<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>应传网接四层塔<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>应传网接四层垒各司其职保通信<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——四层结构","o":["A. 应用层","B. 传输层","C. 网络层","D. 网络接口层"]},{"t":"m","q":"网络协议分层的好处?","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>ABC正确分层降低复杂度支持独立发展便于标准化。D错误不会变慢<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>分层设计是计算机科学重要设计思想用于网络OS软件架构等<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>分层=简化灵活标准<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>分层三好处简化灵活标准化<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——分层优势","o":["A. 降低设计复杂度","B. 各层可独立发展升级","C. 便于标准化互操作","D. 让通信变慢"]},{"t":"m","q":"以下哪些协议属于应用层?","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>ABC正确HTTP网页HTTPS安全网页FTP文件传输都是应用层。IP是网络层<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>应用层协议是用户直接感受到的浏览器用HTTP邮件用SMTP<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>IP是底层协议用户不直接使用<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>HTTP看网页FTP传文件在应用层<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——应用层协议","o":["A. HTTP","B. HTTPS","C. FTP","D. IP"]},{"t":"q","q":"简述TCP/IP四层结构名称和功能。","a":"自下而上:(1)网络接口层:物理介质传输二进制数据流。(2)网络层:数据包寻址路由核心IP。(3)传输层:端到端传输控制核心TCPUDP。(4)应用层:为程序提供网络服务如HTTPFTPSMTP。下层为上层服务上层使用下层功能。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>四层分工:物理传输路由寻址可靠控制应用服务层层递进<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>所有互联网通信都遵循此层次模型网络通信骨架<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从下往上:物理寻址控制应用每层配核心协议<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>物网传应四层塔层层服务向上递<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——四层模型"},{"t":"q","q":"解释封装和解封装分别发生在什么阶段。","a":"封装:数据发送时从应用层向下传递到网络接口层每层加头部信息如:应用数据加TCP头加IP头加帧头发送。解封装:数据接收时从网络接口层向上传递到应用层每层除去解析头部最终还原原始数据。封装在发送阶段解封装在接收阶段两者互为逆过程。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>封装=打包发送解封装=拆包接收一体两面<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>如寄快递:封装=装信封解封装=拆信封<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>分别解释再说明阶段<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>封装发送加包头解封接收去包头<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——封装解封装"},{"t":"q","q":"为什么说网络协议分层体现分而治之思想?","a":"三层说明:(1)分解复杂:通信极复杂分层将大问题分解为小问题分别解决。(2)职责清晰:每层有明确功能边界网络接口只管物理传输网络层只管路由。(3)降低耦合:层间通过标准接口通信内部修改不影响他层如升级无线不影响上层应用。这正是计算思维中问题分解思想的体现。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>分而治之是计算思维核心分层是其经典应用<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>此题考察网络知识和计算思维两项核心素养<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>问题分解职责划分降低耦合三维度+计算思维<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>大化小繁化简分层分治巧解决<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第5课——分层计算思维"}],"L06":[{"t":"s","q":"IP地址的主要作用是什么?","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>IP地址作用身份标识和位置定位让网络数据准确找到设备<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/stron r:#e67e22;\">🧠 记忆口诀：<\/strong>雪人四台在中国网络主权有保障<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——雪人计划与安全","o":["正确","错误"]},{"t":"m","q":"关于域名的正确说法?","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>ABC正确。域名是字符标记从右缩小由DNS解析为IP。D错误通信必须用IP<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>域名给人记IP给机器用通过DNS映射<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>域名不能直接通信需先解析<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>域名人看好记忆通信还靠IP<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——域名基础","o":["A. 是网络设备字符形式标识","B. 从右向左缩小描述范围","C. 解析由DNS系统完成","D. 可直接替代IP通信"]},{"t":"m","q":"关于域名解析安全的正确有?","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>ABC正确。域名解析安全事关重大。D错误域名解析是基础服务关系国家安全<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>域名解析安全是国家网安重要组成雪人计划推动根服自主可控<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>域名解析安全=国家安全<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>域名安全关国运根服可控最要紧<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——域名安全","o":["A. DNS欺骗会替换IP地址","B. 根服务器故障可造成大面积故障","C. IPv6支持更安全解析","D. 与网络安全无关"]},{"t":"m","q":"域名解析过程体现的特点?","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>ABC正确。自治分层协同是域名解析三大特点。D错误是分布式<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>自治=各自管理分层=层级查询协同=多层配合<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>域名解析是分布式的<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>自治分层又协同域名解析稳又牢<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——解析特点","o":["A. 自治解析信息分散","B. 分层服务器层级明确","C. 协同不同层级配合","D. 集中一台服务器完成"]},{"t":"q","q":"说明域名解析的基本过程。","a":"六步过程:(1)用户输入域名计算机向本地DNS查。(2)本地DNS查缓存有记直接回IP。(3)无则向根服务器查得顶级域名服务器地址。(4)向顶级服务器查得权威DNS地址。(5)向权威查得对应IP。(6)本地DNS将IP返回用户计算机可访目标。体现分布自治分层协作。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>域名解析是层层查询:本地根顶级权威分布式查找<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>DNS缓存加速避免每次层层查<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按查询顺序:发起本地查根引顶级指权威答<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>本地查不到逐层问得到IP才访问<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——解析过程"},{"t":"q","q":"什么是DNS欺骗?如何防范?","a":"DNS欺骗是利用域名解析的攻击替换IP地址使用户在不知情下访问假网站假冒站与真实极其相似。防范:(1)使用HTTPS验证证书。(2)推广IPv6更安全解析。(3)用可信赖DNS。(4)注意观察网址警惕异常跳转。(5)不在可疑网站输敏感信息。技术手段与用户警惕并重。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>DNS欺骗冒名顶替式攻击关键是用户无法分辨真假地址<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>DNS欺骗是常见网络安全威胁理解原理增强安全意识<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>攻击原理+防护措施两大部分<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>DNS欺骗换地址HTTPS加v6防<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——DNS欺骗防范"},{"t":"q","q":"为什么说域名解析自主可控对国家网络安全重要?","a":"五原因:(1)根服是关键基础设施被攻击可造成大面积断网。(2)IPv4教训:13台根服中10台在美国中国无一台存隐患。(3)雪人计划意义:中国牵头部署25台IPv6根服4台在中国提升话语权。(4)国家主权:解析服务关系网络安全必须自主可控。(5)防范外部威胁:自主体系可有效防攻击和DNS欺骗。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>域名解析安全是新课标重要考点涉及国家网络主权<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>自主可控是国家网络安全战略重要组成培养国家安全意识<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>根服重要性IPv4教训雪人计划网络主权<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>域名关安全根服要自主<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第7课——自主可控"}],"L08":[{"t":"s","q":"路由器是根据什么来决定将数据包发往哪个方向的？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>路由器通过查询路由表来决定数据包转发到哪个下一跳。路由表记录着目的地和下一跳的对应关系。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>路由表包含目标网络地址、下一跳地址、度量值等信息。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>路由表=网络地图，路由器据此指路。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>路由表像地图，指路全靠它<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由表概念","o":["A. 随机选择","B. 路由表","C. 用户手动指定","D. 数据包大小"]},{"t":"s","q":"Dijkstra算法主要用于解决什么问题？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>Dijkstra算法是一种经典的最短路径算法，由荷兰计算机科学家于1956年提出，采用贪心策略。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>广泛用于路由协议、导航系统等场景。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>Dijkstra=最短路径算法。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>迪杰斯特拉最短路径，路由导航都靠它<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——Dijkstra算法","o":["A. 数据加密","B. 最短路径问题","C. 文件压缩","D. 网页渲染"]},{"t":"s","q":"OSPF路由协议使用的是哪种算法？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>OSPF使用Dijkstra算法（链路状态）计算最短路径。RIP使用Bellman-Ford算法（距离向量）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>OSPF收敛快适合大网，RIP收敛慢适合小网。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>OSPF=Dijkstra，RIP=Bellman-Ford。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>OSPF用D算法，RIP用B算法<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由协议与算法","o":["A. Bellman-Ford算法","B. Dijkstra算法","C. 冒泡排序算法","D. 二分查找算法"]},{"t":"s","q":"路由表中下一跳指的是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>下一跳(Next Hop)是数据包到达当前路由器后应转发给的下一个相邻路由器，像接力赛交棒。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>数据包通过一站一站接力到达目的地。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>下一跳=接力对象。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>像接力赛交棒，下一跳是邻居<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由表字段","o":["A. 数据包的最终目的地","B. 数据包前进道路上的下一个路由器","C. 数据包的发送源头","D. 数据包的大小限制"]},{"t":"s","q":"RIP协议采用的路由算法是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>RIP使用距离向量算法，通过邻居间交换路由信息逐步学习最佳路径。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>RIP以跳数作为度量值，最大15跳，简单但收敛慢。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>RIP=邻居交换=距离向量。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>RIP靠邻居传消息，距离向量慢更新<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——RIP协议","o":["A. 链路状态算法","B. 距离向量算法(Bellman-Ford)","C. 最短路径优先算法","D. 随机选择算法"]},{"t":"s","q":"链路状态算法和距离向量算法的主要区别是什么？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>链路状态算法需全网拓扑（完整地图），距离向量只需和邻居交换（问邻居）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>链路状态收敛快但开销大，距离向量收敛慢但简单。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>全知全局vs只问邻居。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>链路状态知全局，距离向量问邻居<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由算法对比","o":["A. 链路状态需要全网拓扑，距离向量只需邻居信息","B. 距离向量更快","C. 链路状态算法只适用于有线网络","D. 两者没有区别"]},{"t":"s","q":"路由表中的度量值(Metric)的作用是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>度量值是衡量路径好坏的数值，越小越好，帮助路由器选择最优路径。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>可基于跳数、带宽、时延等因素。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>度量值=评分，越小越好。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>度量值越小越好，选路就看谁的少<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——度量值","o":["A. 记录数据包的大小","B. 衡量路径好坏的数值","C. 记录传输时间","D. 存储加密密钥"]},{"t":"s","q":"Dijkstra算法的核心思想是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>Dijkstra采用贪心策略，每次选当前最短路径节点，逐步扩展到全局最优。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>贪心=每步做当前最好选择，在非负权图中保证全局最优。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>贪心=步步最短。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>Dijkstra贪心算法，步步最短得最优<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——Dijkstra算法思想","o":["A. 随机尝试所有路径","B. 贪心策略，每次选择当前最短路径的节点","C. 只走直线路径","D. 先传输所有数据再选择路径"]},{"t":"s","q":"以下哪种场景不适合使用Dijkstra算法？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>Dijkstra不支持负权重边，此时需用Bellman-Ford算法。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>实际网络路由中权重通常为正，所以Dijkstra广泛应用。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>正权重=D算法，负权重=B算法。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>正权重用D，负权重找B<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——Dijkstra局限","o":["A. 所有边权重为正数的网络","B. 存在负权重边的网络","C. GPS导航计算最短路线","D. 网络路由计算最短跳数"]},{"t":"s","q":"OSPF相比RIP的主要优势是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>OSPF收敛快适合大网，RIP有15跳限制适合小网。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>收敛速度指网络变化后全网路由更新一致的速度。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>OSPF=快+大，RIP=慢+小。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>OSPF快大网，RIP慢小网<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——OSPF与RIP对比","o":["A. 配置更简单","B. 收敛速度更快，适合大型网络","C. 不需要路由器","D. 只能用于家庭网络"]},{"t":"j","q":"路由器通过相互交换信息来构建和维护路由表。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。路由器之间通过路由协议交换网络信息，动态构建和维护路由表。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>动态路由协议使路由器自动发现网络变化并更新路由表。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>路由器之间互相交流网络信息。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>路由器互交流，路由表共维护<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由表维护","o":["正确","错误"]},{"t":"j","q":"数据包在网络中传输时，总是沿着最短路径到达目的地。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。路由器尽量选最佳路径但不一定最短。网络拥堵等原因可能导致走更长路线。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>路由选择是动态的，综合考虑多个因素。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>总是过于绝对。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>路由选路多因素，不总最短但最优<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由选择实际","o":["正确","错误"]},{"t":"j","q":"Dijkstra算法要求图中所有边的权重为非负数。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。Dijkstra算法的重要前提是所有边权重为非负数。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>负权重边时需用Bellman-Ford算法。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>Dijkstra=非负权重。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>D算法怕负权，非负才能算对<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——Dijkstra条件","o":["正确","错误"]},{"t":"j","q":"跳数是指数据包从源到目的地经过的路由器数量。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。跳数(Hop Count)指经过的路由器数量。RIP以跳数作为度量值。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>RIP最大15跳，超过认为不可达。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>跳数=路由个数。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>跳数就是路由数，RIP用它量远近<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——跳数概念","o":["正确","错误"]},{"t":"m","q":"路由表中通常包含哪些信息？","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>路由表包含目标地址、下一跳、度量值，不包含用户密码。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>核心三要素：去哪、下站给谁、路好不好。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>路由表=网络地图，只需路径信息。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>目标下跳度量值，路由表三要素<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由表结构","o":["A. 目标网络地址","B. 下一跳地址","C. 度量值(Metric)","D. 用户账号密码"]},{"t":"m","q":"关于路由协议的正确说法有？","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确。OSPF收敛快适合大网，RIP收敛慢适合小网。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>两种基本路由协议体现了不同的设计思想。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>OSPF=快+大，RIP=慢+小。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>OSPF大又快，RIP小又慢<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由协议总结","o":["A. OSPF使用链路状态算法","B. RIP使用距离向量算法","C. OSPF收敛比RIP快","D. OSPF适合大型网络"]},{"t":"m","q":"关于数据包路由的正确描述有？","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>数据包逐跳转发、灵活路由。D错误，包不走固定路径。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>无连接路由增强网络鲁棒性和灵活性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>互联网路由是动态灵活的。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>逐跳接力走，路由灵活变<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由过程","o":["A. 数据包通过路由器一站一站接力到达目的地","B. 路由器根据路由表选择最优路径","C. 不同数据包可能走不同路径到达同一目的地","D. 所有数据包必须经过同一条固定路径"]},{"t":"q","q":"请解释路由表的作用，并说明路由表通常包含哪些关键信息。","a":"路由表的作用：路由表是路由器内部的网络地图，当数据包到达时查询路由表决定转发到哪个下一跳路由器。\n关键信息：(1)目标网络地址(Destination)：数据包要去的位置。(2)下一跳地址(Next Hop)：接下来发给哪个相邻路由器。(3)度量值(Metric)：衡量路径好坏的数值，越小越好。(4)出接口(Interface)：从哪个端口发出。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>路由表是路由器核心，理解其结构是掌握路由知识的基础。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>路由表可类比为公交车站牌。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>先总述作用，再分述各字段。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>目标下一跳度量口，路由表四要素<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由表"},{"t":"q","q":"请对比链路状态算法和距离向量算法，说明各自特点和适用场景。","a":"链路状态算法（代表OSPF，使用Dijkstra）：\n特点：(1)需全网拓扑信息；(2)收敛速度快；(3)计算复杂度高。\n适用：大型企业网络、骨干网络。\n距离向量算法（代表RIP，使用Bellman-Ford）：\n特点：(1)只需与邻居交换信息；(2)收敛速度慢；(3)实现简单。\n适用：小型网络、简单拓扑。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>两种算法体现全局vs局部信息的不同取舍。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>体现计算思维中算法设计权衡。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从信息获取、收敛速度、资源、规模四维对比。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>链路全知快又大，距离邻居慢又小<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——两种算法对比"},{"t":"q","q":"简述数据包在网络中从源到目的地的路由过程。","a":"数据包路由过程（逐跳转发）：\n(1)从源主机出发，到达第一个路由器（默认网关）。\n(2)路由器检查目的IP，查路由表找到最匹配条目。\n(3)转发到下一跳路由器。\n(4)下一跳重复2-3步骤。\n(5)最后一个路由器直接交付给目的主机。\n整个过程像快递经多个中转站到收件人，每个路由器独立决策。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>逐跳转发是IP路由基本方式，每个路由器独立决策。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>这种方式使互联网有鲁棒性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>用快递中转站类比。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>一站一判断，逐跳向前传<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第8课 路由路径靠算法——路由过程"}],"L09":[{"t":"s","q":"光纤通信的传输介质是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>光纤通信使用光导纤维作为传输介质，利用光的全反射原理传输数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>光纤具有高速率、低损耗、抗干扰等优点，我国千兆光网全球领先。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>光纤=光导纤维，用光传数据。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>光纤传光不传电，高速低损抗干扰<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第9课 数据传输有新意——光纤通信","o":["A. 铜线","B. 光导纤维","C. 无线电波","D. 红外线"]},{"t":"s","q":"WiFi属于哪种网络连接方式？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>WiFi属于无线连接方式，通过无线电波传输数据，无需网线。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>WiFi是最常见的无线网络技术，使用2.4GHz或5GHz频段。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>WiFi=Wireless Fidelity=无线保真。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>WiFi无线连，电波传数据<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第9课 数据传输有新意——WiFi技术","o":["A. 有线连接","B. 无线连接","C. 光纤连接","D. 电力线连接"]},{"t":"s","q":"有线连接相比无线连接的主要优势是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>有线连接更稳定，抗干扰强，不易受墙壁或设备影响。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>有线稳定但布线繁琐，无线灵活但稳定性弱。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>有线=稳定，无线=灵活。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>有线稳如树，无线活如风<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第9课 数据传输有新意——有线无线对比","o":["A. 更方便移动","B. 连接更稳定，抗干扰能力更强","C. 不需要任何硬件","D. 传输距离无限远"]},{"t":"s","q":"蓝牙技术主要用于什么场景？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>蓝牙是短距离无线通信技术，用于手机与耳机、音箱、手表等近距离数据传输。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>蓝牙覆盖约10米，功耗小，适合电池供电小型设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>蓝牙=近距离配对。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>蓝牙十米内，设备配成对<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第9课 数据传输有新意——蓝牙技术","o":["A. 远距离宽带通信","B. 短距离设备间通信","C. 卫星通信","D. 海底光缆通信"]},{"t":"s","q":"以下哪种网络连接方式的传输速度最快？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>光纤宽带最快，可达千兆(Gbps)级别。拨号仅56Kbps最慢。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>排序：光纤>ADSL>WiFi>蓝牙>拨号。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>光速最快。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>光纤最快千兆级，拨号最慢五十六<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第9课 数据传输有新意——传输速度对比","o":["A. 光纤宽带","B. ADSL宽带","C. 56K拨号上网","D. 蓝牙4.0"]},{"t":"s","q":"物联网(IoT)连接的主要目标是什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>物联网目标是万物互联——让智能设备通过网络相互连接和通信。<br><br><strong style=\"col :#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——局域网","o":["A. 全球互联网","B. 简易小型局域网","C. 卫星通信网络","D. 移动通信网络"]},{"t":"j","q":"组建网络时，只需要把设备连接起来，不需要进行任何设置。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。除物理连接还需设置IP、子网掩码、网关等网络参数和安全设置。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物理连接只是第一步。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>连接不够还需配置。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>连起来不够，还要设置好<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——网络配置","o":["正确","错误"]},{"t":"j","q":"静态IP地址适合用于服务器等需要被其他设备稳定访问的设备。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。服务器需稳定地址，IP变化给访问带来困难。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>网站、文件、打印服务器通常设静态IP。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>需被访问=地址不能变。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>服务器靠静态IP，地址不变好找人<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——静态IP应用","o":["正确","错误"]},{"t":"j","q":"在进行校园活动直播时，可以随意拍摄和传播任何人的画面。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。直播须遵守《未成年人保护法》等法规，尊重肖像权和隐私权。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>直播需法律约束，不得随意拍摄传播。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>随意任何人=不合法。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>直播有法纪，拍摄需谨慎<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——法律规定","o":["正确","错误"]},{"t":"j","q":"ping命令可以用来检测目标设备是否已正确接入网络。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。ping发ICMP测试包，有回复说明网络连通。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>最基础网络诊断工具。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>ping通=在线。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>ping通即在线，不通找原因<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——ping检测","o":["正确","错误"]},{"t":"m","q":"搭建校园直播网络可能需要的硬件设备有？","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确。摄录传接四样齐，直播网络能搭起。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>各司其职协同完成直播。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>直播=拍+传+分+看。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>摄录传接四样齐，直播网络能搭起<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——硬件","o":["A. 摄像头（拍摄）","B. 计算机（直播服务器）","C. 路由器（连接设备）","D. 网线或WiFi（传输媒介）"]},{"t":"m","q":"设置网络参数时需要考虑的因素包括？","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确。IP分配策略、安全配置、地址规划都需考虑。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>合理规划避免IP冲突，提高安全性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>网络设置=规划+分配+安全。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>静态动态安全规划，网络设置四要素<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——网络参数","o":["A. 哪些设备使用静态IP","B. 哪些设备使用动态IP","C. 网络安全设置","D. IP地址的合理规划"]},{"t":"m","q":"小型网络搭建的基本步骤包括？","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>全部正确。遵循分析→连接→配置→测试工程流程。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>培养系统化工程思维。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四步走：分析连配置测。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>先计划再连接，设参数后测试<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——搭建流程","o":["A. 需求分析，确定需要哪些硬件","B. 连接设备（有线或无线）","C. 设置网络参数（IP地址等）","D. 测试验证网络是否正常工作"]},{"t":"q","q":"请简述搭建一个校园直播网络需要哪些硬件设备及各自的作用。","a":"校园直播网络硬件及作用：\n(1)摄像头——拍摄活动实时画面，是直播内容来源。\n(2)计算机（直播服务器）——接收画面，编码处理，分发视频流。\n(3)路由器（推荐无线路由器）——组建局域网，方便移动设备接入。\n(4)网线——有线连接重要设备保证稳定性。\n(5)可选：交换机——有线设备多时使用。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>每个设备有特定角色，理解分工有助于合理搭建。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>体现硬件+配置综合应用。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按采集→处理→分发→接入链列设备。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>摄录分接入，四设备搭直播<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——直播硬件"},{"t":"q","q":"请说明搭建小型网络的基本流程及安全注意事项。","a":"搭建流程：\n(1)需求分析：明确网络用途，确定设备类型数量。\n(2)硬件准备：选择摄像头、计算机、路由器、网线等。\n(3)物理连接：有线连路由器，无线连WiFi。\n(4)参数配置：服务器设静态IP，客户端动态IP，配置SSID密码。\n(5)测试验证：ping测试连通性。\n安全事项：\n1)设置强密码。2)开启WPA2/WPA3加密。3)关闭不必要服务。4)遵守法律不侵犯隐私。5)定期检查日志。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>网络搭建+安全=完整实践能力。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>新课标强调数字化学习与创新素养。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>流程五步，安全五条。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>分析准备连接配测，安全事项五牢记<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——流程安全"},{"t":"q","q":"如果直播网络中其他房间师生无法观看直播，应如何排查？","a":"排查步骤：\n(1)检查物理连接：网线是否插好，路由器指示灯正常。\n(2)检查IP：ipconfig查看服务器IP，是否同网段。\n(3)测试连通：ping服务器IP看是否通。\n(4)检查防火墙：是否阻止直播端口。\n(5)检查路由器：端口隔离设置。\n(6)检查直播软件：服务运行状态和端口配置。\n(7)检查客户端：输入地址是否正确。\n(8)扩大范围可考虑按学校网络管理部门规则接入校园网。\n系统化逐层排查，从物理到应用层，通常能定位问题。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>网络故障排查是重要实践能力。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>体现计算思维中问题分解能力。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按OSI模型低到高逐层排查。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>由低到高逐层查，从线到软逐个排<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第10课 综合所学建网络——故障排查"}],"L11":[{"t":"s","q":"FTP服务主要用于实现什么功能？","a":2,"an":"FTP（File Transfer Protocol，文件传送协议）主要用于通过网络传输各种文件，因此FTP服务也被称为文件传送服务。","o":["A. 浏览网页","B. 收发电子邮件","C. 网络文件传送","D. 即时通信"]},{"t":"s","q":"电子邮件地址的正确格式是？","a":1,"an":"电子邮件地址的标准格式为\"用户名@服务商域名\"，其中@符号是电子邮件地址的标识符。","o":["A. 用户名#服务商域名","B. 用户名@服务商域名","C. 用户名&服务商域名","D. 用户名$服务商域名"]},{"t":"s","q":"在电子邮件系统中，SMTP协议的主要作用是？","a":1,"an":"SMTP（Simple Mail Transfer Protocol，简单邮件传送协议）用于发送邮件；而POPv3（Post Office Protocol第3版）用于接收邮件。","o":["A. 接收邮件","B. 发送邮件","C. 浏览网页","D. 文件传输"]},{"t":"s","q":"POPv3协议在电子邮件系统中的功能是？","a":1,"an":"POPv3指第3版POP（Post Office Protocol，邮局协议），它的作用是接收邮件。SMTP用于发送邮件，POPv3用于接收邮件。","o":["A. 发送邮件","B. 接收邮件","C. 加密邮件","D. 删除邮件"]},{"t":"s","q":"以下关于万维网和互联网关系的说法，正确的是？","a":1,"an":"万维网（WWW）常常与互联网混为一谈，但事实上万维网只是互联网提供的一种服务，并不是互联网的全部。","o":["A. 万维网就是互联网","B. 万维网只是互联网的一种服务","C. 互联网是万维网的一种服务","D. 两者完全独立"]},{"t":"s","q":"中国第一台万维网服务器于1994年由哪个机构建成？","a":2,"an":"1994年，中国科学院高能物理研究所建成了我国第一台万维网服务器，极大推动了我国信息化的发展。","o":["A. 清华大学","B. 北京大学","C. 中国科学院高能物理研究所","D. 中国科学技术大学"]},{"t":"s","q":"使用万维网服务最基本的工具是什么？","a":1,"an":"使用万维网只需要浏览器就可以了，不需要安装其他软件，非常方便。这也是万维网能够广泛应用的重要原因之一。","o":["A. 文件传输软件","B. 浏览器","C. 电子邮件客户端","D. 即时通信软件"]},{"t":"s","q":"FTP协议使用的默认端口号是？","a":2,"an":"FTP协议默认使用21号端口进行文件传输。端口80通常用于HTTP，端口25用于SMTP，端口443用于HTTPS。","o":["A. 80","B. 25","C. 21","D. 443"]},{"t":"s","q":"以下哪项不属于典型的互联网服务？","a":3,"an":"典型的互联网服务包括文件传送（FTP）、电子邮件、万维网（WWW）等，而本地计算是在本机上进行的操作，不属于互联网服务。","o":["A. 文件传送","B. 电子邮件","C. 万维网","D. 本地计算"]},{"t":"s","q":"通过网页的形式访问电子信箱、收发电子邮件，说明了什么？","a":2,"an":"现在几乎所有的网络活动都可以基于万维网进行，如通过网页访问电子信箱、登录即时通信服务器等，这说明万维网已成为应用最广泛的互联网服务。","o":["A. 电子邮件必须用客户端软件","B. 万维网只能浏览网页","C. 万维网已成为应用最广泛的互联网服务","D. FTP服务已经过时"]},{"t":"j","q":"FTP是用于文件传送的互联网协议。","a":0,"an":"FTP（File Transfer Protocol）即文件传送协议，是专门用于通过网络传输文件的互联网服务协议。","o":["正确","错误"]},{"t":"j","q":"SMTP协议用于接收电子邮件。","a":1,"an":"这个说法是错误的。SMTP（Simple Mail Transfer Protocol）用于发送邮件，而POPv3才用于接收邮件。","o":["正确","错误"]},{"t":"j","q":"万维网与互联网是同一个概念。","a":1,"an":"错误。万维网（WWW）只是互联网提供的一种服务，互联网还包括文件传送、电子邮件等多种服务。两者不能等同。","o":["正确","错误"]},{"t":"j","q":"使用万维网只需要浏览器，不需要安装其他软件。","a":0,"an":"正确。使用万维网只需浏览器即可，这是万维网的一大优势，也是它能广泛应用的重要原因。","o":["正确","错误"]},{"t":"m","q":"典型的电子邮件系统主要涉及哪些协议？（多选）","a":[0,2],"an":"典型的电子邮件系统主要涉及两种协议：SMTP（Simple Mail Transfer Protocol）用于发送邮件，POPv3（Post Office Protocol第3版）用于接收邮件。","o":["A. SMTP","B. FTP","C. POPv3","D. HTTP"]},{"t":"m","q":"以下哪些属于常见的互联网服务？（多选）","a":[0,1,2,3],"an":"常见的互联网服务包括文件传送服务（FTP）、电子邮件服务、万维网服务（WWW）以及即时通信服务等，这些都是互联网上广泛使用的服务类型。","o":["A. 文件传送服务","B. 电子邮件服务","C. 万维网服务","D. 即时通信服务"]},{"t":"m","q":"关于收发电子邮件的方式，以下说法正确的有？（多选）","a":[0,1,2],"an":"收发电子邮件有多种方式：使用客户端软件、通过浏览器登录网站、使用命令方式（如telnet连接SMTP服务器）等，体现了互联网服务发展创新的过程。","o":["A. 可以使用客户端软件收发邮件","B. 可以通过浏览器登录网站收发邮件","C. 可以通过命令方式收发邮件","D. 只能通过一种方式收发邮件"]},{"t":"q","q":"请简述FTP服务的作用。","a":"FTP（文件传送协议）服务用于通过网络传输各种文件，允许用户在不同计算机之间上传和下载文件。","an":"FTP（File Transfer Protocol）是互联网上最早使用的协议之一，专门用于文件的上传和下载，极大方便了网络中的文件共享与传输。"},{"t":"q","q":"请说明SMTP和POPv3两种协议的区别。","a":"SMTP（简单邮件传送协议）用于发送邮件，POPv3（邮局协议第3版）用于接收邮件。两者分工不同，共同完成电子邮件的收发功能。","an":"SMTP负责将邮件从发件人传送到邮件服务器或服务器之间传递，POPv3负责将邮件从服务器下载到收件人的计算机上，两种协议配合使用完成完整的邮件收发流程。"},{"t":"q","q":"为什么说万维网和互联网不能混为一谈？","a":"互联网是底层的全球性网络基础设施，万维网只是基于互联网的一种服务。互联网还提供文件传送、电子邮件、即时通信等多种服务，万维网只是其中应用最广泛的一种。","an":"互联网是连接全球计算机的网络基础设施，万维网是通过互联网提供信息浏览服务的一种应用。互联网还承载着FTP、电子邮件、即时通信等众多服务，所以万维网只是互联网的一部分，不能等同于互联网。"}],"L12":[{"t":"s","q":"万维网中的资源是通过什么结构组织在一起的？","a":2,"an":"万维网中的资源通过网状结构组织在一起，用户可以通过超链接在各个网页和资源之间自由跳转，体现了万维网在数据组织方面的创新思维。","o":["A. 树状结构","B. 线性结构","C. 网状结构","D. 层次结构"]},{"t":"s","q":"万维网服务属于什么类型的服务架构？","a":1,"an":"万维网是一种分布式服务，没有统一的中央服务器，而是由分布在世界各地的许多万维网服务器共同提供服务。","o":["A. 集中式服务","B. 分布式服务","C. 单机服务","D. 串行服务"]},{"t":"s","q":"万维网的工作模式属于什么类型？","a":0,"an":"万维网服务属于主从式服务。\"主\"代表服务器（提供服务的计算机），\"从\"代表客户端（普通计算机或智能手机等设备），资源保存在服务器中。","o":["A. 主从式服务","B. 对等式服务","C. 广播式服务","D. 多播式服务"]},{"t":"s","q":"在万维网中，客户端只需要安装什么即可访问服务？","a":1,"an":"对万维网来说，客户端只要安装浏览器就可以了，这种结构称为\"浏览器-服务器\"（B-S）结构，是\"客户端-服务器\"（C-S）结构的特例。","o":["A. FTP客户端","B. 浏览器","C. 数据库软件","D. 操作系统"]},{"t":"s","q":"万维网是一种典型的什么模式的网络服务？","a":1,"an":"万维网是一种典型的\"请求-响应\"式网络服务。用户通过浏览器发起请求，服务器收到请求后进行处理并返回响应。","o":["A. \"发布-订阅\"式","B. \"请求-响应\"式","C. \"广播-接收\"式","D. \"推送-获取\"式"]},{"t":"s","q":"统一资源定位符（URL）一般不包括以下哪个部分？","a":2,"an":"统一资源定位符（URL）一般包括协议、域名、端口、路径、参数等部分，但不包括计算机型号。计算机型号与资源定位无关。","o":["A. 协议","B. 域名","C. 计算机型号","D. 路径"]},{"t":"s","q":"浏览器向服务器发起请求后，如果资源存在，服务器通常返回什么状态码？","a":2,"an":"服务器收到请求后，如果资源存在，会返回状态码200（成功），浏览器随后展示网页；如果资源不存在则返回报错信息（如404）。","o":["A. 404","B. 500","C. 200","D. 301"]},{"t":"s","q":"超链接可以链接到什么对象？","a":2,"an":"超链接可以链接同网站不同网页、同一网页的不同资源（如图像）、外网站的网页或资源等，功能非常灵活。","o":["A. 仅同网站的不同网页","B. 仅同一网页的不同位置","C. 同网站不同网页、同一网页不同位置、外网站资源等","D. 仅文字内容"]},{"t":"s","q":"以下关于互联网和万维网关系的描述，正确的是？","a":2,"an":"互联网是万维网得以广泛应用的基础，没有互联网万维网就无用武之地；万维网是人们使用互联网的重要途径，没有万维网，互联网中的资源可能无法充分利用。","o":["A. 没有互联网，万维网也能运行","B. 互联网和万维网已经完全无法区分","C. 互联网是万维网的基础，万维网是使用互联网的重要途径","D. 万维网是互联网的唯一应用"]},{"t":"s","q":"网址\"https://www.baidu.com/s?wd=北斗导航\"中的参数部分是什么？","a":3,"an":"该网址中，https是协议，www.baidu.com是域名，/s是路径，wd=北斗导航是参数部分，表示搜索的关键词为\"北斗导航\"。","o":["A. https","B. www.baidu.com","C. /s","D. wd=北斗导航"]},{"t":"j","q":"万维网是一种分布式服务，没有统一的中央服务器。","a":0,"an":"正确。万维网没有统一的中央服务器，由分布在世界各地的许多万维网服务器共同提供服务，因此是一种分布式服务。","o":["正确","错误"]},{"t":"j","q":"浏览器-服务器（B-S）结构与客户端-服务器（C-S）结构是完全不同的两种结构。","a":1,"an":"错误。浏览器-服务器（B-S）结构是客户端-服务器（C-S）结构的特例。在万维网中，客户端只需要安装浏览器，因此B-S结构是C-S结构的一种特殊形式。","o":["正确","错误"]},{"t":"j","q":"统一资源定位符（URL）就是日常所说的网址。","a":0,"an":"正确。统一资源定位符（URL）就是人们通常所说的网址，用于在万维网中定位和访问网页、图像等资源。","o":["正确","错误"]},{"t":"j","q":"短网址服务可以把一个长网址转换成一个短网址，方便分享。","a":0,"an":"正确。一些互联网应用分享网址时会使用短网址，用一个比较短小的网址代替真实网址，使分享更加便捷。","o":["正确","错误"]},{"t":"m","q":"万维网浏览网页的一般工作流程包括哪些步骤？（多选）","a":[0,1,2,3],"an":"万维网浏览网页的工作流程包括四个步骤：用户发起请求（输入网址）、服务器响应（返回资源或报错）、浏览器接收响应（展示网页或显示错误）、人机交互（用户操作触发新请求）。","o":["A. 用户发起请求","B. 服务器响应","C. 浏览器接收响应","D. 人机交互"]},{"t":"m","q":"统一资源定位符（URL）通常包含哪些部分？（多选）","a":[0,1,2,3],"an":"URL一般包括协议（如http/https）、域名（如www.example.com）、端口、路径（如/index.html）和参数（如?key=value）等部分。","o":["A. 协议","B. 域名","C. 路径","D. 参数"]},{"t":"m","q":"关于超链接，以下说法正确的有？（多选）","a":[0,1,2],"an":"超链接功能灵活，可以链接同网站不同网页、同一网页不同资源（如图像）、外部网站的网页或资源等，不局限于文字内容。","o":["A. 可以链接同网站的不同网页","B. 可以链接同一网页中的不同资源","C. 可以链接外部网站的网页","D. 只能链接文字内容"]},{"t":"q","q":"请解释万维网中\"请求-响应\"模式的基本过程。","a":"用户通过浏览器输入网址发起请求，服务器收到请求后进行处理：如果资源存在则返回资源（状态码200），浏览器展示网页；如果资源不存在则返回报错信息。用户浏览网页时点击超链接，浏览器再次发起请求，以此循环。","an":"万维网的\"请求-响应\"模式是B-S架构的核心工作机制，体现了客户端主动请求、服务器被动响应的交互方式，这也是万维网能够高效运作的基础。"},{"t":"q","q":"什么是B-S结构？它与C-S结构有什么关系？","a":"B-S结构即\"浏览器-服务器\"结构，客户端只需安装浏览器即可访问服务器上的资源。B-S结构是C-S（\"客户端-服务器\"）结构的特例，区别在于客户端的软件要求：B-S只需要通用浏览器，而C-S可能需要安装专门的客户端软件。","an":"B-S结构的优势在于客户端无需安装专门软件，只要有浏览器就能访问服务，极大降低了使用门槛，这也是万维网能够广泛普及的重要原因。"},{"t":"q","q":"短网址服务有什么好处和可能引发的问题？","a":"好处：短网址简洁易记，方便在社交媒体等平台分享。可能引发的问题：短网址隐藏了真实的网址，用户无法直接判断目标网站的安全性，可能被用于网络钓鱼或传播恶意链接。","an":"短网址服务体现了互联网应用不断创新的趋势，在提供便捷性的同时，用户也需要注意安全风险，不随意点击来源不明的短网址。"}],"L13":[{"t":"s","q":"HTTP协议工作在哪个传输层协议之上？","a":1,"an":"HTTP基于TCP协议实现。因为万维网需要稳定可靠地传输数据（浏览网页、查看图像、下载文件等），而TCP提供可靠传输，因此HTTP选择建立在TCP基础之上。","o":["A. UDP","B. TCP","C. IP","D. ICMP"]},{"t":"s","q":"HTTP协议传输数据的方式是什么？","a":1,"an":"互联网发展早期制定的网络协议（包括HTTP）都以明文方式传输数据，因此用户的账号、密码等信息容易被别有用心的人窃取或篡改。","o":["A. 加密传输","B. 明文传输","C. 压缩传输","D. 分包传输"]},{"t":"s","q":"HTTPS相比于HTTP的主要优势是什么？","a":1,"an":"HTTPS规定传输过程中采用数据加密技术对内容进行加密处理，因而比HTTP的明文传输更加安全，能有效保护用户的隐私数据。","o":["A. 速度更快","B. 传输数据经过加密，更安全","C. 占用更少带宽","D. 不需要服务器"]},{"t":"s","q":"浏览器访问HTTPS网站时，地址栏通常会显示什么标志？","a":1,"an":"访问HTTPS网站时，浏览器地址栏通常会显示锁形图标，表示该网站使用了加密连接，数据传输是安全的。","o":["A. 感叹号","B. 锁形图标","C. 星号","D. 叉号"]},{"t":"s","q":"HTTP协议默认使用的端口号是？","a":2,"an":"HTTP协议默认使用80号端口。端口443是HTTPS的默认端口，端口21是FTP的默认端口，端口25是SMTP的默认端口。","o":["A. 21","B. 25","C. 80","D. 443"]},{"t":"s","q":"HTTPS协议默认使用的端口号是？","a":2,"an":"HTTPS协议默认使用443号端口。它与HTTP（端口80）使用不同的端口，通过SSL/TLS加密层保证数据传输的安全性。","o":["A. 21","B. 80","C. 443","D. 8080"]},{"t":"s","q":"通过抓包实验对比HTTP和HTTPS数据包，可以发现什么？","a":2,"an":"通过抓包对比实验可知：HTTP以明文传输，数据包中的内容可以直接读取；HTTPS对数据进行了加密处理，抓取的数据包内容不可读，因此HTTPS更安全。","o":["A. HTTP和HTTPS数据包完全相同","B. HTTP数据包已加密，HTTPS未加密","C. HTTP数据包未加密可读取内容，HTTPS数据包已加密不可读","D. 两者都是加密的"]},{"t":"s","q":"为什么浏览器访问网站时需要TCP而不是UDP的支持？","a":1,"an":"万维网需要浏览网页、查看图像、下载文件等多种操作，必须稳定可靠地传输数据，而TCP提供面向连接的可靠传输服务，UDP是不可靠传输，因此HTTP/HTTPS建立在TCP之上。","o":["A. TCP速度更快","B. TCP提供可靠传输，确保数据完整","C. TCP更节省资源","D. UDP不支持网页传输"]},{"t":"s","q":"关于HTTPS的安全性，以下说法正确的是？","a":2,"an":"HTTPS只是给万维网传输过程加密，而传输过程不加密只是导致安全问题的一个因素。使用HTTPS也可能遇到其他安全问题，如钓鱼网站等，因此不能认为HTTPS能解决所有安全问题。","o":["A. 使用HTTPS就不会遇到任何安全问题","B. HTTPS只能防止数据被篡改","C. HTTPS通过加密传输保护数据安全，但仍需注意其他安全因素","D. HTTPS比HTTP更不安全"]},{"t":"s","q":"HTTPS中的\"S\"代表什么？","a":1,"an":"HTTPS中的\"S\"代表Secure（安全），全称为Hypertext Transfer Protocol Secure，即安全的超文本传输协议。它通过SSL/TLS协议对数据进行加密传输。","o":["A. Speed（速度）","B. Safe或Secure（安全）","C. Simple（简单）","D. Server（服务器）"]},{"t":"j","q":"HTTP基于TCP协议实现，因为万维网需要稳定可靠的传输。","a":0,"an":"正确。HTTP需要稳定可靠的传输以保证网页、图像、文件等数据完整，因此它建立在面向连接、可靠传输的TCP协议之上。","o":["正确","错误"]},{"t":"j","q":"HTTP传输的数据是经过加密处理的。","a":1,"an":"错误。HTTP以明文方式传输数据，数据未经加密。用户在浏览器与服务器交互过程中发送的账号、密码等信息很容易被窃取。","o":["正确","错误"]},{"t":"j","q":"使用HTTPS可以完全避免所有网络安全问题。","a":1,"an":"错误。HTTPS只加密万维网的传输过程，但导致安全问题的因素很多，传输过程不加密只是其中之一。使用HTTPS也可能遇到钓鱼网站等其他安全问题。","o":["正确","错误"]},{"t":"j","q":"通过抓包软件可以观察到HTTPS数据包的内容是加密后不可读的。","a":0,"an":"正确。使用抓包软件对比HTTP和HTTPS数据包可以发现，HTTP数据包内容可直接读取，而HTTPS数据包内容已被加密，无法直接读取。","o":["正确","错误"]},{"t":"m","q":"关于HTTP和HTTPS的对比，以下说法正确的有？（多选）","a":[0,1,2],"an":"HTTP以明文传输（端口80），HTTPS经过加密传输（端口443），因此HTTPS更安全。两者在安全性方面有显著差异，并非完全相同。","o":["A. HTTP是明文传输，HTTPS是加密传输","B. HTTP默认端口80，HTTPS默认端口443","C. HTTPS比HTTP更安全","D. HTTP和HTTPS完全相同"]},{"t":"m","q":"HTTP明文传输可能带来哪些安全风险？（多选）","a":[0,1,2],"an":"HTTP明文传输意味着数据在传输过程中未经加密，可能被第三方截获并读取，导致账号密码泄露、数据被窃取或篡改等安全风险。传输速度与加密与否没有必然关系。","o":["A. 用户账号被窃取","B. 密码被窃取","C. 数据被篡改","D. 传输速度变慢"]},{"t":"m","q":"当前各大网站纷纷用HTTPS取代HTTP的原因包括？（多选）","a":[0,1,2],"an":"各大网站采用HTTPS主要是因为其能通过加密保证数据传输的安全性、保护用户隐私信息（如账号密码）以及防止数据在传输过程中被篡改。HTTPS由于增加了加密解密过程，速度通常不会比HTTP快很多。","o":["A. 保证数据传输的安全性","B. 保护用户隐私","C. 防止数据被篡改","D. HTTPS传输速度比HTTP快很多"]},{"t":"q","q":"请简述HTTP明文传输的安全隐患。","a":"HTTP以明文方式传输数据，在浏览器与服务器交互过程中，用户的账号、密码等敏感信息未经过加密处理，容易被别有用心的人通过抓包等方式窃取或篡改，存在严重的安全隐患。","an":"明文传输是HTTP协议设计之初的特点，在当时网络安全威胁较少的环境下问题不大。但随着互联网的普及，信息安全问题日益突出，HTTP的明文传输方式已经无法满足安全需求，因此需要HTTPS来提供加密保护。"},{"t":"q","q":"为什么不能认为\"使用HTTPS就不会遇到安全问题\"？","a":"HTTPS只是对万维网传输过程进行了加密，而传输过程不加密只是导致安全问题的一个因素。其他安全因素还包括：钓鱼网站、恶意软件、服务器端漏洞、用户自身的安全意识不足等。因此使用HTTPS也可能遇到安全问题。","an":"网络安全是综合性的问题，不能只依赖单一技术。HTTPS解决了传输过程中的加密问题，但用户仍需注意识别网站真伪、保护个人信息、提高安全意识等多方面的问题。"},{"t":"q","q":"请说明HTTP和HTTPS的主要区别。","a":"HTTP和HTTPS的主要区别有：1）HTTP以明文传输数据，HTTPS对数据加密后传输；2）HTTP默认使用80端口，HTTPS默认使用443端口；3）HTTPS比HTTP更安全，能有效防止数据被窃取或篡改；4）HTTPS需要SSL/TLS证书支持。","an":"HTTP是万维网的基础协议，但安全性不足。HTTPS在HTTP的基础上增加了SSL/TLS加密层，使得数据传输过程更加安全可靠，已成为现代网站的标准配置。"}],"L14":[{"t":"s","q":"搜索引擎能够快速返回搜索结果，体现了什么思想？","a":1,"an":"搜索引擎提前把海量信息保存下来，耗费大量存储空间，以此来换取对查询需求的快速响应。这种工作方式体现了\"以空间换时间\"的思想。","o":["A. \"以时间换空间\"","B. \"以空间换时间\"","C. \"以质量换速度\"","D. \"以速度换质量\""]},{"t":"s","q":"搜索引擎工作流程中，获取网页数据后首先要做什么？","a":1,"an":"搜索引擎工作流程为：获取网页数据 → 建立索引 → 形成网页索引 → 用户搜索时根据索引匹配 → 进行网页排序并返回结果。建立索引是连接数据存储与搜索查询的关键环节。","o":["A. 网页排序","B. 建立索引","C. 返回用户","D. 删除数据"]},{"t":"s","q":"网络爬虫在搜索引擎中的作用是什么？","a":1,"an":"网络爬虫可以自动获取相关的网页以备查询，它替代了人工操作的烦琐过程，极大提升了搜索引擎的工作效率。","o":["A. 显示搜索结果","B. 自动获取网页数据","C. 加密数据传输","D. 建立网络连接"]},{"t":"s","q":"在搜索引擎的简易搜索系统中，搜索结果是依据什么进行排序的？","a":1,"an":"在简易搜索系统中，搜索结果是依据关键词在网页中出现的次数进行排序的，次数越多排名越靠前。当然实际搜索引擎的排序算法要复杂得多。","o":["A. 网页大小","B. 关键词出现次数（次数越多越靠前）","C. 网页创建时间","D. 随机排序"]},{"t":"s","q":"搜索引擎工作流程的完整顺序是？","a":1,"an":"搜索引擎的工作流程为：获取信息（爬取网页）→ 形成网页数据 → 建立索引 → 生成网页索引 → 用户搜索时进行查询匹配 → 网页排序 → 返回搜索结果。","o":["A. 网页排序→建立索引→获取信息→网页索引","B. 获取信息→网页数据→建立索引→网页索引→网页排序","C. 网页索引→网页排序→获取信息→建立索引","D. 建立索引→获取信息→网页排序→网页数据"]},{"t":"s","q":"分词技术在搜索引擎中的作用是什么？","a":1,"an":"分词技术将用户输入的搜索短语切分为更小的词语单元，以便搜索引擎更精准地匹配网页内容，提高搜索结果的准确性和相关性。","o":["A. 加密搜索内容","B. 将搜索短语切分为更小的词语单元以提高匹配精度","C. 加快网页加载速度","D. 美化搜索页面"]},{"t":"s","q":"pages.csv文件在简易搜索系统中的作用是？","a":1,"an":"pages.csv文件用于记录网页文件的文件名和对应的网址，相当于搜索系统的数据目录，搜索引擎通过它来定位和管理已收集的网页数据。","o":["A. 存储网页样式","B. 记录网页文件的文件名和对应的网址","C. 保存用户密码","D. 存储搜索结果"]},{"t":"s","q":"以下哪种方式能更高效地扩充搜索引擎中的网页数据？","a":1,"an":"通过人工操作来扩充搜索系统中的网页数据比较烦琐，使用网络爬虫可以自动获取相关网页，极大提升工作效率。这体现了自动化技术给搜索带来的改进。","o":["A. 人工手动保存网页","B. 使用网络爬虫自动获取","C. 等待用户提交","D. 从其他搜索引擎复制"]},{"t":"s","q":"搜索引擎在用户输入关键词后能快速返回结果，根本原因是？","a":1,"an":"搜索引擎能快速返回结果，是因为它提前把海量信息保存下来并建立了索引。当用户搜索时，只需在已建好的索引中查找匹配内容，而不需要实时遍历全网。","o":["A. 搜索引擎实时遍历全部网页","B. 搜索引擎提前建立了网页索引","C. 互联网速度非常快","D. 用户输入的关键词很短"]},{"t":"s","q":"除了关键词出现次数，以下哪项也可用于改进搜索排序精准度？","a":1,"an":"除了关键词出现次数外，网页被其他网站链接的数量（即链接流行度）是重要的排序参考指标。被越多网站链接的网页通常内容质量越高，应排在更靠前的位置。","o":["A. 网页背景颜色","B. 网页被其他网站链接的数量","C. 网页文件大小","D. 网页创建者姓名"]},{"t":"j","q":"搜索引擎是通过实时遍历互联网上所有网页来查找结果的。","a":1,"an":"错误。搜索引擎不是实时遍历全网，而是提前爬取网页数据并建立索引。用户搜索时直接在已建立的索引中查找，因此能快速返回结果。","o":["正确","错误"]},{"t":"j","q":"搜索引擎的工作方式体现了\"以空间换时间\"的思想。","a":0,"an":"正确。搜索引擎提前存储海量网页数据并建立索引，虽然耗费了大量存储空间，但换来了对用户查询的快速响应，这正是\"以空间换时间\"思想的体现。","o":["正确","错误"]},{"t":"j","q":"网络爬虫是一种可以自动获取网页数据的程序。","a":0,"an":"正确。网络爬虫是一种自动化程序，可以按照一定规则自动访问网站并获取网页数据，大大提高了搜索引擎收集网页信息的效率。","o":["正确","错误"]},{"t":"j","q":"搜索引擎的排序结果只取决于关键词出现次数，没有其他因素。","a":1,"an":"错误。简易搜索系统中以关键词出现次数为主要排序依据，但实际搜索引擎的排序算法非常复杂，还考虑网页质量、链接关系、用户行为等多种因素来提高排序精准度。","o":["正确","错误"]},{"t":"m","q":"搜索引擎的工作流程包括以下哪些环节？（多选）","a":[0,1,2],"an":"搜索引擎的主要工作流程包括：获取网页数据、建立索引、查询匹配和网页排序。加密传输不是搜索引擎的环节，而是安全通信协议的范畴。","o":["A. 获取网页数据","B. 建立索引","C. 网页排序","D. 加密传输"]},{"t":"m","q":"以下哪些技术可以改进搜索引擎的效果？（多选）","a":[0,1,2],"an":"网络爬虫可以自动化获取网页数据，分词技术提高搜索匹配精度，多指标综合排序使搜索结果更精准。加密存储与改进搜索效果没有直接关系。","o":["A. 网络爬虫自动获取网页","B. 分词技术提高匹配精度","C. 多指标综合排序","D. 加密存储所有数据"]},{"t":"m","q":"关于搜索引擎，以下说法正确的有？（多选）","a":[0,1,2],"an":"搜索引擎需要定期更新索引以反映网页变化，网络爬虫可自动发现和获取新网页，好的排序算法使搜索结果更有价值。但搜索引擎保存的信息不仅是文字，还包括链接关系等多种数据。","o":["A. 搜索引擎需要定期更新网页索引","B. 网络爬虫可以自动发现新网页","C. 好的排序算法让搜索结果更有用","D. 搜索引擎中只保存网页的文字内容"]},{"t":"q","q":"请简述搜索引擎\"以空间换时间\"的工作思想。","a":"搜索引擎提前使用网络爬虫获取互联网上的海量网页数据，并建立索引存储在本地（耗费大量存储空间）。当用户进行搜索时，直接在已建立的索引中查找匹配内容，而不需要实时遍历全网，因此能快速返回搜索结果（节省时间）。","an":"\"以空间换时间\"是计算机科学中常见的设计思想。搜索引擎通过预先存储和索引数据，将搜索响应时间从可能需要遍历全网缩短到毫秒级，代价是占用大量存储空间来保存索引数据。"},{"t":"q","q":"请说明网络爬虫对搜索引擎的改进作用。","a":"网络爬虫能够自动访问网站并获取网页数据，替代了人工手动保存网页的烦琐操作。它使搜索引擎的数据收集从\"人工操作\"变为\"自动获取\"，极大提升了搜索系统中网页数据的更新效率和覆盖范围，让搜索引擎能及时获取最新的网页信息。","an":"网络爬虫的应用体现了自动化技术对搜索引擎的重要改进。它不仅提高了效率，还使搜索引擎能够持续不断地更新索引数据，保持搜索结果的时效性和全面性。"},{"t":"q","q":"除了关键词出现次数，还有哪些因素可以让搜索结果排序更精准？","a":"可以改进排序精准度的因素包括：网页被其他网站链接的数量和质量（链接流行度）、网页的更新频率和时效性、用户点击行为数据、网页内容质量评估、关键词在标题等重要位置的出现情况等。","an":"实际搜索引擎使用众多因素综合计算网页的排名，如Google的PageRank算法就主要基于网页之间的链接关系评估网页重要性。这种多维度综合排序比单纯按关键词次数排序更加精准。"}],"L15":[{"t":"s","q":"用于测试网络连通性的命令是？","a":1,"an":"ping命令可用于连通性测试，如果能ping通目标，就可以认为能与目标进行基本的网络通信。此外，ping命令也可以用来获取域名对应的IP地址。","o":["A. ipconfig","B. ping","C. tracert","D. netstat"]},{"t":"s","q":"用于查看本机IP地址等TCP/IP信息的命令是？","a":2,"an":"ipconfig命令用于显示TCP/IP相关的信息，包括IPv4地址、IPv6地址、网关、域名服务器等。它是网络诊断中最常用的命令之一。","o":["A. ping","B. tracert","C. ipconfig","D. netstat"]},{"t":"s","q":"用于跟踪数据到达目标所经路径的命令是？","a":3,"an":"tracert（trace route，跟踪路由）命令用于跟踪通信路径，可显示数据到达访问目标时所经过的路由器。","o":["A. ping","B. ipconfig","C. netstat","D. tracert"]},{"t":"s","q":"用于查看计算机当前网络连接情况的命令是？","a":1,"an":"netstat命令用于显示所用计算机的网络连接情况，包括当前活动的TCP连接、监听端口等信息。","o":["A. ipconfig","B. netstat","C. ping","D. tracert"]},{"t":"s","q":"如果想查看本机的网关和域名服务器地址，应使用哪个命令？","a":3,"an":"ipconfig命令可显示TCP/IP相关信息，包括IPv4地址、IPv6地址、网关、域名服务器（DNS服务器）等，是查看本机网络配置的首选命令。","o":["A. ping","B. tracert","C. netstat","D. ipconfig"]},{"t":"s","q":"如果想知道访问某个网站时数据经过了哪些路由器，应使用？","a":2,"an":"tracert命令可以跟踪并显示数据包从本机到达目标主机所经过的每一跳路由器的信息，是了解网络路由路径的重要工具。","o":["A. ping","B. ipconfig","C. tracert","D. netstat"]},{"t":"s","q":"数据包在不同网络层流动时，每一层接到上层数据后都会做什么？","a":2,"an":"服务器发送数据时，数据从上到下在不同层流动。每一层接到上层传来的数据后，都会加上含有本层控制信息的头部，形成TCP包、IP包等，然后交给下一层处理。","o":["A. 直接发送","B. 删除数据","C. 添加含有本层控制信息的头部","D. 加密数据"]},{"t":"s","q":"TCP包主要由哪两部分组成？","a":0,"an":"TCP包主要由头部和数据体两部分组成。头部包含控制信息（如源端口和目的端口），数据体包含实际传输的内容。同样，IP包也是由头部和数据体两部分组成的。","o":["A. 头部和数据体","B. 源地址和目的地址","C. 域名和IP","D. 请求和响应"]},{"t":"s","q":"浏览网页时，IP数据包是基于什么进行通信的？","a":1,"an":"底层的IP数据包是基于IP地址进行通信的。域名需要通过域名解析服务（DNS）转换为IP地址后，才能在网络层进行传输。","o":["A. 域名","B. IP地址","C. URL地址","D. 邮件地址"]},{"t":"s","q":"TCP包头部包含哪些关键信息？","a":0,"an":"TCP包头部含有源端口和目的端口等关键信息。而源IP地址和目的IP地址则是IP包头部包含的关键信息。","o":["A. 源端口和目的端口","B. 源IP和目的IP","C. 域名和路径","D. 用户和密码"]},{"t":"j","q":"ping命令只能测试连通性，无法获取域名对应的IP地址。","a":1,"an":"错误。ping命令除了测试连通性外，还可以获取域名对应的IP地址。当ping一个域名时，系统会先进行DNS解析，显示出域名对应的IP地址。","o":["正确","错误"]},{"t":"j","q":"数据在不同网络层流动时，每一层都会在数据上添加自己的头部信息。","a":0,"an":"正确。数据从上到下流经不同网络层时，每一层接到上层传来的数据后，都会添加含有本层控制信息的头部，形成本层的数据包再传给下一层。这体现了分层设计的思想。","o":["正确","错误"]},{"t":"j","q":"IP包头部包含源IP地址和目的IP地址信息。","a":0,"an":"正确。IP包头部含有源IP地址和目的IP地址等关键信息，用于在网络层进行数据包的路由和转发。","o":["正确","错误"]},{"t":"j","q":"netstat命令用于显示计算机的TCP/IP配置信息。","a":1,"an":"错误。netstat用于显示网络连接情况，而显示TCP/IP配置信息（如IP地址、网关、DNS等）的命令是ipconfig。这两个命令功能不同。","o":["正确","错误"]},{"t":"m","q":"以下哪些是常用的网络诊断命令？（多选）","a":[0,1,2,3],"an":"ping（测试连通性）、ipconfig（查看IP配置）、tracert（跟踪路由）和netstat（查看网络连接）都是常用的网络诊断命令，各有不同的功能和用途。","o":["A. ping","B. ipconfig","C. tracert","D. netstat"]},{"t":"m","q":"关于数据包在网络层中的封装，以下说法正确的有？（多选）","a":[0,1,2,3],"an":"数据封装是逐层进行的：应用层HTTP数据 → 传输层添加TCP头部形成TCP包 →
