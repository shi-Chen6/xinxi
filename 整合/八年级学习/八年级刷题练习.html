: 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材指出可用pandas模块处理数据，提升处理效率。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>pandas适合表格数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>pandas能处理。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "tf", "stem": "物联网服务平台的数据只能手动查看，不能下载或编程获取。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。服务平台数据可通过数据文件直接下载，也可通过API调用编程获取数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>两种获取数据方式并存。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能手动”与两种下载方式矛盾，故错。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>文件API两取。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "tf", "stem": "分组分析法是指将数据按某个条件分成若干组再统计对比，如按设备ID分组。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。分组分析法先按条件分组再统计对比，如先按设备ID分组再分析各组数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分组便于横向比较。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材定义一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>分组再比对。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "multi", "stem": "物联系统处理数据的方式主要包括哪些？（多选）", "options": ["使用常见的数据处理工具", "借助pandas、numpy等编程工具", "通过API编程获取数据", "只能靠人工手抄记录"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>处理方式包括使用常见数据处理工具、借助编程工具（pandas/numpy）、通过API编程获取数据；人工手抄不是规范方式，故第四项错误。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>工具+编程双路径。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“人工手抄”错项。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>工具加编程。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "multi", "stem": "数据分析的三种常用方法包括？（多选）", "options": ["统计分析法", "对比分析法", "分组分析法", "随机猜测法"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三种方法为统计分析法、对比分析法、分组分析法；随机猜测不是科学方法。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三类方法各有适用场景。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“随机猜测”。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>统对分三法。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "multi", "stem": "关于pandas数据处理，下列说法正确的有哪些？（多选）", "options": ["pandas提供对表格数据的快速处理方法", "可将数据整理为DataFrame类型", "可用groupby( )分组后配合mean( )求平均", "pandas不能处理从API获取的数据"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>前三项正确：pandas快速处理表格、可转为DataFrame、groupby+mean聚合；pandas正是用于处理API数据的工具，故第四项错误。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>理解pandas核心能力。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“不能处理API数据”错项。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>pandas全能。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "short", "stem": "物联系统中处理数据有哪些方式？", "options": [""], "answer": "处理方式主要有两类：①使用常见的数据处理工具（如电子表格软件等对数据文件进行处理）；②借助编程工具处理数据——在Python中可用pandas、numpy等模块对数据进行快速处理，也可通过API调用获取数据后再用程序分析。两种数据下载方式配合：数据文件直接下载、通过API编程获取。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>工具+编程两类，配合两种下载方式。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>处理与获取结合。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>从“工具、编程、下载方式”展开。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>工具加编程。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "short", "stem": "数据分析常用哪三种方法？请各举一例。", "options": [""], "answer": "三种常用方法：①统计分析法——通过求最大值、最小值、平均值分析，如案例中求温度、湿度的最值与均值；②对比分析法——对比不同数据异同，如对比不同区域的二氧化碳浓度；③分组分析法——按条件分组后再统计对比，如先按设备ID分组，再求各组平均值。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>统、对、分三法各配教材例。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三类方法互补。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>逐法定义+举例。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>统对分三法。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 18, "lessonTitle": "数据分析与处理", "type": "short", "stem": "如何通过API从物联网服务平台获取数据？简述主要步骤。", "options": [""], "answer": "步骤：①参阅相关说明文档（不同在线MQTT服务器API用法有差异）；②确定API的URL；③传入相关参数（如user、psd、topic等）后发起网络请求；④接收返回的JSON数据，用json.load( )转换为字典或使用pandas整理为DataFrame，再进行后续分析处理。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>文档→URL→参数请求→解析四步。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API调用标准流程。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按教材四步顺序作答。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>API四步取。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第18课 数据分析与处理"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "对温度数据进行可视化后，直观发现13:00左右的数据有异常，这体现了数据可视化的什么作用？", "options": ["发现数据异常", "了解整体概况", "发现趋势变化", "生成标签云"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>通过数据可视化可以更容易识别并定位数据中存在的异常，如温度数据在13:00异常。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>异常检测是可视化价值之一。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“发现异常”直接对应作用。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>可视找异常。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "智慧社区数据监测大屏让工作人员及时了解社区概况，体现了数据可视化的什么作用？", "options": ["发现数据异常", "了解整体概况", "发现趋势变化", "数据筛选"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>数据可视化可以让人们方便、直观地了解物联网系统的整体概况，如智慧社区监测大屏。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>概览是可视化的基础价值。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“了解概况”对应此作用。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>可视看全局。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "通过历史起降时间数据预测航班大概率晚点，体现了数据可视化的什么作用？", "options": ["发现数据异常", "了解整体概况", "发现趋势变化", "数据加密"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>数据可视化可展示历史数据情况，帮助理解变化并助力预测未来趋势，如预测航班晚点。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>趋势预测是高级价值。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“预测趋势”对应发现趋势变化。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>可视看趋势。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "描绘数据随时间的变化趋势，常见的可视化方式属于？", "options": ["趋势可视化（折线图、柱形图、像素图）", "比例可视化（饼图、环形图）", "分布可视化（散点图+地图）", "标签云"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>趋势可视化用于描绘数据随时间的变化趋势，常见有折线图、柱形图、像素图等。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>趋势类用折线/柱形。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“随时间变化”对应趋势可视化。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>折线看趋势。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "显示不同部分所占整体的比例关系，常见的可视化方式属于？", "options": ["趋势可视化", "比例可视化（饼图、环形图）", "分布可视化", "标签云"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>比例可视化用于显示不同部分所占整体的比例关系，常见有饼图、环形图。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>占比用饼/环形。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“比例关系”对应比例可视化。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>饼图看占比。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "将散点图与地图结合，表示数据在地理位置上的分布情况，这属于？", "options": ["趋势可视化", "比例可视化", "分布可视化", "标签云"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>分布可视化可将散点图与地图结合，表示数据在地理位置上的分布，如查询附近空闲单车。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>地理分布用散点+地图。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“地理位置分布”对应分布可视化。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>地图看分布。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "标签云主要用于直观展示什么？", "options": ["数值随时间变化", "各部分占比", "文本中的高频词（词频越高字体越大）", "地理位置分布"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>标签云可直观展示一段文本数据中的高频词，词频越高字体越大。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>标签云是文本可视化。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“高频词、字体大小”对应标签云。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>标签看词频。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "在Python中，用于绘制折线图的函数是？", "options": ["plt.plot( )", "plt.scatter( )", "plt.bar( )", "plt.title( )"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>plt.plot( )用来绘制折线图；plt.scatter( )画散点图，plt.bar( )画柱形图。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>不同图表对应不同函数。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“折线图”对应plt.plot。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>plot画折线。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "在Python绘图时，用于设置图表标题的函数是？", "options": ["plt.figsize( )", "plt.title( )", "plt.plot( )", "plt.show( )"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>plt.title( )用于设置图表标题；plt.figsize( )指定画布大小。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>标题与画布分开设置。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“标题”对应plt.title。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>title设标题。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "single", "stem": "在Python中，用于指定画布（图表）大小的函数是？", "options": ["plt.figsize( )", "plt.title( )", "plt.scatter( )", "plt.bar( )"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>利用plt.figsize( )可以指定画布大小，从而控制图表尺寸。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>画布决定整体布局。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“画布大小”对应plt.figsize。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>figsize定大小。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "tf", "stem": "数据可视化可以帮助识别并定位数据中存在的异常。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。如对温度数据可视化后可直观发现13:00左右的异常。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>异常检测是作用之一。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>可视找异常。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "tf", "stem": "饼图、环形图常用于显示不同部分占整体的比例关系，属于比例可视化。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。比例可视化常见有饼图、环形图，用于显示占比。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>占比类图表。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>饼环看占比。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "tf", "stem": "散点图与地图结合只能表示单一数据，无法表示地理位置分布。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。散点图与地图结合正是用于分布可视化，可表示数据在地理位置上的分布（如附近空闲单车）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分布可视化依赖地图叠加。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能单一”与分布可视化矛盾，故错。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>地图看分布。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "tf", "stem": "在Python中，plt.bar( )用于绘制柱形图。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。plt.bar( )用于绘制柱形图；plt.plot( )画折线，plt.scatter( )画散点。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>绘图函数各有分工。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>bar画柱形。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "multi", "stem": "数据可视化的作用主要包括哪些？（多选）", "options": ["发现数据异常", "了解整体概况", "发现趋势变化", "增加数据冗余"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三大作用：发现数据异常、了解整体概况、发现趋势变化；可视化旨在精简呈现而非增加冗余。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>作用对应三类价值。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“增加冗余”错项。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>异常概况趋势。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "multi", "stem": "常见的数据可视化方式包括以下哪些？（多选）", "options": ["趋势可视化（折线图、柱形图）", "比例可视化（饼图、环形图）", "分布可视化（散点图+地图）", "标签云"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四类方式教材均介绍：趋势、比例、分布可视化与标签云，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>四类覆盖主要场景。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>无干扰项，全选。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>趋比分标四式。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "multi", "stem": "关于Python绘图，下列说法正确的有哪些？（多选）", "options": ["plt.plot( )绘制折线图", "plt.scatter( )绘制散点图", "plt.bar( )绘制柱形图", "plt.title( )设置图表标题"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四个说法均正确：plot折线、scatter散点、bar柱形、title标题。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>绘图函数分工明确。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为教材原话，全选。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>plo散bar题。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "short", "stem": "数据可视化有哪些作用？请各举一例。", "options": [""], "answer": "数据可视化主要有三大作用：①发现数据异常——如对温度数据可视化后直观发现13:00左右数据异常；②了解整体概况——如智慧社区数据监测大屏让工作人员及时了解社区概况；③发现趋势变化——如通过历史起降时间数据预测航班大概率晚点，助力预测未来趋势。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>异常、概况、趋势三作用各配例。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>作用体现可视化价值。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>逐作用定义+举例。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>异常概况趋势。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "short", "stem": "常见的数据可视化方式有哪些？分别适合什么场景？", "options": [""], "answer": "常见方式：①趋势可视化（折线图、柱形图、像素图）——适合描绘数据随时间的变化趋势；②比例可视化（饼图、环形图）——适合显示不同部分占整体的比例关系；③分布可视化（散点图与地图结合）——适合表示数据在地理位置上的分布（如附近空闲单车）；④标签云——适合展示文本中的高频词，词频越高字体越大。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四类方式+适用场景一一对应。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>选对方式是关键。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“方式—场景”结构作答。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>趋比分标四式。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 19, "lessonTitle": "数据呈现可视化", "type": "short", "stem": "利用Python绘制温度变化趋势图，需要哪些步骤和绘图函数？", "options": [""], "answer": "步骤：①数据准备——准备横坐标（时间，存入变量X）和纵坐标（温度，存入变量Y）；②设置画布和标题——用plt.figsize( )指定画布大小，用plt.title( )设置标题；③绘制图表并显示——用plt.plot( )绘制折线图（温度趋势），如需散点用plt.scatter( )、柱形用plt.bar( )，最后显示图表。绘制前应先明确可视化的目的。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>准备XY、设画布标题、plot绘制三步。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>绘图流程标准化。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按准备—设置—绘制顺序作答。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>XY标题plot。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第19课 数据呈现可视化"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆自动灌溉算法设计中，需要依据数据分析确定哪两个关键参数？", "options": ["土壤湿度的上限值和下限值", "光照强度的最大最小值", "温度的上下限", "设备编号范围"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>需根据土壤在干燥、适中、湿润时的传感器数据，确定合适的土壤湿度上限值和下限值。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>上下限是灌溉决策边界。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“灌溉”依赖土壤湿度阈值。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>湿度定上下。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆中，当土壤湿度大于上限值时，系统的决策是？", "options": ["不灌溉", "灌溉", "提高下限值", "报警"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>土壤湿度大于上限值→不灌溉（土壤已足够湿润）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>过湿无需浇水。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“大于上限、已湿”→不灌溉。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>超上不浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆中，当土壤湿度小于下限值时，系统的决策是？", "options": ["不灌溉", "灌溉", "提高下限值", "等待"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>土壤湿度小于下限值→灌溉（土壤过干需补水）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>过干需浇水。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“小于下限、已干”→灌溉。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>低于下限浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "土壤湿度介于上下限之间且天气预报下雨，系统决策是？", "options": ["灌溉", "不灌溉", "提高下限值", "开启水泵5秒"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>土壤湿度介于上下限之间且天气预报下雨→不灌溉（雨水会补给，避免过湿）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>结合天气优化决策。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“将下雨”→不必人工灌溉。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>将雨不浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "土壤湿度介于上下限之间且天气预报不下雨，系统决策是？", "options": ["不灌溉", "灌溉", "提高下限值", "关闭系统"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>土壤湿度介于上下限之间且天气预报不下雨→灌溉（补充即将缺失的水分）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>不下雨需主动补水。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“不下雨”→灌溉。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>无雨则浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆中，实时显示土壤湿度值所使用的执行器是？", "options": ["显示屏", "直流电机水泵", "舵机", "蜂鸣器"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>反馈与控制中，实时显示土壤湿度情况由显示屏完成。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>显示属反馈输出。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“显示湿度”对应显示屏。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>屏显湿度。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆中实现自动灌溉所使用的执行器是？", "options": ["直流电机水泵", "显示屏", "摄像头", "按键传感器"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>实现自动灌溉由直流电机水泵完成，条件满足时电机启动灌溉约5秒。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>水泵是灌溉执行器。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“灌溉”对应水泵。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>水泵来灌溉。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆系统投入使用前，下列调试工作中不属于教材要求的是？", "options": ["硬件检查", "网络测试", "动态测试", "直接发布到应用商店"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>调试包括硬件检查、网络测试、动态测试；直接发布到应用商店不是本系统调试内容。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三类测试保障正常运行。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“发布商店”不相关。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>硬网动三测。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "物联花盆主程序通常写在什么结构中，并用time.sleep( )控制等待时间？", "options": ["while True循环", "if单分支", "for固定次数", "def函数定义"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>主程序代码写在while True中，并在最后通过time.sleep( )函数控制等待时间，实现持续循环运行与节奏控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>循环保证系统长期运行。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“持续运行+等待”对应while True。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>永久循环跑。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "single", "stem": "为感知是否有人在附近活动以了解主人对植物的关心程度，可扩展使用哪种传感器？", "options": ["红外热释电传感器", "光敏传感器", "温湿度传感器", "RFID读卡器"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>可扩展红外热释电传感器感知是否有人活动，并将数据上传分析，了解主人关心程度。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>功能扩展提升智能。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“感知人体活动”对应红外热释电。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>红外感有人。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "tf", "stem": "物联花盆自动灌溉需要根据数据分析设计算法，确定土壤湿度的上限值和下限值。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。需基于温度、土壤湿度、光照、天气预报数据设计算法，并确定土壤湿度上下限值。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>阈值驱动决策。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>湿度定上下。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "tf", "stem": "土壤湿度大于上限值时，系统应当立刻灌溉。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。土壤湿度大于上限值时应“不灌溉”，过湿无需补水。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>过湿反致伤害。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“大于上限→灌溉”违背决策表，故错。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>超上不浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "tf", "stem": "物联花盆的反馈与控制中，显示屏用于显示土壤湿度，直流电机水泵用于自动灌溉。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。控制与执行即显示土壤湿度（显示屏）和实现自动灌溉（直流电机水泵）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>两执行器各司其职。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>屏显泵灌。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "tf", "stem": "系统调试只需测试功能即可，无需检查硬件连接和网络。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。调试包括硬件检查（连接正确）、网络测试（畅通稳定）、动态测试（模拟功能验证触发响应）三方面。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>全面调试保可靠。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“无需检查”违背调试要求，故错。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>硬网动三测。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "multi", "stem": "关于物联花盆自动灌溉的触发条件与决策，下列说法正确的有哪些？（多选）", "options": ["土壤湿度大于上限值→不灌溉", "土壤湿度小于下限值→灌溉", "介于上下限且天气预报下雨→不灌溉", "介于上下限且天气预报不下雨→灌溉"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四项均符合教材优化后的决策表，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>决策综合湿度与天气。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为正确决策，全选。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>超上不浇、低于下浇、雨不浇、晴浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "multi", "stem": "物联花盆系统的执行器包括以下哪些？（多选）", "options": ["显示屏", "直流电机水泵", "LED灯", "温湿度传感器"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>执行模块执行器包括显示屏（显示湿度）、直流电机水泵（灌溉）、LED灯（执行模块示例）；温湿度传感器是感知设备，不是执行器。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>执行器产生动作。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除传感器。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>屏泵灯执行。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "multi", "stem": "物联花盆系统投入使用前的调试工作包括？（多选）", "options": ["硬件检查（连接正确）", "网络测试（畅通稳定）", "动态测试（模拟功能、测试触发响应）", "无需调试直接上线运行"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>调试三方面：硬件检查、网络测试、动态测试；直接上线不调试是错误做法。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>调试保障可靠。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“无需调试”。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>硬网动三测。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "short", "stem": "物联花盆系统自动灌溉的算法中，如何根据土壤湿度与天气预报确定灌溉决策？", "options": [""], "answer": "决策规则：①土壤湿度大于上限值→不灌溉；②土壤湿度小于下限值→灌溉；③介于上下限之间：若天气预报下雨→不灌溉，若天气预报不下雨→灌溉，若光照强度大→提高下限值，若光照强度小→恢复下限值。综合土壤湿度与天气/光照数据形成不同数据决策，实现自动灌溉。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>依据湿度上下限+天气/光照给出决策。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>阈值与条件组合成算法。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按决策表分条陈述。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>超上不浇、低于下浇、雨不浇晴浇。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "short", "stem": "物联花盆系统的反馈与控制分别由哪些执行器实现？", "options": [""], "answer": "反馈与控制具体为：①显示土壤湿度情况——由显示屏（执行器）实现；②实现自动灌溉——由直流电机水泵（执行器）实现，当条件满足时电机启动灌溉约5秒。两者都属于执行模块，根据主控板发出的指令对现实世界采取行动。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>屏显湿度、水泵灌溉两执行器。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>执行模块落地反馈控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>分别说明显示与灌溉的执行器。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>屏显泵灌。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第四单元 简易物联系统实践", "lesson": 20, "lessonTitle": "反馈控制有算法", "type": "short", "stem": "物联花盆系统投入使用前需要进行哪些调试工作？", "options": [""], "answer": "调试工作包括三方面：①硬件检查——确认各设备连接正确；②网络测试——确保网络畅通稳定；③动态测试——模拟功能过程，测试触发条件的响应等。此外主程序写在while True循环中并用time.sleep( )控制等待时间，保障系统持续稳定运行。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>硬件、网络、动态三测试。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>全面调试保障可靠。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按三测试分条作答。<br><br><strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>硬网动三测。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第四单元/第20课 反馈控制有算法"}, {"module": "第五单元 物联网应用探索", "lesson": "L21", "lessonTitle": "文物保护新手段", "type": "single", "stem": "博物馆环境监测系统体现了物联网技术在下列哪个领域的应用？", "options": ["文物保护", "健康生活", "农业生产", "学习探究"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>博物馆环境监测系统用于实时监测文物保存环境，属于物联网在文物保护中的应用。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>第五单元“物联网应用探索”以博物馆环境监测为案例，将物联网用于文物保护。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干关键词“博物馆”“文物”，直接对应文物保护，排除健康、农业、学习。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>博物馆里护文物，物联监测保环境。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第五单元/第21课 文物保护新手段"}, {"module": "第五单元 物联网应用探索", "lesson": "L21", "lessonTitle": "文物保护新手段", "type": "single", "stem": "与传统环境监测相比，物联环境监测系统的最大优势是？", "options": ["数据只能本地查看", "数据可实时更新并发送到手机和计算机，查看方便", "不需要任何传感器", "完全不需要网络"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>物联系统数据能在大屏幕实时更新，也可发到手机和计算机，查看方便。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>传统监测数据不能实时呈现、查看麻烦；物联系统解决了该问题。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>对比“传统=不能实时、麻烦”，选“实时、方便查看”项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>传统麻烦物联快，实时查看真方便。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第五单元/第21课 文物保护新手段"}, {"module": "第五单元 物联网应用探索", "lesson": "L21", "lessonTitle": "文物保护新手段", "type": "single", "stem": "下列数据中，不属于博物馆环境监测系统监测内容的是？", "options": ["温度", "湿度", "光照强度", "用户的身高"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>系统监测温度、湿度、光照强度、烟雾、二氧化碳浓度等环境数据，不测用户身高。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>监测系统关注的是文物保存环境，而非人的身体数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>身高属于健康类数据（第22课），明显不属于文物保护环境参数。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>温湿光照烟二氧，文物环境要记牢。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第五单元/第21课 文物保护新手段"}, {"module": "第五单元 物联网应用探索", "lesson": "L21", "lessonTitle": "文物保护新手段", "type": "single", "stem": "博物馆环境监测系统采集温湿度时使用的是什么传感器？", "options": ["超声波传感器", "温度传感器、湿度传感器", "光敏传感器", "压力传感器"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>采集温湿度使用温度传感器和湿度传感器。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>温度、湿度传感器分别测量环境温度与湿度，是环境感知的基础设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“温湿度”对应“温度、湿度传感器”，超声波用于测距、光敏测光、压力测压力。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>温湿对应温湿传，感知环境第一关。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第五单元/第21课 文物保护新手段"}, {"module": "第五单元 物联网应用探索", "lesson": "L21", "lessonTitle": "文物保护新手段", "type": "single", "stem": "主控板读取传感器数据后，通过什么协议/服务将数据发送到物联网服务平台？", "options": ["蓝牙音箱", "MQTT 服务器", "打印机", "投影仪"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>主控板通过网络将传感器数据发送给 MQTT 服务器（物联网服务平台）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT 是物联网中常用的轻量级消息传输协议，负责数据的存储与转发。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>物联网服务平台常用 MQTT，其他选项均非数据传输通道。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>数据上网走 MQTT，平台存储又转发。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第五单元/第21课 文物保护新手段"}, {"module": "第五单元 物联网应用探索", "lesson": "L21", "lessonTitle": "文物保护新手段", "type": "single", "stem": "当监测到的温湿度超出阈值范围时，系统会如何响应？", "options": ["仅显示数据不做处理", "自动执行打开或关闭空调、打开或关闭恒湿器的操作", "自动切断全部电源", "向警察报警"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>超出阈值时系统执行反馈与控制：打开或关闭空调、恒湿器来调节环境。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈与控制环节根据分析结果自动触发保护措施，是物联网“感知—决策—执行”的体现。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“超阈值”应对应自动调节设备，而非仅显示或无关联动作。<br><br><strong style= function pickLesson(li){state.lesson=li;state.answers={};state.shown={};state.currentQ=0;document.querySelectorAll(".lesson-nav button").forEach(function(b,i){b.classList.toggle("active",i===li)});var mk=_mkeys[state.module],mod=_mods[mk],lk=Object.keys(mod.lessons).sort()[li];window._questions=mod.lessons[lk];renderQuestions()}
function getScore(qs){var a=0,c=0,t=qs.length;for(var i=0;i<t;i++){var u=state.answers[i];if(u===undefined)continue;a++;var q=qs[i],ok=false;if(Array.isArray(u)){var ca=Array.isArray(q.answer)?q.answer:[q.answer];ok=u.length===ca.length&&u.every(function(v){return ca.indexOf(v)>=0})}else if(typeof q.answer==="string"){ok=u.toLowerCase().indexOf(q.answer.toLowerCase())>=0}else{ok=u===q.answer}if(ok)c++}return{answered:a,correct:c,total:t}}
function renderAnswerSheet(qs){var t=qs.length,h='<div class="answer-sheet" id="answerSheet"><h4>📋 答题卡</h4><div class="answer-sheet-grid">';for(var i=0;i<t;i++){var cls="as-cell";if(i===state.currentQ)cls+=" current";var a=state.answers[i];if(a!==undefined){var q=qs[i],ok=false;if(Array.isArray(a)){var ca=Array.isArray(q.answer)?q.answer:[q.answer];ok=a.length===ca.length&&a.every(function(v){return ca.indexOf(v)>=0})}else if(typeof q.answer==="string"){ok=a.toLowerCase().indexOf(q.answer.toLowerCase())>=0}else{ok=a===q.answer}cls+=ok?" correct":" wrong"}else{cls+=" unanswered"}h+='<div class="'+cls+'" onclick="jumpTo('+i+')" title="第'+(i+1)+'题">'+(i+1)+'</div>'}h+='</div><div class="as-legend"><span><span class="dot" style="background:#e8f8f0;border:1px solid var(--green)"></span>正确</span><span><span class="dot" style="background:#fde8e8;border:1px solid var(--red)"></span>错误</span><span><span class="dot" style="background:#f5f5f5;border:1px solid #ddd"></span>未答</span></div></div>';return h}
function renderNav(qs){var qi=state.currentQ,t=qs.length;return'<div class="nav-bar"><button class="btn-nav" onclick="jumpTo('+(qi-1)+')" '+(qi<=0?"disabled":"")+'>◀ 上一题</button><span class="q-indicator">'+(qi+1)+' / '+t+'</span><button class="btn-nav" onclick="jumpTo('+(qi+1)+')" '+(qi>=t-1?"disabled":"")+'>下一题 ▶</button></div>'}
function jumpTo(qi){if(qi<0||qi>=window._questions.length)return;state.currentQ=qi;renderQuestions()}
function updateAnswerSheet(){var s=document.getElementById("answerSheet");if(s&&window._questions)s.innerHTML=renderAnswerSheet(window._questions)}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renderQuestions(){var c=document.getElementById("lessonContent");if(!window._questions){c.innerHTML='<div class="empty-state">请选择课程</div>';return}var qs=window._questions,t=qs.length,qi=state.currentQ;if(qi>=t)qi=state.currentQ=0;var sc=getScore(qs),pct=t>0?Math.round(sc.answered/t*100):0;var h=renderAnswerSheet(qs);h+='<div class="progress"><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div><span class="progress-text">'+sc.answered+'/'+t+' 完成 ('+Math.round(sc.correct/t*100)+'%正确)</span></div>';h+=renderNav(qs);var q=qs[qi];var tl={single:"单选",multi:"多选",multiple:"多选",tf:"判断",judge:"判断",short:"简答"}[q.type]||"";h+='<div class="quiz-card" id="qc_'+qi+'"><div class="q-num">第'+(qi+1)+'题 <span class="q-type '+q.type+'">'+tl+'</span></div><div class="q-stem">'+q.stem+'</div>';if(q.type==="short"){  h+='<textarea class="short-input" id="si_'+qi+'" placeholder="请输入你的答案..." onchange="onShortAnswer('+qi+')">'+((state.answers[qi]!==undefined)?esc(state.answers[qi]):"")+'</textarea>'}else if(q.type==="tf"||q.type==="judge"){  h+='<div class="option-item" id="opt_'+qi+'_0" onclick="selectOption('+qi+',0)"><span class="marker">✓</span> '+q.options[0]+'</div><div class="option-item" id="opt_'+qi+'_1" onclick="selectOption('+qi+',1)"><span class="marker">✗</span> '+q.options[1]+'</div>'}else{  q.options.forEach(function(o,oi){h+='<div class="option-item" id="opt_'+qi+'_'+oi+'" onclick="selectOption('+qi+','+oi+')"><span class="marker">'+String.fromCharCode(65+oi)+'</span> '+o.substring(2).trim()+'</div>'})}h+='<div class="btn-row"><button class="btn btn-reset" onclick="resetQuestion('+qi+')">重做</button></div><div class="analysis-box" id="ab_'+qi+'">'+q.analysis+'</div></div>';if(sc.answered===t&&t>0){  h+='<div class="score-bar"><h3>🎉 本课完成！</h3><p>正确率：'+sc.correct+'/'+t+' ('+Math.round(sc.correct/t*100)+'%)</p>';  if(sc.correct<t)h+='<div class="actions"><button class="btn btn-check" onclick="reviewWrong()">回看错题</button><button class="btn btn-next" onclick="resetAll()">全部重做</button></div>';  else h+='<div class="actions"><button class="btn btn-next" onclick="resetAll()">全部重做</button></div>';  h+='</div>'}h+=renderNav(qs);c.innerHTML=h;var a=state.answers[qi];if(a!==undefined){  if(Array.isArray(a)){a.forEach(function(v){var e=document.getElementById("opt_"+qi+"_"+v);if(e)e.classList.add("selected")})}  else if(q.type!=="short"){var e=document.getElementById("opt_"+qi+"_"+a);if(e)e.classList.add("selected")}}if(state.shown[qi]){var ab=document.getElementById("ab_"+qi);if(ab)ab.classList.add("show");markCard(qi)}}function markCard(qi){var q=window._questions[qi],a=state.answers[qi];if(a===undefined||q.type==="short")return;var ca=Array.isArray(q.answer)?q.answer:[q.answer],ua=Array.isArray(a)?a:[a];for(var i=0;i<20;i++){var e=document.getElementById("opt_"+qi+"_"+i);if(!e)continue;e.classList.remove("correct","wrong");if(ca.indexOf(i)>=0)e.classList.add("correct");if(ua.indexOf(i)>=0&&ca.indexOf(i)<0)e.classList.add("wrong")}}
function selectOption(qi,oi){var q=window._questions[qi];if(q.type==="tf"||q.type==="judge"||q.type==="single"){for(var i=0;i<10;i++){var e=document.getElementById("opt_"+qi+"_"+i);if(e)e.classList.remove("selected")}var e=document.getElementById("opt_"+qi+"_"+oi);if(e)e.classList.add("selected");state.answers[qi]=oi}else{var e=document.getElementById("opt_"+qi+"_"+oi);if(!e)return;e.classList.toggle("selected");var s=[];for(var i=0;i<20;i++){var ee=document.getElementById("opt_"+qi+"_"+i);if(ee&&ee.classList.contains("selected"))s.push(i)}state.answers[qi]=s}autoCheck(qi)}
function onShortAnswer(qi){state.answers[qi]=document.getElementById("si_"+qi).value.trim();autoCheck(qi)}
function autoCheck(qi){var q=window._questions[qi],a=state.answers[qi];if(q.type==="short"){a=document.getElementById("si_"+qi).value.trim();state.answers[qi]=a}if(a===undefined||(Array.isArray(a)&&a.length===0)||(typeof a==="string"&&a.length===0)){updateAnswerSheet();return}state.shown[qi]=true;var ab=document.getElementById("ab_"+qi);if(ab)ab.classList.add("show");markCard(qi);state.currentQ=qi;updateAnswerSheet();var _qs=window._questions;if(_qs&&getScore(_qs).answered===_qs.length)renderQuestions()}
function resetQuestion(qi){delete state.answers[qi];delete state.shown[qi];var ab=document.getElementById("ab_"+qi);if(ab)ab.classList.remove("show");var card=document.getElementById("qc_"+qi);if(card){for(var i=0;i<20;i++){var e=card.querySelector("#opt_"+qi+"_"+i);if(e)e.classList.remove("selected","correct","wrong")}var si=card.querySelector("#si_"+qi);if(si)si.value=""}updateAnswerSheet();renderQuestions()}
function resetAll(){state.answers={};state.shown={};state.currentQ=0;renderQuestions()}
function reviewWrong(){var qs=window._questions,wrong=[];qs.forEach(function(q,qi){var a=state.answers[qi];if(a===undefined){wrong.push(qi);return}var ok=false;if(Array.isArray(a)){var ca=Array.isArray(q.answer)?q.answer:[q.answer];ok=a.length===ca.length&&a.every(function(v){return ca.indexOf(v)>=0})}else if(typeof q.answer==="string"){ok=a.toLowerCase().indexOf(q.answer.toLowerCase())>=0}else{ok=a===q.answer}if(!ok)wrong.push(qi)});if(wrong.length===0){alert("恭喜！全部正确！");return}var c=document.getElementById("lessonContent"),h='<h3 style="margin-bottom:12px;color:var(--red)">🔴 错题回顾 ('+wrong.length+'/'+qs.length+'题)</h3>';wrong.forEach(function(qi){var q=qs[qi];state.shown[qi]=true;h+='<div class="wrong-review"><div class="w-item"><strong>第'+(qi+1)+'题：</strong>'+q.stem+'<div class="analysis-box show">'+q.analysis+'</div></div></div>'});h+='<div style="margin-top:12px;text-align:center"><button class="btn btn-next" onclick="pickLesson('+state.lesson+')">返回全部题目</button></div>';c.innerHTML=h}
window.addEventListener("hashchange",function(){if(_mkeys&&_mkeys.length>0)checkHash()});init();</script></body></html>
