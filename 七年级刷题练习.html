<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>七年级信息科技 · 刷题练习</title><style>
:root{--bg:#f5f0eb;--card:#fff;--text:#2c3e50;--accent:#e67e22;--accent-lt:#fdebd0;--border:#e8ded4;--green:#27ae60;--red:#c0392b;--shadow:0 2px 12px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh}
.header{background:linear-gradient(135deg,#e67e22,#d35400);color:#fff;padding:24px 20px;text-align:center}
.header h1{font-size:24px;margin-bottom:4px}.header .sub{font-size:13px;opacity:.9}
.header .links{margin-top:8px;font-size:13px}.header .links a{color:#fff;opacity:.85;margin:0 6px;text-decoration:underline}
.tab-nav{display:flex;flex-wrap:wrap;gap:4px;padding:12px 20px;background:var(--accent-lt);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;justify-content:center}
.tab-nav button{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:#fff;color:var(--text-secondary);cursor:pointer;font-size:13px;transition:all .2s}
.tab-nav button:hover{background:var(--accent-lt)}.tab-nav button.active{background:var(--accent);color:#fff}
.container{max-width:900px;margin:0 auto;padding:20px}
.lesson-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.lesson-nav button{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px}
.lesson-nav button.active{background:var(--accent);color:#fff}
.progress{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.progress-bar{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);transition:width .3s}
.progress-text{font-size:13px;white-space:nowrap;color:var(--text-secondary)}
.quiz-card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.quiz-card .q-num{font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.quiz-card .q-stem{font-size:16px;font-weight:600;margin-bottom:12px}
.quiz-card .q-type{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;background:#eee}
.quiz-card .q-type.single{background:#e8f0f8;color:#2980b9}.quiz-card .q-type.multi,.quiz-card .q-type.multiple{background:#fef9e7;color:#b9770e}
.quiz-card .q-type.tf,.quiz-card .q-type.judge{background:#e8f8f0;color:#27ae60}.quiz-card .q-type.short{background:#f5e6f8;color:#8e44ad}
.option-item{display:block;padding:10px 14px;margin:6px 0;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:15px}
.option-item:hover{border-color:var(--accent);background:var(--accent-lt)}
.option-item.selected{border-color:var(--accent);background:var(--accent-lt);font-weight:600}
.option-item.correct{border-color:var(--green);background:#e8f8f0}
.option-item.wrong{border-color:var(--red);background:#fde8e8}
.option-item .marker{display:inline-block;width:24px;text-align:center;margin-right:8px;font-weight:bold}
.short-input{width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:15px;resize:vertical;min-height:80px;margin:6px 0}
.short-input:focus{border-color:var(--accent);outline:none}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600}
.btn-check{background:var(--accent);color:#fff}.btn-reset{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn-next{background:#eee;color:var(--text)}
.analysis-box{display:none;background:#faf7f3;border-radius:8px;padding:16px;margin-top:12px;border-left:4px solid var(--accent);font-size:14px}
.analysis-box.show{display:block}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.score-bar{background:#fff;border-radius:12px;padding:20px;margin-top:20px;box-shadow:var(--shadow);text-align:center}.score-bar h3{font-size:22px;margin-bottom:8px}
.score-bar .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wrong-review .w-item{padding:12px;border-bottom:1px solid var(--border)}.wrong-review .w-item strong{color:var(--red)}
.answer-sheet{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.answer-sheet h4{font-size:14px;margin-bottom:8px;color:var(--text-secondary)}
.answer-sheet-grid{display:flex;flex-wrap:wrap;gap:6px}
.as-cell{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;background:#fff}
.as-cell:hover{transform:scale(1.1);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.as-cell.current{border:2px solid var(--accent);box-shadow:0 0 0 2px var(--accent-lt)}
.as-cell.correct{background:#e8f8f0;border-color:var(--green);color:var(--green)}
.as-cell.wrong{background:#fde8e8;border-color:var(--red);color:var(--red)}
.as-cell.unanswered{background:#f5f5f5;color:#bbb}
.as-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.as-legend span{display:flex;align-items:center;gap:4px}
.as-legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-top:8px;gap:8px}
.nav-bar .btn-nav{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px}
.nav-bar .btn-nav:hover{background:var(--accent-lt)}.nav-bar .btn-nav:disabled{opacity:.4;cursor:not-allowed}
.nav-bar .q-indicator{font-size:13px;color:var(--text-secondary)}
@media print{.tab-nav{position:static}.analysis-box{display:block!important}}

/* ===== 手机端适配（≤640px） ===== */
@media (max-width:640px){
  .header{padding:18px 14px}
  .header h1{font-size:20px}
  .header .sub{font-size:12px}
  .header .links{font-size:12px}
  .tab-nav{padding:10px 12px;gap:4px}
  .tab-nav button{padding:6px 11px;font-size:12px}
  .container{padding:12px 10px}
  .lesson-nav{margin-bottom:12px}
  .lesson-nav button{padding:5px 10px;font-size:11px}
  .progress{padding:10px 12px}
  .quiz-card{padding:16px 14px}
  .quiz-card .q-stem{font-size:15px}
  .option-item{padding:12px 14px;font-size:14px}
  .btn{padding:9px 18px;font-size:13px}
  .btn-row{gap:6px}
  .nav-bar{padding:10px 0}
  .nav-bar .btn-nav{padding:8px 12px;font-size:12px}
  .answer-sheet{padding:12px}
  .as-cell{width:30px;height:30px;font-size:11px}
  .as-legend{gap:12px;font-size:11px}
  .analysis-box{padding:14px;font-size:13px}
}
</style></head><body>

<script>var DATA=[{"module": "第一模块：互联网基础", "lesson": "L01", "lessonTitle": "第1课 互联网发展靠创新", "type": "single", "stem": "中国全功能接入国际互联网是在哪一年？", "options": ["A. 1990年", "B. 1994年", "C. 1998年", "D. 2000年"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>1994年4月20日，中国科学院计算机网络信息中心接入国际互联网，中国正式成为国际公认的全功能接入Internet的国家。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>中国全功能接入国际互联网是互联网在中国发展的起点。通过64K国际专线实现连接，标志着中国互联网时代的正式开启。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>记忆关键年份1994年——中国互联网元年。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>九四专线通全球，中国网络新篇章<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第1课 互联网发展靠创新——中国互联网发展历程"}, {"module": "第一模块：互联网基础", "lesson": "L01", "lessonTitle": "第1课 互联网发展靠创新", "type": "single", "stem": "Web1.0阶段互联网的主要特征是什么？", "options": ["A. 用户可自主发布内容", "B. 静态网页，用户只能阅读信息", "C. 人工智能个性化推荐", "D. 区块链去中心化"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>Web1.0阶段以静态网页为主要特征，网站是信息提供者，用户只能被动阅读信息。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>万维网由蒂姆·伯纳斯·李开发，浏览器让用户能阅读网页但不能编辑发布。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>区分Web1.0(只读)、Web2.0(可读写)、Web3.0(智能)。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>1.0只能看，2.0能互动，3.0更智能<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第1课 互联网发展靠创新——Web发展三阶段"}, {"module": "第一模块：互联网基础", "lesson": "L01", "lessonTitle": "第1课 互联网发展靠创新", "type": "single", "stem": "以下哪项属于Web2.0阶段的代表性应用？", "options": ["A. 静态门户网站", "B. 博客和社交网络", "C. 智能语音助手", "D. 虚拟现实元宇宙"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>Web2.0阶段以社交网络、博客、微博、BBS等为代表，用户可自主发布和分享内容。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>21世纪社交媒体问世标志Web2.0到来。典型应用包括QQ、微博、百度贴吧。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>Web2.0关键词：社交、互动、用户生成内容。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>博客微博BBS，Web2.0人人参与<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第1课 互联网发展靠创新——Web2.0阶段特征"}, {"module": "第 年", "D. 2016年"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>2015年政府工作报告中首次提出互联网+行动计划。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>互联网+是指互联网技术与传统行业深度融合，创造新业态。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>2015年是互联网+成为国家战略的年份。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>一五年互联网加，传统行业新变化<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第1课 互联网发展靠创新——互联网+战略"}, {"module": "第一模块：互联网基础", "lesson": "L01", "lessonTitle": "第1课 互联网发展靠创新", "type": "single", "stem": "Web3.0阶段的核心特征不包括以下哪项？", "options": ["A. 智能化推荐", "B. 区块链去中心化", "C. 静态网页浏览", "D. 语义网络"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>静态网页浏览是Web1.0的特征。Web3.0以智能推荐、去中心化、语义网络为核心。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>Web3.0强调机器理解数据、个性化服务、用户数据自主掌控。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>1.0只读，2.0可写，3.0智能。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>3.0智能去中心，AI区块链来赋能<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第1课 互联网发展靠创新——Web3.0"}, {"module": "第一模块：互联网基础", "lesson": "L01", "lessonTitle": "第1课 互联网发展靠创新", "type": "single", "stem": "中国网民规模首次超过美国位居世界第一是在哪一年？", "options": ["A. 2005年", "B. 2006年", "C. 2007年", "D. 2008年"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>2008年中国网民达2.53亿，首次超过美国位居世界第一。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>中国互联网用户快速增长体现了巨大市场潜力。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>北京奥运之年——2008年网民数全球第一。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>奥运之年零八年，中国网民全球先<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第1课 互联网发展靠创新——网民发展"}, {"module": "第一模块：互联网基础", "lesson": "L01", "lessonTitle": "第1课 互联网发展靠创新", "type": "single", "stem": "以下哪项是推动互联网从Web1.0到Web2.0转变的关键技术因素？", "options": ["A. 数据库技术成熟", "B. 用户交互技术和社交平台兴起", "C. 光纤通信发明", "D. 操作系统升级"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>从Web1.0到Web2.0的关键在于用户交互技术进步和社交平台兴起。<br><br><strong style=\"co , "type": "tf", "stem": "在线协作工具使多人可在不同地点同时编辑同一份文档。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。在线协作工具如腾讯文档支持多人同时在线编辑实现跨空间协作<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>利用云计算技术实现实时同步是互联网+办公的重要创新<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>在线协作=多人+同时+远程编辑<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>云端协作人人编天涯海角共文档<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——在线协作"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "tf", "stem": "互联网让娱乐方式从单向观看变成双向互动和个性化推荐。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。传统电视单向播放互联网娱乐支持弹幕互动直播互动个性化推荐<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三大转变:单向到双向互动固定到个性推荐定时到随时点播<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>双向互动+个性化推荐=互联网娱乐核心特征<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>娱乐不再被动看互动推荐趣味多<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——娱乐方式变革"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "tf", "stem": "在线教育可以完全取代传统面对面课堂教育。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。在线教育是补充不能完全取代面对面在情感实践纪律等方面不可替代<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>线上线下混合式教学才是未来教育方向两者优势互补<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>完全取代过于绝对<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>线上线下相结合教育效果才最好<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——线上线下关系"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "tf", "stem": "互联网+就是互联网技术简单叠加到传统行业上。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。互联网+不是简单叠加而是深度融合优化要素配置创造新业态<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>简单叠加如把书本PDF放网深度融合如慕课打破时空的全新教学模式<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>简单叠加≠深度融合<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>融合不是拼积木化学反应才算加<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——互联网+本质"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "multi", "stem": "互联网对交流方式带来了哪些改变?", "options": ["A. 实现即时通信突破时空", "B. 支持多媒体文字语音视频交流", "C. 形成网络社交平台扩大社交圈", "D. 使人们不再需要面对面交流"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>ABC正确。互联网丰富交流但面对面仍重要。D不再需要过于绝对<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>互联网加强而非取代真实人际互动<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>不再需要是错误的绝对表述<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>即时多媒体社交补充不替面对<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——交流方式变革"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "multi", "stem": "以下属于互联网催生新业态的有?", "options": ["A. 网约车滴滴出行", "B. 网上外卖美团", "C. 直播电商抖音带货", "D. 传统报刊发行"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>ABC正确。网约车外卖直播电商都是互联网传统融合新业态<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>互联网催生新业态改变生活习惯创造就业和经济增长<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>D传统报刊非互联网催生<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>网约外卖直播新业态生活变<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——新业态举例"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "multi", "stem": "合理使用互联网的正确态度包括?", "options": ["A. 充分利用网络资源学习成长", "B. 注意保护个人隐私和信息安全", "C. 合理安排上网时间避免沉迷", "D. 完全拒绝使用互联网"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>ABC正确。善用不沉迷保护隐私。D完全拒绝不可取应培养合理用网能力<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>信息社会责任教育目标是培养数字公民不盲目崇拜也不全盘否定<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>D完全拒绝是极端观点<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>善用不沉迷安全永为先<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——健康用网"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "short", "stem": "请说明互联网对交流方式带来了哪些具体改变。", "options": [], "answer": "三大改变:(1)即时化:从书信电话到微信QQ信息瞬间传递。(2)多媒体化:从纯文字到语音视频通话更丰富。(3)社交化协作化:社交平台拓展社交圈在线协作工具使异地合作可能。虽突破时空限制但面对面交流价值仍重要。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>交流方式改变是互联网最直观影响从延迟到即时是根本性变革<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>互联网交流工具发展:BBS到QQ到微信到视频通话到在线协作<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按时间维形式维范围维展开<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>交流三变化即时多媒体社交<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——交流方式变革"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "short", "stem": "举例说明互联网+教育如何改变了学习方式。", "options": [], "answer": "互联网+教育四改变:(1)突破时空:随时在线学习如中国大学MOOC。(2)个性化:错题推送针对练习。(3)资源共享:海量学习资源免费获取如B站科普视频。(4)互动学习:在线讨论直播互动。线上线下混合教学成新常态。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>互联网+教育=深度融合打破时空个性化资源共享互动<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>后疫情时代混合教学成新常态数字化学习是核心素养<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>地点变化+实例回答<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>四破四建学更好破时空破统一破局限破单向<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——互联网+教育"}, {"module": "第一模块：互联网基础", "lesson": "L03", "lessonTitle": "第3课 互联网影响新体验", "type": "short", "stem": "互联网带来哪些便利和需要注意的问题?", "options": [], "answer": "便利:(1)交流便捷:即时通信视频通话。(2)信息高效:搜索快速找所需。(3)生活便利:网购移动支付。(4)学习多元:在线教育知识分享。\n问题:(1)信息过载茧房。(2)网络沉迷。(3)隐私泄露。(4)网络安全诈骗。\n总结:善用网络趋利避害做负责任数字公民。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>辩证看待互联网影响是信息社会责任核心素养<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>培养青少年正确认识技术双面性树立网络安全意识<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>利-弊-结论三段式列举各3-4条<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>利弊两面看善用最关键<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第3课——互联网双面性"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "将大文件拆分成多个小数据块分别发送称为什么?", "options": ["A. 数据加密", "B. 数据分包", "C. 数据压缩", "D. 数据备份"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>数据分包是将大文件按固定大小拆分为独立小数据包传输的过程<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分包如搬家时把大件货物拆分搬运每个包有编号和地址信息<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>分包=拆分大型数据为小包传输<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>大文件化小包分包传送效率高<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——数据分包概念"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "设备先将数据包完整接收存储再转发到下一设备的机制称为什么?", "options": ["A. 直接转发", "B. 存储转发", "C. 实时广播", "D. 点对点传输"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>存储转发是中间网络设备先将数据包接收存储检查头部再转发<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>存储转发机制允许不同来源数据包动态共享链路提高可靠性<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>存储再转发=存储转发<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先存后验再转发存储转发不丢包<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——存储转发"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "数据包包含哪两个基本组成部分?", "options": ["A. 文件名和文件内容", "B. 头部信息和数据载荷", "C. 图片和文字", "D. 压缩包和解压码"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>数据包由头部源目的地址序号等控制信息和数据载荷实际传输内容组成<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>头部像信封地址告诉设备从哪来到哪去第几个包<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>数据包=头部控制信息+数据内容<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>头部如信封数据是内容<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——数据包结构"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "数据分包传输的主要优势不包括?", "options": ["A. 提高网络线路利用率", "B. 出错只需重传单个小包", "C. 不同来源数据可共享链路", "D. 传输速度一定比整体传输慢"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>分包传输提高效率容错共享链路通常更高效不会更慢<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>一次性传大文件出错需重传全部效率低<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>D选项说更慢是错误的分包更高效<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>分包优势多快传容错共享<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——分包优势"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "接收端收到所有数据包后需做什么?", "options": ["A. 直接删除", "B. 按编号重新组装成完整数据", "C. 随机排列", "D. 再次拆分"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>接收端需按数据包上的编号顺序将它们重新组装还原成完整原始文件<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>数据包可能走不同路径顺序可能不同需靠编号正确组装<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>分包传输重组还原=完整流程<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>分包传输后编号来组装<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——数据重组"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "某个数据包丢失会怎样?", "options": ["A. 整个文件需重新发送", "B. 只需重传丢失的那个包", "C. 文件直接损坏", "D. 自动忽略"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>分包最大优势:某包丢失或出错只需重传这一个包不需重传整个文件<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>TCP协议通过确认机制检测丢包自动请求重传保证可靠性<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>这是分包核心优势精细错误恢复<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>丢包不用怕单个重传就行<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——错误控制"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "与数据分包不相关的协议是?", "options": ["A. TCP传输控制协议", "B. IP互联网协议", "C. UDP用户数据报协议", "D. HTML超文本标记语言"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>HTML是网页标记语言描述网页结构不属于数据传输协议<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>TCP负责可靠传输IP负责寻址路由UDP负责快速传输<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>HTML=网页语言不是传输协议<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>HTML是网页语TCPIP才传数<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——传输协议"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "存储转发中设备暂存数据的主要目的是?", "options": ["A. 永久保存用户数据", "B. 等待合适传输时机防止数据丢失", "C. 备份所有通信内容", "D. 减慢传输速度"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>暂存为了等待合适传输时机防止数据丢失是临时存储非永久<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>存储是临时的转发完成后设备会删除数据包释放空间<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>临时存+等时机不是永久保存<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>暂存为转发不堵时不丢包<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——存储转发目的"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "关于UDP协议正确的说法是?", "options": ["A. 提供可靠传输保证不丢", "B. 无连接协议速度快但不保证可靠", "C. 主要用于网页浏览", "D. 是TCP的升级版本"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>UDP是无连接协议无需建立连接直接发送速度快但不保证可靠<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>UDP如普通明信片快但不保证到TCP如挂号信可靠但慢<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>UDP=快速+无连接不保证可靠<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>TCP可靠UDP快各有所长<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——UDP"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "single", "stem": "为什么互联网不采用一次性传输整个大文件?", "options": ["A. 文件太大无法存储", "B. 提高传输效率增强可靠性和共享能力", "C. 法律规定", "D. 计算机性能不足"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>分包可提高效率多包并发增强可靠性丢包只重传单个实现网络共享<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>网络链路是共享资源一次性传输全会长时间占用链路<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>效率可靠性共享三理由<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>分包三优势高效可靠共享<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——分包必要性"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "tf", "stem": "数据包在网络传输时所有包都必定经过同一路径到达。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。数据包无连接型传输各包不一定走同路可能不同路线<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>数据包独立路由是互联网设计特点提高网络坚固性<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>必定同一路径过于绝对<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>各包各路走灵活又安全<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——数据包路由特性"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "tf", "stem": "存储转发可在网络故障时暂存数据包等恢复后再转发。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。存储转发重要功能是故障时暂存等恢复后继续转发增强可靠性<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>如在快递中转站前方封路包裹暂存等路通再送出<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>存储转发=缓存+转发应对不稳定<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>存储转发像快递堵车先存再送出<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——存储转发可靠性"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "tf", "stem": "数据包头部包含源地址目的地址和序号等关键信息。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。头部包含源IP目的IP序号等控制信息是正确路由和重组必要条件<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>头部还包含协议类型包长度等没有头部无法处理转发<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>源地址目的地址序号=头部三基本<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>源头去向序号全头部信息要记清<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——包头部结构"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "tf", "stem": "TCP协议是无连接协议不保证传输可靠性。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。TCP是面向连接的协议通过三次握手建立提供可靠传输<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>描述的是UDP特点TCP有确认重传机制<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>TCP=可靠有连接UDP=快速无连接<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>TCP连了才传保证到UDP不连就发快<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——TCP特性"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "multi", "stem": "数据分包传输的优点有?", "options": ["A. 提高网络线路利用率", "B. 某包出错只需重传该包", "C. 不同用户数据可交替传输", "D. 数据包大小固定易于处理"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>全部正确分包提高利用率实现精细错误控制支持多用户共享固定大小便于处理<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>分包传输是互联网高效运行基石如公路允许不同车辆交替通行<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>四选项从效率容错共享标准化说<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>分包四优势高效容错共享标准<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——分包优势总结"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "multi", "stem": "关于数据包头部信息的正确描述?", "options": ["A. 头部包含源IP地址", "B. 头部包含目的IP地址", "C. 头部包含数据包序号", "D. 头部包含文件所有内容"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>ABC正确头部包含源目的地址序号等控制信息。D错误文件内容在数据载荷中<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>头部Header是控制信息数据载荷Payload是传输内容两者明确分工<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>头部控制信息≠载荷内容<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>头控身载头部管路由载荷装内容<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——数据包结构详"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "multi", "stem": "关于TCP和UDP的正确说法?", "options": ["A. TCP是面向连接的可靠传输", "B. UDP是无连接的快速传输", "C. 视频通话适合UDP", "D. 文件下载适合TCP"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>全部正确。TCP可靠适文件下载UDP快速适实时应用各有所长<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>文件需完整性用TCP视频需实时性用UDP<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>TCP求准UDP求快<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>文件TCP保完整视频UDP求流畅<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——TCP与UDP应用"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "short", "stem": "描述数据分包传输的完整过程。", "options": [], "answer": "四步过程:(1)分包:发送端将大文件按固定大小拆分添加头部源目的地址序号。(2)传输:各包经路由器和交换机独立传输采用存储转发逐跳前进。(3)重组:接收端根据序号将包按正确顺序排列。(4)还原:组装完成后还原完整文件丢包可请求重传该包。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>拆传组还四步走理解此过程有助理解互联网传输基本原理<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>真实网络更复杂涉及多层协议配合但核心逻辑是四步<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按时间顺序描述拆-传-组-还<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>拆传组还四步走数据分包灵活传<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——传输过程"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "short", "stem": "对比TCP和UDP的主要区别和应用场景。", "options": [], "answer": "TCP与UDP区别:(1)连接:TCP面向连接需握手UDP无连接直接发。(2)可靠性:TCP保证可靠有确认重传UDP不保证。(3)速度:UDP更快TCP相对慢。(4)场景:TCP适合文件网页邮件等需完整性场景UDP适视频通话游戏直播等实时场景。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>TCP和UDP代表了可靠与速度两种取舍根据应用需求选择<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>TCP和UDP是传输层两大核心协议理解区别有助理解不同应用通信特点<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>连接可靠速度场景四维对比<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>TCP可靠慢如挂号UDP快如放飞鸽<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——协议对比"}, {"module": "第二模块：直播网络我来建", "lesson": "L04", "lessonTitle": "第4课 数据分包灵活传", "type": "short", "stem": "为什么说存储转发增强了网络通信可靠性?", "options": [], "answer": "四原因:(1)缓冲保护:故障或拥堵时暂存等恢复后继续。(2)错误检查:收完整包后可验证正确性发现错误请求重传。(3)流量适配:不同速率链路间起缓冲避免丢包。(4)独立决策:每设备独立决定时机路径某路不通可换路。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>存储转发通过缓存+验证+调度机制比直接转发大大提高可靠性<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现互联网尽力而为原则尽最大努力保证到达<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>四角度:故障应对错误检查速率匹配路径选择<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先存后查再转发断网堵车都不怕<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第4课——存储转发可靠性"}, {"module": "第二模块：直播网络我来建", "lesson": "L05", "lessonTitle": "第5课 网络协议分层设", "type": "single", "stem": "互联网使用的基本协议族是什么?", "options": ["A. OSI协议", "B. TCP/IP协议族", "C. HTTP协议", "D. FTP协议"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>TCP/IP协议族是互联网使用的基本协议族包含TCP和IP等众多协议<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>TCP/IP是互联网 <strong style=\"color:#27ae60;\">💡 解题思路：</strong>Dijkstra=最短路径算法。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>迪杰斯特拉最短路径，路由导航都靠它<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——Dijkstra算法"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "OSPF路由协议使用的是哪种算法？", "options": ["A. Bellman-Ford算法", "B. Dijkstra算法", "C. 冒泡排序算法", "D. 二分查找算法"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>OSPF使用Dijkstra算法（链路状态）计算最短路径。RIP使用Bellman-Ford算法（距离向量）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>OSPF收敛快适合大网，RIP收敛慢适合小网。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>OSPF=Dijkstra，RIP=Bellman-Ford。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>OSPF用D算法，RIP用B算法<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由协议与算法"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "路由表中下一跳指的是什么？", "options": ["A. 数据包的最终目的地", "B. 数据包前进道路上的下一个路由器", "C. 数据包的发送源头", "D. 数据包的大小限制"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>下一跳(Next Hop)是数据包到达当前路由器后应转发给的下一个相邻路由器，像接力赛交棒。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>数据包通过一站一站接力到达目的地。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>下一跳=接力对象。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>像接力赛交棒，下一跳是邻居<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由表字段"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "RIP协议采用的路由算法是什么？", "options": ["A. 链路状态算法", "B. 距离向量算法(Bellman-Ford)", "C. 最短路径优先算法", "D. 随机选择算法"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>RIP使用距离向量算法，通过邻居间交换路由信息逐步学习最佳路径。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>RIP以跳数作为度量值，最大15跳，简单但收敛慢。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>RIP=邻居交换=距离向量。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RIP靠邻居传消息，距离向量慢更新<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——RIP协议"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "链路状态算法和距离向量算法的主要区别是什么？", "options": ["A. 链路状态需要全网拓扑，距离向量只需邻居信息", "B. 距离向量更快", "C. 链路状态算法只适用于有线网络", "D. 两者没有区别"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>链路状态算法需全网拓扑（完整地图），距离向量只需和邻居交换（问邻居）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>链路状态收敛快但开销大，距离向量收敛慢但简单。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>全知全局vs只问邻居。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>链路状态知全局，距离向量问邻居<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由算法对比"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "路由表中的度量值(Metric)的作用是什么？", "options": ["A. 记录数据包的大小", "B. 衡量路径好坏的数值", "C. 记录传输时间", "D. 存储加密密钥"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>度量值是衡量路径好坏的数值，越小越好，帮助路由器选择最优路径。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>可基于跳数、带宽、时延等因素。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>度量值=评分，越小越好。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>度量值越小越好，选路就看谁的少<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——度量值"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "Dijkstra算法的核心思想是什么？", "options": ["A. 随机尝试所有路径", "B. 贪心策略，每次选择当前最短路径的节点", "C. 只走直线路径", "D. 先传输所有数据再选择路径"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>Dijkstra采用贪心策略，每次选当前最短路径节点，逐步扩展到全局最优。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>贪心=每步做当前最好选择，在非负权图中保证全局最优。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>贪心=步步最短。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>Dijkstra贪心算法，步步最短得最优<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——Dijkstra算法思想"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "以下哪种场景不适合使用Dijkstra算法？", "options": ["A. 所有边权重为正数的网络", "B. 存在负权重边的网络", "C. GPS导航计算最短路线", "D. 网络路由计算最短跳数"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>Dijkstra不支持负权重边，此时需用Bellman-Ford算法。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>实际网络路由中权重通常为正，所以Dijkstra广泛应用。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>正权重=D算法，负权重=B算法。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>正权重用D，负权重找B<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——Dijkstra局限"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "single", "stem": "OSPF相比RIP的主要优势是什么？", "options": ["A. 配置更简单", "B. 收敛速度更快，适合大型网络", "C. 不需要路由器", "D. 只能用于家庭网络"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>OSPF收敛快适合大网，RIP有15跳限制适合小网。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>收敛速度指网络变化后全网路由更新一致的速度。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>OSPF=快+大，RIP=慢+小。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>OSPF快大网，RIP慢小网<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——OSPF与RIP对比"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "tf", "stem": "路由器通过相互交换信息来构建和维护路由表。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。路由器之间通过路由协议交换网络信息，动态构建和维护路由表。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>动态路由协议使路由器自动发现网络变化并更新路由表。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>路由器之间互相交流网络信息。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>路由器互交流，路由表共维护<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由表维护"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "tf", "stem": "数据包在网络中传输时，总是沿着最短路径到达目的地。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。路由器尽量选最佳路径但不一定最短。网络拥堵等原因可能导致走更长路线。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>路由选择是动态的，综合考虑多个因素。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>总是过于绝对。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>路由选路多因素，不总最短但最优<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由选择实际"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "tf", "stem": "Dijkstra算法要求图中所有边的权重为非负数。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。Dijkstra算法的重要前提是所有边权重为非负数。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>负权重边时需用Bellman-Ford算法。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>Dijkstra=非负权重。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>D算法怕负权，非负才能算对<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——Dijkstra条件"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "tf", "stem": "跳数是指数据包从源到目的地经过的路由器数量。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。跳数(Hop Count)指经过的路由器数量。RIP以跳数作为度量值。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>RIP最大15跳，超过认为不可达。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>跳数=路由个数。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>跳数就是路由数，RIP用它量远近<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——跳数概念"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "multi", "stem": "路由表中通常包含哪些信息？", "options": ["A. 目标网络地址", "B. 下一跳地址", "C. 度量值(Metric)", "D. 用户账号密码"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>路由表包含目标地址、下一跳、度量值，不包含用户密码。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>核心三要素：去哪、下站给谁、路好不好。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>路由表=网络地图，只需路径信息。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>目标下跳度量值，路由表三要素<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由表结构"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "multi", "stem": "关于路由协议的正确说法有？", "options": ["A. OSPF使用链路状态算法", "B. RIP使用距离向量算法", "C. OSPF收敛比RIP快", "D. OSPF适合大型网络"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>全部正确。OSPF收敛快适合大网，RIP收敛慢适合小网。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>两种基本路由协议体现了不同的设计思想。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>OSPF=快+大，RIP=慢+小。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>OSPF大又快，RIP小又慢<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由协议总结"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "multi", "stem": "关于数据包路由的正确描述有？", "options": ["A. 数据包通过路由器一站一站接力到达目的地", "B. 路由器根据路由表选择最优路径", "C. 不同数据包可能走不同路径到达同一目的地", "D. 所有数据包必须经过同一条固定路径"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>数据包逐跳转发、灵活路由。D错误，包不走固定路径。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>无连接路由增强网络鲁棒性和灵活性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>互联网路由是动态灵活的。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>逐跳接力走，路由灵活变<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由过程"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "short", "stem": "请解释路由表的作用，并说明路由表通常包含哪些关键信息。", "options": [], "answer": "路由表的作用：路由表是路由器内部的网络地图，当数据包到达时查询路由表决定转发到哪个下一跳路由器。\n关键信息：(1)目标网络地址(Destination)：数据包要去的位置。(2)下一跳地址(Next Hop)：接下来发给哪个相邻路由器。(3)度量值(Metric)：衡量路径好坏的数值，越小越好。(4)出接口(Interface)：从哪个端口发出。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>路由表是路由器核心，理解其结构是掌握路由知识的基础。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>路由表可类比为公交车站牌。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>先总述作用，再分述各字段。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>目标下一跳度量口，路由表四要素<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由表"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "short", "stem": "请对比链路状态算法和距离向量算法，说明各自特点和适用场景。", "options": [], "answer": "链路状态算法（代表OSPF，使用Dijkstra）：\n特点：(1)需全网拓扑信息；(2)收敛速度快；(3)计算复杂度高。\n适用：大型企业网络、骨干网络。\n距离向量算法（代表RIP，使用Bellman-Ford）：\n特点：(1)只需与邻居交换信息；(2)收敛速度慢；(3)实现简单。\n适用：小型网络、简单拓扑。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>两种算法体现全局vs局部信息的不同取舍。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现计算思维中算法设计权衡。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>从信息获取、收敛速度、资源、规模四维对比。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>链路全知快又大，距离邻居慢又小<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——两种算法对比"}, {"module": "第二模块：直播网络我来建", "lesson": "L08", "lessonTitle": "第8课 路由路径靠算法", "type": "short", "stem": "简述数据包在网络中从源到目的地的路由过程。", "options": [], "answer": "数据包路由过程（逐跳转发）：\n(1)从源主机出发，到达第一个路由器（默认网关）。\n(2)路由器检查目的IP，查路由表找到最匹配条目。\n(3)转发到下一跳路由器。\n(4)下一跳重复2-3步骤。\n(5)最后一个路由器直接交付给目的主机。\n整个过程像快递经多个中转站到收件人，每个路由器独立决策。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>逐跳转发是IP路由基本方式，每个路由器独立决策。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>这种方式使互联网有鲁棒性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>用快递中转站类比。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>一站一判断，逐跳向前传<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第8课 路由路径靠算法——路由过程"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "光纤通信的传输介质是什么？", "options": ["A. 铜线", "B. 光导纤维", "C. 无线电波", "D. 红外线"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>光纤通信使用光导纤维作为传输介质，利用光的全反射原理传输数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>光纤具有高速率、低损耗、抗干扰等优点，我国千兆光网全球领先。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>光纤=光导纤维，用光传数据。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>光纤传光不传电，高速低损抗干扰<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——光纤通信"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "WiFi属于哪种网络连接方式？", "options": ["A. 有线连接", "B. 无线连接", "C. 光纤连接", "D. 电力线连接"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>WiFi属于无线连接方式，通过无线电波传输数据，无需网线。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>WiFi是最常见的无线网络技术，使用2.4GHz或5GHz频段。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>WiFi=Wireless Fidelity=无线保真。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>WiFi无线连，电波传数据<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——WiFi技术"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "有线连接相比无线连接的主要优势是什么？", "options": ["A. 更方便移动", "B. 连接更稳定，抗干扰能力更强", "C. 不需要任何硬件", "D. 传输距离无限远"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>有线连接更稳定，抗干扰强，不易受墙壁或设备影响。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>有线稳定但布线繁琐，无线灵活但稳定性弱。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>有线=稳定，无线=灵活。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>有线稳如树，无线活如风<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——有线无线对比"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "蓝牙技术主要用于什么场景？", "options": ["A. 远距离宽带通信", "B. 短距离设备间通信", "C. 卫星通信", "D. 海底光缆通信"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>蓝牙是短距离无线通信技术，用于手机与耳机、音箱、手表等近距离数据传输。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>蓝牙覆盖约10米，功耗小，适合电池供电小型设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>蓝牙=近距离配对。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙十米内，设备配成对<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——蓝牙技术"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "以下哪种网络连接方式的传输速度最快？", "options": ["A. 光纤宽带", "B. ADSL宽带", "C. 56K拨号上网", "D. 蓝牙4.0"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>光纤宽带最快，可达千兆(Gbps)级别。拨号仅56Kbps最慢。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>排序：光纤>ADSL>WiFi>蓝牙>拨号。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>光速最快。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>光纤最快千兆级，拨号最慢五十六<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——传输速度对比"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "物联网(IoT)连接的主要目标是什么？", "options": ["A. 让人与人之间更方便交流", "B. 让各种物联设备实现互联互通", "C. 只用于手机和电脑之间", "D. 替代有线电话系统"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>物联网目标是万物互联——让智能设备通过网络相互连接和通信。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>2022年中国物连接数首次超过人连接数。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>IoT=物的互联网。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>物联万物通，设备智能连<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——物联网概念"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "5G轻量化(RedCap)技术主要面向什么应用场景？", "options": ["A. 高性能游戏", "B. 对速率要求不高的物联网场景", "C. 超高清视频直播", "D. 卫星通信"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>RedCap面向速率要求不高的物联网场景，降低设备成本和功耗。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>2024年我国完成全球首个全频段5G轻量化商用验证。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>RedCap=降能力=低成本物联网。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>5G轻量降成本，物联网设备最适<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第9课 数据传输有新意——5G轻量化"}, {"module": "第二模块：直播网络我来建", "lesson": "L09", "lessonTitle": "第9课 数据传输有新意", "type": "single", "stem": "与ADSL宽带相比，光纤宽带的优势不包括以下哪项？", "options": ["A. 传输速率更高", "B. 信号衰减更小", "C. 需要更多铜线资源", "D. 抗电磁干扰能力更强"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>光纤使用光导纤维而非铜线，C选项不是光纤优势。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>光纤是光进铜退的代表，替代铜线是通信升级趋势。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>光纤恰恰不需要铜线。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>光纤不用铜导线，光传信号更优质<br><br><strong style= ", "lessonTitle": "第10课 综合所学建网络", "type": "single", "stem": "在搭建网络过程中遇到故障时，应该采用什么思路排查？", "options": ["A. 直接放弃重新搭建", "B. 从物理连接开始逐层排查，利用工具诊断", "C. 随机调整设置", "D. 等待故障自行恢复"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>应从物理层开始逐层向上排查，用ping等工具逐步定位。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>排查遵循OSI模型自下而上。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排查=系统化+工具化。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先查线再查IP，逐层排查不遗漏<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——故障排查"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "single", "stem": "综合所学建网络这一课中，搭建的直播网络是什么类型的网络？", "options": ["A. 全球互联网", "B. 简易小型局域网", "C. 卫星通信网络", "D. 移动通信网络"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>本课搭建的是简易小型局域网(LAN)，主要针对局域网内设备提供直播服务。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>局域网是小范围连接多台设备的网络，是学习网络搭建的理想起点。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>校园内=局域网。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>校内直播小网络，局域网里大实践<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——局域网"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "tf", "stem": "组建网络时，只需要把设备连接起来，不需要进行任何设置。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。除物理连接还需设置IP、子网掩码、网关等网络参数和安全设置。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物理连接只是第一步。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>连接不够还需配置。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>连起来不够，还要设置好<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——网络配置"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "tf", "stem": "静态IP地址适合用于服务器等需要被其他设备稳定访问的设备。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。服务器需稳定地址，IP变化给访问带来困难。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>网站、文件、打印服务器通常设静态IP。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>需被访问=地址不能变。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>服务器靠静态IP，地址不变好找人<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——静态IP应用"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "tf", "stem": "在进行校园活动直播时，可以随意拍摄和传播任何人的画面。", "options": [], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。直播须遵守《未成年人保护法》等法规，尊重肖像权和隐私权。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>直播需法律约束，不得随意拍摄传播。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>随意任何人=不合法。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>直播有法纪，拍摄需谨慎<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——法律规定"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "tf", "stem": "ping命令可以用来检测目标设备是否已正确接入网络。", "options": [], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。ping发ICMP测试包，有回复说明网络连通。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>最基础网络诊断工具。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>ping通=在线。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>ping通即在线，不通找原因<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——ping检测"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "multi", "stem": "搭建校园直播网络可能需要的硬件设备有？", "options": ["A. 摄像头（拍摄）", "B. 计算机（直播服务器）", "C. 路由器（连接设备）", "D. 网线或WiFi（传输媒介）"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>全部正确。摄录传接四样齐，直播网络能搭起。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>各司其职协同完成直播。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>直播=拍+传+分+看。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摄录传接四样齐，直播网络能搭起<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——硬件"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "multi", "stem": "设置网络参数时需要考虑的因素包括？", "options": ["A. 哪些设备使用静态IP", "B. 哪些设备使用动态IP", "C. 网络安全设置", "D. IP地址的合理规划"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>全部正确。IP分配策略、安全配置、地址规划都需考虑。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>合理规划避免IP冲突，提高安全性。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>网络设置=规划+分配+安全。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>静态动态安全规划，网络设置四要素<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——网络参数"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "multi", "stem": "小型网络搭建的基本步骤包括？", "options": ["A. 需求分析，确定需要哪些硬件", "B. 连接设备（有线或无线）", "C. 设置网络参数（IP地址等）", "D. 测试验证网络是否正常工作"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>全部正确。遵循分析→连接→配置→测试工程流程。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>培养系统化工程思维。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>四步走：分析连配置测。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先计划再连接，设参数后测试<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——搭建流程"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "short", "stem": "请简述搭建一个校园直播网络需要哪些硬件设备及各自的作用。", "options": [], "answer": "校园直播网络硬件及作用：\n(1)摄像头——拍摄活动实时画面，是直播内容来源。\n(2)计算机（直播服务器）——接收画面，编码处理，分发视频流。\n(3)路由器（推荐无线路由器）——组建局域网，方便移动设备接入。\n(4)网线——有线连接重要设备保证稳定性。\n(5)可选：交换机——有线设备多时使用。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>每个设备有特定角色，理解分工有助于合理搭建。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现硬件+配置综合应用。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按采集→处理→分发→接入链列设备。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摄录分接入，四设备搭直播<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——直播硬件"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "short", "stem": "请说明搭建小型网络的基本流程及安全注意事项。", "options": [], "answer": "搭建流程：\n(1)需求分析：明确网络用途，确定设备类型数量。\n(2)硬件准备：选择摄像头、计算机、路由器、网线等。\n(3)物理连接：有线连路由器，无线连WiFi。\n(4)参数配置：服务器设静态IP，客户端动态IP，配置SSID密码。\n(5)测试验证：ping测试连通性。\n安全事项：\n1)设置强密码。2)开启WPA2/WPA3加密。3)关闭不必要服务。4)遵守法律不侵犯隐私。5)定期检查日志。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>网络搭建+安全=完整实践能力。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>新课标强调数字化学习与创新素养。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>流程五步，安全五条。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>分析准备连接配测，安全事项五牢记<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——流程安全"}, {"module": "第二模块：直播网络我来建", "lesson": "L10", "lessonTitle": "第10课 综合所学建网络", "type": "short", "stem": "如果直播网络中其他房间师生无法观看直播，应如何排查？", "options": [], "answer": "排查步骤：\n(1)检查物理连接：网线是否插好，路由器指示灯正常。\n(2)检查IP：ipconfig查看服务器IP，是否同网段。\n(3)测试连通：ping服务器IP看是否通。\n(4)检查防火墙：是否阻止直播端口。\n(5)检查路由器：端口隔离设置。\n(6)检查直播软件：服务运行状态和端口配置。\n(7)检查客户端：输入地址是否正确。\n(8)扩大范围可考虑按学校网络管理部门规则接入校园网。\n系统化逐层排查，从物理到应用层，通常能定位问题。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>网络故障排查是重要实践能力。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现计算思维中问题分解能力。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按OSI模型低到高逐层排查。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>由低到高逐层查，从线到软逐个排<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第10课 综合所学建网络——故障排查"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "FTP服务主要用于实现什么功能？", "options": ["A. 浏览网页", "B. 收发电子邮件", "C. 网络文件传送", "D. 即时通信"], "answer": "C", "analysis": "FTP（File Transfer Protocol，文件传送协议）主要用于通过网络传输各种文件，因此FTP服务也被称为文件传送服务。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "电子邮件地址的正确格式是？", "options": ["A. 用户名#服务商域名", "B. 用户名@服务商域名", "C. 用户名&服务商域名", "D. 用户名$服务商域名"], "answer": "B", "analysis": "电子邮件地址的标准格式为\"用户名@服务商域名\"，其中@符号是电子邮件地址的标识符。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "在电子邮件系统中，SMTP协议的主要作用是？", "options": ["A. 接收邮件", "B. 发送邮件", "C. 浏览网页", "D. 文件传输"], "answer": "B", "analysis": "SMTP（Simple Mail Transfer Protocol，简单邮件传送协议）用于发送邮件；而POPv3（Post Office Protocol第3版）用于接收邮件。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "POPv3协议在电子邮件系统中的功能是？", "options": ["A. 发送邮件", "B. 接收邮件", "C. 加密邮件", "D. 删除邮件"], "answer": "B", "analysis": "POPv3指第3版POP（Post Office Protocol，邮局协议），它的作用是接收邮件。SMTP用于发送邮件，POPv3用于接收邮件。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "以下关于万维网和互联网关系的说法，正确的是？", "options": ["A. 万维网就是互联网", "B. 万维网只是互联网的一种服务", "C. 互联网是万维网的一种服务", "D. 两者完全独立"], "answer": "B", "analysis": "万维网（WWW）常常与互联网混为一谈，但事实上万维网只是互联网提供的一种服务，并不是互联网的全部。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "中国第一台万维网服务器于1994年由哪个机构建成？", "options": ["A. 清华大学", "B. 北京大学", "C. 中国科学院高能物理研究所", "D. 中国科学技术大学"], "answer": "C", "analysis": "1994年，中国科学院高能物理研究所建成了我国第一台万维网服务器，极大推动了我国信息化的发展。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "使用万维网服务最基本的工具是什么？", "options": ["A. 文件传输软件", "B. 浏览器", "C. 电子邮件客户端", "D. 即时通信软件"], "answer": "B", "analysis": "使用万维网只需要浏览器就可以了，不需要安装其他软件，非常方便。这也是万维网能够广泛应用的重要原因之一。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "FTP协议使用的默认端口号是？", "options": ["A. 80", "B. 25", "C. 21", "D. 443"], "answer": "C", "analysis": "FTP协议默认使用21号端口进行文件传输。端口80通常用于HTTP，端口25用于SMTP，端口443用于HTTPS。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "以下哪项不属于典型的互联网服务？", "options": ["A. 文件传送", "B. 电子邮件", "C. 万维网", "D. 本地计算"], "answer": "D", "analysis": "典型的互联网服务包括文件传送（FTP）、电子邮件、万维网（WWW）等，而本地计算是在本机上进行的操作，不属于互联网服务。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "single", "stem": "通过网页的形式访问电子信箱、收发电子邮件，说明了什么？", "options": ["A. 电子邮件必须用客户端软件", "B. 万维网只能浏览网页", "C. 万维网已成为应用最广泛的互联网服务", "D. FTP服务已经过时"], "answer": "C", "analysis": "现在几乎所有的网络活动都可以基于万维网进行，如通过网页访问电子信箱、登录即时通信服务器等，这说明万维网已成为应用最广泛的互联网服务。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "judge", "stem": "FTP是用于文件传送的互联网协议。", "options": [], "answer": 1, "analysis": "FTP（File Transfer Protocol）即文件传送协议，是专门用于通过网络传输文件的互联网服务协议。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "judge", "stem": "SMTP协议用于接收电子邮件。", "options": [], "answer": 0, "analysis": "这个说法是错误的。SMTP（Simple Mail Transfer Protocol）用于发送邮件，而POPv3才用于接收邮件。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "judge", "stem": "万维网与互联网是同一个概念。", "options": [], "answer": 0, "analysis": "错误。万维网（WWW）只是互联网提供的一种服务，互联网还包括文件传送、电子邮件等多种服务。两者不能等同。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "judge", "stem": "使用万维网只需要浏览器，不需要安装其他软件。", "options": [], "answer": 1, "analysis": "正确。使用万维网只需浏览器即可，这是万维网的一大优势，也是它能广泛应用的重要原因。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "multiple", "stem": "典型的电子邮件系统主要涉及哪些协议？（多选）", "options": ["A. SMTP", "B. FTP", "C. POPv3", "D. HTTP"], "answer": ["A", "C"], "analysis": "典型的电子邮件系统主要涉及两种协议：SMTP（Simple Mail Transfer Protocol）用于发送邮件，POPv3（Post Office Protocol第3版）用于接收邮件。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "multiple", "stem": "以下哪些属于常见的互联网服务？（多选）", "options": ["A. 文件传送服务", "B. 电子邮件服务", "C. 万维网服务", "D. 即时通信服务"], "answer": ["A", "B", "C", "D"], "analysis": "常见的互联网服务包括文件传送服务（FTP）、电子邮件服务、万维网服务（WWW）以及即时通信服务等，这些都是互联网上广泛使用的服务类型。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "multiple", "stem": "关于收发电子邮件的方式，以下说法正确的有？（多选）", "options": ["A. 可以使用客户端软件收发邮件", "B. 可以通过浏览器登录网站收发邮件", "C. 可以通过命令方式收发邮件", "D. 只能通过一种方式收发邮件"], "answer": ["A", "B", "C"], "analysis": "收发电子邮件有多种方式：使用客户端软件、通过浏览器登录网站、使用命令方式（如telnet连接SMTP服务器）等，体现了互联网服务发展创新的过程。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "short", "stem": "请简述FTP服务的作用。", "options": [], "answer": "FTP（文件传送协议）服务用于通过网络传输各种文件，允许用户在不同计算机之间上传和下载文件。", "analysis": "FTP（File Transfer Protocol）是互联网上最早使用的协议之一，专门用于文件的上传和下载，极大方便了网络中的文件共享与传输。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "short", "stem": "请说明SMTP和POPv3两种协议的区别。", "options": [], "answer": "SMTP（简单邮件传送协议）用于发送邮件，POPv3（邮局协议第3版）用于接收邮件。两者分工不同，共同完成电子邮件的收发功能。", "analysis": "SMTP负责将邮件从发件人传送到邮件服务器或服务器之间传递，POPv3负责将邮件从服务器下载到收件人的计算机上，两种协议配合使用完成完整的邮件收发流程。"}, {"module": 3, "lesson": "L11", "lessonTitle": "互联网服务应用广", "type": "short", "stem": "为什么说万维网和互联网不能混为一谈？", "options": [], "answer": "互联网是底层的全球性网络基础设施，万维网只是基于互联网的一种服务。互联网还提供文件传送、电子邮件、即时通信等多种服务，万维网只是其中应用最广泛的一种。", "analysis": "互联网是连接全球计算机的网络基础设施，万维网是通过互联网提供信息浏览服务的一种应用。互联网还承载着FTP、电子邮件、即时通信等众多服务，所以万维网只是互联网的一部分，不能等同于互联网。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "万维网中的资源是通过什么结构组织在一起的？", "options": ["A. 树状结构", "B. 线性结构", "C. 网状结构", "D. 层次结构"], "answer": "C", "analysis": "万维网中的资源通过网状结构组织在一起，用户可以通过超链接在各个网页和资源之间自由跳转，体现了万维网在数据组织方面的创新思维。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "万维网服务属于什么类型的服务架构？", "options": ["A. 集中式服务", "B. 分布式服务", "C. 单机服务", "D. 串行服务"], "answer": "B", "analysis": "万维网是一种分布式服务，没有统一的中央服务器，而是由分布在世界各地的许多万维网服务器共同提供服务。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "万维网的工作模式属于什么类型？", "options": ["A. 主从式服务", "B. 对等式服务", "C. 广播式服务", "D. 多播式服务"], "answer": "A", "analysis": "万维网服务属于主从式服务。\"主\"代表服务器（提供服务的计算机），\"从\"代表客户端（普通计算机或智能手机等设备），资源保存在服务器中。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "在万维网中，客户端只需要安装什么即可访问服务？", "options": ["A. FTP客户端", "B. 浏览器", "C. 数据库软件", "D. 操作系统"], "answer": "B", "analysis": "对万维网来说，客户端只要安装浏览器就可以了，这种结构称为\"浏览器-服务器\"（B-S）结构，是\"客户端-服务器\"（C-S）结构的特例。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "万维网是一种典型的什么模式的网络服务？", "options": ["A. \"发布-订阅\"式", "B. \"请求-响应\"式", "C. \"广播-接收\"式", "D. \"推送-获取\"式"], "answer": "B", "analysis": "万维网是一种典型的\"请求-响应\"式网络服务。用户通过浏览器发起请求，服务器收到请求后进行处理并返回响应。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "统一资源定位符（URL）一般不包括以下哪个部分？", "options": ["A. 协议", "B. 域名", "C. 计算机型号", "D. 路径"], "answer": "C", "analysis": "统一资源定位符（URL）一般包括协议、域名、端口、路径、参数等部分，但不包括计算机型号。计算机型号与资源定位无关。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "浏览器向服务器发起请求后，如果资源存在，服务器通常返回什么状态码？", "options": ["A. 404", "B. 500", "C. 200", "D. 301"], "answer": "C", "analysis": "服务器收到请求后，如果资源存在，会返回状态码200（成功），浏览器随后展示网页；如果资源不存在则返回报错信息（如404）。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "超链接可以链接到什么对象？", "options": ["A. 仅同网站的不同网页", "B. 仅同一网页的不同位置", "C. 同网站不同网页、同一网页不同位置、外网站资源等", "D. 仅文字内容"], "answer": "C", "analysis": "超链接可以链接同网站不同网页、同一网页的不同资源（如图像）、外网站的网页或资源等，功能非常灵活。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "以下关于互联网和万维网关系的描述，正确的是？", "options": ["A. 没有互联网，万维网也能运行", "B. 互联网和万维网已经完全无法区分", "C. 互联网是万维网的基础，万维网是使用互联网的重要途径", "D. 万维网是互联网的唯一应用"], "answer": "C", "analysis": "互联网是万维网得以广泛应用的基础，没有互联网万维网就无用武之地；万维网是人们使用互联网的重要途径，没有万维网，互联网中的资源可能无法充分利用。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "single", "stem": "网址\"https://www.baidu.com/s?wd=北斗导航\"中的参数部分是什么？", "options": ["A. https", "B. www.baidu.com", "C. /s", "D. wd=北斗导航"], "answer": "D", "analysis": "该网址中，https是协议，www.baidu.com是域名，/s是路径，wd=北斗导航是参数部分，表示搜索的关键词为\"北斗导航\"。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "judge", "stem": "万维网是一种分布式服务，没有统一的中央服务器。", "options": [], "answer": 1, "analysis": "正确。万维网没有统一的中央服务器，由分布在世界各地的许多万维网服务器共同提供服务，因此是一种分布式服务。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "judge", "stem": "浏览器-服务器（B-S）结构与客户端-服务器（C-S）结构是完全不同的两种结构。", "options": [], "answer": 0, "analysis": "错误。浏览器-服务器（B-S）结构是客户端-服务器（C-S）结构的特例。在万维网中，客户端只需要安装浏览器，因此B-S结构是C-S结构的一种特殊形式。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "judge", "stem": "统一资源定位符（URL）就是日常所说的网址。", "options": [], "answer": 1, "analysis": "正确。统一资源定位符（URL）就是人们通常所说的网址，用于在万维网中定位和访问网页、图像等资源。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "judge", "stem": "短网址服务可以把一个长网址转换成一个短网址，方便分享。", "options": [], "answer": 1, "analysis": "正确。一些互联网应用分享网址时会使用短网址，用一个比较短小的网址代替真实网址，使分享更加便捷。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "multiple", "stem": "万维网浏览网页的一般工作流程包括哪些步骤？（多选）", "options": ["A. 用户发起请求", "B. 服务器响应", "C. 浏览器接收响应", "D. 人机交互"], "answer": ["A", "B", "C", "D"], "analysis": "万维网浏览网页的工作流程包括四个步骤：用户发起请求（输入网址）、服务器响应（返回资源或报错）、浏览器接收响应（展示网页或显示错误）、人机交互（用户操作触发新请求）。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "multiple", "stem": "统一资源定位符（URL）通常包含哪些部分？（多选）", "options": ["A. 协议", "B. 域名", "C. 路径", "D. 参数"], "answer": ["A", "B", "C", "D"], "analysis": "URL一般包括协议（如http/https）、域名（如www.example.com）、端口、路径（如/index.html）和参数（如?key=value）等部分。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "multiple", "stem": "关于超链接，以下说法正确的有？（多选）", "options": ["A. 可以链接同网站的不同网页", "B. 可以链接同一网页中的不同资源", "C. 可以链接外部网站的网页", "D. 只能链接文字内容"], "answer": ["A", "B", "C"], "analysis": "超链接功能灵活，可以链接同网站不同网页、同一网页不同资源（如图像）、外部网站的网页或资源等，不局限于文字内容。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "short", "stem": "请解释万维网中\"请求-响应\"模式的基本过程。", "options": [], "answer": "用户通过浏览器输入网址发起请求，服务器收到请求后进行处理：如果资源存在则返回资源（状态码200），浏览器展示网页；如果资源不存在则返回报错信息。用户浏览网页时点击超链接，浏览器再次发起请求，以此循环。", "analysis": "万维网的\"请求-响应\"模式是B-S架构的核心工作机制，体现了客户端主动请求、服务器被动响应的交互方式，这也是万维网能够高效运作的基础。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "short", "stem": "什么是B-S结构？它与C-S结构有什么关系？", "options": [], "answer": "B-S结构即\"浏览器-服务器\"结构，客户端只需安装浏览器即可访问服务器上的资源。B-S结构是C-S（\"客户端-服务器\"）结构的特例，区别在于客户端的软件要求：B-S只需要通用浏览器，而C-S可能需要安装专门的客户端软件。", "analysis": "B-S结构的优势在于客户端无需安装专门软件，只要有浏览器就能访问服务，极大降低了使用门槛，这也是万维网能够广泛普及的重要原因。"}, {"module": 3, "lesson": "L12", "lessonTitle": "万维网服务大揭秘", "type": "short", "stem": "短网址服务有什么好处和可能引发的问题？", "options": [], "answer": "好处：短网址简洁易记，方便在社交媒体等平台分享。可能引发的问题：短网址隐藏了真实的网址，用户无法直接判断目标网站的安全性，可能被用于网络钓鱼或传播恶意链接。", "analysis": "短网址服务体现了互联网应用不断创新的趋势，在提供便捷性的同时，用户也需要注意安全风险，不随意点击来源不明的短网址。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "HTTP协议工作在哪个传输层协议之上？", "options": ["A. UDP", "B. TCP", "C. IP", "D. ICMP"], "answer": "B", "analysis": "HTTP基于TCP协议实现。因为万维网需要稳定可靠地传输数据（浏览网页、查看图像、下载文件等），而TCP提供可靠传输，因此HTTP选择建立在TCP基础之上。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "HTTP协议传输数据的方式是什么？", "options": ["A. 加密传输", "B. 明文传输", "C. 压缩传输", "D. 分包传输"], "answer": "B", "analysis": "互联网发展早期制定的网络协议（包括HTTP）都以明文方式传输数据，因此用户的账号、密码等信息容易被别有用心的人窃取或篡改。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "HTTPS相比于HTTP的主要优势是什么？", "options": ["A. 速度更快", "B. 传输数据经过加密，更安全", "C. 占用更少带宽", "D. 不需要服务器"], "answer": "B", "analysis": "HTTPS规定传输过程中采用数据加密技术对内容进行加密处理，因而比HTTP的明文传输更加安全，能有效保护用户的隐私数据。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "浏览器访问HTTPS网站时，地址栏通常会显示什么标志？", "options": ["A. 感叹号", "B. 锁形图标", "C. 星号", "D. 叉号"], "answer": "B", "analysis": "访问HTTPS网站时，浏览器地址栏通常会显示锁形图标，表示该网站使用了加密连接，数据传输是安全的。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "HTTP协议默认使用的端口号是？", "options": ["A. 21", "B. 25", "C. 80", "D. 443"], "answer": "C", "analysis": "HTTP协议默认使用80号端口。端口443是HTTPS的默认端口，端口21是FTP的默认端口，端口25是SMTP的默认端口。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "HTTPS协议默认使用的端口号是？", "options": ["A. 21", "B. 80", "C. 443", "D. 8080"], "answer": "C", "analysis": "HTTPS协议默认使用443号端口。它与HTTP（端口80）使用不同的端口，通过SSL/TLS加密层保证数据传输的安全性。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "通过抓包实验对比HTTP和HTTPS数据包，可以发现什么？", "options": ["A. HTTP和HTTPS数据包完全相同", "B. HTTP数据包已加密，HTTPS未加密", "C. HTTP数据包未加密可读取内容，HTTPS数据包已加密不可读", "D. 两者都是加密的"], "answer": "C", "analysis": "通过抓包对比实验可知：HTTP以明文传输，数据包中的内容可以直接读取；HTTPS对数据进行了加密处理，抓取的数据包内容不可读，因此HTTPS更安全。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "为什么浏览器访问网站时需要TCP而不是UDP的支持？", "options": ["A. TCP速度更快", "B. TCP提供可靠传输，确保数据完整", "C. TCP更节省资源", "D. UDP不支持网页传输"], "answer": "B", "analysis": "万维网需要浏览网页、查看图像、下载文件等多种操作，必须稳定可靠地传输数据，而TCP提供面向连接的可靠传输服务，UDP是不可靠传输，因此HTTP/HTTPS建立在TCP之上。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "关于HTTPS的安全性，以下说法正确的是？", "options": ["A. 使用HTTPS就不会遇到任何安全问题", "B. HTTPS只能防止数据被篡改", "C. HTTPS通过加密传输保护数据安全，但仍需注意其他安全因素", "D. HTTPS比HTTP更不安全"], "answer": "C", "analysis": "HTTPS只是给万维网传输过程加密，而传输过程不加密只是导致安全问题的一个因素。使用HTTPS也可能遇到其他安全问题，如钓鱼网站等，因此不能认为HTTPS能解决所有安全问题。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "single", "stem": "HTTPS中的\"S\"代表什么？", "options": ["A. Speed（速度）", "B. Safe或Secure（安全）", "C. Simple（简单）", "D. Server（服务器）"], "answer": "B", "analysis": "HTTPS中的\"S\"代表Secure（安全），全称为Hypertext Transfer Protocol Secure，即安全的超文本传输协议。它通过SSL/TLS协议对数据进行加密传输。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "judge", "stem": "HTTP基于TCP协议实现，因为万维网需要稳定可靠的传输。", "options": [], "answer": 1, "analysis": "正确。HTTP需要稳定可靠的传输以保证网页、图像、文件等数据完整，因此它建立在面向连接、可靠传输的TCP协议之上。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "judge", "stem": "HTTP传输的数据是经过加密处理的。", "options": [], "answer": 0, "analysis": "错误。HTTP以明文方式传输数据，数据未经加密。用户在浏览器与服务器交互过程中发送的账号、密码等信息很容易被窃取。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "judge", "stem": "使用HTTPS可以完全避免所有网络安全问题。", "options": [], "answer": 0, "analysis": "错误。HTTPS只加密万维网的传输过程，但导致安全问题的因素很多，传输过程不加密只是其中之一。使用HTTPS也可能遇到钓鱼网站等其他安全问题。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "judge", "stem": "通过抓包软件可以观察到HTTPS数据包的内容是加密后不可读的。", "options": [], "answer": 1, "analysis": "正确。使用抓包软件对比HTTP和HTTPS数据包可以发现，HTTP数据包内容可直接读取，而HTTPS数据包内容已被加密，无法直接读取。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "multiple", "stem": "关于HTTP和HTTPS的对比，以下说法正确的有？（多选）", "options": ["A. HTTP是明文传输，HTTPS是加密传输", "B. HTTP默认端口80，HTTPS默认端口443", "C. HTTPS比HTTP更安全", "D. HTTP和HTTPS完全相同"], "answer": ["A", "B", "C"], "analysis": "HTTP以明文传输（端口80），HTTPS经过加密传输（端口443），因此HTTPS更安全。两者在安全性方面有显著差异，并非完全相同。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "multiple", "stem": "HTTP明文传输可能带来哪些安全风险？（多选）", "options": ["A. 用户账号被窃取", "B. 密码被窃取", "C. 数据被篡改", "D. 传输速度变慢"], "answer": ["A", "B", "C"], "analysis": "HTTP明文传输意味着数据在传输过程中未经加密，可能被第三方截获并读取，导致账号密码泄露、数据被窃取或篡改等安全风险。传输速度与加密与否没有必然关系。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "multiple", "stem": "当前各大网站纷纷用HTTPS取代HTTP的原因包括？（多选）", "options": ["A. 保证数据传输的安全性", "B. 保护用户隐私", "C. 防止数据被篡改", "D. HTTPS传输速度比HTTP快很多"], "answer": ["A", "B", "C"], "analysis": "各大网站采用HTTPS主要是因为其能通过加密保证数据传输的安全性、保护用户隐私信息（如账号密码）以及防止数据在传输过程中被篡改。HTTPS由于增加了加密解密过程，速度通常不会比HTTP快很多。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "short", "stem": "请简述HTTP明文传输的安全隐患。", "options": [], "answer": "HTTP以明文方式传输数据，在浏览器与服务器交互过程中，用户的账号、密码等敏感信息未经过加密处理，容易被别有用心的人通过抓包等方式窃取或篡改，存在严重的安全隐患。", "analysis": "明文传输是HTTP协议设计之初的特点，在当时网络安全威胁较少的环境下问题不大。但随着互联网的普及，信息安全问题日益突出，HTTP的明文传输方式已经无法满足安全需求，因此需要HTTPS来提供加密保护。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "short", "stem": "为什么不能认为\"使用HTTPS就不会遇到安全问题\"？", "options": [], "answer": "HTTPS只是对万维网传输过程进行了加密，而传输过程不加密只是导致安全问题的一个因素。其他安全因素还包括：钓鱼网站、恶意软件、服务器端漏洞、用户自身的安全意识不足等。因此使用HTTPS也可能遇到安全问题。", "analysis": "网络安全是综合性的问题，不能只依赖单一技术。HTTPS解决了传输过程中的加密问题，但用户仍需注意识别网站真伪、保护个人信息、提高安全意识等多方面的问题。"}, {"module": 3, "lesson": "L13", "lessonTitle": "万维网安全新协议", "type": "short", "stem": "请说明HTTP和HTTPS的主要区别。", "options": [], "answer": "HTTP和HTTPS的主要区别有：1）HTTP以明文传输数据，HTTPS对数据加密后传输；2）HTTP默认使用80端口，HTTPS默认使用443端口；3）HTTPS比HTTP更安全，能有效防止数据被窃取或篡改；4）HTTPS需要SSL/TLS证书支持。", "analysis": "HTTP是万维网的基础协议，但安全性不足。HTTPS在HTTP的基础上增加了SSL/TLS加密层，使得数据传输过程更加安全可靠，已成为现代网站的标准配置。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "搜索引擎能够快速返回搜索结果，体现了什么思想？", "options": ["A. \"以时间换空间\"", "B. \"以空间换时间\"", "C. \"以质量换速度\"", "D. \"以速度换质量\""], "answer": "B", "analysis": "搜索引擎提前把海量信息保存下来，耗费大量存储空间，以此来换取对查询需求的快速响应。这种工作方式体现了\"以空间换时间\"的思想。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "搜索引擎工作流程中，获取网页数据后首先要做什么？", "options": ["A. 网页排序", "B. 建立索引", "C. 返回用户", "D. 删除数据"], "answer": "B", "analysis": "搜索引擎工作流程为：获取网页数据 → 建立索引 → 形成网页索引 → 用户搜索时根据索引匹配 → 进行网页排序并返回结果。建立索引是连接数据存储与搜索查询的关键环节。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "网络爬虫在搜索引擎中的作用是什么？", "options": ["A. 显示搜索结果", "B. 自动获取网页数据", "C. 加密数据传输", "D. 建立网络连接"], "answer": "B", "analysis": "网络爬虫可以自动获取相关的网页以备查询，它替代了人工操作的烦琐过程，极大提升了搜索引擎的工作效率。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "在搜索引擎的简易搜索系统中，搜索结果是依据什么进行排序的？", "options": ["A. 网页大小", "B. 关键词出现次数（次数越多越靠前）", "C. 网页创建时间", "D. 随机排序"], "answer": "B", "analysis": "在简易搜索系统中，搜索结果是依据关键词在网页中出现的次数进行排序的，次数越多排名越靠前。当然实际搜索引擎的排序算法要复杂得多。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "搜索引擎工作流程的完整顺序是？", "options": ["A. 网页排序→建立索引→获取信息→网页索引", "B. 获取信息→网页数据→建立索引→网页索引→网页排序", "C. 网页索引→网页排序→获取信息→建立索引", "D. 建立索引→获取信息→网页排序→网页数据"], "answer": "B", "analysis": "搜索引擎的工作流程为：获取信息（爬取网页）→ 形成网页数据 → 建立索引 → 生成网页索引 → 用户搜索时进行查询匹配 → 网页排序 → 返回搜索结果。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "分词技术在搜索引擎中的作用是什么？", "options": ["A. 加密搜索内容", "B. 将搜索短语切分为更小的词语单元以提高匹配精度", "C. 加快网页加载速度", "D. 美化搜索页面"], "answer": "B", "analysis": "分词技术将用户输入的搜索短语切分为更小的词语单元，以便搜索引擎更精准地匹配网页内容，提高搜索结果的准确性和相关性。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "pages.csv文件在简易搜索系统中的作用是？", "options": ["A. 存储网页样式", "B. 记录网页文件的文件名和对应的网址", "C. 保存用户密码", "D. 存储搜索结果"], "answer": "B", "analysis": "pages.csv文件用于记录网页文件的文件名和对应的网址，相当于搜索系统的数据目录，搜索引擎通过它来定位和管理已收集的网页数据。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "以下哪种方式能更高效地扩充搜索引擎中的网页数据？", "options": ["A. 人工手动保存网页", "B. 使用网络爬虫自动获取", "C. 等待用户提交", "D. 从其他搜索引擎复制"], "answer": "B", "analysis": "通过人工操作来扩充搜索系统中的网页数据比较烦琐，使用网络爬虫可以自动获取相关网页，极大提升工作效率。这体现了自动化技术给搜索带来的改进。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "搜索引擎在用户输入关键词后能快速返回结果，根本原因是？", "options": ["A. 搜索引擎实时遍历全部网页", "B. 搜索引擎提前建立了网页索引", "C. 互联网速度非常快", "D. 用户输入的关键词很短"], "answer": "B", "analysis": "搜索引擎能快速返回结果，是因为它提前把海量信息保存下来并建立了索引。当用户搜索时，只需在已建好的索引中查找匹配内容，而不需要实时遍历全网。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "single", "stem": "除了关键词出现次数，以下哪项也可用于改进搜索排序精准度？", "options": ["A. 网页背景颜色", "B. 网页被其他网站链接的数量", "C. 网页文件大小", "D. 网页创建者姓名"], "answer": "B", "analysis": "除了关键词出现次数外，网页被其他网站链接的数量（即链接流行度）是重要的排序参考指标。被越多网站链接的网页通常内容质量越高，应排在更靠前的位置。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "judge", "stem": "搜索引擎是通过实时遍历互联网上所有网页来查找结果的。", "options": [], "answer": 0, "analysis": "错误。搜索引擎不是实时遍历全网，而是提前爬取网页数据并建立索引。用户搜索时直接在已建立的索引中查找，因此能快速返回结果。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "judge", "stem": "搜索引擎的工作方式体现了\"以空间换时间\"的思想。", "options": [], "answer": 1, "analysis": "正确。搜索引擎提前存储海量网页数据并建立索引，虽然耗费了大量存储空间，但换来了对用户查询的快速响应，这正是\"以空间换时间\"思想的体现。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "judge", "stem": "网络爬虫是一种可以自动获取网页数据的程序。", "options": [], "answer": 1, "analysis": "正确。网络爬虫是一种自动化程序，可以按照一定规则自动访问网站并获取网页数据，大大提高了搜索引擎收集网页信息的效率。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "judge", "stem": "搜索引擎的排序结果只取决于关键词出现次数，没有其他因素。", "options": [], "answer": 0, "analysis": "错误。简易搜索系统中以关键词出现次数为主要排序依据，但实际搜索引擎的排序算法非常复杂，还考虑网页质量、链接关系、用户行为等多种因素来提高排序精准度。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "multiple", "stem": "搜索引擎的工作流程包括以下哪些环节？（多选）", "options": ["A. 获取网页数据", "B. 建立索引", "C. 网页排序", "D. 加密传输"], "answer": ["A", "B", "C"], "analysis": "搜索引擎的主要工作流程包括：获取网页数据、建立索引、查询匹配和网页排序。加密传输不是搜索引擎的环节，而是安全通信协议的范畴。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "multiple", "stem": "以下哪些技术可以改进搜索引擎的效果？（多选）", "options": ["A. 网络爬虫自动获取网页", "B. 分词技术提高匹配精度", "C. 多指标综合排序", "D. 加密存储所有数据"], "answer": ["A", "B", "C"], "analysis": "网络爬虫可以自动化获取网页数据，分词技术提高搜索匹配精度，多指标综合排序使搜索结果更精准。加密存储与改进搜索效果没有直接关系。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "multiple", "stem": "关于搜索引擎，以下说法正确的有？（多选）", "options": ["A. 搜索引擎需要定期更新网页索引", "B. 网络爬虫可以自动发现新网页", "C. 好的排序算法让搜索结果更有用", "D. 搜索引擎中只保存网页的文字内容"], "answer": ["A", "B", "C"], "analysis": "搜索引擎需要定期更新索引以反映网页变化，网络爬虫可自动发现和获取新网页，好的排序算法使搜索结果更有价值。但搜索引擎保存的信息不仅是文字，还包括链接关系等多种数据。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "short", "stem": "请简述搜索引擎\"以空间换时间\"的工作思想。", "options": [], "answer": "搜索引擎提前使用网络爬虫获取互联网上的海量网页数据，并建立索引存储在本地（耗费大量存储空间）。当用户进行搜索时，直接在已建立的索引中查找匹配内容，而不需要实时遍历全网，因此能快速返回搜索结果（节省时间）。", "analysis": "\"以空间换时间\"是计算机科学中常见的设计思想。搜索引擎通过预先存储和索引数据，将搜索响应时间从可能需要遍历全网缩短到毫秒级，代价是占用大量存储空间来保存索引数据。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "short", "stem": "请说明网络爬虫对搜索引擎的改进作用。", "options": [], "answer": "网络爬虫能够自动访问网站并获取网页数据，替代了人工手动保存网页的烦琐操作。它使搜索引擎的数据收集从\"人工操作\"变为\"自动获取\"，极大提升了搜索系统中网页数据的更新效率和覆盖范围，让搜索引擎能及时获取最新的网页信息。", "analysis": "网络爬虫的应用体现了自动化技术对搜索引擎的重要改进。它不仅提高了效率，还使搜索引擎能够持续不断地更新索引数据，保持搜索结果的时效性和全面性。"}, {"module": 3, "lesson": "L14", "lessonTitle": "互联网搜索新发展", "type": "short", "stem": "除了关键词出现次数，还有哪些因素可以让搜索结果排序更精准？", "options": [], "answer": "可以改进排序精准度的因素包括：网页被其他网站链接的数量和质量（链接流行度）、网页的更新频率和时效性、用户点击行为数据、网页内容质量评估、关键词在标题等重要位置的出现情况等。", "analysis": "实际搜索引擎使用众多因素综合计算网页的排名，如Google的PageRank算法就主要基于网页之间的链接关系评估网页重要性。这种多维度综合排序比单纯按关键词次数排序更加精准。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "用于测试网络连通性的命令是？", "options": ["A. ipconfig", "B. ping", "C. tracert", "D. netstat"], "answer": "B", "analysis": "ping命令可用于连通性测试，如果能ping通目标，就可以认为能与目标进行基本的网络通信。此外，ping命令也可以用来获取域名对应的IP地址。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "用于查看本机IP地址等TCP/IP信息的命令是？", "options": ["A. ping", "B. tracert", "C. ipconfig", "D. netstat"], "answer": "C", "analysis": "ipconfig命令用于显示TCP/IP相关的信息，包括IPv4地址、IPv6地址、网关、域名服务器等。它是网络诊断中最常用的命令之一。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "用于跟踪数据到达目标所经路径的命令是？", "options": ["A. ping", "B. ipconfig", "C. netstat", "D. tracert"], "answer": "D", "analysis": "tracert（trace route，跟踪路由）命令用于跟踪通信路径，可显示数据到达访问目标时所经过的路由器。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "用于查看计算机当前网络连接情况的命令是？", "options": ["A. ipconfig", "B. netstat", "C. ping", "D. tracert"], "answer": "B", "analysis": "netstat命令用于显示所用计算机的网络连接情况，包括当前活动的TCP连接、监听端口等信息。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "如果想查看本机的网关和域名服务器地址，应使用哪个命令？", "options": ["A. ping", "B. tracert", "C. netstat", "D. ipconfig"], "answer": "D", "analysis": "ipconfig命令可显示TCP/IP相关信息，包括IPv4地址、IPv6地址、网关、域名服务器（DNS服务器）等，是查看本机网络配置的首选命令。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "如果想知道访问某个网站时数据经过了哪些路由器，应使用？", "options": ["A. ping", "B. ipconfig", "C. tracert", "D. netstat"], "answer": "C", "analysis": "tracert命令可以跟踪并显示数据包从本机到达目标主机所经过的每一跳路由器的信息，是了解网络路由路径的重要工具。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "数据包在不同网络层流动时，每一层接到上层数据后都会做什么？", "options": ["A. 直接发送", "B. 删除数据", "C. 添加含有本层控制信息的头部", "D. 加密数据"], "answer": "C", "analysis": "服务器发送数据时，数据从上到下在不同层流动。每一层接到上层传来的数据后，都会加上含有本层控制信息的头部，形成TCP包、IP包等，然后交给下一层处理。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "TCP包主要由哪两部分组成？", "options": ["A. 头部和数据体", "B. 源地址和目的地址", "C. 域名和IP", "D. 请求和响应"], "answer": "A", "analysis": "TCP包主要由头部和数据体两部分组成。头部包含控制信息（如源端口和目的端口），数据体包含实际传输的内容。同样，IP包也是由头部和数据体两部分组成的。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "浏览网页时，IP数据包是基于什么进行通信的？", "options": ["A. 域名", "B. IP地址", "C. URL地址", "D. 邮件地址"], "answer": "B", "analysis": "底层的IP数据包是基于IP地址进行通信的。域名需要通过域名解析服务（DNS）转换为IP地址后，才能在网络层进行传输。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "single", "stem": "TCP包头部包含哪些关键信息？", "options": ["A. 源端口和目的端口", "B. 源IP和目的IP", "C. 域名和路径", "D. 用户和密码"], "answer": "A", "analysis": "TCP包头部含有源端口和目的端口等关键信息。而源IP地址和目的IP地址则是IP包头部包含的关键信息。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "judge", "stem": "ping命令只能测试连通性，无法获取域名对应的IP地址。", "options": [], "answer": 0, "analysis": "错误。ping命令除了测试连通性外，还可以获取域名对应的IP地址。当ping一个域名时，系统会先进行DNS解析，显示出域名对应的IP地址。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "judge", "stem": "数据在不同网络层流动时，每一层都会在数据上添加自己的头部信息。", "options": [], "answer": 1, "analysis": "正确。数据从上到下流经不同网络层时，每一层接到上层传来的数据后，都会添加含有本层控制信息的头部，形成本层的数据包再传给下一层。这体现了分层设计的思想。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "judge", "stem": "IP包头部包含源IP地址和目的IP地址信息。", "options": [], "answer": 1, "analysis": "正确。IP包头部含有源IP地址和目的IP地址等关键信息，用于在网络层进行数据包的路由和转发。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "judge", "stem": "netstat命令用于显示计算机的TCP/IP配置信息。", "options": [], "answer": 0, "analysis": "错误。netstat用于显示网络连接情况，而显示TCP/IP配置信息（如IP地址、网关、DNS等）的命令是ipconfig。这两个命令功能不同。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "multiple", "stem": "以下哪些是常用的网络诊断命令？（多选）", "options": ["A. ping", "B. ipconfig", "C. tracert", "D. netstat"], "answer": ["A", "B", "C", "D"], "analysis": "ping（测试连通性）、ipconfig（查看IP配置）、tracert（跟踪路由）和netstat（查看网络连接）都是常用的网络诊断命令，各有不同的功能和用途。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "multiple", "stem": "关于数据包在网络层中的封装，以下说法正确的有？（多选）", "options": ["A. 数据从上到下逐层封装", "B. 每层添加含有本层控制信息的头部", "C. TCP包数据体大小等于HTTP总数据量", "D. IP包数据体大小等于TCP包总数据量"], "answer": ["A", "B", "C", "D"], "analysis": "数据封装是逐层进行的：应用层HTTP数据 → 传输层添加TCP头部形成TCP包 → 网络层添加IP头部形成IP包。因此TCP包数据体=HTTP数据，IP包数据体=TCP包总大小。"}, {"module": 3, "lesson": "L15", "lessonTitle": "互联网实验齐发现", "type": "multiple", "stem": "以下关于网络命令功能的匹配，正确的有？（多选）", "options": ["A. ping — 测试连通性、获取IP地址", "B. ipconfig — 查看本机IP地址和网关", "C. tracert — 跟踪数据经过的路由器", "D. netstat — 查看网络连接情况"], "answer": ["A", "B", "C", "D"], "analysis": "四种命令各有明确的功能定位：ping测连通性和解析IP，ipconfig查看本机网络配置，tracert跟踪路由路径，ne
