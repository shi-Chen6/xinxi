">Ctrl+Alt+I</span> / <span class=\"kbd\">Ctrl+Alt+C</span></td><td>自由变换、图像大小、画布大小。</td></tr>\n    <tr><td>色彩调整</td><td><span class=\"kbd\">Ctrl+L</span> / <span class=\"kbd\">Ctrl+M</span> / <span class=\"kbd\">Ctrl+U</span> / <span class=\"kbd\">Ctrl+B</span> / <span class=\"kbd\">Ctrl+I</span> / <span class=\"kbd\">Ctrl+Shift+U</span></td><td>色阶、曲线、色相/饱和度、色彩平衡、反相、去色。</td></tr>\n    <tr><td>视图与面板</td><td><span class=\"kbd\">Ctrl+0</span> / <span class=\"kbd\">Ctrl+Alt+0</span> / <span class=\"kbd\">Ctrl+R</span> / <span class=\"kbd\">Tab</span> / <span class=\"kbd\">F5</span> / <span class=\"kbd\">F7</span></td><td>满画布显示、100% 实际像素、显示标尺、显隐所有面板、画笔面板、图层面板。</td></tr>\n    <tr><td>其他常用</td><td><span class=\"kbd\">Ctrl+F</span> / <span class=\"kbd\">Q</span> / <span class=\"kbd\">D</span> / <span class=\"kbd\">X</span> / <span class=\"kbd\">[</span> <span class=\"kbd\">]</span></td><td>重复上一次滤镜、切换快速蒙版、恢复默认前景背景色、前后景色互换、缩小／放大画笔直径。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip warning\">真题回顾：“用 Photoshop 对左图加工得到右图，执行的主要操作是（　）”，若右图与左图<strong>左右镜像</strong>且<strong>边缘朦胧虚化</strong>，答案就是“<span class=\"highlight\">水平翻转并羽化处理</span>”。解题口诀：看方向判断翻转／旋转，看边缘判断羽化／模糊，看范围判断裁剪。</div>\n", "tags": ["图像编辑", "自由变换", "快捷键", "必考"]}, {"id": "ps3", "title": "选区、蒙版与抠图", "icon": "✂️", "html": "\n<p class=\"lead\">抠图是 Photoshop 最能体现水平的操作，本质是<span class=\"highlight\">“如何精确地把主体从背景中分离出来”</span>。核心链条是：<strong>建立选区 → 转为蒙版 → 精修边缘</strong>。蒙版之所以重要，是因为它可以反复修改却不会破坏图层本身的像素，去掉蒙版原图就会重现。</p>\n\n<div class=\"sub-h\">一、建立选区的六条路线</div>\n<ol class=\"step-list\">\n  <li><strong>规则形状用选框工具</strong>：矩形／椭圆选框适合方形、圆形对象，按 <span class=\"kbd\">Shift</span> 画正方形与正圆。</li>\n  <li><strong>手绘轮廓用套索工具组</strong>：套索徒手勾勒，多边形套索连续单击折点，磁性套索沿高反差边缘自动吸附。</li>\n  <li><strong>纯色背景用魔棒或快速选择</strong>：魔棒按容差选相近色；快速选择工具像画笔一样“刷”出选区，会智能扩展到相似区域。</li>\n  <li><strong>光滑边缘用钢笔工具</strong>：钢笔 <span class=\"kbd\">P</span> 绘制精确路径 → 在“路径”面板中单击“将路径作为选区载入”（或 <span class=\"kbd\">Ctrl+Enter</span>），适合杯子、汽车、家电等边缘规整的物体。</li>\n  <li><strong>整体色调用色彩范围</strong>：菜单“选择 → 色彩范围”→ 用吸管在画面上取色 → 调整“颜色容差” → 确定，可跨越不连续区域选中同类颜色。</li>\n  <li><strong>发丝与半透明用通道</strong>：进入“通道”面板挑选主体与背景反差最大的通道复制，用色阶把它调成非黑即白，再载入选区。</li>\n</ol>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>选区的修改</td><td>菜单“选择 → 修改”→ 边界 / 平滑 / 扩展 / 收缩 / 羽化</td><td>扩展与收缩按指定像素向外或向内推移边界；平滑消除选区尖角；收缩 1～2 像素再抠图可有效去掉背景残留的“白边”。</td></tr>\n    <tr><td>扩大选取与选取相似</td><td>菜单“选择 → 扩大选取 / 选取相似”</td><td>“扩大选取”把选区扩展到相邻的相近颜色；“选取相似”把整幅图中所有相近颜色一并选中。</td></tr>\n    <tr><td>存储与载入选区</td><td>选择 → 存储选区（保存为 Alpha 通道）；选择 → 载入选区（或按住 <span class=\"kbd\">Ctrl</span> 单击通道缩览图）</td><td>把辛苦做好的选区保存进通道，下次可直接调用，避免重复劳动。</td></tr>\n    <tr><td>调整边缘 / 选择并遮住</td><td>建立粗选区 → 单击选项栏“选择并遮住（调整边缘）”→ 使用“调整边缘画笔”涂抹发丝 → 勾选“净化颜色” → 输出到“新建带有图层蒙版的图层”</td><td>专门处理毛发、树叶等复杂边缘，可设置半径、平滑、羽化、对比度、移动边缘等参数。</td></tr>\n    <tr><td>消除锯齿</td><td>在选框／套索／魔棒的选项栏中勾选“消除锯齿”</td><td>通过在边缘生成半透明过渡像素，去除位图选区边缘的锯齿状台阶，使边缘更平滑自然。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、蒙版：非破坏性编辑的核心</div>\n<p>蒙版与选取范围的功能相同，两者之间可以相互转换，但有明显区别：使用蒙版后会有一个形状出现在通道面板中，用户可以对它继续编辑修改；而选取范围只是一个流动的虚线框。当需要改变图像某个区域的颜色，或对该区域应用滤镜时，<span class=\"highlight\">蒙版可以隔离并保护图像的其余部分</span>。</p>\n\n<div class=\"tip success\">蒙版口诀：<strong>黑遮白显灰半透</strong>。在图层蒙版上用黑色画笔涂抹＝隐藏该处内容，用白色画笔涂抹＝恢复显示，用灰色或降低不透明度＝呈现半透明过渡效果。</div>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>快速蒙版</td><td>按 <span class=\"kbd\">Q</span> 或单击工具箱下方“以快速蒙版模式编辑”按钮 → 用黑白画笔涂抹（未被保护区域显示为半透明红色）→ 再按 <span class=\"kbd\">Q</span> 返回标准模式</td><td>把选区临时变成蒙版进行精细编辑，以精确选取范围。工作时“通道”面板会出现一个临时的“快速蒙版”通道；切换回标准模式后快速蒙版消失，<strong>未被保护的区域变成选区</strong>。</td></tr>\n    <tr><td>图层蒙版</td><td>选中图层 → 单击“图层”面板底部“添加图层蒙版”按钮 → 用黑／白画笔或渐变在蒙版缩览图上涂抹</td><td>加在图层上的一个遮盖，用来控制图层中不同区域的显示或隐藏。可将大量特殊效果应用到图层，<strong>而不会影响该图层上的像素</strong>，随时可停用、删除或应用。</td></tr>\n    <tr><td>剪贴蒙版</td><td>把上层图层放在基底图层之上 → 按 <span class=\"kbd\">Ctrl+Alt+G</span>（或按住 <span class=\"kbd\">Alt</span> 单击两图层之间的分隔线）</td><td>使用下方图层的内容（形状与透明像素）来遮盖它上面的图层，上层内容只在基底图层的不透明区域内显示。常用于“文字里填充图片”“形状内嵌照片”。</td></tr>\n    <tr><td>矢量蒙版</td><td>用钢笔或形状工具绘制路径 → 图层 → 矢量蒙版 → 当前路径</td><td>以矢量路径定义显示区域，边缘绝对锐利，放大不会出现锯齿，适合规则的界面元素。</td></tr>\n    <tr><td>蒙版与选区互转</td><td>按住 <span class=\"kbd\">Ctrl</span> 单击蒙版缩览图＝把蒙版载入为选区；有选区时单击“添加图层蒙版”＝把选区转为蒙版</td><td>体现了“选区与蒙版可相互转换”的关系，是抠图流程中的关键衔接动作。</td></tr>\n    <tr><td>停用／删除蒙版</td><td>右键单击蒙版缩览图 → 停用图层蒙版 / 删除图层蒙版 / 应用图层蒙版</td><td>停用可临时查看原图；删除后原图像完整重现；应用则把蒙版效果真正写入像素（不可逆）。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、通道：保存颜色与选区信息</div>\n<p>通道是指一幅图像的某种合成成分，主要存放图像的颜色数据、路径和选区信息。打开新图像时会自动创建颜色信息通道，图像的颜色模式决定所创建颜色通道的数目——例如 <span class=\"highlight\">RGB 图像有 4 个默认通道：红、绿、蓝各一个，外加一个用于编辑图像的复合通道</span>；CMYK 图像则有 5 个通道。</p>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>查看通道</td><td>窗口 → 通道 → 逐个单击红、绿、蓝通道观察</td><td>通道以灰度图显示，越白表示该颜色成分越多。选主体与背景灰度差最大的一个通道作为抠图基础。</td></tr>\n    <tr><td>通道抠图（抠发丝）</td><td>① 复制反差最大的通道；② 按 <span class=\"kbd\">Ctrl+L</span> 用色阶把黑的压更黑、白的提更白；③ 用画笔把主体内部涂黑（或涂白）；④ 按住 <span class=\"kbd\">Ctrl</span> 单击该通道缩览图载入选区；⑤ 回到 RGB 复合通道与图层面板，必要时反选后添加图层蒙版</td><td>通道是抠取图像最强大的功能，可以抠取人物纤细的头发，还能抠取<strong>半透明的图像</strong>，如透明婚纱、玻璃杯、烟雾、火焰等。</td></tr>\n    <tr><td>Alpha 通道</td><td>“选择 → 存储选区”后自动生成 Alpha 1、Alpha 2……</td><td>专门用于保存选区的附加通道，白色代表被选中区域，黑色代表未选中区域，灰色代表部分选中。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、抠图方法选择对照表</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>纯色背景商品图</td><td>魔术橡皮擦单击背景，或魔棒选背景后 <span class=\"kbd\">Delete</span>／反选加蒙版</td><td>速度最快。注意先把背景图层双击转换为普通图层，否则删除后会填充背景色。</td></tr>\n    <tr><td>边缘规整的物体</td><td>钢笔工具描路径 → <span class=\"kbd\">Ctrl+Enter</span> 转选区 → 收缩 1 像素 → 添加蒙版</td><td>边缘最干净、可控性最强，是印刷级抠图的标准做法。</td></tr>\n    <tr><td>颜色反差大的人物</td><td>磁性套索沿边缘拖动 → 回到起点单击闭合 → 进入“选择并遮住”精修</td><td>兼顾速度与精度，适合课堂演示。</td></tr>\n    <tr><td>人物头发、动物毛发</td><td>通道法：复制通道 → 色阶加强对比 → 载入选区 → 添加图层蒙版</td><td>唯一能保留细碎发丝的可靠方法，必要时配合“调整边缘画笔”净化颜色。</td></tr>\n    <tr><td>婚纱、玻璃、烟雾</td><td>通道法保留灰度过渡，或用图层混合模式“滤色”叠加</td><td>半透明物体不能简单删背景，必须保留中间灰度信息才自然。</td></tr>\n    <tr><td>抠图后边缘生硬</td><td>选区羽化 1～2 像素，或在蒙版上用柔边黑色画笔轻扫边缘</td><td>羽化让主体与新背景自然融合，这正是真题中“羽化使图像边缘与背景自然融合”的实际应用。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">流程记忆：<strong>粗选 → 转蒙版 → 精修 → 合成</strong>。永远优先用蒙版而不是直接按 <span class=\"kbd\">Delete</span> 删除像素，因为蒙版随时可以改，删掉的像素却回不来。</div>\n", "tags": ["选区", "蒙版", "抠图", "必考"]}, {"id": "ps4", "title": "滤镜、调色与修复", "icon": "🌈", "html": "\n<p class=\"lead\">如果说选区决定“改哪里”，那么调色、滤镜与修复就决定“改成什么样”。<span class=\"highlight\">调色负责还原与美化真实色彩，滤镜负责制造艺术效果，修复工具负责去掉画面里不该出现的东西</span>。三者组合，构成照片后期处理的完整流程。</p>\n\n<div class=\"sub-h\">一、图像色彩调整</div>\n<p>所有调色命令集中在菜单<strong>“图像 → 调整”</strong>中；若希望保留可反复修改的能力，则应使用“图层 → 新建调整图层”，以调整图层的形式作用于下方图层。</p>\n\n<ol class=\"step-list\">\n  <li><strong>先看直方图定曝光</strong>：打开“窗口 → 直方图”，观察像素分布是偏左（欠曝）还是偏右（过曝）。</li>\n  <li><strong>用色阶或曲线定明暗</strong>：<span class=\"kbd\">Ctrl+L</span> 色阶拖动黑场、灰场、白场三个滑块；<span class=\"kbd\">Ctrl+M</span> 曲线拉出 S 形增强对比。</li>\n  <li><strong>用色彩平衡纠偏色</strong>：<span class=\"kbd\">Ctrl+B</span> 分别对阴影、中间调、高光调整青—红、洋红—绿、黄—蓝三组滑块。</li>\n  <li><strong>用色相/饱和度定色彩</strong>：<span class=\"kbd\">Ctrl+U</span> 调整色相、饱和度、明度，勾选“着色”可给灰度图上色。</li>\n  <li><strong>最后局部精修</strong>：配合选区或图层蒙版，只让调整作用于画面的一部分。</li>\n</ol>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>色阶</td><td>图像 → 调整 → 色阶（<span class=\"kbd\">Ctrl+L</span>）→ 拖动输入色阶的黑、灰、白三个滑块</td><td>通过重新分布图像的明暗层次来调整对比与影调。黑场滑块右移使暗部更黑，白场滑块左移使亮部更亮，中间灰滑块控制整体明暗。</td></tr>\n    <tr><td>曲线</td><td>图像 → 调整 → 曲线（<span class=\"kbd\">Ctrl+M</span>）→ 在斜线上单击添加控制点并拖动</td><td>功能最强大的影调与色彩工具。曲线上凸提亮、下凹压暗，拉成 S 形可同时提亮高光、压暗阴影，增强对比；还可切换到单个颜色通道单独调色。</td></tr>\n    <tr><td>亮度/对比度</td><td>图像 → 调整 → 亮度/对比度 → 输入 -100～100 之间的数值或拖动滑块</td><td>对图像色彩范围进行最简单的调整。<strong>亮度</strong>指画面的明亮程度；<strong>对比度</strong>是画面黑与白的比值，比值越大从黑到白的渐变层次越多、色彩表现越丰富。数值为负时亮度／对比度降低，为正时升高。</td></tr>\n    <tr><td>色相/饱和度</td><td>图像 → 调整 → 色相/饱和度（<span class=\"kbd\">Ctrl+U</span>）→ 拖动色相、饱和度、明度滑块</td><td>用来调整图像的色相和饱和度，使色彩更加亮丽；勾选“着色”后可以给灰度图像添加单一色调，制作单色怀旧效果。</td></tr>\n    <tr><td>色彩平衡</td><td>图像 → 调整 → 色彩平衡（<span class=\"kbd\">Ctrl+B</span>）→ 选择阴影／中间调／高光 → 拖动三组互补色滑块</td><td>方便快捷地改变彩色图像中的颜色混合，用于<strong>校正图像色偏</strong>、调节过饱和或饱和度不足。它<strong>只作用于复合颜色通道</strong>；对话框下方的“保持亮度”复选框可保持整体亮度不变，调整 RGB 图像时应选中它。</td></tr>\n    <tr><td>去色与黑白</td><td>图像 → 调整 → 去色（<span class=\"kbd\">Ctrl+Shift+U</span>）；或图像 → 调整 → 黑白</td><td>去色把彩色一键变灰；“黑白”命令可分别控制红、黄、绿、青、蓝、洋红各色转换为灰度时的明暗，效果更专业。</td></tr>\n    <tr><td>反相</td><td>图像 → 调整 → 反相（<span class=\"kbd\">Ctrl+I</span>）</td><td>把画面颜色转换为其补色，形成照片底片效果；在蒙版上按 <span class=\"kbd\">Ctrl+I</span> 可一键反转显示与隐藏区域。</td></tr>\n    <tr><td>可选颜色 / 替换颜色</td><td>图像 → 调整 → 可选颜色（或替换颜色）</td><td>针对某一类颜色单独加减油墨或直接换色，例如把红衣服改成蓝衣服而不影响其他部分。</td></tr>\n    <tr><td>调整图层</td><td>单击“图层”面板底部“创建新的填充或调整图层”按钮 → 选择曲线／色阶等</td><td>调整效果以独立图层存在，可随时双击修改参数、降低不透明度、用蒙版限制作用范围，属于典型的<strong>非破坏性调色</strong>。</td></tr>\n    <tr><td>颜色模式</td><td>图像 → 模式 → RGB / CMYK / 灰度 / 位图 / Lab</td><td>RGB 用于屏幕显示（红绿蓝三原色相加混色）；CMYK 用于印刷（青、洋红、黄、黑四色相减混色）；灰度只有明暗没有彩色；位图只有黑白两色。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、滤镜：把画面进行艺术过滤</div>\n<p>所谓滤镜，就是把原有的画面进行艺术过滤，得到一种艺术化或更完美的展示效果。无论是普通图层还是文本图层，都能直接使用滤镜（部分滤镜需先栅格化）。所有滤镜都按分类放置在<strong>“滤镜”菜单</strong>中，使用时从菜单中执行对应命令即可；按 <span class=\"kbd\">Ctrl+F</span> 可重复执行上一次使用的滤镜。</p>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>风格化</td><td>滤镜 → 风格化 → 查找边缘 / 浮雕效果 / 风 / 曝光过度</td><td>对图像边缘进行特殊效果处理，产生描边、浮雕、吹风等艺术化外观。</td></tr>\n    <tr><td>画笔描边</td><td>滤镜 → 画笔描边 → 成角的线条 / 喷溅 / 阴影线</td><td>模拟不同笔触绘制的绘画效果，使照片带上手绘质感。</td></tr>\n    <tr><td>模糊</td><td>滤镜 → 模糊 → 高斯模糊 / 动感模糊 / 径向模糊 / 镜头模糊</td><td>模拟各种镜头景深，产生模糊效果。高斯模糊常用于磨皮柔化与制作阴影；动感模糊营造运动速度感；径向模糊制作爆炸或旋转效果。</td></tr>\n    <tr><td>扭曲</td><td>滤镜 → 扭曲 → 波浪 / 极坐标 / 球面化 / 挤压</td><td>对图像进行几何变形，制作水波、哈哈镜、球面包裹等特殊造型。</td></tr>\n    <tr><td>锐化</td><td>滤镜 → 锐化 → USM 锐化 / 智能锐化</td><td>通过增加相邻像素的对比度来使模糊图像变清晰，使边缘更清晰。过度锐化会产生噪点和白边。</td></tr>\n    <tr><td>视频</td><td>滤镜 → 视频 → NTSC 颜色 / 逐行</td><td>视频滤镜并不是用来处理视频的，主要用于处理从摄像机输入的视频图像（去除隔行扫描线等）。</td></tr>\n    <tr><td>素描</td><td>滤镜 → 素描 → 铬黄 / 便条纸 / 影印 / 半调图案</td><td>使图像产生模拟素描、速写及三维的艺术效果，多数以前景色和背景色重新着色。</td></tr>\n    <tr><td>纹理</td><td>滤镜 → 纹理 → 龟裂缝 / 马赛克拼贴 / 纹理化</td><td>给图像添加纹理，使其具有质感，如画布、砂岩、拼贴等表面效果。</td></tr>\n    <tr><td>像素化</td><td>滤镜 → 像素化 → 马赛克 / 彩色半调 / 晶格化</td><td>将图像转成不同色块组成的图案，常用于打码、制作波普风格。</td></tr>\n    <tr><td>渲染</td><td>滤镜 → 渲染 → 镜头光晕 / 云彩 / 光照效果 / 纤维</td><td>为图像添加特殊光效，或制作云彩效果，云彩滤镜以当前前景色和背景色随机生成。</td></tr>\n    <tr><td>艺术效果</td><td>滤镜 → 艺术效果 → 干画笔 / 水彩 / 海报边缘 / 塑料包装</td><td>模拟天然或传统的艺术媒介效果，把照片变为油画、水彩画等。</td></tr>\n    <tr><td>杂色</td><td>滤镜 → 杂色 → 添加杂色 / 蒙尘与划痕 / 减少杂色</td><td>为图像添加杂色使画面颗粒化，或反向去除照片上的噪点、灰尘与划痕。</td></tr>\n    <tr><td>液化</td><td>滤镜 → 液化 → 使用向前变形、膨胀、收缩、褶皱等画笔涂抹</td><td>可以对图像任意扭曲，常用于人像瘦脸瘦身、瘦腿、眼睛变大等修饰，是修图必备。</td></tr>\n    <tr><td>抽出（旧版）</td><td>滤镜 → 抽出 → 用边缘高光器描边 → 填充内部 → 预览确定</td><td>早期版本用于抠图去除毛边，保持抠出来的图边缘圆滑；新版本已由“选择并遮住”取代。</td></tr>\n    <tr><td>消失点</td><td>滤镜 → 消失点 → 用创建平面工具绘制透视网格 → 在网格内仿制或粘贴</td><td>修复有透视角度的照片，使复制的内容自动符合画面的透视关系。</td></tr>\n    <tr><td>镜头校正</td><td>滤镜 → 镜头校正 → 自动校正或自定义</td><td>校正镜头畸变、修复照片的倾斜、变形或暗角等问题。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip warning\">滤镜使用注意：① 滤镜只对<strong>当前选中的图层或选区</strong>生效；② 文字图层与形状图层需先<strong>栅格化</strong>才能使用大部分滤镜；③ 位图模式和索引颜色模式下滤镜大多不可用，需先转为 RGB 模式；④ 想保留可修改性，可先“转换为智能对象”，再使用<strong>智能滤镜</strong>。</div>\n\n<div class=\"sub-h\">三、修饰与修复工具</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>污点修复画笔工具</td><td>选择工具 <span class=\"kbd\">J</span> → 把画笔调到略大于污点 → 在污点上<strong>单击一下</strong></td><td>无需取样，自动分析周围像素进行填充，一键去除痘印、斑点、小杂物，是最省事的修复工具。</td></tr>\n    <tr><td>修复画笔工具</td><td>① 按住 <span class=\"kbd\">Alt</span> 键单击干净区域<strong>手动取样</strong>；② 松开 <span class=\"kbd\">Alt</span>，把指针移到需要修复的位置按下鼠标来回拖动</td><td>可以将一幅图案的全部或部分连续复制到同一幅或另一幅图像中，并自动<strong>融合目标区域的明暗、纹理与阴影</strong>，修复痕迹更自然。</td></tr>\n    <tr><td>修复画笔的选项设置</td><td>在选项栏中设置画笔、模式、源、对齐</td><td>画笔用于设置直径、硬度、间距；模式设置色彩混合方式；源分为“取样”和“图案”两种——选“取样”表示单击图像中某一点取样，选“图案”表示使用系统提供的图案；勾选“对齐”后无论中途停顿多久都不会中断图像的连续性，不勾选则每次重新以指针位置为中心复制。</td></tr>\n    <tr><td>修补工具</td><td>选中修补工具 → 在选项栏选择“源” → 拖动鼠标绘制出需要修补的选区 → 把该选区拖动到干净的位置后松开鼠标</td><td>是修复画笔功能的扩展，主要用于修补<strong>较大面积</strong>的污点。松开鼠标后，原选中区域的图像会与目标位置的图像自动融合。选“目标”则方向相反。</td></tr>\n    <tr><td>红眼工具</td><td>选择红眼工具 → 在瞳孔的红色区域单击</td><td>快速去除闪光灯造成的红眼，可设置瞳孔大小和变暗量。</td></tr>\n    <tr><td>仿制图章工具</td><td>① 选取仿制图章 <span class=\"kbd\">S</span>，把鼠标放到要被复制的图像上，指针显示为图章形状；② 按住 <span class=\"kbd\">Alt</span> 键单击一下进行定点取样；③ 把鼠标移到目标位置，按住鼠标拖动，复制的图像会逐渐出现</td><td>原理是<strong>复制取样图像</strong>，把取样处的像素原样搬到涂抹处，不做明暗融合。适合复制完整对象或覆盖大块杂物，也是真题中“主要用来复制取样的图像”的标准表述。</td></tr>\n    <tr><td>图案图章工具</td><td>选择图案图章 → 在选项栏选择图案 → 涂抹</td><td>用预设或自定义图案进行绘制，可制作重复纹理背景。</td></tr>\n    <tr><td>内容识别填充</td><td>用套索圈出多余物体 → 编辑 → 填充 → 内容识别 → 确定</td><td>由软件自动分析周围环境并智能补全，一键去除路人、电线杆等大面积杂物。</td></tr>\n    <tr><td>模糊 / 锐化 / 涂抹工具</td><td>在工具箱中选择对应工具 → 在局部区域涂抹</td><td>模糊工具柔化局部（如磨皮）；锐化工具强化局部细节（如眼睛）；涂抹工具产生手指划过湿颜料的拖拽效果。</td></tr>\n    <tr><td>减淡 / 加深 / 海绵工具</td><td>选择工具 → 设置范围（阴影／中间调／高光）与曝光度 → 涂抹</td><td>减淡提亮局部，加深压暗局部，二者配合可做人像立体感修饰；海绵工具增加或降低局部饱和度。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">辨析记忆：<strong>修复画笔＝取样＋融合</strong>（修复肤色斑点最自然）；<strong>仿制图章＝取样＋原样复制</strong>（复制完整物体最可靠）；<strong>修补工具＝画选区＋拖动融合</strong>（处理大面积污渍最高效）；<strong>污点修复画笔＝无需取样，直接点</strong>（处理小瑕疵最快）。</div>\n", "tags": ["滤镜", "调色", "修复"]}, {"id": "ps5", "title": "文字、图层样式与输出", "icon": "🔤", "html": "\n<p class=\"lead\">一幅作品的最后一公里是<span class=\"highlight\">加文字、上特效、按用途存成正确的格式</span>。文字与形状属于矢量对象，缩放不失真；图层样式是 Photoshop 的特色功能，可制作阴影、发光、浮雕等效果；而 PSD、JPG、PNG 的取舍，则是每年判断题与选择题都爱考的“常识型”得分点。</p>\n\n<div class=\"sub-h\">一、文字工具</div>\n<p>文字工具组共有四个成员，按 <span class=\"kbd\">T</span> 调出，按 <span class=\"kbd\">Shift+T</span> 在组内循环切换。</p>\n\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">横排文字工具</div><div class=\"d\">可以输入水平方向的文字，生成独立的文字图层。</div></div>\n  <div class=\"cell\"><div class=\"t\">直排文字工具</div><div class=\"d\">可以输入垂直方向的文字，适合古风、对联等版式。</div></div>\n  <div class=\"cell\"><div class=\"t\">横排文字蒙版工具</div><div class=\"d\">单击后整幅图像蒙上一层半透明红色（相当于进入快速蒙版状态），输入完成后切换其他工具，文字即转变为浮动的<strong>文字选区</strong>。</div></div>\n  <div class=\"cell\"><div class=\"t\">直排文字蒙版工具</div><div class=\"d\">与横排文字蒙版工具相似，只是文字为竖排方向。</div></div>\n</div>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>输入点文字</td><td>选择横排文字工具 → 在画面上单击出现光标 → 输入内容 → 按 <span class=\"kbd\">Ctrl+Enter</span> 或单击选项栏对勾确认</td><td>适合标题等短文本，文字不会自动换行。确认后自动生成缩览图带“T”的文字图层。</td></tr>\n    <tr><td>输入段落文字</td><td>选择文字工具 → 在画面上<strong>拖出一个文本框</strong> → 输入内容</td><td>文字在框内自动换行，可拖动框边调整排版区域，适合大段说明文字。</td></tr>\n    <tr><td>修改文字属性</td><td>选中文字 → 在选项栏或“字符”面板中设置字体、字号、颜色、行距、字距、消除锯齿方式</td><td>“窗口 → 字符／段落”可打开更完整的排版面板，段落面板控制对齐方式与缩进。</td></tr>\n    <tr><td>再次编辑文字</td><td>双击“图层”面板中该图层缩览图上的“T”标志</td><td>文字图层保持可编辑状态，随时可修改文字内容与字体，这是它与栅格化后位图的根本区别。</td></tr>\n    <tr><td>变形文字</td><td>选中文字图层 → 单击选项栏“创建文字变形”按钮 → 选择扇形、拱形、旗帜、鱼形等样式 → 调整弯曲度</td><td>为标题制作弧形、波浪等造型，变形后文字仍可编辑。</td></tr>\n    <tr><td>路径文字</td><td>用钢笔或形状工具画一条路径 → 选择文字工具，把光标移到路径上出现波浪线图标时单击 → 输入文字</td><td>让文字沿曲线、圆形路径排列，常用于印章、徽标设计。</td></tr>\n    <tr><td>文字转选区／形状</td><td>按住 <span class=\"kbd\">Ctrl</span> 单击文字图层缩览图得到文字选区；或右键 → 转换为形状</td><td>文字选区可用于填充图案、渐变；转换为形状后可用钢笔调整每个笔画的锚点。</td></tr>\n    <tr><td>栅格化文字</td><td>右键单击文字图层 → 栅格化文字</td><td>把矢量文字变成位图像素，便于进一步使用滤镜和涂抹等编辑，但<strong>之后不能再修改文字内容</strong>，操作前应先复制一份文字图层备份。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、形状工具</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>矩形工具</td><td>按 <span class=\"kbd\">U</span> 选择 → 在选项栏选择“形状”模式 → 拖动绘制（按 <span class=\"kbd\">Shift</span> 画正方形）</td><td>可以绘制出矩形或正方形，生成带矢量蒙版的形状图层。</td></tr>\n    <tr><td>圆角矩形工具</td><td>先在选项栏设置“半径”数值 → 再拖动绘制</td><td>根据不同的半径选项，绘制圆角角度不同的圆角矩形，常用于按钮、卡片设计。</td></tr>\n    <tr><td>椭圆工具</td><td>拖动绘制（按 <span class=\"kbd\">Shift</span> 画正圆）</td><td>可以绘制出椭圆或正圆。</td></tr>\n    <tr><td>多边形工具</td><td>在选项栏设置边数，可勾选“星形”并设置缩进量 → 拖动绘制</td><td>可以绘制出<strong>至少 3 个边、最多 100 个边</strong>的多边形或星形，是常考的数字型知识点。</td></tr>\n    <tr><td>直线工具</td><td>设置粗细，在“箭头”选项中勾选起点／终点 → 按住 <span class=\"kbd\">Shift</span> 拖动可画水平、垂直或 45 度线</td><td>可以绘制出直线或带箭头的形状，用于标注和示意图。</td></tr>\n    <tr><td>自定形状工具</td><td>在选项栏“形状”下拉列表中挑选图形（可单击齿轮载入全部形状库）→ 拖动绘制</td><td>可以绘制软件自带的图形，也可加载外部图形或把路径“定义为自定形状”后自定义使用。</td></tr>\n    <tr><td>形状的三种模式</td><td>在选项栏切换“形状 / 路径 / 像素”</td><td>“形状”生成可缩放不失真的矢量图层；“路径”只产生路径便于转选区；“像素”直接在当前图层上画出位图。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、图层样式</div>\n<p>图层样式是 Photoshop 的特色功能之一，利用它可以制作很多图层特效，比如阴影、发光、浮雕等。<span class=\"highlight\">在图层上单击右键选择“混合选项”，即可打开“图层样式”对话框</span>；应用图层样式的图层名称后面会标有 <em>fx</em> 标记，样式可以随时删除或修改。</p>\n\n<ol class=\"step-list\">\n  <li><strong>打开对话框</strong>：双击图层空白处，或右键单击图层选择“混合选项”，或单击“图层”面板底部的 <em>fx</em> 按钮。</li>\n  <li><strong>勾选并调整效果</strong>：在左侧列表中勾选需要的效果名称，然后<strong>单击效果名称本身</strong>（不是只勾方框）才能在右侧调整参数。</li>\n  <li><strong>复制样式到其他图层</strong>：右键单击已有样式的图层 → 拷贝图层样式 → 在目标图层上右键 → 粘贴图层样式。</li>\n  <li><strong>管理样式</strong>：展开图层下方的效果列表，单击眼睛可隐藏单个效果，拖到垃圾桶可删除；“图层 → 图层样式 → 缩放效果”可整体缩放特效大小。</li>\n  <li><strong>栅格化样式</strong>：需要对特效本身做滤镜处理时，可新建空图层与之合并，把样式转为像素。</li>\n</ol>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>投影 / 内阴影</td><td>勾选“投影”，设置混合模式、不透明度、角度、距离、扩展、大小</td><td>投影在对象外侧生成阴影产生立体悬浮感；内阴影在对象内侧生成阴影，产生凹陷效果。</td></tr>\n    <tr><td>外发光 / 内发光</td><td>勾选后设置发光颜色、方法（柔和／精确）、扩展与大小</td><td>沿对象边缘向外或向内发光，常用于霓虹字、发光按钮。</td></tr>\n    <tr><td>斜面和浮雕</td><td>勾选后选择样式（外斜面／内斜面／浮雕／枕状浮雕）、方法、深度、方向、大小、软化，并设置“等高线”与“纹理”</td><td>模拟高光与阴影使平面对象呈现凹凸的立体质感，教材中“利用图层样式中的浮雕效果制作肥皂上的图案”就是它的典型应用。</td></tr>\n    <tr><td>光泽</td><td>勾选“光泽”并调整角度、距离、大小与等高线</td><td>在对象内部形成流动的绸缎质感光影。</td></tr>\n    <tr><td>颜色叠加 / 渐变叠加 / 图案叠加</td><td>勾选后分别选择纯色、渐变或图案，并设置混合模式与不透明度</td><td>在不改变原像素的前提下为图层整体铺色、铺渐变或铺纹理，随时可换。</td></tr>\n    <tr><td>描边</td><td>勾选“描边”，设置大小、位置（外部／内部／居中）、填充类型</td><td>沿图层内容边缘加一圈轮廓线，常用于文字标题增强可读性。真题中“设置描边效果”即指此项。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、保存、导出与文件格式</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>存储源文件</td><td>文件 → 存储（<span class=\"kbd\">Ctrl+S</span>），格式选择 PSD</td><td>PSD 是 Photoshop 的默认专用格式，<strong>完整保留图层、蒙版、通道、路径、文字的可编辑性</strong>，是二次修改的唯一依靠，文件体积较大。</td></tr>\n    <tr><td>另存为其他格式</td><td>文件 → 存储为（<span class=\"kbd\">Ctrl+Shift+S</span>）→ 选择格式与保存位置 → 设置质量参数</td><td>存为 JPG 等格式时会自动拼合图层，因此应当<strong>先存一份 PSD，再另存交付格式</strong>。</td></tr>\n    <tr><td>存储为 Web 所用格式</td><td>文件 → 存储为 Web 所用格式（<span class=\"kbd\">Ctrl+Alt+Shift+S</span>）→ 选择 JPEG／PNG-8／PNG-24／GIF → 调整品质与颜色数 → 存储</td><td>可在预览中同时比较画质与文件大小，为网页输出体积最优的图片。</td></tr>\n    <tr><td>JPG（JPEG）</td><td>另存时设置品质 0～12</td><td><strong>有损压缩</strong>，文件体积小、色彩丰富，适合照片；<strong>不支持透明背景</strong>，反复保存会累积画质损失。</td></tr>\n    <tr><td>PNG</td><td>另存为 PNG，选择 PNG-24 保留细腻透明</td><td><strong>无损压缩且支持透明背景（Alpha 通道）</strong>，适合抠好的产品图、图标、需要叠放到其他背景上的素材。</td></tr>\n    <tr><td>GIF</td><td>存储为 Web 所用格式 → GIF；配合“窗口 → 时间轴”制作帧动画</td><td>最多 256 色，支持简单动画和单色透明，适合小图标与表情动图，不适合照片。</td></tr>\n    <tr><td>TIFF / PDF</td><td>另存为 TIF 或 PDF</td><td>TIFF 无损、可保留图层与通道，是印刷行业常用交付格式；PDF 便于跨平台预览与打印。</td></tr>\n    <tr><td>设置分辨率</td><td>图像 → 图像大小 → 修改“分辨率”</td><td>分辨率指每英寸的像素数（ppi）。屏幕显示一般 72 ppi，印刷输出需 300 ppi；分辨率越高图像越清晰，文件也越大。</td></tr>\n    <tr><td>打印输出</td><td>文件 → 打印（<span class=\"kbd\">Ctrl+P</span>）→ 设置纸张、缩放、色彩管理</td><td>印刷前应把颜色模式由 RGB 转换为 <strong>CMYK</strong>，避免打印成品出现明显偏色。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip success\">交付口诀：<strong>要改稿存 PSD，发照片存 JPG，要透明存 PNG，做动图存 GIF，去印刷转 CMYK 存 TIFF</strong>。考试中只要看到“需要保留图层以便再次修改”，答案必是 PSD；看到“需要透明背景”，答案必是 PNG。</div>\n", "tags": ["文字", "图层样式", "输出"]}]}, {"chapter": "第六章 动画制作软件 Flash", "title": "Flash 核心知识与操作", "cards": [{"id": "fl0", "title": "Flash 核心操作速查总表", "icon": "📋", "html": "\n<p class=\"lead\">Flash 是集动画创作与应用程序开发于一身的软件，广泛用于制作包含视频、声音、图形与动画的交互内容。本速查表汇总 Flash 各核心模块的操作入口与功能，帮助快速定位考点。</p>\n<table class=\"knowledge-table\">\n<thead><tr><th>功能模块</th><th>核心操作</th><th>功能说明</th></tr></thead>\n<tbody>\n<tr><td>初始用户界面</td><td>启动 Flash 后选择“创建文件 / 辅助学习”</td><td>提供新建、模板与学习资源的入口界面</td></tr>\n<tr><td>操作界面</td><td>菜单栏、场景与舞台、时间轴、工具、属性、库面板</td><td>Flash 主要工作区，围绕舞台布局</td></tr>\n<tr><td>面板</td><td>“窗口”菜单调出时间轴 / 属性 / 库 / 颜色 / 对齐 / 信息 / 变形</td><td>设置对象属性与编辑辅助</td></tr>\n<tr><td>工具箱</td><td>选择、任意变形、线条、铅笔、钢笔、椭圆、矩形、颜料桶、刷子、橡皮擦等</td><td>完成绘制、填充、擦除与变形</td></tr>\n<tr><td>元件</td><td>“插入”→“新建元件”，类型含影片剪辑 / 按钮 / 图形</td><td>可重复使用的媒体对象，存于库面板</td></tr>\n<tr><td>帧</td><td>右键时间轴“插入关键帧 / 空白关键帧 / 帧”</td><td>组成动画的每一静态画面</td></tr>\n<tr><td>补间动画</td><td>属性面板“补间”设为“动画”或“形状”</td><td>动作补间（元件）与形状补间（打散图形）</td></tr>\n<tr><td>引导层</td><td>右键图层“添加引导层”并绘制引导线</td><td>使对象沿指定路径运动（路径动画）</td></tr>\n<tr><td>遮罩</td><td>右键图层“遮罩层”</td><td>遮罩层定形状、被遮罩层定内容</td></tr>\n<tr><td>ActionScript 基础</td><td>在关键帧或按钮上写 stop() / play() / gotoAndPlay()</td><td>控制动画播放与跳转</td></tr>\n<tr><td>发布输出</td><td>“文件”→“发布设置”，勾选 SWF / HTML</td><td>导出可播放的 .swf 与网页文件</td></tr>\n</tbody>\n</table>\n<p class=\"tip\">提示：测试影片快捷键为 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">Enter</span>，会在源文件同目录生成同名 <span class=\"highlight\">.swf</span> 文件。</p>\n", "tags": ["Flash", "速查", "必考"]}, {"id": "fl1", "title": "界面与元件", "icon": "⚡", "html": "\n<p class=\"lead\">Flash 的操作界面由菜单栏、舞台、时间轴、工具箱与各类浮动面板组成；元件是 Flash 动画的可复用核心对象，分为影片剪辑、按钮与图形三种类型。</p>\n<h3 class=\"sub-h\">一、操作界面主要组成</h3>\n<ol class=\"step-list\">\n<li><strong>舞台与时间轴</strong>：舞台是编辑与预览动画的区域，时间轴由“层控制区”和“帧控制区”组成，显示动画位置与帧序列。</li>\n<li><strong>工具箱</strong>：提供选择、绘制、填充、擦除与变形等工具。</li>\n<li><strong>属性面板</strong>：随选定对象变化，显示并设置最常用属性，加快文档创建。</li>\n<li><strong>库面板</strong>：存储创建或导入的媒体资源与组件，Flash 8 起支持“单一库面板”同时查看多个文档。</li>\n</ol>\n<table class=\"knowledge-table\">\n<thead><tr><th>面板</th><th>主要功能</th></tr></thead>\n<tbody>\n<tr><td>时间轴面板</td><td>管理图层、帧、播放头，可插入、删除、选择、移动帧</td></tr>\n<tr><td>颜色面板</td><td>默认 RGB 模式，<span class=\"highlight\">Alpha</span> 控制透明度（0% 全透明—100% 不透明），“#”开头为十六进制颜色码</td></tr>\n<tr><td>对齐面板</td><td>与舞台对齐、对齐、分布、匹配大小、间隔共 5 个区域</td></tr>\n<tr><td>信息面板</td><td>显示对象宽高、X/Y 坐标、颜色与鼠标位置信息</td></tr>\n<tr><td>变形面板</td><td>缩放、旋转、倾斜、复制并应用变形</td></tr>\n</tbody>\n</table>\n<h3 class=\"sub-h\">二、三类元件</h3>\n<div class=\"feature-grid\">\n<div class=\"cell\"><div class=\"t\">影片剪辑</div><div class=\"d\">拥有独立时间轴，可嵌套播放，适合复杂动画与交互</div></div>\n<div class=\"cell\"><div class=\"t\">按钮元件</div><div class=\"d\">时间轴含弹起、指针经过、按下、点击 4 帧，点击帧定义响应区域（不可见）</div></div>\n<div class=\"cell\"><div class=\"t\">图形元件</div><div class=\"d\">依赖主时间轴播放，用于静态或简单图形复用</div></div>\n</div>\n<p class=\"tip\">提示：按钮元件的 4 帧分别是“弹起”（默认）、“指针经过”、“按下”、“点击”（命中区域），只有按钮元件能响应 onMouseEvent 鼠标事件。</p>\n", "tags": ["Flash", "元件", "舞台", "必考"]}, {"id": "fl2", "title": "动画类型与帧", "icon": "🎞️", "html": "\n<p class=\"lead\">帧是 Flash 动画的每一静态画面，动画播放速度称为“帧 / 每秒”。Flash 提供五种常见动画形式：逐帧动画、动作补间动画、形状补间动画、路径动画与遮罩动画。</p>\n<h3 class=\"sub-h\">一、帧的类型</h3>\n<table class=\"knowledge-table\">\n<thead><tr><th>帧类型</th><th>含义</th><th>操作</th></tr></thead>\n<tbody>\n<tr><td>关键帧</td><td>有具体内容的帧</td><td>右键“插入关键帧”</td></tr>\n<tr><td>空白关键帧</td><td>无内容的关键帧（舞台上为空）</td><td>右键“插入空白关键帧”</td></tr>\n<tr><td>普通帧（帧）</td><td>延续前一关键帧内容，延长显示</td><td>右键“插入帧”</td></tr>\n</tbody>\n</table>\n<h3 class=\"sub-h\">二、五种动画形式</h3>\n<ol class=\"step-list\">\n<li><strong>逐帧动画</strong>：每一帧都设为关键帧并绘制不同内容，连续播放成动画；灵活但工作量大、文件大（如导入 GIF 序列）。</li>\n<li><strong>动作补间动画</strong>：对象为首尾关键帧间属性（大小、位置、透明度、颜色）由系统自动补间，对象是元件。</li>\n<li><strong>形状补间动画</strong>：基本形状在一定时间内过渡渐变，对象必须是打散的图形。</li>\n<li><strong>路径动画</strong>：在动作补间基础上加引导层，对象沿引导线运动。</li>\n<li><strong>遮罩动画</strong>：至少含遮罩层与被遮罩层，遮罩层定形状、被遮罩层定内容。</li>\n</ol>\n<table class=\"knowledge-table\">\n<thead><tr><th>动画类型</th><th>背景颜色</th><th>对象要求</th></tr></thead>\n<tbody>\n<tr><td>动作补间</td><td>淡蓝色 + 黑色箭头</td><td>必须是元件</td></tr>\n<tr><td>形状补间</td><td>淡绿色 + 黑色箭头</td><td>必须是打散图形</td></tr>\n</tbody>\n</table>\n<p class=\"tip\">提示：补间若出错，时间轴上的实线箭头会变成<b>虚线</b>；打散快捷键 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">B</span>，绘制正圆 / 正方形需按住 <span class=\"kbd\">Shift</span>。</p>\n", "tags": ["帧", "补间", "遮罩", "引导层", "必考"]}, {"id": "fl3", "title": "补间动画（动作/形状补间）", "icon": "🎬", "html": "\n<p class=\"lead\">补间动画只定义对象首帧与末帧的属性，中间变化由系统自动“补”上。动作补间针对元件，形状补间针对打散图形，两者背景与适用对象均不同，是必考易错点。</p>\n<h3 class=\"sub-h\">一、动作补间动画（运动补间）</h3>\n<ol class=\"step-list\">\n<li><strong>导入对象</strong>：执行“文件”→“导入”→“导入到库”，将外部图片（如“摩托车”）拖到舞台左边。</li>\n<li><strong>设末帧</strong>：右键第 10 帧“插入关键帧”，将对象移到舞台右边。</li>\n<li><strong>设补间</strong>：选中第 1 帧，在“属性”面板将“补间”设为“动画”。</li>\n<li><strong>验证</strong>：第 1—10 帧间出现淡蓝色背景与黑色箭头，即生成成功。</li>\n</ol>\n<table class=\"knowledge-table\">\n<thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n<tbody>\n<tr><td>补间类型</td><td>属性面板“补间”→“动画”</td><td>对元件做位移、缩放、旋转、倾斜、颜色与透明度变化</td></tr>\n<tr><td>出错表现</td><td>虚线箭头</td><td>首尾帧对象非元件或属性不匹配</td></tr>\n</tbody>\n</table>\n<h3 class=\"sub-h\">二、形状补间动画</h3>\n<ol class=\"step-list\">\n<li><strong>首帧打散</strong>：第 1 帧插入空白关键帧并输入文字，按 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">B</span> 将文字打散（分离）。</li>\n<li><strong>末帧打散</strong>：第 10 帧插入空白关键帧输入另一文字并同样打散。</li>\n<li><strong>设补间</strong>：选中首尾帧之间，在属性面板将“补间”设为“形状”。</li>\n<li><strong>验证</strong>：出现淡绿色背景与黑色箭头即生成成功。</li>\n</ol>\n<table class=\"knowledge-table\">\n<thead><tr><th>对比项</th><th>动作补间</th><th>形状补间</th></tr></thead>\n<tbody>\n<tr><td>适用对象</td><td>元件（影片剪辑 / 按钮 / 图形）</td><td>打散的图形或文本</td></tr>\n<tr><td>背景颜色</td><td>淡蓝色</td><td>淡绿色</td></tr>\n<tr><td>常用变化</td><td>位置、大小、旋转、透明度、颜色</td><td>形状轮廓过渡渐变</td></tr>\n</tbody>\n</table>\n<p class=\"tip warn\">易错：对实例、位图、文本块创建形状补间前，必须先用 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">B</span> “打散”成图形，否则补间失效。</p>\n", "tags": ["补间", "动作补间", "形状补间", "必考"]}, {"id": "fl4", "title": "引导层、遮罩与发布输出", "icon": "🚀", "html": "\n<p class=\"lead\">引导层让对象沿指定路径运动，遮罩层控制可见形状，ActionScript 控制播放逻辑，发布设置则把源文件导出为可播放的 SWF。三者共同构成 Flash 交互动画的关键。</p>\n<h3 class=\"sub-h\">一、引导层（路径动画）</h3>\n<ol class=\"step-list\">\n<li><strong>绘制对象并转元件</strong>：用椭圆工具画圆，将其转换为元件。</li>\n<li><strong>添加引导层</strong>：为图层“添加引导层”，在引导层上绘制一条抛物线作为引导线。</li>\n<li><strong>对齐路径</strong>：将对象中心吸附到引导线起点与终点。</li>\n<li><strong>创建补间</strong>：在第 45 帧插入关键帧并创建动作补间，对象即沿抛物线运动。</li>\n</ol>\n<p class=\"tip\">提示：引导层在界面中默认隐藏不可见；测试影片快捷键 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">Enter</span>。</p>\n<h3 class=\"sub-h\">二、遮罩动画</h3>\n<ol class=\"step-list\">\n<li><strong>建两层</strong>：图层 1 导入内容，新建图层 2 并在其上绘制形状（如椭圆）。</li>\n<li><strong>延帧与补间</strong>：两图层延长至 50 帧，图层 2 第 50 帧插关键帧并创建补间，将椭圆移出。</li>\n<li><strong>设遮罩</strong>：右键图层 2 选择“遮罩层”，即完成遮罩动画。</li>\n</ol>\n<table class=\"knowledge-table\">\n<thead><tr><th>图层</th><th>作用</th></tr></thead>\n<tbody>\n<tr><td>遮罩层</td><td>决定“看到的形状 / 窗口”</td></tr>\n<tr><td>被遮罩层</td><td>决定“看到的内容”</td></tr>\n</tbody>\n</table>\n<h3 class=\"sub-h\">三、ActionScript 常用动作命令</h3>\n<table class=\"knowledge-table\">\n<thead><tr><th>命令</th><th>功能说明</th></tr></thead>\n<tbody>\n<tr><td>stop()</td><td>暂停当前动画，播放头停在当前帧（常置于末帧使播放完停止）</td></tr>\n<tr><td>play()</td><td>从播放头停止处继续播放</td></tr>\n<tr><td>gotoAndPlay(场景, 帧)</td><td>跳转到指定场景的指定帧并播放</td></tr>\n<tr><td>gotoAndStop(场景, 帧)</td><td>跳转到指定场景的指定帧并停止</td></tr>\n<tr><td>nextFrame() / prevFrame()</td><td>前进 / 后退一帧</td></tr>\n<tr><td>stopAllSounds()</td><td>停止当前所有正在播放的声音</td></tr>\n<tr><td>fscommand(\"quit\")</td><td>关闭放映文件</td></tr>\n<tr><td>getURL()</td><td>打开指定网页</td></tr>\n</tbody>\n</table>\n<p class=\"tip\">按钮元件可响应 onMouseEvent 事件：press（按下）、release（释放，默认）、releaseOutside、rollOver、rollOut、dragOver、dragOut、keyPress。关键帧上无法设置鼠标事件。</p>\n<h3 class=\"sub-h\">四、发布输出</h3>\n<ol class=\"step-list\">\n<li><strong>发布设置</strong>：执行“文件”→“发布设置”，勾选 <span class=\"highlight\">SWF</span> 与 <span class=\"highlight\">HTML</span> 格式。</li>\n<li><strong>测试生成</strong>：按 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">Enter</span> 测试影片，在同目录生成与源文件同名的 <span class=\"highlight\">.swf</span> 文件。</li>\n</ol>\n<p class=\"tip warn\">易错：保存源文件扩展名为 <span class=\"highlight\">.fla</span>，发布后可播放文件为 <span class=\"highlight\">.swf</span>；两者不可混淆。</p>\n", "tags": ["引导层", "遮罩", "发布"]}]}, {"chapter": "第七章 Windows 操作系统", "title": "Windows 核心知识与操作", "cards": [{"id": "win0", "title": "Windows 核心操作速查总表", "icon": "📋", "tags": ["Windows", "速查", "必考"], "html": "\n<p class=\"lead\">Windows 是微软公司研发、目前世界上使用最广泛的图形界面操作系统。本章围绕桌面、窗口、资源管理器、文件操作、控制面板、账户、快捷键与系统工具等模块展开，下表为各模块核心操作与功能说明的总览速查表，便于考前快速回顾。</p>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>软件名称 / 模块</th>\n      <th>核心操作</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>桌面</strong></td>\n      <td>图标、开始按钮、任务栏、通知区</td>\n      <td>桌面是用户与系统交互的主界面，双击图标打开程序，通过“个性化”可设置图标、背景、分辨率与屏幕保护。</td>\n    </tr>\n    <tr>\n      <td><strong>窗口</strong></td>\n      <td>最大化 / 最小化 / 还原 / 关闭 / 移动 / 缩放</td>\n      <td>窗口由标题栏、地址栏、菜单栏、工具栏、工作区、状态栏等组成；<span class=\"kbd\">Alt</span>+<span class=\"kbd\">Tab</span> 切换窗口，双击标题栏最大化。</td>\n    </tr>\n    <tr>\n      <td><strong>资源管理器</strong></td>\n      <td>打开“计算机”/“资源管理器”</td>\n      <td>采用左树形、右内容双窗格管理“桌面、库、计算机、网络”等资源，是系统资源浏览的核心工具。</td>\n    </tr>\n    <tr>\n      <td><strong>文件操作</strong></td>\n      <td>新建 / 重命名 / 复制 / 移动 / 删除 / 属性</td>\n      <td>通过剪贴板（剪切、复制、粘贴）与拖拽完成文件管理；支持通配符“*”“?”搜索，路径与扩展名是定位关键。</td>\n    </tr>\n    <tr>\n      <td><strong>控制面板</strong></td>\n      <td>显示 / 程序 / 时钟语言区域 / 设备打印机</td>\n      <td>集中设置硬件与软件，包括分辨率、卸载程序、日期时间、输入法、打印机、鼠标键盘等。</td>\n    </tr>\n    <tr>\n      <td><strong>账户</strong></td>\n      <td>Administrator / Guests / Users</td>\n      <td>Windows 常见用户组用于权限分配；默认管理员账户为 administrator，切换用户可保留原会话。</td>\n    </tr>\n    <tr>\n      <td><strong>快捷键</strong></td>\n      <td>Win+D/E/R/L/X、Ctrl+Shift+Esc</td>\n      <td>快捷键是高频考点，涉及窗口切换、显示桌面、打开资源管理器、锁定、任务管理等实用技巧。</td>\n    </tr>\n    <tr>\n      <td><strong>系统工具</strong></td>\n      <td>剪贴板 / 回收站 / 启动文件夹</td>\n      <td>剪贴板实现跨程序信息传递；回收站暂存删除文件可还原；启动文件夹实现开机自启。</td>\n    </tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">提示：考试常考“裸机”概念——没有安装操作系统的计算机称为“裸机”，任何软件都必须在操作系统支持下才能运行。</div>\n"}, {"id": "win1", "title": "操作系统概述", "icon": "🪟", "tags": ["操作系统", "特征", "功能", "必考"], "html": "\n<p class=\"lead\">操作系统（OS）是计算机系统中最重要、最基本的系统软件，位于硬件与用户程序之间，是“裸机”上的第一层软件。它向用户提供使用计算机的接口，管理软硬件资源，并通过虚拟技术扩展计算机功能。其他任何软件都必须在操作系统的支持下才能运行。</p>\n\n<h3 class=\"sub-h\">一、操作系统的四大基本特征</h3>\n<ol class=\"step-list\">\n  <li><strong>并发性：</strong>两个或多个事件在同一时间间隔内发生（宏观同时、微观交替）。注意区分“并行性”——同一时刻发生。</li>\n  <li><strong>共享性：</strong>系统中的硬件和软件资源不再为单个程序独占，而由多个并发程序共同使用（如打印机、硬盘）。并发与共享是最基本的两个特征，互为存在条件。</li>\n  <li><strong>虚拟性：</strong>通过某种技术把一个物理实体变成若干个逻辑上对应的实体（如一个硬盘分为多个分区）。</li>\n  <li><strong>异步性：</strong>也称不确定性，程序以“走走停停”的方式运行，运行所需时间不确定。</li>\n</ol>\n\n<h3 class=\"sub-h\">二、操作系统的功能（四大资源管理 + 作业管理）</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>处理器管理</strong></td>\n      <td>进程控制、进程同步、进程通信、处理器调度</td>\n      <td>对处理器的分配与运行实施有效管理，包括进程创建/撤销、协调、通信与调度。</td>\n    </tr>\n    <tr>\n      <td><strong>存储器管理</strong></td>\n      <td>内存分配、内存保护、地址映射、内存扩充</td>\n      <td>对内存分配、保护和扩充，借助虚拟存储技术实现“小内存运行大程序”。</td>\n    </tr>\n    <tr>\n      <td><strong>设备管理</strong></td>\n      <td>缓冲管理、设备分配、设备处理、设备独立性、虚拟设备</td>\n      <td>为用户分配设备，使设备与处理机并行工作，提高 CPU 与设备利用率。</td>\n    </tr>\n    <tr>\n      <td><strong>文件管理</strong></td>\n      <td>存储空间管理、目录管理、文件操作管理、文件保护</td>\n      <td>支持文件的存储、检索、修改，解决共享、保密与保护，提供“按名存取”。</td>\n    </tr>\n    <tr>\n      <td><strong>作业管理及用户接口</strong></td>\n      <td>命令接口（图形接口为其图形化）、程序接口（系统调用）</td>\n      <td>完成用户任务的宏观管理；提供命令接口与程序接口两类用户接口。</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3 class=\"sub-h\">三、常见操作系统</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>DOS</strong></td><td>磁盘操作系统，命令行方式</td><td>早期个人计算机操作系统，采用命令式交互。</td></tr>\n    <tr><td><strong>Windows</strong></td><td>图形用户界面（GUI）</td><td>微软研发，目前世界上使用最广泛的操作系统。</td></tr>\n    <tr><td><strong>UNIX</strong></td><td>多用户、多任务</td><td>由内核 Kernel、外壳 Shell、工具与应用程序组成，支持多种处理器架构。</td></tr>\n    <tr><td><strong>Linux</strong></td><td>源于 UNIX，开源</td><td>可靠、高效、使用成本基本为零，有 32 位与 64 位版本。</td></tr>\n    <tr><td><strong>macOS</strong></td><td>苹果 Macintosh 系列</td><td>运行于苹果电脑的操作系统。</td></tr>\n    <tr><td><strong>Android / 鸿蒙</strong></td><td>移动 / 物联网</td><td>Android 基于 Linux 内核；鸿蒙基于 Linux 开发，可按需扩展用于物联网。</td></tr>\n  </tbody>\n</table>\n\n<h3 class=\"sub-h\">四、启动过程与 BIOS 作用</h3>\n<ol class=\"step-list\">\n  <li><strong>加电自检：</strong>接通电源后 BIOS 执行 POST 程序，检测 CPU、内存、驱动器等硬件。</li>\n  <li><strong>读取引导：</strong>BIOS 读取活动分区主引导记录的启动装载器，并依 CMOS 配置选择启动设备。</li>\n  <li><strong>启动阶段：</strong>分为引导阶段、加载内核阶段、初始化内核阶段、登录系统四个阶段。</li>\n  <li><strong>BIOS 作用：</strong>POST 自检、BIOS 中断服务（软硬接口）、依 CMOS 配置移交 CPU 给操作系统。</li>\n</ol>\n\n<div class=\"tip warning\">易错点：FORTRAN 是高级程序设计语言（应用软件），不属于操作系统；Novell NetWare 是网络操作系统。</div>\n"}, {"id": "win2", "title": "桌面、窗口与资源管理", "icon": "🗂️", "tags": ["桌面", "窗口", "资源管理", "必考"], "html": "\n<p class=\"lead\">Windows 桌面是用户操作的主界面，由图标、开始按钮、任务栏与通知区组成。窗口是应用程序与文档的载体，资源管理器则是浏览与管理磁盘、文件夹、网络等系统资源的核心工具。本节覆盖启动退出、鼠标键盘、桌面元素、窗口组成、对话框与资源管理器。</p>\n\n<h3 class=\"sub-h\">一、系统启动、退出与鼠标键盘</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>冷启动</strong></td><td>切断电脑电源后按 Power 键重启</td><td>内存全部丢失，重新检测硬件并进入 CMOS 后启动系统。</td></tr>\n    <tr><td><strong>热启动</strong></td><td>已加电时按 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">Alt</span>+<span class=\"kbd\">Del</span></td><td>机器运行中异常死机时使用。</td></tr>\n    <tr><td><strong>复位启动</strong></td><td>已开启时按主机箱 Reset 键</td><td>死机且不能接收键盘信息时重新启动。</td></tr>\n    <tr><td><strong>退出方式</strong></td><td>切换用户 / 注销 / 锁定 / 重启 / 睡眠 / 休眠</td><td>睡眠存于内存低功耗不关机；休眠保存会话并关机，二者重激活后均可还原原程序。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">指向</div><div class=\"d\">移动指针并指到项目上，针尖位置即指向位置。</div></div>\n  <div class=\"cell\"><div class=\"t\">单击</div><div class=\"d\">快速按下并释放左键，用于选择项目。</div></div>\n  <div class=\"cell\"><div class=\"t\">双击</div><div class=\"d\">快速按下释放左键两次，通常打开项目或执行程序。</div></div>\n  <div class=\"cell\"><div class=\"t\">拖动</div><div class=\"d\">按住左键移动对象到目的地后松开。</div></div>\n  <div class=\"cell\"><div class=\"t\">右击</div><div class=\"d\">按下释放右键，激活快捷菜单。</div></div>\n</div>\n\n<h3 class=\"sub-h\">二、桌面主要元素与个性化</h3>\n<ol class=\"step-list\">\n  <li><strong>图标：</strong>图形加说明文字，双击快速打开文件、文件夹或应用程序。</li>\n  <li><strong>开始按钮：</strong>即“开始”菜单，大多数程序通过它运行。</li>\n  <li><strong>快捷方式：</strong>扩展名为 .lnk、左下角带箭头；删除不影响原程序，原程序删除会连带删除快捷方式。</li>\n  <li><strong>显示桌面图标：</strong>桌面空白处右击 → “个性化” → “更改桌面图标”，勾选计算机、回收站、用户的文件、控制面板、网络。</li>\n  <li><strong>桌面背景：</strong>又称墙纸，显示方式包括居中、平铺、拉伸（注意无“缩放”方式）。</li>\n  <li><strong>分辨率与屏保：</strong>空白处右击“屏幕分辨率”调整像素数量；屏保可保护信息安全、延长显示器寿命。</li>\n</ol>\n\n<h3 class=\"sub-h\">三、开始菜单、窗口与对话框</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>开始菜单</strong></td><td>单击任务栏最左侧“开始”按钮</td><td>中央控制区，可启动程序、搜索、设置、注销、关机、睡眠、锁定。</td></tr>\n    <tr><td><strong>窗口组成</strong></td><td>标题栏、地址栏、搜索栏、菜单栏、工具栏、导航窗格、工作区、状态栏、边框、滚动条</td><td>标题栏变蓝为活动窗口（可接收输入），变灰为非活动；同一时刻仅一个活动窗口。</td></tr>\n    <tr><td><strong>窗口操作</strong></td><td>最小化 / 最大化 / 还原 / 关闭；拖动边框缩放；双击标题栏最大化</td><td>最小化后程序后台继续运行；“还原”仅最大化后才可用。</td></tr>\n    <tr><td><strong>对话框</strong></td><td>含单选按钮、复选框、命令按钮、文本框</td><td>通常无最大化/最小化；分模式（关闭前不能切窗）与非模式（可切换）对话框。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">菜单标记含义：“▶”表示有下级菜单；“…”表示打开对话框；“√”为复选选中；“●”为单选；灰色项为当前不可用。</div>\n\n<h3 class=\"sub-h\">四、资源管理器</h3>\n<ol class=\"step-list\">\n  <li><strong>打开方式：</strong>右击“开始”按钮选“打开 Windows 资源管理器”；或“开始”→“计算机”；或任务栏资源管理器按钮。</li>\n  <li><strong>双窗格结构：</strong>左窗格为树形控件（根、节点、子节点），右窗格显示内容。</li>\n  <li><strong>展开/收缩：</strong>含下级子节点的前面有空心三角，单击三角展开（变实心），再次单击收缩。</li>\n</ol>\n"}, {"id": "win3", "title": "文件与文件夹操作", "icon": "📁", "tags": ["文件", "文件夹", "路径", "必考"], "html": "\n<p class=\"lead\">文件（File）是存放在外存储器上的一组相关信息的集合，文件名由“主文件名.扩展名”组成，是操作系统区分不同文件的唯一标志；文件夹用于分类组织存放文件。本节覆盖命名规则、选定、新建、复制/移动、删除、重命名、属性、搜索、路径、剪贴板与回收站等高频操作。</p>\n\n<h3 class=\"sub-h\">一、文件命名规则与路径</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>主文件名</strong></td><td>由 1 至多个字符组成，最多 255 个字符</td><td>开头不可以使用空格；不能大小写区分（如 ABC.DOC 与 abc.doc 视为同一文件）。</td></tr>\n    <tr><td><strong>扩展名</strong></td><td>与主名用英文句号分隔</td><td>表示文件类型，系统据此建立应用关联；默认隐藏已知类型扩展名。</td></tr>\n    <tr><td><strong>禁用字符</strong></td><td>文件名中不能使用 \\ / : * ? \" &lt; &gt; | 等</td><td>同一路径下不允许两个相同文件名。</td></tr>\n    <tr><td><strong>路径</strong></td><td>地址栏显示当前所在位置</td><td>通过“计算机”逐级双击进入驱动器、文件夹、文件。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip warning\">通配符：“*”代表所在位置任意长字符串；“?”代表所在位置上一个任意字符。搜索时可在搜索框按“修改日期”“大小”筛选。</div>\n\n<h3 class=\"sub-h\">二、选定与基本操作</h3>\n<ol class=\"step-list\">\n  <li><strong>选定单个：</strong>单击文件/文件夹，变为蓝色即被选定。</li>\n  <li><strong>连续选定：</strong>单击首项，按住 <span class=\"kbd\">Shift</span> 单击末项，选中连续区域。</li>\n  <li><strong>不连续选定：</strong>按住 <span class=\"kbd\">Ctrl</span> 依次单击各项；再次单击已选项可取消。</li>\n  <li><strong>全部选定：</strong>“编辑”→“全选”或按 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">A</span>；空白处单击取消所有选定。</li>\n  <li><strong>新建文件夹/文件：</strong>空白处右击 → “新建” → “文件夹”或已注册类型文件（如记事本建 .txt）。</li>\n  <li><strong>重命名：</strong>右击选“重命名”或连续两次单击名称，输入新名；扩展名需在“文件夹选项→查看”取消“隐藏已知文件类型的扩展名”。</li>\n</ol>\n\n<h3 class=\"sub-h\">三、复制、移动、删除与属性</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>复制</strong></td><td><span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">C</span> 复制，<span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">V</span> 粘贴；或同盘按住 Ctrl 拖拽</td><td>源文件保留；不同盘直接拖拽即复制。</td></tr>\n    <tr><td><strong>移动</strong></td><td><span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">X</span> 剪切后再粘贴；或不同盘按住 Shift 拖拽</td><td>源位置文件被移除；同盘直接拖拽即移动。</td></tr>\n    <tr><td><strong>删除</strong></td><td>右击“删除”移到回收站；按住 <span class=\"kbd\">Shift</span>+删除为物理删除</td><td>逻辑删除可还原；物理删除（含 U 盘文件）一般不恢复。</td></tr>\n    <tr><td><strong>属性</strong></td><td>右击“属性”设置只读、隐藏、高级（存档/索引/压缩/加密）</td><td>隐藏后在默认设置下不显示；只读后不能修改内容；用户文件默认仅“存档”。</td></tr>\n  </tbody>\n</table>\n\n<h3 class=\"sub-h\">四、剪贴板、回收站与启动文件夹</h3>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">剪贴板</div><div class=\"d\">内存中临时存储区，作为信息传递桥梁；支持剪切、复制、粘贴。</div></div>\n  <div class=\"cell\"><div class=\"t\">回收站</div><div class=\"d\">硬盘上的系统文件夹，暂存删除文件；可“还原”“删除”“清空”，不可删本身。</div></div>\n  <div class=\"cell\"><div class=\"t\">启动文件夹</div><div class=\"d\">“开始→所有程序→启动”放入程序可实现开机自动启动。</div></div>\n  <div class=\"cell\"><div class=\"t\">PrintScreen</div><div class=\"d\">整屏复制到剪贴板；<span class=\"kbd\">Alt</span>+<span class=\"kbd\">PrintScreen</span> 仅复制当前活动窗口。</div></div>\n</div>\n\n<div class=\"tip info\">回收站只存放硬盘上被删除的文件/文件夹与快捷方式；从 U 盘删除、或 Shift+删除、或设置“不移到回收站”的文件将直接删除，一般不可恢复。</div>\n"}, {"id": "win4", "title": "控制面板与系统设置", "icon": "⚙️", "tags": ["控制面板", "设置", "账户", "必考"], "html": "\n<p class=\"lead\">控制面板是 Windows 实用工具的集合，用于更改系统外观与功能、对软硬件进行设置。本节覆盖显示设置、字体与输入法、程序安装卸载、打印机、鼠标键盘、用户与用户组、工作组及口令策略等考试要点。</p>\n\n<h3 class=\"sub-h\">一、显示与字体输入法</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>显示</strong></td><td>控制面板→“显示”</td><td>调整分辨率、亮度、桌面背景、屏幕保护、配色方案；背景位置含填充、适应、拉伸、平铺、居中。</td></tr>\n    <tr><td><strong>字体</strong></td><td>“字体”工具预览/删除/显示隐藏</td><td>ClearType 技术改善 LCD 文本可读性，使屏幕文字如打印般清晰。</td></tr>\n    <tr><td><strong>输入法</strong></td><td>“时钟、语言和区域”→“更改键盘或其他输入法”→“更改键盘”→添加</td><td>在“文本服务和输入语言”中添加所需输入法并确定。</td></tr>\n  </tbody>\n</table>\n\n<h3 class=\"sub-h\">二、程序、设备与时钟区域</h3>\n<ol class=\"step-list\">\n  <li><strong>安装/卸载程序：</strong>控制面板→“程序”→“程序和功能”，可更改或删除程序、添加新程序、添加/删除 Windows 组件。</li>\n  <li><strong>添加打印机：</strong>“设备和打印机”中运行安装向导，可添加、设默认打印机、取消文档打印。</li>\n  <li><strong>鼠标设置：</strong>“鼠标属性”可改指针方案、按钮定义、光标速度与加速度、驱动程序。</li>\n  <li><strong>键盘设置：</strong>“键盘属性”可改重复延迟、重复速率、光标闪烁速度、输入法区域与驱动。</li>\n  <li><strong>时钟、语言和区域：</strong>更改时间、日期、时区、语言及货币/日期/时间的显示方式。</li>\n</ol>\n\n<h3 class=\"sub-h\">三、用户、用户组与工作组</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>Administrator</strong></td><td>管理员组</td><td>拥有对计算机最大控制权限，可执行整台机器的管理任务；内置账户无法从该组删除。</td></tr>\n    <tr><td><strong>Guests</strong></td><td>来宾用户组</td><td>供无账户但需访问本地资源的用户，无法永久改变桌面环境；默认成员 Guest。</td></tr>\n    <tr><td><strong>Users</strong></td><td>普通用户组</td><td>仅可运行应用程序，不能修改系统设置、改他人数据、关闭服务器级计算机。</td></tr>\n    <tr><td><strong>工作组</strong></td><td>workgroup（默认）</td><td>简单灵活的资源管理模式，适合小规模、管理要求不严的网络；缺乏集中账户管理与安全控制。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip success\">切换用户：存在两个及以上用户时，通过“开始→注销→切换用户”回到欢迎界面，保留原用户操作进入其他账户，无需关闭正在运行的程序。</div>\n\n<h3 class=\"sub-h\">四、口令（密码）设置原则</h3>\n<ol class=\"step-list\">\n  <li><strong>不能包含：</strong>用户的账户名，以及用户姓名中超过两个连续字符的部分。</li>\n  <li><strong>长度要求：</strong>至少六个字符长。</li>\n  <li><strong>复杂度要求：</strong>包含大写字母、小写字母、数字、非字母字符（如 ! @ # %）四类中的至少三类。</li>\n</ol>\n"}, {"id": "win5", "title": "常用快捷键与实用技巧", "icon": "⌨️", "tags": ["快捷键", "技巧", "必考"], "html": "\n<p class=\"lead\">快捷键是 Windows 操作考试的高频考点，能显著提升操作效率。本节汇总窗口管理、程序控制、剪贴板、输入法切换及系统工具类快捷键，并补充若干实用技巧，帮助快速定位与操作。</p>\n\n<h3 class=\"sub-h\">一、窗口与系统快捷键</h3>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr>\n      <th>操作项</th>\n      <th>操作步骤</th>\n      <th>功能说明</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>Alt+Tab</strong></td><td>按住 Alt 反复按 Tab</td><td>调出窗口缩略图，在多个窗口间切换。</td></tr>\n    <tr><td><strong>Win+Tab</strong></td><td>按 Win 再按 Tab</td><td>以三维/时间线方式切换窗口（视系统版本）。</td></tr>\n    <tr><td><strong>Win+D</strong></td><td>按 Windows 徽标键 + D</td><td>显示桌面 / 最小化所有窗口（再按恢复）。</td></tr>\n    <tr><td><strong>Win+E</strong></td><td>按 Windows 徽标键 + E</td><td>打开“计算机”/资源管理器浏览文件。</td></tr>\n    <tr><td><strong>Win+R</strong></td><td>按 Windows 徽标键 + R</td><td>打开“运行”对话框，输入命令启动程序。</td></tr>\n    <tr><td><strong>Win+L</strong></td><td>按 Windows 徽标键 + L</td><td>锁定计算机，需重新输入密码登录。</td></tr>\n    <tr><td><strong>Win+X</strong></td><td>按 Windows 徽标键 + X</td><td>打开高级用户菜单 / Windows 移动中心。</td></tr>\n    <tr><td><strong>Ctrl+Shift+Esc</strong></td><td>同时按下</td><td>直接打开任务管理器。</td></tr>\n    <tr><td><strong>Ctrl+Alt+Del</strong></td><td>同时按下</td><td>打开安全选项（可启任务管理器、锁定、切换用户等）。</td></tr>\n    <tr><td><strong>Alt+F4</strong></td><td>按 Alt + F4</td><td>关闭当前运行的程序或窗口。</td></tr>\n  </tbody>\n</table>\n\n<h3 class=\"sub-h\">二、编辑与输入法快捷键</h3>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">Ctrl+C / X / V</div><div class=\"d\">复制 / 剪切 / 粘贴。</div></div>\n  <div class=\"cell\"><div class=\"t\">Ctrl+Z</div><div class=\"d\">撤销上一步操作。</div></div>\n  <div class=\"cell\"><div class=\"t\">Ctrl+S</div><div class=\"d\">保存当前文档。</div></div>\n  <div class=\"cell\"><div class=\"t\">Ctrl+A</div><div class=\"d\">全选当前内容。</div></div>\n  <div class=\"cell\"><div class=\"t\">Ctrl+Esc</div><div class=\"d\">打开“开始”菜单。</div></div>\n  <div class=\"cell\"><div class=\"t\">Ctrl+空格</div><div class=\"d\">中英文输入法之间切换。</div></div>\n  <div class=\"cell\"><div class=\"t\">Ctrl+Shift</div><div class=\"d\">各种中文输入法之间切换。</div></div>\n  <div class=\"cell\"><div class=\"t\">Shift+空格</div><div class=\"d\">全角 / 半角之间切换。</div></div>\n  <div class=\"cell\"><div class=\"t\">CapsLock</div><div class=\"d\">大写字母锁定（非中文状态下输入大写）。</div></div>\n  <div class=\"cell\"><div class=\"t\">Alt+空格</div><div class=\"d\">打开当前窗口的控制菜单（移动、大小、关闭等）。</div></div>\n  <div class=\"cell\"><div class=\"t\">PrintScreen</div><div class=\"d\">将整个屏幕复制到剪贴板。</div></div>\n  <div class=\"cell\"><div class=\"t\">Alt+PrintScreen</div><div class=\"d\">将当前活动窗口复制到剪贴板。</div></div>\n</div>\n\n<div class=\"tip warning\">易错辨析：多种中文输入法之间切换用 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">Shift</span>；中英文之间切换用 <span class=\"kbd\">Ctrl</span>+<span class=\"kbd\">空格</span>；全角/半角切换用 <span class=\"kbd\">Shift</span>+<span class=\"kbd\">空格</span>。</div>\n\n<h3 class=\"sub-h\">三、实用技巧</h3>\n<ol class=\"step-list\">\n  <li><strong>快速定位：</strong>Win+E 直达资源管理器，配合地址栏输入路径快速跳转。</li>\n  <li><strong>批量重命名：</strong>选定多个文件后按 F2，可统一加序号批量命名。</li>\n  <li><strong>显示扩展名：</strong>文件夹选项→查看→取消“隐藏已知文件类型的扩展名”，便于修改类型。</li>\n  <li><strong>开机自启：</strong>将程序快捷方式放入“开始→所有程序→启动”文件夹。</li>\n  <li><strong>高效删除：</strong>Shift+Delete 直接物理删除，跳过回收站（慎用）。</li>\n</ol>\n"}]}], "quizzes": [{"section": 0, "stem": "Word 2010文件扩展名是( ) 。", "options": ["docx", "doc", "xt", "ppt"], "answer": 0, "analysis": "本题考查Word 2010扩展名。Word 2007及以后的版本使用的扩展"}, {"section": 0, "stem": "在Word中 , 可以同时显示水平和垂直标尺的视图是( ) 。", "options": ["页面", "大纲", "Web版式", "普通"], "answer": 0, "analysis": "本题考查Word常见视图。大纲视图不显示标尺内容 , 所以项不"}, {"section": 0, "stem": "利用Word的“查找和替换“命令不能完成的操作是( ) 。", "options": ["查找和替换多次重复的汉字", "查找文本并替换文本中的格式", "查找并替换图形对象", "查找和替换多次重复的英文"], "answer": 2, "analysis": "本题考查Word中的替换和查找。Word的“查找“和“督换“和令"}, {"section": 0, "stem": "下面文档中没有用到的对象是( ) 。\n\nnnan nn nn\nE\nnneen\nE\nseera-\n\nrn\n。 E\nnn w\nr s\ncesooee nnes a\n\nerinesentneueioee ieerooreey\nnneravuonramaris tioramatcrmeae\nE命", "options": ["艺术字", "动画", "自选图形", "图片"], "answer": 1, "analysis": "本题考查Word元素。图中用到了艺术字、自选图形四角星、图"}, {"section": 0, "stem": "在Word的表格操作中 , 当前插入点在表格中某行的最后一个单元格内 , 在未设定固定\n行高时敦回车键 , 则( ) 。", "options": ["插入点所在的列变宽", "插入点所在的行变高", "在插入点下行增加一空表格行", "对表格不起作用"], "answer": 1, "analysis": ": 本题考查Word中表格操作。当前插入点在表格中某行的最后一个"}, {"section": 0, "stem": "使用Word编辑文档中的表格时 , 下列操作不能实现的是( ) 。", "options": ["在表格中插入列", "在表格中插入行", "对表格数据分类汇总", "合并单元格"], "answer": 2, "analysis": ": 本题考查Word中表格的操作。Word中编辑表格时 , 可以插"}, {"section": 0, "stem": "在 Word 中，具有“所见即所得”效果的视图方式是（ ）。", "options": ["页面视图", "大纲视图 // ============ 应用状态 ============
const STATE = {
  currentSection: 0,
  currentTab: 'read',
  currentQuizIndex: 0,
  quizAnswers: {},       // {qIndex: selectedOptionIndex}
  quizSubmitted: {},     // {qIndex: true}
  doneSections: new Set(),
  bookmarks: new Set(),
  errorQuestions: new Set(),
  openChapters: new Set(['第一章 文字处理软件 Word']),
  theme: 'light',
  searchQuery: ''
};

// ============ 初始化 ============
function init() {
  loadState();
  renderSidebar();
  renderContent();
  updateProgress();
  updateErrorCount();
  var qb = document.getElementById('quizBadge');
  if (qb) qb.textContent = (KB_DATA.quizzes ? KB_DATA.quizzes.length : 0) + '题';
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('infotech_soft_kb_state') || '{}');
    if (saved.doneSections) STATE.doneSections = new Set(saved.doneSections);
    if (saved.bookmarks) STATE.bookmarks = new Set(saved.bookmarks);
    if (saved.errorQuestions) STATE.errorQuestions = new Set(saved.errorQuestions);
    if (saved.openChapters) STATE.openChapters = new Set(saved.openChapters);
    if (saved.theme) STATE.theme = saved.theme;
    if (saved.quizAnswers) STATE.quizAnswers = saved.quizAnswers;
    if (saved.quizSubmitted) STATE.quizSubmitted = saved.quizSubmitted;
  } catch(e) {}
  applyTheme();
}

function saveState() {
  localStorage.setItem('infotech_soft_kb_state', JSON.stringify({
    doneSections: [...STATE.doneSections],
    bookmarks: [...STATE.bookmarks],
    errorQuestions: [...STATE.errorQuestions],
    openChapters: [...STATE.openChapters],
    theme: STATE.theme,
    quizAnswers: STATE.quizAnswers,
    quizSubmitted: STATE.quizSubmitted
  }));
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', STATE.theme);
  document.getElementById('themeIcon').textContent = STATE.theme === 'dark' ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = STATE.theme === 'dark' ? '亮色模式' : '暗色模式';
}

// ============ 侧边栏 ============
function getChapterGroups() {
  // Group sections by chapter
  const groups = {};
  KB_DATA.sections.forEach((s, si) => {
    const ch = s.chapter || '其他';
    if (!groups[ch]) groups[ch] = [];
    groups[ch].push({section: s, si: si});
  });
  return groups;
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = '';
  const groups = getChapterGroups();
  Object.keys(groups).forEach((chName) => {
    const items = groups[chName];
    const isOpen = STATE.openChapters.has(chName);
    const chDone = items.filter(it => STATE.doneSections.has(it.si)).length;
    html += '<div class="chapter-group">';
    html += `<button class="chapter-title ${isOpen ? 'open' : ''}" onclick="toggleChapter('${chName.replace(/'/g, "\\'")}')">`;
    html += `<span class="arrow">▶</span>${chName}`;
    html += `<span class="count">${chDone}/${items.length}节</span>`;
    html += '</button>';
    html += `<div class="section-list ${isOpen ? 'open' : ''}" id="sectionList-${chName}">`;
    items.forEach(({section, si}) => {
      const isActive = si === STATE.currentSection;
      const isDone = STATE.doneSections.has(si);
      const quizCount = KB_DATA.quizzes.filter(q => q.section === si).length;
      html += `<div class="section-row ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectSection(${si})">`;
      html += `<span class="check">${isDone ? '✓' : ''}</span>`;
      html += `<span class="section-title">${section.title}</span>`;
      html += `<button class="mini-quiz-btn" onclick="event.stopPropagation();selectSectionAndQuiz(${si})" title="本节练习(${quizCount}题)">📝${quizCount}</button>`;
      html += '</div>';
    });
    html += '</div></div>';
  });
  nav.innerHTML = html;
}

function toggleChapter(chName) {
  if (STATE.openChapters.has(chName)) {
    STATE.openChapters.delete(chName);
  } else {
    STATE.openChapters.add(chName);
  }
  renderSidebar();
}

function selectSection(si) {
  STATE.currentSection = si;
  STATE.currentTab = 'read';
  // Auto-expand the chapter containing this section
  const sec = KB_DATA.sections[si];
  if (sec && sec.chapter) STATE.openChapters.add(sec.chapter);
  switchTab('read');
  renderSidebar();
  renderContent();
  document.getElementById('sidebar').classList.remove('open');
}

function selectSectionAndQuiz(si) {
  STATE.currentSection = si;
  STATE.currentTab = 'quiz';
  const sec = KB_DATA.sections[si];
  if (sec && sec.chapter) STATE.openChapters.add(sec.chapter);
  // Find first quiz question index for this section
  const firstQ = KB_DATA.quizzes.findIndex(q => q.section === si);
  if (firstQ >= 0) STATE.currentQuizIndex = firstQ;
  switchTab('quiz');
  renderSidebar();
  renderContent();
  document.getElementById('sidebar').classList.remove('open');
}

// ============ 标签页切换 ============
function switchTab(tab) {
  STATE.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
  document.getElementById('readContent').style.display = tab === 'read' ? 'block' : 'none';
  document.getElementById('quizContent').style.display = tab === 'quiz' ? 'block' : 'none';
  document.getElementById('bookmarksContent').style.display = tab === 'bookmarks' ? 'block' : 'none';
  document.getElementById('errorsContent').style.display = tab === 'errors' ? 'block' : 'none';
  renderContent();
  if (tab === 'read') document.getElementById('searchInput').value = STATE.searchQuery;
}

// ============ 内容渲染 ============
function renderContent() {
  if (STATE.currentTab === 'read' || STATE.currentTab === 'bookmarks' || STATE.currentTab === 'errors') {
    renderReadContent();
  }
  if (STATE.currentTab === 'quiz') {
    renderQuizContent();
  }
  document.getElementById('breadcrumbCurrent').textContent = (KB_DATA.sections[STATE.currentSection]?.chapter || '') +
    (KB_DATA.sections[STATE.currentSection] ? ' › ' : '') + (KB_DATA.sections[STATE.currentSection]?.title || '第一章');
}

function renderReadContent() {
  const container = document.getElementById('readContent');
  const section = KB_DATA.sections[STATE.currentSection];
  let cards = section.cards;

  // Handle bookmarks tab
  if (STATE.currentTab === 'bookmarks') {
    const allCards = KB_DATA.sections.flatMap((s, si) => s.cards.map(c => ({...c, sectionIdx: si, sectionTitle: s.title})));
    cards = allCards.filter(c => STATE.bookmarks.has(c.id));
    if (cards.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">⭐</div><h3>暂无收藏</h3><p>点击知识卡片下方的"收藏"按钮来添加</p></div>';
      container.style.display = 'block';
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('bookmarksContent').style.display = 'block';
      document.getElementById('errorsContent').style.display = 'none';
      return;
    }
    document.getElementById('readContent').style.display = 'block';
    document.getElementById('quizContent').style.display = 'none';
    document.getElementById('bookmarksContent').style.display = 'block';
    document.getElementById('errorsContent').style.display = 'none';

    let html = `<div class="section-header"><h2>⭐ 我的收藏</h2><div class="meta">共 ${cards.length} 个收藏</div></div>`;
    cards.forEach(c => {
      html += renderCard(c, true);
    });
    container.innerHTML = html;
    return;
  }

  // Handle errors tab
  if (STATE.currentTab === 'errors') {
    const errorQuizList = KB_DATA.quizzes.filter((_, i) => STATE.errorQuestions.has(i));
    if (errorQuizList.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">📝</div><h3>暂无错题</h3><p>做错的题目会自动收入错题本</p></div>';
      document.getElementById('readContent').style.display = 'block';
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('bookmarksContent').style.display = 'none';
      document.getElementById('errorsContent').style.display = 'block';
      return;
    }
    document.getElementById('readContent').style.display = 'block';
    document.getElementById('quizContent').style.display = 'none';
    document.getElementById('bookmarksContent').style.display = 'none';
    document.getElementById('errorsContent').style.display = 'block';

    let html = `<div class="section-header"><h2>📝 错题本</h2><div class="meta">共 ${errorQuizList.length} 道错题</div></div>`;
    errorQuizList.forEach((q, idx) => {
      const qi = KB_DATA.quizzes.indexOf(q);
      html += renderErrorQuiz(q, qi, idx + 1);
    });
    container.innerHTML = html;
    return;
  }

  // Normal read mode
  document.getElementById('readContent').style.display = 'block';
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('bookmarksContent').style.display = 'none';
  document.getElementById('errorsContent').style.display = 'none';

  let html = `<div class="section-header">`;
  html += `<h2>${section.title}</h2>`;
  html += `<div class="meta">`;
  html += `<span>📄 ${section.cards.length} 个知识点</span>`;
  html += `<span>📝 ${KB_DATA.quizzes.filter(q => q.section === STATE.currentSection).length} 道练习题</span>`;
  html += `</div></div>`;

  let filteredCards = cards;
  if (STATE.searchQuery) {
    const q = STATE.searchQuery.toLowerCase();
    filteredCards = cards.filter(c => {
      const text = c.title + c.html.replace(/<[^>]*>/g, '');
      return text.toLowerCase().includes(q);
    });
    if (filteredCards.length === 0) {
      html += '<div class="empty-state"><div class="icon">🔍</div><h3>未找到匹配的知识点</h3><p>试试其他关键词</p></div>';
    }
  }

  filteredCards.forEach(c => {
    html += renderCard(c);
  });

  html += `<div style="text-align:center;margin-top:24px">`;
  html += `<button class="btn btn-primary" onclick="markSectionDone(${STATE.currentSection})" ${STATE.doneSections.has(STATE.currentSection) ? 'disabled' : ''}>`;
  html += STATE.doneSections.has(STATE.currentSection) ? '✅ 已学完本节' : '✓ 标记本节为已学';
  html += '</button>';
  html += '</div>';

  container.innerHTML = html;
}

function renderCard(card, showSection = false) {
  let html = `<div class="knowledge-card" id="card-${card.id}">`;
  html += `<h3><span class="icon">${card.icon}</span>${card.title}</h3>`;
  if (showSection && card.sectionTitle) {
    html += `<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">📂 ${card.sectionTitle}</div>`;
  }
  html += card.html;
  if (card.tags) {
    html += '<div class="tag-row">';
    card.tags.forEach(t => {
      html += `<span class="tag">${t}</span>`;
    });
    html += '</div>';
  }
  html += `<div class="card-actions">`;
  html += `<button class="card-action-btn ${STATE.bookmarks.has(card.id) ? 'bookmarked':''}" onclick="toggleBookmark('${card.id}')">`;
  html += STATE.bookmarks.has(card.id) ? '⭐ 已收藏' : '☆ 收藏';
  html += '</button>';
  html += '</div></div>';
  return html;
}

function renderErrorQuiz(q, qi, num) {
  const sectionTitle = KB_DATA.sections[q.section]?.title || '';
  const labels = ['A','B','C','D'];
  const isMulti = q.type === 'multi';
  let html = `<div class="quiz-container">`;
  html += `<div class="quiz-header"><span class="quiz-section-label">${sectionTitle}</span><span style="font-size:12px;color:var(--text-muted)">#${num}</span></div>`;
  html += `<div class="quiz-question">${qi + 1}. ${q.stem}</div>`;
  html += `<div class="quiz-options">`;
  q.options.forEach((opt, oi) => {
    let cls = '';
    if ((isMulti && q.answer.includes(oi)) || (!isMulti && oi === q.answer)) cls = 'correct';
    html += `<div class="quiz-option ${cls}"><span class="option-letter">${labels[oi]}</span>${opt}</div>`;
  });
  html += '</div>';
  html += `<div class="analysis-box show">${q.analysis}</div>`;
  html += `<div class="quiz-actions">`;
  html += `<button class="btn btn-outline" onclick="removeError(${qi})">✓ 已掌握，移除</button>`;
  html += '</div></div>';
  return html;
}

  let html = '<div class="section-header">';
  html += `<h2>${KB_DATA.sections[STATE.currentSection].title} · 章节练习</h2>`;
  html += `<div class="meta"><span>第 ${localIdx + 1}/${sectionTotal} 题</span></div>`;
  html += '</div>';

  html += '<div class="quiz-container">';
  html += `<div class="quiz-question">${qi + 1}. ${q.stem}${isMulti ? ' <span style="color:var(--accent);font-size:13px">（多选）</span>' : ''}</div>`;
  html += '<div class="quiz-options">';
  q.options.forEach((opt, oi) => {
    const isSel = isMulti ? (Array.isArray(selected) && selected.includes(oi)) : (selected === oi);
    let cls = '';
    if (submitted) {
      if ((isMulti && q.answer.includes(oi)) || (!isMulti && oi === q.answer)) cls = 'correct';
      else if (isSel) cls = 'wrong';
    } else if (isSel) {
      cls = 'selected';
    }
    html += `<div class="quiz-option ${cls}" onclick="selectOption(${qi}, ${oi})">`;
    html += `<span class="option-letter">${labels[oi]}</span>${opt}`;
    html += '</div>';
  });
  html += '</div>';

  // Analysis
  html += `<div class="analysis-box ${submitted ? 'show' : ''}" id="analysis${qi}">${q.analysis}</div>`;

  // Actions
  html += '<div class="quiz-actions">';
  if (!submitted) {
    const hasAns = isMulti ? (Array.isArray(selected) && selected.length > 0) : (selected !== undefined);
    html += `<button class="btn btn-primary" onclick="submitAnswer(${qi})" ${hasAns ? '' : 'disabled'}>确认提交</button>`;
  }
  html += `<button class="btn btn-outline" onclick="prevQuiz()">上一题</button>`;
  html += `<button class="btn btn-outline" onclick="nextQuiz()">下一题</button>`;
  if (STATE.errorQuestions.has(qi)) {
    html += `<button class="btn btn-outline" style="color:var(--danger)" onclick="removeError(${qi})">从错题本移除</button>`;
  }
  html += '</div>';
  html += '</div>';

  // Dots navigation
  html += '<div class="quiz-nav">';
  sectionQuizzes.forEach((sq, idx) => {
    const qi2 = KB_DATA.quizzes.indexOf(sq);
    let dotCls = '';
    if (idx === localIdx) dotCls += ' current';
    if (STATE.quizSubmitted[qi2]) {
      dotCls += isCorrect(sq, STATE.quizAnswers[qi2]) ? ' correct-dot' : ' wrong-dot';
    }
    html += `<button class="quiz-nav-dot ${dotCls}" onclick="goToQuestion(${qi2})">${idx + 1}</button>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

function renderQuizResult(q, qi, num) {
  const labels = ['A','B','C','D'];
  const isMulti = q.type === 'multi';
  const submitted = STATE.quizSubmitted[qi];
  const selected = STATE.quizAnswers[qi];
  const correct = submitted && isCorrect(q, selected);

  let html = '<div class="quiz-container">';
  html += `<div class="quiz-header"><span class="quiz-section-label" style="background:${correct ? 'var(--success-light)' : 'var(--danger-light)'};color:${correct ? 'var(--success)' : 'var(--danger)'}">${correct ? '✓ 正确' : '✗ 错误'}</span><span style="font-size:12px;color:var(--text-muted)">#${num}</span></div>`;
  html += `<div class="quiz-question">${qi + 1}. ${q.stem}${isMulti ? ' <span style="color:var(--accent);font-size:13px">（多选）</span>' : ''}</div>`;
  html += '<div class="quiz-options">';
  q.options.forEach((opt, oi) => {
    let cls = '';
    if ((isMulti && q.answer.includes(oi)) || (!isMulti && oi === q.answer)) cls = 'correct';
    else if (oi === selected && oi !== q.answer) cls = 'wrong';
    html += `<div class="quiz-option ${cls}"><span class="option-letter">${labels[oi]}</span>${opt}</div>`;
  });
  html += '</div>';
  html += `<div class="analysis-box show">${q.analysis}</div>`;
  html += '</div>';
  return html;
}

// ============ 练习操作 ============
function isCorrect(q, ans) {
  if (q.type === 'multi') {
    if (!Array.isArray(ans)) return false;
    const a = [...ans].sort((x, y) => x - y);
    const b = [...(q.answer || [])].sort((x, y) => x - y);
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }
  return ans === q.answer;
}

function selectOption(qi, oi) {
  if (STATE.quizSubmitted[qi]) return;
  const q = KB_DATA.quizzes[qi];
  if (q.type === 'multi') {
    if (!Array.isArray(STATE.quizAnswers[qi])) STATE.quizAnswers[qi] = [];
    const arr = STATE.quizAnswers[qi];
    const pos = arr.indexOf(oi);
    if (pos >= 0) arr.splice(pos, 1); else arr.push(oi);
    arr.sort((x, y) => x - y);
  } else {
    STATE.quizAnswers[qi] = oi;
  }
  saveState();
  renderQuizContent();
}

function submitAnswer(qi) {
  const q = KB_DATA.quizzes[qi];
  if (q.type === 'multi') {
    if (!Array.isArray(STATE.quizAnswers[qi]) || STATE.quizAnswers[qi].length === 0) return;
  } else {
    if (STATE.quizAnswers[qi] === undefined) return;
  }
  STATE.quizSubmitted[qi] = true;
  if (!isCorrect(q, STATE.quizAnswers[qi])) {
    STATE.errorQuestions.add(qi);
  }
  saveState();
  updateErrorCount();
  renderQuizContent();
}

function findLastSectionQuizIdx(sectionIdx) {
  let last = -1;
  for (let i = 0; i < KB_DATA.quizzes.length; i++) {
    if (KB_DATA.quizzes[i].section === sectionIdx) last = i;
  }
  return last;
}

function prevQuiz() {
  const sectionStart = KB_DATA.quizzes.findIndex(q => q.section === STATE.currentSection);
  const sectionEnd = findLastSectionQuizIdx(STATE.currentSection);
  if (STATE.currentQuizIndex > sectionStart) {
    STATE.currentQuizIndex--;
  }
  renderQuizContent();
}

function nextQuiz() {
  const sectionEnd = findLastSectionQuizIdx(STATE.currentSection);
  if (STATE.currentQuizIndex < sectionEnd) {
    STATE.currentQuizIndex++;
  }
  renderQuizContent();
}

function goToQuestion(qi) {
  STATE.currentQuizIndex = qi;
  renderQuizContent();
}

function resetSectionQuiz() {
  const sectionQuizzes = KB_DATA.quizzes.filter(q => q.section === STATE.currentSection);
  sectionQuizzes.forEach(q => {
    const qi = KB_DATA.quizzes.indexOf(q);
    delete STATE.quizAnswers[qi];
    delete STATE.quizSubmitted[qi];
     STATE.errorQuestions.delete(qi);
  });
  const firstQ = KB_DATA.quizzes.findIndex(q => q.section === STATE.currentSection);
  STATE.currentQuizIndex = firstQ >= 0 ? firstQ : 0;
  saveState();
  updateErrorCount();
  renderQuizContent();
}

function reviewSectionErrors() {
  // Switch to errors tab
  STATE.currentTab = 'errors';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('errorsTab').classList.add('active');
  document.getElementById('errorsTab').style.display = '';
  document.getElementById('readContent').style.display = 'block';
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('bookmarksContent').style.display = 'none';
  document.getElementById('errorsContent').style.display = 'block';
  renderContent();
}

function removeError(qi) {
  STATE.errorQuestions.delete(qi);
  saveState();
  updateErrorCount();
  if (STATE.currentTab === 'errors') renderContent();
  if (STATE.currentTab === 'quiz') renderQuizContent();
}

// ============ 收藏 ============
function toggleBookmark(cardId) {
  if (STATE.bookmarks.has(cardId)) {
    STATE.bookmarks.delete(cardId);
    showToast('已取消收藏');
  } else {
    STATE.bookmarks.add(cardId);
    showToast('已加入收藏夹');
  }
  saveState();
  renderContent();
}

function toggleBookmarks() {
  const tabBtn = document.getElementById('bookmarksTab');
  tabBtn.style.display = '';
  STATE.currentTab = 'bookmarks';
  switchTab('bookmarks');
  const allBookmarks = KB_DATA.sections.flatMap(s => s.cards).filter(c => STATE.bookmarks.has(c.id));
  if (allBookmarks.length === 0) {
    document.getElementById('bookmarksContent').innerHTML = '<div class="empty-state"><div class="icon">⭐</div><h3>暂无收藏</h3><p>点击知识卡片下方的"收藏"按钮来添加</p></div>';
  }
}

function toggleErrors() {
  const tabBtn = document.getElementById('errorsTab');
  tabBtn.style.display = '';
  STATE.currentTab = 'errors';
  switchTab('errors');
}

// ============ 节完成标记 ============
function markSectionDone(si) {
  STATE.doneSections.add(si);
  saveState();
  updateProgress();
  renderSidebar();
  renderContent();
  setTimeout(() => showToast('✅ 已标记本节为已学'), 300);
}

function updateProgress() {
  const total = KB_DATA.sections.length;
  const done = STATE.doneSections.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateErrorCount() {
  document.getElementById('errorCount').textContent = STATE.errorQuestions.size > 0 ? `(${STATE.errorQuestions.size})` : '';
}

// ============ 搜索 ============
function onSearch() {
  STATE.searchQuery = document.getElementById('searchInput').value.trim();
  if (STATE.currentTab !== 'read') {
    switchTab('read');
  }
  renderContent();
}

// ============ 主题 ============
function toggleTheme() {
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveState();
}

// ============ 错题导出 ============
function exportErrorsCSV() {
  const errors = KB_DATA.quizzes.filter((_, i) => STATE.errorQuestions.has(i));
  if (errors.length === 0) {
    showToast('暂无错题可导出');
    return;
  }
  const labels = ['A','B','C','D'];
  let csv = '\uFEFF序号,题目,选项A,选项B,选项C,选项D,正确答案,你的答案,解析\n';
  errors.forEach((q, idx) => {
    const qi = KB_DATA.quizzes.indexOf(q);
    const yourAnswer = STATE.quizAnswers[qi] !== undefined
      ? (Array.isArray(STATE.quizAnswers[qi]) ? STATE.quizAnswers[qi].map(i => labels[i]).join('') : labels[STATE.quizAnswers[qi]])
      : '未答';
    const correctAnswer = Array.isArray(q.answer) ? q.answer.map(i => labels[i]).join('') : labels[q.answer];
    const stem = q.stem.replace(/"/g, '""');
    const opts = q.options.map(o => o.replace(/"/g, '""'));
    const analysis = q.analysis.replace(/<[^>]*>/g, '').replace(/"/g, '""');
    csv += `${idx + 1},"${stem}","${opts[0] || ''}","${opts[1] || ''}","${opts[2] || ''}","${opts[3] || ''}","${correctAnswer}","${yourAnswer}","${analysis}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '信息技术_错题导出.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ============ 移动端 ============
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============ Toast ============
function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// ============ 启动 ============
document.addEventListener('DOMContentLoaded', function() {
  try { init(); } catch(e) { console.error('初始化失败:', e); }
});
// 兜底：如果DOMContentLoaded已触发
if (document.readyState !== 'loading') {
  try { init(); } catch(e) { console.error('初始化失败:', e); }
}
</script>
