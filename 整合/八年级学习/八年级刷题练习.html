<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>远距离通信包括3G/4G/5G、NB-IoT、LoRa（远距离无线电）。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>C蓝牙是近距离，排除后选ABD。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>远距：蜂窝NB LoRa。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第6课 数据传输方式多（P34）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L06", "lessonTitle": "数据传输方式多", "type": "multi", "stem": "选择物联协议时需要综合哪些因素？（多选）", "options": ["A. 距离范围", "B. 最高速率", "C. 安全性", "D. 功耗"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。教材强调四方面综合分析。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>选择协议需从距离范围、最高速率、安全性、功耗等分析。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项均为教材依据，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>距速安保耗，四因定协议。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第6课 数据传输方式多（P33-34）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L06", "lessonTitle": "数据传输方式多", "type": "short", "stem": "请简述共享单车“获取附近可用单车”的数据流转过程。", "options": [""], "answer": "单车利用位置传感器获取位置数据，通过NB-IoT等网络经MQTT发送至服务器；手机通过移动通信网络经HTTP上传用车人位置；服务器处理后经HTTP把附近单车数据反馈到手机应用软件。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>位置传感→NB-IoT/MQTT→服务器；手机HTTP→服务器→HTTP反馈。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材以共享单车说明物联系统数据流转与多协议协作。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“单车上报—手机上传—服务器反馈”三环节描述。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>车报位、机报位、服反馈。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第6课 数据传输方式多（P32-34）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L06", "lessonTitle": "数据传输方式多", "type": "short", "stem": "按传输介质和传输距离，物联网数据传输方式各如何分类？", "options": [""], "answer": "按传输介质分为有线传输（如双绞线、光纤、以太网、USB）和无线传输（如Wi-Fi、蓝牙、ZigBee、LoRa）；按传输距离分为近距离通信（如RFID、NFC、蓝牙、ZigBee）和远距离通信（如3G/4G/5G、NB-IoT）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>两个维度：介质（有线/无线）、距离（近/远）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材给出两种分类及各自常见技术举例。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>分别列出两类并各举教材实例。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>介质有线无线，距离近远分。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第6课 数据传输方式多（P33-34）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L06", "lessonTitle": "数据传输方式多", "type": "short", "stem": "为什么还要发展低功耗的远程数据传输技术（如NB-IoT）？", "options": [""], "answer": "许多物联设备数量大、分布广、靠电池供电（如共享单车），低功耗设计可延长电池寿命、降低维护成本；传统高速率移动通信（如手机用3G/4G/5G）功耗高、需大电池，不适合海量低功耗终端，因此需要低功耗远程技术。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>海量电池终端需低功耗远距技术。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材从供电节能角度分析，低功耗延长寿命、降成本。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>从设备数量、分布、电池供电、传统技术高功耗对比作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>海量电池终端，低功耗远传。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第6课 数据传输方式多（P34）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "RFID技术本质上是一种？", "options": ["A. 有线通信技术", "B. 无线通信技术", "C. 存储技术", "D. 显示技术"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，RFID本质上是一种无线通信技术（非接触自动识别）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>RFID是物品标识和自动识别技术，无须与被识别物品直接接触。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“无线、非接触”是RFID本质，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RFID无线非接触。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35-38）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "一个基本的RFID系统由哪两部分组成？", "options": ["A. 计算机和网线", "B. 电子标签和读卡器", "C. 传感器和执行器", "D. 手机和服务器"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，RFID系统由电子标签和读卡器组成。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材明确RFID系统由电子标签（数据载体）和读卡器（读取设备）组成。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>记牢“标签+读卡器”两要素。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RFID两件套，标签加读卡。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "RFID技术用于火车站检票，主要利用了它的什么特点？", "options": ["A. 必须接触读取", "B. 非接触自动识别", "C. 只能读一次", "D. 依赖可见光"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，刷身份证进站体现非接触自动识别。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>身份证靠近检票机即被识别，正是RFID非接触识别在发挥作用。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“刷一下即过”=非接触，排除需接触/可见光项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>一刷即过，非接触识。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "关于RFID电子标签，下列说法正确的是？", "options": ["A. 被动标签无内置电池，工作距离较短", "B. 主动标签无电池", "C. 所有标签都必须瞄准读取", "D. 标签不能修改数据"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，被动标签无电池、靠感应取电，工作距离短（几cm~几m）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>被动标签无内置电池、距离短；主动标签有电池、距离可达几十米至上百米；数据可反复修改、不依赖瞄准。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>B、C、D均与教材相反，A正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>被动无电距短，主动有电距远。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "主动标签与被动标签相比？", "options": ["A. 主动标签有内置电池，工作距离更远", "B. 被动标签距离更远", "C. 两者都一样", "D. 主动标签无电池"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，主动标签有电池可主动发信号，距离更远。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>主动标签工作距离可达几十米甚至上百米；被动标签仅几厘米到几米。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“有电池→距更远”是主动标签特征。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>主动有电，远达百米。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "RFID系统工作流程的第一步是？", "options": ["A. 读卡器发射频信号", "B. 给物品打上电子标签并存储数据", "C. 计算机处理", "D. 标签发送数据"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，第一步给物品打电子标签并存储相关数据。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>流程：①打标签存数据→②读卡器发信号→③标签进区发数据→④读卡器传送→⑤计算机处理。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“第一步”是标签初始化，对应B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先打标签后读卡。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "NFC是由什么演变而来的？", "options": ["A. 蓝牙", "B. RFID", "C. Wi-Fi", "D. HTTP"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，NFC由RFID演变而来。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材指出NFC是由RFID演变而来的近距离高频无线通信技术。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“NFC源自RFID”是教材原话。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>NFC出RFID。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "与RFID相比，NFC额外规定了什么？", "options": ["A. 通信协议", "B. 数据交换格式", "C. 电池标准", "D. 屏幕尺寸"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，NFC除通信协议外还规定了数据交换格式。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材说明NFC相比RFID，还规定了数据交换格式，并支持更改内容。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“额外规定数据交换格式”是NFC区别点。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>NFC多格式，可改内容。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "2016年我国自主创新的NFC实体鉴别安全技术成为什么标准？", "options": ["A. 企业标准", "B. ISO/IEC国际标准", "C. 仅国家标准", "D. 行业内部标准"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，成为ISO/IEC国际标准。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>2016年我国NFC非对称/对称实体鉴别两项安全技术正式成为ISO/IEC国际标准。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>记“ISO/IEC国际标准”这一成果。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>一六NFC安鉴，成ISO标。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "single", "stem": "下列应用中，主要使用RFID技术的是？", "options": ["A. 蓝牙耳机听歌", "B. 高速公路ETC不停车收费", "C. Wi-Fi上网", "D. 手机导航"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，高速公路ETC是RFID典型应用。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材以ETC为例说明RFID应用，此外还有铁路检票、物流、医疗手环等。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>ETC=电子不停车收费，用RFID读车载标签。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>ETC靠RFID。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "tf", "stem": "RFID电子标签的识读不依赖可见光，可在高粉尘、野外等恶劣环境下使用。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。RFID识读靠射频电磁场，不依赖可见光，适恶劣环境。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材列举RFID优势：不依赖可见光，可在高粉尘、野外使用。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干符合RFID优势，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RFID无光也读，恶境可用。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "tf", "stem": "RFID每秒可进行上千次读取，并能同时处理多个电子标签。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。RFID可高速、批量读取多个标签。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材指出RFID每秒上千次读取、能同时处理多个标签、高效准确。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干即RFID优势，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>千次多标，RFID快准。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "tf", "stem": "NFC只能由一方读取另一方，不能双向交换数据。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。NFC支持非接触式点对点双向数据交换。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>NFC允许数字设备间非接触式点对点数据传输，可双向。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能一方读”与“双向点对点”矛盾，错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>NFC双向点对点。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "tf", "stem": "RFID电子标签上的数据可以反复修改。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材列出“电子标签上的数据可反复修改”为优势。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>RFID优势之一即标签数据可反复修改、高效准确。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干符合教材，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>标签数据，反复改。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "multi", "stem": "RFID技术的特点和优势包括？（多选）", "options": ["A. 每秒上千次读取", "B. 同时处理多个标签", "C. 数据可反复修改", "D. 不依赖可见光、恶劣环境可用"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。均为教材RFID优势。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>RFID优势：高速读取、批量处理、数据可改、不依赖可见光、适恶劣环境。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项全为教材优势，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>快、多、改、耐恶，RFID四优。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "multi", "stem": "RFID在生活中的应用有？（多选）", "options": ["A. 铁路进站检票", "B. 高速公路ETC", "C. 物流货物跟踪", "D. 医疗患者手环识别"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。均属RFID应用。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材列举铁路检票、ETC、物流跟踪、医疗手环、农业动物标识等。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项均为教材RFID应用，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>检票ETC物流医疗，RFID广用。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "multi", "stem": "关于RFID与NFC，下列说法正确的有？（多选）", "options": ["A. NFC由RFID演变而来", "B. NFC除通信协议还规定数据交换格式", "C. NFC可更改胸卡内容（双向）", "D. RFID和NFC完全相同没有区别"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C。D错误，二者有区别。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>NFC源自RFID，额外规定数据格式且可双向改内容；并非完全相同。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>D“完全相同”错，排除后选ABC。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>NFC源RFID，多格式可双向。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "short", "stem": "简述RFID系统的一般工作流程（5步）。", "options": [""], "answer": "①给物品打上电子标签并存储相关数据；②读卡器发送一定频率的射频信号；③当物品进入读卡器工作区，电子标签将自身数据发送出去；④读卡器接收数据并传送到计算机管理系统；⑤计算机管理系统作出相应处理。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>打标签→发信号→标签回传→读卡器送计算机→系统处理。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材给出RFID五步标准流程。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>按教材五步顺序逐条写出。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>标签、信号、回传、送机、处理。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "short", "stem": "被动标签与主动标签有什么区别？", "options": [""], "answer": "被动标签没有内置电池，靠读卡器射频信号感应取电，工作距离较短（几厘米到几米）；主动标签有内置电池，可主动发射信号，工作距离较远（可达几十米甚至上百米）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>有无电池与距离差异是核心区别。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材按发射射频信号方式分被动/主动标签，距离与供电相关。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>从“电池、取电方式、工作距离”对比作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>被动无电距短，主动有电距远。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P35）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L07", "lessonTitle": "电子标签我揭秘", "type": "short", "stem": "教材用“胸卡”类比说明RFID与NFC的区别，请解释。", "options": [""], "answer": "RFID像学生戴胸卡方便别人了解他（一方读取）；NFC像师生两人都戴胸卡，可互相看到对方信息，且能更改胸卡内容改变对方收到的数据，即NFC支持双向非接触点对点数据交换，并规定了数据交换格式。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>RFID单向读取，NFC双向可改。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材用胸卡类比说明二者在双向性与可改内容上的差异。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>分别说明“单向胸卡”与“双向可改胸卡”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RFID单向卡，NFC双向改。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "蓝牙是一种什么类型的通信技术？", "options": ["A. 远距离有线", "B. 近距离无线通信", "C. 仅用于卫星", "D. 仅用于光纤"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，蓝牙是常见的近距离无线通信技术。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>多数手机、平板、笔记本都有蓝牙，可连接设备也可传输数据。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“近距离无线”是蓝牙定位。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙近距无线。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39-42）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "蓝牙设备之间通信的前提是？", "options": ["A. 必须插网线", "B. 找到并配对成功", "C. 必须同品牌", "D. 必须对准"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，设备须找到并配对成功才能互相通信。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>蓝牙原理：发信号寻找另一设备，配对成功便可通信。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“配对成功”是蓝牙通信前提，排除插线/同品牌/对准。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙先配对，再通信。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39-40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "蓝牙5.0的传输距离增加到多少？", "options": ["A. 3m", "B. 30m", "C. 300m", "D. 3000m"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选C，蓝牙5.0传输距离增加到300m。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>蓝牙5.0距离300m，低功耗模式2Mb/s，成物联网重要无线技术。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>记“蓝牙5.0→300m”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙五点零，三百米。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39-40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "相比传统蓝牙，低功耗蓝牙（BLE）的主要优势是？", "options": ["A. 功耗更低、续航提升", "B. 只能听歌", "C. 距离更短", "D. 不能连多设备"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，低功耗蓝牙显著降低功耗、提升续航。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>低功耗蓝牙出现后手机续航提升，蓝牙耳机/音箱相继出现。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“低功耗”是BLE核心优势，排除错误项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>BLE低功耗，续航长。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39-40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "制作蓝牙翻页笔时，用来检测“摇一摇”的传感器是？", "options": ["A. 光敏传感器", "B. 加速度传感器", "C. 温度传感器", "D. 磁力传感器"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，加速度传感器检测摇晃（shake）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>蓝牙翻页笔用主控板+蓝牙模块+加速度传感器，shake()判断摇晃。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“摇一摇”对应加速度传感器。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摇一摇，加速度。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P40-41）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "蓝牙翻页笔向计算机发送空格键实现翻页，使用的函数大致是？", "options": ["A. ble_hid.keyboard_send(keycode.SPACE)", "B. wifi.connect()", "C. mqtt.connect()", "D. sound().read()"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，通过低功耗蓝牙发送键盘空格指令实现翻页。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材代码：ble_hid.keyboard_send(keycode.SPACE)发送空格键指令。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>wifi/mqtt/sound均非发键盘指令，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>SPACE键，蓝牙翻页。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P40-41）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "蓝牙耳机既能听手机声音也能操控手机，体现了蓝牙的什么特性？", "options": ["A. 单向通信", "B. 双向通信", "C. 不能通信", "D. 仅有线"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，蓝牙支持双向通信。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材以蓝牙耳机为例说明双向通信（听声+操控）。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“既能听又能控”=双向，排除单向。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙双向通。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39-40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "下列不属于近距离通信共同特点的是？", "options": ["A. 低功耗", "B. 低延时", "C. 数据格式简单", "D. 高带宽远距离"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选D，高带宽远距离是远距离通信特征，非近距特点。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>近距离通信特点：低功耗、低延时、数据格式简单。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>ABC为近距特点，D相反，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>近距三特点：低功耗低延时简格式。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P41-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "传统家用遥控器大多使用什么通信？", "options": ["A. 红外", "B. 蓝牙", "C. Wi-Fi", "D. NFC"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，传统遥控器多用红外通信。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材拓展：传统遥控器通过红外发射管单向发送遥控数据。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“传统遥控器=红外”是教材对比点。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>老遥控，红外传。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P42-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "single", "stem": "与红外遥控器相比，蓝牙智能遥控器的优点不包括？", "options": ["A. 基本无死角遥控", "B. 可连接多个设备", "C. 不受障碍物干扰", "D. 必须严格对准才能用"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选D，红外才需对准，蓝牙无死角、可穿障碍。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>蓝牙遥控器无死角、可连多设备、更远、不受障碍干扰；红外需对准。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>D是红外缺点，非蓝牙优点，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙无死角，红外要对准。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P42-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "tf", "stem": "蓝牙既可以用来连接设备，也可以用来传输数据。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。蓝牙兼具连接设备与传输数据两种用途。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材明确蓝牙既可用于连接设备，也可用来传输数据。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干即蓝牙定义，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙连设备又传数据。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "tf", "stem": "同一设备的蓝牙只能连接一个设备，不能一对多。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。蓝牙可连接多个设备，能实现一对多发送。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材引导学生试一试“一对多”发送，说明蓝牙可连多设备。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能一个”与教材“可一对多”矛盾，错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>蓝牙可连多，一对多。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "tf", "stem": "近距离通信协议通常具有低功耗、低延时、数据格式简单等特点。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。RFID、NFC、蓝牙等近距协议共具这三特点。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材总结近距通信特点：低功耗、低延时、数据格式简单。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干即教材总结，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>近距三特点记心间。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P41-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "tf", "stem": "红外遥控器只能单向通信且需要对准，蓝牙遥控器可控性更强、不受障碍干扰。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。红外单向需对准，蓝牙无死角可穿障。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材拓展对比二者优缺点，蓝牙明显更优。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>符合教材对比结论，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>红外单向对准，蓝牙无碍。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P42-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "multi", "stem": "常见的近距离通信协议包括？（多选）", "options": ["A. RFID", "B. NFC", "C. 蓝牙", "D. ZigBee"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。均属近距离通信协议。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材列举RFID、NFC、蓝牙、ZigBee为常见近距离通信协议。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项均符，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RFID NFC 蓝牙 ZigBee，近距四协议。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P41-42）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "multi", "stem": "近距离通信的共同特点有？（多选）", "options": ["A. 低功耗", "B. 低延时", "C. 数据格式简单", "D. 必须经过多个节点复杂封装"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C。D是互联网远距离传输特点，非近距。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>近距通信直连、格式简单；复杂封装是互联网多节点转发所需。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>D不符近距特点，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>低功耗、低延时、简格式。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P41-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "multi", "stem": "蓝牙翻页笔的实践需要哪些设备材料？（多选）", "options": ["A. 主控板", "B. 蓝牙模块", "C. 加速度传感器", "D. 显示器显卡"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C。翻页笔需主控板+蓝牙模块+加速度传感器。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材明确设备材料为主控板、蓝牙模块、加速度传感器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>D显卡非所需，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>主控蓝牙加速度，翻页三件。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "short", "stem": "简述蓝牙设备之间建立通信的基本过程。", "options": [""], "answer": "设备搭载蓝牙芯片，在工作范围内发送无线电信号寻找另一个蓝牙设备；一旦找到并配对成功，双方便可互相通信（可传输数据或连接设备）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>发信号寻找→配对成功→互相通信。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材说明蓝牙工作原理即“寻找—配对—通信”。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“发信号—配对—通信”三环节作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>寻、配、通，蓝牙三步。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P39-40）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "short", "stem": "近距离通信协议一般有哪些共同特点？为什么需要这些特点？", "options": [""], "answer": "共同特点：低功耗（电池供电长时间工作，如发展为低功耗蓝牙）、低延时（瞬时完成指令，如无线键鼠、心率带）、数据格式简单（设备间直连不经多节点封装）。因近距离设备常电池供电、需实时响应且直连无需复杂路由，所以需要低功耗、低延时和简单格式。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>低功耗、低延时、简格式及其原因。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材以无线键鼠、心率带等说明近距特点与必要性。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>先列三特点，再从供电、实时性、直连角度解释。<br><br>\n<strong style=\"color:#e67e23;\">🧠 记忆口诀：</strong>低功耗低延时简格式，电池实时直连需。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P41-43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L08", "lessonTitle": "巧用蓝牙做工具", "type": "short", "stem": "用蓝牙翻页笔“摇一摇翻页”的工作过程是怎样的？", "options": [""], "answer": "主控板与计算机建立蓝牙连接后，持续监听加速度传感器数据；当检测到主控板摇晃（shake()）时，通过低功耗蓝牙向计算机发送一条键盘空格指令（ble_hid.keyboard_send(keycode.SPACE)），使演示文稿翻页；也可扩展为向前/向后两种翻页。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>蓝牙连接→监听加速度→摇晃→发空格指令→翻页。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材代码逻辑：shake()判摇晃，发送SPACE键实现翻页。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“连接—监听—摇晃判—发指令—翻页”描述。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>摇则发空格，文稿即翻。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第8课 巧用蓝牙做工具（P40-41）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "物联音箱能播报天气，主要是因为它连接了什么获取数据？", "options": ["A. 自身传感器", "B. 互联网的天气预报服务", "C. 只有内存", "D. 蓝牙音箱"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，物联音箱连接互联网天气预报服务获取天气。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物联音箱无气象传感器，靠连接互联网天气服务自动获取预报。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“无传感器→靠互联网”是关键，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>音箱无传感，联网取天气。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P43-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "互联网上的服务器通常通过什么让外部设备访问数据资源？", "options": ["A. API（应用程序接口）", "B. 只有U盘", "C. 显示器", "D. 键盘"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，服务器通过API让外部程序/设备访问数据。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API是预先定义的软件函数集合，提供不同软件间交互方法。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“访问数据资源”对应API。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>服务器用API，外设来取数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P43-44）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "通俗来说，API可以被理解为不同软件之间的什么？", "options": ["A. 障碍", "B. 桥梁", "C. 电池", "D. 屏幕"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，API像不同软件间的“桥梁”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API是预先定义的软件函数集合，提供不同软件间交互方法。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“访问数据资源”对应API。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>服务器用API，外设来取数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P43-44）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "物联设备利用HTTP获取网络数据，一般步骤顺序是？", "options": ["A. 解析结果→发起请求→获取URL", "B. 获取API的URL→发起网络请求→解析返回结果", "C. 发起请求→获取URL→解析", "D. 直接显示"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，步骤为获取URL→发起请求→解析结果。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材给出三步：获取API网址、发起网络请求、解析返回结果。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>逻辑上先有网址才能请求，最后解析，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>取址、请求、解析，三步序。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P44）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "API返回的数据通常为哪种格式字符串？", "options": ["A. 仅图片", "B. XML或JSON", "C. 仅声音", "D. 仅视频"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，API返回一般为XML或JSON格式字符串。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>返回数据常为XML/JSON，可用ujson库解析为字典提取内容。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“结构化数据交换”对应XML/JSON。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>API回XML或JSON。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P44-45）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "在物联实验中，常用哪个Python库把JSON字符串解析为字典？", "options": ["A. ujson", "B. wifi", "C. mqtt", "D. hid"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，用ujson库将JSON解析为字典。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材代码data=ujson.loads(res)把返回字符串解析为字典对象。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>wifi/mqtt/hid分别用于联网、消息、人机接口，解析用ujson。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>ujson解析JSON。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P44-45）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "HTTP主要面向什么模式？", "options": ["A. 点对点模式", "B. 客户端/服务器模式", "C. 广播模式", "D. 无模式"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，HTTP主要面向客户端/服务器模式。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>客户端（浏览器或物联设备）必须主动向服务器发请求以获取数据。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“主动请求”是客户端/服务器模式特征。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>HTTP是C/S模式。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "在物联网中用HTTP不断轮询检查新指令，会带来什么问题？", "options": ["A. 没有任何问题", "B. 消耗设备有限资源、增加能耗、加重服务器负担", "C. 速度更快", "D. 更安全"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，轮询会消耗资源、增能耗、加重服务器/网络负担。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>设备为及时响应需不断轮询，导致资源、能耗与网络负担问题。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“不断轮询”显然有负面后果，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>轮询耗资源增负担。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "物联通信协议需要满足的特性不包括？", "options": ["A. 低功耗", "B. 低带宽要求", "C. 低延时", "D. 高功耗高带宽"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选D，高功耗高带宽与物联需求相反。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物联协议需低功耗、低带宽、低延时、兼容性、可靠性。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>ABC为所需，D相反，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>低功低带宽低延时，三低一兼可。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "single", "stem": "下列设备从互联网获取数据，对应正确的是？", "options": ["A. 手机—天气预报、新闻、社交媒体通知", "B. 手环—仅本地游戏", "C. 汽车—仅音乐", "D. 音箱—只能播本地"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，手机从互联网获取天气预报、新闻、社交通知等。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材表：手机取天气/新闻/社交；手表取运动建议/天气；汽车取路况。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>B、C、D“仅本地”错误，A符合教材。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>手机天气新闻社交。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "tf", "stem": "物联网在发展前期沿用了传统互联网的通信架构，其中包括HTTP协议。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。物联网前期沿用传统互联网架构，含HTTP。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材指出物联网发展前期完全沿用传统互联网通信架构，包括HTTP。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干符合教材，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>物联沿用HTTP。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P44-45）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "tf", "stem": "HTTP非常适合物联网所有场景，没有任何局限性。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。HTTP需不断轮询，耗资源能耗，并不全适合物联网。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材专门探讨HTTP局限性，提出物联协议需满足特定要求。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“没有任何局限”与教材矛盾，错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>HTTP有局限，非万能。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "tf", "stem": "物联协议需要满足低功耗、低带宽、低延时、兼容性、可靠性等要求。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材列出这些物联协议应满足的特性。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物联场景含多终端，需低功耗、低带宽、低延时、兼容性、可靠性。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干即教材总结，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>三低一兼可，物联协议需。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "tf", "stem": "网址与URL（统一资源定位符）是同一概念，网址是URL的非专业说法。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。网址就是URL的通俗叫法。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材说明网址与URL是同一概念，网址是URL的非专业说法。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干符合教材，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>网址即URL。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P44）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "multi", "stem": "物联设备利用HTTP从互联网获取数据的步骤包括？（多选）", "options": ["A. 获取API的网址（URL）", "B. 发起网络请求（如GET）", "C. 解析返回结果", "D. 直接关机"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C。三步获取流程，D无关。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>获取URL→发起GET请求→用ujson解析返回结果。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“直接关机”非步骤，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>取址请求解析，三步取数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P44）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "multi", "stem": "物联通信协议需要满足哪些特性？（多选）", "options": ["A. 低功耗", "B. 低带宽要求", "C. 低延时", "D. 兼容性"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。教材还要求可靠性。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物联协议需低功耗、低带宽、低延时、兼容性、可靠性。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项均属所需特性，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>三低一兼可，特性全。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "multi", "stem": "下列设备与其从互联网获取的数据对应正确的有？（多选）", "options": ["A. 手机—天气预报、新闻、社交媒体通知", "B. 手表—运动建议、天气情况", "C. 汽车—交通路况", "D. 物联音箱—天气"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。均符合教材对应表。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材表列手机、手表、汽车、物联音箱各自互联网数据来源。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项均正确，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>机手汽箱，各取数据。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P43）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "short", "stem": "什么是API？物联设备如何利用HTTP通过API获取数据？", "options": [""], "answer": "API（应用程序接口）是预先定义的软件函数集合，像不同软件间的“桥梁”。物联设备先用Wi-Fi联网，通过HTTP向API的URL发起GET请求，获得XML/JSON格式的返回数据，再用ujson等库解析为字典提取所需内容。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>API是桥梁，HTTP三步取数。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>API提供数据访问接口，HTTP请求+解析实现取数。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>先定义API，再述“联网—请求—解析”流程。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>API桥，HTTP取，ujson析。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P43-45）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "short", "stem": "HTTP在物联网应用中有什么局限性？", "options": [""], "answer": "HTTP是客户端/服务器模式，设备必须主动请求数据；在物联网中设备为及时响应远程指令需不断轮询服务器，这会消耗物联设备有限资源、增加能耗，并给服务器和传输网络造成极大负担，因此并不完全适合高效实时的物联网场景。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>HTTP需轮询，耗资源增负担。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材探讨HTTP局限性，引出物联协议特定需求。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>从“主动请求—不断轮询—负面后果”作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>主动请求需轮询，资源能耗负担。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L09", "lessonTitle": "互联协议仍沿用", "type": "short", "stem": "为什么物联通信协议要满足低功耗、低带宽、低延时、兼容性等要求？", "options": [""], "answer": "许多物联设备靠电池供电且分布广，需低功耗延长寿命；网络带宽在偏远区可能受限，需低带宽高效工作；自动驾驶、监控等需快速响应，需低延时；设备来自不同厂商，需兼容性；还要可靠确保系统无缝工作。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>从供电、带宽、实时、异构四方面说明。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材逐条解释物联协议特性的现实原因。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>对应每项特性给出应用场景原因。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>电池带宽实时异构，四因定特性。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "MQTT协议的中文名称是？", "options": ["A. 超文本传输协议", "B. 消息队列遥测传输", "C. 文件传输协议", "D. 邮件协议"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，MQTT即消息队列遥测传输。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT是物联网流行协议，开放、轻量、可靠、易实现。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“消息队列遥测传输”是MQTT中文名，区别于HTTP。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT消息队列遥测传。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47-48）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "MQTT采用什么通信机制？", "options": ["A. 请求/响应（客户端/服务器）", "B. 发布/订阅", "C. 广播", "D. 点对点直连"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，MQTT采用发布/订阅机制。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT发布订阅三角色：发布者、服务器、订阅者。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“发布订阅”是MQTT核心机制，区别于HTTP请求响应。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT发布订阅。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "MQTT通信机制中的三个角色是？", "options": ["A. 发布者、服务器、订阅者", "B. 传感器、执行器、主控板", "C. 手机、电脑、路由器", "D. 读卡器、标签、计算机"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，三个角色为发布者、服务器（中介）、订阅者。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材明确MQTT三角色及各自职责。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>记牢“发布者、服务器、订阅者”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>发布、中介、订阅，三角色。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "在MQTT中，发布者把消息发布到哪里？", "options": ["A. 直接发给订阅者", "B. 服务器管理的主题", "C. 本地文件", "D. 蓝牙"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，发布者向服务器管理的“主题”上传数据。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>发布者不直接给订阅者，而是发布到服务器管理的主题。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“主题”是MQTT中转核心，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>发布者，发主题。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "服务器如何把消息给订阅者？", "options": ["A. 随机发送", "B. 订阅者预先订阅某主题，发布者发布后服务器把消息传递给该订阅者", "C. 不发送", "D. 仅发给发布者"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，服务器按订阅关系把主题消息推给订阅者。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>订阅者预先订阅主题，发布后服务器传递消息给订阅该主题的客户端。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“预先订阅→服务器推送”是核心，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>订阅在先，服务器推送。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "教材用“订报纸”类比MQTT，其中邮局相当于？", "options": ["A. 订阅者", "B. MQTT服务器", "C. 发布者", "D. 报纸"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，邮局相当于MQTT服务器（中介）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>类比：邮局=服务器，客户=订阅者，报社=发布者。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“邮局中转”对应服务器角色。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>邮局即服务器，中转消息。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "实践中MQTT服务器的端口号通常是？", "options": ["A. 80", "B. 443", "C. 1883", "D. 3306"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选C，MQTT默认端口为1883。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材代码mqttclient.connect中port=1883。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>记“MQTT端口1883”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT端口，一八八三。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P48-50）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "连接MQTT服务器时，用于识别设备的唯一标识符是？", "options": ["A. 主题ID", "B. 设备ID（client_id）", "C. 用户名", "D. 密码"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选B，设备ID（client_id）唯一识别设备。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>每个连服务器设备须有唯一client_id以便区分。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“唯一标识设备”对应client_id。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>设备ID，唯一认。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P48-50）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "关于MQTT服务器，下列说法正确的是？", "options": ["A. 只能是在线的", "B. 只能是本地的", "C. 既可以是在线的也可以是本地搭建的", "D. 不需要服务器"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选C，MQTT服务器可在线也可本地搭建。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材：可在在线MQTT服务器，也可搭建本地MQTT服务器。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能在线/只能本地”均错，选C。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT服务器，在线本地皆可行。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P48）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "single", "stem": "相比HTTP，MQTT更适合物联网的原因是其具有什么特点？", "options": ["A. 开放、轻量、可靠、易实现，适合低性能远程设备", "B. 更重", "C. 必须频繁轮询", "D. 只支持文本"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>答案选A，MQTT开放轻量可靠易实现，适合低性能远程设备。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT为大量硬件性能较低且远程的设备提供数据传输与监控。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“轻量适合低性能”是MQTT优于HTTP之处。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT轻量可靠，宜物联。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "tf", "stem": "MQTT是一种基于TCP/IP进行远程传输的轻量级通信协议，于2021年成为ISO国际标准。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。MQTT基于TCP/IP，2021年成ISO国际标准。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材专业名词说明：MQTT于2021年成为ISO承认的国际标准。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干符合教材，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT二一入ISO。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P3、P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "tf", "stem": "在MQTT中，发布者和订阅者直接相互发送消息，无需服务器。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。发布者与订阅者经服务器（中介）转发，不直接通信。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT服务器是连接发布者和订阅者的重要桥梁。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>“无需服务器”违背发布订阅机制，错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>MQTT必经服务器。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "tf", "stem": "在线MQTT服务器使用方便但通常需要注册；本地服务器不用注册但操作较繁琐。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材对比在线（需注册、方便）与本地（免注册、繁琐）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>两种服务器各有优劣，实践中按需选择。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干即教材对比，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>在线注册便，本地免注繁。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P48）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "tf", "stem": "订阅者需要先订阅某个主题，才能收到该主题下发布者发布的消息。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。只有预先订阅主题，才能接收该主题消息。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材说明订阅者预先订阅主题，发布后由服务器传递。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干符合订阅机制，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先订阅，后收信。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "multi", "stem": "MQTT的特点包括？（多选）", "options": ["A. 开放", "B. 轻量", "C. 可靠", "D. 易实现"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。四者皆MQTT特点。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材称MQTT具有开放、轻量、可靠、易实现的特点。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项全为教材特点，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>开放轻量可靠易实现，MQTT四特。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "multi", "stem": "在MQTT发布/订阅机制中，正确的描述有？（多选）", "options": ["A. 发布者向服务器管理的主题上传数据", "B. 订阅者预先订阅主题", "C. 服务器把消息传给订阅该主题的客户端", "D. 发布者直接把消息发给每个订阅者"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C。D错，发布者不经服务器直接发。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>发布者发到主题，服务器按订阅关系推送，发布订阅不直接相连。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>D违背“经服务器”原则，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>发布到主题，服务器推送。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "multi", "stem": "使用在线MQTT服务器实现订阅功能，一般需要？（多选）", "options": ["A. 注册登录服务器", "B. 创建项目并添加主题", "C. 添加设备并记录设备ID/用户名/密码", "D. 导入mqttclient、wifi、oled等类"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确答案：A、B、C、D。均为实践必要步骤。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材任务：注册→建项目主题→添设备记凭证→代码导入mqttclient/wifi/oled。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>四项均为教材流程，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>注册建主题添设备导类，四步订阅。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P48-50）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "short", "stem": "请说明MQTT的发布/订阅通信机制及三个角色的关系。", "options": [""], "answer": "MQTT有发布者、服务器（中介）、订阅者三个角色。发布者把消息发布到服务器管理的“主题”上；订阅者预先订阅感兴趣的主题；服务器作为桥梁，在发布者发布后，把该主题的消息传递给所有订阅该主题的客户端。发布者与订阅者并不直接通信。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三角色+主题中转机制。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>发布者发主题，服务器按订阅推送，发布订阅解耦。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>说明三角色职责与“经服务器中转”关系。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>发布主题，订阅收，服务器中转。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "short", "stem": "用“订报纸”类比说明MQTT的工作过程。", "options": [""], "answer": "把MQTT服务器比作邮政局，订阅者比作订报客户，发布者比作报纸出版机构。出版机构每天出新报送到邮局；客户订了一年报纸后，邮局会每天把新报送到客户手中，无需客户每天重复订购。对应：发布者发消息到服务器主题，订阅者订阅后由服务器自动推送。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>邮局=服务器，客户=订阅者，报社=发布者。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材用订报纸类比发布/订阅推送过程。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>逐一对应三者角色与“自动推送”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>报社发、邮局转、客户订收。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第二单元 万物互联有协议", "lesson": "L10", "lessonTitle": "物物互通有新径", "type": "short", "stem": "HTTP与MQTT在物联网通信上有什么主要区别？", "options": [""], "answer": "HTTP是请求/响应模式，客户端必须主动轮询服务器才能获取新数据或指令，实时性差且耗资源；MQTT是发布/订阅模式，设备订阅主题后由服务器主动推送消息，具有开放、轻量、可靠、易实现的特点，更适合大量低功耗、低性能远程设备的实时数据传输。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>HTTP轮询被动，MQTT订阅主动推送。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>教材引导学生分析两协议异同与适用场景。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：</strong>从通信模式、实时性、资源消耗对比作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>HTTP轮询，MQTT推送。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：</strong>教材 第二单元 第10课 物物互通有新径（P47）。"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "物联系统中把整体功能分解后，通常划分为哪三层结构？", "options": ["感知层、网络层、应用层", "输入层、计算层、输出层", "采集层、传输层、控制层", "硬件层、软件层、服务层"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>物联系统分为感知层、网络层、应用层三层结构。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知层采集数据，网络层传输数据，应用层处理分析并实现控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>记忆“感知—网络—应用”三段式即可排除其他干扰项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感知采、网络传、应用管。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "在物联系统的三层结构中，负责从物理环境中采集数据、起决定性作用是哪一层？", "options": ["感知层", "网络层", "应用层", "传输层"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>感知层负责从物理环境中采集数据，在物联网中起着决定性的作用，是物联网的基础。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知层通过摄像头、传感器等采集现实世界的数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“采集数据、起决定性作用、是基础”均指向感知层。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感知是根基，采数它第一。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "物联系统中，负责将感知层采集到的数据安全、可靠地传输到进行处理和分析的是哪一层？", "options": ["感知层", "网络层", "应用层", "控制层"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>网络层负责将感知层采集到的数据安全、可靠地传输到进行处理和分析。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>网络层连接网络、传输数据，实现设备间的数据交互。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“传输”关键词对应网络层。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>网络管传输。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "物联系统中，对数据进行处理和分析、实现对物理世界的实时控制和精确管理的是哪一层？", "options": ["感知层", "网络层", "应用层", "采集层"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>应用层对数据进行处理和分析，实现对物理世界的实时控制、精确管理。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>刷卡开锁、门铃通知、远程控制、刷脸开锁等功能都在应用层实现。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“处理分析、控制管理”指向应用层。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>应用做决策，控制靠它来。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "下列关于物联门锁核心功能的描述，哪一项不属于教材列出的四个相对完整应用场景？", "options": ["刷卡开锁", "门铃远程通知", "远程控制开锁", "机械钥匙开锁"], "answer": 3, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>教材列出的物联门锁核心功能为刷卡开锁、门铃远程通知、远程控制开锁、刷脸开锁，不含传统机械钥匙开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物联门锁强调智能化联网功能。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>机械钥匙是非联网的传统方式，属于干扰项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>刷、铃、远、脸四功能。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "在公交站牌“到站提醒”功能中，北斗车载定位终端、加速度传感器属于物联系统哪一层？", "options": ["感知层", "网络层", "应用层", "传输层"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>北斗车载定位终端、加速度传感器用于采集位置、运行速度等数据，属于感知层。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>传感器是感知层的核心设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“采集位置/速度数据”对应感知层。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>传感器在感知层。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "公交站牌到站提醒中，传感器采集的数据“通过网络传送给服务器”这一过程属于哪一层？", "options": ["感知层", "网络层", "应用层", "处理层"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>数据通过网络传送给服务器，属于网络层的传输功能。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>网络层负责数据传输与设备间交互。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>“网络传送”是网络层标志。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>传送靠网络。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "公交站牌中，服务器分析处理后把结果发送给站牌进行可视化呈现，这属于哪一层？", "options": ["感知层", "网络层", "应用层", "采集层"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>服务器分析处理并可视化呈现，属于应用层的数据处理与分析功能。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>应用层完成分析、处理、呈现与控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“分析处理、可视化呈现”是应用层特征。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>呈现归应用。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "在物联系统三层结构中，被称为“物联网的基础”并且“起着决定性作用”的是？", "options": ["感知层", "网络层", "应用层", "互联网层"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>感知层在物联网中起着决定性的作用，是物联网的基础。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>没有感知层采集数据，后续传输与分析都无从谈起。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>题干“基础、决定性”明确指向感知层。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感知是地基。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "single", "stem": "下列哪一项体现了物联系统“应用层”的功能？", "options": ["摄像头采集人脸数据", "RFID读卡器读取标签", "刷脸开锁功能实现", "传感器采集温度"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>刷脸开锁功能实现属于应用层对数据的处理与控制；其余三项均为感知层采集。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>应用层实现具体智能功能。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>识别“功能实现”而非“数据采集”即为应用层。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>功能实现看应用。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "tf", "stem": "物联系统由感知层、网络层、应用层三层结构组成。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。物联系统通常划分为感知层、网络层、应用层三层。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三层结构是最基础的物联系统模型。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材定义一致选“正确”。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>三层记心间。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "tf", "stem": "网络层负责对数据进行处理和分析，实现对物理世界的实时控制。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。对数据进行处理、分析并实现实时控制的是应用层，网络层只负责传输数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>各层分工不同，勿混淆。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“处理分析、控制”属于应用层，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>处理归应用，别赖网络层。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "tf", "stem": "感知层在物联网中起着决定性的作用，是物联网的基础。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。教材明确指出感知层在物联网中起着决定性作用，是物联网的基础。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知层采集物理环境数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材原话一致选“正确”。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感知是基础。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "tf", "stem": "物联门锁只能实现刷卡开锁这一种功能。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。物联门锁可实现刷卡开锁、门铃远程通知、远程控制开锁、刷脸开锁等多种功能。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>物联门锁功能丰富多样。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“只能”过于绝对，明显错误。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>功能多又全。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "multi", "stem": "教材中物联门锁系统可以分解为哪些相对完整的应用场景功能？（多选）", "options": ["刷卡开锁", "门铃远程通知", "远程控制开锁", "刷脸开锁"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四个均为教材列出的物联门锁核心功能，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>核心功能：刷卡开锁、门铃远程通知、远程控制开锁、刷脸开锁。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>逐一对照教材四功能，无干扰项则全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>刷铃远脸四功能。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "multi", "stem": "下列哪些设备/作用属于物联系统的感知层？（多选）", "options": ["摄像头采集人脸数据", "门铃采集状态数据", "服务器分析处理数据", "数据通过网络传输"], "answer": [0, 1], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>摄像头采集人脸、门铃采集状态均为感知层采集数据；服务器分析属应用层，网络传输属网络层。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>感知层由传感器完成数据采集。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>抓“采集”二字，排除分析、传输项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采集归感知。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "multi", "stem": "关于物联系统三层结构，下列说法正确的有哪些？（多选）", "options": ["感知层负责采集数据", "网络层负责传输数据", "应用层负责处理分析和控制", "应用层负责采集物理环境数据"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>感知层采集、网络层传输、应用层处理分析控制均正确；应用层不负责采集，采集是感知层的职责。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>三层职责需严格区分。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除“应用层采集”这一错项，其余全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>各层各司职。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "short", "stem": "简述物联系统的三层结构及其各自的主要作用。", "options": [""], "answer": "物联系统分为三层：①感知层——负责从物理环境中采集数据，是物联网的基础，起决定性作用（如摄像头、各类传感器）；②网络层——负责将感知层采集到的数据安全、可靠地传输到进行处理和分析，实现设备间数据交互；③应用层——对数据进行处理和分析，实现对物理世界的实时控制与精确管理（如刷卡开锁、门铃通知、远程控制、刷脸开锁等功能）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>三层即感知层、网络层、应用层，分别承担采集、传输、处理控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>这是物联系统最基础的架构模型。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>围绕“采集—传输—处理控制”三词展开作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>感知采、网络传、应用管。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "short", "stem": "物联门锁系统可以分解为哪几个相对完整的应用场景功能？", "options": [""], "answer": "物联门锁可分为四个相对完整的应用场景功能：①刷卡开锁；②门铃远程通知；③远程控制开锁；④刷脸开锁。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四个核心功能即刷卡、门铃通知、远程控制、刷脸。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>这是后续各课逐一实现的功能模块。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按教材列表逐条写出即可。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>刷铃远脸。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 11, "lessonTitle": "物联系统细分解", "type": "short", "stem": "以公交站牌“到站提醒”为例，说明该功能的工作过程。", "options": [""], "answer": "工作过程：①北斗车载定位终端、加速度传感器等采集位置、运行速度等数据（感知层）；②通过网络将采集的数据传送给服务器（网络层）；③服务器分析处理后，将结果发送给公交站牌进行可视化呈现（应用层），从而实现到站提醒。", "analysis": "<strong style=\"color:#1e88e5;\">🎯 答案解析：</strong>按“采集—传输—分析呈现”三段描述。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>用真实案例理解三层协作。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>对应三层各写一句即可。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采传现。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第11课 物联系统细分解"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "在刷卡开锁功能中，负责读取电子标签中编号的模块是？", "options": ["输入模块", "计算模块", "输出模块", "网络模块"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>输入模块由电子标签、RFID读卡器组成，负责读取电子标签中的编号。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>输入模块采集身份数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“读取编号”是输入采集，属输入模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>读卡输入先。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "RFID技术的中文全称是？", "options": ["射频识别", "近场通信", "蓝牙通信", "远程控制"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>RFID是radio frequency identification的缩写，中文为“射频识别”。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>RFID通过无线电信号识别特定目标并读写数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>RFID=射频识别，是教材明确定义。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>RFID射频识别。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "下列关于RFID特点的描述，正确的是？", "options": ["通过机械接触读取数据", "通过无线电信号识别目标，无须机械或光学接触", "只能在10厘米内使用", "必须联网才能识别"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>RFID是一种无线通信技术，通过无线电信号识别特定目标并读写相关数据，无须识别系统与特定目标之间建立机械或光学接触。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>非接触式识别是RFID的核心特点。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>抓“无线电信号、无须接触”关键词。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>无线非接触。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "刷卡开锁功能中，判断是否可以开锁的关键依据是？", "options": ["读卡器是否通电", "电子标签编号是否在存储列表中", "舵机是否转动", "网络是否连接"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>主控板用列表存储电子标签编号，判断编号是否在列表中，若在列表中则执行开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>编号匹配是身份校验的核心。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“是否在列表中”是开锁触发条件。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>列表查编号。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "在刷卡开锁模拟系统中，用来模拟打开门锁的硬件是？", "options": ["RFID读卡器", "舵机", "按键传感器", "摄像头"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>舵机（模拟门锁）在计算模块中用于模拟打开门锁的动作。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>舵机是一种位置（角度）调节的驱动器。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“模拟开锁动作”对应舵机。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>舵机转开锁。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "舵机作为一种位置（角度）调节的驱动器，其常见可调节角度范围是？", "options": ["0°到90°", "0°到180°", "0°到360°", "−90°到90°"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>舵机常见可调节角度为0°到180°。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>舵机通过角度变化模拟门锁开合。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>教材明确给出0°到180°。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>舵机0到180。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "刷卡开锁功能的工作流程，第一步是？", "options": ["采集身份数据", "判断身份", "发送开锁指令", "接收指令开锁"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>工作流程为：采集身份数据→获取身份数据→判断身份→发送开锁指令→接收指令开锁，第一步是采集身份数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>流程始于数据采集。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>任何识别流程都从“采集”开始。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>先采集后判断。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "用列表存储电子标签编号并进行判断比对，这属于哪个模块的功能？", "options": ["输入模块（电子标签、RFID读卡器）", "计算模块（主控板）", "输出模块（舵机）", "网络模块"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>计算模块由主控板担任，用列表存储电子标签编号并判断编号是否在列表中。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>主控板完成身份校验逻辑。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“存储、判断”是计算逻辑，属计算模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>主控做判断。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "门禁系统中将门禁卡和业主身份数据关联，利用的是电子标签编码的什么特性？", "options": ["可复制性", "唯一性", "可变性", "通用性"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>利用标签编号的唯一性来标识用户身份，实现精准管理。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>每个电子标签编码唯一。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“标识身份”靠唯一性。<br><br><strong style=\"color:#e67e22;\">🧠 预警：</strong>唯一才可靠。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "single", "stem": "将刷卡开锁程序烧录到主控板之前，需要完成的关键步骤是？", "options": ["修改程序列表中的电子标签编号", "直接烧录即可", "断开所有硬件连接", "删除判断逻辑"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>实现步骤为：连接硬件→修改程序列表中的电子标签编号→烧录到主控板→验证刷卡开锁功能。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>烧录前必须先配置正确的标签编号。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>烧录前准备工作是修改编号。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>改号再烧录。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "tf", "stem": "RFID读卡器属于输入模块，负责读取电子标签中的编号。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。输入模块由电子标签、RFID读卡器组成，用于读取电子标签中的编号。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>输入模块完成身份数据采集。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与模块划分一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>读卡即输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "tf", "stem": "舵机是一种用于采集环境数据的传感器。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。舵机是位置（角度）调节的驱动器（执行器），用于模拟打开门锁，不是采集数据的传感器。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>舵机属于输出/执行设备。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>舵机执行动作而非采集，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>舵机是执行。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "tf", "stem": "电子标签编码具有唯一性，可用于标识用户身份。", "options": ["正确", "错误"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>正确。门禁系统正是利用标签编号的唯一性来标识用户身份，实现精准管理。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>唯一性是身份关联的基础。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>编号唯一性。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "tf", "stem": "刷卡开锁只需读取电子标签即可，无需判断编号是否在列表中。", "options": ["正确", "错误"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>错误。必须先判断电子标签编号是否在存储列表中，只有编号匹配才执行开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>身份校验依赖列表匹配。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“无需判断”违背开锁逻辑，明显错误。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>不判不开锁。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "multi", "stem": "刷卡开锁功能的模块及对应硬件包括以下哪些？（多选）", "options": ["输入模块：电子标签、RFID读卡器", "计算模块：主控板", "计算模块：舵机（模拟门锁）", "加速度传感器"], "answer": [0, 1, 2], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>输入模块（电子标签、RFID读卡器）、计算模块（主控板）、计算模块（舵机模拟门锁）均属刷卡开锁系统；加速度传感器是公交站牌案例中的设备，不在此系统。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>注意舵机在教材中归入计算模块（执行开锁）。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>排除无关的加速度传感器即可。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>标签读卡主控舵。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "multi", "stem": "刷卡开锁功能的工作过程包括以下哪些环节？（多选）", "options": ["采集身份数据", "获取身份数据", "判断身份", "发送开锁指令"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>流程为采集身份数据→获取身份数据→判断身份→发送开锁指令→接收指令开锁，前四项均在列，全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>完整流程五步，本题覆盖前四步。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为流程组成部分，无干扰项则全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采获取判发。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "multi", "stem": "模拟实现刷卡开锁功能的一般步骤包括？（多选）", "options": ["正确连接计算机、主控板、RFID读卡器和舵机", "修改程序列表中的电子标签编号", "把程序烧录到主控板中", "验证刷卡开锁功能"], "answer": [0, 1, 2, 3], "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>四步均为教材给出的实现步骤：连接硬件、修改编号、烧录程序、验证功能。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>按步骤操作才能完成功能验证。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>均为正确步骤，全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>连改烧验。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "short", "stem": "简述刷卡开锁功能的工作流程。", "options": [""], "answer": "刷卡开锁工作流程为：①采集身份数据（RFID读卡器读取电子标签）；②获取身份数据（得到标签编号）；③判断身份（主控板用列表存储编号，判断读取的编号是否在列表中）；④若匹配则发送开锁指令；⑤接收指令开锁（舵机转动模拟打开门锁）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>按“采集—获取—判断—发送—接收开锁”五步描述。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>体现系统中的过程与控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>结合模块功能逐环节写出。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>采获取判发开。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "short", "stem": "物联门锁刷卡开锁系统中，输入模块、计算模块分别由哪些硬件组成，各完成什么功能？", "options": [""], "answer": "①输入模块：由电子标签、RFID读卡器组成，负责读取电子标签中的编号（采集身份数据）；②计算模块：由主控板组成，用列表存储电子标签编号，判断编号是否在列表中（身份校验）；并由舵机模拟打开门锁（模拟开锁动作）。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>输入采集编号，主控板判断，舵机执行。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>模块划分对应硬件与功能。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>按“硬件+功能”两要素作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>读卡采集、主控判断、舵机执行。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 12, "lessonTitle": "刷卡开锁易实现", "type": "short", "stem": "在实现小区门禁精准管理时，为什么可以利用电子标签编号的唯一性来标识用户身份？", "options": [""], "answer": "因为每个电子标签的编码具有唯一性，相当于每张卡有独一无二的“身份证号”。将门禁卡与业主身份数据关联后，系统只需判断读到的编号是否在授权列表中，即可精准识别业主身份，从而实现进入小区人员的精准管理。", "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>唯一性使每张卡可唯一对应一人，便于身份校验与管理。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>编号唯一性=身份唯一标识。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>从“唯一对应、便于校验”角度作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>一卡一身份。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第12课 刷卡开锁易实现"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "在物联系统中，用于反馈、显示通知内容的设备被称为？", "options": ["输入设备", "输出设备", "传感器", "传输设备"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>用于反馈的设备被称为输出设备，用户终端是输出设备，可显示通知内容。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈即针对现实世界采取行动，由输出设备完成。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“显示通知”是反馈，对应输出设备。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>反馈靠输出。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "在物联系统中，“反馈”指的是？", "options": ["采集环境数据的过程", "针对现实世界采取行动的过程", "传输数据的过程", "存储数据的过程"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>反馈就是针对现实世界采取行动的过程，可用于反馈的设备是输出设备。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>反馈让系统对现实世界产生作用。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“采取行动”是反馈本质。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>反馈即行动。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "门铃远程通知功能通常使用哪种通信协议来实现数据的发布与订阅？", "options": ["HTTP", "MQTT", "RFID", "NFC"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>远程通知可使用MQTT协议实现发布与订阅。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>MQTT是基于TCP/IP的轻量级发布/订阅协议。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>门铃通知依赖MQTT的发布订阅机制。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>通知用MQTT。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "在“门铃按、通知到”的工作过程中，门铃按下起到的作用是？", "options": ["输出结果", "触发条件", "数据分析", "网络传输"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>门铃按下是触发条件，触发后续的数据采集、发布与通知。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>触发条件启动整个流程。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“按下”是启动事件的触发条件。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>按下即触发。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "门铃远程通知功能中，按键传感器所属的功能模块是？", "options": ["输入模块", "计算模块", "输出模块", "网络模块"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>输入模块由主控板、按键传感器组成，负责采集门铃状态数据并发布至MQTT服务器相应主题。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>按键传感器采集触发状态。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“采集状态”属输入模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>按键是输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "门铃通知功能中，搭建MQTT服务器（计算模块）通常使用的硬件是？", "options": ["具备移动热点功能的计算机", "按键传感器", "舵机", "摄像头"], "answer": 0, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>计算模块由具备移动热点功能的计算机担任，负责搭建本地MQTT服务器、设置主题、实现发布与订阅。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>计算机作为服务平台中枢。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>MQTT服务器运行在带热点的计算机上。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>电脑搭MQTT。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "门铃端采集到按键状态后，将消息发布到哪里？", "options": ["直接显示在门铃上", "MQTT服务器相应主题", "本地硬盘", "互联网任意网站"], "answer": 1, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>门铃端（输入模块）采集按键状态数据后，将其发布至MQTT服务器相应主题。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>发布/订阅基于主题。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“发布”动作指向MQTT主题。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>发布到主题。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "single", "stem": "用户终端接收到“有人按门铃”通知并显示出来，这体现了物联系统的？", "options": ["数据采集", "网络传输", "输出（反馈）", "身份验证"], "answer": 2, "analysis": "<strong style=\"color:#c0392b;\">🎯 答案解析：</strong>用户终端显示通知内容，是系统对现实世界采取行动的反馈，由输出设备完成。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：</strong>通知显示属于输出/反馈环节。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：</strong>“显示通知”即反馈输出。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：</strong>显示即反馈。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：</strong>第三单元/第13课 门铃通知即时到"}, {"module": "第三单元 简单物联功能实践", "lesson": 13, "lessonTitle": "门铃通知即时到", "type": "singl
