用情况", "网管查看学校网络中用户使用日志", "网管出售学生信息", "网管查看网络内教师机流量使用情况"], "answer": 2, "analysis": "网管查看使用情况、使用日志、流量情况都属于正常职责，但<span style='font-weight:600;color:#dc2626'>出售学生信息属于侵犯个人隐私权</span>。"}, {"section": 12, "stem": "使用信息技术必须遵守相关法律法规，以下行为构成犯罪的是（　）。", "options": ["在网站上共享自己的旅游视频", "通过网络传播计算机病毒造成严重后果", "下载安徽基础教育资源平台上的课件", "通过电子邮件向老师提交作业"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>通过网络传播计算机病毒造成严重后果</span>严重危害了网络安全，构成违法犯罪。"}, {"section": 0, "stem": "下列属于动态信息的是（　）。", "options": ["历年的财务报表", "某次人口普查数据", "股票实时行情", "档案馆的档案记录"], "answer": 2, "analysis": "动态信息反映某项工作、活动的进程或事件发展变化情况，需随时更新。<span style='font-weight:600;color:#059669'>股票实时行情</span>随行情变化，属于动态信息；其余属于静态信息（反映历史情况）。"}, {"section": 0, "stem": "把与含义因素相联系的认识论信息称为（　）。", "options": ["语法信息", "语义信息", "语用信息", "静态信息"], "answer": 1, "analysis": "信息按表现形式分为：语法信息（与事物运动状态及变化方式相联系）、<span style='font-weight:600;color:#059669'>语义信息（与含义因素相联系）</span>、语用信息（与效用相联系）。"}, {"section": 0, "stem": "信息论的提出者是（　）。", "options": ["维纳", "香农", "图灵", "冯·诺依曼"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>香农</span>提出信息论，运用概率论与数理统计方法研究信息、信息熵、通信系统等问题；维纳是控制论的创始人。"}, {"section": 0, "stem": "在信息传输过程中，负责将消息信号变换为适合在信道中传输信号的设备是（　）。", "options": ["信息源", "发送器", "接收器", "信宿"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>发送器</span>将信息源产生的消息信号变换为适合在信道中传输的信号；接收器完成相反的变换；信宿是信息接收者。"}, {"section": 0, "stem": "信息集成工具中，各种素材用形象的图标依次连接在流程图中的是（　）。", "options": ["基于页面的工具", "基于图标的工具", "基于时间的工具", "基于数据库的工具"], "answer": 1, "analysis": "信息集成工具分三类：基于页面的工具（类似书本页）、<span style='font-weight:600;color:#059669'>基于图标的工具（素材用图标依次连接在流程图中）</span>、基于时间的工具（按时间顺序集成）。"}, {"section": 1, "stem": "从广义而言，信息技术是指能充分利用与扩展人类信息器官功能的各种方法、工具与技能的总和。该定义强调的是（　）。", "options": ["信息技术与人的本质关系", "信息技术的现代化含量", "信息技术的功能与过程", "信息技术的高科技含量"], "answer": 0, "analysis": "广义定义从<span style='font-weight:600;color:#059669'>哲学上阐述信息技术与人的本质关系</span>；狭义定义强调现代化与高科技含量；中义定义强调功能与过程的一般理解。"}, {"section": 1, "stem": "信息技术中扩展了人类传导神经功能的是（　）。", "options": ["感测技术", "通信技术", "计算机技术", "控制技术"], "answer": 1, "analysis": "四基元与人体器官对应：感测技术扩展感觉器官、<span style='font-weight:600;color:#059669'>通信技术扩展传导神经</span>、计算机技术扩展思维器官、控制技术扩展效应器官。"}, {"section": 1, "stem": "信息技术中扩展了人类效应器官功能的是（　）。", "options": ["感测技术", "通信技术", "计算机技术", "控制技术"], "answer": 3, "analysis": "<span style='font-weight:600;color:#059669'>控制技术</span>扩展效应器官的功能，是信息的使用技术，如预测恢复技术、神经网络控制技术。"}, {"section": 1, "stem": "信息技术发展的第四次革命的重要标志是（　）。", "options": ["语言的产生", "文字的创造", "印刷术的发明", "电报、电话、广播、电视的发明"], "answer": 3, "analysis": "第四次信息技术革命标志是<span style='font-weight:600;color:#059669'>电报、电话、广播、电视的发明</span>，电磁波的发现实现了有线/无线通信；第五次是计算机和网络的应用。"}, {"section": 1, "stem": "我国最早使用的印刷技术是（　）。", "options": ["雕版印刷", "活字印刷", "激光照排", "喷墨印刷"], "answer": 1, "analysis": "第三次信息技术革命标志是印刷术的发明，<span style='font-weight:600;color:#059669'>我国最早使用活字印刷</span>。"}, {"section": 1, "stem": "信息管理的过程包括（　）。", "options": ["收集、存储、加工、输出", "收集、传输、加工、存储", "采集、处理、传输、应用", "收集、加工、反馈、更新"], "answer": 1, "analysis": "信息管理的过程包括<span style='font-weight:600;color:#059669'>信息收集、信息传输、信息加工和信息存储</span>。"}, {"section": 1, "stem": "智能代理是一种具有（　）等特征的计算机系统。", "options": ["自主性、社会能力、反应性和能动性", "高速性、大容量、数字化", "普遍性、依附性、时效性", "准确性、客观性、权威性"], "answer": 0, "analysis": "智能代理本身是一个程序，按用户参数搜集感兴趣的信息，具有<span style='font-weight:600;color:#059669'>自主性、社会能力、反应性和能动性</span>等特征。"}, {"section": 1, "stem": "用数字化的方法把地球、地球上的活动及整个地球环境的时空变化存入计算机中，实现网络流通，这属于信息技术应用中的（　）。", "options": ["虚拟现实", "数字地球", "智能代理", "电子警察"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>数字地球</span>就是用数字化方法把地球、地球上的活动及整个地球环境的时空变化存入计算机，实现在网络上的流通。"}, {"section": 1, "stem": "1946年，美国研制出第一台电子计算机，其名称是（　）。", "options": ["EDVAC", "ENIAC", "UNIVAC", "EDSAC"], "answer": 1, "analysis": "1946年美国研制出第一台电子计算机<span style='font-weight:600;color:#059669'>ENIAC</span>，计算机联网实现了数据通信和数据共享。"}, {"section": 2, "stem": "书籍、报刊等属于（　）。", "options": ["文献型信息源", "口头型信息源", "电子型信息源", "实物型信息源"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>文献型信息源</span>指文献是记录知识的一种载体，如书籍、报刊等。"}, {"section": 2, "stem": "同学、父母、朋友、老师等属于（　）。", "options": ["文献型信息源", "口头型信息源", "电子型信息源", "实物型信息源"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>口头型信息源（个人型信息源）</span>如同同学、父母、朋友、老师等。"}, {"section": 2, "stem": "运动会、动物园、各类公共场所及事件属于（　）。", "options": ["文献型信息源", "口头型信息源", "电子型信息源", "实物型信息源"], "answer": 3, "analysis": "<span style='font-weight:600;color:#059669'>实物型信息源（现场信息源）</span>如运动会、动物园、各类公共场所及事件。"}, {"section": 2, "stem": "信息获取过程的第一步是（　）。", "options": ["选择信息来源", "定位信息需求", "确定信息获取方法", "保存信息"], "answer": 1, "analysis": "信息获取的一般过程：<span style='font-weight:600;color:#059669'>①定位信息需求</span>②选择信息来源③确定获取方法④保存信息⑤评价信息⑥反馈信息。"}, {"section": 2, "stem": "在信息获取的一般过程中，直接涉及信息获取效益、贯穿整个获取过程的重要步骤是（　）。", "options": ["保存信息", "反馈信息", "评价信息", "定位需求"], "answer": 2, "analysis": "<span style='font-weight:600;color:#059669'>评价信息</span>是以先前所确定的信息需求为依据对获取的信息进行评价，贯穿整个信息获取过程。"}, {"section": 2, "stem": "判断信息的各个要素是否真实可靠，分析论点论据，与同一信息进行比较，这属于信息价值判断原则中的（　）。", "options": ["准确性", "客观性", "权威性", "时效性"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>准确性</span>：判断信息的各个要素是否真实可靠，分析论点论据，运用逻辑推理和查阅的方法进行考证和调查。"}, {"section": 2, "stem": "考察信息提供者的身份及资质，属于信息价值判断原则中的（　）。", "options": ["准确性", "客观性", "权威性", "适用性"], "answer": 2, "analysis": "<span style='font-weight:600;color:#059669'>权威性</span>：考察信息提供者的身份及资质。"}, {"section": 2, "stem": "法官断案时，准确性、客观性、权威性应是判断的重点；而信息本身是不断发展变化的，则（　）是判断的重点。", "options": ["准确性", "客观性", "权威性", "时效性"], "answer": 3, "analysis": "信息本身是不断发展变化的，<span style='font-weight:600;color:#059669'>时效性</span>是判断的重点。这体现了信息判断的适用性原则——根据需求及使用目的不同有所侧重。"}, {"section": 2, "stem": "通过现场观察、问卷调查、访谈等方式获取信息的方法属于（　）。", "options": ["信息获取方法", "信息分类方法", "信息存储方法", "信息评价方法"], "answer": 0, "analysis": "常用的信息获取方法有：<span style='font-weight:600;color:#059669'>现场观察法、问卷调查法、访谈法、检索法、阅读法和视听法</span>等。"}, {"section": 2, "stem": "下列属于非实时信息交流的是（　）。", "options": ["QQ聊天", "微信语音", "E-mail收发邮件", "视频会议"], "answer": 2, "analysis": "非实时信息交流指双方可以不用同时在线，如<span style='font-weight:600;color:#059669'>E-mail、微博、BBS</span>；QQ、微信属于实时信息交流。"}, {"section": 3, "stem": "能直接作用于人的感官让人产生感觉的媒体是（　）。", "options": ["感觉媒体", "表示媒体", "表现媒体", "存储媒体"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>感觉媒体</span>指能直接作用于人的感官让人产生感觉的媒体，如语言、文字、音乐、图像、动画等。"}, {"section": 3, "stem": "内存、硬盘、软盘、磁带和光盘等属于（　）。", "options": ["感觉媒体", "表示媒体", "表现媒体", "存储媒体"], "answer": 3, "analysis": "<span style='font-weight:600;color:#059669'>存储媒体</span>指用于存储表示媒体的介质，包括内存、硬盘、软盘、磁带和光盘等。"}, {"section": 3, "stem": "流媒体最突出的特点是（　）。", "options": ["高压缩和可变流速率，可以边下载边播放", "必须下载完整文件才能播放", "只支持单播方式", "只能传输文字信息"], "answer": 0, "analysis": "流媒体采用流式传输方式，<span style='font-weight:600;color:#059669'>可以边下载边播放</span>，不需要等所有数据下载完才能播放。播放方式有单播、组播、广播。"}, {"section": 3, "stem": "JPEG标准主要针对的是（　）。", "options": ["运动图像", "静止图像", "音频信息", "三维动画"], "answer": 1, "analysis": "JPEG（联合图像专家组）是1986年制定的主要针对<span style='font-weight:600;color:#059669'>静止图像</span>的第一个图像压缩国际标准；MPEG针对运动图像（视频）。"}, {"section": 3, "stem": "用于压缩全动画视频的标准方法是（　）。", "options": ["JPEG", "MPEG", "PNG", "GIF"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>MPEG</span>是压缩全动画视频的一种标准方法，平均压缩比为50:1，常用于多媒体CD-ROM、硬盘、局域网等。"}, {"section": 3, "stem": "VOD的中文名称是（　）。", "options": ["视频点播系统", "计算机协同工作系统", "视频会议系统", "远程教学系统"], "answer": 0, "analysis": "VOD（Video On Demand）中文名称是<span style='font-weight:600;color:#059669'>视频点播系统</span>，根据观众的要求播放节目；CSCW是计算机支持的协同工作系统。"}, {"section": 3, "stem": "多媒体技术中，所有信息（文字、符号、图形、图像、声音和视频）都必须采样、编码变成二进制数字后才能由计算机综合处理，这是多媒体技术的（　）特征。", "options": ["数字化", "集成性", "交互性", "非线性"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>数字化</span>是多媒体技术的本质特征。所有媒体信息都必须转成二进制数才能由计算机处理。"}, {"section": 4, "stem": "下列关于PPI和DPI的说法，正确的是（　）。", "options": ["PPI只存在于计算机显示领域，DPI出现于打印或印刷领域", "PPI指每英寸的像点数，DPI指每英寸的像素数", "PPI和DPI都只存在于打印领域", "PPI和DPI含义完全相同"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>PPI指每英寸长度上的像素数，只存在于计算机显示领域；DPI指每英寸长度上的像点数，只出现于打印或印刷领域</span>。"}, {"section": 4, "stem": "CMYK色彩模式中的K代表（　）。", "options": ["青色", "洋红色", "黄色", "黑色"], "answer": 3, "analysis": "CMYK中C代表青色（Cyan）、M代表洋红色（Magenta）、Y代表黄色（Yellow）、<span style='font-weight:600;color:#059669'>K代表黑色（Black）</span>。CMYK采用减色法，用于印刷行业。"}, {"section": 4, "stem": "达到人眼分辨极限、发色数为1677万多色的颜色深度是（　）。", "options": ["8位", "16位", "24位", "32位"], "answer": 2, "analysis": "<span style='font-weight:600;color:#059669'>24位</span>色被称为真彩色，发色数是2的24次方，即1677万多色，可达到人眼分辨的极限；16位色的发色总数是65536色。"}, {"section": 4, "stem": "下列图像格式中，支持无损压缩且支持透明图片制作的是（　）。", "options": ["BMP", "PNG", "JPEG", "WMF"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>PNG</span>是无损压缩的网络图像格式，可把图像文件压缩到极限以利于网络传输，并支持透明图片的制作。"}, {"section": 5, "stem": "声音的音调高低取决于（　）。", "options": ["振幅", "频率", "波形", "响度"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>音调的高低与发声体振动的频率有关</span>，频率越低音调越低，频率越高音调越高；音量（响度）与振幅成正比。"}, {"section": 5, "stem": "关于MIDI文件，下列说法错误的是（　）。", "options": ["MIDI是乐器数字接口的简称", "MIDI文件中存储的是一些指令", "MIDI文件由声卡按照指令将声音合成出来", "MIDI文件可以记录人的声音"], "answer": 3, "analysis": "MIDI文件只能记录<span style='font-weight:600;color:#dc2626'>乐器的声音</span>，不能记录人的声音；而波形文件（如WAV）不仅可以记录乐器的声音，还可以记录人的声音。"}, {"section": 5, "stem": "在Flash动画制作中，按下F7键可以（　）。", "options": ["插入一个关键帧", "创建一个普通帧", "创建一个空白关键帧", "删除当前帧"], "answer": 2, "analysis": "Flash快捷键：<span style='font-weight:600;color:#059669'>F6插入关键帧、F5创建普通帧、F7创建空白关键帧</span>。"}, {"section": 5, "stem": "元件在舞台中的实际应用称为（　）。", "options": ["实例", "图层", "场景", "组件"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>元件在舞台中的实际应用称为实例</span>。一个元件可以创建多个实例；更改实例不影响元件，更改元件实例随之改变。"}, {"section": 6, "stem": "因特网（Internet）是（　）。", "options": ["世界上规模最大的计算机网络", "一种网络操作系统", "一个网站", "一种网络协议"], "answer": 0, "analysis": "因特网是一组全球信息资源的总汇，是<span style='font-weight:600;color:#059669'>世界范围内规模最大的计算机网络</span>，由许多子网互联而成的逻辑网。"}, {"section": 6, "stem": "采用“网页，仅HTML”方式保存网页，下列说法正确的是（　）。", "options": ["能保存网页中的图片", "只能保存当前页面，图片等无法保存", "会自动生成文件夹", "保存的文件是mht格式"], "answer": 1, "analysis": "“网页，仅HTML”方式<span style='font-weight:600;color:#059669'>只能保存当前页面</span>，如果页面涉及图片等是无法保存的。网页全部方式才会生成页面文件和文件夹。"}, {"section": 6, "stem": "同时按下（　）组合键，可以打开浏览过的历史记录窗口。", "options": ["Ctrl+F", "Ctrl+H", "Ctrl+N", "Ctrl+S"], "answer": 1, "analysis": "打开我的电脑或浏览器，同时按下<span style='font-weight:600;color:#059669'>Ctrl+H</span>组合键，窗口左侧会弹出浏览过的历史记录的小窗口。"}, {"section": 6, "stem": "统一资源标识符的英文缩写是（　）。", "options": ["HTTP", "HTML", "URL", "WWW"], "answer": 2, "analysis": "Web信息资源由统一资源标识符（<span style='font-weight:600;color:#059669'>URL</span>）所标记，它是一张网页、一张图片、一段视频或任何在Web上呈现的内容。"}, {"section": 6, "stem": "市场占有率第一且支持Windows、Linux、Mac多平台，同时提供移动端应用的浏览器是（　）。", "options": ["IE", "Chrome", "Safari", "Firefox"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>Chrome浏览器</span>由Google开发，市场占有率第一，不仅支持Windows平台，还支持Linux、Mac系统，也提供了移动端应用。"}, {"section": 6, "stem": "使用Gecko排版引擎的自由及开放源代码的网页浏览器是（　）。", "options": ["Chrome", "IE", "Firefox", "Safari"], "answer": 2, "analysis": "<span style='font-weight:600;color:#059669'>Firefox（火狐）</span>是自由及开放源代码的网页浏览器，使用Gecko排版引擎，支持Windows、Mac OSX及GNU/Linux等操作系统。"}, {"section": 6, "stem": "基于IE和Chrome双内核，拥有全国最大恶意网址库的浏览器是（　）。", "options": ["360安全浏览器", "Safari", "Chrome", "Firefox"], "answer": 0, "analysis": "<span style='font-weight:600;color:#059669'>360安全浏览器</span>是360安全中心推出的基于IE和Chrome双内核的浏览器，拥有全国最大的恶意网址库，可自动拦截挂马、欺诈等恶意网址。"}, {"section": 6, "stem": "主要为Mac系统量身打造，主要应用在Mac和iOS系统中的浏览器是（　）。", "options": ["IE", "Chrome", "Firefox", "Safari"], "answer": 3, "analysis": "<span style='font-weight:600;color:#059669'>Safari浏览器</span>是Apple公司为Mac系统量身打造的一款浏览器，主要应用在Mac和iOS系统中。"}, {"section": 6, "stem": "在“文件”菜单上指向“发送”，然后点击“电子邮件页面”或“电子邮件链接”，这属于（　）。", "options": ["保存网页", "用电子邮件发送网页", "创建桌面快捷方式", "设置网页为墙纸"], "answer": 1, "analysis": "在“文件”菜单上指向“发送”，然后点击“电子邮件页面”或“电子邮件链接”，是<span style='font-weight:600;color:#059669'>用电子邮件发送网页</span>的操作。注意必须设置电子邮件账户和程序。"}, {"section": 7, "stem": "既包括数值数据的检索、算术运算、比较和数学推导，也包括非数值数据（如事实、概念、思想、知识等）的检索、比较、演绎和逻辑推理，这种检索是（　）。", "options": ["数据检索", "事实检索", "文献检索", "全文检索"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>事实检索</span>既包括数值数据的检索、运算比较，也包括非数值数据的检索、演绎和逻辑推理；数据检索侧重准确数据；文献检索以文献为对象。"}, {"section": 7, "stem": "以文献为对象，查找某个课题的有关文献的一种检索是（　）。", "options": ["数据检索", "事实检索", "文献检索", "多媒体检索"], "answer": 2, "analysis": "<span style='font-weight:600;color:#059669'>文献检索</span>以文献为对象，是查找某个课题的有关文献的一种检索。"}, {"section": 7, "stem": "目前最大的基于互联网出版的知识搜索引擎是（　）。", "options": ["百度", "谷歌", "中国知网", "雅虎"], "answer": 2, "analysis": "知识搜索是建立在以用户需求为基础上的知识整合传播，国内的代表是<span style='font-weight:600;color:#059669'>中国知网</span>，是目前最大的基于互联网出版的知识搜索引擎。"}, {"section": 7, "stem": "CARS评价指标中，C代表（　）。", "options": ["可信度", "准确度", "合理性", "相关支持"], "answer": 0, "analysis": "CARS指标：<span style='font-weight:600;color:#059669'>C-可信度（credibility）</span>、A-准确度（accuracy）、R-合理性（reasonable）、S-相关支持（support）。"}, {"section": 7, "stem": "CARS评价指标中，影响准确度的要素有时效性、全面性和（　）。", "options": ["针对性", "公正性", "客观性", "一致性"], "answer": 0, "analysis": "看信息资源的准确度主要看网页的更新时间是否及时、信息是否全面而不单一，即影响准确度的要素有<span style='font-weight:600;color:#059669'>时效性、全面性和针对性</span>。"}, {"section": 7, "stem": "因特网信息资源评价标准中，最重要、最基本的标准是（　）。", "options": ["范围", "信息质量", "易用性", "稳定性"], "answer": 1, "analysis": "因特网信息资源评价标准：信息质量（<span style='font-weight:600;color:#059669'>最重要、最基本的标准</span>）、范围、易用性、稳定性和连续性。"}, {"section": 7, "stem": "检索“中国 AND 经济危机”，表示（　）。", "options": ["同时包含“中国”和“经济危机”两个词的网页", "包含“中国”或“经济危机”任一词的网页", "不包含“经济危机”的网页", "只包含“中国”的网页"], "answer": 0, "analysis": "AND（逻辑与）表示查询结果必须<span style='font-weight:600;color:#059669'>同时包含两个词</span>；OR表示任意一个词出现即可；NOT表示不包含指定词。"}, {"section": 8, "stem": "下列不属于5G技术特点的是（　）。", "options": ["高速率", "低时延", "大连接", "高资费"], "answer": 3, "analysis": "5G的特点：<span style='font-weight:600;color:#059669'>高速率、大带宽、低时延、高可靠、广覆盖、大连接</span>。高资费不属于5G技术特点。"}, {"section": 8, "stem": "云计算服务模式中，SaaS表示（　）。", "options": ["基础设施即服务", "平台即服务", "应用即服务", "数据即服务"], "answer": 2, "analysis": "云计算四种服务模式：IaaS基础设施即服务、PaaS平台即服务、<span style='font-weight:600;color:#059669'>SaaS应用即服务</span>、DaaS数据即服务。"}, {"section": 8, "stem": "物联网整体架构中，由各种传感器构成、负责识别物体和采集信息的是（　）。", "options": ["感知层", "网络层", "平台层", "应用层"], "answer": 0, "analysis": "物联网四层架构：<span style='font-weight:600;color:#059669'>感知层</span>（传感器识别采集）、网络层（中枢传递）、平台层（数据存储检索核心）、应用层（用户接口）。"}, {"section": 8, "stem": "大数据5V特点中，Variety表示（　）。", "options": ["大量", "高速", "多样", "真实性"], "answer": 2, "analysis": "大数据5V特点（IBM提出）：Volume大量、Velocity高速、<span style='font-weight:600;color:#059669'>Variety多样</span>、Value低价值密度、Veracity真实性。"}, {"section": 8, "stem": "区块链最主要的两个特征是（　）。", "options": ["去中心化和信息不可篡改", "开放性和匿名性", "自治性和开放性", "去中心化和开放性"], "answer": 0, "analysis": "区块链五大特征：去中心化、开放性、自治性、信息不可篡改、匿名性。<span style='font-weight:600;color:#059669'>最主要的两个特征：去中心化和信息不可篡改</span>。"}, {"section": 8, "stem": "京东、当当属于电子商务模式中的（　）。", "options": ["B2B", "B2C", "C2C", "O2O"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>B2C（企业对个人）</span>如沃尔玛超市、京东、当当；B2B（企业对企业）如阿里巴巴；C2C（个人对个人）如淘宝；O2O（线上线下结合）如美团。"}, {"section": 9, "stem": "信息在传输、交换、存储和处理过程中保持非修改、非破坏和非丢失的特性，即保持信息的原样性，这是信息安全目标中的（　）。", "options": ["机密性", "完整性", "可用性", "可控性"], "answer": 1, "analysis": "<span style='font-weight:600;color:#059669'>完整性</span>指信息在传输、交换、存储和处理过程中保持非修改、非破坏、非丢失，是最基本的安全特征。"}, {"section": 9, "stem": "衡量网络信息系统面向用户的一种安全性能，指信息能够被授权用户正确访问，这是信息安全目标中的（　）。", "options": ["机密性", "完整性", "可用性", "可审查性"], "answer": 2, "analysis": "<span style='font-weight:600;color:#059669'>可用性</span>指信息能够被授权用户正确访问，包括系统正常运行时能正确存取所需信息，遭受攻击时能恢复数据。"}, {"section": 9, "stem": "参与信息通信的双方在信息交换过程中都不可能否认或抵赖本人的真实身份，这是信息安全目标中的（　）。", "options": ["机密性", "完整性", "可用性", "可审查性"], "answer": 3, "analysis": "<span style='font-weight:600;color:#059669'>可审查性（不可否认性）</span>指参与信息通信的双方在信息交换过程中都不可能否认或抵赖本人的真实身份，以及提供信息的原样性和完成的操作与承诺。"}, {"section": 9, "stem": "下列属于主动防御保护技术的是（　）。", "options": ["防火墙技术", "数据加密", "口令验证", "审计跟踪"], "answer": 1, "analysis": "主动防御保护技术一般包括：<span style='font-weight:600;color:#059669'>数据加密、身份鉴别、存取控制、权限设置和虚拟专用网</span>；防火墙、口令验证、审计跟踪属于被动防御技术。"}, {"section": 9, "stem": "被公认是保护网络信息安全的最实用方法的是（　）。", "options": ["数据加密", "身份鉴别", "存取控制", const STATE = {
  currentSection: 0,
  currentTab: 'read',
  currentQuizIndex: 0,
  quizAnswers: {},       // {qIndex: selectedOptionIndex}
  quizSubmitted: {},     // {qIndex: true}
  doneSections: new Set(),
  bookmarks: new Set(),
  errorQuestions: new Set(),
  openChapters: new Set(['第一章 信息与信息技术']),
  theme: 'light',
  searchQuery: ''
};

// ============ 初始化 ============
function init() {
  loadState();
  renderSidebar();
  renderContent();
  updateProgress();
  updateErrorCount();
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('infotech_kb_state') || '{}');
    if (saved.doneSections) STATE.doneSections = new Set(saved.doneSections);
    if (saved.bookmarks) STATE.bookmarks = new Set(saved.bookmarks);
    if (saved.errorQuestions) STATE.errorQuestions = new Set(saved.errorQuestions);
    if (saved.openChapters) STATE.openChapters = new Set(saved.openChapters);
    if (saved.theme) STATE.theme = saved.theme;
    if (saved.quizAnswers) STATE.quizAnswers = saved.quizAnswers;
    if (saved.quizSubmitted) STATE.quizSubmitted = saved.quizSubmitted;
  } catch(e) {}
  applyTheme();
}

function saveState() {
  localStorage.setItem('infotech_kb_state', JSON.stringify({
    doneSections: [...STATE.doneSections],
    bookmarks: [...STATE.bookmarks],
    errorQuestions: [...STATE.errorQuestions],
    openChapters: [...STATE.openChapters],
    theme: STATE.theme,
    quizAnswers: STATE.quizAnswers,
    quizSubmitted: STATE.quizSubmitted
  }));
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', STATE.theme);
  document.getElementById('themeIcon').textContent = STATE.theme === 'dark' ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = STATE.theme === 'dark' ? '亮色模式' : '暗色模式';
}

// ============ 侧边栏 ============
function getChapterGroups() {
  // Group sections by chapter
  const groups = {};
  KB_DATA.sections.forEach((s, si) => {
    const ch = s.chapter || '其他';
    if (!groups[ch]) groups[ch] = [];
    groups[ch].push({section: s, si: si});
  });
  return groups;
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = '';
  const groups = getChapterGroups();
  Object.keys(groups).forEach((chName) => {
    const items = groups[chName];
    const isOpen = STATE.openChapters.has(chName);
    const chDone = items.filter(it => STATE.doneSections.has(it.si)).length;
    html += '<div class="chapter-group">';
    html += `<button class="chapter-title ${isOpen ? 'open' : ''}" onclick="toggleChapter('${chName.replace(/'/g, "\\'")}')">`;
    html += `<span class="arrow">▶</span>${chName}`;
    html += `<span class="count">${chDone}/${items.length}节</span>`;
    html += '</button>';
    html += `<div class="section-list ${isOpen ? 'open' : ''}" id="sectionList-${chName}">`;
    items.forEach(({section, si}) => {
      const isActive = si === STATE.currentSection;
      const isDone = STATE.doneSections.has(si);
      const quizCount = KB_DATA.quizzes.filter(q => q.section === si).length;
      html += `<div class="section-row ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectSection(${si})">`;
      html += `<span class="check">${isDone ? '✓' : ''}</span>`;
      html += `<span class="section-title">${section.title}</span>`;
      html += `<button class="mini-quiz-btn" onclick="event.stopPropagation();selectSectionAndQuiz(${si})" title="本节练习(${quizCount}题)">📝${quizCount}</button>`;
      html += '</div>';
    });
    html += '</div></div>';
  });
  nav.innerHTML = html;
}

function toggleChapter(chName) {
  if (STATE.openChapters.has(chName)) {
    STATE.openChapters.delete(chName);
  } else {
    STATE.openChapters.add(chName);
  }
  renderSidebar();
}

function selectSection(si) {
  STATE.currentSection = si;
  STATE.currentTab = 'read';
  // Auto-expand the chapter containing this section
  const sec = KB_DATA.sections[si];
  if (sec && sec.chapter) STATE.openChapters.add(sec.chapter);
  switchTab('read');
  renderSidebar();
  renderContent();
  document.getElementById('sidebar').classList.remove('open');
}

function selectSectionAndQuiz(si) {
  STATE.currentSection = si;
  STATE.currentTab = 'quiz';
  const sec = KB_DATA.sections[si];
  if (sec && sec.chapter) STATE.openChapters.add(sec.chapter);
  // Find first quiz question index for this section
  const firstQ = KB_DATA.quizzes.findIndex(q => q.section === si);
  if (firstQ >= 0) STATE.currentQuizIndex = firstQ;
  switchTab('quiz');
  renderSidebar();
  renderContent();
  document.getElementById('sidebar').classList.remove('open');
}

// ============ 标签页切换 ============
function switchTab(tab) {
  STATE.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
  document.getElementById('readContent').style.display = tab === 'read' ? 'block' : 'none';
  document.getElementById('quizContent').style.display = tab === 'quiz' ? 'block' : 'none';
  document.getElementById('bookmarksContent').style.display = tab === 'bookmarks' ? 'block' : 'none';
  document.getElementById('errorsContent').style.display = tab === 'errors' ? 'block' : 'none';
  renderContent();
  if (tab === 'read') document.getElementById('searchInput').value = STATE.searchQuery;
}

// ============ 内容渲染 ============
function renderContent() {
  if (STATE.currentTab === 'read' || STATE.currentTab === 'bookmarks' || STATE.currentTab === 'errors') {
    renderReadContent();
  }
  if (STATE.currentTab === 'quiz') {
    renderQuizContent();
  }
  document.getElementById('breadcrumbCurrent').textContent = (KB_DATA.sections[STATE.currentSection]?.chapter || '') +
    (KB_DATA.sections[STATE.currentSection] ? ' › ' : '') + (KB_DATA.sections[STATE.currentSection]?.title || '第一章');
}

function renderReadContent() {
  const container = document.getElementById('readContent');
  const section = KB_DATA.sections[STATE.currentSection];
  let cards = section.cards;

  // Handle bookmarks tab
  if (STATE.currentTab === 'bookmarks') {
    const allCards = KB_DATA.sections.flatMap((s, si) => s.cards.map(c => ({...c, sectionIdx: si, sectionTitle: s.title})));
    cards = allCards.filter(c => STATE.bookmarks.has(c.id));
    if (cards.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">⭐</div><h3>暂无收藏</h3><p>点击知识卡片下方的"收藏"按钮来添加</p></div>';
      container.style.display = 'block';
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('bookmarksContent').style.display = 'block';
      document.getElementById('errorsContent').style.display = 'none';
      return;
    }
    document.getElementById('readContent').style.display = 'block';
    document.getElementById('quizContent').style.display = 'none';
    document.getElementById('bookmarksContent').style.display = 'block';
    document.getElementById('errorsContent').style.display = 'none';

    let html = `<div class="section-header"><h2>⭐ 我的收藏</h2><div class="meta">共 ${cards.length} 个收藏</div></div>`;
    cards.forEach(c => {
      html += renderCard(c, true);
    });
    container.innerHTML = html;
    return;
  }

  // Handle errors tab
  if (STATE.currentTab === 'errors') {
    const errorQuizList = KB_DATA.quizzes.filter((_, i) => STATE.errorQuestions.has(i));
    if (errorQuizList.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">📝</div><h3>暂无错题</h3><p>做错的题目会自动收入错题本</p></div>';
      document.getElementById('readContent').style.display = 'block';
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('bookmarksContent').style.display = 'none';
      document.getElementById('errorsContent').style.display = 'block';
      return;
    }
    document.getElementById('readContent').style.display = 'block';
    document.getElementById('quizContent').style.display = 'none';
    document.getElementById('bookmarksContent').style.display = 'none';
    document.getElementById('errorsContent').style.display = 'block';

    let html = `<div class="section-header"><h2>📝 错题本</h2><div class="meta">共 ${errorQuizList.length} 道错题</div></div>`;
    errorQuizList.forEach((q, idx) => {
      const qi = KB_DATA.quizzes.indexOf(q);
      html += renderErrorQuiz(q, qi, idx + 1);
    });
    container.innerHTML = html;
    return;
  }

  // Normal read mode
  document.getElementById('readContent').style.display = 'block';
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('bookmarksContent').style.display = 'none';
  document.getElementById('errorsContent').style.display = 'none';

  let html = `<div class="section-header">`;
  html += `<h2>${section.title}</h2>`;
  html += `<div class="meta">`;
  html += `<span>📄 ${section.cards.length} 个知识点</span>`;
  html += `<span>📝 ${KB_DATA.quizzes.filter(q => q.section === STATE.currentSection).length} 道练习题</span>`;
  html += `</div></div>`;

  let filteredCards = cards;
  if (STATE.searchQuery) {
    const q = STATE.searchQuery.toLowerCase();
    filteredCards = cards.filter(c => {
      const text = c.title + c.html.replace(/<[^>]*>/g, '');
      return text.toLowerCase().includes(q);
    });
    if (filteredCards.length === 0) {
      html += '<div class="empty-state"><div class="icon">🔍</div><h3>未找到匹配的知识点</h3><p>试试其他关键词</p></div>';
    }
  }

  filteredCards.forEach(c => {
    html += renderCard(c);
  });

  html += `<div style="text-align:center;margin-top:24px">`;
  html += `<button class="btn btn-primary" onclick="markSectionDone(${STATE.currentSection})" ${STATE.doneSections.has(STATE.currentSection) ? 'disabled' : ''}>`;
  html += STATE.doneSections.has(STATE.currentSection) ? '✅ 已学完本节' : '✓ 标记本节为已学';
  html += '</button>';
  html += '</div>';

  container.innerHTML = html;
}

function renderCard(card, showSection = false) {
  let html = `<div class="knowledge-card" id="card-${card.id}">`;
  html += `<h3><span class="icon">${card.icon}</span>${card.title}</h3>`;
  if (showSection && card.sectionTitle) {
    html += `<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">📂 ${card.sectionTitle}</div>`;
  }
  html += card.html;
  if (card.tags) {
    html += '<div class="tag-row">';
    card.tags.forEach(t => {
      html += `<span class="tag">${t}</span>`;
    });
    html += '</div>';
  }
  html += `<div class="card-actions">`;
  html += `<button class="card-action-btn ${STATE.bookmarks.has(card.id) ? 'bookmarked':''}" onclick="toggleBookmark('${card.id}')">`;
  html += STATE.bookmarks.has(card.id) ? '⭐ 已收藏' : '☆ 收藏';
  html += '</button>';
  html += '</div></div>';
  return html;
}

function renderErrorQuiz(q, qi, num) {
  const sectionTitle = KB_DATA.sections[q.section]?.title || '';
  const labels = ['A','B','C','D'];
  let html = `<div class="quiz-container">`;
  html += `<div class="quiz-header"><span class="quiz-section-label">${sectionTitle}</span><span style="font-size:12px;color:var(--text-muted)">#${num}</span></div>`;
  html += `<div class="quiz-question">${qi + 1}. ${q.stem}</div>`;
  html += `<div class="quiz-options">`;
  q.options.forEach((opt, oi) => {
    let cls = '';
    if (oi === q.answer) cls = 'correct';
    html += `<div class="quiz-option ${cls}"><span class="option-letter">${labels[oi]}</span>${opt}</div>`;
  });
  html += '</div>';
  html += `<div class="analysis-box show">${q.analysis}</div>`;
  html += `<div class="quiz-actions">`;
  html += `<button class="btn btn-outline" onclick="removeError(${qi})">✓ 已掌握，移除</button>`;
  html += '</div></div>';
  return html;
}

// ============ 练习模式 ============
function renderQuizContent() {
  const container = document.getElementById('quizContent');
  const sectionQuizzes = KB_DATA.quizzes.filter(q => q.section === STATE.currentSection);
  const total = KB_DATA.quizzes.length;
  const sectionTotal = sectionQuizzes.length;

  // Show score summary if all questions in current section are answered
  const allAnswered = sectionQuizzes.every((_, i) => {
    const qi = KB_DATA.quizzes.indexOf(sectionQuizzes[i]);
    return STATE.quizSubmitted[qi];
  });

  if (allAnswered) {
    const correct = sectionQuizzes.filter((_, i) => {
      const qi = KB_DATA.quizzes.indexOf(sectionQuizzes[i]);
      return STATE.quizAnswers[qi] === sectionQuizzes[i].answer;
    }).length;
    const pct = Math.round((correct / sectionTotal) * 100);

    let html = '<div class="score-display">';
    html += `<div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">${KB_DATA.sections[STATE.currentSection].title} · 练习成绩</div>`;
    html += `<div class="score-number">${pct}%</div>`;
    html += '<div class="stats-row">';
    html += `<div class="stat-item"><div class="stat-value" style="color:var(--success)">${correct}</div><div class="stat-label">正确</div></div>`;
    html += `<div class="stat-item"><div class="stat-value" style="color:var(--danger)">${sectionTotal - correct}</div><div class="stat-label">错误</div></div>`;
    html += `<div class="stat-item"><div class="stat-value">${sectionTotal}</div><div class="stat-label">总计</div></div>`;
    html += '</div>';
    html += '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">';
    html += '<button class="btn btn-primary" onclick="resetSectionQuiz()">🔄 重新练习</button>';
    if (sectionQuizzes.some((_, i) => STATE.quizAnswers[KB_DATA.quizzes.indexOf(sectionQuizzes[i])] !== sectionQuizzes[i].answer)) {
      html += '<button class="btn btn-outline" onclick="reviewSectionErrors()">📝 回看本节错题</button>';
    }
    html += '</div>';
    html += '</div>';

    // Show all questions with results
    sectionQuizzes.forEach((q, si) => {
      const qi = KB_DATA.quizzes.indexOf(q);
      html += renderQuizResult(q, qi, si + 1);
    });

    container.innerHTML = html;
    return;
  }

  const q = sectionQuizzes[STATE.currentQuizIndex - KB_DATA.quizzes.indexOf(sectionQuizzes[0])] || sectionQuizzes[0];
  const qi = KB_DATA.quizzes.indexOf(q);
  const localIdx = STATE.currentQuizIndex - KB_DATA.quizzes.indexOf(sectionQuizzes[0]);
  const submitted = STATE.quizSubmitted[qi];
  const selected = STATE.quizAnswers[qi];
  const labels = ['A','B','C','D'];

  let html = '<div class="section-header">';
  html += `<h2>${KB_DATA.sections[STATE.currentSection].title} · 章节练习</h2>`;
  html += `<div class="meta"><span>第 ${localIdx + 1}/${sectionTotal} 题</span></div>`;
  html += '</div>';

  html += '<div class="quiz-container">';
  html += `<div class="quiz-question">${qi + 1}. ${q.stem}</div>`;
  html += '<div class="quiz-options">';
  q.options.forEach((opt, oi) => {
    let cls = '';
    if (submitted) {
      if (oi === q.answer) cls = 'correct';
      else if (oi === selected && oi !== q.answer) cls = 'wrong';
    } else if (oi === selected) {
      cls = 'selected';
    }
    html += `<div class="quiz-option ${cls}" onclick="selectOption(${qi}, ${oi})">`;
    html += `<span class="option-letter">${labels[oi]}</span>${opt}`;
    html += '</div>';
  });
  html += '</div>';

  // Analysis
  html += `<div class="analysis-box ${submitted ? 'show' : ''}" id="analysis${qi}">${q.analysis}</div>`;

  // Actions
  html += '<div class="quiz-actions">';
  if (!submitted) {
    html += `<button class="btn btn-primary" onclick="submitAnswer(${qi})" ${selected === undefined ? 'disabled' : ''}>确认提交</button>`;
  }
  html += `<button class="btn btn-outline" onclick="prevQuiz()">上一题</button>`;
  html += `<button class="btn btn-outline" onclick="nextQuiz()">下一题</button>`;
  if (STATE.errorQuestions.has(qi)) {
    html += `<button class="btn btn-outline" style="color:var(--danger)" onclick="removeError(${qi})">从错题本移除</button>`;
  }
  html += '</div>';
  html += '</div>';

  // Dots navigation
  html += '<div class="quiz-nav">';
  sectionQuizzes.forEach((sq, idx) => {
    const qi2 = KB_DATA.quizzes.indexOf(sq);
    let dotCls = '';
    if (idx === localIdx) dotCls += ' current';
    if (STATE.quizSubmitted[qi2]) {
      dotCls += STATE.quizAnswers[qi2] === sq.answer ? ' correct-dot' : ' wrong-dot';
    }
    html += `<button class="quiz-nav-dot ${dotCls}" onclick="goToQuestion(${qi2})">${idx + 1}</button>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

function renderQuizResult(q, qi, num) {
  const labels = ['A','B','C','D'];
  const submitted = STATE.quizSubmitted[qi];
  const selected = STATE.quizAnswers[qi];
  const correct = submitted && selected === q.answer;

  let html = '<div class="quiz-container">';
  html += `<div class="quiz-header"><span class="quiz-section-label" style="background:${correct ? 'var(--success-light)' : 'var(--danger-light)'};color:${correct ? 'var(--success)' : 'var(--danger)'}">${correct ? '✓ 正确' : '✗ 错误'}</span><span style="font-size:12px;color:var(--text-muted)">#${num}</span></div>`;
  html += `<div class="quiz-question">${qi + 1}. ${q.stem}</div>`;
  html += '<div class="quiz-options">';
  q.options.forEach((opt, oi) => {
    let cls = '';
    if (oi === q.answer) cls = 'correct';
    else if (oi === selected && oi !== q.answer) cls = 'wrong';
    html += `<div class="quiz-option ${cls}"><span class="option-letter">${labels[oi]}</span>${opt}</div>`;
  });
  html += '</div>';
  html += `<div class="analysis-box show">${q.analysis}</div>`;
  html += '</div>';
  return html;
}

// ============ 练习操作 ============
function selectOption(qi, oi) {
  if (STATE.quizSubmitted[qi]) return;
  STATE.quizAnswers[qi] = oi;
  saveState();
  renderQuizContent();
}

function submitAnswer(qi) {
  if (STATE.quizAnswers[qi] === undefined) return;
  STATE.quizSubmitted[qi] = true;
  const q = KB_DATA.quizzes[qi];
  if (STATE.quizAnswers[qi] !== q.answer) {
    STATE.errorQuestions.add(qi);
  }
  saveState();
  updateErrorCount();
  renderQuizContent();
}

function findLastSectionQuizIdx(sectionIdx) {
  let last = -1;
  for (let i = 0; i < KB_DATA.quizzes.length; i++) {
    if (KB_DATA.quizzes[i].section === sectionIdx) last = i;
  }
  return last;
}

function prevQuiz() {
  const sectionStart = KB_DATA.quizzes.findIndex(q => q.section === STATE.currentSection);
  const sectionEnd = findLastSectionQuizIdx(STATE.currentSection);
  if (STATE.currentQuizIndex > sectionStart) {
    STATE.currentQuizIndex--;
  }
  renderQuizContent();
}

function nextQuiz() {
  const sectionEnd = findLastSectionQuizIdx(STATE.currentSection);
  if (STATE.currentQuizIndex < sectionEnd) {
    STATE.currentQuizIndex++;
  }
  renderQuizContent();
}

function goToQuestion(qi) {
  STATE.currentQuizIndex = qi;
  renderQuizContent();
}

function resetSectionQuiz() {
  const sectionQuizzes = KB_DATA.quizzes.filter(q => q.section === STATE.currentSection);
  sectionQuizzes.forEach(q => {
    const qi = KB_DATA.quizzes.indexOf(q);
    delete STATE.quizAnswers[qi];
    delete STATE.quizSubmitted[qi];
     STATE.errorQuestions.delete(qi);
  });
  const firstQ = KB_DATA.quizzes.findIndex(q => q.section === STATE.currentSection);
  STATE.currentQuizIndex = firstQ >= 0 ? firstQ : 0;
  saveState();
  updateErrorCount();
  renderQuizContent();
}

function reviewSectionErrors() {
  // Switch to errors tab
  STATE.currentTab = 'errors';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('errorsTab').classList.add('active');
  document.getElementById('errorsTab').style.display = '';
  document.getElementById('readContent').style.display = 'block';
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('bookmarksContent').style.display = 'none';
  document.getElementById('errorsContent').style.display = 'block';
  renderContent();
}

function removeError(qi) {
  STATE.errorQuestions.delete(qi);
  saveState();
  updateErrorCount();
  if (STATE.currentTab === 'errors') renderContent();
  if (STATE.currentTab === 'quiz') renderQuizContent();
}

// ============ 收藏 ============
function toggleBookmark(cardId) {
  if (STATE.bookmarks.has(cardId)) {
    STATE.bookmarks.delete(cardId);
    showToast('已取消收藏');
  } else {
    STATE.bookmarks.add(cardId);
    showToast('已加入收藏夹');
  }
  saveState();
  renderContent();
}

function toggleBookmarks() {
  const tabBtn = document.getElementById('bookmarksTab');
  tabBtn.style.display = '';
  STATE.currentTab = 'bookmarks';
  switchTab('bookmarks');
  const allBookmarks = KB_DATA.sections.flatMap(s => s.cards).filter(c => STATE.bookmarks.has(c.id));
  if (allBookmarks.length === 0) {
    document.getElementById('bookmarksContent').innerHTML = '<div class="empty-state"><div class="icon">⭐</div><h3>暂无收藏</h3><p>点击知识卡片下方的"收藏"按钮来添加</p></div>';
  }
}

function toggleErrors() {
  const tabBtn = document.getElementById('errorsTab');
  tabBtn.style.display = '';
  STATE.currentTab = 'errors';
  switchTab('errors');
}

// ============ 节完成标记 ============
function markSectionDone(si) {
  STATE.doneSections.add(si);
  saveState();
  updateProgress();
  renderSidebar();
  renderContent();
  setTimeout(() => showToast('✅ 已标记本节为已学'), 300);
}

function updateProgress() {
  const total = KB_DATA.sections.length;
  const done = STATE.doneSections.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateErrorCount() {
  document.getElementById('errorCount').textContent = STATE.errorQuestions.size > 0 ? `(${STATE.errorQuestions.size})` : '';
}

// ============ 搜索 ============
function onSearch() {
  STATE.searchQuery = document.getElementById('searchInput').value.trim();
  if (STATE.currentTab !== 'read') {
    switchTab('read');
  }
  renderContent();
}

// ============ 主题 ============
function toggleTheme() {
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveState();
}

// ============ 错题导出 ============
function exportErrorsCSV() {
  const errors = KB_DATA.quizzes.filter((_, i) => STATE.errorQuestions.has(i));
  if (errors.length === 0) {
    showToast('暂无错题可导出');
    return;
  }
  const labels = ['A','B','C','D'];
  let csv = '\uFEFF序号,题目,选项A,选项B,选项C,选项D,正确答案,你的答案,解析\n';
  errors.forEach((q, idx) => {
    const qi = KB_DATA.quizzes.indexOf(q);
    const yourAnswer = STATE.quizAnswers[qi] !== undefined ? labels[STATE.quizAnswers[qi]] : '未答';
    const correctAnswer = labels[q.answer];
    const stem = q.stem.replace(/"/g, '""');
    const opts = q.options.map(o => o.replace(/"/g, '""'));
    const analysis = q.analysis.replace(/<[^>]*>/g, '').replace(/"/g, '""');
    csv += `${idx + 1},"${stem}","${opts[0] || ''}","${opts[1] || ''}","${opts[2] || ''}","${opts[3] || ''}","${correctAnswer}","${yourAnswer}","${analysis}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '信息技术_错题导出.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ============ 移动端 ============
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============ Toast ============
function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

document.addEventListener('DOMContentLoaded', function() {
  try { init(); } catch(e) { console.error('初始化失败:', e); }
});
