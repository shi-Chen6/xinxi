虫<\/strong>自动获取网页，极大提升效率。网页排序基本依据：关键词出现次数。<\/p>"},{"no":15,"title":"第15课 互联网实验齐发现","html":"<h4>常用网络命令速查<\/h4>\n<table class=\"kb-table\">\n<tr><th>命令<\/th><th>功能<\/th><\/tr>\n<tr><td><code>ipconfig<\/code><\/td><td>查看IP配置（IPv4、IPv6、DNS等）<\/td><\/tr>\n<tr><td><code>ping<\/code><\/td><td>测试连通性 + 获取域名对应IP<\/td><\/tr>\n<tr><td><code>tracert<\/code><\/td><td>追踪通信路径<\/td><\/tr>\n<tr><td><code>netstat<\/code><\/td><td>查看网络连接状态<\/td><\/tr>\n<\/table>\n<p><strong>数据封装过程：<\/strong>数据从上到下在不同层流动，每层加上含有本层控制信息的头部——应用层HTTP数据 → 传输层加TCP头部 → 网络层加IP头部 → 网络接口层传输，体现分层封装思想。<\/p>\n\n<div class=\"note-box\">\n<div class=\"note-title\">💡 记忆要点<\/div>\n<p style=\"font-size:13px;\"><strong>三种服务：<\/strong>FTP文件、SMTP/POP邮件、WWW万维网；<strong>万维网≠互联网<\/strong>；<strong>分布式+网状结构<\/strong>；<strong>HTTP明文→HTTPS加密<\/strong>；<strong>搜索引擎=以空间换时间<\/strong>；<strong>四个命令：<\/strong>ipconfig/ping/tracert/netstat<\/p>\n<\/div>"}]},{"id":"unit4","no":"四","title":"校园活动线上展","page":"P85-102","head":"<h2><span class=\"lesson-num\">四<\/span> 校园活动线上展 <span class=\"page-ref\">(P85-102)<\/span><\/h2>\n\n<div class=\"note-box\">\n<div class=\"note-title\">📌 单元引言<\/div>\n<p style=\"font-size:14px;\">本单元以\"校园科技节\"为情境，学习HTML语言、CSS样式表、Markdown语言和多人协同制作方法，最终完成网站组建与发布。在实操中感悟科技创新的意义。<\/p>\n<\/div>\n\n<h3>学习目标<\/h3>\n<ul>\n<li>了解网页与代码之间的对应关系，初步认识HTML语言和常用标签<\/li>\n<li>了解制作网站的基本流程，能编写简单的HTML代码制作网页<\/li>\n<li>知道串联样式表(CSS)的作用，初步学会用它美化网页<\/li>\n<li>了解多人协同制作网页的优势，认识Markdown语言的特点<\/li>\n<li>熟悉超链接的用法，能将分散的页面组织为完整的网站<\/li>\n<\/ul>","lessons":[{"no":16,"title":"第16课 探秘网页与代码","html":"<p><strong class=\"recitable\">HTML（超文本标记语言）<\/strong>用于描述网页。双标签如 <code>&lt;html&gt;&lt;/html&gt;<\/code> 成对出现；单标签如 <code>&lt;img&gt;<\/code>。<\/p>\n<h4>常用HTML标签速查<\/h4>\n<table class=\"kb-table\">\n<tr><th>标签<\/th><th>作用<\/th><th>示例<\/th><\/tr>\n<tr><td><code>&lt;html&gt;<\/code><\/td><td>文档根元素<\/td><td>成对使用<\/td><\/tr>\n<tr><td><code>&lt;head&gt;<\/code><\/td><td>文档头部信息<\/td><td>含title等<\/td><\/tr>\n<tr><td><code>&lt;title&gt;<\/code><\/td><td>网页标题<\/td><td>显示在浏览器标签<\/td><\/tr>\n<tr><td><code>&lt;body&gt;<\/code><\/td><td>网页主体内容<\/td><td>所有可见内容<\/td><\/tr>\n<tr><td><code>&lt;h1&gt;~&lt;h6&gt;<\/code><\/td><td>标题<\/td><td>&lt;h1&gt;一级标题&lt;/h1&gt;<\/td><\/tr>\n<tr><td><code>&lt;p&gt;<\/code><\/td><td>段落<\/td><td>&lt;p&gt;文字内容&lt;/p&gt;<\/td><\/tr>\n<tr><td><code>&lt;img&gt;<\/code><\/td><td>图像（单标签）<\/td><td>&lt;img src=\"图片地址\"&gt;<\/td><\/tr>\n<tr><td><code>&lt;a&gt;<\/code><\/td><td>超链接<\/td><td>&lt;a href=\"网址\"&gt;文字&lt;/a&gt;<\/td><\/tr>\n<\/table>\n<p>图像可用<strong>文件路径<\/strong>或<strong>base64数据编码<\/strong>两种方式显示。浏览器将HTML代码转换为图文并茂的网页。<\/p>"},{"no":17,"title":"第17课 制作网页展活动","html":"<p><strong>网站制作六步流程：<\/strong>确定主题 → 搜集素材 → 确定结构（主页、导航、布局） → 制作网页（可AI辅助生成） → 美化网页 → 发布网站。<\/p>\n<p>网站一般由多个网页组成，默认显示的第一个网页叫<strong>主页<\/strong>。流程非严格线性，可能有反复。<\/p>"},{"no":18,"title":"第18课 美化网页方法多","html":"<p><strong class=\"recitable\">CSS（串联样式表/级联样式表）：<\/strong>描述网页外观和格式。语法：<strong>选择器 { 属性: 值; }<\/strong>。<\/p>\n<h4>常用CSS属性<\/h4>\n<table class=\"kb-table\">\n<tr><th>属性<\/th><th>作用<\/th><\/tr>\n<tr><td><code>color<\/code><\/td><td>文字颜色<\/td><\/tr>\n<tr><td><code>font-family<\/code><\/td><td>字体<\/td><\/tr>\n<tr><td><code>font-size<\/code><\/td><td>字号<\/td><\/tr>\n<tr><td><code>background-color<\/code><\/td><td>背景颜色<\/td><\/tr>\n<tr><td><code>text-align<\/code><\/td><td>文本对齐<\/td><\/tr>\n<tr><td><code>text-indent<\/code><\/td><td>首行缩进<\/td><\/tr>\n<\/table>\n<p><strong>HTML像\"建筑师\"<\/strong>搭建结构，<strong>CSS像\"装潢设计师\"<\/strong>美化外观。CSS比HTML属性美化效果更丰富、操作更高效。<\/p>"},{"no":19,"title":"第19课 多人协同效率高","html":"<p>多人协同优势：实时协作提高效率、分工提高质量、实时反馈便于修改、相互学习丰富技能。<\/p>\n<p><strong class=\"recitable\">Markdown语言：<\/strong>语法简洁——<code>#<\/code>标题、<code>**粗体**<\/code>、<code>*斜体*<\/code>、<code>![图片](地址)<\/code>，适合多人协同场景（HTML标签多且分散易冲突）。<\/p>"},{"no":20,"title":"第20课 组建网站跟我做","html":"<p>网站通过<strong>超链接<\/strong>实现页面跳转：<code>&lt;a href=\"链接地址\"&gt;显示内容&lt;/a&gt;<\/code>。<\/p>\n<p>图像超链接：<code>&lt;a href=\"链接地址\"&gt;&lt;img src=\"图像位置\"&gt;&lt;/a&gt;<\/code>。<\/p>\n<p><strong>评测五要素：<\/strong>文字准确、图像恰当、链接正确、布局合理、内容健康。<\/p>\n<p>《未成年人网络保护条例》要求提供真实身份信息。注意区分 <code>&lt;img&gt;<\/code> 的 <code>src<\/code> 属性（图像地址）和 <code>&lt;a&gt;<\/code> 的 <code>href<\/code> 属性（链接地址）。<\/p>\n\n<div class=\"note-box\">\n<div class=\"note-title\">💡 记忆要点<\/div>\n<p style=\"font-size:13px;\"><strong>HTML<\/strong> = 建筑师（结构），<strong>CSS<\/strong> = 装潢师（美化）；<strong>Markdown<\/strong> = 简洁协作语言；<strong>网站六步：<\/strong>主题→素材→结构→制作→美化→发布；<strong>评测五要素：<\/strong>文/图/链/版/康<\/p>\n<\/div>"}]},{"id":"unit5","no":"五","title":"互联网创新应用","page":"P103-126","head":"<h2><span class=\"lesson-num\">五<\/span> 互联网创新应用 <span class=\"page-ref\">(P103-126)<\/span><\/h2>\n\n<div class=\"note-box\">\n<div class=\"note-title\">📌 单元引言<\/div>\n<p style=\"font-size:14px;\">本单元带领学生感受移动互联网的发展，体验在线学习变革、在线生活创新和在线交流新气象，了解云计算与云存储原理，并通过短视频创作综合运用互联网创新应用。<\/p>\n<\/div>\n\n<h3>学习目标<\/h3>\n<ul>\n<li>了解移动互联网的发展过程，理解技术创新对移动互联网的推动作用<\/li>\n<li>知道在线学习的三大变革，了解在线学习面临的问题<\/li>\n<li>能合理应用互联网提高生活质量，了解互联网创新的方式<\/li>\n<li>理解数字形象的重要性，知道维护良好数字形象的方法<\/li>\n<li>了解云存储、云计算等创新应用，能使用网盘进行数据备份<\/li>\n<li>掌握短视频制作的基本流程，能利用互联网进行创作<\/li>\n<\/ul>","lessons":[{"no":21,"title":"第21课 移动互联新发展","html":"<h4>移动通信技术发展<\/h4>\n<table class=\"kb-table\">\n<tr><th>代际<\/th><th>时代<\/th><th>特征<\/th><th>我国地位<\/th><\/tr>\n<tr><td>1G<\/td><td>语音时代<\/td><td>模拟信号，仅语音通话<\/td><td><span class=\"tag tag-warn\">空白<\/span><\/td><\/tr>\n<tr><td>2G<\/td><td>文本时代<\/td><td>数字信号，语音+短信<\/td><td><span class=\"tag tag-core\">跟随<\/span><\/td><\/tr>\n<tr><td>3G<\/td><td>图像时代<\/td><td>移动互联网开端，传输图像<\/td><td><span class=\"tag tag-mem\">突破<\/span><\/td><\/tr>\n<tr><td>4G<\/td><td>视频时代<\/td><td>高速，视频为主的应用<\/td><td><span class=\"tag tag-core\">并跑<\/span><\/td><\/tr>\n<tr><td>5G<\/td><td>无限可能<\/td><td>高速/低时延/容量大<\/td><td><span class=\"tag tag-mem\">领跑<\/span><\/td><\/tr>\n<\/table>\n<p>我国路线：<strong class=\"recitable\">1G空白→2G跟随→3G突破→4G并跑→5G领跑<\/strong>。<\/p>\n<p><strong>新媒体<\/strong>：利用数字化技术的传播模式（数字化、互动性、超文本、虚拟性、网络化、模拟性）。<strong>自媒体<\/strong>：公众个人或团队独立运作，\"人人是通信员，个个是传播者\"。<\/p>"},{"no":22,"title":"第22课 在线学习新变革","html":"<p><strong>三大变革：<\/strong><\/p>\n<ol>\n<li><strong>突破时空限制：<\/strong>突破时间、空间和人数限制（如\"天宫课堂\"天地实时协同）<\/li>\n<li><strong>海量数字资源：<\/strong>数量大、类型多、更新快（国家中小学智慧教育平台4.4万条资源）<\/li>\n<li><strong>个性化学习：<\/strong>学习网站提供实时反馈和评估，因材施教成为可能<\/li>\n<\/ol>\n<p>我国已基本建成<strong class=\"recitable\">世界第一大教育教学资源库<\/strong>，中小学互联网接入率100%。<\/p>\n<p><strong>挑战：<\/strong>网络保障不足、优质资源不足、师生互动和情感交流不足。<\/p>"},{"no":23,"title":"第23课 在线生活创意多","html":"<p><strong class=\"recitable\">互联网创新两种方式：<\/strong><\/p>\n<ol>\n<li><strong>打通数据节点形成创新服务<\/strong>——如物流快递实时调度系统<\/li>\n<li><strong>为老技术找新场景<\/strong>——如二维码从汽车配件标识→支付入口<\/li>\n<\/ol>\n<p><strong>创新带来的挑战：<\/strong>岗位替代、失败风险、违法应用、数字鸿沟等。<\/p>"},{"no":24,"title":"第24课 在线交流新气象","html":"<p>在线交流特点：<strong class=\"recitable\">跨时空、更广泛、更多样<\/strong>（群聊天、视频会议、屏幕共享、读书平台划线评论等）。<\/p>\n<p><strong class=\"recitable\">维护数字形象：<\/strong>保持真实性、礼貌言辞、精选内容、保护隐私、积极参与有意义的讨论。<\/p>\n<p><span class=\"tag tag-warn\">信息茧房<\/span>：人们倾向接收符合自己兴趣观点的信息，形成封闭的、自我强化的信息循环。<strong>回音室效应<\/strong>：相似观点被巩固加强，导致两极分化。2022年《互联网信息服务算法推荐管理规定》实施。<\/p>"},{"no":25,"title":"第25课 网络创新云服务","html":"<p><strong class=\"recitable\">\"云\"<\/strong>是全新的计算模式。资源所在称<strong>云端<\/strong>，使用设备称<strong>云终端<\/strong>。<\/p>\n<p><strong class=\"recitable\">云计算：<\/strong>利用云端大量运算设备完成本地无法完成的复杂计算。<strong class=\"recitable\">云存储：<\/strong>多种存储设备整合提供存储服务（网盘、云盘）。<\/p>\n<p><strong>秒传原理：<\/strong>摘要算法生成文件数字摘要（同一文件摘要相同），相同文件只需建链接不需上传。<\/p>\n<p><span class=\"tag tag-warn\">安全提示：<\/span>重要数据应先<strong>加密<\/strong>再上传云端。<\/p>"},{"no":26,"title":"第26课 创意展示我家乡","html":"<p><strong>短视频制作六步：<\/strong>定主题 → 选场景 → 写文案（可AI辅助）→ 备素材（网络获取+AI生成+云存储共享）→ 视频剪辑（过渡、背景音乐、片头片尾）→ 发布分享。<\/p>\n\n<div class=\"note-box\">\n<div class=\"note-title\">💡 记忆要点<\/div>\n<p style=\"font-size:13px;\"><strong>5G发展路线：<\/strong>1G空白→2G跟随→3G突破→4G并跑→5G领跑；<strong>在线学习三大变革：<\/strong>时空突破→海量资源→个性化；<strong>信息茧房<\/strong>+<strong>回音室效应<\/strong>；<strong>云服务<\/strong>：云计算+云存储+秒传；<strong>短视频六步<\/strong><\/p>\n<\/div>"}]},{"id":"unit6","no":"六","title":"共同守护互联网","page":"P127-145","head":"<h2><span class=\"lesson-num\">六<\/span> 共同守护互联网 <span class=\"page-ref\">(P127-145)<\/span><\/h2>\n\n<div class=\"note-box\">\n<div class=\"note-title\">📌 单元引言<\/div>\n<p style=\"font-size:14px;\">本单元聚焦网络安全与责任，涵盖个人信息防泄露、数字版权保护、企业信息社会责任和网络生态建设。培养学生安全防护意识，理解自主可控对国家安全的重要意义，做负责任的数字公民。<\/p>\n<\/div>\n\n<h3>学习目标<\/h3>\n<ul>\n<li>了解个人信息泄露的途径，知道保护个人信息的方法<\/li>\n<li>了解数字版权的含义和保护技术，知道相关法律法规<\/li>\n<li>理解互联网企业应承担的信息社会责任<\/li>\n<li>了解网络暴力、网络谣言、网络水军现象，知道应对措施<\/li>\n<\/ul>","lessons":[{"no":27,"title":"第27课 个人信息防泄露","html":"<h4>各类应用涉及的个人信息<\/h4>\n<table class=\"kb-table\">\n<tr><th>应用类型<\/th><th>涉及信息<\/th><\/tr>\n<tr><td>网购<\/td><td>手机号、姓名、地址、购买记录<\/td><\/tr>\n<tr><td>学习应用<\/td><td>姓名、学校、学习记录<\/td><\/tr>\n<tr><td>即时通信<\/td><td>位置、联系人、聊天记录<\/td><\/tr>\n<tr><td>地图导航<\/td><td>位置、出发地、目的地<\/td><\/tr>\n<tr><td>健康服务<\/td><td>心跳、睡眠情况<\/td><\/tr>\n<\/table>\n\n<h4>三大泄露途径<\/h4>\n<ol>\n<li><strong>免费公共Wi-Fi<\/strong>——认证页面+木马窃听<\/li>\n<li><strong>照片原图<\/strong>——含手机型号、拍摄时间、GPS位置<\/li>\n<li><strong>恶意二维码<\/strong>——指向钓鱼网站收集信息<\/li>\n<\/ol>\n\n<h4>保护措施<\/h4>\n<p>强密码+定期更换 | 谨慎使用公共Wi-Fi | 定期更新系统和杀毒软件 | 定期备份数据。泄露后第一时间暂停账号并改密码。<\/p>\n<p><strong>密码安全原则：<\/strong>6位以上长度 + 大小写字母数字特殊符号 + 易记但与个人信息无关 + 有特定使用范围和时间。<\/p>\n\n<h4>法律依据<\/h4>\n<p><strong>《个人信息保护法》<\/strong>核心：公开透明(第7条)、信息质量(第8条)、安全措施(第9条)、不得非法收集买卖提供(第10条)。<strong>AI挑战：<\/strong>训练数据含个人信息、AI分析偏好可能泄露信息、AI涉及行为监控和数据追踪。<\/p>"},{"no":28,"title":"第28课 数字版权要保护","html":"<p><strong class=\"recitable\">数字版权<\/strong>是作品作者及权利人在数字化复制、传播方面依法享有的精神权利和经济权利的总称。<\/p>\n<h4>保护技术<\/h4>\n<p>限制质量 | 限制内容 | 加水印 | 限制时长<\/p>\n<h4>相关法律<\/h4>\n<p>《著作权法》《著作权法实施条例》《计算机软件著作权登记办法》《著作权行政处罚实施办法》。<strong>\"剑网\"专项行动<\/strong>2005年启动，截至2023年已开展19次。<\/p>\n<p><span class=\"tag tag-warn\">创新是引领发展的第一动力，保护知识产权就是保护创新。<\/span><\/p>\n<p><strong>AI挑战：<\/strong>生成式AI可写文章、生成图像和音乐。《生成式人工智能服务管理暂行办法》2023年8月15日起施行。<\/p>"},{"no":29,"title":"第29课 企业责任勇担当","html":"<h4>互联网企业五大信息社会责任<\/h4>\n<ol>\n<li><strong>保护个人信息<\/strong>——掌握用户信息的互联网企业必须承担保护责任<\/li>\n<li><strong>尊重知识产权<\/strong>——遵守版权法律法规<\/li>\n<li><strong>维护文明与道德<\/strong>——建立内容审核和过滤机制<\/li>\n<li><strong>保障网络安全<\/strong>——采取必要技术和管理措施<\/li>\n<li><strong>勇于创新<\/strong>——推进自主可控技术研发<\/li>\n<\/ol>\n<p><strong>过度收集信息的危害：<\/strong>形成用户画像→用户在企业面前变得透明→国家社会经济情况可被挖掘。<\/p>\n<p><strong class=\"recitable\">关键信息基础设施<\/strong>（金融、能源、电力、通信、交通等）是网络安全重中之重。我国在芯片、通信技术、下一代互联网、数据库软件等领域推进<strong class=\"recitable\">自主可控<\/strong>。<\/p>"},{"no":30,"title":"第30课 网络生态建设好","html":"<h4>四大网络乱象及应对<\/h4>\n<table class=\"kb-table\">\n<tr><th>乱象<\/th><th>定义<\/th><th>应对措施<\/th><\/tr>\n<tr><td><strong>网络暴力<\/strong><\/td><td>侮辱、诽谤、威胁、恐吓、人肉搜索<\/td><td>法律+教育+平台管理综合治理；《网络暴力信息治理规定》2024.8.1施行<\/td><\/tr>\n<tr><td><strong>网络谣言<\/strong><\/td><td>捏造传播虚假信息扰乱秩序<\/td><td>向老师家长求证→向平台投诉→通过cyberpolice.mps.gov.cn反映<\/td><\/tr>\n<tr><td><strong>网络水军<\/strong><\/td><td>被雇佣写手伪装普通网民发布倾向性内容<\/td><td>打击利益链+强化平台责任+提高公众意识<\/td><\/tr>\n<tr><td><strong>网络戾气<\/strong><\/td><td>\"标题党\"炒作、营销账号等<\/td><td>\"清朗\"系列专项行动集中整治<\/td><\/tr>\n<\/table>\n<p><strong>诽谤入罪标准：<\/strong>同一诽谤信息实际被点击浏览次数达到5000次以上，或被转发次数达到500次以上。<\/p>\n<p><strong>\"清朗\"系列专项行动：<\/strong>中央网信办部署，集中整治网络违法违规问题。<\/p>\n\n<div class=\"note-box\">\n<div class=\"note-title\">💡 记忆要点<\/div>\n<p style=\"font-size:13px;\"><strong>三大泄露途径：<\/strong>公共Wi-Fi→原图照片→恶意二维码；<strong>保护技术：<\/strong>限质/限内容/水印/限时；<strong>企业五大责任：<\/strong>个人信息/知识产权/文明道德/网络安全/创新；<strong>四大乱象：<\/strong>暴力→谣言→水军→戾气；<strong>诽谤标准：<\/strong>点击5000次或转发500次<\/p>\n<\/div>"}]}]},"g8":{"outline":"<h2>课程纲要<\/h2>\n\n<h3>一、模块设计说明<\/h3>\n<p>与互联网相比，物联网出现的时间不长，其体系和结构还处于发展演化中。本模块围绕物联网的基本思想、原理、方法与过程，概述物联网的\"感知—采集—传输—反馈—控制\"流程，以简易物联系统为抓手，从微观层面呈现大部分技术性内容。<\/p>\n<ol>\n  <li>本模块共30课，分6个单元。教师可以结合学情，适当调整各课内容。第五单元的实践案例可根据本地实际情况选择。<\/li>\n  <li>本模块既有基本原理和基本概念的阐述，也有实践性较强的内容。建议把实践性较强的课程安排在信息科技实验室展开，这样会有更好的教学效果，也可以帮助学生拓展学习。<\/li>\n  <li>本模块内容涉及一些程序代码，不必对特定程序设计语言展开详细讲解，引导学生理解主要代码即可。<\/li>\n  <li>不同物联实验设备的连接和使用方法不同，教师可根据实际教学情况补充相关内容，不必围绕某一产品讲解。<\/li>\n<\/ol>\n\n<h3>二、数字素养与技能培养<\/h3>\n<p>在网络世界中，各种物联设备随处可见，\"自主可控\"\"虚拟身份\"不再是抽象概念，而是更具体、更现实的存在。在这种真实、复杂的环境中带领学生开展实践活动，引导学生积极探索和理性思考，可以有效提升学生的数字素养与技能。<\/p>\n<p><strong>信息意识<\/strong><\/p>\n<ol>\n  <li>通过体验物联网的数据交互方式，了解万物互联和智能感知对信息社会发展的作用，感受物联网给人们的学习、生活和工作方式带来的改变。<\/li>\n  <li>增强主动学习物联网知识、掌握核心技术的意识，具有自主解决问题的意识，加强虚拟身份识别和数据安全意识，做好安全防护。<\/li>\n<\/ol>\n<p><strong>计算思维<\/strong><\/p>\n<ol>\n  <li>在实践应用中，熟悉数字平台中技术工具、软件系统的功能与应用，知道数字设备获取数据的方法，理解网络中数据编码、传输和呈现的原理。<\/li>\n  <li>能够根据需求，设计和搭建简单的物联系统原型，结合项目活动采集、分析和呈现数据，解决实际问题，发展计算思维。<\/li>\n<\/ol>\n<p><strong>数字化学习与创新<\/strong><\/p>\n<ol>\n  <li>在学习过程中，了解物联网\"大场景\"\"小应用\"的特点，选择恰当的数字设备和数字平台支持学习，搭建系统原型探究信息科技支持数字化学习的新方法、新模式，具备利用信息科技进行自主学习和合作学习的能力。<\/li>\n  <li>能够主动利用数字设备开展实践创新活动，并在创新活动中认识到原始创新对可持续发展的重要性。<\/li>\n<\/ol>\n<p><strong>信息社会责任<\/strong><\/p>\n<ol>\n  <li>在物联网应用中，了解网络空间中物品标识和虚拟身份的意义，知道数据安全防护的常用方法和策略，保护个人隐私，尊重他人隐私。<\/li>\n  <li>了解自主可控对国家安全及物联网未来发展的重要意义。<\/li>\n  <li>遵循信息科技领域的伦理道德规范，明确科技活动中应遵循的价值观念、道德责任和行为准则。<\/li>\n<\/ol>\n\n<h3>三、内容要求<\/h3>\n<ol>\n  <li>通过实例感受万物互联的场景，知道物联网与互联网的异同，认识到物联网的普及对学习和生活的影响。<\/li>\n  <li>通过对身边真实应用场景中物联网的分析，认识物联网实现万物互联的基本原理。<\/li>\n  <li>自觉遵守物联网实验的操作规程，会使用实验设备搭建物联系统原型，并能通过实验平台读取、发送、接收、汇集和使用数据。<\/li>\n  <li>通过简易物联系统的设计与搭建，探索物联网中数据采集、处理、反馈控制等基本功能，体验物联网、大数据及人工智能的关系。<\/li>\n  <li>了解身边的物联设备及其对塑造网络虚拟身份的作用，有意识地保护个人隐私，进行安全防护。<\/li>\n  <li>了解物联网中发展自主可控技术的意义，了解自主可控生态体系对我国国家安全的重要作用。<\/li>\n<\/ol>\n\n<h3>四、学业要求<\/h3>\n<ol>\n  <li>能理解万物互联的含义，知道物联网协同互联网使实时定位、远程监控、分享众筹等新型服务和应用成为可能。<\/li>\n  <li>根据学习任务的需要和可用的实验设备，设计并搭建具有数据采集、实时传输和简单控制功能的简易物联系统。<\/li>\n  <li>能通过智能终端或编写程序，读取并处理含有物联功能设备中的数据，并进行适当反馈或控制。<\/li>\n  <li>初步体会物联网与大数据、人工智能之间的关系，并利用相关知识解决一些跨学科的实际问题，认识物联网中自主可控技术的重要作用。<\/li>\n<\/ol>\n\n<h3>五、单元主题与课标内容要求对照表<\/h3>\n<p>说明：下表\"对应课标内容要求\"中的数字，对应上文\"三、内容要求\"的条目编号（1—6）。<\/p>\n<table class=\"kb-table\">\n  <thead>\n    <tr>\n      <th>单元<\/th>\n      <th>单元主题<\/th>\n      <th>课名称<\/th>\n      <th>核心内容<\/th>\n      <th>对应课标内容要求<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td rowspan=\"5\">第一单元<\/td>\n      <td rowspan=\"5\">从感知到物联<\/td>\n      <td>第1课 开启物联网之门<\/td>\n      <td>物联网中的\"物\"指什么，物联网与互联网的关系，我国物联网的发展<\/td>\n      <td>1、5<\/td>\n    <\/tr>\n    <tr>\n      <td>第2课 传感之古今未来<\/td>\n      <td>传感器的工作原理，不同时期传感器的特点<\/td>\n      <td>1、6<\/td>\n    <\/tr>\n    <tr>\n      <td>第3课 环境数据要感知<\/td>\n      <td>利用传感器开展实践探索<\/td>\n      <td>1<\/td>\n    <\/tr>\n    <tr>\n      <td>第4课 物物相连有价值<\/td>\n      <td>物联网的价值：丰富实时的数据、远程控制和协同智能<\/td>\n      <td>1、5<\/td>\n    <\/tr>\n    <tr>\n      <td>第5课 物联功能趣体验<\/td>\n      <td>查看互联网中的物联数据，体验远程控制和远程监测功能<\/td>\n      <td>2<\/td>\n    <\/tr>\n    <tr>\n      <td rowspan=\"5\">第二单元<\/td>\n      <td rowspan=\"5\">万物互联有协议<\/td>\n      <td>第6课 数据传输方式多<\/td>\n      <td>物联网数据传输方式，涉及多种协议<\/td>\n      <td>1、2<\/td>\n    <\/tr>\n    <tr>\n      <td>第7课 电子标签我揭秘<\/td>\n      <td>RFID的工作原理，读取电子标签编号实践探索<\/td>\n      <td>1、3、5<\/td>\n    <\/tr>\n    <tr>\n      <td>第8课 巧用蓝牙做工具<\/td>\n      <td>蓝牙的工作原理，近距离通信的特点，蓝牙翻页笔实践探索<\/td>\n      <td>1、3<\/td>\n    <\/tr>\n    <tr>\n      <td>第9课 互联协议仍沿用<\/td>\n      <td>HTTP的工作原理，互联网中天气数据实践探索<\/td>\n      <td>1、3<\/td>\n    <\/tr>\n    <tr>\n      <td>第10课 物物互通有新径<\/td>\n      <td>MQTT的工作原理，发布及订阅功能实践探索<\/td>\n      <td>1、2<\/td>\n    <\/tr>\n    <tr>\n      <td rowspan=\"5\">第三单元<\/td>\n      <td rowspan=\"5\">简单物联功能实践<\/td>\n      <td>第11课 物联功能细分解<\/td>\n      <td>物联系统分为感知层、网络层和应用层，物联门锁系统的功能分解<\/td>\n      <td>2、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第12课 刷卡开锁易实现<\/td>\n      <td>刷卡开锁功能实践探索<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第13课 门铃通知即时到<\/td>\n      <td>物联网中的反馈，远程通知功能实践探索<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第14课 远程控制更便捷<\/td>\n      <td>物联网中的控制，远程控制功能实践探索<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第15课 面容钥匙显智能<\/td>\n      <td>人脸识别探究，人脸识别开锁功能实践探索<\/td>\n      <td>3、4、5<\/td>\n    <\/tr>\n    <tr>\n      <td rowspan=\"5\">第四单元<\/td>\n      <td rowspan=\"5\">简易物联系统实践<\/td>\n      <td>第16课 模块功能先划分<\/td>\n      <td>简易物联系统的工作环节、功能需求，划分功能模块<\/td>\n      <td>2、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第17课 物联数据需采集<\/td>\n      <td>利用传感器获取数据，通过互联网获取数据，传输与存储数据<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第18课 数据分析与处理<\/td>\n      <td>从物联系统中获取数据，处理数据的方法<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第19课 数据呈现可视化<\/td>\n      <td>可视化呈现数据的作用、方式和方法<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第20课 反馈控制有算法<\/td>\n      <td>根据数据设计算法，实现反馈与控制<\/td>\n      <td>3、4<\/td>\n    <\/tr>\n    <tr>\n      <td rowspan=\"5\">第五单元<\/td>\n      <td rowspan=\"5\">物联网应用探索<\/td>\n      <td>第21课 文物保护新手段<\/td>\n      <td>物联网在文物保护中的应用，利用物联实验设备实践探索<\/td>\n      <td>1、2、3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第22课 健康生活新设备<\/td>\n      <td>物联网在生活中的应用，利用物联实验设备实践探索<\/td>\n      <td>1、2、3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第23课 医疗设施新功能<\/td>\n      <td>物联网在医疗中的应用，利用物联实验设备实践探索<\/td>\n      <td>1、2、3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第24课 农业生产新模式<\/td>\n      <td>物联网在农业中的应用，利用物联实验设备实践探索<\/td>\n      <td>1、2、3、4<\/td>\n    <\/tr>\n    <tr>\n      <td>第25课 学习探究新工具<\/td>\n      <td>物联网在学习中的应用，利用物联实验设备实践探索<\/td>\n      <td>1、2、3、4<\/td>\n    <\/tr>\n    <tr>\n      <td rowspan=\"5\">第六单元<\/td>\n      <td rowspan=\"5\">物联网安全<\/td>\n      <td>第26课 数字世界有身份<\/td>\n      <td>物联网中虚拟身份的内涵、作用<\/td>\n      <td>1、5<\/td>\n    <\/tr>\n    <tr>\n      <td>第27课 安全事件与风险<\/td>\n      <td>物联网中常见的安全事件及存在的安全风险<\/td>\n      <td>1、6<\/td>\n    <\/tr>\n    <tr>\n      <td>第28课 安全防范讲策略<\/td>\n      <td>物联网感知层、网络层和应用层的安全防范策略<\/td>\n      <td>5、6<\/td>\n    <\/tr>\n    <tr>\n      <td>第29课 自主可控意义大<\/td>\n      <td>外部依赖与风险，自主可控的内涵及生态建设<\/td>\n      <td>6<\/td>\n    <\/tr>\n    <tr>\n      <td>第30课 系统安全需升级<\/td>\n      <td>通过摄像头活体检测、用户身份认证和加密传输提升物联门锁安全性，利用物联实验设备实践探索<\/td>\n      <td>1、3、4、5<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>","units":[{"id":"u1","no":"一","title":"从感知到物联","page":"","head":"<div class=\"note-box\"><div class=\"note-title\">📌 单元引言<\/div><p>物联网的基本含义是\"万物互联\"，即在互联网的基础上，将人与人的互联延伸扩展到人与物、物与物的互联。物联网是继互联网之后又一种新型信息基础设施，是推动大数据和人工智能等信息科技发展不可或缺的重要组成部分。<\/p>\n<p>本单元是\"物联网实践与探索\"课程的起始单元，主要介绍物联网的基本知识及传感器等内容。本单元围绕\"从感知到物联\"的主题，从探讨\"寻找身边能联网的物品\"出发，通过感受身边的物联网、探索物联网与互联网的关系，引出物联网中重要的感知设备——传感器，开展传感器和物联网实践，引导学生认识物联网的普及对学习和生活的影响，进而理解物联网的价值。<\/p><\/div><h3>学习目标<\/h3><p>1. 通过体验身边的物联网，知道物联网与互联网的异同，认识物联网的价值，感受物联网给人们的学习、生活和工作带来的改变。<\/p>\n<p>2. 通过了解物联网及其应用，知道物联网（特别是传感器系统）是连接现实世界与数字世界的纽带和媒介，了解物联网中采集数据的方法。<\/p>\n<p>3. 通过传感器的项目实践，了解传感器工作的基本原理，选择恰当的传感器等物联实验设备进行实践探索。<\/p>\n<p>4. 通过了解物联网的发展趋势，理解物联网在国际竞争中的重要性和发展自主可控技术的意义。<\/p>","lessons":[{"no":1,"title":"第1课 开启物联网之门","html":"<h4>核心概念<\/h4><p>物联网（Internet of Things）即\"物品的互联网\"\"万物互联\"，其中的\"物\"泛指各种装有传感器并能与互联网相连的物品。物品接入互联网需满足三个基本条件：有名字（可被识别的唯一编码）、可感知（能提供物品本身的数据）、能传输（可与其他物品交换数据）。<\/p>\n<p>物联网的核心和基础仍是互联网：从计算机与计算机的连接，到人与人的互联，再到物与物的互联。传感器应用是物联网与互联网的最大区别所在。我国物联网起步很早（1999年中国科学院开展传感网研究，2009年\"感知中国\"，2023年蜂窝物联网终端用户达23.32亿户），正迈入\"万物智联\"新阶段。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课是模块起始课，建议用贴近学生生活的物联案例（物联家居、物联班牌、物联灯光系统等）作为教学引入，激发兴趣；注意与\"互联网应用与创新\"模块衔接，回顾IP相关知识，理解从IPv4转向IPv6的意义，并意识到互联网\"升级\"是物联网和数字化转型的基础。<\/p>\n<p>拓展思考：如果把洗衣机或冰箱联网，可以共享哪些数据、与谁共享？若这些数据人人可见可能带来哪些安全隐患？关于保护隐私安全、数据安全以及自主可控的教学应贯穿所有学习活动。<\/p><\/div>"},{"no":2,"title":"第2课 传感之古今未来","html":"<h4>核心概念<\/h4><p>传感器是物联网的\"感觉器官\"，是一种能将感应到的数据按一定规律转换成可用信号的器件或装置，其实质是把不易测量的物理量转化为容易测量的量（如电学量），以满足传输、处理、存储、显示、记录和控制等要求。<\/p>\n<p>传感器由来已久：指南针、日晷、沙漏等古代发明可视作最古老的传感器；现代常见传感器有温度、土壤湿度、加速度、光敏、声音、图像、红外、气压等，同一种传感器可跨领域应用，实现同一功能也可使用不同传感器。发展趋势是体积更小、功能更强、价格更低、更节能，并向集成化、智能化、无线化发展，是物联网及大数据、人工智能的基础。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课可用人体感官类比传感器（光敏如眼、声音如耳、气味如鼻、温度如皮肤），降低神秘感；传感器定义不必死记，重在理解其\"输入—计算—输出\"实质。建议对照实物介绍种类，结合\"祝融号\"火星车等案例拓展，并适时引导学生思考高精尖传感器国产化的自主可控意义。<\/p>\n<p>拓展：手机之所以越来越智能，很重要的原因是集成了越来越多的传感器，手机集成了哪些传感器？分别有何作用？<\/p><\/div>"},{"no":3,"title":"第3课 环境数据要感知","html":"<h4>核心概念<\/h4><p>利用传感器获取环境数据有三种方式：使用智能终端内置传感器（如声音、光敏、加速度等）、使用生活中现成的传感器类产品（噪声测试仪、气体测试仪、甲醛仪、亮度计、水质测试笔等）、使用物联实验设备（主控板+传感器+执行器）。<\/p>\n<p>本课以检测环境声音（分贝）为例，体验传感器采集环境数据的过程，掌握利用传感器获取数据的方法，为今后使用传感器作准备。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课重点在于让学生通过体验传感器采集数据的过程、感受实际应用，编程不是重点（可给伪代码或半成品加注释代码）。可在智能终端、传感器产品、物联实验设备三种方式中任选开展；无硬件时可借助虚拟仿真工具或视频展示。噪声知识可与物理学科开展跨学科教学。<\/p>\n<p>拓展：使用物联实验设备获取当前环境的光照强度。<\/p><\/div>"},{"no":4,"title":"第4课 物物相连有价值","html":"<h4>核心概念<\/h4><p>物联网中传感器如同遍布世界的\"神经触角\"，每时每刻感知检测、源源不断地为互联网输送数据。物联网的价值主要体现在三方面：提供丰富实时的数据、实现远程的反馈与控制、传感器协同带来新智能。<\/p>\n<p>数据经分析处理与可视化呈现，可为决策提供参考（如中央气象台实况图）。多个传感器协同（本地不同种类协同，或经网络汇聚形成大数据）往往产生\"1+1>2\"的效果，如多水质传感器协同检测河道水质、地图导航结合交通数据预警。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教学可将互联网类比为\"大脑\"、传感器类比为\"神经触角\"，帮助学生理解物联网全面感知的特征。可引导学生通过网络查找实时数据，思考数据由哪些传感器获取，体会物联网是大数据的基石。注意渗透网络安全与隐私保护意识——远程控制和丰富数据带来便利，也伴随网络安全风险。<\/p>\n<p>拓展：使用物联实验设备模拟物联楼梯灯，要求用两种不同类型传感器体现协同；思考将不同楼层楼梯灯接入网络能产生什么价值。<\/p><\/div>"},{"no":5,"title":"第5课 物联功能趣体验","html":"<h4>核心概念<\/h4><p>本课通过三个递进的学习活动体验物联功能：远程查看物联数据（访问公共监测网站查看传感器采集的数据）、远程控制物联插座（通过智能终端控制电器）、远程监测物联花卉（综合查看数据与远程控制）。<\/p>\n<p>物品、传感器、网络与数据处理是物联系统的关键要素；传感器可通过直接连接互联网，也可通过网关设备连接互联网。本课初步了解物联系统中的反馈和控制，为进一步理解万物互联基本原理作铺垫。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>若无供学生体验的物联产品，可通过搜索查看物联数据、网络商城查询功能、画示意图等方式开展教学。物联插座网络配置较复杂，要提醒学生看说明书；传感器经网关连接互联网，教师不必过度强调网关概念，只需让学生知道传感器能通过网关连接即可。重点在于体验远程控制、体会反馈与控制过程。<\/p>\n<p>拓展：通过实践体验物联产品，总结物联网的功能，撰写一份包含实验设备、步骤和结果的实验报告。<\/p><\/div>"}]},{"id":"u2","no":"二","title":"万物互联有协议","page":"","head":"<div class=\"note-box\"><div class=\"note-title\">📌 单元引言<\/div><p>在互联网应用与创新模块中，学生已经学习了互联网的一些协议。而在物联网中，物与物之间的\"交流\"也需要遵循一定的通信规则，这种通信规则就是物联协议。如果说传感器是物联网的\"感官\"，那么物联协议就是将遍布各处的传感器连接起来的\"神经系统\"，为各类物联设备之间进行数据交换和资源共享提供保障。<\/p>\n<p>物联协议比较多，还处于规范和发展中，本单元主要介绍几种常见的物联协议。本单元围绕\"万物互联有协议\"主题，从探讨物联数据的传输方式开始，通过介绍物联网中的通信协议，开展RFID、蓝牙、HTTP和MQTT等实践探索，让学生真正体会物联协议的功能和特征，理解协议的重要作用。<\/p><\/div><h3>学习目标<\/h3><p>1. 通过分析生活中的物联场景应用，了解物联网中的数据传输协议，感受物联网给人们的学习、生活和工作带来的改变。<\/p>\n<p>2. 通过利用射频识别、蓝牙等物联协议开展实践探索，了解近距离通信协议的特点，主动利用数字设备开展创新实践活动。<\/p>\n<p>3. 通过获取网络数据的实践探索，进一步认识HTTP及其通信机制；通过消息订阅实践探索，认识MQTT及其通信机制，体验其中数据处理和应用的方法与过程。<\/p>\n<p>4. 通过了解物联协议的应用和发展，理解标准化的重要作用，强化自主可控意识。<\/p>","lessons":[{"no":6,"title":"第6课 数据传输方式多","html":"<h4>核心概念<\/h4><p>物联系统数据传输方式多样：按传输介质分为有线传输（电缆、网线、光纤，更快更稳定）与无线传输（Wi-Fi、蓝牙、ZigBee、LoRa等，灵活方便）；按传输距离分为近距离通信（RFID、NFC、蓝牙等）与远距离通信（3G/4G/5G、NB-IoT等）。<\/p>\n<p>多样的传输方式背后是多样的物联协议，设备依特性与场景选择不同协议。如共享单车物联系统中，车辆通过NB-IoT连接、手机通过移动通信网络连接、服务器与设备间用MQTT/HTTP交互，并可能用蓝牙辅助开锁。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可回顾\"互联网应用与创新\"中学过的TCP/IP、HTTP，引出物与物通信也需协议，引导学生从感知层走向网络层探索。以共享单车数据流转（定位上报、扫码开锁）为例剖析；近距离/远距离界限不强求统一。可引导从供电节能、速率、安全等角度选择通信协议，并思考为何还要发展低功耗远程技术。<\/p>\n<p>拓展：人类已建立高速率网络连接，为什么还要发展低功耗远程数据传输技术？电子围栏如何判断共享单车是否停在规定的还车区域内？<\/p><\/div>"},{"no":7,"title":"第7课 电子标签我揭秘","html":"<h4>核心概念<\/h4><p>RFID（射频识别）是一种物品标识和自动识别的无线通信技术，由电子标签和读卡器组成，无须与被识别物品直接接触即可读写数据。电子标签按发射射频信号方式分被动标签（无内置电池、工作距离短）和主动标签（有电池、可主动发射、距离远）。<\/p>\n<p>NFC（近场通信）是由RFID演变而来的近距离高频无线通信技术，允许数字设备间非接触式点对点数据传输；除通信协议外还规定数据交换格式，可实现双向通信并更改内容（如手机NFC）。我国自主创新的NFC实体鉴别技术已成为ISO/IEC国际标准。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>重点让学生了解RFID是无线通信技术、掌握基本原理即可，不必深究技术细节；可用火车站刷身份证进站、ETC、门禁等案例讲解工作流程。编程可让学生填空关键代码或补注释。NFC可结合手机功能说明。教学中可引导学生发现身边使用RFID的场景。<\/p>\n<p>拓展：用电子标签标识每件校服，读卡器读取并显示学生姓名（用字典存储电子标签编号与学生姓名的对应关系）。<\/p><\/div>"},{"no":8,"title":"第8课 巧用蓝牙做工具","html":"<h4>核心概念<\/h4><p>蓝牙是常见的近距离无线通信技术，设备搭载蓝牙芯片发送信号寻找并配对另一设备后互相通信，支持双向通信。低功耗蓝牙（BLE）大幅提升续航，蓝牙5.0传输距离增至300m，是物联网时代重要的无线通信技术。<\/p>\n<p>RFID、NFC和蓝牙等近距离通信协议的共同特点：低功耗（受电池供电限制）、低延时（瞬时完成指令传输）、数据格式简单（设备间直连无需多层封装转发）。常见近距离协议还有ZigBee等。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可让学生观看视频了解蓝牙起源与发展，认识协议不断升级改进。学习活动1（蓝牙传文件）培养利用数字化工具解决问题的意识；学习活动2（制作蓝牙翻页笔）综合性强，可演示硬件搭建、讲解代码、调参数发展计算思维。出现故障时引导从程序、接线逐步排查。<\/p>\n<p>拓展：传统家用遥控器多用红外线通信，与现在的蓝牙遥控器相比有哪些优缺点？<\/p><\/div>"},{"no":9,"title":"第9课 互联协议仍沿用","html":"<h4>核心概念<\/h4><p>物联系统数据不仅来自传感器，也来自互联网；外部设备或程序通常通过API（应用程序接口，可理解为软件间的\"桥梁\"）访问服务器数据资源。设备一般用HTTP向服务器发起请求获取数据，步骤包括获取API网址、发起网络请求、解析返回结果（XML或JSON格式字符串）。<\/p>\n<p>HTTP主要面向客户端/服务器模式，设备需主动向服务器请求数据，存在资源消耗大、对服务器与网络负担重等局限，并不完全适合物联网实时、低功耗场景，引出了对更合适物联协议的探索。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>解析JSON返回数据对学生较难，应先观察字符串格式再介绍ujson.loads方法与字典类型；不必区分GET/POST，理解请求—响应即可。可准备免费天气API让学生获取并展示。引导学生从低功耗、低带宽、低延时、兼容性、可靠性理解物联通信协议的特定要求。<\/p>\n<p>拓展：搜索免费API并整理成表，通过urequests库发起HTTP请求访问，并将返回数据显示在主控板上。<\/p><\/div>"},{"no":10,"title":"第10课 物物互通有新径","html":"<h4>核心概念<\/h4><p>MQTT（消息队列遥测传输）是当前流行的物联网协议，具有开放、轻量、可靠、易实现的特点，采用发布/订阅通信机制，包含发布者、服务器（代理）、订阅者三个角色：发布者向主题发布消息，服务器将消息传递给订阅该主题的订阅者。<\/p>\n<p>实践中可选择在线MQTT服务器（使用方便、需注册、功能丰富）或搭建本地MQTT服务器（免注册、可直观感受数据交换过程、操作稍繁琐）。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可用\"订报纸\"类比（服务器=邮局，订阅者=订报客户，发布者=出版机构）帮助学生理解三者关系与工作流程。引导学生对比HTTP与MQTT异同，思考不同场景的协议选择。搭建本地服务器可用开源软件SIoT（运行后浏览器访问本机IP:8080）。设置移动热点时渗透信息安全（使用复杂密码）。<\/p>\n<p>拓展：尝试用软件搭建本地MQTT服务器，实现订阅功能。<\/p><\/div>"}]},{"id":"u3","no":"三","title":"简单物联功能实践","page":"","head":"<div class=\"note-box\"><div class=\"note-title\">📌 单元引言<\/div><p>物联系统包括感知层、网络层和应用层，本单元聚焦应用层的功能实现，遵循物联网\"大场景、小应用\"的特点，以实践探究的方式，引导学生利用所学知识解决真实的问题。<\/p>\n<p>本单元围绕物联门锁的功能，通过认识身边的物联系统，了解物联系统中的反馈与控制，利用物联实验设备模拟实现物联门锁功能，在实验平台读取、发送、接收、汇集和使用数据，探索物联系统的功能，体验物联网、大数据及人工智能的关系，进一步理解万物互联为人们生活带来的便捷和影响。<\/p><\/div><h3>学习目标<\/h3><p>1. 通过对身边真实物联系统的分析，认识物联系统的三层结构，了解物联系统的工作过程。<\/p>\n<p>2. 通过对物联网应用的分析，了解以数据为核心分解物联功能的方法。<\/p>\n<p>3. 通过使用物联实验设备搭建物联系统原型，了解物联系统中反馈与控制的过程，体验物联网、大数据及人工智能的关系。<\/p>\n<p>4. 通过简单物联功能的实现，了解从物联网服务平台读取、发送、接收数据的方法。<\/p>","lessons":[{"no":11,"title":"第11课 物联系统细分解","html":"<h4>核心概念<\/h4><p>生活中的物联系统大多由终端设备、传感器、网络和软件组成，相互连接交互，实现数据采集、传输、处理和控制等功能，可分为感知层、网络层、应用层三层结构，分别实现数据采集、传输、处理与控制。<\/p>\n<p>以物联门锁系统为例，可按\"以数据为核心\"分解为刷卡开锁、门铃通知、远程控制、刷脸开锁等功能，每项功能都可对应到三层结构（感知层采集数据、网络层传输、应用层反馈控制）进行分析。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课重在分析身边物联系统、引出三层结构并分解门锁功能，教学中不必纠结细节。应鼓励学生发挥想象力设计指纹开锁、密码开锁、语音开锁等功能（提出思路即可，不要求实现），并引导学生围绕采集数据、传输数据和反馈控制设计更多功能。<\/p>\n<p>拓展：物联网技术为门锁功能拓展提供更多可能，除了本课分析的功能，还可以实现什么功能？<\/p><\/div>"},{"no":12,"title":"第12课 刷卡开锁易实现","html":"<h4>核心概念<\/h4><p>RFID门禁系统工作过程可描述为：外部数据获取（输入）、数据内部处理（计算）、结果呈现（输出）。用户刷卡，读卡器获取卡中数据传给计算模块，按规则比对判断权限，若通过则发送开锁指令，执行器收到指令后开锁。<\/p>\n<p>一个完整的刷卡开锁功能可划分为：输入模块（电子标签、RFID读卡器读取编号）、计算模块（主控板用列表存储编号并判断是否在列表中）、输出模块（舵机模拟打开门锁）。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教学可通过拆解实物、视频或图片展示RFID门锁结构，引导学生回顾第7课RFID基本原理与工作过程，分小组讨论工作过程。门禁卡内电子标签主要用于存储用户身份数据，利用RFID可实现刷卡开锁。本课是后续舵机模拟开锁实践的铺垫。<\/p>\n<p>拓展：将门禁卡与业主身份数据关联，利用标签编号唯一性标识用户身份，尝试实现用户刷门禁卡时在显示屏显示用户姓名。<\/p><\/div>"},{"no":13,"title":"第13课 门铃通知即时到","html":"<h4>核心概念<\/h4><p>物联系统中的\"反馈\"是将系统状态或结果信息回传给用户。门铃通知是典型反馈功能：门铃被按下（采集状态数据），经网络传输后向用户发送通知，让用户及时了解情况。<\/p>\n<p>通知可通过显示屏显示信息、蜂鸣器提醒、消息推送等方式实现，涉及执行器的选择（如蜂鸣器用于提醒用户）。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可展示生活中真实应用情景，引导学生认识什么是物联系统中的反馈。功能测试需要门铃端配合，可引导小组之间合作；本活动主要涉及执行器选择，可用显示屏显示信息，也可用蜂鸣器提醒，教师可补充讲授蜂鸣器使用方法。综合考虑学情、硬件及账号等问题选择方案。<\/p>\n<p>拓展：你认为还可以采用哪些方式实现对用户的通知？分别使用哪些执行器？尝试修改程序实现。<\/p><\/div>"},{"no":14,"title":"第14课 远程控制更便捷","html":"<h4>核心概念<\/h4><p>物联系统中的\"控制\"是根据指令对外部环境施加作用；反馈与控制相辅相成，控制常基于反馈得到的数据。以火车站验票系统为例可引入物联系统中的控制。<\/p>\n<p>远程控制开锁功能通过用户端（输入模块）发送开锁指令、门锁端（输出模块，舵机）执行开锁实现，体现了物联系统远程控制的基本过程。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教学中可设置问题引导；把输入模块看作用户端、输出模块看作门锁端。可能出现舵机没有反应的情况，引导从程序、接线逐步排查故障。综合考虑学情、硬件及账号等问题选择实现方式。<\/p>\n<p>拓展：两个小组合作，尝试利用本小组的主控板控制对方的舵机；思考远程控制开锁功能存在哪些安全隐患？<\/p><\/div>"},{"no":15,"title":"第15课 面容钥匙显智能","html":"<h4>核心概念<\/h4><p>人脸识别（刷脸开锁）是把\"人脸\"当作钥匙，机器识别人脸的步骤包括人脸定位、特征分析、匹配人脸等；大部分学生对其认知停留在使用层面，缺乏对实现过程和原理的理解。<\/p>\n<p>刷脸开锁由三模块组成：输入模块（摄像头采集人脸数据、人脸识别后发布消息至MQTT服务器相应主题）、计算模块（计算机搭建MQTT服务器、设置主题实现发布与订阅）、输出模块（主控板、舵机订阅主题、收到消息后控制舵机转动）。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>建议从同学画像或游戏猜人活动引导发现人脸特征，思考机器描述并识别人脸的方式；可用人工智能摄像头或普通摄像头+网页版人脸识别平台体验。熟悉摄像头、主控板、计算机的连接方式与MQTT设置（参考第10课）。要高度警惕收集生物特征数据的场景，不随意提供面部、指纹等数据。<\/p>\n<p>拓展：利用所学知识设计一个物联考勤系统，识别人脸并通过MQTT服务器将学号实时推送到教师端设备。<\/p><\/div>"}]},{"id":"u4","no":"四","title":"简易物联系统实践","page":"","head":"<div class=\"note-box\"><div class=\"note-title\">📌 单元引言<\/div><p>在上一单元学习的简单物联功能实践的基础上，本单元的内容比较综合，让学生从物联系统的整体出发进行分析和规划，最终学会设计较为完整的简易物联系统。物联系统的工作过程本质上是通过感知外部环境，并通过数据传输、存储、处理，最终反馈到外部环境的过程。<\/p>\n<p>本单元围绕简易物联花盆系统，通过划分物联系统的模块，根据需求确定感知、传输、反馈和控制等功能，最后完成简易物联系统的搭建。与前面三个单元相比，本单元的实践难度略大，在具体实施过程中，可以先实现每个模块的功能，再将所有模块集成在一起。教学中可根据本地实际情况或者学生兴趣，选择其他的实践案例。<\/p><\/div><h3>学习目标<\/h3><p>1. 通过分析简易物联系统，能够确定简易物联系统的功能需求，划分简易物联系统的功能模块。<\/p>\n<p>2. 通过设计简易物联系统，进一步认识算法在生活中的应用。<\/p>\n<p>3. 通过搭建简易物联系统，进一步探索物联系统中数据采集、处理、反馈和控制等基本功能。<\/p>\n<p>4. 通过对物联数据进行简单分析处理，学会常用的数据可视化表达的方法。<\/p>","lessons":[{"no":16,"title":"第16课 模块功能先划分","html":"<h4>核心概念<\/h4><p>简易物联系统的一般工作环节为：采集数据→传输与存储数据→分析处理数据→反馈与控制，对应环境感知、网络通信、服务平台、执行等功能模块。<\/p>\n<p>物联项目设计应包含：物联系统环节、各环节功能需求、功能模块划分（如物联花盆系统的感知模块、网络通信模块、服务平台模块、执行模块）。主控板既是感知模块、执行模块的一部分，也因提供联网功能而属于网络通信模块。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课从工作环节、功能需求、模块划分三方面介绍简易物联系统，是后续搭建的基础。可结合高铁烟雾报警系统（传感器采集、网络传输、服务器分析、制动反馈）、智能公交系统（北斗定位、NB-IoT通信、数据中心服务平台、终端查询）等案例，分析各环节硬件与功能模块。<\/p>\n<p>拓展：结合物联系统工作环节，说说高铁烟雾报警系统每个环节可能使用哪些硬件？尝试分析物联公交系统的功能模块。<\/p><\/div>"},{"no":17,"title":"第17课 物联数据需采集","html":"<h4>核心概念<\/h4><p>数据采集有两种途径：利用传感器采集环境数据（如光敏、土壤湿度、温湿度传感器），以及通过互联网/API获取网络数据（如天气预报）。在物联花盆项目中，光敏与土壤湿度传感器输出模拟信号，温湿度传感器输出数字信号，主流主控板引脚一般兼具读取能力。<\/p>\n<p>采集的数据需传输与存储（可上传物联网服务平台或本地存储），以便后续分析处理与呈现。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>项目可对学生进行分组，每组负责校园一个区域。教师需提前注册申请免费天气预报API密钥、查询城市编号并调试，不同API返回数据格式不同。建议事先准备好含网络配置、服务器连接的半成品代码，引导学生复习前面学过的知识。<\/p>\n<p>拓展：结合身边的物联网案例，说一说物联网的数据来源有哪些？从便捷性、覆盖范围、数据安全性等角度比较本地MQTT服务器和在线MQTT服务器的优缺点。<\/p><\/div>"},{"no":18,"title":"第18课 数据分析与处理","html":"<h4>核心概念<\/h4><p>数据处理工具从算盘、滑尺发展到电子计算机（\"存储程序、程序执行\"模式，展现通用性与自动化），再到借助编程工具处理数据。通过编程能高效处理大量数据，并实现更为直观的数据可视化。<\/p>\n<p>物联网服务平台通常提供两种数据获取方式：以数据文件形式下载（用电子表格软件处理）和通过API调用（自动从平台获取数据）。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>引导学生认识数据处理工具的演进与编程优势，对比电子表格与编程处理，体会编程处理大量数据的高效与直观可视化。在现代科学研究中，数据分析不可或缺（如海王星由数据预测而非观测发现），可提高科研效率与质量。<\/p>\n<p>拓展：尝试使用电子表格软件对数据分析处理，说说哪种处理方式更好；查阅海王星被发现的资料，谈谈数据分析处理在科学研究中的重要作用。<\/p><\/div>"},{"no":19,"title":"第19课 数据呈现可视化","html":"<h4>核心概念<\/h4><p>数据可视化的作用：清晰展示数据变化趋势（中断或突变即可断定异常）、提供全局视图把握整体规律、发现趋势变化助力预测未来、方便交流共享并支持分析决策。<\/p>\n<p>常见数据可视化方式可借助工具（如matplotlib）实现；真实数据与场景（如航班准点记录、国家统计数据）能增强学生对可视化在决策与预测中应用的理解。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教学可先让学生分组讨论生活中的可视化应用再总结归纳，并尽可能多地举例说明其在各领域的作用。可引导学生访问国家数据网站查看历年统计数据，尝试预测变化趋势。教师可利用真实数据和场景增强学习体验。<\/p>\n<p>拓展：土壤湿度对植物生长至关重要，利用数据可视化方式探究土壤湿度的变化情况，为反馈与控制提供参考（涉及matplotlib绘图与传感器定时采集）。<\/p><\/div>"},{"no":20,"title":"第20课 反馈控制有算法","html":"<h4>核心概念<\/h4><p>执行器模块是输出设备，让物联系统对环境形成反馈（点亮指示灯、蜂鸣器发声、控制电机舵机均属反馈）。数据、算法、反馈、执行器的关系：数据是设计算法的依据，算法根据规则产生结果，反馈是系统作用于外部环境的过程，执行器是反馈的载体。<\/p>\n<p>根据数据分析设计算法实现反馈与控制，例如依据土壤湿度上下限值（hum_max、hum_min）决定灌溉条件，形成数据决策程序。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>帮助学生正确梳理数据、算法、反馈和执行器之间的关系。可先通过取平均值确定土壤在干燥、适中、湿润时的传感器数据，再整理条件（大于上限、介于上下限、小于下限）、设计算法形成数据决策部分程序。设计系统还要考虑扩展需求（预留引脚、合理程序框架）。<\/p>\n<p>拓展：选择一两个可实现的创新功能对物联系统改造升级；分析某物联门锁系统的数据采集、传输与反馈控制及所用硬件。<\/p><\/div>"}]},{"id":"u5","no":"五","title":"物联网应用探索","page":"","head":"<div class=\"note-box\"><div class=\"note-title\">📌 单元引言<\/div><p>应用是物联网发展的根本目的，创新是推动物联网发展的动力。物联网应用处于快速发展期，具有多样化、规模化、行业化等特点，在工业、农业、交通、教育、电力、医疗、物流、军事、文物保护等领域有着广泛的应用，推动经济社会全方位发展。<\/p>\n<p>本单元在第四单元学习基础上，结合简易物联系统设计与搭建，在文物保护、健康生活、医疗设施、农业生产、学习探究等方面展开实践探索，通过博物馆环境监测系统、身高记录仪、输液监测系统、奶牛产奶监测系统、探究热水降温规律等物联网应用实践，引导学生进一步探索物联网中数据采集、处理、反馈控制等基本功能，体验物联网、大数据及人工智能的关系。本单元共五个项目，教师可根据本地实际教学情况选择。<\/p><\/div><h3>学习目标<\/h3><p>1. 通过了解物联网在各领域的应用，进一步认识物联网给人们生活、学习和工作方式带来的改变，增强主动学习物联网知识的意识。<\/p>\n<p>2. 通过真实情境中具体案例的实践探索，掌握获取和处理数据的方法，提高发现问题、分析问题、解决问题的能力，发展计算思维。<\/p>\n<p>3. 通过搭建物联原型系统，学会选择数字设备和数字平台，主动利用数字设备开展实践创新探究。<\/p>","lessons":[{"no":21,"title":"第21课 文物保护新手段","html":"<h4>核心概念<\/h4><p>物联网在文物保护中应用广泛，如博物馆环境监测系统可实时监测展柜温湿度等环境数据，并在异常时反馈控制（报警、开启空调等）。<\/p>\n<p>通过博物馆环境监测系统的实践探索，掌握利用物联网解决问题的方法，并可迁移应用于解决其他问题。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教师可展示文物受损图片，引导学生探究展柜温湿度阈值，设问采集的数据送到哪里、如何存储（组织学生填写topic等）。系统功能可不断迭代升级，可增加传感器获取更多数据，或增加异常提醒、蜂鸣器/LED报警等反馈控制功能。可实地考察博物馆、校史馆提出方案。<\/p>\n<p>拓展：博物馆中除恒温恒湿外还有哪些环境因素值得关注？为环境监测系统增加一个新功能；实地考察本地博物馆并提出升级或设计方案。<\/p><\/div>"},{"no":22,"title":"第22课 健康生活新设备","html":"<h4>核心概念<\/h4><p>物联网在生活中应用普遍，\"智能\"已融入生活，为健康生活带来新可能，如物联手环监测心率与运动、物联体重秤分析体脂率、物联跑步机收集运动数据并提供建议。<\/p>\n<p>通过身高记录仪系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可设问：如何设计一个身高记录仪系统？采集的学生身高数据要送到哪里？组织学生填写topic等。学生体质健康监测指标还有体重、视力等，可拓展。教师可根据本地实际教学情况选择实践内容。<\/p>\n<p>拓展：为身高记录仪系统增加一个新功能；选择一个生活中还没有联网的物品，对它升级改造，提出可实现的物联功能与方案。<\/p><\/div>"},{"no":23,"title":"第23课 医疗设施新功能","html":"<h4>核心概念<\/h4><p>物联网在医疗领域应用日益广泛，为医疗设施注入新功能，如物联床垫监测患者生命体征、物联药柜智能管理药品、物联手术室管理器械、物联纱布基于RFID识别计数等，极大提高医疗服务效率与质量。<\/p>\n<p>通过病患输液监测系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可参考表23.3引导学生开展实践、多记录数据；组织学生填写topic；因器材限制，教学重在引导学生判断当前数值。可实地考察本地医院、卫生服务站，观察是否利用物联网技术并提出升级或设计方案。<\/p>\n<p>拓展：为病患输液监测系统增加一个新功能（如更便捷高效的医疗服务）；实地考察医院并提出升级或设计方案。<\/p><\/div>"},{"no":24,"title":"第24课 农业生产新模式","html":"<h4>核心概念<\/h4><p>物联网推动农业向智能化、精准化变革：物联灌溉按土壤湿度与天气自动调节水量；物联养殖通过佩戴传感器监测动物体温、位置与行为；还可借助条形码、二维码监管农产品市场流动。<\/p>\n<p>通过奶牛产奶监测系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可在桶中倒入水模拟产奶量；结合软硬件条件拓展实现语音播报等；教师可带学生实地考察校园劳动实践基地。引导学生基于现有功能优化（如统计产奶量平均值、异常提醒），重点关注要解决什么问题、采集哪些数据及算法实现，硬件受限时绘制流程图即可。<\/p>\n<p>拓展：为奶牛产奶监测系统增加一个新功能；实地考察本地农场、牧场，提出升级或设计方案。<\/p><\/div>"},{"no":25,"title":"第25课 学习探究新工具","html":"<h4>核心概念<\/h4><p>物联网可作为学习探究的新工具，如在科学实验中实时采集数据（如探究热水降温规律），支持跨学科探究，体现\"大场景、小应用\"的特点。<\/p>\n<p>通过探究热水降温规律系统的实践探索，掌握利用物联网解决问题的方法，并能迁移应用于解决其他问题。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可让学生思考如何实时采集水杯中的水温数据、数据传到哪里；准备物联网在学习领域应用的视频。倡导将所学知识运用于实际生活（如为亲友推荐适宜保温杯），并可结合物理、化学、生物学等学科实验开展跨学科科学实验项目。<\/p>\n<p>拓展：选择几种保温杯，找出保温效果最好的；探讨物联网技术还可以应用在哪些科学实验中，提出实践思路。<\/p><\/div>"}]},{"id":"u6","no":"六","title":"物联网安全","page":"","head":"<div class=\"note-box\"><div class=\"note-title\">📌 单元引言<\/div><p>随着物联网应用的不断发展，物联设备数量剧增，它们能够持续工作并把自己的\"所见、所闻、所感\"告诉其他设备或者人。物联网给人们带来便利的同时，也带来了新的安全威胁。在物联网应用中，每一个传感器和网络都有潜在的风险，都可能受到攻击。<\/p>\n<p>本单元是本模块最后一个单元，旨在让学生了解物联网中虚拟身份的重要性，了解物联网安全的现状，进一步增强个人信息保护意识，深刻认识自主可控对国家安全的重要意义。本单元围绕物联网安全，从探讨物联网虚拟身份出发，用物联网安全事件强化安全意识，提出安全防范策略，阐述自主可控的内涵和意义，并以第三单元物联门锁系统案例为例，开展物联系统安全升级实践体验。<\/p><\/div><h3>学习目标<\/h3><p>1. 通过类比生活中身份与互联网中虚拟身份的作用，了解虚拟身份的内涵，体会物联设备对塑造虚拟身份的价值，有意识地保护个人隐私，进行安全防护。<\/p>\n<p>2. 通过分析物联网中常见的安全事件及物联系统三层结构中存在的安全风险，了解物联网安全防范的措施，初步掌握常见的数据安全防范策略，强化数据保护意识。<\/p>\n<p>3. 通过了解芯片、软件、协议标准与知识产权等方面外部依赖可能造成的风险，认识自主可控生态体系对我国国家安全的重要作用。<\/p>\n<p>4. 通过对物联系统的安全升级改造实践，进一步加深对物联网安全的理解，提升探索与应用实践的能力。<\/p>","lessons":[{"no":26,"title":"第26课 数字世界有身份","html":"<h4>核心概念<\/h4><p>物联网中存在用户虚拟身份与设备虚拟身份；虚拟身份在网络空间唯一标识用户或设备（如监控室通过标识区分每个烟雾传感器或摄像头），对物联网传输、安全等具有重要作用。<\/p>\n<p>结合虚拟身份在物联系统中的具体应用，感受其在物联网传输与安全方面的重要作用。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教学应以案例为主，强调保护虚拟身份的重要性，着重培养学生安全意识；可结合前面体验过的物联项目（如物联门锁）引导探究，也可在消防/安全监控室观察设备工作过程，体会虚拟身份的作用。本活动不要求实现相关功能。<\/p>\n<p>拓展：对刷脸开锁功能升级，结合开锁时间数据预测用户在工作日的回家时间（涉及MQTT记录时间、散点图可视化、以及开锁时间数据泄露的隐私风险）。<\/p><\/div>"},{"no":27,"title":"第27课 安全事件与风险","html":"<h4>核心概念<\/h4><p>物联网面临常见的安全事件与多种安全挑战；物联系统的感知层、网络层、应用层均存在安全风险（如刷脸开锁可能被人脸照片、美颜或编辑后的照片欺骗）。<\/p>\n<p>需认识物联系统三层结构存在的安全风险，提升信息安全意识。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>教师可从物联系统安全风险图引入，阐明自主可控的意义，介绍用车牌照片欺骗小区道闸等案例。引导学生在刷脸开锁探究中，从采集人脸数据、传输数据及反馈控制等环节分析存在的安全风险，并归纳分别属于哪一层的安全风险。<\/p>\n<p>拓展：通过比较物联网与互联网，举例说明物联网安全的特殊性。<\/p><\/div>"},{"no":28,"title":"第28课 安全防范讲策略","html":"<h4>核心概念<\/h4><p>物联系统的感知层、网络层、应用层各有相应的安全防范策略；了解这些策略有助于体会安全防范的重要作用。<\/p>\n<p>需了解物联网安全策略，强化保护个人数据安全的意识。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课系统梳理三层结构的安全防范策略，结合实际案例讲解。可组织讨论不同门禁（RFID系统与人脸识别系统）各自的优势、存在的安全风险与防范方法，帮助学生形成整体安全防范认识。<\/p>\n<p>拓展：目前常见小区门禁有RFID系统和人脸识别系统，比较两者的优势分别是什么、各自存在哪些安全风险、如何防范。<\/p><\/div>"},{"no":29,"title":"第29课 自主可控意义大","html":"<h4>核心概念<\/h4><p>物联网在芯片、软件、协议标准与知识产权等方面存在外部依赖风险；自主可控指在关键技术领域拥有核心能力与自主权，并非闭门造车、排斥国际合作。<\/p>\n<p>认识自主可控生态体系对我国国家安全的重要作用，提升国家安全意识与民族自豪感。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>可让学生分组利用互联网搜索、交流，查阅我国芯片产业发展历程（设计、制造、封装测试，含数十亿晶体管），思考国家为何重点发展芯片产业。澄清\"自主可控即通过完全自主研发解决任何问题、无须国际合作\"的误解，理解有效结合自主研发与国际合作更利于技术创新与全球竞争力。<\/p>\n<p>拓展：有人说自主可控就是通过完全自主研发解决任何问题，因此就无须再开展国际合作交流，这样的说法对吗？<\/p><\/div>"},{"no":30,"title":"第30课 系统安全需升级","html":"<h4>核心概念<\/h4><p>提升数据采集安全的方法包括摄像头活体检测、用户身份认证、加密传输等，通过升级改造可提升物联门锁等系统的安全性。<\/p>\n<p>了解身份认证技术，认识物联系统安全的重要性，并通过实践体验安全升级。<\/p><div class=\"ref-box\"><div class=\"ref-title\">📝 教学参考<\/div><p>本课以第三单元物联门锁案例为例，开展摄像头活体检测、用户身份认证、加密传输等安全升级实践。可先进行人脸识别再升级；引导学生思考哪些情况下需要验证身份数据、如何对传输数据加密。也可先进行人物体验再开展升级。<\/p>\n<p>拓展：选择一种加密算法对物联门锁系统中传输的数据进行加密，修改物联门锁系统的程序，实现该功能。<\/p><\/div>"}]}]}}};</script>
<script>
/* 信息科技 · 七八年级汇总刷题 —— 应用逻辑 */
(function () {
  'use strict';

  var DB = window.__DB__;
  var LS = 'xxkj_union_v1';
  var TYPES = { s: { n: '单选题', c: 's' }, m: { n: '多选题', c: 'm' }, j: { n: '判断题', c: 'j' }, q: { n: '简答题', c: 'q' } };

  /* ================= 状态 ================= */
  var S;
  try {
    var raw = JSON.parse(localStorage.getItem(LS) || '{}');
    S = {
      g: raw.g === 'g8' ? 'g8' : 'g7',
      theme: raw.theme || '',
      prog: raw.prog || {},
      wrong: raw.wrong || {},
      hist: raw.hist || [],
      last: raw.last || null,
      memo: raw.memo || {},
      memoHide: raw.memoHide === true
    };
  } catch (e) {
    S = { g: 'g7', theme: '', prog: {}, wrong: {}, hist: [], last: null, memo: {}, memoHide: false };
  }
  function save() {
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  }

  /* ================= 工具 ================= */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function strip(h) {
    return String(h || '').replace(/<br\s*\/?>/gi, ' ').replace(/<\/(p|li|tr|h\d|div)>/gi, ' ')
      .replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function pkey(lid) { return S.g + '|' + lid; }
  function progOf(lid) { return S.prog[pkey(lid)] || {}; }
  function lessonMeta(lid) {
    var us = DB.units[S.g];
    for (var i = 0; i < us.length; i++) {
      for (var j = 0; j < us[i].lessons.length; j++) {
        if (us[i].lessons[j].id === lid) return { unit: us[i], lesson: us[i].lessons[j], ui: i, li: j };
      }
    }
    return null;
  }
  function switchGrade(g) {
    if (S.g === g) return;
    S.g = g; save();
    bookSel = null;
    applyTheme();
    go('quiz');
    render();
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('on'); }, 1700);
  }
  function go(h) {
    if (('#/' + h) === location.hash) { render(); return; }
    location.hash = '#/' + h;
  }

  /* ================= 主题 ================= */
  function applyTheme() {
    var root = document.documentElement;
    var dark = S.theme === 'dark' || (!S.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-g', S.g);
    var btn = $('#themeBtn');
    if (btn) btn.innerHTML = dark ? ICO.sun : ICO.moon;
    var meta = $('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', dark ? '#0F1114' : (S.g === 'g7' ? '#E67E22' : '#2563EB'));
  }

  /* ================= 图标 ================= */
  var ICO = {
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',

  };

  /* ================= 判定 ================= */
  function grade(q, a) {
    if (a === undefined || a === null || a === '') return null;
    if (q.t === 'q') return a === 'ok' ? 1 : 0;
    if (q.t === 'm') {
      if (!a || !a.length) return null;
      var u = a.slice().sort(function (x, y) { return x - y; }).join(',');
      return u === q.a.join(',') ? 1 : 0;
    }
    return a === q.a ? 1 : 0;
  }
  function isMulti(q) { return q.t === 'm'; }
  function ansText(q, a) {
    if (q.t === 'q') return strip(a || '（未作答）');
    var arr = Array.isArray(a) ? a : [a];
    return arr.map(function (i) { return 'ABCDEF'[i] || '?'; }).join('');
  }
  function rightText(q) {
    if (q.t === 'q') return '参考要点';
    var arr = Array.isArray(q.a) ? q.a : [q.a];
    return arr.map(function (i) { return 'ABCDEF'[i] || '?'; }).join('');
  }

  /* ================= 统计 ================= */
  function statsOf(g) {
    var total = 0, done = 0, right = 0, units = [];
    DB.units[g].forEach(function (u) {
      var ut = 0, ud = 0, ur = 0;
      u.lessons.forEach(function (l) {
        var qs = DB.quiz[g][l.id] || [];
        var p = S.prog[g + '|' + l.id] || {};
        ut += qs.length; total += qs.length;
        qs.forEach(function (q, i) {
          if (p[i] !== undefined) {
            var gr = grade(q, p[i]);
            if (gr !== null) { ud++; done++; if (gr === 1) { ur++; right++; } }
          }
        });
      });
      units.push({ u: u, total: ut, done: ud, right: ur });
    });
    return { total: total, done: done, right: right, units: units };
  }
  function wrongCount(g) {
    var n = 0;
    Object.keys(S.wrong).forEach(function (k) { if (k.indexOf(g + '|') === 0) n++; });
    return n;
  }

  /* ================= 路由 ================= */
  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    if (!h) return { tab: 'quiz', a: '', b: '' };
    var p = h.split('/');
    return { tab: p[0] || 'quiz', a: p[1] || '', b: p[2] || '' };
  }
  function render() {
    var r = parseHash();
    var tabMap = { quiz: 'quiz', note: 'note', book: 'book', me: 'me', memo: 'quiz' };
    if (!tabMap[r.tab]) r.tab = 'quiz';
    var activeTab = tabMap[r.tab];
    var nav = document.querySelectorAll('.tabbar button');
    for (var i = 0; i < nav.length; i++) nav[i].classList.toggle('on', nav[i].getAttribute('data-tab') === activeTab);
    var view = $('#view');
    view.style.padding = '';
    V = null; VM = null;
    var m = $('#modal'); if (m) m.classList.remove('on');
    var sh = $('#sheet'); if (sh) sh.classList.remove('on');
    var mk = $('#mask'); if (mk) mk.classList.remove('on');
    syncSeg();
    if (r.tab === 'memo') {
      viewMemo(r.a, r.b);
    } else if (r.tab === 'quiz') {
      if (r.a && r.b) viewQuiz(r.a, r.b);
      else if (r.a) viewLessons(r.a);
      else viewQuizHome();
    } else if (r.tab === 'note') {
      if (r.a && r.b) viewNoteLesson(r.a, r.b);
      else if (r.a) viewNoteModule(r.a);
      else viewNoteHome();
    } else if (r.tab === 'book') {
      if (r.a) viewBookUnit(r.a);
      else viewBookHome();
    } else {
      viewMe();
    }
    wrapTables();
  }
  // 表格加横向滚动容器，避免窄屏把列压到断字
  function wrapTables() {
    var ts = $('#view').querySelectorAll('table');
    for (var i = 0; i < ts.length; i++) {
      var t = ts[i];
      if (t.parentNode && t.parentNode.className === 'tw') continue;
      var w = document.createElement('div');
      w.className = 'tw';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    }
  }

  /* ================= 视图：刷题首页 ================= */
  function viewQuizHome() {
    var g = S.g, st = statsOf(g), h = '';
    h += '<div class="page">';
    h += '<div class="page-hd"><h1>' + DB.meta[g].name + ' · 刷题</h1>';
    h += '<p>' + DB.meta[g].book + ' · 6 单元 ' + DB.units[g].reduce(function (a, u) { return a + u.lessons.length; }, 0) + ' 课 · ' + st.total + ' 题</p></div>';

    if (S.last && S.last.g === g && S.last.lid) {
      var lm = lessonMeta(S.last.lid);
      if (lm) {
        var lqs = DB.quiz[g][S.last.lid] || [];
        var doneN = Object.keys(progOf(S.last.lid)).length;
        if (doneN < lqs.length) {
          h += '<div class="resume" data-go="quiz/' + lm.unit.id + '/' + S.last.lid + '">';
          h += '<div class="r-ico">▶</div><div class="r-tx"><b>' + esc(lm.lesson.title) + '</b>';
          h += '<span>已答 ' + doneN + ' / ' + lqs.length + ' 题，继续加油</span></div>';
          h += '<div class="r-go">继续</div></div>';
        }
      }
    }

    h += '<div class="sec-t">单元练习</div>';
    st.units.forEach(function (x) {
      var u = x.u, pct = x.total ? Math.round(x.done / x.total * 100) : 0;
      h += '<button class="unit" data-go="quiz/' + u.id + '">';
      h += '<div class="u-no">第' + (u.no || '') + '单元' + (u.page ? ' · ' + u.page : '') + '</div>';
      h += '<div class="u-t">' + esc(u.title) + '</div>';
      h += '<div class="u-meta"><span>' + u.lessons.length + ' 课</span><span>' + x.total + ' 题</span>';
      if (x.done > 0) h += '<span>已答 ' + x.done + '</span>';
      h += '<span class="go">' + (pct > 0 ? pct + '%' : '进入') + '</span></div>';
      if (pct > 0) h += '<div class="ubar"><i style="width:' + pct + '%"></i></div>';
      h += '</button>';
    });
    h += '</div>';
    $('#view').innerHTML = h;
  }

  /* ================= 视图：课列表 ================= */
  function viewLessons(uid) {
    var g = S.g, unit = null;
    DB.units[g].forEach(function (u) { if (u.id === uid) unit = u; });
    if (!unit) { go('quiz'); return; }
    var h = '<div class="page">';
    h += '<div class="backbar"><button data-go="quiz">' + ICO.back + ' 单元</button>';
    h += '<span class="bb-t">' + unit.lessons.length + ' 课</span></div>';
    h += '<div class="page-hd"><h1>第' + (unit.no || '') + '单元 ' + esc(unit.title) + '</h1>';
    h += '<p>' + DB.meta[g].name + ' · ' + unit.lessons.reduce(function (a, l) { return a + (DB.quiz[g][l.id] || []).length; }, 0) + ' 题</p></div>';
    unit.lessons.forEach(function (l) {
      var qs = DB.quiz[g][l.id] || [], p = progOf(l.id);
      var doneN = 0, rightN = 0;
      qs.forEach(function (q, i) { if (p[i] !== undefined) { var gr = grade(q, p[i]); if (gr !== null) { doneN++; if (gr === 1) rightN++; } } });
      var full = doneN >= qs.length && qs.length > 0;
      h += '<div class="lesson' + (full ? ' done' : '') + '" data-go="quiz/' + uid + '/' + l.id + '">';
      h += '<div class="l-idx">' + (full ? '✓' : parseInt(l.id.replace(/\D/g, ''), 10)) + '</div>';
      h += '<div class="l-main"><div class="l-t">' + esc(l.title) + '</div><div class="l-s">';
      h += '<span>' + qs.length + ' 题</span>';
      if (doneN > 0) { h += '<span>已答 ' + doneN + '</span><em class="' + (rightN / doneN < 0.6 ? 'bad' : '') + '">正确率 ' + Math.round(rightN / doneN * 100) + '%</em>'; }
      else h += '<span>未开始</span>';
      h += '</div></div>';
      h += '<button class="memo-btn" data-go="memo/' + uid + '/' + l.id + '">背题</button>';
      h += '<div class="arrows">' + ICO.right + '</div></div>';
    });
    h += '</div>';
    $('#view').innerHTML = h;
  }

  /* ================= 视图：答题 ================= */
  var V = null;
  var VM = null;   // 背题模式

  function viewQuiz(uid, lid) {
    var g = S.g, qs = DB.quiz[g][lid];
    var lm = lessonMeta(lid);
    if (!qs || !lm) { go('quiz'); return; }
    var saved = progOf(lid);
    V = { uid: uid, lid: lid, qs: qs, i: 0, ans: {}, open: {}, pick: {}, finished: false, unit: lm.unit, lesson: lm.lesson };
    Object.keys(saved).forEach(function (k) { V.ans[+k] = saved[k]; });
    V.i = Math.min(S.last && S.last.g === g && S.last.lid === lid ? (S.last.i || 0) : 0, qs.length - 1);

    var h = '<div class="quizwrap">';
    h += '<div class="qhead"><button class="bt" data-go="quiz/' + uid + '">' + ICO.back + '</button>';
    h += '<div class="mid"><b>' + esc(lm.lesson.title) + '</b><span id="qpos"></span></div>';
    h += '<button class="bt" id="btnMemo2" title="背题模式">' + ICO.book + '</button>';
    h += '<button class="bt" id="btnSheet2" title="答题卡">☰</button></div>';
    h += '<div class="qprog"><i id="qprog"></i></div>';
    h += '<div id="qbody"></div>';
    h += '</div>';
    h += '<div class="qfoot"><button class="btn ghost" id="btnPrev">上一题</button>';
    h += '<button class="sheet-btn" id="btnSheet"><span class="ico">▦</span>答题卡</button>';
    h += '<button class="btn" id="btnNext">下一题</button></div>';
    $('#view').innerHTML = h;
    $('#view').style.padding = '0';
    paintQ();
  }

  function paintQ() {
    var q = V.qs[V.i], a = V.ans[V.i], gr = grade(q, a);
    var locked = gr !== null;
    var ty = TYPES[q.t];
    var showAna = locked || V.open[V.i];

    // 进度
    var answered = 0;
    V.qs.forEach(function (qq, i) { if (grade(qq, V.ans[i]) !== null) answered++; });
    $('#qpos').textContent = (V.i + 1) + ' / ' + V.qs.length + ' · 已答 ' + answered;
    $('#qprog').style.width = (answered / V.qs.length * 100) + '%';

    var h = '<div class="qcard">';
    h += '<div class="qtop"><span class="badge ' + ty.c + '">' + ty.n + '</span><span class="qno">' + pad2(V.i + 1) + '</span></div>';
    h += '<div class="stem">' + esc(q.q) + '</div>';

    if (q.t === 'q') {
      var tv = (V.txt && V.txt[V.i] !== undefined) ? V.txt[V.i] : (typeof a === 'string' && a !== 'ok' && a !== 'no' ? a : '');
      h += '<textarea class="ta" id="qta" placeholder="在这里写下你的答案..."' + (locked ? ' readonly' : '') + '>' + esc(tv) + '</textarea>';
      if (!locked) {
        h += '<div class="selfgrade"><button class="btn soft" id="btnShowRef">查看参考答案</button></div>';
      } else {
        h += '<div class="selfgrade"><button class="btn ' + (gr === 1 ? 'ok' : 'bad') + '" disabled>' + (gr === 1 ? '✓ 已标记：我答对了' : '✕ 已标记：没答对') + '</button></div>';
      }
      if (showAna) {
        h += '<div class="ana"><div style="font-weight:800;color:var(--accText);margin-bottom:4px;">参考答案</div>' + esc(q.a).replace(/\n/g, '<br>') + '<div style="margin-top:9px;">' + q.an + '</div>';
        if (!locked) {
          h += '<div class="selfgrade"><button class="btn ok" data-self="ok">我答对了</button><button class="btn bad" data-self="no">没答对</button></div>';
        }
        h += '</div>';
      }
    } else {
      var opts = q.o || [];
      var pickArr = isMulti(q) ? (V.pick[V.i] || (Array.isArray(a) ? a.slice() : [])) : null;
      h += '<div id="opts">';
      opts.forEach(function (o, oi) {
        var cls = 'opt', res = '';
        var chosen = isMulti(q) ? (pickArr.indexOf(oi) >= 0) : (a === oi);
        if (locked) {
          var inAns = (Array.isArray(q.a) ? q.a : [q.a]).indexOf(oi) >= 0;
          if (inAns) { cls += ' ok'; res = '✓'; }
          else if (chosen) { cls += ' bad'; res = '✕'; }
          else cls += ' fade';
          cls += ' locked';
        } else if (chosen) cls += ' sel';
        h += '<div class="' + cls + '" data-opt="' + oi + '">';
        h += '<span class="k">' + (locked && (Array.isArray(q.a) ? q.a : [q.a]).indexOf(oi) >= 0 ? '✓' : 'ABCDEF'[oi]) + '</span>';
        h += '<span class="tx">' + esc(String(o).replace(/^[A-F][.、．]\s*/, '')) + '</span>';
        if (res) h += '<span class="res">' + res + '</span>';
        h += '</div>';
      });
      h += '</div>';
      if (isMulti(q) && !locked) {
        h += '<div class="selfgrade"><button class="btn" id="btnConfirm"' + (pickArr.length ? '' : ' disabled') + '>确认作答</button></div>';
      }
      if (showAna) h += '<div class="ana">' + q.an + '</div>';
    }
    h += '</div>';
    $('#qbody').innerHTML = h;

    // 按钮状态
    $('#btnPrev').disabled = V.i <= 0;
    $('#btnNext').textContent = V.i >= V.qs.length - 1 ? '完成本课' : '下一题';
    $('#btnNext').className = 'btn' + (V.i >= V.qs.length - 1 ? ' ok' : '');
    wrapTables();
  }

  /* ================= 视图：背题模式 ================= */
  function viewMemo(uid, lid) {
    var g = S.g, qs = DB.quiz[g][lid], lm = lessonMeta(lid);
    if (!qs || !lm) { go('quiz'); return; }
    if (!S.memo) S.memo = {};
    var start = S.memo[lid];
    if (typeof start !== 'number' || start < 0 || start >= qs.length) start = 0;
    VM = { uid: uid, lid: lid, qs: qs, i: start, hide: S.memoHide === true, rev: {}, unit: lm.unit, lesson: lm.lesson };

    var h = '<div class="quizwrap">';
    h += '<div class="qhead"><button class="bt" data-go="quiz/' + uid + '">' + ICO.back + '</button>';
    h += '<div class="mid"><b>' + esc(lm.lesson.title) + '</b><span id="qpos"></span></div>';
    h += '<button class="bt" id="btnEye" title="遮挡答案"></button></div>';
    h += '<div class="qprog"><i id="qprog"></i></div>';
    h += '<div id="qbody"></div>';
    h += '</div>';
    h += '<div class="qfoot"><button class="btn ghost" id="mPrev">上一题</button>';
    h += '<span class="mpos" id="mPos"></span>';
    h += '<button class="btn" id="mNext">下一题</button></div>';
    $('#view').innerHTML = h;
    paintMemo();
  }

  function memoGo(i) {
    if (!VM || i < 0 || i >= VM.qs.length) return;
    VM.i = i;
    if (!S.memo) S.memo = {};
    S.memo[VM.lid] = i;
    save();
    paintMemo();
    window.scrollTo(0, 0);
  }

  function paintMemo() {
    var q = VM.qs[VM.i], ty = TYPES[q.t];
    var hidden = VM.hide && !VM.rev[VM.i];
    $('#qpos').textContent = '背题 ' + (VM.i + 1) + ' / ' + VM.qs.length;
    $('#qprog').style.width = ((VM.i + 1) / VM.qs.length * 100) + '%';
    $('#mPos').textContent = (VM.i + 1) + ' / ' + VM.qs.length;
    var eye = $('#btnEye');
    if (eye) {
      eye.innerHTML = VM.hide ? ICO.eyeOff : ICO.eye;
      eye.setAttribute('data-hide', VM.hide ? '1' : '0');
      eye.title = VM.hide ? '当前：先遮住答案（点一下改回直接看）' : '当前：直接看答案（点一下改成先遮住）';
    }

    var h = '<div class="qcard">';
    h += '<div class="qtop"><span class="badge ' + ty.c + '">' + ty.n + '</span><span class="qno">' + pad2(VM.i + 1) + '</span></div>';
    h += '<div class="stem">' + esc(q.q) + '</div>';

    if (hidden) {
      h += '<button class="reveal" data-reveal="1">轻点显示答案</button>';
    } else if (q.t === 'q') {
      h += '<div class="refans"><b>参考答案</b>' + esc(q.a).replace(/\n/g, '<br>') + '</div>';
      h += '<div class="ana">' + q.an + '</div>';
    } else {
      var idx = Array.isArray(q.a) ? q.a : [q.a];
      (q.o || []).forEach(function (o, oi) {
        var ok = idx.indexOf(oi) >= 0;
        h += '<div class="opt memo' + (ok ? ' ok' : '') + '">';
        h += '<span class="k">' + 'ABCDEF'[oi] + '</span>';
        h += '<span class="tx">' + esc(String(o).replace(/^[A-F][.、．]\s*/, '')) + '</span>';
        if (ok) h += '<span class="res">✓</span>';
        h += '</div>';
      });
      h += '<div class="ana">' + q.an + '</div>';
    }
    h += '</div>';
    $('#qbody').innerHTML = h;

    $('#mPrev').disabled = VM.i <= 0;
    var nx = $('#mNext');
    if (VM.i >= VM.qs.length - 1) { nx.textContent = '去刷题'; nx.className = 'btn ok'; }
    else { nx.textContent = '下一题'; nx.className = 'btn'; }
    wrapTables();
  }

  function record(i, val) {
    V.ans[i] = val;
    var q = V.qs[i], gr = grade(q, val);
    var k = S.g + '|' + V.lid;
    if (!S.prog[k]) S.prog[k] = {};
    S.prog[k][i] = val;
    var wk = S.g + '|' + V.lid + '|' + i;
    if (gr === 1) delete S.wrong[wk];
    else if (gr === 0) S.wrong[wk] = Date.now();
    S.last = { g: S.g, lid: V.lid, i: i };
    save();
  }

  function afterAnswer() {
    paintQ();
    var all = true;
    V.qs.forEach(function (q, i) { if (grade(q, V.ans[i]) === null) all = false; });
    if (all && !V.finished) {
      V.finished = true;
      pushHist();
      setTimeout(showResult, 340);
    }
  }

  function pushHist() {
    var c = 0;
    V.qs.forEach(function (q, i) { if (grade(q, V.ans[i]) === 1) c++; });
    S.hist.unshift({ t: Date.now(), g: S.g, l: V.lid, u: V.uid, n: V.qs.length, c: c });
    if (S.hist.length > 60) S.hist.length = 60;
    save();
  }

  function showResult() {
    var c = 0;
    V.qs.forEach(function (q, i) { if (grade(q, V.ans[i]) === 1) c++; });
    var n = V.qs.length, rate = Math.round(c / n * 100);

    var list = $('#sList'), modList = $('#modList');

    modList.style.display = 'none';
    var hits = [];

      m.lessons.forEach(function (l) {
        var fields = { '知识点': l.knowledge, '考点': l.exam, '易混': l.difficulty, '简答': l.qa };
        var found = null, where = '', snip = '';
        Object.keys(fields).forEach(function (fn) {
          if (found) return;
          var txt = strip(fields[fn]);
          var idx = txt.indexOf(kw);
          if (idx >= 0) {
            found = l; where = fn;
            snip = txt.slice(Math.max(0, idx - 30), idx + 90);
          }
        });
        if (!found && l.title.indexOf(kw) >= 0) { found = l; where = '课名'; snip = l.title; }
        if (found) hits.push({ m: m, l: l, where: where, snip: snip });
      });
    });
    if (!hits.length) { list.innerHTML = '<div class="empty"><span class="big">🔍</span>没有找到「' + esc(kw) + '」</div>'; return; }

  /* ================= 导出 CSV ================= */
  function csvCell(v) {
    v = String(v == null ? '' : v).replace(/"/g, '""');
    return '"' + v + '"';
  }
  function exportWrong(onlyGrade) {
    var rows = [['年级', '单元', '课', '题号', '题型', '题干', '选项', '正确答案', '你的答案', '解析']];
    Object.keys(S.wrong).forEach(function (k) {
      var p = k.split('|'), kg = p[0], lid = p[1], qi = +p[2];
      if (onlyGrade && kg !== onlyGrade) return;
      var qs = DB.quiz[kg][lid]; if (!qs || !qs[qi]) return;
      var q = qs[qi];
      var lm = null, un = '';
      DB.units[kg].forEach(function (u) { u.lessons.forEach(function (l) { if (l.id === lid) { lm = l; un = u.title; } }); });
      var p2 = S.prog[kg + '|' + lid] || {};
      rows.push([
        kg === 'g7' ? '七年级' : '八年级', un, lm ? lm.title : lid, '第' + (qi + 1) + '题',
        TYPES[q.t].n, q.q,
        (q.o || []).map(function (o, i) { return 'ABCDEF'[i] + '. ' + String(o).replace(/^[A-F][.、．]\s*/, ''); }).join(' / '),
        q.t === 'q' ? strip(q.a) : rightText(q),
        q.t === 'q' ? '自评' : ansText(q, p2[qi]),
        strip(q.an)
      ]);
    });
    if (rows.length === 1) { toast('暂无错题可导出'); return; }
    var csv = '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    var d = new Date();
    var name = '信息科技错题_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.csv';

    // Android 壳：WebView 不支持 a.download，交给原生桥写进「下载」目录
    if (window.AndroidText && typeof window.AndroidText.saveText === 'function') {
      try {
        var r = window.AndroidText.saveText(name, csv);
        if (r && r.charAt(0) === '!') toast(r.slice(1));
        return;
      } catch (e) { /* 落到浏览器方案 */ }
    }

    try {
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
      toast('已导出 ' + (rows.length - 1) + ' 道错题');
    } catch (e) { toast('导出失败，请用系统浏览器打开'); }
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function (e) {
    var t = e.target;

    // 年级切换
    var sg = t.closest ? t.closest('.seg button') : null;
    if (sg) { switchGrade(sg.getAttribute('data-g')); return; }

    // 主题
    if (t.closest && t.closest('#themeBtn')) {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
      var sw = $('#swTheme'); if (sw) sw.classList.toggle('on', !dark);
      return;
    }
    if (t.closest && t.closest('#swTheme')) {
      var d2 = document.documentElement.getAttribute('data-theme') === 'dark';
      S.theme = d2 ? 'light' : 'dark'; save(); applyTheme();
      t.closest('#swTheme').classList.toggle('on', !d2);
      return;
    }

    // 底部导航
    var tb = t.closest ? t.closest('.tabbar button') : null;
    if (tb) { go(tb.getAttribute('data-tab')); return; }

    // 通用跳转
    var gEl = t.closest ? t.closest('[data-go]') : null;
    if (gEl && !(t.closest && t.closest('[data-opt]'))) {
      var dest = gEl.getAttribute('data-go');
      // 错题项：跳到对应题号
      if (gEl.hasAttribute('data-wq')) {
        var parts = gEl.getAttribute('data-wq').split('|');
        S.last = { g: parts[0], lid: parts[1], i: +parts[2] };
        if (parts[0] !== S.g) { S.g = parts[0]; save(); applyTheme(); }
      }
      go(dest); return;
    }

    // ===== 答题页交互 =====
    if (V) {
      var opt = t.closest ? t.closest('[data-opt]') : null;
      if (opt && !opt.classList.contains('locked')) {
        var oi = +opt.getAttribute('data-opt');
        var q = V.qs[V.i], cur = V.ans[V.i];
        if (isMulti(q)) {
          var arr = V.pick[V.i] || (Array.isArray(cur) ? cur.slice() : []);
          var idx = arr.indexOf(oi);
          if (idx >= 0) arr.splice(idx, 1); else arr.push(oi);
          V.pick[V.i] = arr;
          paintQ();
        } else {
          V.open[V.i] = true;
          record(V.i, oi);
          afterAnswer();
        }
        return;
      }
      if (t.id === 'btnConfirm' || (t.closest && t.closest('#btnConfirm'))) {
        var pa = V.pick[V.i] || [];
        if (!pa.length) { toast('请先选择选项'); return; }
        V.open[V.i] = true;
        record(V.i, pa.slice());
        V.pick[V.i] = null;
        afterAnswer();
        return;
      }
      if (t.id === 'btnShowRef') {
        var ta = $('#qta');
        if (ta) { V.txt = V.txt || {}; V.txt[V.i] = ta.value; }
        V.open[V.i] = true;
        paintQ(); return;
      }
      var self = t.closest ? t.closest('[data-self]') : null;
      if (self) {
        record(V.i, self.getAttribute('data-self'));
        afterAnswer(); return;
      }
      if (t.id === 'btnPrev' || (t.closest && t.closest('#btnPrev'))) {
        if (V.i > 0) { V.i--; paintQ(); window.scrollTo(0, 0); }
        return;
      }
      if (t.id === 'btnNext' || (t.closest && t.closest('#btnNext'))) {
        if (V.i < V.qs.length - 1) { V.i++; paintQ(); window.scrollTo(0, 0); }
        else {
          var allDone = true;
          V.qs.forEach(function (qq, i) { if (grade(qq, V.ans[i]) === null) allDone = false; });
          if (!allDone) {
            for (var i = 0; i < V.qs.length; i++) if (grade(V.qs[i], V.ans[i]) === null) { V.i = i; paintQ(); toast('还有未作答的题'); return; }
          }
          if (!V.finished) { V.finished = true; pushHist(); showResult(); }
        }
        return;
      }
      if (t.closest && t.closest('#btnMemo2')) {
        if (!S.memo) S.memo = {};
        S.memo[V.lid] = V.i; save();
        go('memo/' + V.uid + '/' + V.lid); return;
      }
      if (t.closest && (t.closest('#btnSheet') || t.closest('#btnSheet2'))) { openSheet(); return; }
      var jump = t.closest ? t.closest('[data-jump]') : null;
      if (jump) { V.i = +jump.getAttribute('data-jump'); closeSheet(); paintQ(); window.scrollTo(0, 0); return; }
      if (t.id === 'sheetClose') { closeSheet(); return; }
    }

    // ===== 背题模式交互 =====
    if (VM) {
      var rv = t.closest ? t.closest('[data-reveal]') : null;
      if (rv) { VM.rev[VM.i] = true; paintMemo(); return; }
      if (t.closest && t.closest('#btnEye')) {
        VM.hide = !VM.hide; S.memoHide = VM.hide; save();
        if (!VM.hide) VM.rev[VM.i] = true;
        paintMemo(); return;
      }
      if (t.closest && t.closest('#mPrev')) { memoGo(VM.i - 1); return; }
      if (t.closest && t.closest('#mNext')) {
        if (VM.i >= VM.qs.length - 1) { go('quiz/' + VM.uid + '/' + VM.lid); return; }
        memoGo(VM.i + 1); return;
      }
    }

    // 结果弹窗
    if (t.id === 'rWrong') {
      $('#modal').classList.remove('on');
      for (var i2 = 0; i2 < V.qs.length; i2++) {
        if (grade(V.qs[i2], V.ans[i2]) === 0) { V.i = i2; break; }
      }
      paintQ(); window.scrollTo(0, 0); return;
    }
    if (t.id === 'rExport') { exportWrong(S.g); return; }
    if (t.id === 'rAgain') {
      $('#modal').classList.remove('on');
      var k = S.g + '|' + V.lid;
      delete S.prog[k];
      Object.keys(S.wrong).forEach(function (kk) { if (kk.indexOf(S.g + '|' + V.lid + '|') === 0) delete S.wrong[kk]; });
      save();
      var lid2 = V.lid, uid2 = V.uid;
      render(); return;
    }
    if (t.id === 'rBack') { $('#modal').classList.remove('on'); go('quiz/' + V.uid); return; }

    // 折叠：笔记模块
    var acc = t.closest ? t.closest('[data-acc]') : null;
    if (acc) { acc.closest('.acc').classList.toggle('open'); return; }
    var bacc = t.closest ? t.closest('[data-bacc]') : null;
    if (bacc) { bacc.closest('.acc').classList.toggle('open'); return; }

    // 教材切换
    var bk = t.closest ? t.closest('[data-book]') : null;
    if (bk) { bookSel = bk.getAttribute('data-book'); viewBookHome(); window.scrollTo(0, 0); return; }

    // 错题筛选
    var wf = t.closest ? t.closest('[data-wf]') : null;
    if (wf) { S.meFilter = wf.getAttribute('data-wf'); viewMe(); return; }

    // 导出全部
    if (t.id === 'btnExportAll') { exportWrong(null); return; }

    // 清空
    if (t.id === 'btnClear') {
      if (!confirm('确定清空 ' + DB.meta[S.g].name + ' 的全部答题进度和错题记录吗？')) return;
      Object.keys(S.prog).forEach(function (kk) { if (kk.indexOf(S.g + '|') === 0) delete S.prog[kk]; });
      Object.keys(S.wrong).forEach(function (kk) { if (kk.indexOf(S.g + '|') === 0) delete S.wrong[kk]; });
      S.hist = S.hist.filter(function (x) { return x.g !== S.g; });
      save(); viewMe(); toast('已清空'); return;
    }

    // 关闭抽屉/弹窗
    if (t.id === 'mask') { closeSheet(); return; }
    if (t.id === 'modal') { $('#modal').classList.remove('on'); return; }
  });

  // 搜索输入 / 简答输入
  document.addEventListener('input', function (e) {
    if (e.target.id === 'sIn') doSearch(e.target.value);
    if (e.target.id === 'qta' && V) { V.txt = V.txt || {}; V.txt[V.i] = e.target.value; }
  });

  // 滑动切题
  var sx = 0, sy = 0, st = 0, moved = false;
  document.addEventListener('touchstart', function (e) {
    if ((!V && !VM) || e.touches.length !== 1) return;
    if (e.target.closest('#sheet') || e.target.closest('.ta')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if ((!V && !VM) || e.touches.length !== 1) return;
    var dx = Math.abs(e.touches[0].clientX - sx), dy = Math.abs(e.touches[0].clientY - sy);
    if (dy > dx) moved = true;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if ((!V && !VM) || moved || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = Math.abs(e.changedTouches[0].clientY - sy);
    if (Date.now() - st > 600) return;
    if (Math.abs(dx) < 60 || dy > 70) return;
    if (VM) {
      if (dx < 0 && VM.i < VM.qs.length - 1) memoGo(VM.i + 1);
      if (dx > 0 && VM.i > 0) memoGo(VM.i - 1);
      return;
    }
    if (dx < 0 && V.i < V.qs.length - 1) { V.i++; paintQ(); window.scrollTo(0, 0); }
    if (dx > 0 && V.i > 0) { V.i--; paintQ(); window.scrollTo(0, 0); }
  }, { passive: true });

  // hash 变化
  window.addEventListener('hashchange', render);

  // 返回键：先关浮层，再回上一层，都没有才退出（Android 壳会调用它）
  window.__handleBack = function () {
    var m = document.getElementById('modal');
    if (m && m.classList.contains('on')) { m.classList.remove('on'); return true; }
    var sh = document.getElementById('sheet');
    if (sh && sh.classList.contains('on')) { closeSheet(); return true; }
    var r = parseHash();
    var base = r.tab === 'memo' ? 'quiz' : r.tab;
    if (r.b) { location.hash = '#/' + base + '/' + r.a; return true; }
    if (r.a) { location.hash = '#/' + base; return true; }
    return false;
  };

  /* ================= 启动 ================= */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    var seg = $('#seg');
    seg.innerHTML = '<button data-g="g7">七年级</button><button data-g="g8">八年级</button>';
    var tabbar = $('#tabbar');
    tabbar.innerHTML =
      '<button data-tab="quiz"><span class="ico">' + ICO.quiz + '</span>刷题</button>' +
      '<button data-tab="note"><span class="ico">' + ICO.note + '</span>笔记</button>' +
      '<button data-tab="book"><span class="ico">' + ICO.book + '</span>教材</button>' +
      '<button data-tab="me"><span class="ico">' + ICO.me + '</span>我的</button>';
    applyTheme();
    render();
  }
  function syncSeg() {
    var btns = document.querySelectorAll('#seg button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-g') === S.g);
  }
  if (document.readyState !== 'loading') boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
