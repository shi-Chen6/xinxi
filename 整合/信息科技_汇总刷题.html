yle=\"color:#2980b9;\">📚 知识点讲解：<\/strong>中央气象台实况图基于海量传感器数据，经分析可视化形成。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干符合“物联网是大数据的基石”，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>气象图，传感数据基。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P23-24）。","o":["正确","错误"]},{"t":"j","q":"单一传感器采集的数据总是充分的，不需要多种传感器协同。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。单一传感器数据有限，许多应用需多种传感器协同。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材指出“单一传感器获取的数据有限”，多传感器信息互补提高准确度。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“总是充分”与“数据有限”矛盾，错误。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>单传感有限，协同一加一。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P25）。","o":["正确","错误"]},{"t":"j","q":"通过网络把多个位置的水质传感器数据汇聚，可以分析水质变化情况。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。网络汇聚多位置数据可分析整条河道水质变化。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>河道上下游多传感器通过网络协同，找出水质变化位置。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>符合网络协同举例，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>多点上网联，水质变化现。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P25）。","o":["正确","错误"]},{"t":"j","q":"物联设备都是物理实体，若遭攻击可能产生较严重后果，因此需注重网络安全。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。物理实体受攻击后果严重，数据被利用还会危及信息安全。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材提醒物联设备是物理实体，安全风险需重视，保护隐私与国家信息安全。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干与教材安全论述一致，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>实体遭攻后果重，安全须重视。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P26）。","o":["正确","错误"]},{"t":"m","q":"物联网的价值主要体现在哪些方面？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C。三大价值，D“减少连接”并非价值。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>价值：丰富实时数据、远程控制、协同新智能。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>D与“万物互联”相悖，排除后选ABC。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>数据、远控、协同智。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P23-26）。","o":["A. 提供丰富实时的数据","B. 实现远程的反馈与控制","C. 传感器协同带来新智能","D. 减少网络连接"]},{"t":"m","q":"下列哪些体现了传感器协同（多种传感器融合）带来的智能化？（多选）","a":[1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：B、C、D。A仅单一传感器，不属于“协同”。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>协同指多种传感器融合或网络汇聚，B_local、C/D_网络协同均符合。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>A是单传感器，不符“协同”，排除；其余为协同实例。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>协同需多种，单感不算数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P25-26）。","o":["A. 光敏传感器单独控制开灯（光照不足自动开灯）","B. 光敏+红外实现“光照不足且有人靠近自动开灯”","C. 河道上下游多个水质传感器协同检测水质变化","D. 地图导航结合车速异常与交通网络数据判断突发情况"]},{"t":"m","q":"远程控制物联系统的好处包括？（多选）","a":[0,1,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、D。均为教材中远程控制/物物相连价值实例。C教材未作为本课要点强调（属物物相连“联手”想象例），故不选。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>远程控制可发指令控设备，如远程关窗；手表通知空调开启是物物相连价值。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>A、B、D明确属远程控制/物物相连价值，保留。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>远控不在家，关窗唤空调。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P23-24）。","o":["A. 不在家也能控制设备","B. 下雨可远程关窗","C. 冰箱自动补货（与购物网站联手）","D. 物联手表快到家通知空调开启"]},{"t":"q","q":"物联网为社会发展带来哪三方面重要价值？","a":"①提供丰富实时的数据（传感器海量数据经分析可视化，辅助决策）；②实现远程的反馈与控制（远程发送指令）；③传感器协同带来“1+1>2”的新智能（本地融合与网络汇聚）。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>丰富数据、远程控制、协同新智能三方面。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材以“丰富实时数据、远程控制、协同新智能”概括物联价值。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>直接写出三大价值并略作说明。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>数据远控协同智，三值记心里。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第一单元 第4课 物物相连有价值（P23-26）。"},{"t":"q", r:#2980b9;\">📚 知识点讲解：<\/strong>教材拓展说明电子围栏有蓝牙定位、RFID两种方式等。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>符合教材拓展内容，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>电子围栏，蓝牙RFID。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P34）。","o":["正确","错误"]},{"t":"m","q":"下列属于近距离通信协议的有？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均属近距离通信协议。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材将RFID、NFC、蓝牙、ZigBee归为近距离通信协议。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均为教材近距离协议，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>RFID NFC 蓝牙 ZigBee，近距四协议。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P34）。","o":["A. RFID","B. NFC","C. 蓝牙","D. ZigBee"]},{"t":"m","q":"下列属于远距离通信协议/技术的有？（多选）","a":[0,1,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、D。蓝牙属近距离，不选。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>远距离通信包括3G/4G/5G、NB-IoT、LoRa（远距离无线电）。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>C蓝牙是近距离，排除后选ABD。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>远距：蜂窝NB LoRa。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P34）。","o":["A. 3G/4G/5G","B. NB-IoT","C. 蓝牙（近距离）","D. LoRa"]},{"t":"m","q":"选择物联协议时需要综合哪些因素？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。教材强调四方面综合分析。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>选择协议需从距离范围、最高速率、安全性、功耗等分析。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均为教材依据，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>距速安保耗，四因定协议。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P33-34）。","o":["A. 距离范围","B. 最高速率","C. 安全性","D. 功耗"]},{"t":"q","q":"请简述共享单车“获取附近可用单车”的数据流转过程。","a":"单车利用位置传感器获取位置数据，通过NB-IoT等网络经MQTT发送至服务器；手机通过移动通信网络经HTTP上传用车人位置；服务器处理后经HTTP把附近单车数据反馈到手机应用软件。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>位置传感→NB-IoT/MQTT→服务器；手机HTTP→服务器→HTTP反馈。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材以共享单车说明物联系统数据流转与多协议协作。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按“单车上报—手机上传—服务器反馈”三环节描述。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>车报位、机报位、服反馈。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P32-34）。"},{"t":"q","q":"按传输介质和传输距离，物联网数据传输方式各如何分类？","a":"按传输介质分为有线传输（如双绞线、光纤、以太网、USB）和无线传输（如Wi-Fi、蓝牙、ZigBee、LoRa）；按传输距离分为近距离通信（如RFID、NFC、蓝牙、ZigBee）和远距离通信（如3G/4G/5G、NB-IoT）。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>两个维度：介质（有线/无线）、距离（近/远）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材给出两种分类及各自常见技术举例。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>分别列出两类并各举教材实例。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>介质有线无线，距离近远分。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P33-34）。"},{"t":"q","q":"为什么还要发展低功耗的远程数据传输技术（如NB-IoT）？","a":"许多物联设备数量大、分布广、靠电池供电（如共享单车），低功耗设计可延长电池寿命、降低维护成本；传统高速率移动通信（如手机用3G/4G/5G）功耗高、需大电池，不适合海量低功耗终端，因此需要低功耗远程技术。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>海量电池终端需低功耗远距技术。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材从供电节能角度分析，低功耗延长寿命、降成本。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从设备数量、分布、电池供电、传统技术高功耗对比作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>海量电池终端，低功耗远传。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第6课 数据传输方式多（P34）。"}],"L07":[{"t":"s","q":"RFID技术本质上是一种？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，RFID本质上是一种无线通信技术（非接触自动识别）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>RFID是物品标识和自动识别技术，无须与被识别物品直接接触。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“无线、非接触”是RFID本质，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>RFID无线非接触。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35-38）。","o":["A. 有线通信技术","B. 无线通信技术","C. 存储技术","D. 显示技术"]},{"t":"s","q":"一个基本的RFID系统由哪两部分组成？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，RFID系统由电子标签和读卡器组成。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材明确RFID系统由电子标签（数据载体）和读卡器（读取设备）组成。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>记牢“标签+读卡器”两要素。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>RFID两件套，标签加读卡。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35）。","o":["A. 计算机和网线","B. 电子标签和读卡器","C. 传感器和执行器","D. 手机和服务器"]},{"t":"s","q":"RFID技术用于火车站检票，主要利用了它的什么特点？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，刷身份证进站体现非接触自动识别。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>身份证靠近检票机即被识别，正是RFID非接触识别在发挥作用。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“刷一下即过”=非接触，排除需接触/可见光项。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>一刷即过，非接触识。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35）。","o":["A. 必须接触读取","B. 非接触自动识别","C. 只能读一次","D. 依赖可见光"]},{"t":"s","q":"关于RFID电子标签，下列说法正确的是？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，被动标签无电池、靠感应取电，工作距离短（几cm~几m）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>被动标签无内置电池、距离短；主动标签有电池、距离可达几十米至上百米；数据可反复修改、不依赖瞄准。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>B、C、D均与教材相反，A正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>被动无电距短，主动有电距远。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35）。","o":["A. 被动标签无内置电池，工作距离较短","B. 主动标签无电池","C. 所有标签都必须瞄准读取","D. 标签不能修改数据"]},{"t":"s","q":"主动标签与被动标签相比？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，主动标签有电池可主动发信号，距离更远。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>主动标签工作距离可达几十米甚至上百米；被动标签仅几厘米到几米。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“有电池→距更远”是主动标签特征。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>主动有电，远达百米。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35）。","o":["A. 主动标签有内置电池，工作距离更远","B. 被动标签距离更远","C. 两者都一样","D. 主动标签无电池"]},{"t":"s","q":"RFID系统工作流程的第一步是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，第一步给物品打电子标签并存储相关数据。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>流程：①打标签存数据→②读卡器发信号→③标签进区发数据→④读卡器传送→⑤计算机处理。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“第一步”是标签初始化，对应B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>先打标签后读卡。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。","o":["A. 读卡器发射频信号","B. 给物品打上电子标签并存储数据","C. 计算机处理","D. 标签发送数据"]},{"t":"s","q":"NFC是由什么演变而来的？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，NFC由RFID演变而来。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材指出NFC是由RFID演变而来的近距离高频无线通信技术。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“NFC源自RFID”是教材原话。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>NFC出RFID。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P37）。","o":["A. 蓝牙","B. RFID","C. Wi-Fi","D. HTTP"]},{"t":"s","q":"与RFID相比，NFC额外规定了什么？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，NFC除通信协议外还规定了数据交换格式。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材说明NFC相比RFID，还规定了数据交换格式，并支持更改内容。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“额外规定数据交换格式”是NFC区别点。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>NFC多格式，可改内容。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P37）。","o":["A. 通信协议","B. 数据交换格式","C. 电池标准","D. 屏幕尺寸"]},{"t":"s","q":"2016年我国自主创新的NFC实体鉴别安全技术成为什么标准？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，成为ISO/IEC国际标准。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>2016年我国NFC非对称/对称实体鉴别两项安全技术正式成为ISO/IEC国际标准。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>记“ISO/IEC国际标准”这一成果。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>一六NFC安鉴，成ISO标。<br><br>\n<strong s 索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P37）。","o":["正确","错误"]},{"t":"j","q":"RFID电子标签上的数据可以反复修改。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。教材列出“电子标签上的数据可反复修改”为优势。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>RFID优势之一即标签数据可反复修改、高效准确。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干符合教材，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>标签数据，反复改。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P36）。","o":["正确","错误"]},{"t":"m","q":"RFID技术的特点和优势包括？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均为教材RFID优势。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>RFID优势：高速读取、批量处理、数据可改、不依赖可见光、适恶劣环境。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项全为教材优势，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>快、多、改、耐恶，RFID四优。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P36）。","o":["A. 每秒上千次读取","B. 同时处理多个标签","C. 数据可反复修改","D. 不依赖可见光、恶劣环境可用"]},{"t":"m","q":"RFID在生活中的应用有？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均属RFID应用。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材列举铁路检票、ETC、物流跟踪、医疗手环、农业动物标识等。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均为教材RFID应用，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>检票ETC物流医疗，RFID广用。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。","o":["A. 铁路进站检票","B. 高速公路ETC","C. 物流货物跟踪","D. 医疗患者手环识别"]},{"t":"m","q":"关于RFID与NFC，下列说法正确的有？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C。D错误，二者有区别。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>NFC源自RFID，额外规定数据格式且可双向改内容；并非完全相同。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>D“完全相同”错，排除后选ABC。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>NFC源RFID，多格式可双向。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P37）。","o":["A. NFC由RFID演变而来","B. NFC除通信协议还规定数据交换格式","C. NFC可更改胸卡内容（双向）","D. RFID和NFC完全相同没有区别"]},{"t":"q","q":"简述RFID系统的一般工作流程（5步）。","a":"①给物品打上电子标签并存储相关数据；②读卡器发送一定频率的射频信号；③当物品进入读卡器工作区，电子标签将自身数据发送出去；④读卡器接收数据并传送到计算机管理系统；⑤计算机管理系统作出相应处理。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>打标签→发信号→标签回传→读卡器送计算机→系统处理。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材给出RFID五步标准流程。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按教材五步顺序逐条写出。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>标签、信号、回传、送机、处理。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35-36）。"},{"t":"q","q":"被动标签与主动标签有什么区别？","a":"被动标签没有内置电池，靠读卡器射频信号感应取电，工作距离较短（几厘米到几米）；主动标签有内置电池，可主动发射信号，工作距离较远（可达几十米甚至上百米）。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>有无电池与距离差异是核心区别。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材按发射射频信号方式分被动/主动标签，距离与供电相关。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从“电池、取电方式、工作距离”对比作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>被动无电距短，主动有电距远。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P35）。"},{"t":"q","q":"教材用“胸卡”类比说明RFID与NFC的区别，请解释。","a":"RFID像学生戴胸卡方便别人了解他（一方读取）；NFC像师生两人都戴胸卡，可互相看到对方信息，且能更改胸卡内容改变对方收到的数据，即NFC支持双向非接触点对点数据交换，并规定了数据交换格式。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>RFID单向读取，NFC双向可改。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材用胸卡类比说明二者在双向性与可改内容上的差异。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>分别说明“单向胸卡”与“双向可改胸卡”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>RFID单向卡，NFC双向改。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第7课 电子标签我揭秘（P37）。"}],"L08":[{"t":"s","q":"蓝牙是一种什么类型的通信技术？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，蓝牙是常见的近距离无线通信技术。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>多数手机、平板、笔记本都有蓝牙，可连接设备也可传输数据。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“近距离无线”是蓝牙定位。<br><br>\n<st 的特性。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物联场景含多终端，需低功耗、低带宽、低延时、兼容性、可靠性。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干即教材总结，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>三低一兼可，物联协议需。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。","o":["正确","错误"]},{"t":"j","q":"网址与URL（统一资源定位符）是同一概念，网址是URL的非专业说法。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。网址就是URL的通俗叫法。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材说明网址与URL是同一概念，网址是URL的非专业说法。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干符合教材，正确。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>网址即URL。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P44）。","o":["正确","错误"]},{"t":"m","q":"物联设备利用HTTP从互联网获取数据的步骤包括？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C。三步获取流程，D无关。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>获取URL→发起GET请求→用ujson解析返回结果。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“直接关机”非步骤，排除。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>取址请求解析，三步取数。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P44）。","o":["A. 获取API的网址（URL）","B. 发起网络请求（如GET）","C. 解析返回结果","D. 直接关机"]},{"t":"m","q":"物联通信协议需要满足哪些特性？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。教材还要求可靠性。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物联协议需低功耗、低带宽、低延时、兼容性、可靠性。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均属所需特性，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>三低一兼可，特性全。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。","o":["A. 低功耗","B. 低带宽要求","C. 低延时","D. 兼容性"]},{"t":"m","q":"下列设备与其从互联网获取的数据对应正确的有？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均符合教材对应表。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材表列手机、手表、汽车、物联音箱各自互联网数据来源。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均正确，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>机手汽箱，各取数据。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P43）。","o":["A. 手机—天气预报、新闻、社交媒体通知","B. 手表—运动建议、天气情况","C. 汽车—交通路况","D. 物联音箱—天气"]},{"t":"q","q":"什么是API？物联设备如何利用HTTP通过API获取数据？","a":"API（应用程序接口）是预先定义的软件函数集合，像不同软件间的“桥梁”。物联设备先用Wi-Fi联网，通过HTTP向API的URL发起GET请求，获得XML/JSON格式的返回数据，再用ujson等库解析为字典提取所需内容。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>API是桥梁，HTTP三步取数。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>API提供数据访问接口，HTTP请求+解析实现取数。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>先定义API，再述“联网—请求—解析”流程。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>API桥，HTTP取，ujson析。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P43-45）。"},{"t":"q","q":"HTTP在物联网应用中有什么局限性？","a":"HTTP是客户端/服务器模式，设备必须主动请求数据；在物联网中设备为及时响应远程指令需不断轮询服务器，这会消耗物联设备有限资源、增加能耗，并给服务器和传输网络造成极大负担，因此并不完全适合高效实时的物联网场景。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>HTTP需轮询，耗资源增负担。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材探讨HTTP局限性，引出物联协议特定需求。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>从“主动请求—不断轮询—负面后果”作答。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>主动请求需轮询，资源能耗负担。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"},{"t":"q","q":"为什么物联通信协议要满足低功耗、低带宽、低延时、兼容性等要求？","a":"许多物联设备靠电池供电且分布广，需低功耗延长寿命；网络带宽在偏远区可能受限，需低带宽高效工作；自动驾驶、监控等需快速响应，需低延时；设备来自不同厂商，需兼容性；还要可靠确保系统无缝工作。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>从供电、带宽、实时、异构四方面说明。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材逐条解释物联协议特性的现实原因。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>对应每项特性给出应用场景原因。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>电池带宽实时异构，四因定特性。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第9课 互联协议仍沿用（P45-46）。"}],"L10":[{"t":"s","q":"MQTT协议的中文名称是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，MQTT即消息队列遥测传输。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>MQTT是物联网流行协议，开放、轻量、可靠、易实现。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“消息队列遥测传输”是MQTT中文名，区别于HTTP。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>MQTT消息队列遥测传。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47-48）。","o":["A. 超文本传输协议","B. 消息队列遥测传输","C. 文件传输协议","D. 邮件协议"]},{"t":"s","q":"MQTT采用什么通信机制？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，MQTT采用发布/订阅机制。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>MQTT发布订阅三角色：发布者、服务器、订阅者。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“发布订阅”是MQTT核心机制，区别于HTTP请求响应。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>MQTT发布订阅。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。","o":["A. 请求/响应（客户端/服务器）","B. 发布/订阅","C. 广播","D. 点对点直连"]},{"t":"s","q":"MQTT通信机制中的三个角色是？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选A，三个角色为发布者、服务器（中介）、订阅者。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材明确MQTT三角色及各自职责。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>记牢“发布者、服务器、订阅者”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>发布、中介、订阅，三角色。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。","o":["A. 发布者、服务器、订阅者","B. 传感器、执行器、主控板","C. 手机、电脑、路由器","D. 读卡器、标签、计算机"]},{"t":"s","q":"在MQTT中，发布者把消息发布到哪里？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，发布者向服务器管理的“主题”上传数据。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>发布者不直接给订阅者，而是发布到服务器管理的主题。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“主题”是MQTT中转核心，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>发布者，发主题。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。","o":["A. 直接发给订阅者","B. 服务器管理的主题","C. 本地文件","D. 蓝牙"]},{"t":"s","q":"服务器如何把消息给订阅者？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，服务器按订阅关系把主题消息推给订阅者。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>订阅者预先订阅主题，发布后服务器传递消息给订阅该主题的客户端。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“预先订阅→服务器推送”是核心，选B。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>订阅在先，服务器推送。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。","o":["A. 随机发送","B. 订阅者预先订阅某主题，发布者发布后服务器把消息传递给该订阅者","C. 不发送","D. 仅发给发布者"]},{"t":"s","q":"教材用“订报纸”类比MQTT，其中邮局相当于？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，邮局相当于MQTT服务器（中介）。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>类比：邮局=服务器，客户=订阅者，报社=发布者。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“邮局中转”对应服务器角色。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>邮局即服务器，中转消息。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。","o":["A. 订阅者","B. MQTT服务器","C. 发布者","D. 报纸"]},{"t":"s","q":"实践中MQTT服务器的端口号通常是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选C，MQTT默认端口为1883。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材代码mqttclient.connect中port=1883。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>记“MQTT端口1883”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>MQTT端口，一八八三。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P48-50）。","o":["A. 80","B. 443","C. 1883","D. 3306"]},{"t":"s","q":"连接MQTT服务器时，用于识别设备的唯一标识符是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>答案选B，设备ID（client_id）唯一识别设备。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>每个连服务器设备须有唯一client_id以便区分。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“唯一标识设备”对应client_id。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>设备ID，唯一认。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P48-50）。","o":["A. 主题ID","B. 设备ID（client_id）","C. 用户 ":"m","q":"使用在线MQTT服务器实现订阅功能，一般需要？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确答案：A、B、C、D。均为实践必要步骤。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材任务：注册→建项目主题→添设备记凭证→代码导入mqttclient/wifi/oled。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>四项均为教材流程，全选。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>注册建主题添设备导类，四步订阅。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P48-50）。","o":["A. 注册登录服务器","B. 创建项目并添加主题","C. 添加设备并记录设备ID/用户名/密码","D. 导入mqttclient、wifi、oled等类"]},{"t":"q","q":"请说明MQTT的发布/订阅通信机制及三个角色的关系。","a":"MQTT有发布者、服务器（中介）、订阅者三个角色。发布者把消息发布到服务器管理的“主题”上；订阅者预先订阅感兴趣的主题；服务器作为桥梁，在发布者发布后，把该主题的消息传递给所有订阅该主题的客户端。发布者与订阅者并不直接通信。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>三角色+主题中转机制。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>发布者发主题，服务器按订阅推送，发布订阅解耦。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>说明三角色职责与“经服务器中转”关系。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>发布主题，订阅收，服务器中转。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。"},{"t":"q","q":"用“订报纸”类比说明MQTT的工作过程。","a":"把MQTT服务器比作邮政局，订阅者比作订报客户，发布者比作报纸出版机构。出版机构每天出新报送到邮局；客户订了一年报纸后，邮局会每天把新报送到客户手中，无需客户每天重复订购。对应：发布者发消息到服务器主题，订阅者订阅后由服务器自动推送。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>邮局=服务器，客户=订阅者，报社=发布者。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材用订报纸类比发布/订阅推送过程。<br><br>\n<strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>逐一对应三者角色与“自动推送”。<br><br>\n<strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>报社发、邮局转、客户订收。<br><br>\n<strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>教材 第二单元 第10课 物物互通有新径（P47）。"},{"t":"q","q":"HTTP与MQTT在物联网通信上有什么主要区别？","a":"HTTP是请求/响应模式，客户端必须主动轮询服务器才能获取新数据或指令，实时性差且耗资源；MQTT是发布/订阅模式，设备订阅主题后由服务器主动推送消息，具有开放、轻量、可靠、易实现的特点，更适合大量低功耗、低性能远程设备的实时数据传输。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>HTTP轮询被动，MQTT订阅主动推送。<br><br>\n<strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>教材引导学生分析两协议异同与适用场景。<br =\"color:#e67e22;\">🧠 记忆口诀：<\/strong>Door/Lock走MQTT。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["RFID","MQTT（主题 Door/Lock）","NFC","蓝牙"]},{"t":"s","q":"远程控制开锁的用户端按下按键后，通常向主题发布的消息内容是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>用户端采集按键状态，若按下则发布MQTT主题消息“open”表示开锁指令。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>“open”即开启指令。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>开锁指令对应“open”。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>按下发open。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["close","open","hello","bell"]},{"t":"s","q":"远程控制开锁中，作为计算模块、负责搭建MQTT服务器的是？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>计算模块由具备移动热点功能的计算机担任，负责搭建MQTT服务器、设置主题、实现发布与订阅。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>计算机充当服务平台。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>MQTT服务器运行在带热点计算机上。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>电脑搭服务器。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["具备移动热点功能的计算机","按键传感器","舵机","摄像头"]},{"t":"s","q":"下列例子中，属于“自动控制”的是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>自动控制按设定规则由系统运转，如扫地机器人、火车站验票系统；其余均为人工发送指令的控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>自动=规则驱动，人工=指令驱动。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“按规则自动”是自动控制标志。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>规则自动跑。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["用户手机远程按下按键开锁","火车站验票系统按规则自动验票","用户发送指令开灯","用户订阅门铃通知"]},{"t":"j","q":"物联系统中的反馈与控制密不可分，控制是基于反馈的数据调整设备的工作状态。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。教材指出反馈与控制密不可分，控制基于反馈的数据调整设备/系统工作状态。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>反馈是控制的前提。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>反馈控相依。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["正确","错误"]},{"t":"j","q":"远程控制开锁功能中，用户端是输出模块。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。教材明确用户端是输入模块（发送指令），门锁端才是输出模块。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>用户端发指令=输入。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“用户端”非输出，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>用户是输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["正确","错误"]},{"t":"j","q":"人工控制是指通过发送指令，实现对远程设备的控制。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。人工控制即通过发送指令实现远程设备控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>远程开锁是人工控制实例。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与教材定义一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>指令即人工。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["正确","错误"]},{"t":"j","q":"远程控制开锁只能由系统自动完成，不能由人工控制。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。远程控制开锁是人工控制的典型例子，由用户发送“open”指令实现，并非只能自动完成。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>本课重点就是人工远程控制。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“只能自动”违背本课内容，明显错误。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>远程靠人工。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["正确","错误"]},{"t":"m","q":"远程控制开锁功能包含哪些功能模块？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>包含输入模块（用户端，主控板+按键传感器）、计算模块（带热点计算机，MQTT服务器）、输出模块（门锁端，主控板+舵机）；教材未单列存储模块。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>输入—计算—输出三模块。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>排除无关项，选前三。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>用户计算门锁。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷","o":["输入模块（用户端）","计算模块（MQTT服务器）","输出模块（门锁端）","存储模块"]},{"t":"m","q":"远程控制开锁的工作过程环节包括？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>四步均为教材流程：搭建MQTT与主题、订阅 open”指令）。自动控制：根据设定的控制规则，由系统控制设备运转，例如家里的扫地机器人（设定规则后自动规划路线、避开障碍清扫）和火车站验票系统。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>人工=指令驱动，自动=规则驱动，各举教材例。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>两类控制区别在触发方式。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>给出定义+对应实例。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>人指自规。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第14课 远程控制更便捷"}],"L15":[{"t":"s","q":"人脸识别技术属于下列哪一类识别技术？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>人脸识别是基于人的脸部特征数据进行身份识别的一种生物识别技术。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>生物识别包括人脸、指纹等。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“脸部特征”对应生物识别。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>人脸属生物。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["射频识别技术","生物识别技术","近场通信技术","条码识别技术"]},{"t":"s","q":"人脸识别是基于什么数据进行身份识别的？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>人脸识别基于人的脸部特征数据进行身份识别。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>脸部特征是识别依据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>题干“人脸”直接对应脸部特征。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>看脸识人。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["声音数据","脸部特征数据","指纹数据","电子标签数据"]},{"t":"s","q":"机器识别人脸的第一步是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>机器识别人脸第一步是采集人脸图像信息（相当于人眼捕捉图像传给大脑）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>识别流程始于图像采集。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>任何识别都先“采集图像”。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>先采图。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["提取五官特征","采集人脸图像信息","与人脸库匹配","分析整体轮廓"]},{"t":"s","q":"人脸识别中提取的“局部特征”主要包括以下哪些部位？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>机器提取人脸局部特征包括眉毛、眼睛、鼻子、嘴等，以及整体轮廓。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>五官特征用于区分身份。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“人脸局部特征”指向五官。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>眉眼鼻嘴。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["眉毛、眼睛、鼻子、嘴","手、脚、臂、腿","心脏、肺、肝、肾","键盘、鼠标、屏幕、主机"]},{"t":"s","q":"机器识别人脸时，“和记忆中的人脸特征进行匹配，识别出身份”是第几步？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>完整的人脸识别三步为：①采集图像；②分析提取特征；③与记忆中特征匹配识别身份，故匹配是第三步。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>匹配识别是最后一步。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“匹配识别”在流程末尾。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["第一步","第二步","第三步","第四步"]},{"t":"s","q":"在刷脸开锁功能中，负责采集人脸数据并进行人脸识别的是？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>输入模块由摄像头组成，负责采集人脸数据、进行人脸识别后发布消息至MQTT主题。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>摄像头完成采集与识别。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“采集人脸”对应输入模块（摄像头）。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>摄像即输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["输入模块（摄像头）","计算模块（计算机）","输出模块（舵机）","网络模块"]},{"t":"s","q":"刷脸开锁中，订阅MQTT主题、收到消息后控制舵机转动的是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>输出模块由主控板、舵机组成，订阅MQTT主题，收到消息后控制舵机转动开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>输出模块执行开锁动作。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“控制舵机转动”是输出模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>舵机属输出。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["输入模块（摄像头）","计算模块（计算机）","输出模块（主控板、舵机）","传感器"]},{"t":"s","q":"人脸识别要保证采集到的人脸图像能够被“看得见、看得懂、认得出”，其中“认得出”对应的是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>“看得见”=采集图像，“看得懂”=分析提取特征，“认得出”=与人脸库匹配识别身份。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>三步对应三句话。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“认得出”即匹配识别。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>见懂认。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["采集图像","提取与分析特征","与人脸库匹配并识别身份","网络传输"]},{"t":"s","q":"使用人脸识别平台模拟刷脸开锁时，首先需要做的准备是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>实验步骤：运行人脸识别平台→选择人脸匹配模块、添加人脸库→对准摄像头观察匹配。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>先建人脸库才能匹配。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“首先”是运行平台加人脸库。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>先建库再比。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["直接控制舵机转动","运行人脸识别平台并添加人脸库","断开网络连接","删除摄像头驱动"]},{"t":"s","q":"相比刷卡开锁，刷脸开锁的主要优势在于？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>人脸识别提供基于脸部生物特征身份识别，更加安全、便捷，无需携带卡片。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>生物特征难以伪造、随身可用。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“生物特征、安全便捷”是优势。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>刷脸更安全。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["成本更低","提供独一无二的生物特征，更安全便捷","不需要任何计算设备","速度更慢"]},{"t":"j","q":"人脸识别是基于人的脸部特征数据进行身份识别的一种生物识别技术。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。教材原话定义人脸识别为生物识别技术。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>脸部特征是识别依据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>人脸属生物。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["正确","错误"]},{"t":"j","q":"一个完整的人脸识别系统要求计算机能够进行三步：采集图像、提取特征、匹配识别。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。三步即采集人脸图像、分析提取特征、与存储特征匹配识别身份。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>三步流程是识别核心。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与教材一致，选正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["正确","错误"]},{"t":"j","q":"刷脸开锁中，摄像头属于输出模块。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。摄像头属于输入模块，负责采集人脸数据并进行人脸识别，不是输出模块。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>采集=输入。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>摄像头采集属输入，故判断为错。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>摄像即输入。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["正确","错误"]},{"t":"j","q":"人脸识别只需要采集图像，不需要与人脸库匹配也能识别身份。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。人脸识别必须与人脸库（记忆中的特征）进行匹配才能识别身份，仅采集图像无法确认“是谁”。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>匹配是识别关键。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“不需要匹配”违背三步流程，明显错误。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>不配比不了。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["正确","错误"]},{"t":"m","q":"机器识别人脸的基本过程包括以下哪些步骤？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>三步为采集图像、分析提取特征（眉毛眼睛鼻子嘴及轮廓）、匹配识别；语音播报不在基本识别步骤内。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>识别核心是采提匹。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>排除“语音播报”这一输出动作。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["采集人脸图像信息","分析并提取人脸局部特征与整体轮廓","与人脸库中的特征进行匹配识别身份","直接播放语音播报"]},{"t":"m","q":"刷脸开锁功能包含哪些功能模块？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>包含输入模块（摄像头）、计算模块（带热点计算机）、输出模块（主控板、舵机）；教材未单列“存储模块（硬盘）”。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>输入—计算—输出三模块。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>排除无关项，选前三。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>摄像脑舵。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["输入模块（摄像头）","计算模块（带热点计算机、MQTT服务器）","输出模块（主控板、舵机）","存储模块（硬盘）"]},{"t":"m","q":"人脸识别中需要提取的特征包括以下哪些？（多选）","a":[0,1,2,3],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>教材列举机器提取局部特征包括眉毛、眼睛、鼻子、嘴等，以及整体轮廓，四者全选。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>五官均为识别特征。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>均为五官特征，无干扰项则全选。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>眉眼鼻嘴。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能","o":["眉毛","眼睛","鼻子","嘴"]},{"t":"q","q":"简述机器识别人脸的基本过程（三步）。","a":"机器识别人脸的基本过程为三步：①采集人脸图像信息（相当于人眼捕捉图像）；②分析图像，提取人脸的局部特征（眉毛、眼睛、鼻子、嘴等）和整体轮廓；③将提取的特征与记忆（人脸库）中的人脸特征进行匹配，从而识别出人脸的身份。即“看得见、看得懂、认得出”。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>三步：采集、提取特征、匹配识别。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>对应“见懂认”。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按三步骤顺序展开。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>采提匹。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能"},{"t":"q","q":"刷脸开锁功能中，输入、计算、输出模块分别由哪些硬件组成？","a":"①输入模块：摄像头——采集人脸数据，进行人脸识别后，发布消息至MQTT服务器相应主题；②计算模块：具备移动热点功能的计算机——搭建MQTT服务器，设置主题，实现发布与订阅；③输出模块：主控板、舵机——订阅MQTT服务器相应主题，收到消息后控制舵机转动，实现开锁。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>三模块硬件与功能逐一对应。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>输入采集、计算中转、输出执行。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>按“模块=硬件+功能”结构作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>摄像脑舵。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能"},{"t":"q","q":"为什么说人脸识别技术让门锁更安全、便捷？","a":"因为人脸识别基于每个人独一无二的脸部生物特征进行身份识别，难以复制或冒用，安全性高于传统钥匙或卡片；同时用户无需携带任何实体钥匙或卡片，刷脸即可开锁，使用更为便捷，为人们提供更安全、便捷的生活体验，也代表了物联系统智能化的发展趋势。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>从生物特征唯一性与免携带两方面说明。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>生物识别优势明显。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>围绕“安全（唯一）+便捷（免带）”作答。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>唯一又免带。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第三单元/第15课 面容钥匙显智能"}],"L16":[{"t":"s","q":"不同物联系统的工作环节虽然各有不同，但一般都包含以下哪个不属于共同环节的流程？","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案 >📚 知识点讲解：<\/strong>反馈控制作用于现实世界。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“自动灌溉”是反馈控制动作。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>灌溉即控制。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第四单元/第16课 模块功能先划分","o":["采集数据","传输与存储数据","分析处理数据","反馈与控制"]},{"t":"s","q":"物联花盆项目中，负责采集环境数据的功能模块是？","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>环境感知模块负责采集环境数据（传感器采集，主控板接收并通过网络通信发送）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>感知模块是数据入口。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“采集环境数据”对应环境感知模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>感知采数据。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第四单元/第16课 模块功能先划分","o":["环境感知模块","网络通信模块","服务平台模块","执行模块"]},{"t":"s","q":"物联花盆项目中，负责数据的汇总、存储、处理的模块是？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>服务平台模块负责数据的汇总、存储、处理，并进行可视化与手动控制灌溉。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>服务平台是系统中枢。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“汇总存储处理”对应服务平台模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>平台管汇总。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第四单元/第16课 模块功能先划分","o":["环境感知模块","网络通信模块","服务平台模块","执行模块"]},{"t":"s","q":"物联花盆项目中，负责实现数据通信的模块是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>网络通信模块负责实现数据通信，既将传感器数据发往服务平台，也将天气预报数据传输给主控板。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>通信模块双向传输。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“数据通信”对应网络通信模块。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>网络管通信。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第四单元/第16课 模块功能先划分","o":["环境感知模块","网络通信模块","服务平台模块","执行模块"]},{"t":"s","q":"物联花盆项目中，执行模块中的执行器（如LED灯、水泵电机）的主要作用是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>执行模块负责反馈与控制，执行器根据主控板发出的指令产生相应动作（如LED灯、水泵电机），实现对现实世界的反馈。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>执行器是反馈的执行者。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“产生动作、反馈”是执行器职责。<br><br> 力。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>温湿对应温湿传，感知环境第一关。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["超声波传感器","温度传感器、湿度传感器","光敏传感器","压力传感器"]},{"t":"s","q":"主控板读取传感器数据后，通过什么协议/服务将数据发送到物联网服务平台？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>主控板通过网络将传感器数据发送给 MQTT 服务器（物联网服务平台）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>MQTT 是物联网中常用的轻量级消息传输协议，负责数据的存储与转发。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>物联网服务平台常用 MQTT，其他选项均非数据传输通道。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>数据上网走 MQTT，平台存储又转发。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["蓝牙音箱","MQTT 服务器","打印机","投影仪"]},{"t":"s","q":"当监测到的温湿度超出阈值范围时，系统会如何响应？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>超出阈值时系统执行反馈与控制：打开或关闭空调、恒湿器来调节环境。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>反馈与控制环节根据分析结果自动触发保护措施，是物联网“感知—决策—执行”的体现。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“超阈值”应对应自动调节设备，而非仅显示或无关联动作。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>超阈自动调空调，恒湿保护文物强。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["仅显示数据不做处理","自动执行打开或关闭空调、打开或关闭恒湿器的操作","自动切断全部电源","向警察报警"]},{"t":"s","q":"对采集到的环境数据进行分析处理，不能采用下列哪种形式？","a":3,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>数据分析可用物联网服务平台、电子表格、Python 模块，纸质信件不是数据分析形式。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>数字化分析是物联网的核心环节，借助平台图表、表格和编程实现可视化。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“纸质信件”明显不属于数据可视化分析手段。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>平台表格 Python，三招分析全都有。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["物联网服务平台图表","电子表格","Python 绘图库","纸质信件"]},{"t":"s","q":"要使传感器采集的数据在主控板上实时显示，前提是？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>要使数据实时显示，就要让传感器一直工作（持续采集）。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>持续采集是“实时”的基础，程序通常用循环不断读取传感器。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>“实时”必然对应“持续/一直工作”，排除关闭、单次、删除。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>想要实时看得清，传感器要不停勤。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["关闭传感器","让传感器一直工作","每天只读一次","删除历史数据"]},{"t":"s","q":"不同文物有不同的最佳保存环境要求，监测系统通过什么实现自动保护？","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>通过查找文物保存要求、确定环境数据阈值，并设计算法实现反馈与控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>阈值+算法是自动控制的核心，使系统在异常时自动触发保护。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>自动保护必然依赖“阈值+算法”，而非人工或无关操作。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>定阈值、写算法，自动保护顶呱呱。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["人工每天巡检","阈值探究并设计算法实现反馈与控制","把屏幕调大","关闭网络"]},{"t":"s","q":"要在智能终端查看博物馆环境数据，需要登录什么并点击相应主题？","a":2,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>登录 MQTT 服务器，点击相应主题即可查看已上传的数据。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>物联网服务平台以“主题（Topic）”区分不同设备/数据，订阅主题即可收数据。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与第5题呼应，查看平台数据要登录 MQTT 服务器并选主题。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>登录 MQTT，选对主题看数据。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["微信","QQ","MQTT 服务器","淘宝"]},{"t":"j","q":"物联环境监测系统采集的数据可以在大屏幕上实时更新，也可以发送到手机和计算机上。","a":0,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>正确。物联系统数据实时更新并可多端查看。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>实时性、远程可查看是物联网相比传统监测的突出优势。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>与第2题一致，判断为正确。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>实时更新多端看，物联优势记心间。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第五单元/第21课 文物保护新手段","o":["正确","错误"]},{"t":"j","q":"博物馆环境监测系统只需要采集数据，不需要传输与存储数据。","a":1,"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>错误。系统四个环节包含采集、传输与存储、分析处理、反馈与控制。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>传输与存储是把数据送达平台、实现远程查看的前提。<br><br><strong style=\"color:#2 \"color:#27ae60;\">💡 解题思路：<\/strong>选前三项。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>名密多因子，生物再加固。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第六单元/第30课 系统安全需升级","o":["用户名和密码","多因素认证","生物特征识别","完全不需要认证"]},{"t":"m","q":"保障物联门锁系统安全升级的措施包括？（多选）","a":[0,1,2],"an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>活体检测、身份认证、加密传输均提升安全；明文传输反而增加风险。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>三者是本课系统升级核心要点。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>选前三项，排除明文。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>活体认证加加密，门锁三保险。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第六单元/第30课 系统安全需升级","o":["摄像头活体检测","用户身份认证","加密传输","明文传输密码"]},{"t":"q","q":"原物联门锁存在哪些安全隐患？如何通过活体检测提升安全性？","a":"隐患：①照片可欺骗摄像头，缺少活体检测；②远程开锁订阅MQTT主题，任何人接入服务器发“open”即可开锁，缺少身份认证。提升：增加张嘴、眨眼等面部动作识别，确认是真人再开锁；进一步用深度摄像头采集三维特征并配合复杂算法，抵御AI换脸视频欺骗。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>两大隐患：非活体欺骗、无身份认证远程开锁。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>活体检测是采集端安全升级重点。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>先列隐患，再说动作/三维活体方案。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>照片能骗门，活体来补牢。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第六单元/第30课 系统安全需升级"},{"t":"q","q":"什么是用户身份认证？在物联门锁中如何实现简单的身份认证？","a":"用户身份认证是让系统知道“谁”在开门，若是非法用户则拒绝开门，从而提升安全。简单实现：将用户名和密码加入开锁消息，如“user1, psd123, open”；门锁端增加数据存储（列表存用户名密码），用 split() 解析消息，与存储数据对比，匹配才执行开锁，非授权用户发送消息舵机不转动。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>认证=识别身份并授权；实现靠用户名密码比对。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>任务1、任务2即设计实现简单认证。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>先定义后给消息格式与 split 比对流程。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>名密加指令，split 比对开。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第六单元/第30课 系统安全需升级"},{"t":"q","q":"为什么用户名、密码明文传输有风险？应如何解决物联网中的数据传输安全问题？","a":"风险：不同系统常用相同用户名密码，一旦某系统明文数据被泄露，其他平台也受威胁；明文在网络传输中易被窃听泄露。解决：对传输数据加密，利用算法设计加密传输规则（如加随机盐、对称加密等），并配合身份认证、网络隔离等措施，保障传输的保密性与完整性。","an":"<strong style=\"color:#c0392b;\">🎯 答案解析：<\/strong>明文易窃听、易连锁泄露；加密可较好解决。<br><br><strong style=\"color:#2980b9;\">📚 知识点讲解：<\/strong>加密传输是系统升级重要环节。<br><br><strong style=\"color:#27ae60;\">💡 解题思路：<\/strong>先说风险机理，再给加密等对策。<br><br><strong style=\"color:#e67e22;\">🧠 记忆口诀：<\/strong>明文满网跑，加密方安稳。<br><br><strong style=\"color:#8e44ad;\">📖 教材索引：<\/strong>第六单元/第30课 系统安全需升级"}]}},"notes":{"g7":[{"id":"m1","title":"第一模块：互联网基础","subtitle":"第1-3课 · 探寻互联网新世界","intro":"<p>互联网是二十世纪最伟大的发明之一。本模块将介绍互联网的诞生与发展，引导学生感受互联网演变过程中的<strong>创新<\/strong>，体会互联网带来的<strong>思想之变、技术之变和社会之变<\/strong>，了解我国在互联网建设方面取得的伟大成就。<\/p><p><strong>课标要求：<\/strong>了解互联网诞生与发展史，认识通信协议标准化和网状结构的重要性；知道互联网应用的特征；了解互联网对个人、行业和文化的影响。<\/p>","lessons":[{"id":"L01","title":"第1课 互联网发展靠创新","knowledge":"<h3>一、计算机网络与互联网<\/h3>\n<p><strong>计算机网络<\/strong>是用通信线路把若干台计算机互相连接起来，遵照某些通信协议，用于实现<strong>信息交换和资源共享<\/strong>的系统。多个计算机网络相互连接就形成了<strong>互联网<\/strong>。<\/p>\n<h3>二、互联网发展四个阶段<\/h3>\n<table class=\"kb-table\">\n<tr><th>阶段<\/th><th>时期<\/th><th>核心特征<\/th><\/tr>\n<tr><td><strong>诞生阶段<\/strong><\/td><td>面向终端的联机系统<\/td><td>多个<em>不具备独立信息处理能力<\/em>的终端共享一台计算机（现在手机等终端已有独立处理器）<\/td><\/tr>\n<tr><td><strong>形成阶段<\/strong><\/td><td>20世纪60年代末<\/td><td>实现计算机之间的互联，互联网雏形——<em>阿帕网(ARPANET)<\/em>于1969年投入使用<\/td><\/tr>\n<tr><td><strong>互联阶段<\/strong><\/td><td>20世纪80年代<\/td><td>实现协议标准化，<em>TCP/IP<\/em>走上历史舞台（1983年阿帕网改用TCP/IP）<\/td><\/tr>\n<tr><td><strong>高速网络阶段<\/strong><\/td><td>20世纪90年代至今<\/td><td>作为\"信息高速公路\"，互联网在社会中应用日益普及<\/td><\/tr>\n<\/table>\n<h3>三、关键事件时间线<\/h3>\n<table class=\"kb-table\">\n<tr><th>年份<\/th><th>事件<\/th><\/tr>\n<tr><td>1969<\/td><td>阿帕网投入使用<\/td><\/tr>\n<tr><td>1971<\/td><td>电子邮件面世<\/td><\/tr>\n<tr><td>1974<\/td><td>IP面世<\/td><\/tr>\n<tr><td>1981<\/td><td>IPv4发布<\/td><\/tr>\n<tr><td>1983<\/td><td>阿帕网改用TCP/IP<\/td><\/tr>\n<tr><td>1989<\/td><td>万维网诞生<\/td><\/tr>\n<tr><td>1990<\/td><td>浏览器诞生<\/td><\/tr>\n<tr><td>2017<\/td><td>大规模启用IPv6<\/td><\/tr>\n<\/table>\n<h3>四、网状结构的优势<\/h3>\n<p>网状结构中，节点间有<strong>多条通信线路<\/strong>，当一条线路出现故障时，可切换到其他线路继续通信，<strong>有效减小单个节点或单条线路故障对网络整体通信的影响<\/strong>。因此互联网骨干网采用网状结构。<\/p>\n<h3>五、我国互联网发展里程碑<\/h3>\n<ul>\n<li><strong>1987年<\/strong>：建成我国第一个国际互联网电子邮件节点<\/li>\n<li><strong>1994年<\/strong>：实现与国际互联网全功能连接<\/li>\n<li><strong>1995年<\/strong>：开始向社会提供互联网接入服务<\/li>\n<li><strong>1997年<\/strong>：人民网上线，第一家中央重点新闻宣传网站<\/li>\n<li><strong>1998年<\/strong>：第一笔网上电子交易成功<\/li>\n<li><strong>2008年<\/strong>：网民规模达2.53亿，世界第一<\/li>\n<li><strong>2013年<\/strong>：成为全球最大网络零售市场<\/li>\n<li><strong>2023年<\/strong>：网民规模10.92亿，网上零售额15.42万亿<\/li>\n<\/ul>\n<h3>六、四大建设成就<\/h3>\n<table class=\"kb-table\">\n<tr><th>成就<\/th><th>详情<\/th><\/tr>\n<tr><td><strong>最大网络实体<\/strong><\/td><td>2008年网民规模世界第一，世界互联网企业前10强中我国占近半数<\/td><\/tr>\n<tr><td><strong>\"互联网+\"成果显著<\/strong><\/td><td>2012年理念出现，2015年写入政府工作报告；\"灯塔工厂\"62家全球第一<\/td><\/tr>\n<tr><td><strong>5G领跑<\/strong><\/td><td>经历\"1G空白、2G跟随、3G突破、4G并跑\"后实现\"5G领跑\"，基站337.7万个<\/td><\/tr>\n<tr><td><strong>北斗卫星导航系统<\/strong><\/td><td>自主建设、独立运行；\"中国的北斗、世界的北斗、一流的北斗\"<\/td><\/tr>\n<\/table>","exam":"<ul><li><strong>互联网发展的四个阶段<\/strong>名称和核心特征（高频填空/选择）<\/li><li><strong>阿帕网(ARPANET)<\/strong>是互联网雏形，1969年投入使用<\/li><li><strong>TCP/IP协议标准化<\/strong>是互联阶段核心事件（1983年）<\/li><li><strong>网状结构优势<\/strong>：多路径、容错性强、减小单点故障影响<\/li><li>我国互联网发展<strong>关键年份<\/strong>（1987、1994、1995、2008）<\/li><li><strong>四大建设成就<\/strong>：最大网络实体、互联网+、5G领跑、北斗系统<\/li><li>\"灯塔工厂\"代表智能制造最高水平<\/li><\/ul>","difficulty":"<h3>易混点：四个发展阶段对照<\/h3><table class=\"kb-table\"><tr><th>阶段<\/th><th>核心特征<\/th><th>记忆关键词<\/th><\/tr><tr><td>诞生<\/td><td>终端共享主机（终端无独立处理能力）<\/td><td>共享、终端<\/td><\/tr><tr><td>形成<\/td><td>计算机互联，阿帕网出现<\/td><td>互联、雏形<\/td><\/tr><tr><td>互联<\/td><td>TCP/IP标准化<\/td><td>标准化、协议<\/td><\/tr><tr><td>高速网络<\/td><td>信息高速公路，普及应用<\/td><td>普及、高速<\/td><\/tr><\/table><h3>5G发展路线记忆<\/h3><p><strong>空→跟→突→并→领<\/strong>：1G空白→2G跟随→3G突破→4G并跑→5G领跑<\/p>","qa":"<p><strong>Q1：互联网经历了哪四个发展阶段？各阶段的主要特征是什么？<\/strong><\/p><p>答：诞生阶段（终端共享主机）、形成阶段（计算机互联，阿帕网1969年出现）、互联阶段（TCP/IP标准化，1983年）、高速网络阶段（信息高速公路，普及应用）。<\/p><p><strong>Q2：为什么互联网采用网状结构？<\/strong><\/p><p>答：网状结构中节点间有多条通信线路，当一条故障时可切换至其他线路，有效减小单点故障对整体通信的影响，使网络更健壮。<\/p><p><strong>Q3：我国互联网建设取得了哪些主要成就？<\/strong><\/p><p>答：①建成最大网络实体（网民10.92亿）；②\"互联网+\"成果显著（62家灯塔工厂全球第一）；③5G领跑全球；④建成北斗卫星导航系统。<\/p>"},{"id":"L02","title":"第2课 互联网应用新特征","knowledge":"<h3>一、互联网应用的三大特征<\/h3>\n<table class=\"kb-table\">\n<tr><th>特征<\/th><th>说明<\/th><\/tr>\n<tr><td><strong>交互性强<\/strong><\/td><td>用户可主动参与，与系统双向互动<\/td><\/tr>\n<tr><td><strong>操作简单<\/strong><\/td><td>图形化界面替代字符界面，易于使用<\/td><\/tr>\n<tr><td><strong>图文声像并茂<\/strong><\/td><td>从纯文本发展为多媒体融合呈现<\/td><\/tr>\n<\/table>\n<h3>二、互联网应用的三次演变<\/h3>\n<table class=\"kb-table\">\n<tr><th>演变方向<\/th><th>早期<\/th><th>现在<\/th><th>技术推动<\/th><\/tr>\n<tr><td><strong>内容形式<\/strong><\/td><td>文本为主<\/td><td>图文声像并茂<\/td><td>硬件发展使设备能处理复杂数据<\/td><\/tr>\n<tr><td><strong>交互方式<\/strong><\/td><td>字符界面（输命令）<\/td><td>图形化界面（点击拖拽）<\/td><td>图形界面技术+触摸屏<\/td><\/tr>\n<tr><td><strong>功能特征<\/strong><\/td><td>单一应用<\/td><td>应用融合<\/td><td>信息传输技术进步<\/td><\/tr>\n<\/table>\n<p>中国第一封电子邮件（1987年9月）：\"Across the Great Wall we can reach every corner in the world（越过长城，走向世界）\"。<\/p>\n<h3>三、互联网应用四大类别<\/h3>\n<table class=\"kb-table\">\n<tr><th>类别<\/th><th>典型应用<\/th><\/tr>\n<tr><td>基础应用<\/td><td>即时通信、搜索引擎、网络新闻、社交应用<\/td><\/tr>\n<tr><td>商务交易<\/td><td>网上外卖、网络购物、旅行预订、网络支付<\/td><\/tr>\n<tr><td>公共服务<\/td><td>网约车、在线教育、在线医疗<\/td><\/tr>\n<tr><td>网络娱乐<\/td><td>网络音乐、网络视频、网络游戏<\/td><\/tr>\n<\/table>","exam":"<ul><li><strong>互联网应用三大特征<\/strong>：交互性强、操作简单、图文声像并茂<\/li><li><strong>三次演变<\/strong>及其技术推动力<\/li><li>中国第一封电子邮件的时间和内容<\/li><li><strong>四大应用类别<\/strong>及典型代表<\/li><\/ul>","difficulty":"<h3>演变三维度对比<\/h3><table class=\"kb-table\"><tr><th>维度<\/th><th>早期<\/th><th>现在<\/th><th>推动因素<\/th><\/tr><tr><td>内容<\/td><td>文本为主<\/td><td>图文声像并茂<\/td><td>硬件技术发展<\/td><\/tr><tr><td>交互<\/td><td>字符界面<\/td><td>图形化界面<\/td><td>GUI+触摸屏<\/td><\/tr><tr><td>功能<\/td><td>单一应用<\/td><td>应用融合<\/td><td>传输技术进步<\/td><\/tr><\/table>","qa":"<p><strong>Q1：互联网应用具有哪三大特征？这些特征是如何形成的？<\/strong><\/p><p>答：交互性强、操作简单、图文声像并茂。这些特征依赖于硬件技术发展、图形界面普及和信息传输技术进步等持续的创新才逐渐发展而成。<\/p><p><strong>Q2：互联网应用经历了怎样的演变过程？<\/strong><\/p><p>答：①从文本到图文声像并茂（内容丰富化）；②从字符界面到图形化界面（操作简便化）；③从单一应用到应用融合（功能综合化）。<\/p>"},{"id":"L03","title":"第3课 互联网影响新体验","knowledge":"<h3>一、\"互联网+\"六大领域（2015年写入政府工作报告）<\/h3>\n<table class=\"kb-table\">\n<tr><th>领域<\/th><th>典型应用<\/th><\/tr>\n<tr><td><strong>互联网+农业<\/strong><\/td><td>智能灌溉、精准种植、农产品回溯、农产品电商<\/td><\/tr>\n<tr><td><strong>互联网+工业<\/strong><\/td><td>\"5G+工业互联网\"、智能制造、\"灯塔工厂\"（智能化数字化自动化）<\/td><\/tr>\n<tr><td><strong>互联网+科研<\/strong><\/td><td>高海拔宇宙线观测站\"拉索\"、大型对撞机数据传输<\/td><\/tr>\n<tr><td><strong>互联网+教育<\/strong><\/td><td>翻转课堂、微课、慕课(MOOC)、终身教育体系<\/td><\/tr>\n<tr><td><strong>互联网+医疗<\/strong><\/td><td>远程咨询、远程诊疗、远程手术、互联网医院<\/td><\/tr>\n<tr><td><strong>互联网+交通<\/strong><\/td><td>交通引导、智能导航、智能公交<\/td><\/tr>\n<\/table>\n<h3>二、互联网+文化<\/h3>\n<p>互联网与文化有天然的亲和力和强大的融合力。中国文化正在迎来<strong>新发展、新平台、新生态<\/strong>。（如故宫博物院数字文物库让文物\"活\"起来）<\/p>\n<h3>三、互联网文化挑战<\/h3>\n<p>自媒体、短视频伴生<strong>庸俗、媚俗、低俗<\/strong>作品。国家出台《互联网文化管理暂行规定》《互联网直播服务管理规定》等加强监管。<\/p>","exam":"<ul><li><strong>\"互联网+\"六大领域<\/strong>及典型应用（2015年写入政府工作报告）<\/li><li><strong>\"灯塔工厂\"<\/strong>代表智能制造最高水平：智能化、数字化、自动化<\/li><li>互联网+教育的新型方式：翻转课堂、微课、慕课<\/li><li>互联网对<strong>文化传承<\/strong>的影响及\"三俗\"问题<\/li><\/ul>","difficulty":"<h3>各\"互联网+\"领域关键词速记<\/h3><table class=\"kb-table\"><tr><th>领域<\/th><th>关键词<\/th><\/tr><tr><td>农业<\/td><td>灌溉、种植、回溯<\/td><\/tr><tr><td>工业<\/td><td>5G+工业互联网、灯塔工厂<\/td><\/tr><tr><td>科研<\/td><td>拉索观测站、对撞机<\/td><\/tr><tr><td>教育<\/td><td>翻转课堂、慕课、终身学习<\/td><\/tr><tr><td>医疗<\/td><td>远程诊疗/手术、互联网医院<\/td><\/tr><tr><td>交通<\/td><td>导航、智能公交<\/td><\/tr><\/table>","qa":"<p><strong>Q1：简述\"互联网+\"对教育的影响。<\/strong><\/p><p>答：构建网络化、数字化、个性化、终身化教育体系，出现翻转课堂、微课、慕课等新型学习方式，实现\"人人皆学、处处能学、时时可学\"。<\/p><p><strong>Q2：互联网+文化面临哪些挑战？<\/strong><\/p><p>答：自媒体、短视频伴生庸俗、媚俗、低俗作品。国家出台了《互联网文化管理暂行规定》等政策法规加强监管。<\/p>"}]},{"id":"m2","title":"第二模块：网络协议与传输","subtitle":"第4-10课 · 直播网络我来建","intro":"<p>本模块引导学生了解网络通信的基本原理，包括分包传输、网络协议分层、IP地址与域名、路由服务、可靠传输等核心概念，最终综合所学搭建小型直播网络。<\/p><p><strong>课标要求：<\/strong>初步了解互联网协议，知道网络中数据的编码、传输和呈现的原理；能设计和搭建简单的小型视频直播网络。<\/p>","lessons":[{"id":"L04","title":"第4课 数据分包灵活传","knowledge":"<h3>一、存储转发思想<\/h3><p>计算机网络进行数据传输时采用<strong>\"接力传\"<\/strong>思想，称为<strong>存储转发<\/strong>：节点先将数据<strong>存储在本地<\/strong>，再<strong>转发出去<\/strong>。类似于古代邮驿的接力传递。<\/p><h3>二、分包传输策略<\/h3><p>互联网传输数据时，先将数据分成<strong>一个个小的数据包<\/strong>，每个数据包可根据拥堵情况<strong>沿不同路径<\/strong>到达接收者。接收者收到后<strong>重新组装<\/strong>。这解决了两个问题：①大文件超出节点存储能力；②局部出错需重传全部数据。<\/p><h3>三、分包传输三步曲<\/h3><p><strong>分包 → 传输 → 组装<\/strong>。每个数据包需要<strong>编号<\/strong>，否则接收者无法正确组装。<\/p><h3>四、网络协议的引入<\/h3><p>不同设备需要遵循同样的规范（网络协议），对数据包的<strong>产生、传输、接收<\/strong>等全过程做出规定。<\/p>","exam":"<ul><li><strong>存储转发的定义<\/strong>：先存储→再转发，逐跳接力<\/li><li><strong>分包传输策略<\/strong>的核心思想及三步曲<\/li><li>分包解决的两大问题：大文件传输和局部错误重传<\/li><li>网络协议要对全过程做出规定<\/li><\/ul>","difficulty":"<h3>存储转发 vs 分包传输<\/h3><table class=\"kb-table\"><tr><th>概念<\/th><th>核心思想<\/th><\/tr><tr><td>存储转发<\/td><td>逐跳接力：收到→存储→转发→下一跳<\/td><\/tr><tr><td>分包传输<\/td><td>化整为零：大文件→小数据包→多路径→组装<\/td><\/tr><\/table><p><strong>难点：<\/strong>分包策略需编号机制确保组装顺序，需网络协议统一规范。<\/p>","qa":"<p><strong>Q1：什么是存储转发？<\/strong><\/p><p>答：存储转发是计算机网络传输数据的基本方式。节点先将数据存储在本地，再转发给下一个节点，如同接力赛逐跳传输。<\/p><p><strong>Q2：为什么要采用分包传输策略？<\/strong><\/p><p>答：①大文件可能超出节点存储能力；②不分包则局部错误需重传全部数据。分包后每个包独立传输，可走不同路径，出错只重传单个包。<\/p>"},{"id":"L05","title":"第5课 网络协议分层设","knowledge":"<h3>一、网络协议<\/h3><p>计算机之间通信需要<strong>共同遵守的规范<\/strong>。网页、电子邮件、视频等都被转化为<strong>1和0组成的二进制数<\/strong>传输，通信双方需<strong>事先约定<\/strong>编码规则。<\/p><h3>二、分层思想<\/h3><p>把复杂的通信问题<strong>分到不同层中<\/strong>，每层解决相对简单的问题，层层相叠，从而解决复杂的网络通信问题。<\/p><h3>三、TCP/IP四层结构（必考）<\/h3><table class=\"kb-table\"><tr><th>层次（从上到下）<\/th><th>功能<\/th><th>主要协议<\/th><\/tr><tr><td><strong>应用层<\/strong><\/td><td>负责如何使用数据<\/td><td>HTTP、HTTPS、FTP<\/td><\/tr><tr><td><strong>传输层<\/strong><\/td><td>负责数据完整性及可靠性<\/td><td>TCP、UDP<\/td><\/tr><tr><td><strong>网络层<\/strong><\/td><td>负责处理数据包<\/td><td>IP<\/td><\/tr><tr><td><strong>网络接口层<\/strong><\/td><td>负责实际传输二进制数据<\/td><td>以太网等通信接口<\/td><\/tr><\/table>","exam":"<ul><li><strong>网络协议的定义<\/strong><\/li><li><strong>分层思想<\/strong>的意义：化复杂为简单<\/li><li><strong>TCP/IP四层结构<\/strong>（名称、功能、协议）——<strong>必考<\/strong><\/li><li>TCP/IP是互联网的<strong>基础协议<\/strong><\/li><\/ul>","difficulty":"<h3>TCP/IP四层记忆法<\/h3><p><strong>应传网接<\/strong>（应用层→传输层→网络层→网络接口层）<\/p><p>类比快递：应用层（寄什么）→传输层（确保完好）→网络层（打包贴单）→网络接口层（运输）<\/p>","qa":"<p><strong>Q1：简述TCP/IP的四层结构及各层功能。<\/strong><\/p><p>答：①应用层——负责如何使用数据（HTTP、HTTPS、FTP）；②传输层——负责数据完整性及可靠性（TCP、UDP）；③网络层——负责处理数据包（IP）；④网络接口层——负责实际传输二进制数据。<\/p><p><strong>Q2：什么是分层思想？<\/strong><\/p><p>答：把复杂的通信问题分到不同层中，每层解决相对简单的问题，层层相叠，从而解决复杂的网络通信问题。<\/p>"},{"id":"L06","title":"第6课 数字身份辨设备","knowledge":"<h3>一、IP地址<\/h3><p>为区分网络中设备而设置的<strong>数字形式标识<\/strong>。计算机网络中的每台设备都需要一个唯一的IP地址。<\/p><h3>二、IPv4地址<\/h3><ul><li>由<strong>\".\"隔开的4个十进制数<\/strong>表示——\"点分十进制\"法<\/li><li>32位二进制数，每段范围<strong>0～255<\/strong><\/li><li>例：192.168.10.4 → 11000000 10101000 00001010 00000100<\/li><\/ul><h3>三、公用地址 vs 私有地址<\/h3><table class=\"kb-table\"><tr><th>类型<\/th><th>使用范围<\/th><th>分配方式<\/th><\/tr><tr><td><strong>公用地址<\/strong><\/td><td>互联网中使用<\/td><td>专门机构统一分配<\/td><\/tr><tr><td><strong>私有地址<\/strong><\/td><td>单位、家庭内部网<\/td><td>组网人员自行分配<\/td><\/tr><\/table><h3>四、IP地址结构<\/h3><p><strong>IP地址 = 网络号 + 主机号<\/strong><\/p><h3>五、IPv4→IPv6<\/h3><ul><li>IPv4：32位，2^32个地址，<strong>已枯竭<\/strong><\/li><li>IPv6：<strong>128位<\/strong>，约<strong>3.4×10^38<\/strong>个地址<\/li><li>我国已建成<strong>全球最大规模IPv6网络<\/strong><\/li><\/ul>","exam":"<ul><li><strong>IP地址的定义和作用<\/strong><\/li><li><strong>IPv4表示方法<\/strong>：点分十进制，4段0~255，32位<\/li><li>公用地址 vs 私有地址的区别<\/li><li>IP地址=网络号+主机号<\/li><li>IPv6的必要性：IPv4地址枯竭<\/li><li>IPv6地址128位，我国IPv6建设成就<\/li><\/ul>","difficulty":"<h3>IPv4 vs IPv6对比<\/h3><table class=\"kb-table\"><tr><th>对比项<\/th><th>IPv4<\/th><th>IPv6<\/th><\/tr><tr><td>地址长度<\/td><td>32位<\/td><td>128位<\/td><\/tr><tr><td>数量<\/td><td>约43亿<\/td><td>约3.4×10^38<\/td><\/tr><tr><td>现状<\/td><td>已枯竭<\/td><td>大规模部署中<\/td><\/tr><\/table>","qa":"<p><strong>Q1：什么是IP地址？IPv4地址如何表示？<\/strong><\/p><p>答：IP地址是为区分网络中设备而设置的数字标识。IPv4采用\"点分十进制\"法，由\".\"隔开的4个十进制数表示，每段0~255，是32位二进制数。<\/p><p><strong>Q2：为什么要从IPv4升级到IPv6？<\/strong><\/p><p>答：IPv4只有约43亿个地址，已枯竭。IPv6地址128位，可提供约3.4×10^38个地址，足以给每台设备分配独立IP地址。<\/p>"},{"id":"L07","title":"第7课 域名解析换编码","knowledge":"<h3>一、域名<\/h3><p>按规则给互联网中计算机起的<strong>字符型名字<\/strong>。例：www.moe.gov.cn——cn（中国/根域名）← gov（政府）← moe（教育部）← www（服务器名），<strong>自右向左依次缩小<\/strong>范围。<\/p><h3>二、域名解析<\/h3><p>把<strong>域名转换成IP地址<\/strong>的过程。由<strong>域名服务器(DNS)<\/strong>提供此服务，多个域名服务器<strong>分层协同<\/strong>工作。<\/p><h3>三、根服务器<\/h3><p>位于域名解析系统<strong>最顶端<\/strong>。IPv4体系：全球13台（美国10台、欧洲2台、日本1台）。我国\"雪人计划\"部署<strong>25台IPv6根服务器<\/strong>，<strong>4台在我国<\/strong>。<\/p><h3>四、DNS欺骗<\/h3><p>在域名解析过程中，把用户要访问的IP地址<strong>替换成特定IP<\/strong>，使用户访问假冒网站。这不是\"攻破\"网站，而是<strong>冒名顶替<\/strong>。IPv6支持更安全的域名解析服务。<\/p>","exam":"<ul><li><strong>域名结构<\/strong>：自右向左范围缩小<\/li><li><strong>域名解析<\/strong>的定义和DNS的作用<\/li><li>域名解析<strong>分层协同<\/strong>机制<\/li><li><strong>根服务器<\/strong>及\"雪人计划\"（25台IPv6根服务器，4台在我国）<\/li><li><strong>DNS欺骗<\/strong>原理与危害<\/li><\/ul>","difficulty":"<h3>域名结构解析示例<\/h3><p>www.moe.gov.cn → 从右到左：cn（中国）→ gov（政府）→ moe（教育部）→ www（服务器名）<\/p><p><strong>DNS欺骗 ≠ 网站被攻破<\/strong>：DNS欺骗是冒名顶替，不是攻破网站本身。<\/p>","qa":"<p><strong>Q1：什么是域名？域名和IP地址有什么关系？<\/strong><\/p><p>答：域名是按规则给计算机起的字符型名字。域名需要通过域名解析(DNS)转换成IP地址才能进行网络通信。<\/p><p><strong>Q2：什么是DNS欺骗？<\/strong><\/p><p>答：DNS欺骗是在域名解析过程中把用户要访问的IP地址替换成特定IP地址，使用户访问假冒网站，从而窃取信息。<\/p>"},{"id":"L08","title":"第8课 路由路径靠算法","knowledge":"<h3>一、路由服务<\/h3><p><strong>路由<\/strong>：路（道路）+ 由（从哪来到哪去）。路由器收到IP数据包后根据<strong>目的地IP地址<\/strong>计算下一跳位置，逐步送达目的地。<\/p><h3>二、路由表与路径选择<\/h3><p>路由器依据<strong>路由表<\/strong>工作。有多条路径时，根据<strong>权重<\/strong>选择更优路径。<\/p><h3>三、tracert命令<\/h3><p>追踪通信路径，显示经过的路由器。部分设备出于安全考虑拒绝回应，显示为<strong>星号(*)<\/strong>。<\/p><h3>四、域名解析 vs 路由服务<\/h3><p><strong>\"域名解析服务器决定数据去哪，路由服务决定数据如何去\"<\/strong><\/p><h3>五、路由服务自主可控<\/h3><p>路由器硬件生产、软件开发、算法设计各层面<strong>自主可控<\/strong>，关系<strong>国家网络安全<\/strong>。路由器已被列为<strong>网络关键设备<\/strong>。<\/p>","exam":"<ul><li><strong>路由服务的定义<\/strong>和路由器作用<\/li><li>路由表的概念和路径选择机制<\/li><li>tracert命令功能<\/li><li>域名解析 vs 路由服务的区别<\/li><li>路由服务自主可控的重要性<\/li><\/ul>","difficulty":"<h3>域名解析 vs 路由服务对比<\/h3><table class=\"kb-table\"><tr><th>对比<\/th><th>域名解析(DNS)<\/th><th>路由服务<\/th><\/tr><tr><td>作用<\/td><td>决定\"去哪\"<\/td><td>决定\"如何去\"<\/td><\/tr><tr><td>输入→输出<\/td><td>域名→IP地址<\/td><td>IP数据包→下一跳<\/td><\/tr><tr><td>载体<\/td><td>域名服务器<\/td><td>路由器+路由表<\/td><\/tr><\/table>","qa":"<p><strong>Q1：什么是路由服务？<\/strong><\/p><p>答：路由服务由路由器协同实现，路由器收到IP数据包后根据目的地IP地址计算下一跳位置，逐步送达目的地。<\/p><p><strong>Q2：为什么路由服务自主可控很重要？<\/strong><\/p><p>答：控制了路由服务就控制了网络传输过程。路由器硬件、软件、算法自主可控关系国家网络安全，路由器已被列为网络关键设备。<\/p>"},{"id":"L09","title":"第9课 数据传输有新意","knowledge":"<h3>一、端口<\/h3><p>计算机同时运行多个互联网应用时，通过<strong>端口(0～65535)<\/strong>区分不同应用的数据。<\/p><h3>二、TCP vs UDP（必考）<\/h3><table class=\"kb-table\"><tr><th>对比项<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><tr><td>传输方式<\/td><td><strong>可靠传输<\/strong><\/td><td><strong>不可靠传输<\/strong><\/td><\/tr><tr><td>连接方式<\/td><td>面向连接（需三次握手）<\/td><td>面向无连接<\/td><\/tr><tr><td>适用场景<\/td><td>文件传输等要求准确<\/td><td>视频直播等要求快速<\/td><\/tr><tr><td>出错处理<\/td><td>重传出错数据包<\/td><td>不重传（数据已变）<\/td><\/tr><\/table><h3>三、三次握手<\/h3><p>SYN → SYN+ACK → ACK，确保通信双方已建立连接，是TCP可靠传输的前提。<\/p><h3>四、滑动窗口机制<\/h3><p>给数据包标序号并记录状态，出错重传；网络堵塞时<strong>降低发送频率<\/strong>缓解拥堵。<\/p>","exam":"<ul><li><strong>端口的作用<\/strong><\/li><li><strong>TCP vs UDP<\/strong>核心区别——<strong>必考<\/strong><\/li><li><strong>三次握手<\/strong>过程<\/li><li>TCP面向连接 vs UDP面向无连接<\/li><li>可靠传输 vs 不可靠传输适用场景<\/li><\/ul>","difficulty":"<h3>TCP vs UDP 场景判断<\/h3><table class=\"kb-table\"><tr><th>场景<\/th><th>选TCP还是UDP<\/th><th>原因<\/th><\/tr><tr><td>传输文件<\/td><td>TCP<\/td><td>必须准确，一个包出错全部不能用<\/td><\/tr><tr><td>视频直播<\/td><td>UDP<\/td><td>要求快速，数据已变，重发无意义<\/td><\/tr><tr><td>浏览网页<\/td><td>TCP<\/td><td>需要稳定可靠传输<\/td><\/tr><\/table>","qa":"<p><strong>Q1：TCP和UDP有什么区别？分别适用于什么场景？<\/strong><\/p><p>答：TCP可靠传输、面向连接（需三次握手），适用于文件传输等准确性要求高的场景；UDP不可靠传输、面向无连接，适用于视频直播等实时性要求高的场景。<\/p>"},{"id":"L10","title":"第10课 综合所学建网络","knowledge":"<h3>一、组建直播网络的设备<\/h3><p>摄像头（视频拍摄）、计算机（直播服务器）、路由器（连接设备）、观看设备。<\/p><h3>二、有线 vs 无线连接<\/h3><table class=\"kb-table\"><tr><th>方式<\/th><th>优点<\/th><th>缺点<\/th><\/tr><tr><td>有线连接<\/td><td>更加稳定<\/td><td>布线烦琐<\/td><\/tr><tr><td>无线连接<\/td><td>相对便捷<\/td><td>稳定性稍差<\/td><\/tr><\/table><h3>三、静态IP vs 动态IP<\/h3><ul><li><strong>动态IP<\/strong>：连接路由器后自动获得，每次可能不同<\/li><li><strong>静态IP<\/strong>：手工设置，服务器等需被其他设备访问时使用<\/li><\/ul><h3>四、密码设置原则<\/h3><p>长度足够；大小写字母+数字+特殊符号；外人难猜自己易记；<strong>定期更换<\/strong>。<\/p><h3>五、ping命令<\/h3><p>检测网络连通性。ping通即能与目标进行基本网络通信。<\/p><h3>六、《未成年人保护法》<\/h3><p><strong>未满十六周岁<\/strong>不得提供网络直播发布者账号注册服务。<\/p>","exam":"<ul><li>搭建小型网络的<strong>基本硬件<\/strong><\/li><li>有线 vs 无线的优缺点<\/li><li>静态IP vs 动态IP的选择<\/li><li><strong>密码设置原则<\/strong><\/li><li>ping命令检测连通性<\/li><li>直播账号的<strong>法律年龄限制<\/strong><\/li><\/ul>","difficulty":"<h3>静态IP vs 动态IP选择<\/h3><p><strong>服务器<\/strong>等需被其他设备访问→用<strong>静态IP<\/strong>；<strong>普通设备<\/strong>不对外服务→用<strong>动态IP<\/strong><\/p>","qa":"<p><strong>Q1：搭建具有直播功能的小型网络需要哪些设备？<\/strong><\/p><p>答：摄像头、计算机（直播服务器）、路由器、观看设备等。<\/p><p><strong>Q2：什么情况用静态IP，什么情况用动态IP？<\/strong><\/p><p>答：服务器等需被其他设备访问用静态IP（手工设置）；普通计算机自动获取动态IP即可。<\/p>"}]},{"id":"m3","title":"第三模块：网络组建与应用","subtitle":"第11-15课 · 便捷的互联网服务","intro":"<p>本模块介绍典型的互联网服务（文件传送、电子邮件、万维网），深入万维网的结构特征与工作模式，了解HTTP/HTTPS协议和搜索引擎原理，并通过实验巩固网络命令使用。<\/p><p><strong>课标要求：<\/strong>通过在线活动分析互联网应用特征；使用互联网搜索、遴选、管理数据；初步了解互联网协议和数据传输原理。<\/p>","lessons":[{"id":"L11","title":"第11课 互联网服务应用广","knowledge":"<h3>一、典型互联网服务<\/h3><table class=\"kb-table\"><tr><th>服务<\/th><th>说明<\/th><\/tr><tr><td><strong>文件传送(FTP)<\/strong><\/td><td>通过网络传输各种文件<\/td><\/tr><tr><td><strong>电子邮件<\/strong><\/td><td>地址格式：用户名@服务商域名；SMTP发邮件、POPv3收邮件<\/td><\/tr><tr><td><strong>万维网(WWW)<\/strong><\/td><td>通过浏览器访问，应用最广泛的互联网服务<\/td><\/tr><\/table><h3>二、万维网≠互联网<\/h3><p>互联网是<strong>基础设施<\/strong>，万维网只是互联网上的<strong>一种服务<\/strong>（但已成为应用最广泛的服务）。1994年中科院高能物理研究所建成我国第一台万维网服务器。<\/p><h3>三、万维网优势<\/h3><p>只需浏览器不需安装软件；图文声像并茂；几乎所有网络活动都可基于万维网进行。<\/p>","exam":"<ul><li><strong>三种典型互联网服务<\/strong>（FTP、电子邮件、万维网）<\/li><li>电子邮件协议：SMTP（发）、POPv3（收）<\/li><li><strong>万维网≠互联网<\/strong>的关系<\/li><li>我国第一台万维网服务器：1994年中科院高能所<\/li><\/ul>","difficulty":"<h3>万维网 vs 互联网<\/h3><table class=\"kb-table\"><tr><th>概念<\/th><th>定义<\/th><th>关系<\/th><\/tr><tr><td>互联网<\/td><td>连接全球计算机的网络<\/td><td>基础设施<\/td><\/tr><tr><td>万维网<\/td><td>基于互联网的信息服务<\/td><td>互联网上的服务之一<\/td><\/tr><\/table>","qa":"<p><strong>Q1：万维网和互联网是什么关系？<\/strong><\/p><p>答：互联网是万维网的基础设施；万维网只是互联网上的一种服务。二者经常被混为一谈但实为不同概念。<\/p><p><strong>Q2：收发电子邮件涉及哪两种协议？<\/strong><\/p><p>答：SMTP（简单邮件传送协议）发送邮件；POPv3（第3版邮局协议）接收邮件。<\/p>"},{"id":"L12","title":"第12课 万维网服务大揭秘","knowledge":"<h3>一、万维网结构<\/h3><p><strong>分布式服务<\/strong>——无统一中央服务器，由许多服务器共同提供。资源通过<strong>超链接<\/strong>以<strong>网状结构<\/strong>组织。<\/p><h3>二、B/S结构与C/S结构<\/h3><p>万维网采用<strong>\"浏览器-服务器\"(B/S)结构<\/strong>，是<strong>\"客户端-服务器\"(C/S)结构<\/strong>的特例。属于<strong>\"请求-响应\"<\/strong>式服务。<\/p><h3>三、浏览网页四步流程<\/h3><ol><li><strong>用户发起请求<\/strong>：浏览器依据网址向服务器发起请求<\/li><li><strong>服务器响应<\/strong>：资源存在返回资源，否则报错<\/li><li><strong>浏览器接收响应<\/strong>：状态码200展示网页<\/li><li><strong>人机交互<\/strong>：点击超链接→再次发起请求<\/li><\/ol><h3>四、URL组成<\/h3><p>统一资源定位符一般包括<strong>协议、域名、端口、路径、参数<\/strong>等。<\/p>","exam":"<ul><li>万维网<strong>分布式结构<\/strong>和网状组织<\/li><li>B/S结构与C/S结构的关系<\/li><li><strong>\"请求-响应\"<\/strong>模式<\/li><li>浏览网页<strong>四步流程<\/strong><\/li><li>URL组成<\/li><\/ul>","difficulty":"<h3>C/S vs B/S<\/h3><table class=\"kb-table\"><tr><th>对比<\/th><th>C/S<\/th><th>B/S<\/th><\/tr><tr><td>客户端<\/td><td>需安装专门软件<\/td><td>只需浏览器<\/td><\/tr><tr><td>关系<\/td><td colspan=\"2\">B/S是C/S的特例<\/td><\/tr><\/table>","qa":"<p><strong>Q1：简述万维网的\"请求-响应\"工作流程。<\/strong><\/p><p>答：①用户输入网址，浏览器发起请求；②服务器处理请求返回资源或报错；③浏览器接收响应，状态码200展示网页；④用户点击超链接继续交互。<\/p>"},{"id":"L13","title":"第13课 万维网安全新协议","knowledge":"<h3>一、HTTP基于TCP<\/h3><p>HTTP是万维网服务的基础，工作在<strong>TCP<\/strong>之上。因为浏览网页、下载文件等需要<strong>稳定可靠<\/strong>的数据传输。<\/p><h3>二、明文传输风险<\/h3><p>HTTP以<strong>明文方式<\/strong>传输数据，账号密码等易被窃取或篡改。<\/p><h3>三、HTTPS<\/h3><p>采用<strong>数据加密技术<\/strong>，对内容加密处理后再传输。各大网站纷纷以HTTPS取代HTTP。<\/p><h3>四、HTTP vs HTTPS<\/h3><table class=\"kb-table\"><tr><th>对比<\/th><th>HTTP<\/th><th>HTTPS<\/th><\/tr><tr><td>传输方式<\/td><td>明文<\/td><td>加密<\/td><\/tr><tr><td>安全性<\/td><td>低<\/td><td>高<\/td><\/tr><tr><td>数据包<\/td><td>可读<\/td><td>加密不可读<\/td><\/tr><\/table><p><strong>重要澄清：<\/strong>HTTPS只对传输过程加密，不能解决所有安全问题。网站被攻破、设备中毒等仍可能导致安全问题。<\/p>","exam":"<ul><li>HTTP基于<strong>TCP<\/strong>（可靠传输）<\/li><li>明文传输的安全风险<\/li><li><strong>HTTPS加密<\/strong>机制<\/li><li>HTTP vs HTTPS核心区别<\/li><li>HTTPS≠绝对安全<\/li><\/ul>","difficulty":"<h3>HTTPS安全边界<\/h3><p>HTTPS仅加密<strong>传输过程<\/strong>，网站本身安全、用户设备安全等问题超出HTTPS保护范围。<\/p>","qa":"<p><strong>Q1：HTTP和HTTPS有什么区别？<\/strong><\/p><p>答：HTTP明文传输不安全；HTTPS采用数据加密技术对内容加密后再传输，更加安全。<\/p><p><strong>Q2：为什么HTTP要基于TCP？<\/strong><\/p><p>答：浏览网页、下载文件需要稳定可靠的数据传输，TCP提供可靠传输保障。<\/p>"},{"id":"L14","title":"第14课 互联网搜索新发展","knowledge":"<h3>一、搜索引擎工作流程<\/h3><p><strong>获取信息 → 网页数据 → 建立索引 → 网页索引 → 网页排序 → 展示结果<\/strong><\/p><h3>二、\"以空间换时间\"思想<\/h3><p>搜索引擎<strong>提前保存海量信息<\/strong>（耗费大量存储空间），换取<strong>快速响应<\/strong>查询需求。<\/p><h3>三、网络爬虫<\/h3><p>自动获取网页的程序，替代人工操作，极大提升数据获取效率。<\/p><h3>四、网页排序<\/h3><p>基本依据：<strong>关键词出现次数<\/strong>，次数越多越靠前。还可结合其他指标使排序更精准。<\/p>","exam":"<ul><li>搜索引擎<strong>五步工作流程<\/strong>（常考排序题）<\/li><li>\"以空间换时间\"核心思想<\/li><li>网络爬虫作用<\/li><li>网页排序基本依据<\/li><\/ul>","difficulty":"<h3>流程排序：D→A→B→C→E<\/h3><p>获取信息(D)→网页数据(A)→建立索引(B)→网页索引(C)→网页排序(E)<\/p>","qa":"<p><strong>Q1：简述搜索引擎的工作原理。<\/strong><\/p><p>答：提前获取保存海量网页数据→建立索引→用户搜索时快速匹配→对结果排序→展示。核心思想是\"以空间换时间\"。<\/p>"},{"id":"L15","title":"第15课 互联网实验齐发现","knowledge":"<h3>一、四个常用网络命令<\/h3><table class=\"kb-table\"><tr><th>命令<\/th><th>功能<\/th><\/tr><tr><td><strong>ipconfig<\/strong><\/td><td>显示TCP/IP配置（IP地址、网关、DNS等）<\/td><\/tr><tr><td><strong>ping<\/strong><\/td><td>测试连通性，获取域名对应IP地址<\/td><\/tr><tr><td><strong>tracert<\/strong><\/td><td>跟踪通信路径，显示经过的路由器<\/td><\/tr><tr><td><strong>netstat<\/strong><\/td><td>显示网络连接情况<\/td><\/tr><\/table><h3>二、数据封装过程<\/h3><p>数据从上到下依次在不同层流动。每层接到上层数据后<strong>加上含有本层控制信息的头部<\/strong>，形成TCP包、IP包等，再交给下一层。IP包数据体=TCP包总量，TCP包数据体=HTTP总量——体现<strong>分层封装<\/strong>。<\/p><h3>三、数据包结构<\/h3><p><strong>数据包 = 头部（控制信息） + 数据体<\/strong><\/p>","exam":"<ul><li><strong>四个命令<\/strong>及功能——<strong>必考<\/strong><\/li><li>ipconfig查看配置；ping测试连通性+域名解析<\/li><li>tracert追踪路径；netstat查看连接<\/li><li><strong>数据封装<\/strong>：每层加头部<\/li><\/ul>","difficulty":"<h3>四个命令快速区分<\/h3><table class=\"kb-table\"><tr><th>需求<\/th><th>命令<\/th><\/tr><tr><td>查看本机IP<\/td><td>ipconfig<\/td><\/tr><tr><td>测试连通<\/td><td>ping<\/td><\/tr><tr><td>追踪路径<\/td><td>tracert<\/td><\/tr><tr><td>查看连接<\/td><td>netstat<\/td><\/tr><\/table>","qa":"<p><strong>Q1：简述四个常用网络命令及其功能。<\/strong><\/p><p>答：①ipconfig——查看IP地址等配置；②ping——测试连通性，获取域名对应IP；③tracert——追踪经过的路由器；④netstat——查看连接状态。<\/p>"}]},{"id":"m4","title":"第四模块：网页设计与制作","subtitle":"第16-20课 · 校园活动线上展","intro":"<p>本模块从网页与HTML代码的关系入手，学习HTML标签、CSS样式、Markdown语言和协同制作，最终完成网站组建与发布。<\/p><p><strong>课标要求：<\/strong>了解常用互联网应用中数据的构成，使用适当的数字化工具对网页进行编辑和发布；根据任务要求与合作伙伴协作设计和创作作品。<\/p>","lessons":[{"id":"L16","title":"第16课 探秘网页与代码","knowledge":"<h3>一、HTML<\/h3><p><strong>超文本标记语言<\/strong>，用于描述网页。浏览器获得代码后按代码要求显示文字、图像等。<\/p><h3>二、标签类型<\/h3><ul><li><strong>双标签<\/strong>：成对出现，如&lt;HTML&gt;&lt;/HTML&gt;、&lt;head&gt;&lt;/head&gt;、&lt;body&gt;&lt;/body&gt;<\/li><li><strong>单标签<\/strong>：如&lt;img&gt;、&lt;br&gt;<\/li><\/ul><h3>三、常用标签<\/h3><table class=\"kb-table\"><tr><th>标签<\/th><th>作用<\/th><\/tr><tr><td>&lt;head&gt;&lt;/head&gt;<\/td><td>设置文档头部<\/td><\/tr><tr><td>&lt;title&gt;&lt;/title&gt;<\/td><td>设置网页标题<\/td><\/tr><tr><td>&lt;body&gt;&lt;/body&gt;<\/td><td>设置文档主体<\/td><\/tr><tr><td>&lt;h1&gt;~&lt;h6&gt;<\/td><td>设置标题（1级最大）<\/td><\/tr><tr><td>&lt;p&gt;&lt;/p&gt;<\/td><td>设置段落<\/td><\/tr><tr><td>&lt;img src=\"...\"&gt;<\/td><td>设置图像<\/td><\/tr><tr><td>&lt;a href=\"...\"&gt;&lt;/a&gt;<\/td><td>设置超链接<\/td><\/tr><\/table><h3>四、图像显示方式<\/h3><p>①文件路径（需要图像文件）；②数据编码（不需要图像文件，代码中包含图像数据）。<\/p>","exam":"<ul><li><strong>HTML定义<\/strong>：超文本标记语言<\/li><li><strong>双标签 vs 单标签<\/strong><\/li><li><strong>常用标签<\/strong>及作用——<strong>必考<\/strong><\/li><li>浏览器将HTML代码转换为图文并茂的网页<\/li><\/ul>","difficulty":"<h3>双标签 vs 单标签<\/h3><p>双标签：成对出现&lt;tag&gt;内容&lt;/tag&gt;；单标签：单独出现如&lt;img src=\"...\"&gt;<\/p>","qa":"<p><strong>Q1：什么是HTML？列举至少5个常用标签及其作用。<\/strong><\/p><p>答：HTML是超文本标记语言。常用标签：&lt;head&gt;文档头部、&lt;title&gt;网页标题、&lt;body&gt;主体、&lt;h1&gt;一级标题、&lt;p&gt;段落、&lt;img&gt;图像、&lt;a&gt;超链接。<\/p>"},{"id":"L17","title":"第17课 制作网页展活动","knowledge":"<h3>一、网站制作六步流程<\/h3><ol><li><strong>确定主题<\/strong><\/li><li><strong>搜集素材<\/strong>（围绕主题收集资源，经过挑选去伪）<\/li><li><strong>确定结构<\/strong>（主页、导航、布局、风格）<\/li><li><strong>制作网页<\/strong>（用工具或编写HTML/AI生成）<\/li><li><strong>美化网页<\/strong><\/li><li><strong>发布网站<\/strong><\/li><\/ol><h3>二、网站基础<\/h3><ul><li>网站一般由<strong>多个网页<\/strong>组成，围绕同一主题<\/li><li>默认显示的第一个网页叫<strong>主页<\/strong><\/li><\/ul><h3>三、AI辅助<\/h3><p>可使用在线人工智能模型根据需求自动生成网页代码。<\/p>","exam":"<ul><li>网站制作<strong>六步流程<\/strong><\/li><li><strong>主页<\/strong>的定义<\/li><li>网站由多个网页组成<\/li><\/ul>","difficulty":"<p><strong>流程排序：<\/strong>确定主题→搜集素材→确定结构→制作网页→美化网页→发布网站<\/p>","qa":"<p><strong>Q1：简述制作网站的基本流程。<\/strong><\/p><p>答：①确定主题；②搜集素材；③确定结构；④制作网页；⑤美化网页；⑥发布网站。<\/p>"},{"id":"L18","title":"第18课 美化网页方法多","knowledge":"<h3>一、HTML vs CSS<\/h3><p>HTML像\"建筑师\"搭建结构，CSS（串联样式表/级联样式表）像\"装潢设计师\"美化外观。<\/p><h3>二、CSS基本语法<\/h3><p><strong>选择器 { 属性: 值; }<\/strong> 例：p { font-size: 14px; color: #606266; }<\/p><h3>三、常用CSS属性<\/h3><table class=\"kb-table\"><tr><th>属性<\/th><th>作用<\/th><\/tr><tr><td>color<\/td><td>设置文本颜色<\/td><\/tr><tr><td>font-family<\/td><td>设置字体<\/td><\/tr><tr><td>font-size<\/td><td>设置文本大小<\/td><\/tr><tr><td>background-color<\/td><td>设置背景颜色<\/td><\/tr><tr><td>text-align<\/td><td>文本对齐(left/right/center)<\/td><\/tr><tr><td>text-indent<\/td><td>首行缩进(如2em)<\/td><\/tr><\/table><h3>四、内部样式<\/h3><p>在&lt;head&gt;中用&lt;style&gt;标签定义CSS。<\/p>","exam":"<ul><li><strong>CSS定义<\/strong>和作用<\/li><li>CSS基本语法：选择器{属性:值;}<\/li><li>HTML vs CSS角色定位<\/li><li>常用CSS属性<\/li><\/ul>","difficulty":"<h3>HTML美化 vs CSS美化<\/h3><table class=\"kb-table\"><tr><th>对比<\/th><th>HTML属性<\/th><th>CSS<\/th><\/tr><tr><td>效果<\/td><td>有限<\/td><td>丰富<\/td><\/tr><tr><td>操作<\/td><td>烦琐<\/td><td>集中管理高效<\/td><\/tr><\/table>","qa":"<p><strong>Q1：什么是CSS？CSS的基本语法是怎样的？<\/strong><\/p><p>答：CSS（串联样式表）描述网页外观和格式。基本语法：选择器 { 属性: 值; }。<\/p>"},{"id":"L19","title":"第19课 多人协同效率高","knowledge":"<h3>一、多人协同优势<\/h3><ul><li>实时协作提高效率<\/li><li>分工负责提高质量<\/li><li>实时反馈便于修改<\/li><li>相互学习丰富技能<\/li><\/ul><h3>二、Markdown语言<\/h3><p>HTML标签繁多、多人编辑易冲突。Markdown<strong>语法简洁<\/strong>，适合多人协同场景。<\/p><h3>三、Markdown常用语法<\/h3><table class=\"kb-table\"><tr><th>效果<\/th><th>HTML<\/th><th>Markdown<\/th><\/tr><tr><td>一级标题<\/td><td>&lt;h1&gt;文字&lt;/h1&gt;<\/td><td># 文字<\/td><\/tr><tr><td>二级标题<\/td><td>&lt;h2&gt;文字&lt;/h2&gt;<\/td><td>## 文字<\/td><\/tr><tr><td>粗体<\/td><td>&lt;strong&gt;文字&lt;/strong&gt;<\/td><td>**文字**<\/td><\/tr><tr><td>斜体<\/td><td>&lt;em&gt;文字&lt;/em&gt;<\/td><td>*文字*<\/td><\/tr><tr><td>图片<\/td><td>&lt;img src=\"地址\"&gt;<\/td><td>![描述](地址)<\/td><\/tr><\/table>","exam":"<ul><li><strong>多人协同四大优势<\/strong><\/li><li><strong>Markdown特点<\/strong>：简洁、适合协同<\/li><li>HTML vs Markdown语法对比<\/li><\/ul>","difficulty":"<h3>为什么Markdown更适合多人协同？<\/h3><p>HTML标签多且分散，多人同时编辑容易<strong>冲突和错位<\/strong>。Markdown语法简洁，标记集中不分散。<\/p>","qa":"<p><strong>Q1：Markdown语言有什么特点？为什么适合多人协同？<\/strong><\/p><p>答：Markdown语法简洁、标记直观，相比HTML标签多且分散，多人协同编辑时不易出现标签冲突和错位。<\/p>"},{"id":"L20","title":"第20课 组建网站跟我做","knowledge":"<h3>一、网站结构<\/h3><p>完整网站包括<strong>主页<\/strong>和与之相连的其他网页。通过<strong>超链接<\/strong>实现页面跳转。<\/p><h3>二、超链接代码<\/h3><table class=\"kb-table\"><tr><th>类型<\/th><th>代码<\/th><\/tr><tr><td>文本超链接<\/td><td>&lt;a href=\"链接地址\"&gt;显示文字&lt;/a&gt;<\/td><\/tr><tr><td>图像超链接<\/td><td>&lt;a href=\"链接地址\"&gt;&lt;img src=\"图像地址\"&gt;&lt;/a&gt;<\/td><\/tr><\/table><h3>三、网站评测五要素<\/h3><p>文字准确、图像恰当、链接正确、布局合理、内容健康积极向上。<\/p><h3>四、《未成年人网络保护条例》<\/h3><p>为未成年人提供信息发布、即时通信等服务，应要求提供<strong>真实身份信息<\/strong>。<\/p>","exam":"<ul><li><strong>&lt;a&gt;标签<\/strong>用法（href属性）<\/li><li>文本超链接 vs 图像超链接<\/li><li>网站评测五个要素<\/li><li>未成年人网络保护条例<\/li><\/ul>","difficulty":"<p><strong>超链接要点：<\/strong>&lt;a href=\"目标地址\"&gt;显示内容&lt;/a&gt;，href是链接地址属性。图像超链接=&lt;img&gt;嵌套在&lt;a&gt;内部。<\/p>","qa":"<p><strong>Q1：如何用HTML设置超链接？<\/strong><\/p><p>答：使用&lt;a&gt;标签：&lt;a href=\"链接地址\"&gt;显示文字或图像&lt;/a&gt;。<\/p>"}]},{"id":"m5","title":"第五模块：互联网创新应用","subtitle":"第21-26课 · 创新改变生活","intro":"<p>本模块介绍移动互联网的发展、在线学习变革、在线生活创新、在线交流新气象、云服务和短视频创作等内容，感受互联网带来的创新应用。<\/p><p><strong>课标要求：<\/strong>在\"互联网+\"情境中体验在线学习、生活和交流的新模式；了解云存储、云计算的原理；认识到互联网带来的新媒体、新社交、新资源的影响。<\/p>","lessons":[{"id":"L21","title":"第21课 移动互联新发展","knowledge":"<h3>一、移动通信发展<\/h3><table class=\"kb-table\"><tr><th>代际<\/th><th>特征<\/th><\/tr><tr><td>1G<\/td><td>语音业务<\/td><\/tr><tr><td>2G<\/td><td>语音+短信+简单网络<\/td><\/tr><tr><td>3G<\/td><td>智能手机出现，移动互联网快速发展<\/td><\/tr><tr><td>4G<\/td><td>高速移动网络<\/td><\/tr><tr><td><strong>5G<\/strong><\/td><td><strong>高速、低时延、容量大<\/strong><\/td><\/tr><\/table><p>我国发展路线：<strong>1G空白→2G跟随→3G突破→4G并跑→5G领跑<\/strong><\/p><h3>二、5G三大特点<\/h3><p><strong>高速<\/strong>（1GB一两秒）、<strong>低时延<\/strong>（自动驾驶前景）、<strong>容量大<\/strong>（每km²支持100万设备）。<\/p><h3>三、新媒体与自媒体<\/h3><ul><li><strong>新媒体<\/strong>：利用新技术对传统媒体的质变，数字化/互动性/超文本/虚拟性/网络化/模拟性<\/li><li><strong>自媒体<\/strong>：公众个人或团队独立运作，\"人人是通信员，个个是传播者\"<\/li><\/ul>","exam":"<ul><li>1G到5G发展历程<\/li><li><strong>5G三大特点<\/strong>及我国发展路线<\/li><li>新媒体六大特点<\/li><li>自媒体核心理念<\/li><\/ul>","difficulty":"<h3>新媒体 vs 自媒体<\/h3><table class=\"kb-table\"><tr><th>概念<\/th><th>定义<\/th><th>特征<\/th><\/tr><tr><td>新媒体<\/td><td>新技术对传统媒体质变<\/td><td>数字化、互动性、超文本<\/td><\/tr><tr><td>自媒体<\/td><td>公众个人/团队独立运作<\/td><td>\"人人是通信员，个个是传播者\"<\/td><\/tr><\/table>","qa":"<p><strong>Q1：5G有哪些主要特点？<\/strong><\/p><p>答：①高速——1GB文件一两秒传完；②低时延——数据交换及时，自动驾驶前景；③容量大——每km²支持100万设备同时在线。<\/p>"},{"id":"L22","title":"第22课 在线学习新变革","knowledge":"<h3>一、在线学习三大变革<\/h3><ul><li><strong>突破时空和人数限制<\/strong><\/li><li><strong>提供海量数字资源<\/strong>（数量大、类型多、更新快）<\/li><li><strong>个性化学习成为可能<\/strong>（平台根据学习行为推送内容）<\/li><\/ul><h3>二、数字学习资源类型<\/h3><table class=\"kb-table\"><tr><th>类型<\/th><th>举例<\/th><\/tr><tr><td>课程平台<\/td><td>网上课程、视频讲座、作业考试<\/td><\/tr><tr><td>虚拟实验<\/td><td>模拟器、互动游戏<\/td><\/tr><tr><td>在线数据库<\/td><td>学术论文、期刊<\/td><\/tr><tr><td>在线博物馆<\/td><td>虚拟游览、数字收藏<\/td><\/tr><\/table><h3>三、我国成就<\/h3><p>国家中小学智慧教育平台资源4.4万条，<strong>世界第一大教育教学资源库<\/strong>。中小学互联网接入率<strong>100%<\/strong>。<\/p><h3>四、在线学习挑战<\/h3><p>网络保障不足、优质资源不足、教师信息技术能力不足、<strong>师生互动和情感交流不足<\/strong>。<\/p>","exam":"<ul><li><strong>在线学习三大变革<\/strong><\/li><li>数字资源特点：数量大、类型多、更新快<\/li><li>个性化学习实现方式<\/li><li>我国教育资源库成就<\/li><li>在线学习问题和挑战<\/li><\/ul>","difficulty":"<h3>线下 vs 在线学习对比<\/h3><table class=\"kb-table\"><tr><th>维度<\/th><th>线下<\/th><th>在线<\/th><\/tr><tr><td>空间<\/td><td>固定地点<\/td><td>随时随地<\/td><\/tr><tr><td>时间<\/td><td>固定时间<\/td><td>灵活安排<\/td><\/tr><tr><td>资源<\/td><td>有限<\/td><td>海量丰富<\/td><\/tr><tr><td>个性化<\/td><td>困难<\/td><td>可实现<\/td><\/tr><\/table>","qa":"<p><strong>Q1：在线学习带来了哪些变革？<\/strong><\/p><p>答：①突破时间、空间和人数限制；②提供海量数字资源；③量身定制的个性化学习成为可能。<\/p>"},{"id":"L23","title":"第23课 在线生活创意多","knowledge":"<h3>一、互联网创新两种方式<\/h3><ul><li><strong>打通数据节点形成创新服务<\/strong>：各环节接入网络，数据互联互通（如物流快递实时调度）<\/li><li><strong>为老技术找到新场景<\/strong>：二维码从汽车工业配件标识→支付入口→扫码支付<\/li><\/ul><h3>二、创新带来的挑战<\/h3><p>取代工作岗位、创新失败风险、违法应用涌现、数字鸿沟、网络安全等。<\/p>","exam":"<ul><li>互联网创新<strong>两种方式<\/strong>及典型案例<\/li><li>二维码从工业到支付的转变<\/li><li>创新的社会挑战<\/li><\/ul>","difficulty":"<p><strong>创新方式辨析：<\/strong>打通数据节点=整合现有资源；老技术新场景=已有技术找新用途。物流是前者，二维码支付是后者。<\/p>","qa":"<p><strong>Q1：互联网激发创新有哪几种方式？举例说明。<\/strong><\/p><p>答：①打通数据节点形成创新服务（物流快递实时调度）；②为老技术找到新场景（二维码从工业标识变支付入口）。<\/p>"},{"id":"L24","title":"第24课 在线交流新气象","knowledge":"<h3>一、在线交流特点<\/h3><p>打破时空限制，<strong>跨时空、更广泛、更多样<\/strong>。<\/p><h3>二、数字形象维护<\/h3><ul><li>保持真实性<\/li><li>保持礼貌言辞<\/li><li>精心选择发布内容<\/li><li>保护个人信息安全<\/li><li>积极参与有意义的讨论<\/li><\/ul><h3>三、信息茧房<\/h3><p>人们倾向接收符合自己兴趣观点的信息，形成<strong>封闭的、自我强化的信息循环<\/strong>。<\/p><h3>四、新问题<\/h3><p>个人信息泄露、AI虚拟人物干预社交、回音室效应、过滤气泡等。<\/p>","exam":"<ul><li>在线交流特点：跨时空、更广泛、更多样<\/li><li><strong>数字形象<\/strong>概念和维护方法<\/li><li><strong>信息茧房<\/strong>定义<
