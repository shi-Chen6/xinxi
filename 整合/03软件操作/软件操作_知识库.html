启动后自动生成空白演示文稿，也可用<span class=\"highlight\">模板 / 主题 / 现有演示文稿</span>创建。</li>\n  <li><strong>录入内容</strong>：在“普通视图”的编辑窗格或大纲窗格中输入标题、正文。</li>\n  <li><strong>插入对象</strong>：通过“插入”选项卡添加图片、形状、艺术字、表格、图表、音视频、超链接等。</li>\n  <li><strong>外观设计</strong>：用“幻灯片母版”“主题”“版式”统一全篇风格。</li>\n  <li><strong>动画与切换</strong>：为对象设置自定义动画，为幻灯片设置切换效果。</li>\n  <li><strong>放映</strong>：设置放映方式、排练计时后按 <span class=\"kbd\">F5</span> 放映。</li>\n  <li><strong>打印 / 打包</strong>：打印讲义或备注页，或另存为放映文件（.ppsx）便于脱离软件播放。</li>\n</ol>\n\n<div class=\"sub-h\">核心模块速查（软件名称 · 核心操作 · 功能说明）</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>软件名称</th><th>核心操作</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>PowerPoint</td><td><strong>视图切换</strong>：视图选项卡 → 演示文稿视图组</td><td>普通 / 幻灯片浏览 / 幻灯片放映 / 备注页 四种基本视图，满足编辑、排序、放映、注释不同需求。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>插入对象</strong>：插入选项卡 → 各功能组</td><td>插入图片、剪贴画、形状、艺术字、表格、图表、音频、影片、超链接等多媒体元素。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>母版 / 版式</strong>：视图 → 幻灯片母版</td><td>统一设置所有幻灯片的字体、背景、徽标；一次修改，全篇生效。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>主题 / 模板</strong>：设计选项卡；Office 按钮 → 新建</td><td>一键套用配色、字体、效果，快速获得专业外观。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>自定义动画</strong>：动画 → 自定义动画</td><td>为单张幻灯片内的对象设置进入 / 强调 / 退出 / 动作路径效果。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>幻灯片切换</strong>：动画 → 切换到此幻灯片</td><td>设置张与张之间的切换动画、声音、速度与换片方式，可“全部应用”。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>放映设置</strong>：幻灯片放映 → 设置幻灯片放映</td><td>选择演讲者放映 / 观众自行浏览 / 展台浏览三种放映类型。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>排练计时</strong>：幻灯片放映 → 排练计时</td><td>自动记录每张停留时间，实现自动放映。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>超链接 / 动作</strong>：插入 → 链接组</td><td>在对象上建立跳转，链接到网址、文件、邮件或其他幻灯片。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>打包 / 另存放映</strong>：另存为 → PowerPoint 放映</td><td>保存为 .ppsx，双击即自动播放，脱离软件也能放映。</td></tr>\n    <tr><td>PowerPoint</td><td><strong>打印</strong>：文件 → 打印</td><td>可打印幻灯片、讲义、备注页、大纲；讲义每页最多 9 张。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">文件扩展名（高频考点）</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">.pptx / .ppt</div><div class=\"d\">演示文稿的<strong>默认</strong>保存格式（2007 为 .pptx，2003 为 .ppt）。</div></div>\n  <div class=\"cell\"><div class=\"t\">.ppsx / .pps</div><div class=\"d\">PowerPoint 放映文件，双击<strong>直接播放</strong>，无需打开软件。</div></div>\n  <div class=\"cell\"><div class=\"t\">.potx / .pot</div><div class=\"d\">演示文稿<strong>模板</strong>文件（2003 模板扩展名为 .pot）。</div></div>\n  <div class=\"cell\"><div class=\"t\">.ppa</div><div class=\"d\">PowerPoint 加载宏（内插器）文件。</div></div>\n</div>\n\n<div class=\"sub-h\">通用快捷键</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>快捷键</th><th>功能</th></tr></thead>\n  <tbody>\n    <tr><td><span class=\"kbd\">F5</span></td><td>从头开始放映幻灯片</td></tr>\n    <tr><td><span class=\"kbd\">Shift+F5</span></td><td>从当前幻灯片开始放映</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+M</span></td><td>新建（添加）一张幻灯片</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+S</span></td><td>保存演示文稿</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+A</span></td><td>选定全部幻灯片 / 全部对象</td></tr>\n    <tr><td><span class=\"kbd\">Esc</span></td><td>退出放映，返回编辑状态</td></tr>\n    <tr><td><span class=\"kbd\">B</span> / <span class=\"kbd\">W</span></td><td>放映时黑屏 / 白屏（再按恢复）</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">口诀记忆：<strong>“建—写—插—美—动—放—印”</strong>七步走，对应新建、录入、插入、美化、动画、放映、打印，串起整个 PPT 制作链条。</div>\n", "tags": ["PPT", "速查", "必考"]}, {"id": "p1", "title": "PPT 概述与视图", "icon": "🖥️", "html": "\n<p class=\"lead\">PowerPoint 作为 Microsoft Office 的重要组成部分，可快速创建动态演示文稿。它的最基本工作单元是<span class=\"highlight\">幻灯片</span>：一个演示文稿由一张或多张幻灯片组成，每张幻灯片可看作“<span class=\"highlight\">前景 + 背景</span>”的组合，由文本、图片、声音、表格等元素构成。</p>\n\n<div class=\"sub-h\">启动与退出</div>\n<ol class=\"step-list\">\n  <li><strong>常规启动</strong>：“开始”菜单 → “所有程序” → Microsoft Office → Microsoft Office PowerPoint。</li>\n  <li><strong>双击启动</strong>：双击一个已有的 .pptx 文件，可在启动软件的同时打开该演示文稿。</li>\n  <li><strong>退出</strong>：单击 Office 按钮 → “退出 PowerPoint”；或单击窗口右上角“关闭”；或双击 Office 按钮。若文件未保存，系统会提示是否保存更改。</li>\n</ol>\n\n<div class=\"sub-h\">工作界面组成</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">Office 按钮</div><div class=\"d\">包含新建、打开、保存、打印、准备、发送、关闭及最近文档等文件操作。</div></div>\n  <div class=\"cell\"><div class=\"t\">快速访问工具栏</div><div class=\"d\">默认含“保存、撤销、恢复”三个按钮，可自定义添加。</div></div>\n  <div class=\"cell\"><div class=\"t\">选项卡</div><div class=\"d\">7 个标准选项卡：开始、插入、设计、动画、幻灯片放映、审阅、视图。</div></div>\n  <div class=\"cell\"><div class=\"t\">功能区</div><div class=\"d\">承载某选项卡下的全部工具，并按功能分成不同的“组”。</div></div>\n  <div class=\"cell\"><div class=\"t\">大纲 / 幻灯片浏览区</div><div class=\"d\">显示大纲或缩略图，便于添加、删除、复制、重排幻灯片。</div></div>\n  <div class=\"cell\"><div class=\"t\">幻灯片编辑区</div><div class=\"d\">编辑与格式化当前幻灯片的主要区域。</div></div>\n  <div class=\"cell\"><div class=\"t\">备注区</div><div class=\"d\">为当前幻灯片添加备注，放映时不显示，但可打印作演讲底稿。</div></div>\n  <div class=\"cell\"><div class=\"t\">状态栏</div><div class=\"d\">位于窗口最下方，显示总页数、切换视图、调整显示比例。</div></div>\n</div>\n<div class=\"tip info\">除 7 个标准选项卡外，还有<strong>上下文选项卡</strong>（选定对象时出现在标准选项卡旁）和<strong>程序选项卡</strong>（在某些视图或创作模式下替代标准选项卡）。</div>\n\n<div class=\"sub-h\">四种基本视图</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td><strong>普通视图</strong></td><td>视图 → 演示文稿视图 → 普通视图（启动默认）</td><td>主要编辑视图，由“大纲/幻灯片窗格、编辑窗格、备注窗格”三合一组成；拖动边框可调整各窗格大小。标号在幻灯片左上角。</td></tr>\n    <tr><td><strong>幻灯片浏览视图</strong></td><td>视图 → 演示文稿视图 → 幻灯片浏览视图</td><td>缩小同时显示多张幻灯片，便于快速排序、增删幻灯片、设置切换与动画；<span class=\"highlight\">不能编辑幻灯片具体内容</span>。双击某张可回到普通视图。标号在右下角。</td></tr>\n    <tr><td><strong>幻灯片放映视图</strong></td><td>按 <span class=\"kbd\">F5</span>；或幻灯片放映 → 开始放映幻灯片</td><td>全屏放映演示文稿，查看最终呈现效果。</td></tr>\n    <tr><td><strong>备注页视图</strong></td><td>视图 → 演示文稿视图 → 备注页</td><td>以“上图下文”方式为每张幻灯片编辑备注，可输入文字与图表，供打印底稿之用。</td></tr>\n  </tbody>\n</table>\n<div class=\"tip success\">大纲视图是普通视图的变体：左侧大纲窗格面积更大、右侧两窗格更小，便于集中编辑文字。</div>\n\n<div class=\"sub-h\">演示文稿的创建方式</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>空白演示文稿</td><td>启动 PowerPoint 后自动创建</td><td>从零开始搭建，自由度最高。</td></tr>\n    <tr><td>利用模板创建</td><td>Office 按钮 → 新建 → “已安装的模板” → 选模板 → 创建</td><td>模板含预置文字与图片的结构布局，替换内容即可成稿。</td></tr>\n    <tr><td>利用主题创建</td><td>Office 按钮 → 新建 → “已安装的主题”</td><td>主题是一组格式选项（主题颜色 + 主题字体 + 主题效果）。</td></tr>\n    <tr><td>根据现有内容新建</td><td>Office 按钮 → 新建 → “根据现有内容新建”</td><td>新文稿版式、内容与现有演示文稿相同，改改即可。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">幻灯片的基本操作</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>选定</td><td>单击选一张；<span class=\"kbd\">Ctrl</span>+单击选多张不连续；<span class=\"kbd\">Shift</span>+单击选连续多张；<span class=\"kbd\">Ctrl+A</span> 全选</td><td>操作幻灯片前须先选定；单击空白区可放弃选定。</td></tr>\n    <tr><td>查找</td><td>单击“上/下一张”按钮；按 <span class=\"kbd\">PgUp</span>/<span class=\"kbd\">PgDn</span>；拖动滚动条滑块</td><td>在幻灯片间快速定位。</td></tr>\n    <tr><td>添加</td><td>开始 → 幻灯片 → 新建幻灯片；或按 <span class=\"kbd\">Enter</span>；或右键“新建幻灯片”（<span class=\"kbd\">Ctrl+M</span>）</td><td>新幻灯片插入在当前幻灯片之后。</td></tr>\n    <tr><td>复制</td><td>开始 → 剪贴板 → 复制 / 粘贴；或浏览视图中按 <span class=\"kbd\">Ctrl</span> 拖动</td><td>快速产生相同版式内容的副本。</td></tr>\n    <tr><td>删除</td><td>开始 → 幻灯片 → 删除；或按 <span class=\"kbd\">Delete</span> / <span class=\"kbd\">Backspace</span></td><td>移除选定的一张或多张幻灯片。</td></tr>\n    <tr><td>移动</td><td>大纲窗格或浏览视图中拖动缩略图到新位置</td><td>调整幻灯片的先后顺序。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">保存格式与扩展名</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>演示文稿 .pptx</td><td>Office 按钮 → 保存/另存为；或 <span class=\"kbd\">Ctrl+S</span></td><td>默认格式，可再次编辑。</td></tr>\n    <tr><td>放映文件 .ppsx</td><td>另存为 → 保存类型选“PowerPoint 放映(*.ppsx)”</td><td>双击直接播放，无需 PowerPoint 软件支持。</td></tr>\n    <tr><td>网页 .htm/.html</td><td>另存为 → 保存类型选“网页”</td><td>可链接到网站，直接在网上播放。</td></tr>\n    <tr><td>模板 .potx</td><td>另存为 → 保存类型选“PowerPoint 模板”</td><td>保存当前模板供以后复用（2003 为 .pot）。</td></tr>\n  </tbody>\n</table>\n<div class=\"tip warning\">扩展名易混考点：<strong>.pot / .potx</strong> 是模板，<strong>.ppt / .pptx</strong> 是默认演示文稿，<strong>.ppa</strong> 是加载宏文件，而 <strong>RTF</strong> 是一种通用文档结构（并非 PPT 专有）。</div>\n", "tags": ["概述", "视图", "扩展名", "必考"]}, {"id": "p2", "title": "插入对象与外观设计", "icon": "🧩", "html": "\n<p class=\"lead\">在“插入”选项卡下，可通过“表格”“插图”“链接”“文本”“媒体剪辑”“特殊符号”等组，为幻灯片添加剪贴画、图片、形状、艺术字、表格、图表、声音、影片与超链接等多媒体元素，让演示更直观、更具感染力。</p>\n\n<div class=\"sub-h\">“插入”选项卡各功能组</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>表格组</td><td>插入 → 表格</td><td>插入表格、绘制表格或粘贴 Excel 工作表。</td></tr>\n    <tr><td>插图组</td><td>插入 → 插图</td><td>插入图片、剪贴画、相册、形状、SmartArt、图表。</td></tr>\n    <tr><td>链接组</td><td>插入 → 链接</td><td>创建超链接与动作。</td></tr>\n    <tr><td>文本组</td><td>插入 → 文本</td><td>插入文本框、艺术字、页眉页脚、日期、幻灯片编号等。</td></tr>\n    <tr><td>媒体剪辑组</td><td>插入 → 媒体剪辑</td><td>插入影片与声音。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">图片与形状</div>\n<ol class=\"step-list\">\n  <li><strong>插入剪贴画</strong>：插入 → 插图 → “剪贴画”，在任务窗格中搜索并选用。</li>\n  <li><strong>插入文件图片</strong>：插入 → 插图 → “图片”，选择文件路径与图片类型后插入。</li>\n  <li><strong>叠放次序</strong>：右键图片可设置<span class=\"highlight\">置于顶层 / 置于底层</span>，调整图片与文字的遮挡关系。</li>\n  <li><strong>插入形状</strong>：插入 → 插图 → “形状”下拉列表，含线条、矩形、基本形状、箭头汇总、公式形状、流程图、星与旗帜、标注、动作按钮等。</li>\n  <li><strong>编辑图片</strong>：右键 → “设置图片格式”，可移动、剪切、复制、调整大小，方法与 Word 相同。</li>\n</ol>\n\n<div class=\"sub-h\">艺术字、表格与图表</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>插入艺术字</td><td>插入 → 文本 → “艺术字” → 选样式 → 输入文字</td><td>特殊图形文字，常用于标题；可像图形一样设边框、填充、旋转、阴影、三维效果。用“绘图工具 → 艺术字样式”修改。</td></tr>\n    <tr><td>插入表格</td><td>插入 → 表格 → “表格”，或“插入表格”对话框输入行列数</td><td>用“设计”选项卡的表格样式组、绘图边框组美化。<span class=\"highlight\">PPT 无内置函数，不支持自动排序</span>。</td></tr>\n    <tr><td>插入图表</td><td>插入 → 插图 → “图表” → 选类型 → 确定</td><td>系统自动打开 Excel 录入数据，PPT 中图表随数据同步变化，关闭 Excel 即完成。</td></tr>\n    <tr><td>插入 Word 表格/工作表</td><td>在 Word/Excel 中复制 → 切到 PPT 目标幻灯片 → 粘贴</td><td>快速引用已有的表格数据。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">插入影片与声音</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>插入影片</td><td>插入 → 媒体剪辑 → “影片” → 选文件 → 选播放方式</td><td>“自动”进入本片即播放，“在单击时”单击后播放；随后出现“图片工具”和“影片工具”选项卡。</td></tr>\n    <tr><td>插入声音</td><td>插入 → 媒体剪辑 → “声音” → 选文件 → 选播放方式</td><td>同样有“自动 / 在单击时”，随后出现“图片工具”和“声音工具”选项卡。</td></tr>\n  </tbody>\n</table>\n<div class=\"tip warning\">插入影片会创建指向源文件的<strong>链接</strong>：若之后移动了影片文件，放映时将找不到。添加影片前，最好先把影片<span class=\"highlight\">复制到演示文稿所在文件夹</span>，避免链接失效。</div>\n\n<div class=\"sub-h\">超链接与动作设置</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>插入超链接</td><td>选定对象 → 插入 → 链接 → “超链接” → 选“链接到”</td><td>可链接到网络地址、文件、E-mail 地址或本演示文稿中的其他幻灯片。放映时单击即跳转。</td></tr>\n    <tr><td>动作设置</td><td>选定对象 → 插入 → 链接 → “动作”</td><td>含“单击鼠标”“鼠标移过”两个选项卡，可设置“超链接到、运行程序、播放声音”等触发事件。</td></tr>\n    <tr><td>删除超链接</td><td>插入 → 链接 → “超链接” → “删除链接”；或“动作设置”中选“无动作”</td><td>取消对象上已建立的跳转。</td></tr>\n  </tbody>\n</table>\n<div class=\"tip info\">超链接可加在文本、图片、占位符、动作按钮等对象上，但<strong>不能</strong>加在“背景色”上。触发方式建议采用“单击鼠标”，“鼠标移过”易造成意外跳转。</div>\n\n<div class=\"sub-h\">外观设计概览</div>\n<p class=\"lead\" style=\"margin-top:6px\">幻灯片外观设计的核心是<span class=\"highlight\">母版</span>——分为幻灯片母版、备注页母版、讲义母版三类，其中幻灯片母版最常用。要“统一给每张幻灯片加班级标志/单位徽标”，最佳做法是把标志插入母版，而非逐张复制粘贴。母版、模板、版式与主题的深度内容见下一张卡片《母版、模板与版式设计》。</p>\n", "tags": ["插入", "图片", "超链接", "必考"]}, {"id": "p3", "title": "动画、切换与放映", "icon": "🎬", "html": "\n<p class=\"lead\">演示文稿的“动感”来自两处：<span class=\"highlight\">自定义动画</span>控制单张幻灯片内对象的出现方式，<span class=\"highlight\">切换效果</span>控制张与张之间的过渡。设置好动画后，再通过放映方式、排练计时与放映控制，把演示完美呈现给观众。</p>\n\n<div class=\"sub-h\">自定义动画（单张幻灯片内的对象）</div>\n<ol class=\"step-list\">\n  <li><strong>选中对象</strong>：单击要添加动画的文本框、图形等对象。</li>\n  <li><strong>打开任务窗格</strong>：动画 → 动画组 → “自定义动画”按钮，右侧弹出任务窗格。</li>\n  <li><strong>添加效果</strong>：单击“添加效果”，从四种类型中选择，再挑具体特效并预览。</li>\n  <li><strong>设置参数</strong>：设置“开始事件、速度、大小”等；同一对象可叠加多个效果。</li>\n  <li><strong>调整顺序</strong>：在任务窗格中上下拖动，按需求调整播放顺序。</li>\n</ol>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>进入</td><td>添加效果 → 进入</td><td>对象<strong>出现</strong>时的动画，如飞入、擦除、淡出。</td></tr>\n    <tr><td>强调</td><td>添加效果 → 强调</td><td>对象<strong>停留</strong>时引起注意，如放大、闪烁、陀螺旋。</td></tr>\n    <tr><td>退出</td><td>添加效果 → 退出</td><td>对象<strong>消失</strong>时的动画，如飞出、淡出。</td></tr>\n    <tr><td>动作路径</td><td>添加效果 → 动作路径</td><td>让对象沿指定<strong>路径运动</strong>，如直线、曲线、自定义路径。</td></tr>\n  </tbody>\n</table>\n<div class=\"tip info\">动画刷（PowerPoint 2010 新增，类似“格式刷”）：位于“动画 → 高级动画”组。<strong>单击</strong>只能复制一次动画；<strong>双击</strong>可连续多次复制，再次单击图标取消。</div>\n\n<div class=\"sub-h\">幻灯片切换效果（张与张之间）</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>选择切换效果</td><td>动画 → 切换到此幻灯片 → 切换效果一览中选择</td><td>切换效果<span class=\"highlight\">涉及两张以上幻灯片</span>，是页面间的过渡动画。</td></tr>\n    <tr><td>设置切换参数</td><td>在“切换到此幻灯片”组设置切换声音、速度、换片方式</td><td>换片可选“单击鼠标”或“在此之后自动”（人工/自动）。</td></tr>\n    <tr><td>全部应用</td><td>单击“全部应用”按钮</td><td>把当前切换效果套用到整个演示文稿的全部幻灯片。</td></tr>\n    <tr><td>预览</td><td>单击“预览”组的“预览”按钮</td><td>不放映即可观看切换效果。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">设置放映方式与放映时间</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>演讲者放映（全屏幕）</td><td>幻灯片放映 → 设置 → 设置幻灯片放映</td><td>面向现场观众的常规放映方式，演讲者完全控制。</td></tr>\n    <tr><td>观众自行浏览（窗口）</td><td>同上，选对应单选按钮</td><td>小范围窗口放映，允许观众浏览、编辑、复制、打印；可显示状态栏滚动条。</td></tr>\n    <tr><td>在展台浏览（全屏幕）</td><td>同上，选对应单选按钮</td><td>自动循环运行，适合展台无人值守场景。</td></tr>\n    <tr><td>人工指定间隔</td><td>动画 → 切换到此幻灯片 → 换片方式 → “在此之后自动”并填时间</td><td>手工设定每张停留秒数。</td></tr>\n    <tr><td>排练计时</td><td>幻灯片放映 → 设置 → “排练计时”</td><td>进入全屏并显示“预演”工具栏，用“下一项/暂停/重新开始”自动记录每张时间。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">启动、控制放映与墨迹标注</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>从头放映</td><td>按 <span class=\"kbd\">F5</span>；状态栏“幻灯片放映”按钮；幻灯片放映 → “从头开始”</td><td>从第一张开始放映。</td></tr>\n    <tr><td>从当前放映</td><td>按 <span class=\"kbd\">Shift+F5</span>；幻灯片放映 → “从当前幻灯片开始”</td><td>从当前选中幻灯片开始放映。</td></tr>\n    <tr><td>脱离软件放映</td><td>另存为 → “PowerPoint 放映”，生成 .ppsx</td><td>在资源管理器中双击即自动播放，无需启动 PowerPoint。</td></tr>\n    <tr><td>放映控制菜单</td><td>放映时右键单击</td><td>含上一页、下一页、定位至幻灯片、屏幕、指针选项、暂停、结束放映等命令。</td></tr>\n    <tr><td>墨迹标注</td><td>右键 → 指针选项 → 圆珠笔/毡尖笔/荧光笔</td><td>在放映画面上书写标注，可设墨迹颜色，用“橡皮擦”擦除；结束时提示是否保存墨迹。</td></tr>\n  </tbody>\n</table>\n<div class=\"tip success\">题型示例：文字先出现、3 秒后图片再出现，是对图片设置了<strong>自定义动画</strong>（并设置延迟），而非切换或超链接。</div>\n\n<div class=\"sub-h\">打印</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>打印范围</td><td>文件 → 打印 → 设置范围</td><td>可选全部、当前幻灯片、指定编号或自定义放映；单张用“,”分隔，连续用“-”。</td></tr>\n    <tr><td>打印内容</td><td>“打印内容”下拉列表</td><td>可选幻灯片、讲义、备注页、大纲；选“讲义”时<span class=\"highlight\">每页最多 9 张</span>。</td></tr>\n    <tr><td>颜色与页面</td><td>设计 → 页面设置</td><td>可选彩色/灰度/纯黑白，设置幻灯片大小、横向/纵向、是否加框、是否打印隐藏幻灯片。</td></tr>\n  </tbody>\n</table>\n", "tags": ["动画", "切换", "放映", "必考"]}, {"id": "p4", "title": "母版、模板与版式设计", "icon": "🎨", "html": "\n<p class=\"lead\">要让几十张幻灯片风格统一、一改全改，靠的是<span class=\"highlight\">母版、模板、主题与版式</span>四件套。母版决定“统一样式”，模板提供“成品骨架”，主题提供“配色字体效果”，版式规定“占位符布局”。本卡把演示文稿的外观设计逻辑一次讲透。</p>\n\n<div class=\"sub-h\">三类母版</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>幻灯片母版</td><td>视图 → 演示文稿视图 → “幻灯片母版”</td><td><span class=\"highlight\">最常用</span>。统一设置全篇字体、字形、背景对象；在母版上改一次，所有幻灯片同步生效。</td></tr>\n    <tr><td>讲义母版</td><td>视图 → “讲义母版”</td><td>控制讲义打印版式，每页可含 1/2/3/4/6/9 张幻灯片，可加页眉、页脚、日期、页码。</td></tr>\n    <tr><td>备注页母版</td><td>视图 → “备注页母版”</td><td>统一备注页的排版；打印时在“打印内容”选“备注页”即可输出备注。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">幻灯片母版详解</div>\n<ol class=\"step-list\">\n  <li><strong>母版构成</strong>：由“幻灯片母版”和“标题母版”两部分组成。<span class=\"highlight\">标题母版</span>格式应用于首页，<span class=\"highlight\">幻灯片母版</span>格式应用于除首页外的其他页；也可不用标题母版，则母版设计应用到全部幻灯片。</li>\n  <li><strong>更改字体或项目符号</strong>：开始 → 字体组选“字体”，或开始 → 段落组选“项目符号和编号”。</li>\n  <li><strong>插入统一图片</strong>：把公司徽标、班级标志等图片插入母版，即可显示在所有幻灯片上。</li>\n  <li><strong>更改占位符</strong>：调整占位符的位置、大小和格式。</li>\n  <li><strong>注意区分</strong>：母版上的文本只用于设定<span class=\"highlight\">样式</span>；实际标题、正文应在普通视图的幻灯片上输入，页眉页脚在“页眉和页脚”对话框中输入。</li>\n</ol>\n<div class=\"tip success\">经典考点：给近 15 页的 PPT 每页都加上班级标志，<strong>最佳方法是把标志插入“母版”</strong>，而不是逐张插入或“复制/粘贴”到每张幻灯片。</div>\n<div class=\"tip warning\">给每张幻灯片添加含单位名称的<strong>水印</strong>：最优方法是先制作一张带单位名称的水印背景图片，再将其设置为幻灯片背景。</div>\n\n<div class=\"sub-h\">模板、主题与现有内容创建</div>\n<table class=\"knowledge-table\">\n  <thead><tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr></thead>\n  <tbody>\n    <tr><td>利用模板</td><td>Office 按钮 → 新建 → “已安装的模板” → 选模板 → 创建</td><td>模板是含结构与工具的一个或多个文件，替换其中预置文字、图片即可成稿。</td></tr>\n    <tr><td>利用主题</td><td>Office 按钮 → 新建 → “已安装的主题”；或“设计”选项卡套用</td><td>主题 = 主题颜色 + 主题字体（标题字体、正文字体）+ 主题效果（线条与填充效果）。</td></tr>\n    <tr><td>根据现有内容新建</td><td>Office 按钮 → 新建 → “根据现有内容新建”</td><td>新文稿版式、内容与所选现有演示文稿一致，改改即可。</td></tr>\n    <tr><td>保存为模板</td><td>另存为 → 保存类型选“PowerPoint 模板(*.potx)”</td><td>把当前样式沉淀为模板供以后复用（2003 为 .pot）。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">主题三要素与版式</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">主题颜色</div><div class=\"d\">一组配色方案，统一背景、文字、强调色。</div></div>\n  <div class=\"cell\"><div class=\"t\">主题字体</div><div class=\"d\">含标题字体与正文字体两套。</div></div>\n  <div class=\"cell\"><div class=\"t\">主题效果</div><div class=\"d\">线条与填充等图形效果风格。</div></div>\n  <div class=\"cell\"><div class=\"t\">幻灯片版式</div><div class=\"d\">规定占位符的布局，如“标题幻灯片”“标题和内容”“空白”等。</div></div>\n</div>\n<div class=\"tip info\">辨析：<strong>母版</strong>解决“统一样式、一改全改”；<strong>模板</strong>是含内容与版式的成品文件；<strong>主题</strong>是配色/字体/效果的组合；<strong>版式</strong>决定单张幻灯片上占位符的排布。空白版式无占位符，不能直接输入文字，需先插入文本框。</div>\n", "tags": ["母版", "版式", "设计"]}]}, {"chapter": "第四章 WPS Office", "title": "WPS Office 概述与对比", "cards": [{"id": "wp0overview", "title": "WPS 核心操作速查总表", "icon": "📋", "html": "\n<p class=\"lead\">WPS Office 是金山推出的国产免费办公套装，用<span class=\"highlight\">“三大模块 + 特色功能”</span>覆盖了 Microsoft Office 的全部日常场景。本表把 WPS 全家桶的模块、核心操作与考点一次性列清，先建立整体框架，再进入各节细节。</p>\n\n<div class=\"sub-h\">一、WPS 全家桶速查总表</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>软件名称</th><th>核心操作</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>WPS 文字</strong>（金山文字）</td>\n      <td>新建 <span class=\"kbd\">Ctrl+N</span>；保存 <span class=\"kbd\">Ctrl+S</span>；查找 <span class=\"kbd\">Ctrl+F</span>；替换 <span class=\"kbd\">Ctrl+H</span>；全选 <span class=\"kbd\">Ctrl+A</span></td>\n      <td>文字处理模块，对应 Microsoft Word。具有<span class=\"highlight\">文字、图形混合排版</span>功能，可完成录入、排版、表格、图文混排、页眉页脚、目录与打印。默认扩展名 <strong>.wps</strong>，模板 <strong>.wpt</strong></td>\n    </tr>\n    <tr>\n      <td><strong>WPS 表格</strong>（金山表格）</td>\n      <td>输入数据后回车确认；插入函数（公式→插入函数）；填充 <span class=\"kbd\">Ctrl+D</span> / <span class=\"kbd\">Ctrl+R</span>；保存 <span class=\"kbd\">Ctrl+S</span></td>\n      <td>电子表格模块，对应 Microsoft Excel。用于数据录入、公式函数计算、排序筛选、分类汇总、条件格式与图表。默认扩展名 <strong>.et</strong>，模板 <strong>.ett</strong></td>\n    </tr>\n    <tr>\n      <td><strong>WPS 演示</strong>（金山演示）</td>\n      <td>从头放映 <span class=\"kbd\">F5</span>；从当前页放映 <span class=\"kbd\">Shift+F5</span>；保存 <span class=\"kbd\">Ctrl+S</span>；放映中荧光笔 <span class=\"kbd\">Ctrl+P</span>、橡皮擦 <span class=\"kbd\">Ctrl+E</span></td>\n      <td>演示文稿模块，对应 Microsoft PowerPoint。用于幻灯片编辑、母版、动画切换、超链接、排练计时与放映。默认扩展名 <strong>.dps</strong>，模板 <strong>.dpt</strong></td>\n    </tr>\n    <tr>\n      <td><strong>WPS PDF</strong>（PDF 阅读器 / 转换）</td>\n      <td>文件→输出为 PDF；PDF 转 Word / 表格 / 图片；输出时设置密码与权限</td>\n      <td>WPS 内置 PDF 阅读与生成能力，<span class=\"highlight\">全面支持一键生成 PDF</span>，并可在转换过程中基于密码做权限管理（允许更改、允许复制、允许添加批注），与 Adobe Reader 等阅读软件兼容</td>\n    </tr>\n    <tr>\n      <td><strong>WPS 云文档 / 账号</strong></td>\n      <td>登录 WPS 账号→文件自动上传云端；右上角“分享”生成链接并设置查看/编辑权限</td>\n      <td>提供云空间与多端同步（Windows / 手机 / 网页），支持多人在线协作编辑、历史版本回溯；这是 WPS 相对传统 Office 单机模式的突出优势</td>\n    </tr>\n    <tr>\n      <td><strong>特色功能（选项卡）</strong></td>\n      <td>“特色功能”选项卡→选择对应工具</td>\n      <td>WPS 独有集成：思维导图、流程图、图片转文字（OCR）、输出为图片、拆分合并 PDF、文档修复、格式转换等，Office 需借助插件才能实现</td>\n    </tr>\n    <tr>\n      <td><strong>与 Office 的兼容</strong></td>\n      <td>直接打开 doc/docx、xls/xlsx、ppt/pptx；文件→另存为→选择微软格式</td>\n      <td>WPS 做到<span class=\"highlight\">底层兼容、“引擎”级兼容</span>：Microsoft Office 创建的所有文件都可以直接用 WPS Office 打开，WPS 创建的文件也可直接用 Microsoft Office 打开</td>\n    </tr>\n    <tr>\n      <td><strong>文档安全（备份）</strong></td>\n      <td>工具→选项→常规与保存→启用定时备份；工具→备份管理→数据恢复</td>\n      <td>WPS 为<span class=\"highlight\">自动备份</span>（Office 中叫“保存自动恢复信息”），文档意外丢失后可在“备份管理”中找回；备份产生的临时文件在文档完成后可直接删除</td>\n    </tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、全模块通用操作速记</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>新建文件</td><td>常用工具栏“新建”按钮，或“文件→新建”，或桌面右键→新建，或 <span class=\"kbd\">Ctrl+N</span></td><td>四种方式等价；“文件→新建”可直接套用 WPS 在线模板库</td></tr>\n    <tr><td>保存 / 另存为</td><td>保存按钮或 <span class=\"kbd\">Ctrl+S</span>；改名保存须用“文件→另存为”</td><td>想用<span class=\"highlight\">新名字</span>保存文件必须选“另存为”，直接点“保存”会覆盖原文件</td></tr>\n    <tr><td>复制 / 粘贴 / 剪切</td><td><span class=\"kbd\">Ctrl+C</span> / <span class=\"kbd\">Ctrl+V</span> / <span class=\"kbd\">Ctrl+X</span></td><td>三模块通用；配合“格式刷”可复制字符格式与段落格式，且能多次复制</td></tr>\n    <tr><td>撤销 / 恢复</td><td><span class=\"kbd\">Ctrl+Z</span> 撤销，<span class=\"kbd\">Ctrl+Y</span> 恢复</td><td>撤销可多级回退到之前的编辑状态</td></tr>\n    <tr><td>格式转换</td><td>文件→另存为→选择目标类型（如 Excel 2003 文件 .xls）</td><td>解决 03 与 07 格式互不兼容问题：<span class=\"highlight\">03 格式可在 07 软件中打开，07 格式无法用 03 软件打开</span>，另存为即可</td></tr>\n    <tr><td>打印预览</td><td>文件→打印→打印预览，或常用工具栏“打印预览”按钮</td><td>“所见即所得”，打印前检查分页、页边距与版式</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、按考点快速定位</div>\n<ol class=\"step-list\">\n  <li><strong>记名称与扩展名</strong>：WPS 文字 = 金山文字（.wps）、WPS 表格 = 金山表格（.et）、WPS 演示 = 金山演示（.dps），三者与 Word / Excel / PowerPoint <span class=\"highlight\">一一对应</span>。</li>\n  <li><strong>记兼容结论</strong>：双向兼容、引擎级兼容，Office 文件可用 WPS 打开，WPS 文件也可用 Office 打开。</li>\n  <li><strong>记权限三项</strong>：WPS 文件权限管理包括允许更改、<span class=\"highlight\">允许复制</span>、允许添加批注。</li>\n  <li><strong>记安装特性</strong>：各模块可自主选择、<span class=\"highlight\">独立安装</span>，不必全部下载；三大模块全装约占 200M。</li>\n  <li><strong>记高频快捷键</strong>：<span class=\"kbd\">Ctrl+S</span> 保存、<span class=\"kbd\">Ctrl+A</span> 全选、<span class=\"kbd\">Ctrl+V</span> 粘贴、<span class=\"kbd\">F5</span> 放映、<span class=\"kbd\">Ctrl+P</span> 荧光笔、<span class=\"kbd\">Ctrl+E</span> 橡皮擦。</li>\n</ol>\n\n<div class=\"tip info\">复习顺序建议：先用本表建立“模块—操作—功能”三列框架，再逐节精读；做题时先判断题目属于哪个模块，再回忆该模块的菜单位置与快捷键。</div>\n", "tags": ["WPS", "速查", "必考"]}, {"id": "wp0", "title": "WPS Office 概述", "icon": "🧱", "html": "\n<p class=\"lead\">WPS Office 是一款由<span class=\"highlight\">金山</span>推出的<span class=\"highlight\">免费</span>办公软件。以教材所述的 WPS Office 2013 为例，它包括 WPS 文字（金山文字）、WPS 表格（金山表格）、WPS 演示（金山演示）、电子邮件和 PDF 阅读器，其中三大模块与微软 Office 的 Word、Excel、PowerPoint <span class=\"highlight\">一一对应</span>，使用者可以顺延原有使用习惯，在不同模块中处理不同工作。</p>\n\n<div class=\"sub-h\">一、三大模块与文件格式对应关系</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>模块</th><th>WPS Office 文件 / 模板</th><th>对应 Microsoft Office 文件</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>WPS 文字</strong>（金山文字）</td><td>文字文件 <strong>*.wps</strong>；模板文件 <strong>*.wpt</strong>（也包含微软格式）</td><td>Word 文字文件 *.doc / *.docx；模板 *.dot</td></tr>\n    <tr><td><strong>WPS 表格</strong>（金山表格）</td><td>表格文件 <strong>*.et</strong>；模板文件 <strong>*.ett</strong>（也包含微软格式）</td><td>Excel 表格文件 *.xls / *.xlsx；模板 *.xlt</td></tr>\n    <tr><td><strong>WPS 演示</strong>（金山演示）</td><td>演示文件 <strong>*.dps</strong>；模板文件 <strong>*.dpt</strong>（也包含微软格式）</td><td>PowerPoint 演示文件 *.ppt / *.pptx；模板 *.pot</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip warning\">高频易错：金山文字（WPS 文字）文档的扩展名是 <strong>WPS</strong>，不是 TXT（记事本文本）、不是 DOC（Word 2007 之前版本）、更不是 BMP（Windows 标准位图格式）。</div>\n\n<div class=\"sub-h\">二、软件特点（考点密集）</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">免费办公</div><div class=\"d\">个人版免费下载使用，降低正版办公成本</div></div>\n  <div class=\"cell\"><div class=\"t\">按需安装</div><div class=\"d\">每个模块安装时可自主选择、独立安装，不用的模块可不装</div></div>\n  <div class=\"cell\"><div class=\"t\">体积小巧</div><div class=\"d\">三大模块全部安装仅占硬盘约 200M，安装快速方便</div></div>\n  <div class=\"cell\"><div class=\"t\">占用资源少</div><div class=\"d\">对硬件资源占用非常小，运行效率高</div></div>\n  <div class=\"cell\"><div class=\"t\">干净可卸载</div><div class=\"d\">安装无冗余信息、不篡改注册表，可随时完全卸载</div></div>\n  <div class=\"cell\"><div class=\"t\">开放安全</div><div class=\"d\">开放、高效、安全可靠，帮助优化工作流程</div></div>\n</div>\n\n<div class=\"sub-h\">三、常用操作步骤</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>按需安装模块</td><td>运行安装程序→在组件列表中<strong>勾选/取消</strong>WPS 文字、表格、演示→选择安装路径→开始安装</td><td>从不使用演示报告的用户可以不选演示模块，从而不占用多余硬盘空间</td></tr>\n    <tr><td>启动某一模块</td><td>“开始→所有程序→WPS Office→WPS 文字 / 表格 / 演示”，或双击桌面快捷图标</td><td>三大模块有机结合又可独立启动，互不影响</td></tr>\n    <tr><td>新建文件</td><td>启动后单击“新建”，或“文件→新建”选择模板，或 <span class=\"kbd\">Ctrl+N</span></td><td>WPS 表格启动后<span class=\"highlight\">不会自动打开</span>名为 Book1 的空白工作簿，需要用户自己新建</td></tr>\n    <tr><td>保存文件</td><td>单击保存按钮 / <span class=\"kbd\">Ctrl+S</span>；改名或改格式用“文件→另存为”</td><td>另存为时可在“文件类型”中选择微软格式，实现跨软件交付</td></tr>\n    <tr><td>生成 PDF</td><td>“文件→输出为 PDF”→设置页码范围与权限→确定</td><td>WPS 全面支持生成 PDF，无需额外安装虚拟打印机</td></tr>\n    <tr><td>设置文件权限</td><td>输出为 PDF 时勾选权限设置→设置密码→选择<strong>允许更改 / 允许复制 / 允许添加批注</strong></td><td>基于密码的文件权限管理，可与 Adobe Reader 等 PDF 阅读软件兼容</td></tr>\n    <tr><td>完全卸载</td><td>控制面板→程序和功能→选中 WPS Office→卸载</td><td>安装过程不篡改注册表，卸载后不残留冗余信息</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、真题精练</div>\n<ol class=\"step-list\">\n  <li><strong>金山文字文档文件的扩展名是（　）</strong>　A.TXT　B.DOC　C.WPS　D.BMP　→ 答案 <span class=\"highlight\">C</span>。WPS 文字文件扩展名为 WPS；TXT 为系统自带文本格式；DOC 是 Word 2007 之前版本的扩展名；BMP 是 Windows 标准图像格式。</li>\n  <li><strong>WPS 文字又叫作（　）</strong>　A.金山文字　B.Word　C.WPS Office　D.WPS Word　→ 答案 <span class=\"highlight\">A</span>。WPS Office 包括 WPS 文字（金山文字）、WPS 表格（金山表格）、WPS 演示（金山演示）、电子邮件和 PDF 阅读器。</li>\n  <li><strong>WPS 中的文件权限管理主要包括允许更改、（　）、允许添加批注</strong>　→ 答案 <span class=\"highlight\">允许复制</span>。三项一起记忆：更改、复制、批注。</li>\n  <li><strong>判断：Microsoft Office 创建的所有文件都可以直接用 WPS Office 2013 打开。</strong>　→ <span class=\"highlight\">正确</span>（√），反之亦然。</li>\n  <li><strong>判断：下载 WPS 时，一定要将 WPS Office 的所有产品都下载到电脑上。</strong>　→ <span class=\"highlight\">错误</span>（×）。每个模块可自主选择、独立安装。</li>\n</ol>\n\n<div class=\"tip success\">记忆口诀：<strong>金山出品、三大模块、一一对应、免费小巧、按需安装、双向兼容</strong>。</div>\n", "tags": ["WPS", "金山", "兼容", "必考"]}, {"id": "wp1", "title": "与 Office 的对比", "icon": "⚖️", "html": "\n<p class=\"lead\">WPS 与 Microsoft Office 的对比是本章的核心考点，主要从<span class=\"highlight\">模块对应、格式兼容、界面差异、文件管理、文档转换与权限、费用与云协作</span>六个维度展开。抓住“对应一致、双向兼容、各有优势”这条主线即可。</p>\n\n<div class=\"sub-h\">一、六大维度对比总表</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>对比维度</th><th>WPS Office</th><th>Microsoft Office</th></tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>模块构成</strong></td>\n      <td>WPS 文字 / WPS 表格 / WPS 演示，另含电子邮件、PDF 阅读器；可独立安装</td>\n      <td>Word / Excel / PowerPoint，另含 Outlook、Access 等；套装安装为主</td>\n    </tr>\n    <tr>\n      <td><strong>兼容格式</strong></td>\n      <td>原生 .wps/.et/.dps，同时<span class=\"highlight\">直接读写</span> doc/docx、xls/xlsx、ppt/pptx；底层“引擎”级兼容</td>\n      <td>原生 doc/docx、xls/xlsx、ppt/pptx；一般不能直接打开 .wps/.et/.dps 等 WPS 私有格式</td>\n    </tr>\n    <tr>\n      <td><strong>费用 / 会员</strong></td>\n      <td>基础功能<span class=\"highlight\">免费</span>；模板库、PDF 高级转换、云空间扩容等增值功能需开通会员</td>\n      <td>商业授权软件，需购买许可证或订阅 Microsoft 365</td>\n    </tr>\n    <tr>\n      <td><strong>云空间与协作</strong></td>\n      <td>登录 WPS 账号即获云文档空间，支持多端同步、在线多人协作、历史版本回溯</td>\n      <td>依托 OneDrive / SharePoint 实现云存储与协同，需相应订阅与账号</td>\n    </tr>\n    <tr>\n      <td><strong>界面差异</strong></td>\n      <td>点击相应对象时会<span class=\"highlight\">突出显示该对象的设置区域</span>；标签式多文档窗口；含“特色功能”选项卡</td>\n      <td>标准 Ribbon 选项卡界面，功能按选项卡—组—命令层级组织</td>\n    </tr>\n    <tr>\n      <td><strong>权限与安全</strong></td>\n      <td>输出 PDF 时可基于密码设置<strong>允许更改、允许复制、允许添加批注</strong>；表格可设可编辑/不可编辑区域</td>\n      <td>提供文档加密、限制编辑、信息权限管理（IRM）等</td>\n    </tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、格式兼容性要点</div>\n<ol class=\"step-list\">\n  <li><strong>双向兼容、历史数据无缝转换</strong>：Microsoft Office 创建的所有文件都可直接用 WPS Office 打开，WPS Office 创建的文件也可直接用 Microsoft Office 打开。</li>\n  <li><strong>03 与 07 格式的兼容问题</strong>：Office 2003 与 Office 2007 的格式之间存在兼容性问题——<span class=\"highlight\">07 格式无法用 03 的软件打开，但 03 格式可以在 07 的软件中打开</span>。</li>\n  <li><strong>解决办法</strong>：打开现有文件，执行“文件→另存为”，把 03 格式另存为 07 格式（或反向另存），再打开使用即可。</li>\n  <li><strong>底层兼容原理</strong>：WPS 重新架构、重写引擎，在<strong>文字排版、表格计算、演示动画</strong>三大核心上做到底层兼容、“引擎”级兼容。</li>\n</ol>\n\n<div class=\"sub-h\">三、WPS 的三大优势与操作方法</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>界面对象高亮</td>\n      <td>在文档中<strong>单击图片、表格或文本框等对象</strong>→功能区自动切换并突出显示该对象的设置区域</td>\n      <td>界面优势：相较 Office，WPS 点击对象后会突出显示对应设置区域，减少查找命令的时间</td>\n    </tr>\n    <tr>\n      <td>设置定时备份</td>\n      <td>“<strong>工具→选项→常规与保存</strong>”→勾选“启用定时备份”→设置时间间隔→确定</td>\n      <td>文件管理优势。注意 WPS 中是<span class=\"highlight\">自动备份</span>，Office 中叫“保存自动恢复信息”，二者目的都是保护文档，但 WPS 的是备份不是自动保存</td>\n    </tr>\n    <tr>\n      <td>查找与恢复备份</td>\n      <td>“<strong>工具→备份管理</strong>”→在列表中找到目标文件并打开；必要时使用“数据恢复”（自选，需安装数据恢复软件）</td>\n      <td>文档丢失时在“WPS 文字”菜单的备份管理中查看；备份功能自动生成的临时文件，在文档完成后可以直接删除</td>\n    </tr>\n    <tr>\n      <td>生成 PDF</td>\n      <td>“<strong>文件→输出为 PDF</strong>”→选择输出范围与保存位置→开始输出</td>\n      <td>文档转换优势：WPS 全面支持生成 PDF，文字、表格、演示三模块均可一键输出</td>\n    </tr>\n    <tr>\n      <td>PDF 权限管理</td>\n      <td>输出 PDF 对话框中勾选“权限设置”→输入密码→勾选<strong>允许更改 / 允许复制 / 允许添加批注</strong>→确定</td>\n      <td>转化为 PDF 的过程中可实现基于密码的文件权限管理，并可与 Adobe Reader 等 PDF 阅读软件兼容</td>\n    </tr>\n    <tr>\n      <td>云文档协作</td>\n      <td>登录 WPS 账号→保存到“我的云文档”→单击“分享”→选择“仅查看 / 可编辑”并生成链接</td>\n      <td>多人可同时在线编辑同一文档，权限可控，修改实时同步</td>\n    </tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">对比记忆法：<strong>“WPS 能开 Office 的，Office 不一定能开 WPS 的私有格式”</strong>；<strong>“WPS 是备份，Office 是自动恢复信息”</strong>；<strong>“权限三件套：改、复制、批注”</strong>。</div>\n\n<div class=\"tip warning\">易错提醒：把文档交给只装了 Microsoft Office 的同事时，应先“另存为” docx / xlsx / pptx 等微软格式，避免对方无法打开 .wps / .et / .dps。</div>\n", "tags": ["对比", "兼容", "权限", "云协作"]}]}, {"chapter": "第四章 WPS Office", "title": "WPS 文字", "cards": [{"id": "wt1", "title": "WPS 文字窗口与基本操作", "icon": "🅰️", "html": "\n<p class=\"lead\">WPS 文字是具有<span class=\"highlight\">文字、图形混合排版功能</span>的文字处理软件。其窗口自上而下由标题栏、功能区、文档编辑区域和状态栏组成，操作习惯与 Microsoft Word 基本一致，考试重点集中在窗口组成、快捷键、段落设置与表格操作。</p>\n\n<div class=\"sub-h\">一、窗口界面四大组成</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>组成部分</th><th>位置</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>标题栏</strong></td><td>窗口最顶端</td><td>显示正在编辑文档的标题，包含控制窗口图标及“最小化”“最大化（向下还原）”和“关闭”按钮。窗口非最大化时，按住标题栏拖拽可移动窗口；<span class=\"highlight\">双击标题栏中部</span>可在最大化与还原之间切换</td></tr>\n    <tr><td><strong>功能区</strong></td><td>标题栏下方</td><td>由菜单栏（相当于 Office-Word 的选项卡）和常用工具栏（相当于组合命令）组成，命令组织在逻辑组中，逻辑组集中在选项卡下，帮助快速找到完成任务所需的命令</td></tr>\n    <tr><td><strong>文档编辑区域</strong></td><td>窗口中部主体</td><td>占据窗口的主要部分，通过功能区各命令对该区域的内容进行编辑与排版</td></tr>\n    <tr><td><strong>状态栏</strong></td><td>窗口底部</td><td>显示当前工作文档的相关信息，包括<span class=\"highlight\">页码、节号、当前页数/总页数</span>等，并可切换视图与调整显示比例</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip warning\">考点：在 WPS 文字主窗口的<strong>右上角</strong>，可以同时显示的按钮是<span class=\"highlight\">“最小化、还原、关闭”</span>三个（窗口已最大化时显示“还原”，未最大化时显示“最大化”，二者不会同时出现）。</div>\n\n<div class=\"sub-h\">二、基本文档操作</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>新建文档</td><td>①常用工具栏“新建”按钮；②桌面右键→新建→Word 文档；③“文件→新建”（可使用模板）；④快捷键 <span class=\"kbd\">Ctrl+N</span></td><td>四种方法任选其一；使用模板可快速套用现成排版</td></tr>\n    <tr><td>保存文档</td><td>①点击保存按钮；②“文件→另存为”；③快捷键 <span class=\"kbd\">Ctrl+S</span></td><td>想用<span class=\"highlight\">新名字</span>保存文件，应选择文件菜单中的【另存为】命令</td></tr>\n    <tr><td>保留当前编辑位置</td><td>再次打开文档时，点击提示条中的“继续上次编辑”</td><td>WPS 文字可在退出（含意外退出）时保留当前编辑位置，类似书签，点击后跳转回上次编辑处</td></tr>\n    <tr><td>拼写检查</td><td>①选中文本→“工具→拼写检查”；②“审阅→拼写检查”；③选定错误字符→右键→拼写检查</td><td>用于检查拼写不全或有误的单词</td></tr>\n    <tr><td>查找与替换</td><td>查找 <span class=\"kbd\">Ctrl+F</span>；替换 <span class=\"kbd\">Ctrl+H</span>；也可单击工具栏查找图标</td><td>既能<strong>按内容</strong>查找替换，也能<strong>按格式</strong>查找替换（如查找文档中所有加粗文字并统一改格式）</td></tr>\n    <tr><td>复制 / 粘贴 / 剪切</td><td><span class=\"kbd\">Ctrl+C</span> 复制、<span class=\"kbd\">Ctrl+V</span> 粘贴、<span class=\"kbd\">Ctrl+X</span> 剪切；<span class=\"kbd\">Ctrl+A</span> 全选</td><td>被复制或剪切的内容先存入剪贴板，再粘贴到目标位置</td></tr>\n    <tr><td>格式刷</td><td>选中源文本→单击“格式刷”刷目标文本；<strong>双击</strong>格式刷可连续多次使用</td><td>既可复制文本格式，也可复制段落格式，并且可以实现<span class=\"highlight\">多次复制</span></td></tr>\n    <tr><td>字体加粗</td><td>选中文本→单击格式工具栏的“<strong>B</strong>”按钮，或 <span class=\"kbd\">Ctrl+B</span></td><td>与 Microsoft Word 中的功能一致；<em>I</em> 为倾斜，<u>U</u> 为下划线</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、段落设置（行距 / 缩进 / 对齐 / 边框底纹）</div>\n<ol class=\"step-list\">\n  <li><strong>行距</strong>：控制每行之间的间距。<span class=\"highlight\">最小值</span>默认为 12 磅；<span class=\"highlight\">固定值</span>不能自动调整文本高度；“间距”用于控制段落之间的间距；<strong>自动调整行距高度</strong>能在同一行字号大小不一致时自动容纳较大的字体。常用还有单倍行距、1.5 倍行距等。</li>\n  <li><strong>四种缩进</strong>：<strong>左缩进</strong>控制段落左边界位置；<strong>右缩进</strong>控制段落右边界位置；<strong>首行缩进</strong>控制段落第一行第一个字符的起始位置；<strong>悬挂缩进</strong>控制段落中除首行以外其他行的起始位置。</li>\n  <li><strong>调整左右边界最快的方法是使用“标尺”</strong>：设置段落缩进可用“段落”对话框、“段落”组、“标尺”等方式，其中标尺最快速、最直观。</li>\n  <li><strong>水平对齐共 5 种</strong>：<span class=\"highlight\">左对齐、右对齐、居中对齐、两端对齐、分散对齐</span>。</li>\n  <li><strong>边框和底纹</strong>：选中页面或段落→“页面布局→页面边框”→在对话框中设置样式、颜色、宽度；若只给选中元素加框，切换到“边框”选项卡并在“应用于”中选择范围→确定。</li>\n</ol>\n\n<div class=\"sub-h\">四、表格基础操作</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>插入表格</td><td>“<strong>插入</strong>”→表格菜单→在网格中选择格子→单击鼠标左键</td><td>WPS 文字中设置表格是在“插入”菜单栏中进行的（考点）</td></tr>\n    <tr><td>绘制斜线表头</td><td>选中表头空白单元格→“设计”选项卡→“表样式”组→“边框”→在“边框和底纹”对话框中选择预览区右下角的斜线选项→“应用于”选“单元格”→确定</td><td>制作“项目\\姓名”式斜线表头，添加后可在该单元格中输入文字</td></tr>\n    <tr><td>选定编辑对象</td><td>鼠标选中一个单元格后拖动，可选定一整行、一整列、多个单元格或整个表格→右键选择操作项</td><td>先选定、后操作是表格编辑的基本原则</td></tr>\n    <tr><td>删除单元格/行/列/表格</td><td>选定要删除的对象→执行“表格→删除”命令</td><td>删除单元格时需选择右侧或下方单元格的移动方式</td></tr>\n    <tr><td>改变行高列宽</td><td>①鼠标指向框线（变成双向箭头）拖动；②“表格→表格属性→自动调整行高和列宽”</td><td>精确调整用表格属性，快速调整用鼠标拖动</td></tr>\n    <tr><td>自动调整与均匀分布</td><td>“表格→自动调整”→选择<strong>适应窗口大小 / 平均分布各行 / 平均分布各列</strong></td><td>一键让表格整齐美观</td></tr>\n    <tr><td>合并与拆分单元格</td><td>合并：选中多个单元格→“表格工具→合并单元格”；拆分：选中单元格→“表格工具→拆分单元格”并设置行列数</td><td>用于制作复杂表头与不规则表格</td></tr>\n    <tr><td>修饰表格</td><td>选中表格→菜单栏“表格工具”和“表格样式”，或“格式→边框和底纹”</td><td>设置框线、底纹、套用现成表格样式；表格内容对齐用“表格工具→表格属性→单元格”选项卡</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip success\">WPS 表格工具中还提供公式、快速计算、表格与文本相互转换等功能，可在文字文档中完成简单的数据计算。</div>\n\n<div class=\"sub-h\">五、真题精练</div>\n<ol class=\"step-list\">\n  <li><strong>WPS 文字是一种（　）软件</strong>　→ <span class=\"highlight\">具有文字、图形混合排版功能的文字处理软件</span>。</li>\n  <li><strong>在 WPS 文字中，水平对齐方式一般有（　）种</strong>　→ <span class=\"highlight\">5 种</span>：左对齐、右对齐、居中对齐、两端对齐、分散对齐。</li>\n  <li><strong>调整左右边界比较快捷的方法是（　）</strong>　→ <span class=\"highlight\">标尺</span>。</li>\n  <li><strong>“粘贴”操作的组合键是（　）；全部选中的快捷键是（　）</strong>　→ 粘贴 <span class=\"kbd\">Ctrl+V</span>；全选 <span class=\"kbd\">Ctrl+A</span>（Ctrl+C 复制、Ctrl+X 剪切）。</li>\n  <li><strong>设置表格在哪个菜单栏中进行；加粗单击哪个按钮</strong>　→ <span class=\"highlight\">插入</span>菜单；格式工具栏中的<span class=\"highlight\">“B”</span>按钮。</li>\n</ol>\n", "tags": ["WPS文字", "窗口", "快捷键", "必考"]}, {"id": "wt1b", "title": "WPS 文字 进阶（样式/目录/修订）", "icon": "🅰️", "html": "\n<p class=\"lead\">掌握了基础录入与排版后，长文档处理才是拉开差距的关键。本卡聚焦<span class=\"highlight\">样式与多级编号、自动目录、分隔符与页面设置、图文混排、水印背景、修订批注与打印输出</span>，这些也是教师招聘信息技术学科操作题的高频命题点。</p>\n\n<div class=\"sub-h\">一、样式、项目符号与多级编号</div>\n<ol class=\"step-list\">\n  <li><strong>套用样式</strong>：选中标题文字→“开始”选项卡→样式库中选择“标题 1 / 标题 2 / 正文”。样式是<span class=\"highlight\">字体、段落等格式的集合</span>，统一修改样式即可批量改变全文外观。</li>\n  <li><strong>添加项目符号或编号</strong>：选定要添加的内容→“格式→项目符号或编号”→选择一种编号或项目符号→单击“确定”完成。</li>\n  <li><strong>自定义项目符号和编号</strong>：单击“格式→项目符号和编号”打开对话框→选择要被替换的项目符号或编号→单击“自定义”按钮→选择要使用的符号或编号格式→确定。</li>\n  <li><strong>长文档多级编号</strong>：为“标题 1 / 标题 2 / 标题 3”分别关联多级列表的第 1、2、3 级，即可自动生成“1．”“1.1”“1.1.1”式编号，插入或删除章节时编号自动重排。</li>\n</ol>\n\n<div class=\"sub-h\">二、目录、分隔符与页面设置</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>插入自动目录</td><td>先用标题样式标记各级标题→光标定位到目录页→“引用→目录”→选择自动目录样式→确定</td><td>目录条目与页码由标题样式自动提取；正文修改后单击“更新目录”→“更新整个目录”即可同步</td></tr>\n    <tr><td>使用分隔符</td><td>“插入→分隔符”→选择所需类型</td><td><strong>分页符</strong>：对文档进行分页；<strong>分节符</strong>：对文档进行分节；<strong>分栏符</strong>：未分栏时直接到下一页，已分栏则到下一栏；<strong>换行符</strong>：直接到下一行</td></tr>\n    <tr><td>页眉和页脚</td><td>“插入→页眉和页脚”，或双击页面顶部/底部区域→输入内容→关闭页眉页脚</td><td>在文档每一页的顶部和底部加入信息，内容可以是<span class=\"highlight\">文件名、标题名、日期、页码、单位名</span>等文字与图形</td></tr>\n    <tr><td>页面设置</td><td>“页面布局→页面设置”：①页边距（上、下、左、右）；②纸张大小（A4、A3、自定义）；③文档网格（每页行数、每行字数）；④纸张方向（纵向/横向）</td><td>决定版心大小与每页容量，是排版前的第一步</td></tr>\n    <tr><td>稿纸设置</td><td>“格式→稿纸设置”→选择方格式/行线式稿纸、行列数与颜色→确定</td><td>可设计自制的作文本、练习本等，适合教学场景</td></tr>\n    <tr><td>分栏</td><td>①选择要分栏的段落→“页面布局→分栏”按钮；②选择段落→“格式→分栏”命令</td><td>把段落排成两栏或多栏，可设置栏宽、间距与分隔线，常用于报刊式版面</td></tr>\n    <tr><td>首字下沉</td><td>光标定位在段落中→“格式→首字下沉”，或“插入→首字下沉”→设置下沉行数与字体→确定</td><td><span class=\"highlight\">注意：设置首字下沉时行间距不能设为“固定值”</span>，否则文字不能正常显示</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、图文混排与文档背景</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>插入对象</td><td>“插入”选项卡→图片 / 在线图片 / 艺术字 / 自选图形 / 截屏 / 图表 / 文本框 / 公式 / 符号</td><td>丰富文档内容；文字必须通过<strong>文本框</strong>才能自由摆放在任意位置</td></tr>\n    <tr><td>设置环绕方式</td><td>单击图片→“图片工具”→“环绕”→选择嵌入型、四周型、紧密型、衬于文字下方、浮于文字上方等</td><td>实现图片与文字的混排；<span class=\"highlight\">嵌入型图片不能随意拖动</span>，需改为其他环绕方式</td></tr>\n    <tr><td>压缩图片</td><td>选中图片→“图片工具→压缩图片”→选择压缩选项→确定</td><td>压缩步骤不能省，否则整个文档体积会特别大</td></tr>\n    <tr><td>裁剪与导出</td><td>“图片工具→裁剪”调整显示范围；右键→“另存为图片”导出</td><td>修改图片大小以适应文档：压缩 + 裁剪；处理后的图片可另存导出</td></tr>\n    <tr><td>设置背景</td><td>“格式→背景→填充效果”，选择颜色、渐变、纹理、图案或图片</td><td>背景只在 <span class=\"highlight\">Web 版式视图显示，打印时不显示</span></td></tr>\n    <tr><td>设置水印</td><td>“插入→水印”→选择预设水印或自定义文字/图片水印</td><td>WPS 中共有<strong>文字和图案两种水印</strong>，这两种水印在<span class=\"highlight\">打印时均会显示</span>（与背景相反，是常考对比点）</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、修订、批注与审阅</div>\n<ol class=\"step-list\">\n  <li><strong>开启修订</strong>：“审阅→修订”（快捷键 <span class=\"kbd\">Ctrl+Shift+E</span>）。开启后所有增删改都会以带颜色的痕迹标记，并在页边显示修订框。</li>\n  <li><strong>接受或拒绝修订</strong>：“审阅→接受/拒绝”，可逐条处理，也可选择“接受对文档的所有修订”一次完成。</li>\n  <li><strong>插入批注</strong>：选中文字→“审阅→插入批注”→输入意见。批注是<span class=\"highlight\">意见提示，不改变正文</span>；修订是对正文的直接改动记录，二者不能混淆。</li>\n  <li><strong>删除批注</strong>：右键批注框→“删除批注”，或“审阅→删除→删除文档中的所有批注”。</li>\n  <li><strong>限制编辑与保护</strong>：“审阅→限制编辑”，设置为只允许批注或填写窗体，并设置密码，防止他人改动定稿内容。</li>\n  <li><strong>文档比较</strong>：“审阅→比较”，选择原文档与修订后文档，可自动列出全部差异，便于核对多人修改结果。</li>\n</ol>\n\n<div class=\"sub-h\">五、视图辅助与打印输出</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>多页模式视图</td><td>“视图→多页”，或拖动状态栏右下角的显示比例滑块</td><td>同屏浏览多页版面；把显示比例缩小到约 <span class=\"highlight\">48%</span> 时，对应三页浏览模式</td></tr>\n    <tr><td>打印预览</td><td>①常用工具栏“打印预览”按钮；②“文件→打印→打印预览”</td><td>具有<span class=\"highlight\">“所见即所得”</span>的效果，方便打印前调整版面</td></tr>\n    <tr><td>打印</td><td>“文件→打印→打印(P)”→在对话框中选择打印机、页面范围、份数→确定</td><td>页面范围中不连续页用逗号分隔，连续页用连字符表示，如 1,3,5-8</td></tr>\n    <tr><td>输出为 PDF</td><td>“文件→输出为 PDF”→设置范围与权限→开始输出</td><td>定稿交付首选 PDF，可避免排版在他人电脑上错乱，并可设置密码权限</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">长文档标准流程：<strong>页面设置 → 套用标题样式 → 多级编号 → 分节与页眉页脚 → 插入自动目录 → 图文混排 → 修订定稿 → 打印预览 → 输出 PDF</strong>。</div>\n", "tags": ["WPS文字", "样式", "目录", "修订"]}]}, {"chapter": "第四章 WPS Office", "title": "WPS 表格", "cards": [{"id": "wt2", "title": "WPS 表格基础", "icon": "🅱️", "html": "\n<p class=\"lead\">WPS 表格用于数据的录入、计算、统计与分析，界面与操作和 Excel 高度一致。窗口由标题栏、菜单栏（选项卡）、<span class=\"highlight\">编辑栏</span>、工作簿窗口和状态栏组成，考点集中在选项卡分工、单元格命名、数据输入规则、对齐方式与单元格格式。</p>\n\n<div class=\"sub-h\">一、窗口界面五大组成</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>组成部分</th><th>位置</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>标题栏</strong></td><td>窗口顶端</td><td>包括文件名和 3 个控制按钮：最小化、最大化/还原、关闭</td></tr>\n    <tr><td><strong>菜单栏（选项卡）</strong></td><td>标题栏下方</td><td>常用共有<span class=\"highlight\">九个</span>选项卡：开始、插入、页面布局、公式、数据、审阅、视图、开发工具、特色功能；每个选项卡代表一组核心任务，又分为若干组</td></tr>\n    <tr><td><strong>编辑栏</strong></td><td>选项卡功能区下方</td><td>自左至右由<strong>名称框、工具栏按钮、编辑框</strong>三部分组成。单元格被激活时其编号（如 C4）出现在名称框中；工具栏显示“取消”“输入”“插入函数”3 个按钮</td></tr>\n    <tr><td><strong>工作簿窗口</strong></td><td>编辑栏下方，窗口主体</td><td>工作簿是计算和存储数据的文件；<span class=\"highlight\">WPS 启动后不会自动打开名为 Book1 的空白工作簿</span>；工作簿由一个或多个工作表组成，默认有 Sheet1、Sheet2、Sheet3 共 3 个表，可根据需要增减</td></tr>\n    <tr><td><strong>状态栏</strong></td><td>窗口底部</td><td>默认显示文档的视图和缩放比例，可切换视图模式、调整显示比例，并显示求和/平均值等快速统计</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">编辑栏三按钮：“<strong>输入</strong>”按钮功能同回车键，用于确认输入的内容；“<strong>取消</strong>”按钮用于取消本次输入；单击“<strong>插入函数</strong>”按钮时，活动单元格和编辑框中都会出现等号“=”，同时打开“插入函数”对话框。</div>\n\n<div class=\"sub-h\">二、九大选项卡分工</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">开始</div><div class=\"d\">复制、剪切、粘贴、格式刷，设置字体、对齐方式、数字格式、边框与颜色</div></div>\n  <div class=\"cell\"><div class=\"t\">插入</div><div class=\"d\">数据透视表、图片、剪贴画、各类图表、超链接、页眉页脚、艺术字、特殊符号</div></div>\n  <div class=\"cell\"><div class=\"t\">页面布局</div><div class=\"d\">主题、页边距、纸张方向、打印区域、背景和网格线等版式设置</div></div>\n  <div class=\"cell\"><div class=\"t\">公式</div><div class=\"d\">插入函数、常用公式、名称管理与公式审核</div></div>\n  <div class=\"cell\"><div class=\"t\">数据</div><div class=\"d\">排序、筛选、分类汇总、数据有效性以及获取外部数据</div></div>\n  <div class=\"cell\"><div class=\"t\">审阅</div><div class=\"d\">拼写检查等校对功能、添加批注、保护工作表与工作簿</div></div>\n  <div class=\"cell\"><div class=\"t\">视图</div><div class=\"d\">工作簿视图切换、工作表显示与隐藏、冻结窗格、显示比例</div></div>\n  <div class=\"cell\"><div class=\"t\">开发工具 / 特色功能</div><div class=\"d\">宏与控件；WPS 独有的拆分表格、录入身份证、文档助手等</div></div>\n</div>\n\n<div class=\"sub-h\">三、基本表格操作</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>新建工作簿</td><td>①“文件→新建”命令；②桌面单击右键→新建；③快捷键 <span class=\"kbd\">Ctrl+N</span></td><td>启动 WPS 表格时不会自动新建空白工作簿，需用户自己建立。文件格式：表格 <strong>*.et</strong>，模板 <strong>*.ett</strong></td></tr>\n    <tr><td>输入数据（三种方式）</td><td>①单击单元格直接输入（会覆盖原有数据）；②双击单元格出现光标后定位再输入（用于修改部分内容）；③单击单元格后再单击编辑栏输入</td><td>与 Excel 一样，默认情况下<span class=\"highlight\">数字靠右侧对齐，文本靠左侧对齐</span></td></tr>\n    <tr><td>输入分数</td><td>采用“整数 + 空格 + 分数”的形式，如输入 <span class=\"kbd\">0 空格 1/2</span></td><td>直接输入“1/2”会被识别为日期，显示为 1 月 2 日</td></tr>\n    <tr><td>输入数字型文本</td><td>先输入英文状态下的<span class=\"highlight\">半角单引号 '</span>，再输入数字，如 '110105200601011234</td><td>在数字前加该字符可将数字作为文本处理，用于身份证号、学号、以 0 开头的编号</td></tr>\n    <tr><td>输入日期和时间</td><td>用“-”或“/”分隔，如 2006-6-5</td><td>日期和时间均按数字处理：WPS 能识别的<span class=\"highlight\">靠右对齐</span>；不能识别的（如 2006.6.5）被视为文本，<span class=\"highlight\">靠左对齐</span></td></tr>\n    <tr><td>自动填充</td><td>①拖动单元格右下角的<strong>填充柄</strong>（十字形符号）；②“编辑→填充→序列”命令；③<span class=\"kbd\">Ctrl+D</span> 向下填充、<span class=\"kbd\">Ctrl+R</span> 向右填充</td><td>可快速填充等差/等比数列、日期、星期、月份及“产品 1、产品 2”等自定义序列</td></tr>\n    <tr><td>保存工作簿</td><td>快捷键 <span class=\"kbd\">Ctrl+S</span>；直接保存或“另存为”改名保存</td><td>另存为时可选择 Excel 2003(.xls)、Excel(.xlsx)、CSV 等类型</td></tr>\n    <tr><td>工作表标签颜色</td><td>选择 Sheet1→右键→【工作表标签颜色】→选择颜色</td><td>为了醒目、美观，便于在多表工作簿中查找定位</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、格式化工作表</div>\n<ol class=\"step-list\">\n  <li><strong>设置单元格字体</strong>：单击右键→【设置单元格格式】→单击【字体】标签，设置字体、字号、字形与颜色。</li>\n  <li><strong>设置对齐方式</strong>：右键→【设置单元格格式】→【对齐】标签，或直接在工具栏设置（首选）。数据对齐分<span class=\"highlight\">水平对齐与垂直对齐</span>：水平方向有左对齐、右对齐、居中对齐、分散对齐、两端对齐；垂直方向有顶端对齐、垂直居中、底端对齐。</li>\n  <li><strong>设置边框</strong>：右键→【设置单元格格式】→【边框】标签，或在“开始”选项卡工具栏设置（首选），可设线型、颜色与内外框线。</li>\n  <li><strong>设置数字格式</strong>：右键→【设置单元格格式】→【数字】标签，包含<span class=\"highlight\">常规、数值、货币、会计专用、日期、时间、百分比、分数、科学计数、文本、特殊、自定义</span>共 12 类（注意：“字体”不属于数字标签）。</li>\n  <li><strong>套用表格样式</strong>：选中数据区域→“开始→表格样式”选择内置样式，也可进入“设计”选项卡再修改，使表格美观且不易看花眼。</li>\n  <li><strong>条件格式</strong>：点击【格式】→【条件格式】命令，设置条件与对应格式。例如把 9 月 24 日以前出生的记录自动标记为黄色，实现重点数据的自动突出。</li>\n  <li><strong>插入图形对象</strong>：选择【插入】→【图片】等，可添加图形、图片、剪贴画和艺术字，增强表格表现力。</li>\n</ol>\n\n<div class=\"sub-h\">五、真题精练</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>题目</th><th>答案</th><th>解析要点</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>“对齐”标签属于（　）对话框</td><td><strong>单元格格式</strong></td><td>右键→设置单元格格式→【对齐】标签，或在工具栏设置</td></tr>\n    <tr><td>WPS 表格中数字默认（　）对齐</td><td><strong>右对齐</strong></td><td>数字默认右对齐，文本默认左对齐</td></tr>\n    <tr><td>下列不属于水平对齐方式的是（　）</td><td><strong>垂直对齐</strong></td><td>水平：左、右、居中、分散、两端；垂直：顶端、垂直居中、底端</td></tr>\n    <tr><td>不属于“单元格格式”数字标签内容的是（　）</td><td><strong>字体</strong></td><td>数字标签含常规、数值、货币、会计专用、日期、时间、百分比、分数、科学计数、文本、特殊、自定义</td></tr>\n    <tr><td>添加边框、颜色从哪个菜单开始</td><td><strong>开始</strong></td><td>开始菜单可进行字体格式设置、单元格边框设置等</td></tr>\n    <tr><td>C4 单元格是指（　）</td><td><strong>第四行第三列</strong></td><td>字母 C 是列标（从 A 起，C 为第三列），数字 4 是行号（从 1 起，即第四行）</td></tr>\n  </tbody>\n</table>\n", "tags": ["WPS表格", "单元格", "对齐", "必考"]}, {"id": "wt2b", "title": "WPS 表格 函数与数据处理", "icon": "🅱️", "html": "\n<p class=\"lead\">公式函数与数据处理是 WPS 表格的灵魂。本卡覆盖<span class=\"highlight\">插入函数、常用函数、单元格引用、数据有效性、排序筛选与分类汇总、工作表保护，以及“无法粘贴大批量数据”的经典故障排查</span>，并总结 WPS 相对 Excel 在函数体验上的优势。</p>\n\n<div class=\"sub-h\">一、公式与插入函数</div>\n<ol class=\"step-list\">\n  <li><strong>公式必须以等号开头</strong>：在单元格中先输入 <span class=\"kbd\">=</span>，再输入运算表达式或函数名，如 <span class=\"kbd\">=B2*C2</span>，回车确认。</li>\n  <li><strong>使用插入函数向导</strong>：选择“<strong>公式</strong>”菜单→“<strong>插入函数</strong>”→选择要用的“函数”或“常用公式”→按照图形界面提示填写参数→确定。利用内置常用公式可实现<span class=\"highlight\">从身份证号码提取性别、生日</span>等功能。</li>\n  <li><strong>快速调用简单函数</strong>：一些经常用到的简单函数（求和、求平均值、计数、最大值、最小值）可在“开始→自动求和”下拉列表中直接选取。</li>\n  <li><strong>公式填充</strong>：选中已写好公式的单元格→拖动右下角的“<strong>十字标志</strong>”填充柄向下拖动，即可对整列数据批量套用公式。</li>\n  <li><strong>检查与修正</strong>：出现 #DIV/0!（除数为 0）、#VALUE!（参数类型错）、#NAME?（函数名或名称拼写错）、#REF!（引用无效）时，双击单元格查看公式并修正。</li>\n</ol>\n\n<div class=\"sub-h\">二、常用函数速查</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>函数</th><th>典型写法</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>SUM</strong></td><td>=SUM(B2:B10)</td><td>求区域内所有数值之和，最常用的统计函数</td></tr>\n    <tr><td><strong>AVERAGE</strong></td><td>=AVERAGE(B2:B10)</td><td>求平均值，空单元格不参与计算</td></tr>\n    <tr><td><strong>MAX / MIN</strong></td><td>=MAX(B2:B10)　=MIN(B2:B10)</td><td>求最大值 / 最小值，用于找出最高分、最低分</td></tr>\n    <tr><td><strong>COUNT / COUNTA</strong></td><td>=COUNT(B2:B10)　=COUNTA(A2:A10)</td><td>COUNT 统计<span class=\"highlight\">数值单元格</span>个数；COUNTA 统计非空单元格个数</td></tr>\n    <tr><td><strong>IF</strong></td><td>=IF(B2&gt;=60,\"及格\",\"不及格\")</td><td>条件判断，条件成立返回第二参数，否则返回第三参数；可嵌套实现多级评定</td></tr>\n    <tr><td><strong>COUNTIF / SUMIF</strong></td><td>=COUNTIF(B2:B10,\"&gt;=90\")　=SUMIF(A2:A10,\"男\",C2:C10)</td><td>按条件计数 / 按条件求和，用于分段统计与分类汇总</td></tr>\n    <tr><td><strong>RANK</strong></td><td>=RANK(B2,$B$2:$B$10)</td><td>求名次；第二参数必须用<span class=\"highlight\">绝对引用</span>锁定区域，否则下拉填充时区域会移动导致错误</td></tr>\n    <tr><td><strong>VLOOKUP</strong></td><td>=VLOOKUP(A2,$F$2:$H$50,3,0)</td><td>按首列查找并返回指定列的值；最后参数 0 表示精确匹配，用于按学号/工号调取信息</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip warning\">单元格引用三类：<strong>相对引用</strong> B2（随公式位置变化）、<strong>绝对引用</strong> $B$2（行列都锁定，不随填充变化）、<strong>混合引用</strong> B$2 或 $B2（锁定行或锁定列）。按 <span class=\"kbd\">F4</span> 可在三者间循环切换。</div>\n\n<div class=\"sub-h\">三、WPS 表格在函数上的优势</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">公式自动联想</div><div class=\"d\">输入公式时自动弹出候选函数与提示，减少记忆负担</div></div>\n  <div class=\"cell\"><div class=\"t\">中文参数提示</div><div class=\"d\">采用中文参数说明（如“查找值、数据表、列序数、匹配条件”），便于用户理解函数</div></div>\n  <div class=\"cell\"><div class=\"t\">内置常用公式</div><div class=\"d\">提取身份证性别/生日、计算个人所得税等，只需填参数即可套用</div></div>\n  <div class=\"cell\"><div class=\"t\">按颜色筛选</div><div class=\"d\">可直接按单元格填充颜色进行筛选，配合颜色标识查看数据</div></div>\n</div>\n\n<div class=\"sub-h\">四、数据处理与安全操作</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>数据有效性</td><td>选中区域→“数据→有效性”→①【设置】选择“序列”并填写来源（用英文逗号分隔）；②【输入信息】填写提示；③【出错警告】设置警告样式与内容</td><td>输入一次数据、每次下拉选择，既提高输入速度又统一数据口径；出错警告可避免在表中胡乱填写数据，减少后期数据校验工作量</td></tr>\n    <tr><td>排序</td><td>选中数据区域内任一单元格→“数据→排序”→设置主要关键字、次序（升序/降序），可添加次要关键字</td><td>按成绩、日期等字段重排数据；含标题行时需勾选“数据包含标题”</td></tr>\n    <tr><td>筛选</td><td>“数据→自动筛选”→单击字段右侧下拉箭头→勾选内容、按颜色筛选或使用“自定义筛选”设置条件</td><td>只显示满足条件的记录，其余行被<span class=\"highlight\">暂时隐藏而非删除</span>；再次点击可取消筛选</td></tr>\n    <tr><td>分类汇总</td><td><strong>先按分类字段排序</strong>→“数据→分类汇总”→选择分类字段、汇总方式（求和/平均值等）与汇总项→确定</td><td>关键前提是先排序，否则同类数据分散会导致汇总结果错误</td></tr>\n    <tr><td>数据透视表</td><td>选中数据区域→“插入→数据透视表”→将字段拖入行、列、值区域</td><td>多维交叉统计，可快速完成按班级、性别等多条件的汇总分析</td></tr>\n    <tr><td>创建图表</td><td>选中数据源→“插入→图表”→选择柱形图/折线图/饼图等→调整图表标题与数据标签</td><td>柱形图比较大小、折线图看趋势、饼图看构成比例</td></tr>\n    <tr><td>设置可编辑区域</td><td>①选中允许编辑的单元格→右键→设置单元格格式→【保护】→<span class=\"highlight\">取消勾选“锁定”</span>；②点击“审阅→保护工作表”→输入密码→勾选允许的用户操作→确定</td><td>实现数据报表的安全：他人只能在指定区域填写，其余区域受保护不可改动；密码务必记牢</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">五、经典故障：无法粘贴大批量数据</div>\n<ol class=\"step-list\">\n  <li><strong>现象</strong>：粘贴时提示“表格无法粘贴信息，原因是复制区域与粘贴区域形状不同”。</li>\n  <li><strong>原因一：数据过多，超过行列数限制</strong>。Excel 2003 版最大行数是 <span class=\"highlight\">65536</span> 行，Excel 2007 开始的版本最大行数是 <span class=\"highlight\">1048576</span> 行（WPS 对数据行数的限制和 Office 一样）。超限时无论怎么设置都无法粘贴。</li>\n  <li><strong>原因二：格式限制</strong>。解决办法是更改格式，采用“文件→另存为”，把 Excel 2003 文件另存为高版本文件类型后再操作。</li>\n  <li><strong>原因三：工作表锁定</strong>。右键单击工作表标签→选择“保护工作表”（撤销保护）→输入密码→更改用户权限，即可解除锁定状态。</li>\n  <li><strong>原因四：单元格锁定</strong>。右键→设置单元格格式→【保护】→<span class=\"highlight\">取消对“锁定”选项的选择</span>，再执行粘贴。</li>\n</ol>\n\n<div class=\"tip success\">操作口诀：<strong>先排序再汇总、锁区域先取消锁定再保护、名次函数记得加 $、身份证输入先打单引号</strong>。</div>\n", "tags": ["WPS表格", "函数", "数据处理", "保护"]}]}, {"chapter": "第四章 WPS Office", "title": "WPS 演示", "cards": [{"id": "wt3", "title": "WPS 演示基础与放映", "icon": "🅲️", "html": "\n<p class=\"lead\">WPS 演示用于制作和播放演示文稿，默认扩展名为 <strong>.dps</strong>（模板 .dpt），与 PowerPoint 一一对应。窗口由选项卡、功能区、<span class=\"highlight\">大纲/幻灯片浏览区</span>、幻灯片编辑区、备注区和状态栏组成，考点集中在窗口分区、母版、放映方式与快捷键。</p>\n\n<div class=\"sub-h\">一、窗口界面六大组成</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>组成部分</th><th>位置</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>选项卡</strong></td><td>窗口上方</td><td>共有 <span class=\"highlight\">9 个</span>标准选项卡：开始、插入、设计、动画、幻灯片放映、审阅、视图、开发工具、特色功能；单击后该任务的一组工具显示在下方</td></tr>\n    <tr><td><strong>功能区</strong></td><td>选项卡下方</td><td>包含特定任务选项卡下的全部工具，按功能组成不同的组，每组面向不同对象实现特定功能</td></tr>\n    <tr><td><strong>大纲/幻灯片浏览区</strong></td><td>窗口左侧</td><td>显示幻灯片文本的大纲或幻灯片的缩略图，可方便地<span class=\"highlight\">添加、删除、复制幻灯片，并重新排列顺序</span></td></tr>\n    <tr><td><strong>幻灯片编辑区</strong></td><td>窗口中部</td><td>显示当前幻灯片，是编辑和格式化的主要区域，可添加文本，插入图片、表格、SmartArt 图形、电影、声音、动画和超链接等多媒体元素</td></tr>\n    <tr><td><strong>备注区</strong></td><td>编辑区下方</td><td>为当前幻灯片添加备注。<span class=\"highlight\">备注内容在放映时不显示</span>，但备注页可以打印出来作为演讲底稿</td></tr>\n    <tr><td><strong>状态栏</strong></td><td>窗口最下方</td><td>显示幻灯片总页数，可切换视图模式、改变显示比例</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、基本操作</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>启动与退出</td><td>启动：“开始→所有程序→WPS Office→WPS 演示”，或双击桌面快捷图标；退出：单击 WPS 演示按钮→退出，或单击关闭按钮</td><td>若文件未保存，WPS 演示将会提醒保存</td></tr>\n    <tr><td>创建新演示文稿</td><td>①单击功能键区的“+”；②“文件→新建”；③选择“最近使用的文档”或“已安装的模板”</td><td>可从空白幻灯片开始，再通过“设计”选项卡选用和修改主题；模板已随 WPS 演示预安装</td></tr>\n    <tr><td>保存演示文稿</td><td>①“文件→另存为”；②点击功能区保存按钮；③快捷键 <span class=\"kbd\">Ctrl+S</span></td><td>默认保存为 .dps；交付他人可另存为 .ppt / .pptx</td></tr>\n    <tr><td>新建幻灯片</td><td>“开始→新建幻灯片”，或在浏览区右键→新建幻灯片，或 <span class=\"kbd\">Ctrl+M</span></td><td>可同时选择版式（标题幻灯片、标题和内容、空白等）</td></tr>\n    <tr><td>输入文本</td><td>在编辑区单击“单击此处添加标题/副标题”占位符输入；空白处的文字须先<strong>插入文本框</strong></td><td>输入后选择功能区“字体”命令修改字体及样式</td></tr>\n    <tr><td>使用幻灯片母版</td><td>①“设计→版式”，在“母版版式”列表中选择版式修改当前幻灯片；②“视图→幻灯片母版”进入母版设计，编辑完成后单击“关闭”</td><td>母版状态下可插入页码、日期、页脚以及统一的图片标志，让<span class=\"highlight\">所有页面自动应用</span>，避免重复劳动。WPS 演示有三种母版：<strong>幻灯片母版、讲义母版、备注母版</strong></td></tr>\n    <tr><td>设置背景</td><td>右键幻灯片空白处→“背景”，或“设计→背景”→选择颜色、纹理、图案或图片→应用/全部应用</td><td>背景应用于整个幻灯片，其他一切内容都位于背景之上</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、演示文稿放映</div>\n<ol class=\"step-list\">\n  <li><strong>设置放映方式</strong>：“幻灯片放映→设置放映方式”，弹出对话框后选择：<strong>演讲者放映（全屏幕）</strong>——以全屏形式显示，可通过快捷菜单或键盘控制播放；<strong>展台浏览（全屏幕）</strong>——以全屏形式在展台上自动放映；另有观众自行浏览（窗口）方式。</li>\n  <li><strong>从头开始放映</strong>：按 <span class=\"kbd\">F5</span>，或“视图→演示文稿视图→幻灯片放映”按钮。</li>\n  <li><strong>从当前页开始放映</strong>：按 <span class=\"kbd\">Shift+F5</span>，或“幻灯片放映→从当前幻灯片开始”，也可单击状态栏右下角的“幻灯片放映”按钮。</li>\n  <li><strong>双击缩略图直接放映</strong>：在幻灯片浏览区双击某张幻灯片的缩略图即可直接进入放映，这是 WPS 演示的便捷特色。</li>\n  <li><strong>自定义放映</strong>：“幻灯片放映→自定义幻灯片放映”，挑选部分幻灯片组成一个放映方案，以便针对不同群体进行演示。</li>\n  <li><strong>排练计时</strong>：“幻灯片放映→排练计时”，逐页记录讲解时间。可根据<span class=\"highlight\">每张幻灯片各自的放映时间</span>设定间隔自动放映——注意各页间隔并不要求一致。</li>\n  <li><strong>放映中做标注</strong>：使用圆珠笔、毡尖笔或荧光笔在幻灯片上书写；“墨迹颜色”可指定颜色；“橡皮擦”或“擦除幻灯片上的所有墨迹”可清除；选择“箭头”退出标注模式。结束放映时系统会询问是否保存墨迹。</li>\n</ol>\n\n<div class=\"tip info\">放映快捷键小结：<span class=\"kbd\">F5</span> 从头放映、<span class=\"kbd\">Shift+F5</span> 从当前页放映、<span class=\"kbd\">Ctrl+P</span> 荧光笔、<span class=\"kbd\">Ctrl+E</span> 橡皮擦、<span class=\"kbd\">Esc</span> 结束放映、<span class=\"kbd\">Ctrl+S</span> 保存。</div>\n\n<div class=\"sub-h\">四、真题精练</div>\n<ol class=\"step-list\">\n  <li><strong>WPS 中保存演示文稿的快捷键是（　）</strong>　→ <span class=\"kbd\">Ctrl+S</span>。Ctrl+F 查找、Ctrl+H 替换、Ctrl+Z 撤回。</li>\n  <li><strong>显示幻灯片文本的大纲或幻灯片缩略图的部分叫作（　）</strong>　→ <span class=\"highlight\">大纲/幻灯片浏览区</span>。</li>\n  <li><strong>快捷键 Ctrl+P 与 Ctrl+E 分别有（　）功能（多选）</strong>　→ <span class=\"highlight\">荧光笔、橡皮擦</span>。</li>\n  <li><strong>判断：WPS 演示一定可以将演示文档打包成文件夹与压缩文件。</strong>　→ <span class=\"highlight\">正确</span>（√）。</li>\n  <li><strong>判断：使用“排练计时”放映时，每张幻灯片放映的间隔时间是一致的。</strong>　→ <span class=\"highlight\">错误</span>（×）。排练计时按每张幻灯片各自记录的时间自动放映。</li>\n</ol>\n", "tags": ["WPS演示", "母版", "放映", "必考"]}, {"id": "wt3b", "title": "WPS 演示 动画与输出", "icon": "🅲️", "html": "\n<p class=\"lead\">一份出彩的演示文稿离不开<span class=\"highlight\">动画、切换、交互与规范输出</span>。本卡系统梳理自定义动画的四类效果、幻灯片切换、超链接与动作按钮、对象排版技巧，以及打包、输出 PDF/图片/视频与打印讲义的完整流程。</p>\n\n<div class=\"sub-h\">一、自定义动画（对象级）</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>添加动画</td><td>选中文字、图片或文本框→“动画”选项卡→在动画库中选择效果，或单击“自定义动画”打开右侧任务窗格→“添加效果”</td><td>为对象添加动态效果，是让“文字先出现、3 秒后图片再出现”这类效果的正确做法（属于<span class=\"highlight\">自定义动画</span>，不是切换或超链接）</td></tr>\n    <tr><td>四类动画效果</td><td>在“添加效果”中选择：<strong>进入 / 强调 / 退出 / 动作路径</strong></td><td>进入=对象出现的方式；强调=已出现对象的突出；退出=对象消失的方式；动作路径=按指定轨迹移动</td></tr>\n    <tr><td>设置开始方式</td><td>在自定义动画窗格中设置“开始”：<strong>单击时 / 之前 / 之后</strong>，并设置方向、速度</td><td>“之后”配合“延迟”秒数即可实现“文字出现 3 秒后图片再出现”</td></tr>\n    <tr><td>调整播放顺序</td><td>在动画窗格列表中拖动条目，或使用“重新排序”上下箭头</td><td>序号即播放先后；同一页多个对象常需重排</td></tr>\n    <tr><td>动画刷</td><td>选中已设好动画的对象→单击“动画刷”→点击目标对象</td><td>快速把一套动画参数复制给其他对象，双击可连续使用</td></tr>\n    <tr><td>删除动画</td><td>在动画窗格中选中条目→单击“删除”，或按 <span class=\"kbd\">Delete</span></td><td>动画过多会喧宾夺主，定稿前应精简</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、幻灯片切换（页面级）与交互</div>\n<ol class=\"step-list\">\n  <li><strong>设置切换效果</strong>：“切换”选项卡→选择淡出、擦除、推出、百叶窗等效果→设置速度与声音→可单击“应用到全部”统一整个演示文稿。</li>\n  <li><strong>切换与动画的区别</strong>：<span class=\"highlight\">幻灯片切换</span>是幻灯片<strong>页与页之间</strong>换片时的格式；<span class=\"highlight\">自定义动画</span>是<strong>页内对象</strong>的动态效果，二者概念常被混淆。</li>\n  <li><strong>换片方式</strong>：勾选“单击鼠标时”由演讲者控制；勾选“自动换片”并设定秒数可无人值守播放，常与展台浏览配合。</li>\n  <li><strong>插入超链接</strong>：选中对象→“插入→超链接”（<span class=\"kbd\">Ctrl+K</span>）→链接到本文档中的位置、原有文件或网页。<span class=\"highlight\">动作按钮、文字、图片都可以设置超链接，背景色不可以</span>。</li>\n  <li><strong>动作按钮</strong>：“插入→形状→动作按钮”，绘制后在弹出的“动作设置”中指定单击时跳转的目标页，常用于制作目录页导航。</li>\n</ol>\n\n<div class=\"sub-h\">三、对象美化与效率技巧（WPS 演示优势）</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>添加艺术字与文本效果</td><td>“插入→艺术字”选择样式→输入文字→在“文本工具”中设置填充、轮廓、阴影、映像、发光等文本效果</td><td>WPS 内置丰富的艺术字与文本效果预设，快速做出标题质感</td></tr>\n    <tr><td>等尺寸对齐</td><td>按住 <span class=\"kbd\">Ctrl</span> 或 <span class=\"kbd\">Shift</span> 选中多个对象→“绘图工具→对齐→等宽 / 等高 / 等尺寸”</td><td>WPS 特色功能：可将多个对象的宽度、高度，或宽与高一次调成一致大小</td></tr>\n    <tr><td>对齐与分布</td><td>选中多个对象→“绘图工具→对齐”→左对齐/水平居中/横向分布等</td><td>使用图形对齐工具排版，比手动拖动更精准</td></tr>\n    <tr><td>文字升降级</td><td>降级 <span class=\"kbd\">Tab</span>；升级 <span class=\"kbd\">Shift+Tab</span></td><td>在大纲或占位符中快速调整层级，比手动改字号更规范</td></tr>\n    <tr><td>按比例缩放字号</td><td>减小字号 <span class=\"kbd\">Ctrl+[</span>；增大字号 <span class=\"kbd\">Ctrl+]</span></td><td>无需打开字号下拉框即可微调</td></tr>\n    <tr><td>图形快捷操作</td><td>按住 <span class=\"kbd\">Ctrl</span> 拖动=复制；按住 <span class=\"kbd\">Shift</span> 绘制=画“正”的图形（正圆/正方形）、同比例放大缩小、平行或垂直移动</td><td>Ctrl 与 Shift 是图形排版的两个万能辅助键</td></tr>\n    <tr><td>放映中书写</td><td><span class=\"kbd\">Ctrl+P</span> 荧光笔、<span class=\"kbd\">Ctrl+E</span> 橡皮擦，或点击放映界面左下角图标</td><td>“PPT 也能做黑板”，边画边讲做重点注释与提醒；结束放映时可选择是否保留墨迹</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、输出与打印</div>\n<ol class=\"step-list\">\n  <li><strong>文件打包</strong>：“文件→文件打包”→选择“将演示文档打包成文件夹”或“打包成压缩文件”。打包会把演示文稿连同链接的字体、视频、音频一并复制，避免<span class=\"highlight\">换电脑播放时字体丢失、视频失效</span>。</li>\n  <li><strong>输出为 PDF</strong>：“文件→输出为 PDF”→设置范围与权限（允许更改/复制/添加批注）→输出，便于分发与阅读。</li>\n  <li><strong>输出为图片 / 长图</strong>：“文件→输出为图片”，可把每页导出为 PNG/JPG，或拼接成一张长图用于分享。</li>\n  <li><strong>输出为视频</strong>：“文件→输出为视频”，配合排练计时可生成自动播放的讲解视频。</li>\n  <li><strong>打印范围</strong>：“文件→打印”，可指定“全部”“当前幻灯片”，或输入具体编号；<span class=\"highlight\">单张幻灯片之间用英文逗号“,”分隔，连续的幻灯片之间用连字符“-”</span>，如 1,3,5-8。</li>\n  <li><strong>打印内容</strong>：可选幻灯片、<strong>讲义</strong>、备注页、大纲，通常选择“讲义”。选择讲义时可设置每页幻灯片的个数和排放顺序，<span class=\"highlight\">每页幻灯片数最多为 9 张</span>。</li>\n  <li><strong>打印设置</strong>：可选择彩色、灰度或纯黑白打印，并设置是否根据纸张调整大小、是否打印隐藏的幻灯片、是否给幻灯片加框；打印前单击“预览”查看效果。</li>\n  <li><strong>页面设置</strong>：“设计→页面设置”，在“幻灯片大小”下拉列表中选择纸张大小，在“方向”区域为幻灯片选择“横向”或“纵向”。</li>\n</ol>\n\n<div class=\"tip warning\">易错点：<strong>隐藏的幻灯片</strong>是指在放映时不放映、但内容并未被删除的幻灯片，打印时可选择是否输出；备注内容放映时不显示，但可随备注页打印。</div>\n\n<div class=\"tip success\">交付清单：<strong>动画顺序核对 → 切换统一 → 超链接测试 → 排练计时 → 打包或输出 PDF → 讲义打印（每页不超过 9 张）</strong>。</div>\n", "tags": ["WPS演示", "动画", "超链接", "输出"]}]}, {"chapter": "第五章 图像处理软件 Photoshop", "title": "Photoshop 核心知识与操作", "cards": [{"id": "ps0", "title": "Photoshop 核心操作速查总表", "icon": "📋", "html": "\n<p class=\"lead\">Photoshop（简称 PS）是 Adobe 公司推出的<span class=\"highlight\">位图（点阵图）图像处理软件</span>，默认源文件格式为 <span class=\"kbd\">.PSD</span>，是教师招聘“信息技术学科·软件操作”模块的高频考查软件。本卡片把 PS 的全部核心模块——界面、图层、选区、蒙版、通道、调色、滤镜、文字、修饰、输出——压缩成一张速查总表，先建立整体框架，再进入后续各卡片逐项精学。</p>\n\n<div class=\"tip info\">考情提示：Photoshop 部分的客观题主要集中在三处——① “图层”被称为 Photoshop 的<span class=\"highlight\">灵魂</span>；② “羽化”使选区边缘与背景<span class=\"highlight\">自然过渡（柔化融合）</span>；③ “魔棒工具”用于快速选取<span class=\"highlight\">颜色相同或相近的区域</span>。这三点几乎每年必现。</div>\n\n<ol class=\"step-list\">\n  <li><strong>先认界面</strong>：牢记 PS 工作界面由菜单栏、工具选项栏（属性栏）、工具箱、图像窗口、控制面板五大块组成，按 <span class=\"kbd\">Tab</span> 可一次性显示／隐藏工具箱与所有面板。</li>\n  <li><strong>再懂图层</strong>：把图层理解为一张张相互独立的“透明纸”，自上而下俯视叠加后形成最终画面，上层内容会遮挡下层。</li>\n  <li><strong>接着练选区</strong>：选框、套索、魔棒、快速选择、钢笔路径是“抠图”的五条主线路，配合新选区／加选／减选／交叉四种运算。</li>\n  <li><strong>然后玩蒙版与通道</strong>：蒙版可<span class=\"highlight\">反复修改而不破坏原图层像素</span>，通道用于保存颜色与选区信息，是抠头发丝、婚纱、玻璃的利器。</li>\n  <li><strong>最后调色出图</strong>：用色阶／曲线／色相饱和度／色彩平衡校正画面，用滤镜添加特效，再按用途另存为 PSD、JPG、PNG 等格式交付。</li>\n</ol>\n\n<div class=\"sub-h\">一、Photoshop 全模块速查总表</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>软件名称</th><th>核心操作</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Photoshop · 工作界面</td><td>菜单栏 / 工具选项栏 / 工具箱 / 图像窗口 / 控制面板；<span class=\"kbd\">Tab</span> 显隐面板</td><td>工具箱含 40 多种工具，图标右下角有小三角表示存在<strong>隐藏工具组</strong>，右键单击或长按可展开；控制面板浮于活动窗口最上方，通过“窗口”菜单控制显示与隐藏。</td></tr>\n    <tr><td>Photoshop · 文件管理</td><td><span class=\"kbd\">Ctrl+N</span> 新建、<span class=\"kbd\">Ctrl+O</span> 打开、<span class=\"kbd\">Ctrl+S</span> 存储</td><td>新建时需设定宽高、分辨率（印刷 300ppi、屏幕 72ppi）、颜色模式与背景内容；源文件存为 PSD 可保留图层。</td></tr>\n    <tr><td>Photoshop · 图层</td><td>新建 / 复制 / 删除 / 排序 / 合并 / 编组 / 混合模式 / 不透明度</td><td>图层是 PS 的“灵魂”，相当于叠放的透明纸；上层遮挡下层，可单独编辑而不影响其他层。</td></tr>\n    <tr><td>Photoshop · 选区</td><td>选框 <span class=\"kbd\">M</span>、套索 <span class=\"kbd\">L</span>、魔棒 <span class=\"kbd\">W</span>、钢笔 <span class=\"kbd\">P</span></td><td>选区决定“编辑作用在哪里”。选框画规则形状，套索画不规则形状，魔棒按颜色相近度选取，钢笔画精确路径后转为选区。</td></tr>\n    <tr><td>Photoshop · 选区修饰</td><td>羽化 <span class=\"kbd\">Shift+F6</span>、消除锯齿、反选 <span class=\"kbd\">Ctrl+Shift+I</span></td><td>羽化数值范围 0～250 像素，数值越大边缘过渡越柔和；消除锯齿用于去除边缘的锯齿状台阶。</td></tr>\n    <tr><td>Photoshop · 蒙版</td><td>快速蒙版 <span class=\"kbd\">Q</span>、图层蒙版、剪贴蒙版、矢量蒙版</td><td>用黑白灰控制图层区域的显示与隐藏，<strong>黑遮白显灰半透明</strong>；属于非破坏性编辑，去掉蒙版原图即可复原。</td></tr>\n    <tr><td>Photoshop · 通道</td><td>颜色通道 / Alpha 通道 / 专色通道</td><td>存放颜色数据与选区信息。RGB 图像默认有 4 个通道：红、绿、蓝各一个，外加一个复合通道；通道抠图擅长处理发丝与半透明物体。</td></tr>\n    <tr><td>Photoshop · 图像调整</td><td>色阶 <span class=\"kbd\">Ctrl+L</span>、曲线 <span class=\"kbd\">Ctrl+M</span>、色相/饱和度 <span class=\"kbd\">Ctrl+U</span>、色彩平衡 <span class=\"kbd\">Ctrl+B</span></td><td>校正曝光、对比、偏色与饱和度；色彩平衡只作用于复合颜色通道，适合纠正明显偏色。</td></tr>\n    <tr><td>Photoshop · 变换</td><td>自由变换 <span class=\"kbd\">Ctrl+T</span>、变换选区、旋转画布</td><td>自由变换改变对象本身的大小、角度与位置；变换选区只改变蚂蚁线形状，画面内容不变；旋转画布作用于整幅图像。</td></tr>\n    <tr><td>Photoshop · 修饰修复</td><td>污点修复画笔 <span class=\"kbd\">J</span>、修复画笔、修补工具、仿制图章 <span class=\"kbd\">S</span></td><td>去除污点、痘印、杂物与多余元素；修复画笔与仿制图章都需按住 <span class=\"kbd\">Alt</span> 取样，前者会融合周围明暗，后者为原样复制。</td></tr>\n    <tr><td>Photoshop · 擦除填充</td><td>橡皮擦 <span class=\"kbd\">E</span>、背景橡皮擦、魔术橡皮擦、油漆桶 / 渐变 <span class=\"kbd\">G</span></td><td>在背景图层上擦除填充背景色，在普通图层上擦除则变透明；油漆桶单击选区即填充前景色。</td></tr>\n    <tr><td>Photoshop · 滤镜</td><td>风格化 / 模糊 / 扭曲 / 锐化 / 渲染 / 液化 / 消失点等</td><td>对画面进行“艺术过滤”，实现特殊效果；<span class=\"kbd\">Ctrl+F</span> 重复执行上一次滤镜。</td></tr>\n    <tr><td>Photoshop · 文字</td><td>横排 / 直排文字工具 <span class=\"kbd\">T</span>、文字蒙版工具</td><td>文字图层缩览图显示字母“T”，双击可再次编辑；文字蒙版工具输入后生成的是<strong>文字选区</strong>而非文字图层。</td></tr>\n    <tr><td>Photoshop · 形状与路径</td><td>矩形 / 圆角矩形 / 椭圆 / 多边形 / 直线 / 自定形状 <span class=\"kbd\">U</span></td><td>绘制矢量图形，可缩放不失真；多边形工具最少 3 条边、最多 100 条边，可绘制星形。</td></tr>\n    <tr><td>Photoshop · 图层样式</td><td>投影 / 内阴影 / 外发光 / 斜面和浮雕 / 描边 / 渐变叠加</td><td>为图层添加特效，加过样式的图层名后带 <em>fx</em> 标记，可随时修改、隐藏或删除。</td></tr>\n    <tr><td>Photoshop · 保存输出</td><td>PSD / JPG / PNG / GIF / TIFF；<span class=\"kbd\">Ctrl+Shift+S</span> 存储为</td><td>PSD 保留图层便于二次编辑；JPG 有损压缩、体积小、不支持透明；PNG 无损、支持透明；GIF 支持简单动画。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、必背高频考点九宫格</div>\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">灵魂 = 图层</div><div class=\"d\">“图层”被誉为 Photoshop 的灵魂，如同叠放的透明玻璃。</div></div>\n  <div class=\"cell\"><div class=\"t\">羽化 = 自然过渡</div><div class=\"d\">使图像边缘与背景柔和融合，取值 0～250 像素。</div></div>\n  <div class=\"cell\"><div class=\"t\">魔棒 = 选相近色</div><div class=\"d\">快速选取颜色相同或相近的连续区域，靠容差控制范围。</div></div>\n  <div class=\"cell\"><div class=\"t\">磁性套索 = 高反差</div><div class=\"d\">适合主体与背景色差大的图像，自动吸附边缘。</div></div>\n  <div class=\"cell\"><div class=\"t\">仿制图章 = 复制取样</div><div class=\"d\">按住 Alt 取样，再涂抹复制像素到目标位置。</div></div>\n  <div class=\"cell\"><div class=\"t\">通道 = 抠发丝</div><div class=\"d\">抠取纤细头发、透明婚纱与玻璃杯的最强工具。</div></div>\n  <div class=\"cell\"><div class=\"t\">蒙版 = 可逆遮盖</div><div class=\"d\">反复修改不破坏原像素，去掉蒙版原图重现。</div></div>\n  <div class=\"cell\"><div class=\"t\">栅格化 = 矢量转位图</div><div class=\"d\">文字、形状栅格化后才能使用大部分滤镜。</div></div>\n  <div class=\"cell\"><div class=\"t\">PSD = 源文件</div><div class=\"d\">唯一完整保留图层、蒙版、通道、路径的格式。</div></div>\n</div>\n\n<div class=\"sub-h\">三、最常考的快捷键速记</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>快捷键</th><th>功能</th><th>易混提醒</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><span class=\"kbd\">Ctrl+N</span></td><td>新建文件，弹出“新建”对话框</td><td>与 <span class=\"kbd\">Ctrl+Alt+Shift+N</span> 区分：后者是新建图层且<strong>不弹出</strong>对话框。</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+Z</span></td><td>还原／重做上一步操作</td><td><span class=\"kbd\">Ctrl+Alt+Z</span> 为一步一步向前还原（后退多步）。</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+T</span></td><td>自由变换</td><td>加 <span class=\"kbd\">Shift</span> 等比缩放，加 <span class=\"kbd\">Ctrl</span> 可自由扭曲角点。</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+D</span></td><td>取消选择（取消蚂蚁线）</td><td><span class=\"kbd\">Ctrl+Shift+D</span> 为重新选择，<span class=\"kbd\">Ctrl+A</span> 为全选。</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+J</span></td><td>通过拷贝新建图层（复制图层）</td><td>有选区时只复制选区内容，无选区时复制整个图层。</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+E</span></td><td>向下合并图层</td><td><span class=\"kbd\">Ctrl+Shift+E</span> 合并可见图层。</td></tr>\n    <tr><td><span class=\"kbd\">Ctrl+Shift+I</span></td><td>反向选择</td><td>常用于“先选背景再反选主体”的抠图思路。</td></tr>\n    <tr><td><span class=\"kbd\">Tab</span></td><td>显示／隐藏工具箱与所有控制面板</td><td><span class=\"kbd\">Shift+Tab</span> 只隐藏控制面板，保留工具箱。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip success\">学习建议：Photoshop 是操作类知识，纯背记容易混淆。建议按“界面 → 图层 → 选区 → 蒙版 → 调色 → 滤镜 → 文字 → 输出”的顺序，边开软件边对照本知识库操作一遍，形成肌肉记忆后再做真题。</div>\n", "tags": ["Photoshop", "速查", "必考"]}, {"id": "ps1", "title": "界面、图层与选区", "icon": "🎨", "html": "\n<p class=\"lead\">这是 Photoshop 的“地基三件套”：<span class=\"highlight\">界面决定你手上有什么工具，图层决定内容怎么组织，选区决定操作作用在哪里</span>。考试中关于窗口组成、图层面板元素、选框／套索／魔棒的辨析题，几乎全部落在本卡片范围内。</p>\n\n<div class=\"sub-h\">一、Photoshop 工作界面组成</div>\n<p>启动 Photoshop 并打开一幅图像后，界面自上而下、自左而右可分为五个功能区。</p>\n\n<div class=\"feature-grid\">\n  <div class=\"cell\"><div class=\"t\">菜单栏</div><div class=\"d\">文件、编辑、图像、图层、选择、滤镜、视图、窗口、帮助等，几乎所有命令的总入口。</div></div>\n  <div class=\"cell\"><div class=\"t\">工具选项栏</div><div class=\"d\">位于菜单栏下方，随所选工具动态变化，用来设置该工具的参数（如羽化、容差、样式）。</div></div>\n  <div class=\"cell\"><div class=\"t\">工具箱</div><div class=\"d\">默认在窗口左侧，包含 40 多种工具，单击图标或按工具快捷键即可选用。</div></div>\n  <div class=\"cell\"><div class=\"t\">图像窗口</div><div class=\"d\">显示、编辑和处理图像的主区域，可改变窗口大小、缩放视图、切换多个文档标签。</div></div>\n  <div class=\"cell\"><div class=\"t\">控制面板</div><div class=\"d\">图层、通道、路径、历史记录、字符等浮动面板，通过“窗口”菜单控制显示与隐藏。</div></div>\n  <div class=\"cell\"><div class=\"t\">状态栏</div><div class=\"d\">图像窗口底部，显示缩放比例、文档大小、当前工具的操作提示等信息。</div></div>\n</div>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>展开隐藏工具组</td><td>观察工具图标<strong>右下角的小三角</strong> → 在该工具上单击鼠标右键（或按住鼠标左键不放）→ 在弹出菜单中选择所需工具</td><td>工具箱中许多工具是成组存放的。例如矩形选框工具组内还隐藏着椭圆选框、单行选框、单列选框工具。</td></tr>\n    <tr><td>用快捷键切换工具</td><td>直接按字母键；同一组内循环切换按 <span class=\"kbd\">Shift</span>+对应字母</td><td>常用：<span class=\"kbd\">M</span> 选框、<span class=\"kbd\">L</span> 套索、<span class=\"kbd\">W</span> 魔棒／快速选择、<span class=\"kbd\">C</span> 裁剪、<span class=\"kbd\">V</span> 移动、<span class=\"kbd\">E</span> 橡皮擦、<span class=\"kbd\">S</span> 仿制图章、<span class=\"kbd\">T</span> 文字、<span class=\"kbd\">P</span> 钢笔、<span class=\"kbd\">U</span> 形状。</td></tr>\n    <tr><td>显示／隐藏面板</td><td>按 <span class=\"kbd\">Tab</span> 键；或按 <span class=\"kbd\">Shift+Tab</span></td><td><span class=\"kbd\">Tab</span> 同时显隐工具箱和所有控制面板，便于全屏观察画面；<span class=\"kbd\">Shift+Tab</span> 只隐藏控制面板。</td></tr>\n    <tr><td>调出丢失的面板</td><td>单击菜单“窗口”→ 勾选需要的面板名称（如“图层”“通道”“历史记录”）</td><td>面板被误关闭时用此法找回；<span class=\"kbd\">F7</span> 可快速切换“图层”面板。</td></tr>\n    <tr><td>缩放与平移画布</td><td><span class=\"kbd\">Ctrl+加号</span> 放大、<span class=\"kbd\">Ctrl+减号</span> 缩小、<span class=\"kbd\">Ctrl+0</span> 满画布显示；按住 <span class=\"kbd\">空格</span> 临时切换抓手工具拖动画面</td><td>缩放只改变查看比例，<strong>不改变图像的实际像素尺寸</strong>，这一点常作为判断题考点。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、图层：Photoshop 的“灵魂”</div>\n<p>图层可以理解为一张一张相互独立的<span class=\"highlight\">透明纸</span>。在每一张纸的相应位置画上图像的一部分，把所有纸叠放在一起，自上而下俯视，就合成了一幅完整的画面。在上一层涂画不会影响下一层，但上一层的内容会遮挡住下一层；如果纸上什么都没有，那就是一个完全透明的空图层。</p>\n\n<div class=\"tip warning\">高频考点：题干问“Photoshop 中被誉为‘灵魂’的是什么”，答案是<span class=\"highlight\">图层</span>；题干问“图像的某部分忽然不见了，可能是什么原因”，常见答案是该图层<strong>被上层内容遮挡</strong>或<strong>被蒙版遮盖</strong>，若图层前的眼睛图标消失则是<strong>被隐藏</strong>。</div>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>认识“图层”面板</td><td>窗口 → 图层（<span class=\"kbd\">F7</span>）</td><td>面板自上而下依次为：图层混合模式、不透明度、锁定按钮组、填充、图层缩览图与名称、眼睛图标，底部是一排图层功能按钮。</td></tr>\n    <tr><td>新建图层</td><td>① 单击面板底部“创建新图层”按钮；② 图层 → 新建 → 图层；③ 快捷键 <span class=\"kbd\">Ctrl+Alt+Shift+N</span></td><td>方法③<strong>直接新建、不弹出对话框</strong>；<span class=\"kbd\">Ctrl+Shift+N</span> 则会弹出命名对话框。新图层默认名为“图层 1”“图层 2”，依次类推。</td></tr>\n    <tr><td>复制图层</td><td>在“图层”面板中按住待复制的图层拖到“创建新图层”按钮上；或按 <span class=\"kbd\">Ctrl+J</span></td><td>生成“××副本”。有选区时 <span class=\"kbd\">Ctrl+J</span> 只把选区内容复制到新图层，这是抠图后的常用一步。</td></tr>\n    <tr><td>删除图层</td><td>选中目标图层 → 单击面板底部“删除图层”（垃圾桶）按钮 → 确认；或直接按 <span class=\"kbd\">Delete</span></td><td>删除多余图层可减小文件体积。删除前应确认该图层不再需要。</td></tr>\n    <tr><td>调整图层顺序</td><td>在面板中用鼠标上下拖动图层；或 <span class=\"kbd\">Ctrl+]</span> 上移一层、<span class=\"kbd\">Ctrl+[</span> 下移一层</td><td><strong>上面的图层遮挡下面的图层</strong>。利用顺序调整可制作“螺旋穿过人物”等前后穿插的特殊效果。</td></tr>\n    <tr><td>合并图层</td><td>向下合并 <span class=\"kbd\">Ctrl+E</span>；合并可见图层 <span class=\"kbd\">Ctrl+Shift+E</span>；拼合图像用“图层 → 拼合图像”</td><td>合并后图层不可再单独编辑，属于破坏性操作，建议合并前先保存一份 PSD 备份。</td></tr>\n    <tr><td>图层编组</td><td>选中多个图层（按 <span class=\"kbd\">Ctrl</span> 加选或 <span class=\"kbd\">Shift</span> 连选）→ 按 <span class=\"kbd\">Ctrl+G</span></td><td>把相关图层收进文件夹，便于管理复杂文件，编组不会破坏图层内容。</td></tr>\n    <tr><td>移动图层内容</td><td>选中图层 → 选择“移动工具”<span class=\"kbd\">V</span> → 在画布中拖动</td><td>若先建立了选区，则只移动选区内的图像；若无选区，则移动整个当前图层的图像。</td></tr>\n    <tr><td>栅格化图层</td><td>右键单击文字／形状／智能对象图层 → 选择“栅格化图层”（或“栅格化文字”）</td><td>把矢量内容转换为位图像素，之后才能使用大多数滤镜和画笔类工具，但<strong>转换后文字不能再修改字符内容</strong>。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">三、“图层”面板各元素功能</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>图层混合模式</td><td>在面板左上角下拉列表中选择，如正片叠底、滤色、叠加、柔光</td><td>设置当前图层与其下方图层叠合时的效果，默认为“正常”。正片叠底压暗、滤色提亮、叠加增强对比，是合成与调色的核心手段。</td></tr>\n    <tr><td>不透明度</td><td>拖动“不透明度”滑块或直接输入 0～100 的数值</td><td>控制整个图层（含图层样式）的透明程度，<strong>数值越大越不透明</strong>，默认为 100%。</td></tr>\n    <tr><td>填充</td><td>拖动“填充”滑块</td><td>只控制图层内部像素的不透明度，<strong>不影响已添加的图层样式</strong>（如描边、投影仍然可见），这是它与“不透明度”的关键区别。</td></tr>\n    <tr><td>锁定</td><td>单击面板上的四个锁定按钮之一</td><td>包括锁定透明像素、锁定图像像素、锁定位置、锁定全部四种方式，用来避免对特定图层的误操作。</td></tr>\n    <tr><td>眼睛图标</td><td>单击图层缩览图左侧的眼睛符号</td><td>切换图层的显示／隐藏。眼睛消失表示该图层被隐藏，画面上看不到其内容，但图层依然存在。</td></tr>\n    <tr><td>fx 图层样式标记</td><td>双击图层空白处打开“图层样式”对话框</td><td>图层名后出现 <em>fx</em> 图标，说明该图层添加了投影、发光、浮雕等样式，可随时修改或删除。</td></tr>\n    <tr><td>文字图层标志</td><td>观察缩览图是否显示字母“T”，双击“T”进入编辑</td><td>带“T”标志即为文字图层，可继续修改文字内容、字体和大小。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、选区：让编辑“只作用在指定范围”</div>\n<p>选区用流动的“蚂蚁线”标示，建立选区后，填充、调色、滤镜、删除等操作都<span class=\"highlight\">只影响选区内部</span>。常用的建立选区工具分为三大类。</p>\n\n<ol class=\"step-list\">\n  <li><strong>选框工具组（规则选区）</strong>：矩形选框绘制矩形或正方形选区；椭圆选框绘制椭圆或正圆选区；单行选框绘制高为 1 像素的选区；单列选框绘制宽为 1 像素的选区。按住 <span class=\"kbd\">Shift</span> 可强制画出正方形／正圆，按住 <span class=\"kbd\">Alt</span> 则以起点为中心向外绘制。</li>\n  <li><strong>套索工具组（不规则选区）</strong>：套索工具徒手自由勾画，若终点没有回到起点，Photoshop 会自动用直线连接起点和终点形成封闭选区；多边形套索工具通过连续单击确定各个转折点，适合选取多边形物体；磁性套索工具沿物体边缘移动即可自动吸附，方便、快速、准确。</li>\n  <li><strong>魔棒工具（按颜色选区）</strong>：以图像中相近的色素建立选区，用于选择颜色相同或相近的区域，是选取纯色背景最快的方法。</li>\n  <li><strong>选区运算</strong>：工具选项栏左侧四个按钮依次为新选区、添加到选区、从选区减去、与选区交叉，分别对应“重新选”“加选”“减选”“取重叠部分”。</li>\n  <li><strong>取消与反选</strong>：<span class=\"kbd\">Ctrl+D</span> 取消选择，<span class=\"kbd\">Ctrl+Shift+I</span> 反向选择，<span class=\"kbd\">Ctrl+A</span> 全选整幅画布。</li>\n</ol>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>添加到选区</td><td>已有选区后按住 <span class=\"kbd\">Shift</span> 再拖动；或单击选项栏第二个按钮</td><td>在原有区域上增加新的选择区域，用于把分散的多块区域一次性选中。</td></tr>\n    <tr><td>从选区减去</td><td>已有选区后按住 <span class=\"kbd\">Alt</span> 再拖动；或单击选项栏第三个按钮</td><td>从原有选区中减去新框选的重叠部分，用于修掉多选的边角。</td></tr>\n    <tr><td>与选区交叉</td><td>已有选区后按住 <span class=\"kbd\">Shift+Alt</span> 再拖动；或单击选项栏第四个按钮</td><td>只保留新区域与原有区域相交的部分。</td></tr>\n    <tr><td>设置羽化（选前）</td><td>选择选框／套索工具 → 在<strong>工具选项栏</strong>的“羽化”框中输入数值 → 再绘制选区</td><td>属于“先设置后选取”，之后画出的每个选区都自动带羽化。</td></tr>\n    <tr><td>设置羽化（选后）</td><td>先建立选区 → 单击菜单“选择 → 修改 → 羽化”（<span class=\"kbd\">Shift+F6</span>）→ 输入羽化半径 → 确定</td><td>属于“先选取后设置”，只对当前选区生效。羽化使边界产生过渡，有效范围 0～250 像素，<strong>数值越大柔和效果越明显</strong>。</td></tr>\n    <tr><td>魔棒“容差”</td><td>选择魔棒 → 在选项栏“容差”框输入 0～255 的数值 → 单击画面取色</td><td>控制选定颜色的范围，<strong>数值越大可选的颜色区域越广</strong>；数值过大易把主体一起选中。</td></tr>\n    <tr><td>魔棒“连续”</td><td>勾选或取消选项栏中的“连续”复选框</td><td>勾选时只选中单击处邻近区域中的相同像素；取消勾选时，选中整幅图中所有符合像素要求的区域。</td></tr>\n    <tr><td>魔棒“对所有图层取样”</td><td>勾选选项栏中的“对所有图层取样”</td><td>决定是否把所有图层中颜色相似范围内的颜色一并选入选区，不勾选时只对当前图层生效。</td></tr>\n    <tr><td>磁性套索参数</td><td>在选项栏中设置宽度、对比度、频率</td><td>宽度设置检测范围，以指针所在点为标准在范围内查找反差最大的边缘；边对比度数值越大要求反差越大、选取越精确；频率设置节点数（0～100），数值越大标记的节点越多。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"tip info\">易错辨析：<strong>魔棒</strong>适合背景颜色单一、与主体色差明显的图；<strong>磁性套索</strong>适合颜色与颜色差别比较大、边缘清晰的图；<strong>钢笔工具</strong>适合边缘光滑规整的工业品；<strong>通道／蒙版</strong>才是抠头发丝和半透明物体的正解。</div>\n", "tags": ["Photoshop", "界面", "图层", "选区", "必考"]}, {"id": "ps2", "title": "图像编辑与快捷键", "icon": "⌨️", "html": "\n<p class=\"lead\">本卡片解决“把图改成想要的样子”的通用手段：<span class=\"highlight\">旋转与翻转、自由变换与变换选区、裁剪与画布调整、擦除与填充、历史记录后悔药</span>，并附上一份考试与实战通用的快捷键总表。真题里“水平翻转并羽化处理”“自由变换 Ctrl+T”“Ctrl+Alt+Z 一步步向前还原”都出自这里。</p>\n\n<div class=\"sub-h\">一、旋转、翻转与变换</div>\n<p>要分清三组容易混淆的命令：<strong>旋转画布</strong>作用于整幅图像，<strong>变换／自由变换</strong>作用于当前图层或选区内的图像，<strong>变换选区</strong>只改变蚂蚁线本身而画面内容不动。</p>\n\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>旋转画布</td><td>单击菜单“图像 → 旋转画布（图像旋转）”→ 选择 180 度、顺时针 90 度、逆时针 90 度、任意角度、水平翻转画布、垂直翻转画布</td><td>对<strong>整个图像内容</strong>连同画布一起旋转或翻转，所有图层同时改变，常用于纠正拍歪的照片。</td></tr>\n    <tr><td>局部图像变换</td><td>先选中图层或建立选区 → 单击菜单“编辑 → 变换”→ 选择缩放、旋转、斜切、扭曲、透视、变形、水平翻转、垂直翻转</td><td>只对当前图层或选区内的局部图像生效，其余部分不受影响。制作镜像倒影就靠“垂直翻转”。</td></tr>\n    <tr><td>自由变换</td><td>按 <span class=\"kbd\">Ctrl+T</span> 调出变换框 → 拖动控制点 → 按 <span class=\"kbd\">Enter</span> 确认、按 <span class=\"kbd\">Esc</span> 取消</td><td>若不指定选区则变换当前图层。变换框上有 8 个小方块（控制点）：鼠标在方块上拖动可改变大小；移到方块外侧变为弯曲双箭头，可任意旋转；在框内拖动可移动位置。</td></tr>\n    <tr><td>自由变换的修饰键</td><td>拖角点时配合 <span class=\"kbd\">Shift</span> 等比缩放、<span class=\"kbd\">Alt</span> 以中心缩放、<span class=\"kbd\">Ctrl</span> 自由扭曲、<span class=\"kbd\">Ctrl+Shift</span> 斜切</td><td>缩放位图时会损失像素质量，放大过多会模糊，因此应尽量“由大改小”。</td></tr>\n    <tr><td>变换选区</td><td>用魔棒等工具建立选区 → 单击菜单“选择 → 变换选区”→ 拖动节点 → 回车确认</td><td>与自由变换的区别在于：拖动节点时<strong>只有选区的蚂蚁线在变，图像形状并不变化</strong>，用于微调选区大小与角度。</td></tr>\n    <tr><td>内容识别缩放</td><td>菜单“编辑 → 内容识别缩放”→ 拖动边框</td><td>拉伸画面时智能保护人物等主体不变形，只压缩背景。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">二、裁剪、图像大小与画布大小</div>\n<ol class=\"step-list\">\n  <li><strong>裁剪工具</strong> <span class=\"kbd\">C</span>：在图像上拖出裁剪框，可拖动边角调整大小、在框外拖动旋转角度，按 <span class=\"kbd\">Enter</span> 确认，裁掉框外多余部分，保留需要的构图。</li>\n  <li><strong>按选区裁剪</strong>：先用矩形选框拉出范围 → 菜单“图像 → 裁剪”，按选区外接矩形裁切。</li>\n  <li><strong>图像大小</strong>（<span class=\"kbd\">Ctrl+Alt+I</span>）：修改图像的像素尺寸、打印尺寸与分辨率。勾选“约束比例（链条图标）”可防止画面拉伸变形；网页用图分辨率一般设为 72 像素/英寸，印刷用图设为 300 像素/英寸。</li>\n  <li><strong>画布大小</strong>（<span class=\"kbd\">Ctrl+Alt+C</span>）：只改变画布的范围而不缩放图像本身，配合“定位”九宫格可在指定方向增加空白区域，常用于给照片加白边。</li>\n  <li><strong>标尺、参考线与对齐</strong>：<span class=\"kbd\">Ctrl+R</span> 显示标尺，从标尺处向画面内拖动即可拉出参考线，<span class=\"kbd\">Ctrl+;</span> 显示或隐藏参考线，用于精确构图与排版对齐。</li>\n</ol>\n\n<div class=\"sub-h\">三、擦除、填充与恢复</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>橡皮擦工具</td><td>选择橡皮擦 <span class=\"kbd\">E</span> → 设置画笔大小与硬度 → 在需要擦除处按住鼠标来回拖动</td><td>用于擦除图像颜色。在<strong>背景图层</strong>上擦除，被擦部分用<strong>背景色</strong>填充；在普通图层上擦除，被擦区域<strong>变为透明</strong>。</td></tr>\n    <tr><td>背景橡皮擦工具</td><td>选择背景橡皮擦 → 设置画笔、限制、容差、保护前景色 → 沿边缘涂抹</td><td>擦除后不填充背景色而是直接变透明。“限制”中：不连续可擦除图像中任意位置的相近颜色；连续只擦除取样点及与其邻近的颜色；查找边缘擦除时会保护物体边缘细节。勾选“保护前景色”后，与前景色相同的颜色不会被擦除。</td></tr>\n    <tr><td>魔术橡皮擦工具</td><td>选择魔术橡皮擦 → 设置容差 → 在纯色背景上单击一次</td><td>一次性擦除一定容差范围内的相邻颜色，擦除后不填充背景色而变成透明图层，是“一键去纯色背景”的快捷方式。</td></tr>\n    <tr><td>油漆桶工具</td><td>设置前景色 → 建立选区 → 选择“油漆桶”工具 <span class=\"kbd\">G</span> → 在选区内单击</td><td>自动以前景色填充单击处容差范围内的区域，也可切换为“图案”填充。</td></tr>\n    <tr><td>快捷填充</td><td><span class=\"kbd\">Alt+Delete</span> 填充前景色；<span class=\"kbd\">Ctrl+Delete</span> 填充背景色；<span class=\"kbd\">Shift+F5</span> 打开“填充”对话框</td><td>按 <span class=\"kbd\">D</span> 恢复默认的黑前景／白背景，按 <span class=\"kbd\">X</span> 前后景色互换，是画蒙版时的高频操作。</td></tr>\n    <tr><td>渐变工具</td><td>选择渐变工具 <span class=\"kbd\">G</span> → 在选项栏选择渐变样式（线性／径向／角度／对称／菱形）→ 在画面中按住鼠标拖出一条直线</td><td>拖动的起点和终点决定渐变的方向与过渡长度，常用于制作背景和图层蒙版的柔和过渡。</td></tr>\n    <tr><td>历史记录面板</td><td>窗口 → 历史记录 → 单击任意一步即可回到该状态</td><td>相当于可视化的“时光机”，默认保存最近若干步操作；关闭文件后历史记录即清空。</td></tr>\n    <tr><td>还原与重做</td><td><span class=\"kbd\">Ctrl+Z</span>、<span class=\"kbd\">Ctrl+Alt+Z</span>、<span class=\"kbd\">Ctrl+Shift+Z</span></td><td><span class=\"kbd\">Ctrl+Z</span> 还原／重做上一步；<span class=\"kbd\">Ctrl+Alt+Z</span> <strong>一步一步向前还原</strong>（后退多步）；<span class=\"kbd\">Ctrl+Shift+Z</span> 一步步向后重做。</td></tr>\n  </tbody>\n</table>\n\n<div class=\"sub-h\">四、Photoshop 快捷键总表</div>\n<table class=\"knowledge-table\">\n  <thead>\n    <tr><th>操作项</th><th>操作步骤</th><th>功能说明</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>文件操作</td><td><span class=\"kbd\">Ctrl+N</span> / <span class=\"kbd\">Ctrl+O</span> / <span class=\"kbd\">Ctrl+S</span> / <span class=\"kbd\">Ctrl+Shift+S</span> / <span class=\"kbd\">Ctrl+W</span></td><td>依次为新建、打开、存储、存储为、关闭。其中 <span class=\"kbd\">Ctrl+N</span> 会弹出“新建”对话框，是真题原题考点。</td></tr>\n    <tr><td>还原恢复</td><td><span class=\"kbd\">Ctrl+Z</span> / <span class=\"kbd\">Ctrl+Alt+Z</span> / <span class=\"kbd\">F12</span></td><td>还原一步、连续向前还原多步、恢复到最后一次保存的状态。</td></tr>\n    <tr><td>选区操作</td><td><span class=\"kbd\">Ctrl+A</span> / <span class=\"kbd\">Ctrl+D</span> / <span class=\"kbd\">Ctrl+Shift+D</span> / <span class=\"kbd\">Ctrl+Shift+I</span> / <span class=\"kbd\">Shift+F6</span></td><td>全选、取消选择、重新选择、反向选择、羽化选区。</td></tr>\n    <tr><td>复制粘贴</td><td><span class=\"kbd\">Ctrl+C</span> / <span class=\"kbd\">Ctrl+V</span> / <span class=\"kbd\">Ctrl+Shift+V</span> / <span class=\"kbd\">Ctrl+J</span></td><td>拷贝、粘贴、贴入（粘贴到选区内并自动生成蒙版）、通过拷贝新建图层。</td></tr>\n    <tr><td>图层操作</td><td><span class=\"kbd\">Ctrl+Alt+Shift+N</span> / <span class=\"kbd\">Ctrl+E</span> / <span class=\"kbd\">Ctrl+Shift+E</span> / <span class=\"kbd\">Ctrl+G</span> / <span class=\"kbd\">Ctrl+Alt+G</span></td><td>新建图层（不弹对话框）、向下合并、合并可见图层、图层编组、创建剪贴蒙版。</td></tr>\n    <tr><td>变换操作</td><td><span class=\"kbd\">Ctrl+T</span> / <span class=\"kbd\
